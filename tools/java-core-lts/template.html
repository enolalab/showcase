<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1120">
<title>Java Core LTS - Ôn Luyện Kiến Thức</title>
<meta name="description" content="Ôn luyện Java Core qua 4 phiên bản LTS (8, 11, 17, 21) với hướng dẫn chuyên sâu và bài tập trắc nghiệm cấp độ phỏng vấn.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B1120; --panel:#131C2E; --panel2:#1A2438; --line:#27354F;
  --paper:#E6EDF7; --muted:#8296B8; --dim:#5E739A;
  --amber:#F5A623; --ember:#E2564A; --mint:#3FD08E; --azure:#4C9EEB; --violet:#9B7BE8;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --sans:'IBM Plex Sans',system-ui,sans-serif;
  --disp:'Space Grotesk',var(--sans);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--ink); color:var(--paper); font-family:var(--sans);
  font-size:clamp(14px,2.5vw,16px); line-height:1.65; -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(ellipse 80% 50% at 50% -10%, rgba(76,158,235,.10), transparent 70%);
  background-attachment:fixed; min-height:100%;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
code{font-family:var(--mono);font-size:.87em;background:rgba(76,158,235,.13);
  color:#A9CDF3;padding:.1em .38em;border-radius:4px;border:1px solid rgba(76,158,235,.16)}
b{font-weight:600;color:#fff}
i{color:var(--muted)}

.wrap{max-width:900px;margin:0 auto;padding:0 clamp(12px,3vw,20px) calc(clamp(40px,8vw,64px) + env(safe-area-inset-bottom))}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:50;background:rgba(11,17,32,.9);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line);margin-bottom:20px}
.bar-in{max-width:900px;margin:0 auto;padding:calc(11px + env(safe-area-inset-top)) clamp(12px,3vw,20px) 11px;
  display:flex;align-items:center;gap:10px}
.brand{font-family:var(--disp);font-weight:700;font-size:clamp(13px,2.5vw,15px);letter-spacing:-.01em;white-space:nowrap}
.brand span{color:var(--azure)}
.bar-sp{flex:1}
.counter{font-family:var(--mono);font-size:clamp(10px,2vw,12px);color:var(--muted);white-space:nowrap}
.counter b{color:var(--paper)}
.counter .acc{color:var(--mint)}
.track{height:2px;background:var(--line);position:relative;overflow:hidden}
.track i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--azure),var(--mint));
  width:0;transition:width .45s cubic-bezier(.4,0,.2,1)}

/* ---------- hero ---------- */
.hero{padding:clamp(26px,5vw,48px) 0 clamp(18px,3vw,30px);border-bottom:1px solid var(--line);margin-bottom:20px}
.eyebrow{font-family:var(--mono);font-size:clamp(9px,2vw,11px);letter-spacing:.16em;text-transform:uppercase;
  color:var(--azure);margin-bottom:12px}
h1{font-family:var(--disp);font-size:clamp(24px,5vw,44px);line-height:1.08;
  font-weight:700;letter-spacing:-.028em;margin-bottom:12px}
h1 em{font-style:normal;color:var(--azure)}
.lede{color:var(--muted);max-width:60ch;font-size:clamp(13px,2.5vw,16.5px)}
.lede b{color:var(--paper);font-weight:600}

.sec{margin-bottom:22px}
.sec-h{font-family:var(--mono);font-size:clamp(9px,2vw,11px);letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);margin-bottom:11px;display:flex;align-items:center;gap:10px}
.sec-h:after{content:'';flex:1;height:1px;background:var(--line)}

.chips{display:flex;flex-wrap:wrap;gap:clamp(6px,2vw,8px)}
.chip{padding:clamp(6px,1.5vw,8px) clamp(11px,2vw,14px);border:1px solid var(--line);border-radius:999px;
  font-size:clamp(12px,2vw,13.5px);color:var(--muted);transition:.15s;background:var(--panel);
  cursor:pointer;min-height:38px;display:inline-flex;align-items:center;-webkit-tap-highlight-color:transparent}
.chip:hover{border-color:var(--dim);color:var(--paper)}
.chip.on{background:rgba(76,158,235,.11);border-color:var(--azure);color:var(--azure)}
.chip .n{font-family:var(--mono);font-size:clamp(9px,1.5vw,11px);opacity:.65;margin-left:5px}

.tabs{display:flex;gap:clamp(6px,2vw,8px);margin-bottom:18px;border-bottom:1px solid var(--line);
  padding-bottom:12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{padding:clamp(6px,1.5vw,8px) clamp(12px,2.5vw,16px);border:1px solid var(--line);border-radius:6px;
  background:var(--panel);color:var(--muted);transition:.15s;cursor:pointer;font-family:var(--disp);
  font-weight:600;font-size:clamp(12px,2vw,14px);white-space:nowrap;min-height:44px;display:flex;align-items:center}
.tab:active{background:var(--panel2)}
.tab:hover{border-color:var(--dim);color:var(--paper)}
.tab.active{border-color:var(--azure);background:rgba(76,158,235,.07);color:var(--azure)}

/* ---------- layout ---------- */
.sidebar{display:grid;grid-template-columns:1fr;gap:clamp(16px,3vw,26px)}
@media(min-width:860px){ .sidebar{grid-template-columns:212px 1fr} }

.sidebar-menu{display:flex;flex-direction:column;gap:14px;height:fit-content;min-width:0}
.menu-group{display:flex;flex-direction:column;gap:8px;min-width:0}
.menu-label{font-family:var(--mono);font-size:clamp(10px,1.8vw,11px);letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim);font-weight:600}
.menu-row{display:flex;flex-direction:row;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  padding-bottom:4px;scrollbar-width:thin}
.menu-row::-webkit-scrollbar{height:5px}
.menu-row::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.menu-item{padding:clamp(8px,1.5vw,10px) clamp(11px,2vw,13px);border-radius:6px;font-size:clamp(12px,2vw,13px);
  color:var(--muted);cursor:pointer;transition:.15s;border:1px solid var(--line);min-height:42px;
  display:flex;align-items:center;gap:7px;white-space:nowrap;flex:0 0 auto;-webkit-tap-highlight-color:transparent}
.menu-item:active{background:var(--panel2)}
.menu-item:hover{color:var(--paper);border-color:var(--dim)}
.menu-item.active{background:rgba(76,158,235,.07);border-color:var(--azure);color:var(--azure)}
.menu-item .cnt{font-family:var(--mono);font-size:10px;opacity:.6;margin-left:auto;padding-left:4px}
.menu-item.done{border-color:rgba(63,208,142,.35)}
.menu-item.done .cnt{color:var(--mint);opacity:.9}
@media(min-width:860px){
  .sidebar-menu{position:sticky;top:92px;max-height:calc(100vh - 110px);overflow-y:auto;padding-right:4px}
  .menu-row{flex-direction:column;overflow-x:visible;padding-bottom:0}
  .menu-item{white-space:normal;flex:none;border-color:transparent}
  .menu-item:hover{border-color:var(--line)}
}
.content{min-width:0}

/* ---------- tags ---------- */
.tag{padding:3px 8px;border-radius:4px;border:1px solid var(--line);
  color:var(--muted);font-size:clamp(9px,1.5vw,10.5px);display:inline-block;font-family:var(--mono);
  letter-spacing:.02em;white-space:nowrap}
.tag.beginner{color:var(--mint);border-color:rgba(63,208,142,.4);background:rgba(63,208,142,.09)}
.tag.intermediate{color:var(--amber);border-color:rgba(245,166,35,.35);background:rgba(245,166,35,.08)}
.tag.advanced{color:var(--ember);border-color:rgba(226,86,74,.4);background:rgba(226,86,74,.09)}
.tag.v8{color:var(--azure);border-color:rgba(76,158,235,.4);background:rgba(76,158,235,.09)}
.tag.v11{color:var(--mint);border-color:rgba(63,208,142,.4);background:rgba(63,208,142,.09)}
.tag.v17{color:var(--violet);border-color:rgba(155,123,232,.4);background:rgba(155,123,232,.1)}
.tag.v21{color:var(--amber);border-color:rgba(245,166,35,.35);background:rgba(245,166,35,.08)}
.tagrow{display:flex;gap:5px;align-items:center;margin-bottom:10px;flex-wrap:wrap}

/* ---------- code ---------- */
.code{border:1px solid var(--line);border-radius:8px;background:#0D1526;overflow:hidden;margin:14px 0}
.code-h{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);padding:8px 13px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.015)}
.code pre{margin:0;padding:13px;overflow-x:auto;-webkit-overflow-scrolling:touch;font-family:var(--mono);
  font-size:clamp(11px,1.75vw,12.5px);line-height:1.62}
.code pre::-webkit-scrollbar{height:6px}
.code pre::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.code code{background:none;border:none;padding:0;color:var(--paper);font-size:inherit}
.k{color:#C792EA} .s{color:#C3E88D} .cm{color:#5E739A;font-style:italic}
.an{color:#F5A623} .ty{color:#82D8F5} .nu{color:#F78C6C} .fn{color:#82AAFF}

/* ---------- tutorial ---------- */
h2{font-family:var(--disp);font-size:clamp(19px,4vw,26px);margin-bottom:8px;font-weight:700;letter-spacing:-.02em}
h3{font-family:var(--disp);font-size:clamp(15px,3vw,19px);margin-bottom:6px;font-weight:700;letter-spacing:-.015em;line-height:1.28}
.topic-head{margin-bottom:20px}
.topic-head .lede{font-size:clamp(13px,2.2vw,15px)}

.card{margin-bottom:18px;padding:clamp(14px,2.4vw,22px);border:1px solid var(--line);border-radius:9px;background:var(--panel)}
.tut-sum{color:var(--muted);font-style:italic;font-size:clamp(12.5px,2vw,14px);margin-bottom:14px;
  padding-bottom:12px;border-bottom:1px solid var(--line)}
.prose p{margin-bottom:12px;font-size:clamp(13px,2.1vw,14.5px);color:#CBD9EC}
.prose p:last-child{margin-bottom:0}
.prose b{color:#fff}
.prose code{font-size:.85em}

.kp{margin-top:14px;padding:12px 14px;border-radius:7px;background:var(--panel2);border:1px solid var(--line)}
.kp-h{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--azure);margin-bottom:8px}
.kp ul{margin:0 0 0 17px;color:var(--muted);font-size:clamp(12px,2vw,13px)}
.kp li{margin-bottom:5px}
.kp li:last-child{margin-bottom:0}

.box{margin-top:12px;padding:12px 14px;border-radius:7px;font-size:clamp(12px,2vw,13.5px);line-height:1.6}
.box-h{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:7px;font-weight:700}
.box.trap{background:rgba(226,86,74,.07);border:1px solid rgba(226,86,74,.28);color:#E8D3D0}
.box.trap .box-h{color:var(--ember)}
.box.follow{background:rgba(155,123,232,.07);border:1px solid rgba(155,123,232,.26);color:#DCD3EE}
.box.follow .box-h{color:var(--violet)}
.box.follow ul{margin:0 0 0 17px}
.box.follow li{margin-bottom:4px}
.box.follow li:last-child{margin-bottom:0}

/* ---------- drills ---------- */
.q{font-family:var(--disp);font-size:clamp(15px,3.1vw,20px);line-height:1.38;
  font-weight:700;letter-spacing:-.015em;margin-bottom:6px}
.choices{display:flex;flex-direction:column;gap:9px;margin:14px 0 0}
.choice{padding:clamp(11px,2vw,14px) clamp(12px,2vw,15px);border:1.5px solid var(--line);border-radius:7px;
  background:var(--panel2);cursor:pointer;transition:.14s;-webkit-tap-highlight-color:transparent;
  display:flex;align-items:flex-start;gap:10px;font-size:clamp(12.5px,2vw,14px);text-align:left;width:100%;
  line-height:1.5;color:var(--paper)}
.choice .ltr{font-family:var(--mono);font-size:11px;color:var(--dim);flex:0 0 auto;
  border:1px solid var(--line);border-radius:4px;width:22px;height:22px;display:flex;
  align-items:center;justify-content:center;margin-top:1px}
.choice:not(.locked):hover{border-color:var(--dim);background:#1E2A42}
.choice.correct{border-color:var(--mint);background:rgba(63,208,142,.1)}
.choice.correct .ltr{border-color:var(--mint);color:var(--mint)}
.choice.wrong{border-color:var(--ember);background:rgba(226,86,74,.1)}
.choice.wrong .ltr{border-color:var(--ember);color:var(--ember)}
.choice.locked{cursor:default}
.choice.dim{opacity:.5}

.verdict{margin-top:14px;padding:13px 15px;border-radius:7px;background:var(--panel2);
  border-left:3px solid var(--line);font-size:clamp(12.5px,2vw,14px)}
.verdict.ok{border-left-color:var(--mint)}
.verdict.no{border-left-color:var(--ember)}
.verdict-h{font-family:var(--disp);font-weight:700;margin-bottom:8px;font-size:clamp(13px,2.2vw,15px)}
.verdict.ok .verdict-h{color:var(--mint)}
.verdict.no .verdict-h{color:var(--ember)}
.verdict p{color:#CBD9EC;margin-bottom:8px}
.verdict p:last-child{margin-bottom:0}
.verdict .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--azure);display:block;margin:10px 0 5px}
.verdict .ww{color:var(--muted);font-size:clamp(12px,1.9vw,13px)}
.retry{margin-top:12px;font-family:var(--mono);font-size:11px;color:var(--dim);
  border:1px solid var(--line);border-radius:5px;padding:7px 11px;min-height:36px}
.retry:hover{color:var(--paper);border-color:var(--dim)}

/* ---------- stats ---------- */
.statbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;
  padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.statbar .s{font-family:var(--mono);font-size:clamp(10.5px,1.9vw,12px);color:var(--muted)}
.statbar .s b{color:var(--paper)}
.statbar .s.ok b{color:var(--mint)}
.statbar .s.no b{color:var(--ember)}
.statbar .sp{flex:1}
.reset{font-family:var(--mono);font-size:10.5px;color:var(--dim);border:1px solid var(--line);
  border-radius:5px;padding:6px 10px;min-height:34px}
.reset:hover{color:var(--ember);border-color:rgba(226,86,74,.4)}

.placeholder{padding:clamp(24px,4vw,44px) clamp(16px,2vw,20px);text-align:center;color:var(--dim);
  font-size:clamp(13px,2vw,14px);border:1px dashed var(--line);border-radius:8px}
</style>
</head>
<body>

<div class="bar">
  <div class="bar-in">
    <div class="brand">Java <span>LTS</span></div>
    <div class="bar-sp"></div>
    <div class="counter" id="counter"></div>
  </div>
  <div class="track"><i id="progress-fill"></i></div>
</div>

<div class="wrap">
  <div class="hero">
    <div class="eyebrow">📚 Ôn Luyện Kiến Thức</div>
    <h1>Java Core <em>LTS</em> Mastery</h1>
    <p class="lede">Nắm vững <b>kiến thức nền tảng Java</b> qua <b>4 phiên bản LTS</b>: Java 8, 11, 17 và 21. Kết hợp <b>hướng dẫn chuyên sâu</b> và <b>bài tập cấp độ phỏng vấn</b> — mỗi câu đều có giải thích cơ chế và bẫy thường gặp.</p>
  </div>

  <div class="sec">
    <div class="sec-h">Lọc theo phiên bản</div>
    <div class="chips" id="version-chips"></div>
  </div>

  <div class="tabs">
    <div class="tab active" id="tab-tutorials" onclick="switchMode('tutorials')">📚 Hướng Dẫn</div>
    <div class="tab" id="tab-drills" onclick="switchMode('drills')">⚡ Bài Tập</div>
  </div>

  <div id="tutorials-mode">
    <div class="sidebar">
      <div class="sidebar-menu" id="topics-menu"></div>
      <div class="content" id="tutorials-content"></div>
    </div>
  </div>

  <div id="drills-mode" style="display:none">
    <div class="sidebar">
      <div class="sidebar-menu" id="filters-menu"></div>
      <div class="content" id="drills-content"></div>
    </div>
  </div>
</div>

<script>
const TOPICS = /*__TOPICS__*/;
const TUTORIALS = /*__TUTORIALS__*/;
const DRILLS = /*__DRILLS__*/;

/* ============ syntax highlighting ============ */
const KW = ('abstract assert boolean break byte case catch char class const continue default do ' +
  'double else enum extends final finally float for goto if implements import instanceof int ' +
  'interface long native new package private protected public return short static strictfp super ' +
  'switch synchronized this throw throws transient try void volatile while var record yield ' +
  'sealed permits non-sealed true false null').split(' ');

const TYPES = ('String Integer Long Double Boolean Object List ArrayList LinkedList Map HashMap ' +
  'TreeMap LinkedHashMap Set HashSet TreeSet Optional Stream IntStream Thread Runnable Callable Future ' +
  'CompletableFuture Exception RuntimeException IOException Error StringBuilder StringBuffer ' +
  'BigDecimal LocalDate LocalDateTime AtomicInteger AtomicLong ConcurrentHashMap ExecutorService ' +
  'ThreadPoolExecutor ThreadLocal ReentrantLock Comparator Comparable Iterator Collection Collectors ' +
  'Entry Arrays Collections Objects Math System User Order Item Account Payment Node Executors ' +
  'Person Product Customer Invoice Repository Service Controller Event Message Record Shape ' +
  'BlockingQueue LinkedBlockingQueue CountDownLatch Semaphore Class Number Character Byte Short ' +
  'Float Void Iterable Function Supplier Consumer Predicate Instant Duration UUID HttpClient ' +
  'HttpRequest HttpResponse Point Circle Square Animal Dog Cat Counter').split(' ');

function hl(src) {
  const store = [];
  const keep = t => '\u0000' + String.fromCodePoint(0xE000 + store.push(t) - 1) + '\u0000';
  let s = src.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  s = s.replace(/\/\/[^\n]*|\/\*[\s\S]*?\*\//g, m => keep('<span class="cm">' + m + '</span>'));
  s = s.replace(/"(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'/g, m => keep('<span class="s">' + m + '</span>'));
  s = s.replace(/@[A-Z]\w*/g, m => keep('<span class="an">' + m + '</span>'));
  s = s.replace(/\b\d[\d_]*[LlFfDd]?\b/g, m => keep('<span class="nu">' + m + '</span>'));
  s = s.replace(new RegExp('\\b(' + KW.join('|') + ')\\b', 'g'), m => keep('<span class="k">' + m + '</span>'));
  s = s.replace(new RegExp('\\b(' + TYPES.join('|') + ')\\b', 'g'), m => keep('<span class="ty">' + m + '</span>'));
  s = s.replace(/\.([a-z]\w*)(?=\s*\()/g, (_, n) => '.' + keep('<span class="fn">' + n + '</span>'));
  let guard = 0;
  while (s.indexOf('\u0000') !== -1 && guard++ < 20) {
    s = s.replace(/\u0000([\uE000-\uF8FF])\u0000/g, (m, ch) => store[ch.codePointAt(0) - 0xE000] ?? m);
  }
  return s;
}
function codeBlock(src, title) {
  if (!src) return '';
  return `<div class="code">${title ? `<div class="code-h">› ${esc(title)}</div>` : ''}<pre><code>${hl(String(src).trim())}</code></pre></div>`;
}
function esc(t) {
  return String(t == null ? '' : t)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
const vtags = vs => (vs || []).map(v => `<span class="tag v${v}">Java ${v}</span>`).join('');

/* ============ state ============ */
const KEY = 'java-core-lts-state-v2';
let currentMode = 'tutorials';
let currentTopic = TOPICS[0].id;
let currentDrillTopic = TOPICS[0].id;
let currentDifficulty = 'all';
let currentVersion = 'all';
let results = {};   // drillId -> {picked:int, ok:bool}

function loadState() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const s = JSON.parse(raw);
      results = s.results || {};
      if (s.version) currentVersion = s.version;
    }
  } catch (e) { results = {}; }
}
function saveState() {
  try {
    localStorage.setItem(KEY, JSON.stringify({ results, version: currentVersion }));
  } catch (e) { /* quota/private mode - bỏ qua */ }
}

const matchVersion = item =>
  currentVersion === 'all' || (item.versions || []).includes(Number(currentVersion));

const tutorialsFor = id => TUTORIALS.filter(t => t.topicId === id && matchVersion(t));
const drillsFor = id => DRILLS.filter(d =>
  d.topicId === id && matchVersion(d) &&
  (currentDifficulty === 'all' || d.difficulty === currentDifficulty));

/* ============ render: shell ============ */
function renderVersionChips() {
  const vs = [['all', 'Tất cả', ''], [8, 'Java 8', '2014'], [11, 'Java 11', '2018'], [17, 'Java 17', '2021'], [21, 'Java 21', '2023']];
  document.getElementById('version-chips').innerHTML = vs.map(([v, label, year]) =>
    `<button class="chip ${String(currentVersion) === String(v) ? 'on' : ''}" onclick="setVersion('${v}')">
      <span>${label}</span>${year ? `<span class="n">${year}</span>` : ''}
    </button>`).join('');
}
function setVersion(v) {
  currentVersion = v;
  saveState();
  renderVersionChips();
  renderTopicsMenu(); renderTutorial();
  renderDrillsFilters(); renderDrills();
  updateProgress();
}
function switchMode(mode, skipHash) {
  currentMode = mode;
  document.getElementById('tutorials-mode').style.display = mode === 'tutorials' ? 'block' : 'none';
  document.getElementById('drills-mode').style.display = mode === 'drills' ? 'block' : 'none';
  document.getElementById('tab-tutorials').classList.toggle('active', mode === 'tutorials');
  document.getElementById('tab-drills').classList.toggle('active', mode === 'drills');
  if (!skipHash && history.replaceState) history.replaceState(null, '', mode === 'drills' ? '#drills' : '#tutorials');
  updateProgress();
}

/* ============ render: tutorials ============ */
function renderTopicsMenu() {
  document.getElementById('topics-menu').innerHTML = `
    <div class="menu-group">
      <div class="menu-label">Chủ Đề</div>
      <div class="menu-row">
        ${TOPICS.map(t => {
          const n = tutorialsFor(t.id).length;
          return `<div class="menu-item ${t.id === currentTopic ? 'active' : ''}" onclick="selectTopic(${t.id})">
            <span>${esc(t.name)}</span><span class="cnt">${n}</span>
          </div>`;
        }).join('')}
      </div>
    </div>`;
}
function selectTopic(id) {
  currentTopic = id;
  renderTopicsMenu();
  renderTutorial();
  document.getElementById('tutorials-content').scrollIntoView({ block: 'start', behavior: 'smooth' });
}
function renderTutorial() {
  const topic = TOPICS.find(t => t.id === currentTopic);
  const list = tutorialsFor(currentTopic);
  const el = document.getElementById('tutorials-content');
  const head = `<div class="topic-head"><h2>${esc(topic.name)}</h2><p class="lede">${esc(topic.desc)}</p></div>`;

  if (!list.length) {
    el.innerHTML = head + `<div class="placeholder">Không có bài hướng dẫn nào khớp bộ lọc phiên bản hiện tại.<br>Thử chọn “Tất cả” ở phần lọc phiên bản.</div>`;
    return;
  }
  el.innerHTML = head + list.map(t => `
    <div class="card">
      <div class="tagrow">${vtags(t.versions)}</div>
      <h3>${esc(t.title)}</h3>
      ${t.summary ? `<div class="tut-sum">${esc(t.summary)}</div>` : ''}
      <div class="prose">${(t.sections || []).map(s => `<p>${s}</p>`).join('')}</div>
      ${codeBlock(t.example, t.exampleTitle)}
      ${(t.keyPoints || []).length ? `<div class="kp"><div class="kp-h">💡 Điểm chính</div>
        <ul>${t.keyPoints.map(k => `<li>${esc(k)}</li>`).join('')}</ul></div>` : ''}
      ${t.trap ? `<div class="box trap"><div class="box-h">⚠ Bẫy phỏng vấn</div>${esc(t.trap)}</div>` : ''}
      ${(t.followUp || []).length ? `<div class="box follow"><div class="box-h">🎯 Câu hỏi vặn thường gặp</div>
        <ul>${t.followUp.map(f => `<li>${esc(f)}</li>`).join('')}</ul></div>` : ''}
    </div>`).join('');
}

/* ============ render: drills ============ */
function renderDrillsFilters() {
  const diffs = [['all', 'Tất Cả'], ['beginner', 'Cơ Bản'], ['intermediate', 'Trung Bình'], ['advanced', 'Nâng Cao']];
  document.getElementById('filters-menu').innerHTML = `
    <div class="menu-group">
      <div class="menu-label">Chủ Đề</div>
      <div class="menu-row">
        ${TOPICS.map(t => {
          const all = DRILLS.filter(d => d.topicId === t.id && matchVersion(d));
          const done = all.filter(d => results[d.id]).length;
          return `<div class="menu-item ${t.id === currentDrillTopic ? 'active' : ''} ${all.length && done === all.length ? 'done' : ''}"
            onclick="setDrillTopic(${t.id})">
            <span>${esc(t.name)}</span><span class="cnt">${done}/${all.length}</span>
          </div>`;
        }).join('')}
      </div>
    </div>
    <div class="menu-group">
      <div class="menu-label">Độ Khó</div>
      <div class="menu-row">
        ${diffs.map(([v, label]) =>
          `<div class="menu-item ${currentDifficulty === v ? 'active' : ''}" onclick="setDifficulty('${v}')">${label}</div>`).join('')}
      </div>
    </div>`;
}
function setDrillTopic(id) {
  currentDrillTopic = id;
  renderDrillsFilters(); renderDrills();
  document.getElementById('drills-content').scrollIntoView({ block: 'start', behavior: 'smooth' });
}
function setDifficulty(v) {
  currentDifficulty = v;
  renderDrillsFilters(); renderDrills();
}

function renderDrills() {
  const list = drillsFor(currentDrillTopic);
  const el = document.getElementById('drills-content');
  const topic = TOPICS.find(t => t.id === currentDrillTopic);

  const scope = DRILLS.filter(d => d.topicId === currentDrillTopic && matchVersion(d));
  const done = scope.filter(d => results[d.id]);
  const right = done.filter(d => results[d.id].ok).length;
  const pct = done.length ? Math.round(right / done.length * 100) : 0;

  const stat = `<div class="statbar">
      <span class="s">Chủ đề: <b>${esc(topic.name)}</b></span>
      <span class="s">Đã làm <b>${done.length}</b>/${scope.length}</span>
      <span class="s ok">Đúng <b>${right}</b></span>
      <span class="s no">Sai <b>${done.length - right}</b></span>
      ${done.length ? `<span class="s">Tỉ lệ <b>${pct}%</b></span>` : ''}
      <span class="sp"></span>
      ${done.length ? `<button class="reset" onclick="resetTopic()">Làm lại chủ đề</button>` : ''}
    </div>`;

  if (!list.length) {
    el.innerHTML = stat + `<div class="placeholder">Không có bài tập nào khớp bộ lọc hiện tại.<br>Thử đổi độ khó hoặc phiên bản.</div>`;
    return;
  }
  el.innerHTML = stat + `<div class="sec-h" style="margin-bottom:14px">Bài Tập (${list.length})</div>` +
    list.map(d => drillCard(d)).join('');
}

function drillCard(d) {
  const r = results[d.id];
  const letters = ['A', 'B', 'C', 'D', 'E', 'F'];
  const choices = d.choices.map((c, i) => {
    let cls = 'choice';
    if (r) {
      cls += ' locked';
      if (i === d.correctAnswer) cls += ' correct';
      else if (i === r.picked) cls += ' wrong';
      else cls += ' dim';
    }
    return `<button class="${cls}" ${r ? '' : `onclick="answer('${d.id}',${i})"`}>
        <span class="ltr">${letters[i]}</span><span>${esc(c)}</span>
      </button>`;
  }).join('');

  let verdict = '';
  if (r) {
    const ww = (d.whyWrong || [])[r.picked];
    verdict = `<div class="verdict ${r.ok ? 'ok' : 'no'}">
      <div class="verdict-h">${r.ok ? '✓ Chính xác' : '✕ Chưa đúng'}</div>
      ${!r.ok && ww ? `<p class="ww"><b>Vì sao ${letters[r.picked]} sai:</b> ${esc(ww)}</p>` : ''}
      <span class="lbl">📖 Giải thích</span>
      <p>${esc(d.explanation)}</p>
      <button class="retry" onclick="clearAnswer('${d.id}')">↺ Làm lại câu này</button>
    </div>`;
  }

  return `<div class="card" id="drill-${d.id}">
      <div class="tagrow">
        <span class="tag ${d.difficulty}">${diffLabel(d.difficulty)}</span>
        ${vtags(d.versions)}
      </div>
      <div class="q">${esc(d.question)}</div>
      ${codeBlock(d.code)}
      <div class="choices">${choices}</div>
      ${verdict}
    </div>`;
}
const diffLabel = v => ({ beginner: 'Cơ Bản', intermediate: 'Trung Bình', advanced: 'Nâng Cao' }[v] || v);

function answer(id, picked) {
  const d = DRILLS.find(x => x.id === id);
  if (!d || results[id]) return;
  results[id] = { picked, ok: picked === d.correctAnswer };
  saveState();
  const card = document.getElementById('drill-' + id);
  if (card) card.outerHTML = drillCard(d);
  renderDrillsFilters();
  updateStatbar();
  updateProgress();
}
function clearAnswer(id) {
  const d = DRILLS.find(x => x.id === id);
  delete results[id];
  saveState();
  const card = document.getElementById('drill-' + id);
  if (card) card.outerHTML = drillCard(d);
  renderDrillsFilters();
  updateStatbar();
  updateProgress();
}
function resetTopic() {
  DRILLS.filter(d => d.topicId === currentDrillTopic).forEach(d => delete results[d.id]);
  saveState();
  renderDrillsFilters(); renderDrills(); updateProgress();
}
function updateStatbar() {
  const scope = DRILLS.filter(d => d.topicId === currentDrillTopic && matchVersion(d));
  const done = scope.filter(d => results[d.id]);
  const right = done.filter(d => results[d.id].ok).length;
  const pct = done.length ? Math.round(right / done.length * 100) : 0;
  const bar = document.querySelector('#drills-content .statbar');
  if (!bar) return;
  const topic = TOPICS.find(t => t.id === currentDrillTopic);
  bar.innerHTML = `<span class="s">Chủ đề: <b>${esc(topic.name)}</b></span>
      <span class="s">Đã làm <b>${done.length}</b>/${scope.length}</span>
      <span class="s ok">Đúng <b>${right}</b></span>
      <span class="s no">Sai <b>${done.length - right}</b></span>
      ${done.length ? `<span class="s">Tỉ lệ <b>${pct}%</b></span>` : ''}
      <span class="sp"></span>
      ${done.length ? `<button class="reset" onclick="resetTopic()">Làm lại chủ đề</button>` : ''}`;
}

function updateProgress() {
  const total = DRILLS.length;
  const ids = Object.keys(results);
  const done = ids.length;
  const right = ids.filter(k => results[k].ok).length;
  document.getElementById('counter').innerHTML = currentMode === 'drills' || done
    ? `<b>${done}</b>/${total} · <span class="acc">${done ? Math.round(right / done * 100) : 0}%</span>`
    : `<b>${TUTORIALS.length}</b> bài · <b>${total}</b> câu`;
  document.getElementById('progress-fill').style.width = (total ? done / total * 100 : 0) + '%';
}

function init() {
  loadState();
  renderVersionChips();
  renderTopicsMenu(); renderTutorial();
  renderDrillsFilters(); renderDrills();
  if (location.hash === '#drills') switchMode('drills', true);
  updateProgress();
}
window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
