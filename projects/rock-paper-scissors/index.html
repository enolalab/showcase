<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>✊✋✌️ Kéo Búa Bao — AI Camera</title>
  <meta name="description" content="Chơi Kéo Búa Bao với AI nhận diện cử chỉ tay qua camera. Powered by MediaPipe." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- TITLE SCREEN -->
    <div id="title-screen" class="screen active">
      <div class="glow glow--a"></div>
      <div class="glow glow--b"></div>
      <div class="title-content">
        <div class="title-emoji">✊ ✋ ✌️</div>
        <h1 class="title-heading">Kéo Búa Bao</h1>
        <p class="title-sub">AI Camera Edition</p>
        <p class="title-desc">Dùng camera để chơi — AI nhận diện cử chỉ tay của bạn trong thời gian thực.</p>
        <div class="title-modes">
          <button class="btn btn--primary btn--lg" id="btn-camera">
            <span>📸</span> Chơi với Camera
          </button>
          <button class="btn btn--ghost btn--lg" id="btn-manual">
            <span>👆</span> Chơi thủ công
          </button>
        </div>
        <p class="title-credit">Powered by <strong>MediaPipe Hands</strong> · Enolalab Showcase</p>
      </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="screen">
      <header class="game-header">
        <div class="score-board">
          <div class="score-item">
            <span class="score-label">Bạn</span>
            <span class="score-val" id="score-player">0</span>
          </div>
          <div class="score-divider">:</div>
          <div class="score-item">
            <span class="score-label">Máy</span>
            <span class="score-val" id="score-cpu">0</span>
          </div>
        </div>
        <button class="btn-icon" id="btn-back" title="Về menu">✕</button>
      </header>

      <div class="game-arena">
        <!-- Player side -->
        <div class="arena-side arena-side--player">
          <div class="arena-label">Bạn</div>
          <div class="arena-gesture" id="player-gesture">❓</div>
          <!-- Camera view (hidden in manual mode) -->
          <div class="camera-wrap" id="camera-wrap" style="display:none">
            <video id="camera-video" autoplay playsinline muted></video>
            <canvas id="camera-canvas"></canvas>
            <div class="camera-overlay" id="camera-status">Đang kết nối camera...</div>
          </div>
        </div>

        <!-- VS -->
        <div class="arena-vs">
          <div class="vs-text" id="vs-text">VS</div>
          <div class="countdown" id="countdown" style="display:none">3</div>
        </div>

        <!-- CPU side -->
        <div class="arena-side arena-side--cpu">
          <div class="arena-label">Máy</div>
          <div class="arena-gesture" id="cpu-gesture">❓</div>
        </div>
      </div>

      <!-- Result -->
      <div class="result" id="result" style="display:none">
        <div class="result-text" id="result-text"></div>
      </div>

      <!-- Manual buttons -->
      <div class="manual-controls" id="manual-controls" style="display:none">
        <button class="choice-btn" data-choice="rock" id="choice-rock">
          <span class="choice-emoji">✊</span>
          <span class="choice-name">Búa</span>
        </button>
        <button class="choice-btn" data-choice="scissors" id="choice-scissors">
          <span class="choice-emoji">✌️</span>
          <span class="choice-name">Kéo</span>
        </button>
        <button class="choice-btn" data-choice="paper" id="choice-paper">
          <span class="choice-emoji">✋</span>
          <span class="choice-name">Bao</span>
        </button>
      </div>

      <!-- Camera play button -->
      <div class="camera-controls" id="camera-controls" style="display:none">
        <button class="btn btn--primary btn--lg" id="btn-shoot">
          <span>📸</span> Chụp cử chỉ (Space)
        </button>
        <p class="camera-hint">Giơ tay trước camera rồi nhấn nút hoặc phím Space</p>
      </div>

      <!-- Round info -->
      <div class="round-info" id="round-info">
        <span>Round <strong id="round-num">1</strong></span>
      </div>
    </div>
  </div>

  <!-- MediaPipe Hands -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
