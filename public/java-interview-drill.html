 "<b>Database riêng cho từng service</b> — không service nào đọc thẳng DB của service khác.",
 "<b>Circuit Breaker / Resilience</b> — Resilience4j.",
 "<b>Observability</b> — centralized logging (ELK), metrics (Prometheus + Grafana), tracing (OpenTelemetry/Jaeger).",
 "<b>Nền tảng chạy</b> — Kubernetes cho deploy, scale, service mesh nếu cần mTLS."]},

{id:"13.4", t:13, p:3, q:"API Gateway có chức năng gì?", a:[
 "<b>Routing</b> — định tuyến request tới service phù hợp.",
 "<b>Authentication / Authorization</b> — xác thực tập trung, service phía sau không phải lặp lại.",
 "<b>Rate limiting</b> và throttling.",
 "<b>Aggregation</b> — gộp nhiều lời gọi thành một response cho client (giảm round-trip cho mobile).",
 "<b>SSL termination</b>, nén, CORS.",
 "<b>Cross-cutting</b>: logging, metrics, correlation ID, request/response transform.",
 "<b>Che giấu cấu trúc nội bộ</b> — client không cần biết có bao nhiêu service.",
 "Rủi ro: dễ thành single point of failure và 'God service' nếu nhét logic nghiệp vụ vào."]},

{id:"13.5", t:13, p:3, q:"Phân biệt Zuul vs Spring Cloud Gateway", a:[
 "<b>Zuul 1</b>: blocking, dựa trên Servlet, mỗi request chiếm một thread → không chịu tải tốt. Đã <b>EOL</b>, Spring Cloud không còn hỗ trợ.",
 "<b>Spring Cloud Gateway</b>: <b>non-blocking</b>, xây trên Spring WebFlux + Project Reactor + Netty.",
 "SCG throughput cao hơn hẳn với cùng tài nguyên vì không cần một thread cho mỗi kết nối.",
 "SCG hỗ trợ WebSocket, mô hình Predicate + Filter rõ ràng, tích hợp sẵn Resilience4j và rate limiter dùng Redis.",
 "Zuul 2 có kiến trúc non-blocking nhưng Spring không tích hợp chính thức.",
 "Kết luận cho dự án mới: dùng <b>Spring Cloud Gateway</b>; hoặc cân nhắc gateway ngoài như Kong, APISIX, Envoy nếu cần tính năng vận hành phong phú hơn."]},

{id:"13.6", t:13, p:2, q:"Service Discovery hoạt động thế nào?", a:[
 "Service tự <b>đăng ký</b> địa chỉ vào registry lúc khởi động và gửi heartbeat định kỳ.",
 "Client hỏi registry để lấy danh sách instance còn sống, rồi tự chọn (client-side load balancing).",
 "<b>Client-side</b> (Eureka + Spring Cloud LoadBalancer): client giữ cache danh sách, giảm một chặng mạng.",
 "<b>Server-side</b> (Kubernetes Service, AWS ELB): client chỉ gọi một địa chỉ ảo, hạ tầng lo phân phối.",
 "Trong Kubernetes thường <b>không cần Eureka</b> — Service + CoreDNS đã làm việc đó.",
 "Cần chú ý: thời gian phát hiện instance chết (heartbeat interval) ảnh hưởng trực tiếp tới tỷ lệ lỗi khi scale down."]},

{id:"13.7", t:13, p:3, q:"Khi module A muốn gọi service của module B thì làm thế nào?", a:[
 "Nếu cùng một ứng dụng (modular monolith): gọi qua interface được module B công bố, tuyệt đối không đụng vào internal class hay bảng DB của B.",
 "Nếu khác service, <b>cần kết quả ngay</b>: HTTP REST (RestClient / WebClient / OpenFeign) hoặc gRPC, kèm timeout, retry có giới hạn và circuit breaker.",
 "Nếu <b>không cần kết quả ngay</b>: phát event lên Kafka, B tự tiêu thụ → giảm coupling, A không chết theo khi B down.",
 "<b>Không bao giờ</b> để A truy cập trực tiếp database của B — đó là cách phá vỡ microservices nhanh nhất.",
 "Cần dữ liệu của B để hiển thị: cân nhắc lưu bản sao cục bộ (read model) cập nhật qua event, thay vì gọi đồng bộ mỗi lần.",
 "Câu hỏi quyết định luôn là: <i>nghiệp vụ này có thật sự cần đồng bộ không?</i>"]},

{id:"13.8", t:13, p:3, q:"Giao tiếp giữa các service dùng gì? Trade-off?", a:[
 "<b>Đồng bộ</b> (REST, gRPC): đơn giản, có kết quả ngay, dễ debug. Nhược: coupling thời gian — B chết thì A lỗi theo; chuỗi gọi dài làm latency cộng dồn và lan truyền sự cố.",
 "<b>Bất đồng bộ</b> (Kafka, RabbitMQ): decoupling, chịu tải đột biến, B down thì message vẫn chờ. Nhược: eventual consistency, khó debug, phải xử lý message trùng và sai thứ tự.",
 "Nguyên tắc chọn: <b>truy vấn</b> → đồng bộ; <b>sự kiện đã xảy ra / lệnh không cần phản hồi ngay</b> → bất đồng bộ.",
 "Chuỗi gọi đồng bộ quá 2–3 tầng là dấu hiệu cần xem lại ranh giới service.",
 "Hệ thống thực tế gần như luôn dùng cả hai."]},

{id:"13.9", t:13, p:3, q:"REST vs gRPC — khi nào chọn gRPC?", a:[
 "<b>gRPC</b>: HTTP/2, Protobuf nhị phân, contract-first qua file <code>.proto</code>, sinh code cho nhiều ngôn ngữ, hỗ trợ streaming hai chiều.",
 "Nhanh hơn và gọn hơn REST/JSON đáng kể; multiplexing trên một kết nối.",
 "Chọn gRPC khi: giao tiếp <b>nội bộ</b> giữa các service, lưu lượng cao, cần độ trễ thấp, polyglot, cần streaming.",
 "Chọn REST khi: API công khai, client là trình duyệt, cần dễ đọc/debug bằng curl, hệ sinh thái công cụ phong phú.",
 "Nhược của gRPC: trình duyệt không gọi trực tiếp được (cần gRPC-Web/proxy), khó debug thủ công, phải quản lý version <code>.proto</code>.",
 "Mẫu phổ biến: REST ở rìa (gateway ↔ client), gRPC ở trong (service ↔ service)."]},

{id:"13.10", t:13, p:3, q:"Circuit Breaker là gì? Resilience4j có những pattern nào?", a:[
 "Ngăn việc gọi liên tục vào một service đang hỏng — tránh lãng phí tài nguyên và <b>cascading failure</b>.",
 "Ba trạng thái: <b>CLOSED</b> (cho qua) → tỷ lệ lỗi vượt ngưỡng → <b>OPEN</b> (chặn ngay, trả fallback) → sau thời gian chờ → <b>HALF_OPEN</b> (cho vài request thử) → tốt thì về CLOSED, xấu thì lại OPEN.",
 "<b>Retry</b> — thử lại kèm exponential backoff và jitter; chỉ retry với thao tác <b>idempotent</b>.",
 "<b>Bulkhead</b> — giới hạn số lời gọi đồng thời cho từng dependency, để một service chậm không chiếm hết thread pool.",
 "<b>RateLimiter</b> — giới hạn tần suất gọi. <b>TimeLimiter</b> — cắt lời gọi quá lâu.",
 "<b>Fallback</b> — trả dữ liệu cache, giá trị mặc định, hoặc thông báo suy giảm dịch vụ.",
 "Cảnh báo: retry mà không có circuit breaker sẽ <b>khuếch đại</b> sự cố (retry storm)."]},

{id:"13.11", t:13, p:3, q:"Đảm bảo nhất quán dữ liệu giữa các service: Saga, Outbox, Idempotency", a:[
 "Không có transaction phân tán ACID → chấp nhận <b>eventual consistency</b>.",
 "<b>Saga</b>: chuỗi transaction cục bộ + compensating transaction để hoàn tác khi lỗi (huỷ đơn, hoàn tiền).",
 "Lưu ý: compensation không phải rollback — nó là hành động nghiệp vụ mới và phải thiết kế riêng.",
 "<b>Outbox</b>: ghi dữ liệu + event vào cùng transaction DB, tiến trình riêng (hoặc CDC như Debezium) đẩy lên Kafka. Giải quyết vấn đề dual-write.",
 "<b>Idempotency</b>: mỗi message mang một khoá duy nhất; consumer lưu khoá đã xử lý để bỏ qua bản trùng. Bắt buộc phải có vì broker đảm bảo at-least-once.",
 "<b>Inbox pattern</b> ở phía nhận là cách hiện thực idempotency phổ biến."]},

{id:"13.12", t:13, p:2, q:"Distributed tracing hoạt động thế nào?", a:[
 "Mỗi request được gán <b>trace ID</b>; mỗi chặng xử lý là một <b>span</b> có span ID và parent ID.",
 "ID được truyền qua HTTP header (chuẩn W3C <code>traceparent</code>) hoặc header của Kafka message.",
 "Spring Boot 3 dùng <b>Micrometer Tracing</b> (thay Sleuth), xuất sang Jaeger/Zipkin/Tempo.",
 "Đưa trace ID vào <b>MDC</b> để mọi dòng log đều có → nối được log với trace.",
 "Giá trị lớn nhất: nhìn ra ngay chặng nào chậm trong chuỗi gọi, thay vì đoán mò qua log rời rạc.",
 "Nên dùng sampling ở lưu lượng cao để tiết kiệm chi phí lưu trữ."]},

{id:"13.13", t:13, p:2, q:"Chiến lược tách monolith thành microservices?", a:[
 "<b>Strangler Fig</b>: dựng service mới bên cạnh, dần chuyển traffic qua gateway, monolith teo dần — thay vì viết lại từ đầu (big-bang rewrite gần như luôn thất bại).",
 "Xác định ranh giới bằng <b>bounded context</b> của DDD, không chia theo tầng kỹ thuật.",
 "Tách theo thứ tự: phần ít phụ thuộc nhất, hoặc phần cần scale riêng, hoặc phần thay đổi thường xuyên nhất.",
 "Tách dữ liệu là phần khó nhất: bỏ join xuyên bảng, đồng bộ qua event, chấp nhận trùng lặp dữ liệu có kiểm soát.",
 "Chuẩn bị hạ tầng trước khi tách: CI/CD, monitoring, tracing.",
 "Đo bằng kết quả cụ thể (thời gian deploy, khả năng scale), không phải bằng số lượng service."]},

{id:"13.14", t:13, p:1, q:"Config management và API versioning", a:[
 "Cấu hình tách khỏi code (12-factor): biến môi trường, ConfigMap/Secret, Spring Cloud Config, Vault cho thông tin nhạy cảm.",
 "Profile theo môi trường, refresh động qua <code>@RefreshScope</code> nếu cần.",
 "Versioning API: theo URL (<code>/v1/</code>), theo header, hoặc content negotiation.",
 "Nguyên tắc: thay đổi <b>tương thích ngược</b> (chỉ thêm field, không xoá/đổi nghĩa field cũ).",
 "Với Kafka/Protobuf: dùng schema registry và quy tắc tương thích để tránh phá consumer cũ."]},

/* ============ 14. SECURITY ============ */
{id:"14.1", t:14, p:3, q:"Xác thực giữa các service bằng gì?", a:[
 "<b>mTLS</b> — hai bên cùng trình chứng chỉ; mạnh nhất, thường do service mesh (Istio, Linkerd) lo tự động.",
 "<b>OAuth2 Client Credentials</b> — service lấy access token từ authorization server; chuẩn hoá và có scope rõ ràng.",
 "<b>JWT nội bộ</b> — service ký token, service khác verify bằng public key (JWKS).",
 "<b>API key / shared secret</b> — đơn giản nhất, khó xoay vòng, chỉ hợp hệ thống nhỏ.",
 "<b>Network policy</b> — giới hạn ở tầng hạ tầng, dùng kèm chứ không thay thế xác thực.",
 "Thêm bài toán <b>truyền danh tính người dùng</b> xuyên service: thường dùng token propagation hoặc token exchange, tránh việc service trong cùng tin tưởng mù quáng header do service ngoài đặt."]},

{id:"14.2", t:14, p:3, q:"Cơ chế hoạt động khi user login? Mô tả toàn bộ flow", a:[
 "Client gửi username/password qua HTTPS tới <code>/login</code>.",
 "Spring Security: <code>UsernamePasswordAuthenticationFilter</code> tạo <code>Authentication</code> chưa xác thực → <code>AuthenticationManager</code> → <code>DaoAuthenticationProvider</code>.",
 "Provider gọi <code>UserDetailsService.loadUserByUsername()</code> lấy thông tin từ DB.",
 "So mật khẩu bằng <code>PasswordEncoder.matches()</code> — <b>không bao giờ so sánh chuỗi trực tiếp</b>, vì hash có salt ngẫu nhiên.",
 "Thành công → tạo <code>Authentication</code> đã xác thực, đưa vào <code>SecurityContextHolder</code>.",
 "Sinh <b>access token</b> (JWT, TTL ngắn) và <b>refresh token</b> (TTL dài, lưu trạng thái ở server) trả về client.",
 "Request sau: gửi <code>Authorization: Bearer &lt;token&gt;</code>; filter verify chữ ký, kiểm tra hạn, dựng lại SecurityContext — <b>không cần truy vấn DB</b>.",
 "Cần nhắc thêm: chống brute-force (rate limit, khoá tài khoản tạm thời), và log audit."]},

{id:"14.3", t:14, p:2, q:"Authentication vs Authorization", a:[
 "<b>Authentication</b> — 'bạn là ai?'. Xác minh danh tính. Xảy ra trước.",
 "<b>Authorization</b> — 'bạn được làm gì?'. Kiểm tra quyền trên tài nguyên cụ thể.",
 "Mã lỗi HTTP: <b>401</b> = chưa xác thực (hoặc token hỏng/hết hạn); <b>403</b> = đã xác thực nhưng không đủ quyền.",
 "Spring Security: authentication ở filter chain đầu; authorization qua <code>AuthorizationFilter</code>, <code>@PreAuthorize</code>.",
 "Đừng quên <b>authorization ở mức bản ghi</b>: user đã đăng nhập vẫn không được xem đơn hàng của người khác (IDOR)."]},

{id:"14.4", t:14, p:3, q:"JWT gồm mấy phần? Nội dung mỗi phần?", a:[
 "Ba phần ngăn bởi dấu chấm: <b>Header.Payload.Signature</b>, mỗi phần Base64URL.",
 "<b>Header</b>: thuật toán (<code>alg</code>: HS256, RS256), loại token (<code>typ</code>), đôi khi <code>kid</code> để chọn khoá.",
 "<b>Payload</b>: các claim — chuẩn (<code>sub</code>, <code>iss</code>, <code>aud</code>, <code>exp</code>, <code>iat</code>, <code>jti</code>) và tự định nghĩa (roles, tenant).",
 "<b>Signature</b>: ký trên <code>base64(header) + \".\" + base64(payload)</code> bằng secret (HMAC) hoặc private key (RSA/EC).",
 "<b>HS256</b> — cùng một secret để ký và verify, hợp hệ thống một bên. <b>RS256</b> — ký bằng private key, verify bằng public key → hợp microservices, chỉ auth server giữ khoá bí mật.",
 "Cảnh báo bảo mật kinh điển: phải <b>kiểm tra <code>alg</code></b>, tuyệt đối không chấp nhận <code>alg: none</code> hay để attacker ép HS256 dùng public key làm secret."]},

{id:"14.5", t:14, p:3, q:"JWT được mã hoá hay chỉ được ký?", trap:true, a:[
 "<b>Chỉ được KÝ, không mã hoá</b> (với JWS — dạng phổ biến nhất).",
 "Payload chỉ là Base64URL — ai cũng decode đọc được, dán vào jwt.io là thấy toàn bộ.",
 "Chữ ký chỉ đảm bảo <b>toàn vẹn</b> (không bị sửa) và <b>nguồn gốc</b>, <b>không</b> đảm bảo bí mật.",
 "→ Tuyệt đối không đặt mật khẩu, số thẻ, CCCD, hay dữ liệu nhạy cảm vào payload.",
 "Cần bí mật thật thì dùng <b>JWE</b> (JSON Web Encryption), hoặc đơn giản hơn: chỉ để <code>sub</code> và tra dữ liệu ở server.",
 "Rất nhiều người nhầm chỗ này — trả lời đúng tạo ấn tượng ngay."]},

{id:"14.6", t:14, p:3, q:"JWT vs Session-based auth — trade-off?", a:[
 "<b>Session</b>: server lưu trạng thái, client giữ session ID. Thu hồi tức thì, dữ liệu không lộ ra client, ID ngắn.",
 "Nhược: cần sticky session hoặc session store dùng chung (Redis) khi scale ngang; mỗi request phải tra store.",
 "<b>JWT</b>: stateless, verify bằng chữ ký, không cần tra DB → scale ngang dễ, hợp microservices và mobile.",
 "Nhược: <b>không thu hồi được</b> trước khi hết hạn; token lớn hơn nên tốn băng thông mỗi request; đổi quyền không có hiệu lực ngay.",
 "Thực tế phổ biến: access token JWT TTL ngắn (5–15 phút) + refresh token <b>có trạng thái</b> ở server → gần như lấy được ưu điểm của cả hai."]},

{id:"14.7", t:14, p:3, q:"Muốn ngắt / thu hồi một JWT NGAY LẬP TỨC thì làm thế nào?", trap:true, anim:"jwt", a:[
 "Trả lời trung thực trước: <b>JWT thuần stateless thì không thu hồi được</b>. Server chỉ verify chữ ký và <code>exp</code>, nó không hỏi ai xem token còn hiệu lực không.",
 "<b>Blacklist / denylist</b>: lưu <code>jti</code> của token bị thu hồi vào Redis với TTL = thời gian còn lại. Mỗi request kiểm tra thêm một lần. Chính xác, nhưng <b>đánh mất tính stateless</b>.",
 "<b>Token version</b>: lưu <code>tokenVersion</code> ở user record, nhúng vào token; logout/đổi mật khẩu thì tăng lên. Đơn giản, thu hồi được toàn bộ token của một user — đổi lại phải tra DB/cache mỗi request.",
 "<b>Access token TTL rất ngắn + refresh token có trạng thái</b>: thu hồi refresh token, chấp nhận cửa sổ rủi ro bằng đúng TTL của access token (5–15 phút). <b>Phổ biến nhất trong thực tế</b> vì cân bằng tốt.",
 "<b>Introspection endpoint</b> (OAuth2): mỗi request hỏi authorization server — chính xác tuyệt đối, nhưng gần như quay lại mô hình session.",
 "Kết luận đáng nói: <i>mọi giải pháp thu hồi tức thì đều phải thêm state — vấn đề chỉ là đặt state ở đâu và chấp nhận chi phí nào</i>. Người phỏng vấn tìm chính câu này."]},

{id:"14.8", t:14, p:3, q:"Access token vs Refresh token — chiến lược rotation", a:[
 "<b>Access token</b>: TTL ngắn (5–15 phút), gửi kèm mọi request, stateless.",
 "<b>Refresh token</b>: TTL dài (ngày–tuần), chỉ gửi tới endpoint refresh, <b>lưu trạng thái ở server</b> để thu hồi được.",
 "Lý do tách: giảm cửa sổ rủi ro khi access token bị lộ, mà vẫn không bắt người dùng đăng nhập lại liên tục.",
 "<b>Rotation</b>: mỗi lần refresh thì cấp refresh token mới và <b>huỷ cái cũ</b>.",
 "<b>Reuse detection</b>: nếu một refresh token cũ được dùng lại → dấu hiệu bị đánh cắp → huỷ toàn bộ token của user đó.",
 "Lưu refresh token trong <b>httpOnly + Secure + SameSite cookie</b>, không để trong localStorage."]},

{id:"14.9", t:14, p:3, q:"Lưu JWT ở đâu phía client? localStorage vs cookie", a:[
 "<b>localStorage</b>: JavaScript đọc được → <b>bị XSS lấy mất token</b>. Bù lại không dính CSRF và dễ dùng cross-domain.",
 "<b>httpOnly cookie</b>: JS không đọc được → chống XSS tốt hơn nhiều; nhưng trình duyệt tự gửi kèm → <b>cần chống CSRF</b>.",
 "Khuyến nghị chung: <b>httpOnly + Secure + SameSite=Lax/Strict</b>, kết hợp CSRF token nếu có thao tác đổi state cross-site.",
 "Mẫu lai phổ biến: access token giữ trong <b>bộ nhớ JS</b> (mất khi reload), refresh token trong httpOnly cookie.",
 "Nói thêm cho đủ: có XSS thì mọi phương án đều lung lay — nên CSP và sanitize input vẫn là tuyến phòng thủ gốc."]},

{id:"14.10", t:14, p:3, q:"Spring Security hoạt động thế nào? Filter Chain", a:[
 "Cắm vào servlet container qua một filter duy nhất: <code>DelegatingFilterProxy</code> → <code>FilterChainProxy</code> → chuỗi <code>SecurityFilterChain</code>.",
 "Thứ tự tiêu biểu: <code>SecurityContextPersistenceFilter</code> → <code>CorsFilter</code> → <code>CsrfFilter</code> → <code>UsernamePasswordAuthenticationFilter</code> → <code>BearerTokenAuthenticationFilter</code> → <code>ExceptionTranslationFilter</code> → <code>AuthorizationFilter</code>.",
 "<code>SecurityContextHolder</code> giữ <code>Authentication</code> trong <b>ThreadLocal</b> → hết request phải clear (Spring tự làm).",
 "<code>AuthenticationManager</code> ủy quyền cho các <code>AuthenticationProvider</code>.",
 "<code>ExceptionTranslationFilter</code> chuyển exception thành 401 (<code>AuthenticationEntryPoint</code>) hoặc 403 (<code>AccessDeniedHandler</code>).",
 "Spring Security 6: cấu hình bằng <b>lambda DSL</b>, <code>WebSecurityConfigurerAdapter</code> đã bị gỡ bỏ."]},

{id:"14.11", t:14, p:3, q:"Custom JWT filter đặt ở vị trí nào trong chain?", a:[
 "Thường đặt <b>trước</b> <code>UsernamePasswordAuthenticationFilter</code>: <code>http.addFilterBefore(jwtFilter, UsernamePasswordAuthenticationFilter.class)</code>.",
 "Lý do: cần dựng <code>SecurityContext</code> xong trước khi tới bước authorization.",
 "Filter nên kế thừa <code>OncePerRequestFilter</code> để không chạy lặp khi có forward/include.",
 "Bên trong: đọc header <code>Authorization</code> → verify chữ ký và <code>exp</code> → dựng <code>Authentication</code> → đặt vào <code>SecurityContextHolder</code> → <code>filterChain.doFilter()</code>.",
 "Token sai/hết hạn: <b>không</b> ném exception thẳng — cứ để trống context, để <code>ExceptionTranslationFilter</code> trả 401 đúng chuẩn.",
 "Với Spring Security hiện đại, có thể dùng luôn <code>oauth2ResourceServer().jwt()</code> thay vì tự viết filter."]},

{id:"14.12", t:14, p:2, q:"Phân quyền: @PreAuthorize, role vs authority", a:[
 "Bật bằng <code>@EnableMethodSecurity</code> (Spring Security 6).",
 "<code>@PreAuthorize</code> chạy <b>trước</b> method, hỗ trợ SpEL: <code>@PreAuthorize(\"hasRole('ADMIN') and #id == authentication.principal.id\")</code>.",
 "<code>@PostAuthorize</code> chạy sau, kiểm tra trên <code>returnObject</code> — hữu ích cho phân quyền theo bản ghi.",
 "<b>Role vs Authority</b>: role thực chất là authority có tiền tố <code>ROLE_</code>. <code>hasRole('ADMIN')</code> tự thêm tiền tố; <code>hasAuthority('ROLE_ADMIN')</code> phải ghi đủ.",
 "Thiết kế nên dùng <b>permission mịn</b> (<code>order:read</code>, <code>order:write</code>) rồi gán vào role — dễ mở rộng hơn là gắn cứng vào role.",
 "<code>@Secured</code> là dạng cũ, không hỗ trợ SpEL."]},

{id:"14.13", t:14, p:2, q:"Password hashing: BCrypt, salt, tại sao không dùng MD5/SHA?", a:[
 "MD5/SHA được thiết kế để <b>nhanh</b> → GPU thử hàng tỷ lần mỗi giây → brute-force dễ dàng.",
 "Hash mật khẩu cần thuật toán <b>cố ý chậm</b> và điều chỉnh được chi phí: <b>BCrypt</b>, <b>Argon2id</b>, <b>scrypt</b>, PBKDF2.",
 "<b>Salt</b>: chuỗi ngẫu nhiên cho mỗi mật khẩu → hai người cùng mật khẩu vẫn ra hash khác nhau, vô hiệu hoá rainbow table.",
 "BCrypt <b>tự sinh salt và nhúng vào chuỗi kết quả</b> → không cần lưu cột salt riêng.",
 "Vì có salt ngẫu nhiên nên phải dùng <code>encoder.matches(raw, hashed)</code>, không so sánh chuỗi.",
 "Tham số cost của BCrypt (mặc định 10) nên tăng dần theo năng lực phần cứng; khuyến nghị hiện nay thường là 12."]},

{id:"14.14", t:14, p:2, q:"OAuth2 flows và OIDC", a:[
 "<b>Authorization Code + PKCE</b> — chuẩn hiện tại cho web app và mobile; PKCE chống chặn mã đổi token.",
 "<b>Client Credentials</b> — cho giao tiếp máy-với-máy, không có người dùng.",
 "<b>Implicit</b> và <b>Resource Owner Password</b> — <b>đã bị khuyến cáo bỏ</b> vì rủi ro bảo mật.",
 "<b>OAuth2 là uỷ quyền</b> (cho phép ứng dụng truy cập tài nguyên), <b>OIDC là xác thực</b> (chứng minh danh tính) xây trên OAuth2.",
 "OIDC bổ sung <code>id_token</code> (JWT chứa thông tin người dùng) và endpoint <code>userinfo</code>.",
 "Nhầm lẫn phổ biến cần tránh: dùng access token của OAuth2 để suy ra danh tính — đó là việc của <code>id_token</code>."]},

{id:"14.15", t:14, p:2, q:"CORS, CSRF — khi nào cần bật/tắt CSRF trong API stateless?", a:[
 "<b>CORS</b>: cơ chế của trình duyệt cho phép gọi cross-origin; cấu hình ở server bằng header <code>Access-Control-Allow-*</code>. Không phải tính năng bảo mật của server mà là ràng buộc của browser.",
 "<b>CSRF</b>: kẻ tấn công lợi dụng việc trình duyệt <b>tự động gửi cookie</b> để thực hiện thao tác thay người dùng.",
 "→ Điều kiện tồn tại CSRF là <b>xác thực dựa trên cookie</b>.",
 "API stateless dùng <code>Authorization: Bearer</code> (token trong header, phải do JS thêm vào) thì <b>không dính CSRF</b> → tắt được.",
 "Nhưng nếu để token trong <b>cookie</b> thì <b>vẫn cần chống CSRF</b>, dù API là stateless.",
 "Phòng thủ: CSRF token, <code>SameSite=Lax/Strict</code>, kiểm tra Origin/Referer."]},

/* ============ 15. KAFKA ============ */
{id:"15.1", t:15, p:3, q:"Kafka để làm gì? Tại sao lại cần đến?", a:[
 "<b>Decoupling</b>: producer không cần biết có bao nhiêu consumer; thêm consumer mới không sửa producer.",
 "<b>Buffer / back-pressure</b>: hấp thụ đỉnh tải, hệ thống phía sau xử lý theo tốc độ của nó thay vì sập.",
 "<b>Chịu lỗi</b>: consumer down thì message vẫn nằm đó, khôi phục xong xử lý tiếp.",
 "<b>Fan-out</b>: một event, nhiều consumer group độc lập cùng đọc (tính tiền, gửi mail, cập nhật analytics).",
 "<b>Replay</b>: đọc lại lịch sử để sửa lỗi hoặc dựng lại state — điều mà message queue truyền thống không làm được.",
 "<b>Throughput rất cao</b>: sequential I/O, zero-copy, batching, phân vùng để scale ngang.",
 "Ứng dụng: event-driven architecture, log aggregation, CDC, stream processing, event sourcing."]},

{id:"15.2", t:15, p:3, q:"Cơ chế của Kafka: các thành phần chính", a:[
 "<b>Producer</b> → gửi record vào <b>Topic</b>; topic chia thành nhiều <b>Partition</b>.",
 "<b>Partition</b> là một <b>append-only log</b> có thứ tự; mỗi record có một <b>offset</b> tăng dần.",
 "<b>Broker</b> — server lưu partition; mỗi partition có 1 <b>leader</b> và các <b>follower</b> replica.",
 "<b>Consumer Group</b> — mỗi partition được gán cho <b>đúng một</b> consumer trong group; các group khác nhau đọc độc lập.",
 "Ghi và đọc đều qua leader; follower sao chép để chịu lỗi (<b>ISR</b> — in-sync replicas).",
 "Trước dùng <b>ZooKeeper</b> quản lý metadata; từ Kafka 3.x chuyển sang <b>KRaft</b> (Kafka tự quản bằng Raft).",
 "Hiệu năng đến từ: ghi tuần tự xuống đĩa, tận dụng page cache, zero-copy, batch và nén."]},

{id:"15.3", t:15, p:3, q:"Partition dùng để làm gì? Key quyết định partition ra sao?", a:[
 "Partition là đơn vị <b>song song hoá</b>: nhiều partition → nhiều consumer đọc cùng lúc → scale ngang.",
 "Có <b>key</b>: partition = <code>hash(key) % numPartitions</code> → mọi record cùng key luôn vào <b>cùng một partition</b> → giữ được thứ tự theo key.",
 "Không có key: phân phối luân phiên (sticky partitioner) để cân tải.",
 "Chọn key rất quan trọng: <code>userId</code>, <code>orderId</code> thường hợp lý. Key phân bố lệch → <b>hot partition</b>.",
 "<b>Tăng số partition sẽ phá vỡ ánh xạ key → partition</b>, làm mất thứ tự với dữ liệu cũ → phải tính dư ngay từ đầu.",
 "Không thể giảm số partition."]},

{id:"15.4", t:15, p:3, q:"Offset là gì? Ai quản lý offset?", a:[
 "Số thứ tự tăng dần, duy nhất trong <b>một partition</b>, đánh dấu vị trí của mỗi record.",
 "Mỗi consumer group giữ offset riêng → nhiều group đọc cùng topic mà không ảnh hưởng nhau.",
 "Offset đã commit được lưu trong <b>topic nội bộ <code>__consumer_offsets</code></b> (trước kia lưu ở ZooKeeper).",
 "Consumer tự quản lý: commit tự động theo chu kỳ, hoặc commit thủ công (<code>commitSync</code>/<code>commitAsync</code>).",
 "Reset được: <code>seek()</code>, <code>auto.offset.reset = earliest / latest</code>, hoặc công cụ <code>kafka-consumer-groups</code>.",
 "Chính vì consumer kiểm soát offset nên <b>replay</b> chỉ là chuyện tua ngược con trỏ."]},

{id:"15.5", t:15, p:3, q:"Sau khi publish, Kafka có xoá message khỏi topic không? Bao giờ mới bị release?", trap:true, anim:"kafka", a:[
 "<b>Không.</b> Kafka là <b>distributed commit log</b>, không phải queue. Consume <b>không</b> xoá gì cả.",
 "Consumer đọc xong chỉ <b>dịch offset của chính nó</b> tiến lên; record vẫn nằm nguyên trên đĩa.",
 "Message chỉ biến mất theo <b>retention policy</b>, hoàn toàn không liên quan tới việc đã được đọc hay chưa:",
 "<b><code>retention.ms</code></b> — theo thời gian, mặc định <b>7 ngày</b>.",
 "<b><code>retention.bytes</code></b> — theo dung lượng của mỗi partition.",
 "<b><code>cleanup.policy = compact</code></b> — log compaction: giữ lại <b>bản ghi mới nhất của mỗi key</b>, xoá các bản cũ hơn. Dùng cho topic mang trạng thái (changelog, cấu hình).",
 "Xoá diễn ra theo <b>segment file</b>, không xoá từng record lẻ.",
 "Đây chính là nền tảng của khả năng <b>replay</b>: consumer mới thêm vào hôm nay vẫn đọc lại được 7 ngày dữ liệu — điều RabbitMQ không làm được."]},

{id:"15.6", t:15, p:3, q:"Phân biệt Kafka vs RabbitMQ", a:[
 "<b>Mô hình</b>: Kafka là log lưu trữ (dumb broker, smart consumer); RabbitMQ là message broker truyền thống (smart broker, dumb consumer).",
 "<b>Sau khi đọc</b>: Kafka <b>giữ lại</b> theo retention; RabbitMQ <b>xoá</b> message khi được ack.",
 "<b>Replay</b>: Kafka có; RabbitMQ không (phải tự lưu chỗ khác).",
 "<b>Định tuyến</b>: RabbitMQ mạnh hơn hẳn — exchange direct/topic/fanout/headers, routing key linh hoạt, priority queue, TTL, DLQ dựng sẵn. Kafka chỉ có topic + partition.",
 "<b>Throughput</b>: Kafka cao hơn nhiều (hàng triệu msg/s); RabbitMQ hàng chục nghìn.",
 "<b>Thứ tự</b>: Kafka đảm bảo trong một partition; RabbitMQ đảm bảo trong một queue với một consumer.",
 "<b>Chọn Kafka</b> khi: event streaming, cần replay, nhiều consumer độc lập, lưu lượng lớn, event sourcing.",
 "<b>Chọn RabbitMQ</b> khi: task queue, cần routing phức tạp, cần priority/delay, độ trễ thấp cho từng message, hệ thống vừa và nhỏ."]},

{id:"15.7", t:15, p:3, q:"Consumer Group hoạt động thế nào? Nếu consumer nhiều hơn partition?", a:[
 "Mỗi partition được gán cho <b>đúng một</b> consumer trong cùng group — đảm bảo không xử lý trùng và giữ thứ tự.",
 "Một consumer có thể nhận nhiều partition.",
 "<b>Consumer nhiều hơn partition → số dư sẽ ngồi không</b>, hoàn toàn không nhận gì.",
 "→ Số partition là <b>trần</b> của khả năng song song trong một group. Muốn scale thêm phải tăng partition.",
 "Nhiều group khác nhau đọc cùng topic hoàn toàn độc lập, mỗi group một offset riêng.",
 "Consumer chết hoặc lỡ heartbeat → <b>rebalance</b>, partition được chia lại."]},

{id:"15.8", t:15, p:2, q:"Rebalancing là gì? Tác hại và cách giảm thiểu?", a:[
 "Việc phân bổ lại partition cho các consumer khi có thành viên vào/ra, hoặc số partition thay đổi.",
 "Tác hại: <b>stop-the-world</b> — toàn bộ group ngừng tiêu thụ trong lúc rebalance; xử lý dở dang có thể bị lặp lại.",
 "Nguyên nhân phổ biến: xử lý một batch lâu hơn <code>max.poll.interval.ms</code> (mặc định 5 phút) → bị coi là chết; GC pause dài; deploy rolling.",
 "Giảm thiểu: đặt <code>max.poll.records</code> nhỏ lại, tăng <code>max.poll.interval.ms</code>, tách xử lý nặng sang thread khác.",
 "Dùng <b>CooperativeStickyAssignor</b> (incremental rebalance) — chỉ chuyển phần cần thiết thay vì thu hồi hết.",
 "Dùng <code>group.instance.id</code> (static membership) để restart không kích hoạt rebalance."]},

{id:"15.9", t:15, p:3, q:"Đảm bảo thứ tự message trong Kafka bằng cách nào?", a:[
 "Kafka <b>chỉ</b> đảm bảo thứ tự <b>trong phạm vi một partition</b>, không có thứ tự toàn cục trên topic.",
 "→ Muốn giữ thứ tự cho một thực thể: dùng <b>key</b> cố định (<code>orderId</code>) để mọi event của nó vào cùng partition.",
 "Producer cần <code>max.in.flight.requests.per.connection = 1</code>, hoặc bật <code>enable.idempotence = true</code> (cho phép tới 5 mà vẫn giữ thứ tự).",
 "Consumer xử lý <b>đa luồng</b> trong cùng partition sẽ phá vỡ thứ tự → nếu cần song song thì phải phân luồng theo key.",
 "Retry sang topic khác cũng làm mất thứ tự — cần cân nhắc khi thiết kế DLQ.",
 "Đánh đổi: một partition cho mỗi key group nghĩa là giới hạn khả năng song song."]},

{id:"15.10", t:15, p:3, q:"Delivery semantics: at-most-once, at-least-once, exactly-once", a:[
 "<b>At-most-once</b>: commit offset <b>trước</b> khi xử lý → lỗi thì mất message. Hiếm khi chấp nhận được.",
 "<b>At-least-once</b> (mặc định, phổ biến nhất): xử lý xong mới commit → crash giữa chừng thì xử lý lại → <b>có thể trùng</b>.",
 "<b>Exactly-once</b>: Kafka hỗ trợ qua <b>idempotent producer</b> (<code>enable.idempotence=true</code>, dùng PID + sequence number để khử trùng) và <b>transaction</b> (<code>transactional.id</code>) cho luồng consume-process-produce trong nội bộ Kafka.",
 "Giới hạn quan trọng: exactly-once chỉ trọn vẹn <b>trong phạm vi Kafka</b>. Ghi ra hệ thống ngoài (DB, API) thì Kafka không đảm bảo được.",
 "→ Thực tế: chọn <b>at-least-once + consumer idempotent</b>, đây là kiến trúc bền vững nhất.",
 "Exactly-once cũng làm giảm throughput và tăng độ phức tạp đáng kể."]},

{id:"15.11", t:15, p:3, q:"Consumer xử lý trùng message thì sao? Idempotent consumer thiết kế thế nào?", trap:true, a:[
 "Trùng là <b>chuyện bình thường</b> với at-least-once — phải thiết kế để chịu được, không phải cố loại bỏ.",
 "<b>Khoá idempotency</b>: mỗi message mang ID duy nhất (<code>eventId</code>, hoặc <code>topic-partition-offset</code>); lưu vào bảng <code>processed_events</code> với unique constraint.",
 "Ghi bản ghi 'đã xử lý' và ghi dữ liệu nghiệp vụ <b>trong cùng một transaction DB</b> → nếu trùng thì insert vi phạm unique và bỏ qua an toàn.",
 "<b>Upsert</b>: thiết kế thao tác vốn đã idempotent (<code>INSERT ... ON CONFLICT DO UPDATE</code>, gán giá trị tuyệt đối thay vì cộng dồn).",
 "<b>Kiểm tra trạng thái</b>: 'nếu đơn hàng đã ở trạng thái PAID thì bỏ qua'.",
 "Dùng Redis làm bộ khử trùng nhanh cũng được, nhưng cần chấp nhận rủi ro khi Redis mất dữ liệu.",
 "Đừng quên dọn bảng khoá idempotency theo thời gian."]},

{id:"15.12", t:15, p:3, q:"acks=0/1/all, ISR, replication factor", a:[
 "<b>acks=0</b> — không chờ xác nhận; nhanh nhất, mất dữ liệu dễ dàng.",
 "<b>acks=1</b> — chờ leader ghi xong; leader chết trước khi replica kịp sao chép thì mất.",
 "<b>acks=all</b> (hoặc <code>-1</code>) — chờ tất cả replica trong <b>ISR</b> xác nhận; an toàn nhất.",
 "<b>ISR (In-Sync Replicas)</b>: các replica đang bắt kịp leader. Tụt lại quá lâu thì bị loại khỏi ISR.",
 "<code>acks=all</code> phải đi kèm <b><code>min.insync.replicas = 2</code></b> — nếu không, ISR co lại còn 1 thì 'all' chỉ còn nghĩa là leader.",
 "Cấu hình an toàn tiêu chuẩn: <code>replication.factor=3</code>, <code>min.insync.replicas=2</code>, <code>acks=all</code> → chịu được mất 1 broker.",
 "<code>unclean.leader.election.enable=false</code> để không bầu replica lạc hậu làm leader (tránh mất dữ liệu)."]},

{id:"15.13", t:15, p:3, q:"Auto-commit vs manual commit offset — rủi ro?", a:[
 "<b>Auto-commit</b> (<code>enable.auto.commit=true</code>, mỗi 5 giây): commit theo chu kỳ, <b>không quan tâm xử lý xong hay chưa</b>.",
 "→ Rủi ro <b>mất message</b>: offset đã commit nhưng xử lý thất bại sau đó.",
 "→ Cũng có rủi ro <b>xử lý lặp</b>: crash trước chu kỳ commit kế tiếp.",
 "<b>Manual commit</b>: xử lý xong mới <code>commitSync()</code> → at-least-once rõ ràng, kiểm soát được.",
 "<code>commitSync</code> chắc chắn nhưng chậm; <code>commitAsync</code> nhanh, nên kết hợp: async trong vòng lặp, sync khi đóng.",
 "Spring Kafka: đặt <code>AckMode.MANUAL_IMMEDIATE</code> và gọi <code>ack.acknowledge()</code>.",
 "Với nghiệp vụ quan trọng, luôn dùng manual commit."]},

{id:"15.14", t:15, p:2, q:"Dead Letter Topic và chiến lược retry", a:[
 "Message lỗi lặp lại sẽ <b>chặn cả partition</b> (head-of-line blocking) — vì Kafka phải xử lý theo thứ tự offset.",
 "<b>Retry ngay tại chỗ</b>: hợp với lỗi tạm thời (mạng chập chờn), số lần ít, có backoff.",
 "<b>Retry topic</b>: đẩy sang topic riêng có độ trễ khác nhau (retry-5s, retry-1m, retry-10m) → không chặn luồng chính.",
 "<b>DLT (Dead Letter Topic)</b>: hết số lần thử thì đưa sang đây kèm nguyên nhân lỗi, để xử lý thủ công hoặc phát lại.",
 "Spring Kafka: <code>DefaultErrorHandler</code> + <code>DeadLetterPublishingRecoverer</code>.",
 "Phân biệt rõ: lỗi <b>tạm thời</b> thì retry; lỗi <b>vĩnh viễn</b> (dữ liệu sai định dạng) thì đưa thẳng DLT, retry chỉ tốn tài nguyên.",
 "Nhớ đặt cảnh báo trên DLT — DLT không ai theo dõi thì cũng như vứt đi."]},

{id:"15.15", t:15, p:3, q:"Consumer lag là gì? Monitor và xử lý thế nào?", a:[
 "Lag = <code>log-end-offset</code> (offset mới nhất) − <code>committed-offset</code> của consumer group. Đơn vị: số message chưa xử lý.",
 "Lag tăng đều = consumer xử lý chậm hơn producer sản xuất → sẽ tệ dần chứ không tự khỏi.",
 "Theo dõi: <code>kafka-consumer-groups --describe</code>, Burrow, Kafka Exporter + Prometheus, hoặc metrics của Spring Kafka.",
 "Xử lý: tăng số consumer (chỉ hiệu quả nếu <b>còn partition trống</b>), tăng partition, tối ưu code xử lý (bỏ lời gọi đồng bộ chậm, batch ghi DB), tăng <code>max.poll.records</code>.",
 "Nếu nghẽn ở I/O ngoài: xử lý song song theo key trong cùng partition, hoặc chuyển ghi DB sang batch.",
 "Đặt cảnh báo theo lag <b>và</b> theo độ trễ thời gian (lag tính bằng giây có ý nghĩa hơn số message)."]},

{id:"15.16", t:15, p:2, q:"Spring Kafka: @KafkaListener, KafkaTemplate, error handling", a:[
 "<code>KafkaTemplate.send()</code> trả về <code>CompletableFuture</code> — nên xử lý callback, đừng bỏ qua lỗi gửi.",
 "<code>@KafkaListener(topics = \"...\", groupId = \"...\")</code>; cấu hình concurrency = số thread (không vượt quá số partition).",
 "<code>ConcurrentKafkaListenerContainerFactory</code> để cấu hình chung: ackMode, error handler, retry.",
 "<code>DefaultErrorHandler</code> + <code>FixedBackOff</code>/<code>ExponentialBackOff</code> + <code>DeadLetterPublishingRecoverer</code>.",
 "Batch listener (<code>List&lt;ConsumerRecord&gt;</code>) tăng throughput nhưng làm xử lý lỗi phức tạp hơn.",
 "Nhớ cấu hình serializer/deserializer và <code>ErrorHandlingDeserializer</code> để một message hỏng định dạng không làm chết listener."]},

{id:"15.17", t:15, p:1, q:"Kafka bỏ ZooKeeper (KRaft mode) — thay đổi gì?", a:[
 "Trước: ZooKeeper giữ metadata (broker, topic, ACL, controller election) → phải vận hành hai cụm.",
 "<b>KRaft</b>: Kafka tự quản metadata bằng giao thức Raft, metadata lưu trong chính một topic nội bộ.",
 "Lợi ích: một hệ thống thay vì hai, khởi động và failover nhanh hơn, hỗ trợ số partition lớn hơn nhiều.",
 "KRaft ổn định cho production từ Kafka 3.3; ZooKeeper bị gỡ bỏ ở Kafka 4.0.",
 "Với lập trình viên ứng dụng thì API không đổi — đây là thay đổi ở tầng vận hành."]},

/* ============ 16. DESIGN PATTERNS ============ */
{id:"16.1", t:16, p:3, q:"Singleton là gì? Các cách implement trong Java?", a:[
 "Đảm bảo một class chỉ có <b>một instance</b> và cung cấp điểm truy cập toàn cục.",
 "<b>Eager</b>: <code>private static final X INSTANCE = new X();</code> — thread-safe, đơn giản, nhưng tạo cả khi không dùng.",
 "<b>Lazy + synchronized method</b>: đúng nhưng khoá mọi lần gọi → chậm.",
 "<b>Double-checked locking</b>: cần <code>volatile</code>, sẽ nói ở câu sau.",
 "<b>Bill Pugh (static holder)</b>: <code>private static class Holder { static final X I = new X(); }</code> — lazy, thread-safe nhờ đảm bảo của classloader, không cần khoá.",
 "<b>Enum</b>: ngắn nhất và an toàn nhất.",
 "Nhược điểm chung: khó test, che giấu dependency, là state toàn cục → trong Spring nên dùng bean singleton thay vì tự viết."]},

{id:"16.2", t:16, p:3, q:"Double-checked locking cần volatile không và TẠI SAO?", trap:true, a:[
 "<b>Bắt buộc cần <code>volatile</code>.</b>",
 "<code>instance = new Singleton()</code> không phải một thao tác nguyên tử: (1) cấp phát bộ nhớ, (2) gọi constructor, (3) gán reference.",
 "JVM/CPU được phép <b>reorder</b> bước 2 và 3 → reference được gán khi object <b>chưa khởi tạo xong</b>.",
 "Thread khác đọc thấy <code>instance != null</code> ở lần kiểm tra đầu (không khoá) → nhận về object <b>nửa vời</b> → lỗi rất khó tái hiện.",
 "<code>volatile</code> chèn memory barrier, cấm reorder và đảm bảo visibility.",
 "Lưu ý lịch sử: trước Java 5, mô hình bộ nhớ chưa đủ mạnh nên double-checked locking <b>hỏng ngay cả khi có volatile</b>."]},

{id:"16.3", t:16, p:2, q:"Cách implement Singleton tốt nhất trong Java?", a:[
 "<b>Enum singleton</b> — theo khuyến nghị trong <i>Effective Java</i>.",
 "Thread-safe do JVM đảm bảo khi khởi tạo enum.",
 "Chống <b>serialization</b>: enum không tạo instance mới khi deserialize.",
 "Chống <b>reflection</b>: JVM cấm gọi constructor của enum qua reflection — các cách khác đều phá được bằng <code>setAccessible(true)</code>.",
 "Nhược: không lazy, và không kế thừa class khác được.",
 "Cần lazy → dùng <b>static holder</b> của Bill Pugh."]},

{id:"16.4", t:16, p:2, q:"Factory Method vs Abstract Factory", a:[
 "<b>Factory Method</b>: một method (thường trong class con) quyết định tạo ra object nào. Tạo <b>một</b> loại sản phẩm.",
 "<b>Abstract Factory</b>: một interface tạo ra <b>cả một họ</b> sản phẩm liên quan nhau, đảm bảo chúng tương thích.",
 "Ví dụ Factory Method: <code>createPaymentProcessor(type)</code>.",
 "Ví dụ Abstract Factory: <code>UIFactory</code> tạo Button + Checkbox + Menu đồng bộ theo một theme.",
 "Trong JDK: <code>Calendar.getInstance()</code>, <code>NumberFormat.getInstance()</code>, <code>DocumentBuilderFactory</code>.",
 "Trong Spring, phần lớn nhu cầu factory được thay bằng DI + <code>@Qualifier</code> hoặc inject <code>Map&lt;String, Strategy&gt;</code>."]},

{id:"16.5", t:16, p:2, q:"Builder pattern — khi nào dùng?", a:[
 "Khi object có nhiều tham số, đặc biệt nhiều tham số <b>tuỳ chọn</b> — thay cho telescoping constructor.",
 "Cho phép tạo object <b>immutable</b> mà vẫn dễ đọc ở nơi gọi.",
 "Đặt validate trong <code>build()</code> để object không bao giờ ra đời ở trạng thái sai.",
 "Trong JDK/thư viện: <code>StringBuilder</code>, <code>Stream.Builder</code>, <code>HttpRequest.newBuilder()</code>, Lombok <code>@Builder</code>.",
 "Cẩn thận với Lombok <code>@Builder</code>: dễ vô tình bỏ sót field bắt buộc vì không có kiểm tra lúc compile."]},

{id:"16.6", t:16, p:3, q:"Strategy pattern và cách Spring tận dụng nó", a:[
 "Đóng gói mỗi thuật toán/hành vi vào một class riêng cùng interface, chọn lúc runtime → thay cho <code>if/else</code> hoặc <code>switch</code> dài.",
 "Trong Spring: inject <code>List&lt;PaymentStrategy&gt;</code> hoặc <code>Map&lt;String, PaymentStrategy&gt;</code> — Spring tự gom <b>mọi</b> bean cùng kiểu.",
 "Với Map, <b>key chính là tên bean</b> → tra thẳng theo mã nghiệp vụ.",
 "Thêm phương thức thanh toán mới = thêm một bean, <b>không sửa</b> code cũ → đúng Open/Closed Principle.",
 "Đây là một trong những mẫu hữu ích và dễ áp dụng nhất trong dự án Spring thực tế.",
 "Nếu mỗi strategy cần biết mình xử lý loại nào: thêm method <code>supports(type)</code> vào interface."]},

{id:"16.7", t:16, p:2, q:"Dependency Injection có phải design pattern không?", a:[
 "Có — thường xếp vào nhóm <b>structural/creational</b>, dù không nằm trong 23 mẫu GoF gốc.",
 "Là một cách hiện thực nguyên lý <b>IoC</b>, và phục vụ trực tiếp nguyên lý <b>Dependency Inversion</b> trong SOLID.",
 "Liên quan chặt tới <b>Factory</b> (container đóng vai trò factory) và <b>Service Locator</b> (giải pháp thay thế, nay bị coi là anti-pattern vì giấu dependency).",
 "Điểm khác biệt then chốt so với Service Locator: DI khiến dependency <b>hiện rõ</b> trong signature, còn Service Locator giấu nó vào thân method."]},

{id:"16.8", t:16, p:2, q:"Template Method — ví dụ trong Spring", a:[
 "Class cha định nghĩa <b>khung xử lý</b>, để lại một số bước cho class con hoặc callback.",
 "<code>JdbcTemplate</code>: lo mở/đóng connection, xử lý exception, dọn tài nguyên; bạn chỉ cung cấp SQL và <code>RowMapper</code>.",
 "Tương tự: <code>RestTemplate</code>, <code>TransactionTemplate</code>, <code>KafkaTemplate</code>.",
 "Giá trị: gom hết phần lặp đi lặp lại và dễ sai (dọn tài nguyên) vào một chỗ.",
 "Trong JDK: <code>AbstractList</code>, <code>InputStream</code>."]},

{id:"16.9", t:16, p:3, q:"Proxy pattern — Spring AOP dùng nó ra sao", anim:"proxy", a:[
 "Proxy đứng thay object thật, cùng interface, thêm hành vi trước/sau khi ủy quyền lời gọi.",
 "Spring tạo proxy ở bước <code>BeanPostProcessor</code>: bean được inject vào nơi khác thực chất là <b>proxy</b>, không phải object gốc.",
 "Nhờ đó có: <code>@Transactional</code>, <code>@Cacheable</code>, <code>@Async</code>, <code>@PreAuthorize</code>, <code>@Retryable</code>.",
 "JDK Dynamic Proxy (có interface) hoặc CGLIB (sinh class con).",
 "Hệ quả bắt buộc phải nhớ: lời gọi <b>nội bộ</b> không qua proxy → mọi annotation trên đều mất tác dụng.",
 "Hibernate cũng dùng proxy cho lazy loading — nguồn gốc của <code>LazyInitializationException</code>."]},

{id:"16.10", t:16, p:1, q:"Observer pattern — Spring Application Events", a:[
 "Một đối tượng thay đổi trạng thái thì thông báo cho các đối tượng đăng ký, không cần biết chúng là ai.",
 "Spring: <code>ApplicationEventPublisher.publishEvent()</code> + <code>@EventListener</code>.",
 "<code>@TransactionalEventListener(phase = AFTER_COMMIT)</code> — chỉ chạy <b>sau khi commit thành công</b>, rất hữu ích để tránh gửi thông báo cho dữ liệu sau đó bị rollback.",
 "Mặc định event xử lý <b>đồng bộ</b> trong cùng thread; thêm <code>@Async</code> nếu muốn tách ra.",
 "Dùng tốt để giảm coupling giữa các module trong monolith — bước đệm tự nhiên trước khi tách microservices."]},

{id:"16.11", t:16, p:3, q:"SOLID principles — cho ví dụ vi phạm và cách sửa", a:[
 "<b>S — Single Responsibility</b>: một class một lý do để thay đổi. Vi phạm: service vừa xử lý nghiệp vụ vừa render email vừa gọi API.",
 "<b>O — Open/Closed</b>: mở để mở rộng, đóng để sửa đổi. Vi phạm: mỗi loại thanh toán mới lại thêm một nhánh <code>if</code>. Sửa: Strategy.",
 "<b>L — Liskov Substitution</b>: class con phải thay thế được class cha mà không phá vỡ hành vi. Vi phạm kinh điển: <code>Square extends Rectangle</code>; hoặc override rồi ném <code>UnsupportedOperationException</code>.",
 "<b>I — Interface Segregation</b>: nhiều interface nhỏ tốt hơn một interface to. Vi phạm: interface 20 method mà implementation chỉ dùng 3.",
 "<b>D — Dependency Inversion</b>: phụ thuộc vào abstraction, không phụ thuộc chi tiết. Vi phạm: service <code>new PostgresRepository()</code> trực tiếp. Sửa: inject interface.",
 "Nên chuẩn bị <b>một ví dụ thật</b> từ dự án của bạn cho mỗi nguyên lý — đó là điều phân biệt câu trả lời thuộc lòng và trải nghiệm thật."]},

{id:"16.12", t:16, p:2, q:"Repository pattern, Unit of Work", a:[
 "<b>Repository</b>: trừu tượng hoá tầng lưu trữ, cho tầng nghiệp vụ làm việc với collection object thay vì SQL.",
 "Lợi ích: thay đổi công nghệ lưu trữ không ảnh hưởng nghiệp vụ; dễ mock khi test.",
 "<b>Unit of Work</b>: gom các thay đổi lại, ghi xuống một lần trong cùng transaction.",
 "Hibernate <b>Persistence Context chính là Unit of Work</b>: theo dõi entity thay đổi rồi flush một lượt.",
 "Spring Data JPA hiện thực Repository bằng cách sinh implementation lúc runtime từ interface.",
 "Tranh luận đáng biết: nhiều người cho rằng bọc thêm repository lên Spring Data JPA là dư thừa, trừ khi cần cách ly thật sự với domain."]},

{id:"16.13", t:16, p:3, q:"Các design pattern bạn đã dùng thực tế? Giải quyết vấn đề gì?", a:[
 "Đây là câu hỏi về <b>trải nghiệm</b>, không phải định nghĩa — hãy kể chuyện cụ thể.",
 "Cấu trúc trả lời: bối cảnh vấn đề → vì sao cách cũ không ổn → chọn mẫu nào → kết quả đo được.",
 "Ví dụ mạnh: 'Có 6 nhà cung cấp thanh toán, code cũ là một <code>switch</code> 200 dòng, mỗi lần thêm đối tác phải sửa file đó và regression. Chuyển sang Strategy với <code>Map&lt;String, PaymentStrategy&gt;</code>, thêm đối tác chỉ là thêm một class.'",
 "Nên nhắc cả trường hợp bạn <b>quyết định không dùng</b> pattern vì thấy over-engineering — điều đó cho thấy sự chín chắn.",
 "Tránh liệt kê tên mẫu mà không có ngữ cảnh."]},

/* ============ 17. TÌNH HUỐNG ============ */
{id:"17.1", t:17, p:3, q:"Kể một lần bạn debug production incident. Quy trình bạn làm?", a:[
 "Cấu trúc nên theo: <b>giảm thiểu thiệt hại trước, tìm nguyên nhân sau</b>.",
 "1. Xác định phạm vi: bao nhiêu user, tính năng nào, bắt đầu từ khi nào.",
 "2. Kiểm tra thay đổi gần nhất — phần lớn sự cố đến từ deploy hoặc đổi cấu hình.",
 "3. Giảm thiệt hại: rollback, tắt feature flag, scale tạm.",
 "4. Thu thập bằng chứng: log, metrics, trace, thread dump, heap dump — <b>trước khi restart</b>, vì restart xoá sạch dấu vết.",
 "5. Tìm nguyên nhân gốc, sửa, thêm test và alert để không tái diễn.",
 "6. Viết <b>postmortem không đổ lỗi</b>.",
 "Người phỏng vấn nghe cái gì: bạn có bình tĩnh, có ưu tiên đúng, và có rút ra bài học hệ thống hay không."]},

{id:"17.2", t:17, p:3, q:"API chậm đột ngột — bạn điều tra theo thứ tự nào?", a:[
 "Xác định chậm ở đâu bằng <b>distributed tracing</b> trước, đừng đoán.",
 "Phân biệt: chậm <b>đều</b> (thiết kế/tài nguyên) hay chỉ <b>p99</b> (GC pause, lock contention, hot key, cache miss).",
 "Tầng ứng dụng: GC log (Full GC dày?), thread dump (thread chờ ở đâu?), thread pool có cạn không.",
 "Tầng DB: <code>pg_stat_statements</code>, slow query log, N+1, index bị bỏ qua sau khi dữ liệu tăng, lock chờ.",
 "Tầng kết nối: Hikari pending connections, timeout của HTTP client, DNS.",
 "Yếu tố ngoài: dependency chậm, tải tăng, batch job chạy trùng giờ, cache vừa bị xoá (cache stampede).",
 "Nhấn mạnh: <b>đo trước, sửa sau</b> — và nên có sẵn dashboard để không phải điều tra từ số không."]},

{id:"17.3", t:17, p:3, q:"Service bị OOM sau vài ngày chạy — hướng xử lý?", a:[
 "'Sau vài ngày' là dấu hiệu điển hình của <b>memory leak</b>, không phải heap nhỏ.",
 "Bật sẵn <code>-XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=...</code> để có bằng chứng khi sự cố tái diễn.",
 "Theo dõi Old Gen theo thời gian: nếu <b>không tụt xuống</b> sau Full GC thì chắc chắn có leak.",
 "Phân tích heap dump bằng MAT, xem <b>Dominator Tree</b> và <b>Leak Suspects</b> để biết object nào giữ nhiều bộ nhớ nhất.",
 "Nghi phạm thường gặp: cache không giới hạn, static collection, <code>ThreadLocal</code> không remove, listener không gỡ, kết nối không đóng, <code>ScheduledExecutor</code> tích luỹ task.",
 "Biện pháp tạm: restart định kỳ, tăng heap, đặt alert — nhưng phải nói rõ đó chỉ là cầm cự.",
 "Ngừa lâu dài: cache có TTL và giới hạn kích thước (Caffeine), test soak dài ngày."]},

{id:"17.4", t:17, p:3, q:"Thiết kế hệ thống xử lý 10k request/s — bạn bắt đầu từ đâu?", a:[
 "Làm rõ yêu cầu trước: đọc hay ghi nhiều? kích thước payload? yêu cầu latency? mức nhất quán? đỉnh hay đều?",
 "Ước lượng thô: 10k rps, mỗi request 10ms CPU → cần khoảng 100 core → quy ra số instance.",
 "Chiến lược chung: stateless app + scale ngang; đưa việc nặng ra khỏi đường đi của request (async qua Kafka).",
 "Tầng dữ liệu thường là điểm nghẽn thật sự: cache (Redis) cho đọc, read replica, sharding hoặc partition khi ghi lớn.",
 "Bảo vệ hệ thống: rate limit ở gateway, circuit breaker, bulkhead, load shedding khi quá tải.",
 "Đừng quên: connection pool phải tính đúng, tránh N+1, dùng batch, nén payload.",
 "Quan sát được: metrics, tracing, alert theo SLO — không đo được thì không vận hành được ở quy mô này.",
 "Kết bằng trade-off, và nói rõ bạn sẽ <b>đo bằng load test</b> thay vì tin vào ước lượng."]},

{id:"17.5", t:17, p:2, q:"Bạn đảm bảo chất lượng code trong team thế nào?", a:[
 "Code review có tiêu chí rõ ràng, PR nhỏ, phản hồi nhanh — PR lớn thì review chỉ còn hình thức.",
 "Test pyramid: nhiều unit test, vừa phải integration test, ít e2e test.",
 "CI bắt buộc: build + test + static analysis (SonarQube, SpotBugs) + kiểm tra CVE của dependency.",
 "Chuẩn hoá tự động thay vì tranh luận: formatter, checkstyle, quy ước đặt tên.",
 "Với vai trò senior: viết ADR cho quyết định kiến trúc, pair programming khi onboard, chia sẻ kiến thức định kỳ.",
 "Nhấn mạnh: mục tiêu là <b>giảm rủi ro và tăng tốc độ giao hàng</b>, không phải đạt 100% coverage."]},

{id:"17.6", t:17, p:3, q:"Chiến lược test: @SpringBootTest vs @WebMvcTest vs @DataJpaTest?", a:[
 "<b>Unit test</b> — không Spring, mock dependency bằng Mockito. Nhanh nhất, nên chiếm đa số.",
 "<b><code>@WebMvcTest</code></b> — chỉ nạp tầng web (controller, filter, converter); mock service bằng <code>@MockBean</code>. Test validation, mapping, status code.",
 "<b><code>@DataJpaTest</code></b> — chỉ nạp tầng JPA; mặc định dùng DB nhúng và <b>rollback sau mỗi test</b>. Test query và mapping entity.",
 "<b><code>@SpringBootTest</code></b> — nạp toàn bộ context, chậm nhất; dùng cho luồng end-to-end quan trọng.",
 "<b>Testcontainers</b> — chạy PostgreSQL/Kafka thật trong Docker; đáng dùng vì H2 hành xử khác PostgreSQL ở nhiều chỗ (kiểu dữ liệu, index, hàm).",
 "Mẹo hiệu năng: giữ ít cấu hình context khác nhau để Spring <b>tái sử dụng cache context</b> giữa các test class.",
 "Với code có transaction, nhớ rằng test <code>@Transactional</code> tự rollback — có thể che giấu lỗi flush."]},

{id:"17.7", t:17, p:2, q:"Bạn từng đưa ra quyết định kỹ thuật nào mà sau này thấy sai? Rút ra gì?", a:[
 "Câu hỏi kiểm tra <b>sự tự nhận thức</b> — trả lời 'tôi chưa sai bao giờ' là mất điểm nặng.",
 "Chọn một quyết định thật, có hậu quả thật, và bạn đã tự sửa.",
 "Cấu trúc: bối cảnh và lý do lúc đó → điều gì đã sai → bạn phát hiện ra sao → sửa thế nào → giờ bạn làm khác đi ở điểm nào.",
 "Ví dụ tốt: tách microservices quá sớm khi domain chưa rõ, dẫn tới phải gọi chéo liên tục và sau đó phải gộp lại.",
 "Tránh 'điểm yếu giả' kiểu 'tôi quá cầu toàn'.",
 "Kết bằng một nguyên tắc cụ thể bạn rút ra và đang áp dụng."]}
];

.aSlide{opacity:0;animation:slideR .4s ease forwards}
.aDraw{stroke-dasharray:400;stroke-dashoffset:400;animation:draw 1s ease forwards}
.aBlink{animation:blink 1.1s ease-in-out infinite}
.aShake{animation:shake .38s ease 2}
.aGrow{transform-origin:left;animation:grow .6s cubic-bezier(.3,.9,.4,1) forwards}

.cells{display:flex;gap:3px;justify-content:center;flex-wrap:wrap}
.cell{width:31px;height:31px;border:1px solid var(--line);border-radius:5px;background:var(--panel);
  font-family:var(--mono);font-size:9.5px;display:flex;align-items:center;justify-content:center;
  color:var(--dim);position:relative;flex:none}
.cell.f{background:rgba(76,158,235,.16);border-color:var(--azure);color:#A9CDF3}
.cell.g{background:rgba(63,208,142,.16);border-color:var(--mint);color:var(--mint)}
.cell.r{background:rgba(226,86,74,.15);border-color:var(--ember);color:var(--ember)}
.cell.y{background:rgba(245,166,35,.15);border-color:var(--amber);color:var(--amber)}
.cell.x{opacity:.22}
.ptr{position:absolute;top:-15px;left:50%;transform:translateX(-50%);
  font-family:var(--mono);font-size:9px;color:var(--amber);white-space:nowrap}
.bucketrow{display:flex;align-items:flex-start;gap:5px;margin-bottom:5px}
.bidx{font-family:var(--mono);font-size:9.5px;color:var(--dim);width:26px;
  text-align:right;padding-top:8px;flex:none}
.node{border:1px solid var(--line);border-radius:5px;background:var(--panel);padding:4px 8px;
  font-family:var(--mono);font-size:10px;color:var(--muted);flex:none}
.arw{color:var(--dim);font-size:10px;padding-top:5px}
.stk{border:1px solid var(--line);border-radius:7px;background:var(--panel);
  padding:7px 11px;font-family:var(--mono);font-size:10.5px;text-align:center}
.legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:13px;
  font-family:var(--mono);font-size:10px;color:var(--dim)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;
  vertical-align:middle}
.split{display:grid;grid-template-columns:1fr 1fr;gap:13px}
@media(max-width:560px){.split{grid-template-columns:1fr}}
.panel{border:1px solid var(--line);border-radius:9px;background:var(--panel);padding:13px 11px}
.panel h5{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  margin-bottom:11px;text-align:center}
.panel.bad h5{color:var(--ember)} .panel.good h5{color:var(--mint)}
.bars{display:flex;flex-direction:column;gap:4px}
.bar{height:11px;border-radius:3px;background:var(--azure);opacity:.85}
.bar.r{background:var(--ember)} .bar.g{background:var(--mint)}
.qline{font-family:var(--mono);font-size:9.5px;color:var(--muted);padding:2px 0;
  border-left:2px solid var(--line);padding-left:7px;margin-bottom:2px}
.qline.r{border-color:var(--ember);color:#F0A79E}
.qline.g{border-color:var(--mint);color:#9BE8C4}
`;

hashmap:()=>`

tới <b>8 phần tử</b> (và capacity ≥ 64) thì treeify thành <b>red-black tree</b>, O(n) → O(log n).</div>`,

/* ============ APP ============ */

/* ---- storage: window.storage → memory fallback ---- */
const mem = {};
const store = {
  async get(k) {
    try { const r = await window.storage.get(k); return r ? JSON.parse(r.value) : null; }
    catch (e) { return mem[k] ?? null; }
  },
  async set(k, v) {
    try { await window.storage.set(k, JSON.stringify(v)); }
    catch (e) { mem[k] = v; }
  }
};
const KEY = 'javadrill:mastery';

let mastery = {};                 // qid -> 1|2|3  (mức tự chấm gần nhất)

const shuffle = a => { const x = a.slice(); for (let i = x.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0;[x[i], x[j]] = [x[j], x[i]]; } return x; };

/* ================= SETUP ================= */
let selTopics = new Set(TOPICS.map(t => t.id));

function countPool() {

    (selMode !== 'traps' || q.trap) &&
    (selMode !== 'weak' || (mastery[q.id] || 0) < 3)).length;
}

      ${[
      ['drill', 'Luyện tập', 'Lặp lại giãn cách. Câu chưa nhớ sẽ quay lại trong phiên.'],

  });
  app.querySelectorAll('[data-p]').forEach(b => b.onclick = () => {
    const p = +b.dataset.p; selPrio.has(p) ? selPrio.delete(p) : selPrio.add(p); renderSetup();
  });

/* ================= SESSION ================= */
function start() {
  let pool = ALL.filter(q => selTopics.has(q.t) && selPrio.has(q.p) &&
    (selMode !== 'traps' || q.trap) &&
    (selMode !== 'weak' || (mastery[q.id] || 0) < 3));
  pool = shuffle(pool);
  if (selMode === 'mock') pool = pool.slice(0, 20);
  else pool.sort((a, b) => b.p - a.p);

  S = {
    pool: pool.map(q => q.id),
    queue: pool.map(q => q.id), total: pool.length, done: new Set(),
    i: 0, revealed: false, t0: 0, timer: null, secs: 0,
    hist: {}, seen: 0
  };
  document.body.classList.add('drilling');
  quitBtn.style.display = '';
  quitBtn.onclick = () => { stopTimer(); renderDone(); };
  renderCard();
}

function stopTimer() { if (S && S.timer) { clearInterval(S.timer); S.timer = null; } }

function renderCard() {
  if (S.i >= S.queue.length) { stopTimer(); return renderDone(); }
  const q = ALL.find(x => x.id === S.queue[S.i]);
  const t = TMAP[q.t];
  S.revealed = false; S.secs = 0;

  ctr.innerHTML = `<b>${S.done.size}</b>/${S.total} thuộc · còn ${S.queue.length - S.i}`;
  prog.style.width = (S.done.size / S.total * 100) + '%';

  app.innerHTML = `

    <span class="tag p${q.p}">${q.p === 3 ? 'Ưu tiên cao' : q.p === 2 ? 'Trung bình' : 'Cơ bản'}</span>
    ${q.trap ? '<span class="tag trap">Câu bẫy</span>' : ''}

  const clock = document.getElementById('clock');
  S.timer = setInterval(() => {
    S.secs++;
    const m = (S.secs / 60) | 0, s = S.secs % 60;
    clock.textContent = m + ':' + String(s).padStart(2, '0');
    clock.className = 'clock' + (S.secs > 90 ? ' over' : S.secs > 60 ? ' warn' : '');
  }, 1000);

  document.getElementById('rev').onclick = reveal;
  renderSide();
}

  if (S.revealed) return;

    <ul class="frames">
      ${q.a.map((l, i) => `<li style="animation-delay:${(i * .075).toFixed(2)}s">${l}</li>`).join('')}

    ${q.trap ? `<div class="trapbox"><b>Bẫy</b><span>Câu trả lời theo trực giác thường sai ở đây.

    ${q.anim && ANIM[q.anim] ? `
      <div class="viz" id="viz">
        <div class="viz-h">Trực quan · <b>${ANIM_TITLE[q.anim]}</b>
          <button class="replay" id="replay">chạy lại</button></div>
        <div id="vizbody">${ANIM[q.anim]()}</div>
      </div>` : ''}
  </div>
  <div class="rate"><div class="rate-in">
    <button class="rb b" data-r="1"><span class="s">BLOCKED</span><span class="d">Trắng đầu</span></button>
    <button class="rb w" data-r="2"><span class="s">WAITING</span><span class="d">Lơ mơ</span></button>
    <button class="rb r" data-r="3"><span class="s">RUNNABLE</span><span class="d">Nhớ rõ</span></button>
  </div></div>`;

  const rp = document.getElementById('replay');
  if (rp) rp.onclick = () => { document.getElementById('vizbody').innerHTML = ANIM[q.anim](); };
  document.querySelectorAll('[data-r]').forEach(b => b.onclick = () => rate(+b.dataset.r));
  renderSide();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function rate(level) {
  const id = S.queue[S.i];
  mastery[id] = level;
  S.hist[id] = level;
  S.seen++;
  store.set(KEY, mastery);

  if (level === 3) S.done.add(id);
  else if (selMode !== 'mock') {
    S.done.delete(id);
    const gap = level === 1 ? 4 : 12;
    const at = Math.min(S.i + gap, S.queue.length);
    S.queue.splice(at, 0, id);
  }
  S.i++;
  renderCard();
}

/* ================= SUMMARY ================= */
function renderDone() {
  document.body.classList.remove('drilling', 'nav-open');
  quitBtn.style.display = 'none';
  ctr.textContent = '';
  prog.style.width = '100%';

  const lv = Object.entries(S.hist);
  const good = lv.filter(([, v]) => v === 3).length;
  const mid = lv.filter(([, v]) => v === 2).length;
  const bad = lv.filter(([, v]) => v === 1).length;
  const weak = lv.filter(([, v]) => v < 3).map(([id]) => ALL.find(q => q.id === id)).filter(Boolean);

  app.innerHTML = `
  <div class="done">
    <div class="eyebrow">Phiên kết thúc</div>
    <h1>${good && !weak.length ? 'Sạch bàn.' : good > weak.length ? 'Tiến bộ rõ.' : 'Còn việc phải làm.'}</h1>
    <div class="stats">
      <div class="stat"><div class="v" style="color:var(--mint)">${good}</div><div class="l">Nhớ rõ</div></div>
      <div class="stat"><div class="v" style="color:var(--amber)">${mid}</div><div class="l">Lơ mơ</div></div>
      <div class="stat"><div class="v" style="color:var(--ember)">${bad}</div><div class="l">Trắng đầu</div></div>
    </div>
    ${weak.length ? `
      <div class="sec-h">Cần quay lại — ưu tiên đúng những câu này</div>
      <div class="weak">${weak.slice(0, 14).map(q =>
    `<div><span>${q.id}</span>${q.q}</div>`).join('')}</div>` : ''}
    <button class="start" id="again">Về màn hình chọn</button>
    <p class="hint">Tiến độ được lưu lại. Chế độ "Ôn câu yếu" sẽ bốc đúng những câu trên.</p>
  </div>`;
  document.getElementById('again').onclick = renderSetup;
}

/* ================= SIDEBAR ================= */
function statusOf(id) {
  if (S.hist[id] !== undefined) return { lv: S.hist[id], prev: false };
  if (mastery[id] !== undefined) return { lv: mastery[id], prev: true };
  return { lv: 0, prev: false };
}

function renderSide() {
  if (!S) return;
  const cur = S.queue[S.i];

  let g = 0, a = 0, e = 0, none = 0;
  S.pool.forEach(id => {
    const lv = S.hist[id];
    if (lv === 3) g++; else if (lv === 2) a++; else if (lv === 1) e++; else none++;
  });
  const T = S.total || 1;
  pbarEl.innerHTML =
    `<i class="g" style="width:${g / T * 100}%"></i>` +
    `<i class="a" style="width:${a / T * 100}%"></i>` +
    `<i class="e" style="width:${e / T * 100}%"></i>`;
  pnumEl.innerHTML =
    `<span class="g"><b>${g}</b> nhớ rõ</span>` +
    `<span class="a"><b>${a}</b> lơ mơ</span>` +
    `<span class="e"><b>${e}</b> trắng đầu</span>` +
    `<span><b>${none}</b> chưa làm</span>`;

  const byTopic = new Map();
  S.pool.forEach(id => {
    const q = ALL.find(x => x.id === id);
    if (!byTopic.has(q.t)) byTopic.set(q.t, []);
    byTopic.get(q.t).push(q);
  });

  let html = '';
  for (const [tid, qs] of byTopic) {
    const dn = qs.filter(q => S.hist[q.id] === 3).length;
    html += `<div class="grp">${TMAP[tid].short}<span>${dn}/${qs.length}</span></div>`;
    for (const q of qs) {
      const st = statusOf(q.id);
      html += `<button class="qrow l${st.lv}${st.prev ? ' prev' : ''}${q.id === cur ? ' cur' : ''}"
        data-jump="${q.id}" title="${q.q.replace(/"/g, '&quot;').replace(/<[^>]+>/g, '')}">
        <span class="dot"></span>
        <span class="tx">${q.q.replace(/<[^>]+>/g, '')}</span>
        ${q.trap ? '<span class="tr">⚠</span>' : ''}
      </button>`;
    }
  }
  sideList.innerHTML = html;

  sideList.querySelectorAll('[data-jump]').forEach(b =>
    b.onclick = () => jumpTo(b.dataset.jump));

  const c = sideList.querySelector('.qrow.cur');
  if (c) c.scrollIntoView({ block: 'nearest' });
}

function jumpTo(id) {
  if (!S) return;
  stopTimer();
  const at = S.queue.indexOf(id, S.i);
  if (at >= 0) S.i = at;
  else S.queue.splice(S.i, 0, id);
  document.body.classList.remove('nav-open');
  renderCard();
}

document.getElementById('navbtn').onclick = () => {
  document.body.classList.toggle('nav-open');
  renderSide();
};
document.getElementById('navclose').onclick =
  document.getElementById('scrim').onclick =
  () => document.body.classList.remove('nav-open');

/* ================= KEYBOARD ================= */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { document.body.classList.remove('nav-open'); return; }
  if (!S || app.querySelector('.hero, .done')) return;
  if (e.code === 'Space' || e.code === 'Enter') {
    if (!S.revealed) { e.preventDefault(); reveal(); }
  } else if (S.revealed && ['1', '2', '3'].includes(e.key)) {
    e.preventDefault(); rate(+e.key);
  }
});

/* ================= BOOT ================= */
(async () => {
  const st = document.createElement('style');
  st.textContent = ANIM_CSS;
  document.head.appendChild(st);
  mastery = (await store.get(KEY)) || {};
  renderSetup();
})();

</script>
</body>
</html>
