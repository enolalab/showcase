<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1120">
<title>Java Interview Drill — Senior</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B1120; --panel:#131C2E; --panel2:#1A2438; --line:#27354F;
  --paper:#E6EDF7; --muted:#8296B8; --dim:#5E739A;
  --amber:#F5A623; --ember:#E2564A; --mint:#3FD08E; --azure:#4C9EEB; --violet:#9B7BE8;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --sans:'IBM Plex Sans',system-ui,sans-serif;
  --disp:'Space Grotesk',var(--sans);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--ink); color:var(--paper); font-family:var(--sans);
  font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(ellipse 80% 50% at 50% -10%, rgba(76,158,235,.10), transparent 70%);
  background-attachment:fixed;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
code{font-family:var(--mono);font-size:.87em;background:rgba(76,158,235,.13);
  color:#A9CDF3;padding:.1em .38em;border-radius:4px;border:1px solid rgba(76,158,235,.16)}
b{font-weight:600;color:#fff}
i{color:var(--muted)}

.wrap{max-width:860px;margin:0 auto;padding:0 20px 120px}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:50;background:rgba(11,17,32,.88);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line);margin-bottom:30px}
.bar-in{max-width:860px;margin:0 auto;padding:13px 20px;display:flex;align-items:center;gap:16px}
.brand{font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.brand span{color:var(--amber)}
.bar-sp{flex:1}
.counter{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.counter b{color:var(--paper)}
.ghost{font-size:13px;color:var(--muted);padding:6px 11px;border:1px solid var(--line);
  border-radius:7px;transition:.15s;white-space:nowrap}
.ghost:hover{color:var(--paper);border-color:var(--dim)}
.track{height:2px;background:var(--line);position:relative;overflow:hidden}
.track i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--azure),var(--mint));
  width:0;transition:width .45s cubic-bezier(.4,0,.2,1)}

/* ---------- setup ---------- */
.hero{padding:52px 0 34px;border-bottom:1px solid var(--line);margin-bottom:34px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--amber);margin-bottom:16px}
h1{font-family:var(--disp);font-size:clamp(30px,6vw,46px);line-height:1.08;
  font-weight:700;letter-spacing:-.028em;margin-bottom:16px}
h1 em{font-style:normal;color:var(--amber)}
.lede{color:var(--muted);max-width:56ch;font-size:16.5px}
.lede b{color:var(--paper);font-weight:600}

.sec{margin-bottom:32px}
.sec-h{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);margin-bottom:13px;display:flex;align-items:center;gap:10px}
.sec-h:after{content:'';flex:1;height:1px;background:var(--line)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 13px;border:1px solid var(--line);border-radius:999px;font-size:13.5px;
  color:var(--muted);transition:.15s;background:var(--panel)}
.chip:hover{border-color:var(--dim);color:var(--paper)}
.chip.on{background:rgba(245,166,35,.11);border-color:var(--amber);color:var(--amber)}
.chip .n{font-family:var(--mono);font-size:11px;opacity:.65;margin-left:5px}

.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:11px}
.mode{text-align:left;padding:16px 17px;border:1px solid var(--line);border-radius:11px;
  background:var(--panel);transition:.16s}
.mode:hover{border-color:var(--dim);transform:translateY(-1px)}
.mode.on{border-color:var(--amber);background:rgba(245,166,35,.07)}
.mode h4{font-family:var(--disp);font-size:15px;font-weight:700;margin-bottom:4px}
.mode p{font-size:12.5px;color:var(--muted);line-height:1.45}

.start{width:100%;margin-top:8px;padding:16px;border-radius:11px;background:var(--amber);
  color:#171003;font-family:var(--disp);font-weight:700;font-size:16px;letter-spacing:-.01em;
  transition:.16s}
.start:hover{filter:brightness(1.09)}
.start:disabled{opacity:.35;cursor:not-allowed}
.hint{text-align:center;font-size:12.5px;color:var(--dim);margin-top:12px;font-family:var(--mono)}

/* ---------- drill card ---------- */
.meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:16px;
  font-family:var(--mono);font-size:11px}
.tag{padding:3px 9px;border-radius:5px;border:1px solid var(--line);color:var(--muted)}
.tag.p3{color:var(--ember);border-color:rgba(226,86,74,.4);background:rgba(226,86,74,.09)}
.tag.p2{color:var(--amber);border-color:rgba(245,166,35,.35);background:rgba(245,166,35,.08)}
.tag.p1{color:var(--dim)}
.tag.trap{color:var(--violet);border-color:rgba(155,123,232,.4);background:rgba(155,123,232,.1)}
.qid{color:var(--dim);margin-left:auto}

.q{font-family:var(--disp);font-size:clamp(21px,3.6vw,29px);line-height:1.3;
  font-weight:700;letter-spacing:-.02em;margin-bottom:26px}
.q code{font-size:.8em}

.stage{border:1px solid var(--line);border-radius:14px;background:var(--panel);
  padding:26px 24px;min-height:190px;display:flex;flex-direction:column;
  justify-content:center;align-items:center;text-align:center;gap:16px;position:relative;overflow:hidden}
.stage:before{content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(45deg,transparent,transparent 11px,rgba(255,255,255,.012) 11px,rgba(255,255,255,.012) 22px);
  pointer-events:none}
.clock{font-family:var(--mono);font-size:44px;font-weight:700;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;color:var(--paper);transition:color .3s}
.clock.warn{color:var(--amber)}
.clock.over{color:var(--ember)}
.stage p{color:var(--muted);font-size:14px;max-width:40ch;position:relative}
.reveal{padding:13px 26px;border-radius:9px;background:var(--paper);color:var(--ink);
  font-weight:600;font-size:15px;transition:.15s;position:relative}
.reveal:hover{filter:brightness(.93)}
.kbd{font-family:var(--mono);font-size:10.5px;color:var(--dim);position:relative}
.kbd b{background:var(--panel2);border:1px solid var(--line);border-radius:4px;
  padding:1.5px 5px;color:var(--muted);font-weight:400}

/* ---------- answer ---------- */
.ans{margin-top:8px}
.ans-h{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);margin-bottom:15px;display:flex;align-items:center;gap:10px}
.ans-h:after{content:'';flex:1;height:1px;background:var(--line)}
.frames{list-style:none;border-left:2px solid var(--line);padding-left:0}
.frames li{position:relative;padding:9px 0 9px 24px;font-size:15.5px;line-height:1.62;
  opacity:0;transform:translateX(-7px);animation:unwind .34s cubic-bezier(.2,.8,.3,1) forwards}
.frames li:before{content:'';position:absolute;left:-5px;top:19px;width:8px;height:8px;
  border-radius:50%;background:var(--azure);box-shadow:0 0 0 3px var(--ink)}
.frames li:first-child:before{background:var(--amber)}
@keyframes unwind{to{opacity:1;transform:none}}

.trapbox{margin:18px 0 0;padding:14px 16px;border-radius:10px;
  background:rgba(155,123,232,.08);border:1px solid rgba(155,123,232,.26);
  font-size:14px;color:#CDBCF5;display:flex;gap:11px;align-items:flex-start}
.trapbox b{color:var(--violet);font-family:var(--mono);font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;white-space:nowrap;padding-top:2.5px}

/* ---------- rating ---------- */
.rate{position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:linear-gradient(to top,var(--ink) 62%,transparent);padding:20px}
.rate-in{max-width:860px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.rb{padding:14px 10px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);
  text-align:center;transition:.15s}
.rb:hover{transform:translateY(-2px)}
.rb .s{display:block;font-family:var(--mono);font-size:11px;font-weight:700;
  letter-spacing:.09em;margin-bottom:3px}
.rb .d{display:block;font-size:12px;color:var(--muted)}
.rb.b{border-color:rgba(226,86,74,.42)} .rb.b .s{color:var(--ember)}
.rb.b:hover{background:rgba(226,86,74,.12)}
.rb.w{border-color:rgba(245,166,35,.42)} .rb.w .s{color:var(--amber)}
.rb.w:hover{background:rgba(245,166,35,.12)}
.rb.r{border-color:rgba(63,208,142,.42)} .rb.r .s{color:var(--mint)}
.rb.r:hover{background:rgba(63,208,142,.12)}

/* ---------- summary ---------- */
.done{padding:40px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:26px 0}
.stat{border:1px solid var(--line);border-radius:12px;padding:18px 14px;text-align:center;background:var(--panel)}
.stat .v{font-family:var(--disp);font-size:33px;font-weight:700;letter-spacing:-.03em}
.stat .l{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);margin-top:3px}
.weak{border:1px solid var(--line);border-radius:12px;background:var(--panel);
  padding:6px 18px;margin-bottom:24px}
.weak div{padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px;display:flex;gap:11px}
.weak div:last-child{border:0}
.weak span{font-family:var(--mono);font-size:11px;color:var(--amber);padding-top:3px}

/* ---------- animation frame ---------- */
.viz{margin:22px 0 4px;border:1px solid var(--line);border-radius:13px;background:var(--panel2);
  padding:20px 18px;overflow:hidden}
.viz-h{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);margin-bottom:16px;display:flex;align-items:center;gap:9px}
.viz-h b{color:var(--amber);font-weight:400}
.viz-h:after{content:'';flex:1;height:1px;background:var(--line)}
.replay{border:1px solid var(--line);border-radius:6px;padding:3px 9px;font-family:var(--mono);
  font-size:10px;color:var(--muted);letter-spacing:.06em}
.replay:hover{color:var(--amber);border-color:var(--amber)}
.cap{font-size:12.5px;color:var(--muted);margin-top:14px;text-align:center;line-height:1.5}
.cap b{color:var(--paper)}

/* generic viz atoms */
.row{display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
.box{border:1px solid var(--line);border-radius:8px;background:var(--panel);
  padding:9px 12px;font-family:var(--mono);font-size:11.5px;text-align:center;min-width:60px}
.box.hl{border-color:var(--amber);color:var(--amber);background:rgba(245,166,35,.09)}
.box.ok{border-color:var(--mint);color:var(--mint);background:rgba(63,208,142,.09)}
.box.bad{border-color:var(--ember);color:var(--ember);background:rgba(226,86,74,.09)}
.box.dim{opacity:.4}
.lbl{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
svg{display:block;max-width:100%;height:auto;margin:0 auto}
.st{font-family:var(--mono);font-size:10px;fill:var(--muted)}
.st.a{fill:var(--amber)} .st.m{fill:var(--mint)} .st.e{fill:var(--ember)} .st.z{fill:var(--azure)}
.st.w{fill:var(--paper)}

/* ---------- sidebar ---------- */
.navbtn{display:none;font-size:13px;color:var(--muted);padding:6px 11px;border:1px solid var(--line);
  border-radius:7px;transition:.15s;white-space:nowrap}
.navbtn:hover{color:var(--paper);border-color:var(--dim)}
body.drilling .navbtn{display:block}

.scrim{position:fixed;inset:0;background:rgba(4,8,17,.66);z-index:79;opacity:0;
  pointer-events:none;transition:opacity .22s}
body.nav-open .scrim{opacity:1;pointer-events:auto}

.side{position:fixed;left:0;top:0;bottom:0;width:296px;z-index:80;background:var(--panel);
  border-right:1px solid var(--line);display:flex;flex-direction:column;
  transform:translateX(-100%);transition:transform .24s cubic-bezier(.4,0,.2,1)}
body.nav-open .side{transform:none}

.side-top{padding:17px 18px 15px;border-bottom:1px solid var(--line);flex:none}
.side-top .t{font-family:var(--disp);font-weight:700;font-size:14px;margin-bottom:12px;
  display:flex;align-items:center;gap:8px}
.side-top .t button{margin-left:auto;font-size:17px;color:var(--dim);line-height:1;padding:0 3px}
.side-top .t button:hover{color:var(--paper)}
.pbar{height:5px;border-radius:3px;background:var(--panel2);overflow:hidden;display:flex}
.pbar i{display:block;height:100%;transition:width .4s cubic-bezier(.4,0,.2,1)}
.pbar .g{background:var(--mint)} .pbar .a{background:var(--amber)} .pbar .e{background:var(--ember)}
.pnum{display:flex;gap:13px;margin-top:9px;font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.pnum b{font-weight:400}
.pnum .g{color:var(--mint)} .pnum .a{color:var(--amber)} .pnum .e{color:var(--ember)}

.side-list{flex:1;overflow-y:auto;padding:8px 0 22px;scrollbar-width:thin}
.side-list::-webkit-scrollbar{width:7px}
.side-list::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.grp{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--dim);padding:15px 18px 7px;display:flex;align-items:baseline;gap:7px}
.grp span{margin-left:auto;color:var(--muted);letter-spacing:0;text-transform:none}
.qrow{display:flex;gap:9px;align-items:flex-start;width:100%;text-align:left;
  padding:7px 18px;font-size:12.8px;line-height:1.42;color:var(--muted);transition:.12s;
  border-left:2px solid transparent}
.qrow:hover{background:var(--panel2);color:var(--paper)}
.qrow.cur{background:rgba(245,166,35,.09);border-left-color:var(--amber);color:var(--paper)}
.qrow .dot{width:7px;height:7px;border-radius:50%;background:var(--line);flex:none;margin-top:6px}
.qrow.l3 .dot{background:var(--mint)} .qrow.l2 .dot{background:var(--amber)}
.qrow.l1 .dot{background:var(--ember)}
.qrow.prev .dot{opacity:.42}
.qrow .tx{flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qrow .tr{color:var(--violet);font-size:9.5px;flex:none;margin-top:3px}

@media (min-width:1240px){
  body.drilling{padding-left:296px}
  body.drilling .side{transform:none}
  body.drilling .navbtn{display:none}
  body.drilling .scrim{display:none}
  body.drilling .side-top .t button{display:none}
}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .stats{grid-template-columns:1fr 1fr 1fr;gap:8px}
  .stat{padding:14px 8px}
  .stat .v{font-size:26px}
}

@media (max-width:640px){
  .wrap{padding:0 16px calc(150px + env(safe-area-inset-bottom))}
  .bar-in{padding:11px 16px;gap:10px}
  .brand{font-size:13.5px}
  .counter{font-size:11px}
  .navbtn,.ghost{font-size:12px;padding:7px 10px}

  .hero{padding:34px 0 26px;margin-bottom:26px}
  h1{font-size:clamp(25px,7.5vw,34px)}
  .lede{font-size:15px}

  .q{font-size:clamp(19px,5.4vw,23px);margin-bottom:20px}
  .meta{gap:7px;margin-bottom:13px;font-size:10.5px}
  .qid{margin-left:auto}

  .stage{padding:22px 16px;min-height:170px;gap:13px}
  .clock{font-size:36px}
  .stage p{font-size:13px}
  .reveal{padding:14px 22px;width:100%;max-width:280px}
  .kbd{display:none}

  .frames li{font-size:15px;padding:8px 0 8px 20px;line-height:1.6}
  .ans-h{font-size:10px}
  .trapbox{font-size:13px;padding:12px 13px;flex-direction:column;gap:6px}

  .stats{grid-template-columns:1fr 1fr 1fr;gap:7px}
  .stat{padding:13px 6px}
  .stat .v{font-size:24px}
  .stat .l{font-size:9px;letter-spacing:.06em}
  .weak div{font-size:13.5px;padding:10px 0}

  .side{width:88vw;max-width:340px;padding-bottom:env(safe-area-inset-bottom)}
  .qrow{padding:9px 16px;font-size:13px}
  .qrow .dot{width:8px;height:8px;margin-top:5px}
  .grp{padding:14px 16px 6px}

  .chip{padding:9px 14px;font-size:14px}
  .mode{padding:14px 15px}
  .modes{grid-template-columns:1fr;gap:9px}
  .start{padding:17px}

  /* thanh chấm điểm: giữ 3 cột, nén lại cho vừa một hàng */
  .rate{padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
  .rate-in{grid-template-columns:1fr 1fr 1fr;gap:7px}
  .rb{padding:11px 4px;display:block}
  .rb .s{font-size:9.5px;letter-spacing:.04em;margin-bottom:2px}
  .rb .d{font-size:11.5px}

  /* animation: cho cuộn ngang thay vì co chữ tới mức không đọc được */
  .viz{padding:15px 0 15px 13px;position:relative}
  .viz-h,.viz>.cap{padding-right:13px}
  #vizbody{overflow-x:auto;overflow-y:hidden;padding-right:13px;
    -webkit-overflow-scrolling:touch;scrollbar-width:thin}
  #vizbody::-webkit-scrollbar{height:5px}
  #vizbody::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
  #vizbody svg{min-width:460px}
  #vizbody .split{min-width:430px;grid-template-columns:1fr 1fr;gap:9px}
  #vizbody .panel{padding:11px 8px}
  #vizbody .row{flex-wrap:nowrap;min-width:max-content}
  #vizbody .cap{white-space:normal;min-width:0}
  .viz>.cap{font-size:12px;text-align:left}
}

@media (max-width:380px){
  .wrap{padding-left:13px;padding-right:13px}
  .rb .d{font-size:10.5px}
  .rb .s{font-size:9px}
  .clock{font-size:32px}
  .q{font-size:19px}
}

/* chống tràn ngang do chuỗi dài / code inline */
body{overflow-x:hidden}
.q,.frames li,.lede,.stage p,.cap,.weak div{overflow-wrap:break-word}
code{overflow-wrap:anywhere}

/* khoá cuộn nền khi ngăn kéo đang mở */
@media (max-width:1239px){
  body.nav-open{overflow:hidden;position:relative}
  .side{height:100dvh}
}

/* vùng chạm tối thiểu trên cảm ứng */
@media (hover:none){
  .qrow{padding-top:10px;padding-bottom:10px}
  .replay{padding:6px 11px}
  button{touch-action:manipulation}
}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important}
  .frames li{opacity:1;transform:none}
}
:focus-visible{outline:2px solid var(--azure);outline-offset:2px;border-radius:5px}
</style>
</head>
<body>
<div class="bar">
  <div class="bar-in">
    <div class="brand">JAVA<span>·</span>DRILL</div>
    <div class="bar-sp"></div>
    <div class="counter" id="ctr"></div>
    <button class="navbtn" id="navbtn">Danh sách</button>
    <button class="ghost" id="quit" style="display:none">Kết thúc</button>
  </div>
  <div class="track"><i id="prog"></i></div>
</div>
<div class="scrim" id="scrim"></div>
<aside class="side" id="side">
  <div class="side-top">
    <div class="t">Tiến độ phiên <button id="navclose" aria-label="Đóng">✕</button></div>
    <div class="pbar" id="pbar"></div>
    <div class="pnum" id="pnum"></div>
  </div>
  <div class="side-list" id="sidelist"></div>
</aside>
<div class="wrap" id="app"></div>
<script>
const TOPICS = [
  {id:1,  name:"OOP & Java cơ bản",        short:"OOP"},
  {id:2,  name:"String & String Pool",     short:"String"},
  {id:3,  name:"Bộ nhớ & Garbage Collection", short:"GC"},
  {id:4,  name:"Collections",              short:"Collections"},
  {id:5,  name:"Multithreading & Concurrency", short:"Concurrency"},
  {id:6,  name:"Immutable, Exception, Serialization", short:"Exception"},
  {id:7,  name:"Java 8+ · Lambda & Stream", short:"Java 8+"},

/* ============ 1. OOP ============ */
{id:"1.1", t:1, p:1, q:"OOP là gì? 4 tính chất của OOP?", a:[
 "<b>Định nghĩa.</b> Lập trình hướng đối tượng tổ chức chương trình quanh các <i>object</i> — mỗi object gói cả dữ liệu (state) lẫn hành vi thao tác trên dữ liệu đó. Điều này ngược với lập trình thủ tục, nơi dữ liệu và hàm nằm tách rời nhau. Mục tiêu cốt lõi là quản lý độ phức tạp: thay vì một hệ thống lớn với dữ liệu dùng chung khắp nơi, ta có nhiều đơn vị nhỏ tự chịu trách nhiệm về trạng thái của mình.",
 "<b>Encapsulation (đóng gói).</b> Giấu state bên trong, chỉ lộ ra hành vi qua API công khai. Giá trị thật không nằm ở việc viết getter/setter mà ở chỗ object luôn tự bảo vệ được tính hợp lệ của mình — không ai từ bên ngoài đẩy nó vào trạng thái vô nghĩa được.",
 "<b>Inheritance (kế thừa).</b> Cho phép một class tái sử dụng và mở rộng class khác qua quan hệ <i>is-a</i>. Đây là tính chất dễ bị lạm dụng nhất; thiết kế hiện đại thường ưu tiên composition hơn inheritance vì kế thừa tạo ràng buộc rất chặt giữa cha và con.",
 "<b>Polymorphism (đa hình).</b> Cùng một lời gọi method nhưng hành vi khác nhau tuỳ object thật đứng phía sau. Đây là tính chất tạo ra giá trị lớn nhất trong thực tế: nó cho phép thêm implementation mới mà không phải sửa code đang gọi.",
 "<b>Abstraction (trừu tượng).</b> Lộ ra <i>cái gì</i> làm được, giấu đi <i>làm bằng cách nào</i>. Nhờ đó tầng gọi chỉ phụ thuộc vào hợp đồng chứ không phụ thuộc chi tiết cài đặt, và chi tiết đó có thể thay đổi tự do."]},

{id:"1.2", t:1, p:1, q:"Tính kế thừa thể hiện thế nào trong Java? Tại sao Java không cho đa kế thừa class?", a:[
 "<b>Cú pháp.</b> Java dùng <code>extends</code> cho class và <code>implements</code> cho interface. Một class chỉ <code>extends</code> được đúng một class cha, nhưng <code>implements</code> được bao nhiêu interface tuỳ ý. Đây là lựa chọn thiết kế có chủ đích chứ không phải hạn chế kỹ thuật.",
 "<b>Diamond Problem.</b> Nếu class D kế thừa cả B và C, mà B và C đều kế thừa A và cùng override một method, thì khi gọi method đó trên D, JVM không có cách nào xác định nên chạy bản của B hay của C. Ngôn ngữ buộc phải đặt ra quy tắc giải quyết phức tạp (như C++ với virtual inheritance), và Java chọn cách tránh vấn đề ngay từ đầu.",
 "<b>Tại sao interface thì được.</b> Trước Java 8, interface chỉ có method trừu tượng và không có state, nên kế thừa nhiều interface không gây xung đột về dữ liệu hay hành vi — chỉ có một implementation duy nhất ở class thực hiện.",
 "<b>Default method làm vấn đề quay lại.</b> Từ Java 8, interface có <code>default method</code> mang sẵn thân hàm, nên hai interface có thể cung cấp hai bản khác nhau cho cùng một signature. Java xử lý bằng cách <b>bắt compiler báo lỗi</b> và buộc class con phải override để chọn rõ ràng, thường qua cú pháp <code>InterfaceName.super.method()</code>.",
 "<b>Lưu ý về constructor.</b> Constructor không được kế thừa. Constructor của class con luôn gọi constructor của cha, hoặc tường minh bằng <code>super(...)</code>, hoặc ngầm định bằng <code>super()</code> không tham số — và nếu cha không có constructor không tham số thì compiler sẽ báo lỗi."]},

{id:"1.3", t:1, p:1, q:"Tính đóng gói (encapsulation) thể hiện ra sao trong Java?", a:[
 "<b>Công cụ ngôn ngữ.</b> Java cung cấp bốn mức truy cập để kiểm soát phạm vi nhìn thấy: <code>private</code>, package-private (mặc định), <code>protected</code>, <code>public</code>. Cách làm phổ biến nhất là để field ở <code>private</code> và chỉ cho truy cập qua method.",
 "<b>Mục đích thật sự là giữ invariant.</b> Đóng gói không phải để 'giấu cho có' mà để đảm bảo object không bao giờ rơi vào trạng thái không hợp lệ. Ví dụ một <code>BankAccount</code> phải luôn có số dư hợp lệ; nếu ai cũng ghi thẳng vào <code>balance</code> thì không có chỗ nào kiểm tra được điều đó nữa.",
 "<b>Getter/setter công khai cho mọi field thực chất phá vỡ đóng gói.</b> Một class có đủ setter cho tất cả field thì về bản chất chỉ là một struct có thêm cú pháp dài dòng — mọi ràng buộc đều nằm ngoài tầm kiểm soát của nó. Đây là điều nhiều người hiểu nhầm khi mới học.",
 "<b>Nên ưu tiên method mang ý nghĩa nghiệp vụ.</b> Viết <code>account.deposit(amount)</code> thay vì <code>account.setBalance(account.getBalance() + amount)</code>. Cách thứ nhất đặt quy tắc nghiệp vụ (không nạp số âm, ghi log giao dịch) vào đúng nơi sở hữu dữ liệu; cách thứ hai rải quy tắc đó ra khắp codebase.",
 "<b>Đóng gói cũng áp dụng ở cấp package và module.</b> Package-private cho phép các class trong cùng package hợp tác chặt mà vẫn kín với bên ngoài. Từ Java 9, hệ thống module (<code>module-info.java</code>) mở rộng ý tưởng này lên cấp cao hơn bằng cách kiểm soát package nào được export."]},

{id:"1.4", t:1, p:2, q:"Phân biệt polymorphism và abstraction", a:[
 "<b>Abstraction là quyết định lúc thiết kế.</b> Nó trả lời câu hỏi 'khái niệm này lộ ra những gì'. Khi bạn định nghĩa interface <code>PaymentGateway</code> với method <code>pay(amount)</code>, bạn đang trừu tượng hoá: người dùng chỉ cần biết có thể thanh toán, không cần biết bên dưới là Momo, VNPay hay thẻ quốc tế.",
 "<b>Polymorphism là hiện tượng lúc chạy.</b> Nó trả lời câu hỏi 'ai thực sự thực thi lời gọi này'. Cùng dòng <code>gateway.pay(100)</code>, tuỳ object thật được inject vào mà JVM sẽ nhảy tới bản cài đặt của Momo hay của VNPay.",
 "<b>Quan hệ nhân quả giữa hai khái niệm.</b> Abstraction là điều kiện, polymorphism là kết quả. Không có một hợp đồng chung thì không thể thay thế implementation cho nhau, nên không có đa hình. Ngược lại, abstraction mà không bao giờ có hơn một implementation thì chỉ là một lớp gián tiếp thừa.",
 "<b>Một cách phân biệt nhanh khi bị hỏi vặn.</b> Abstraction liên quan tới việc <i>bạn viết gì</i>; polymorphism liên quan tới việc <i>JVM chọn gì</i>. Trong Java, cơ chế đứng sau polymorphism là dynamic dispatch qua bảng method ảo của mỗi class."]},

{id:"1.5", t:1, p:2, q:"Có mấy loại polymorphism trong Java?", a:[
 "<b>Compile-time (static polymorphism) — overloading.</b> Compiler quyết định gọi phiên bản nào dựa trên số lượng và <b>kiểu khai báo</b> của tham số. Việc chọn xảy ra hoàn toàn lúc biên dịch và không thay đổi khi chạy.",
 "<b>Runtime (dynamic polymorphism) — overriding.</b> JVM quyết định dựa trên <b>kiểu thật</b> của object tại thời điểm gọi, thông qua virtual method table gắn với mỗi class. Đây là loại đa hình mang lại giá trị thiết kế thực sự.",
 "<b>Bẫy hay gặp: overload resolution dùng static type.</b> Nếu bạn có <code>method(Object o)</code> và <code>method(String s)</code>, rồi gọi <code>method((Object) \"abc\")</code>, compiler sẽ chọn bản <code>Object</code> dù giá trị thật là String. Trực giác thường mong đợi điều ngược lại, và đây là câu hỏi vặn khá phổ biến.",
 "<b>Hệ quả thực tế.</b> Vì overloading được giải quyết tĩnh, nó không tham gia vào cơ chế thay thế implementation. Khi thiết kế API, nhiều overload có kiểu tham số gần nhau (như <code>long</code> và <code>Long</code>, hay <code>Object</code> và một kiểu cụ thể) là nguồn nhầm lẫn — nên đặt tên method khác nhau thay vì overload."]},

{id:"1.6", t:1, p:2, q:"Phân biệt overriding vs overloading", a:[
 "<b>Overriding — cùng signature, ở class con.</b> Method con phải trùng tên, trùng danh sách tham số và tương thích kiểu trả về với method cha. Việc chọn bản nào xảy ra lúc runtime dựa trên object thật.",
 "<b>Ràng buộc của overriding.</b> Không được thu hẹp access modifier (đang <code>public</code> thì không thể xuống <code>protected</code>), không được throw checked exception rộng hơn hoặc mới hơn so với bản cha. Cả hai ràng buộc đều nhằm đảm bảo nguyên lý Liskov: chỗ nào dùng được cha thì phải dùng được con.",
 "<b>Overloading — cùng tên, khác danh sách tham số.</b> Có thể nằm trong cùng class hoặc ở class con. Việc chọn xảy ra lúc compile dựa trên kiểu khai báo, không liên quan gì tới kế thừa hay đa hình runtime.",
 "<b>Return type không tạo ra overload hợp lệ.</b> Hai method chỉ khác nhau ở kiểu trả về sẽ bị compiler từ chối, vì tại điểm gọi không phải lúc nào cũng có đủ thông tin để phân biệt (ví dụ khi gọi mà bỏ qua giá trị trả về).",
 "<b>Covariant return type.</b> Riêng với overriding, class con được phép trả về kiểu <i>hẹp hơn</i> kiểu của cha. Ví dụ cha trả <code>Animal</code>, con trả <code>Dog</code> — hợp lệ và rất hữu ích trong builder hoặc factory."]},

{id:"1.7", t:1, p:3, q:"Phân biệt abstract class và interface. Khi nào dùng cái nào?", a:[
 "<b>Khác biệt kỹ thuật.</b> Abstract class có thể có field instance, constructor, khối khởi tạo, và mọi access modifier; interface chỉ có hằng <code>public static final</code> và không có constructor. Một class chỉ extends được một abstract class nhưng implements được nhiều interface.",
 "<b>Dùng abstract class khi các class con là biến thể của cùng một thứ.</b> Nếu chúng chia sẻ state chung và một phần logic chung, và quan hệ đúng nghĩa <i>is-a</i>, thì abstract class là công cụ phù hợp. Ví dụ điển hình là một khung xử lý có sẵn phần lớn luồng và để trống vài bước cho con điền vào.",
 "<b>Dùng interface khi định nghĩa một khả năng.</b> Interface mô tả điều một object <i>làm được</i>, và những object hoàn toàn không liên quan nhau vẫn có thể cùng có khả năng đó. <code>Comparable</code>, <code>Serializable</code>, <code>AutoCloseable</code> là ví dụ: chúng cắt ngang mọi cây kế thừa.",
 "<b>Thực tế thiết kế hiện đại nghiêng hẳn về interface.</b> Kế thừa class tạo ràng buộc rất chặt và chỉ dùng được một lần, nên khi cần chia sẻ code người ta thường ưu tiên composition — tách phần dùng chung thành một class riêng rồi giữ nó như một field. Abstract class vẫn hữu ích nhưng nên dùng có cân nhắc.",
 "<b>Trong Spring gần như luôn là interface.</b> Vì DI cho phép thay implementation dễ dàng, và interface làm việc mock trong test trở nên đơn giản, phần lớn service và repository được định nghĩa qua interface."]},

{id:"1.8", t:1, p:3, q:"Từ Java 8 interface có default và static method — vậy còn khác gì abstract class?", a:[
 "<b>Khác biệt quan trọng nhất còn lại: interface không có state.</b> Nó không có field instance và không có constructor, nên không lưu được dữ liệu riêng của từng object. Abstract class thì có, và đó là điều <code>default method</code> không bao giờ thay thế được.",
 "<b>Hệ quả của việc không có state.</b> Interface không quản lý được vòng đời hay tính hợp lệ của object — không có nơi nào để kiểm tra tham số khởi tạo, không có gì để bảo vệ. Abstract class có constructor nên có thể ép mọi class con đi qua một bước khởi tạo bắt buộc.",
 "<b>Khác biệt về phạm vi truy cập.</b> Method trong interface mặc định là <code>public</code>; abstract class có <code>protected</code> để chia sẻ helper nội bộ với class con mà không lộ ra ngoài. Từ Java 9, interface có thêm <code>private method</code> nhưng chỉ để tái sử dụng code giữa các default method trong chính nó.",
 "<b>Số lượng kế thừa vẫn khác.</b> Một class vẫn chỉ extends được một abstract class, trong khi implements được nhiều interface — đây là khác biệt không bao giờ mất đi.",
 "<b>Mục đích ra đời của default method thường bị hiểu sai.</b> Nó không sinh ra để thay abstract class, mà để <b>tiến hoá interface mà không phá vỡ code cũ</b>. Khi Java 8 muốn thêm <code>stream()</code> vào <code>Collection</code>, nếu đó là abstract method thì mọi implementation trên thế giới sẽ không compile được nữa; <code>default</code> giải quyết đúng bài toán đó."]},

{id:"1.9", t:1, p:1, q:"Các access modifier trong Java? default khác protected chỗ nào?", a:[
 "<b>Bốn mức, từ hẹp tới rộng.</b> <code>private</code> chỉ trong class đó; <code>default</code> (package-private, tức không viết gì) trong cùng package; <code>protected</code> là cùng package cộng thêm class con ở package khác; <code>public</code> ở mọi nơi.",
 "<b>Điểm khác biệt cốt lõi giữa default và protected.</b> Cả hai đều cho truy cập trong cùng package, nhưng chỉ <code>protected</code> mới vượt được ranh giới package — và chỉ vượt được cho <b>class con</b>, không phải cho mọi class.",
 "<b>Ràng buộc tinh tế của protected khi khác package.</b> Class con ở package khác chỉ truy cập được thành viên protected <i>thông qua reference thuộc chính kiểu nó hoặc kiểu con của nó</i>, không phải qua reference kiểu cha. Nghĩa là trong <code>Child</code>, bạn dùng được <code>this.protectedField</code> nhưng không dùng được <code>someParentReference.protectedField</code>. Đây là chi tiết ít người biết và thỉnh thoảng bị hỏi.",
 "<b>Nguyên tắc thực hành.</b> Luôn bắt đầu từ mức hẹp nhất có thể rồi mới nới ra khi thực sự cần. Mỗi thành viên <code>public</code> là một cam kết lâu dài với người dùng API, còn <code>protected</code> là cam kết với mọi class con — cả hai đều khó rút lại về sau."]},

{id:"1.10", t:1, p:2, q:"Có những cách nào định nghĩa method mà KHÔNG override được?", a:[
 "<b><code>final</code> method.</b> Cấm override một cách tường minh. Dùng khi hành vi của method là một phần bất biến trong hợp đồng của class, hoặc khi method được gọi từ constructor và bạn không muốn class con thay đổi nó.",
 "<b><code>static</code> method.</b> Thuộc về class chứ không thuộc object nên không tham gia dynamic dispatch. Khai báo lại ở class con chỉ tạo ra <i>method hiding</i>, không phải overriding — và hành vi khác hẳn.",
 "<b><code>private</code> method.</b> Không nhìn thấy được từ class con nên không có gì để override. Nếu class con định nghĩa method cùng tên, đó là một method hoàn toàn mới, độc lập.",
 "<b>Method trong class khai báo <code>final</code>.</b> Cả class không kế thừa được thì đương nhiên không method nào override được. <code>String</code> là ví dụ nổi tiếng nhất, và lý do là để bảo vệ tính bất biến.",
 "<b>Constructor.</b> Không phải method được kế thừa nên không thuộc phạm trù overriding. Class con chỉ có thể gọi constructor cha qua <code>super(...)</code>.",
 "<b>Liên hệ với Spring.</b> Đây không chỉ là kiến thức lý thuyết: Spring dùng CGLIB tạo class con để làm proxy, nên method <code>final</code>, <code>private</code>, <code>static</code> đều <b>không được proxy</b> — <code>@Transactional</code> đặt lên chúng sẽ im lặng không hoạt động."]},

{id:"1.11", t:1, p:2, q:"Phân biệt static method và instance method", a:[
 "<b>Nơi thuộc về.</b> Static method thuộc class, tồn tại ngay khi class được nạp và gọi được mà không cần object nào. Instance method thuộc từng object và bắt buộc phải có instance mới gọi được.",
 "<b>Khả năng truy cập.</b> Static method không có <code>this</code> nên không truy cập trực tiếp được field instance hay gọi instance method. Ngược lại, instance method dùng được cả thành viên static lẫn instance.",
 "<b>Thời điểm liên kết.</b> Static method được bind lúc compile dựa trên kiểu khai báo (static binding); instance method được bind lúc runtime dựa trên object thật (dynamic binding). Đây chính là lý do static method không override được.",
 "<b>Hệ quả với testing và thiết kế.</b> Static method khó mock và khó thay thế, vì không có chỗ nào để inject một implementation khác. Điều này khiến nó không phù hợp với logic nghiệp vụ có phụ thuộc ra ngoài; nên giới hạn static cho utility thuần tuý, không state, không I/O — kiểu <code>Math.max()</code> hay <code>Objects.equals()</code>.",
 "<b>Trong Spring gần như không dùng static cho service.</b> Bean được quản lý bởi container để có thể inject, proxy và thay thế; một static method nằm ngoài toàn bộ cơ chế đó."]},

{id:"1.12", t:1, p:3, q:"Có override được static method không?", trap:true, a:[
 "<b>Không — đó là method hiding, không phải overriding.</b> Khi class con khai báo static method trùng signature với cha, nó chỉ <i>che</i> bản của cha đi trong phạm vi của mình. Hai method tồn tại song song và hoàn toàn độc lập.",
 "<b>Việc chọn dựa trên kiểu khai báo lúc compile.</b> Với <code>Parent p = new Child(); p.staticMethod();</code>, JVM sẽ chạy bản của <b>Parent</b>, bởi vì biến <code>p</code> được khai báo kiểu <code>Parent</code>. Đối tượng thật là <code>Child</code> hoàn toàn không ảnh hưởng gì.",
 "<b>Đối chiếu với instance method để thấy rõ.</b> Nếu cùng đoạn code đó gọi một instance method được override, kết quả sẽ là bản của <b>Child</b>. Cùng một cú pháp, hai hành vi trái ngược — đó chính là điểm mà câu hỏi này muốn kiểm tra.",
 "<b>Lý do kỹ thuật.</b> Static method không có entry trong virtual method table của object, nên JVM không có cơ chế nào để tra cứu bản đúng lúc runtime. Bytecode sinh ra dùng lệnh <code>invokestatic</code> với tên class đã cố định sẵn, khác với <code>invokevirtual</code> của instance method.",
 "<b>Lời khuyên thực hành.</b> Vì hành vi dễ gây nhầm, nên luôn gọi static method qua tên class (<code>Parent.staticMethod()</code>) chứ đừng gọi qua reference object — nhiều linter cảnh báo chính điều này."]},

{id:"1.13", t:1, p:2, q:"Phân biệt final, finally, finalize", a:[
 "<b><code>final</code> — keyword sửa đổi khai báo.</b> Trên biến nghĩa là không gán lại được sau khi khởi tạo; trên method là không override được; trên class là không kế thừa được. Ba tác dụng khác nhau nhưng chung một tinh thần: khoá lại, không cho thay đổi.",
 "<b><code>finally</code> — khối lệnh đi kèm try/catch.</b> Luôn được chạy dù có exception hay không, kể cả khi trong try có <code>return</code>. Dùng để giải phóng tài nguyên, tuy nay phần lớn trường hợp đã được <code>try-with-resources</code> thay thế gọn hơn.",
 "<b>Ngoại lệ hiếm của finally.</b> Nó không chạy nếu JVM thoát bằng <code>System.exit()</code>, nếu thread bị kill, hoặc nếu máy tắt. Ngoài những trường hợp đó thì có thể tin tưởng hoàn toàn.",
 "<b><code>finalize()</code> — method của <code>Object</code>.</b> Từng được thiết kế để GC gọi trước khi thu hồi object, cho phép dọn tài nguyên native. Trên thực tế nó gần như vô dụng: không đảm bảo bao giờ chạy, không đảm bảo có chạy hay không, làm chậm GC và có thể hồi sinh object một cách bất ngờ.",
 "<b>Trạng thái hiện tại của finalize.</b> Đã bị <code>@Deprecated</code> từ Java 9 và bị vô hiệu hoá mặc định từ Java 18. Thay thế đúng là <code>try-with-resources</code> với <code>AutoCloseable</code>, hoặc <code>java.lang.ref.Cleaner</code> nếu thật sự cần móc nối vào GC."]},

{id:"1.14", t:1, p:3, q:"final trên một object reference nghĩa là object đó immutable?", trap:true, a:[
 "<b>Không — <code>final</code> chỉ khoá reference, không khoá nội dung.</b> Nó đảm bảo biến sẽ luôn trỏ tới đúng object đó suốt vòng đời, nhưng bản thân object bên trong vẫn thay đổi tự do được.",
 "<b>Minh hoạ trực tiếp.</b> <code>final List&lt;String&gt; l = new ArrayList&lt;&gt;();</code> rồi <code>l.add(\"x\")</code> là hoàn toàn hợp lệ và list sẽ có phần tử mới. Chỉ khi viết <code>l = new ArrayList&lt;&gt;()</code> thì compiler mới báo lỗi, vì đó là gán lại reference.",
 "<b>Muốn immutable thật phải thiết kế chủ động.</b> Cần class <code>final</code>, mọi field <code>private final</code>, không setter, và quan trọng nhất là <b>defensive copy</b> ở cả constructor lẫn getter cho những field kiểu mutable. Thiếu bước copy thì object vẫn bị sửa từ bên ngoài qua reference mà người gọi còn giữ.",
 "<b>Hệ quả về thread-safety.</b> Vì <code>final</code> một mình không tạo ra bất biến, nó cũng không đủ để đảm bảo an toàn đa luồng cho nội dung object. Tuy vậy <code>final</code> có một đảm bảo riêng đáng biết: theo Java Memory Model, giá trị của field <code>final</code> được nhìn thấy đúng bởi mọi thread sau khi constructor kết thúc, không cần đồng bộ thêm.",
 "<b>Liên hệ thực tế.</b> Đây là lý do <code>List.of()</code> hay <code>Collections.unmodifiableList()</code> tồn tại — chúng chặn thao tác sửa đổi ở tầng collection, điều mà <code>final</code> không làm được."]},

{id:"1.15", t:1, p:3, q:"Java dùng pass-by-value hay pass-by-reference?", trap:true, a:[
 "<b>Java luôn là pass-by-value, không có ngoại lệ.</b> Đây là khẳng định tuyệt đối, kể cả với object. Điều gây nhầm lẫn là <i>giá trị</i> được truyền đi khi tham số là object chính là giá trị của reference (địa chỉ), chứ không phải bản thân object.",
 "<b>Với primitive thì rõ ràng.</b> Method nhận một bản copy của giá trị; sửa nó bên trong không ảnh hưởng gì tới biến bên ngoài.",
 "<b>Với object thì tinh tế hơn.</b> Method nhận bản copy của địa chỉ, nên nó trỏ tới <i>cùng một object</i> trên heap. Vì vậy gọi <code>obj.setName(...)</code> bên trong method sẽ làm bên ngoài thấy thay đổi — điều này khiến nhiều người tưởng nhầm là pass-by-reference.",
 "<b>Phép thử phân biệt dứt điểm.</b> Nếu bên trong method bạn gán lại <code>obj = new X()</code>, biến bên ngoài <b>không</b> đổi — nó vẫn trỏ về object cũ. Với pass-by-reference thật (như tham chiếu <code>&amp;</code> trong C++) thì bên ngoài sẽ đổi theo.",
 "<b>Cách diễn đạt chính xác nhất.</b> Java truyền <i>giá trị của reference</i> — <i>pass-by-value of the reference</i>. Trả lời được cụm này và giải thích kèm phép thử gán lại là đủ để thuyết phục người phỏng vấn."]},

{id:"1.16", t:1, p:2, q:"Chứng minh Java là pass-by-value bằng ví dụ swap 2 object", a:[
 "<b>Đoạn code kiểm chứng.</b> Viết <code>void swap(Obj a, Obj b){ Obj t=a; a=b; b=t; }</code> rồi gọi <code>swap(x, y)</code>. Sau khi method kết thúc, <code>x</code> và <code>y</code> ở ngoài <b>không hề đổi chỗ cho nhau</b>.",
 "<b>Giải thích cơ chế.</b> <code>a</code> và <code>b</code> chỉ là hai biến local nằm trên stack frame của method <code>swap</code>, chứa bản copy của hai địa chỉ. Việc hoán đổi chúng chỉ hoán đổi hai ô nhớ tạm trong frame đó, và toàn bộ frame biến mất khi method return.",
 "<b>Đối chiếu với ngôn ngữ có pass-by-reference thật.</b> Trong C++ nếu khai báo tham số là <code>Obj&amp; a</code>, thì <code>a</code> chính là bí danh của biến gốc, và swap sẽ có tác dụng thật. Java không có cơ chế tương đương.",
 "<b>Ví dụ đối lập để làm rõ thêm.</b> Ngược lại, <code>void rename(Obj a){ a.setName(\"x\"); }</code> lại có tác dụng nhìn thấy từ bên ngoài, vì <code>a</code> tuy là bản copy của địa chỉ nhưng vẫn trỏ tới đúng object trên heap. So sánh hai ví dụ này cạnh nhau là cách giải thích thuyết phục nhất.",
 "<b>Cách swap thật sự trong Java.</b> Phải trả về kết quả (ví dụ trả về một mảng hoặc một record hai phần tử), hoặc truyền vào một object bao ngoài có thể sửa được, hoặc dùng mảng một phần tử làm hộp chứa."]},

/* ============ 2. STRING ============ */
{id:"2.1", t:2, p:3, q:"So sánh String, StringBuilder, StringBuffer", a:[
 "<b><code>String</code> — immutable.</b> Mọi thao tác 'thay đổi' đều tạo ra object mới thay vì sửa tại chỗ. Nhờ bất biến nên thread-safe tự nhiên và dùng làm key của Map rất tốt, đổi lại nối chuỗi nhiều lần sẽ tạo rất nhiều rác.",
 "<b><code>StringBuilder</code> — mutable, không đồng bộ.</b> Giữ một mảng ký tự bên trong và ghi trực tiếp vào đó, chỉ tạo object mới khi hết chỗ. Đây là lựa chọn mặc định cho mọi trường hợp cần nối chuỗi động, vì nhanh nhất và tình huống chia sẻ buffer giữa nhiều thread gần như không xảy ra trong thực tế.",
 "<b><code>StringBuffer</code> — mutable, thread-safe.</b> Cùng API với StringBuilder nhưng mọi method đều <code>synchronized</code>. Chi phí khoá khiến nó chậm hơn khoảng 10–20%, và trên thực tế gần như không cần tới: rất hiếm khi hai thread cùng ghi vào một buffer nối chuỗi.",
 "<b>Chi tiết về capacity đáng nhắc tới.</b> StringBuilder khởi tạo với capacity mặc định 16 ký tự và nhân đôi (chính xác là <code>2n+2</code>) mỗi khi đầy, kèm theo một lần copy toàn bộ mảng. Nếu ước lượng được độ dài kết quả, truyền capacity vào constructor sẽ tránh được các lần copy đó.",
 "<b>Câu trả lời gọn khi bị hỏi nhanh.</b> Mặc định dùng <code>String</code>; cần nối trong vòng lặp thì dùng <code>StringBuilder</code>; <code>StringBuffer</code> chỉ là di sản lịch sử."]},

{id:"2.2", t:2, p:3, q:"Tại sao String được thiết kế immutable?", a:[
 "<b>Để String Pool hoạt động được.</b> Nhiều biến cùng trỏ tới một object chỉ an toàn khi object đó không bao giờ đổi. Nếu String mutable, sửa nội dung qua một biến sẽ làm hỏng mọi biến khác đang dùng chung — pool sẽ trở thành nguồn bug thay vì tối ưu.",
 "<b>Vì lý do bảo mật.</b> String được dùng làm username, đường dẫn file, URL, chuỗi kết nối database, và tham số nạp class. Nếu sửa được, kẻ tấn công có thể thay đổi giá trị <i>sau khi</i> hệ thống đã kiểm tra tính hợp lệ — đúng dạng lỗ hổng time-of-check to time-of-use.",
 "<b>Thread-safety miễn phí.</b> Object bất biến chia sẻ giữa nhiều thread mà không cần đồng bộ, không cần copy phòng thủ. Đây là lý do String truyền qua lại giữa các thread thoải mái không cần suy nghĩ.",
 "<b>Cache được hashCode.</b> Vì nội dung không đổi nên hash chỉ cần tính một lần rồi lưu lại trong field <code>hash</code>. Điều này khiến String trở thành key lý tưởng cho HashMap — và cũng là lý do tra cứu bằng String key rất nhanh dù chuỗi dài.",
 "<b>Đánh đổi và cách bù.</b> Cái giá phải trả là tốn bộ nhớ và tạo rác khi thao tác chuỗi nhiều lần. Java bù lại bằng StringBuilder cho thao tác nối, và từ Java 9 thêm <i>compact strings</i> — lưu bằng mảng <code>byte</code> với mã hoá Latin-1 khi có thể, tiết kiệm khoảng một nửa bộ nhớ so với mảng <code>char</code> trước đó."]},

{id:"2.3", t:2, p:3, q:"String Pool là gì? Nằm ở đâu trong bộ nhớ?", a:[
 "<b>Định nghĩa.</b> String Pool là vùng lưu trữ các String literal duy nhất, để mọi literal có nội dung giống nhau đều dùng chung một object thay vì tạo bản mới. Về cấu trúc, nó là một hash table nội bộ của JVM tên là <code>StringTable</code>.",
 "<b>Vị trí đã thay đổi theo phiên bản.</b> Từ Java 6 trở về trước, pool nằm trong <b>PermGen</b> — vùng có kích thước cố định, dẫn tới lỗi <code>OutOfMemoryError: PermGen space</code> nếu intern quá nhiều. <b>Từ Java 7, pool được chuyển sang Heap</b>.",
 "<b>Ý nghĩa của việc chuyển sang Heap.</b> Pool trở thành đối tượng của GC nên String không còn dùng có thể được thu hồi, và dung lượng khả dụng lớn hơn nhiều vì phụ thuộc kích thước heap chứ không phải một vùng cố định nhỏ.",
 "<b>Literal được intern tự động.</b> Khi class được nạp, mọi String literal trong constant pool của class đó được đưa vào StringTable. Vì vậy hai literal giống nhau ở hai file khác nhau vẫn cho ra cùng một object.",
 "<b>Tinh chỉnh khi cần.</b> Kích thước bảng băm điều chỉnh được bằng <code>-XX:StringTableSize</code>, và có thể theo dõi bằng <code>-XX:+PrintStringTableStatistics</code>. Điều này chỉ đáng quan tâm với ứng dụng intern rất nhiều chuỗi."]},

{id:"2.4", t:2, p:3, q:"s1=\"quan\"; s2=\"quan\"; s3=\"hello\"; → bao nhiêu object String được tạo? Thêm new String(\"quan\") thì sao?", trap:true, anim:"stringpool", a:[
 "<b>Đáp án: 2 object.</b> Chỉ có <code>\"quan\"</code> và <code>\"hello\"</code> được tạo, cả hai nằm trong String Pool. Dòng gán <code>s2</code> không tạo gì mới vì literal <code>\"quan\"</code> đã có sẵn trong pool.",
 "<b>Hệ quả: <code>s1 == s2</code> trả về <code>true</code>.</b> Hai biến trỏ tới đúng cùng một object trong pool, nên phép so sánh reference cũng đúng. Đây chính là cái bẫy khiến nhiều người tưởng <code>==</code> hoạt động được với String.",
 "<b>Thêm <code>new String(\"quan\")</code> thì thành 3 object.</b> Toán tử <code>new</code> luôn buộc JVM cấp phát một object mới trên heap, <b>nằm ngoài pool</b>, dù nội dung trùng hoàn toàn. Đây là lý do <code>new String(...)</code> gần như luôn là code thừa và nên tránh.",
 "<b>Kết quả so sánh khi có s4.</b> <code>s1 == s4</code> là <code>false</code> vì hai địa chỉ khác nhau, nhưng <code>s1.equals(s4)</code> là <code>true</code> vì nội dung giống nhau. Cặp kết quả trái ngược này là minh hoạ rõ nhất cho khác biệt giữa <code>==</code> và <code>equals</code>.",
 "<b>Vai trò của <code>intern()</code>.</b> Gọi <code>s4.intern()</code> sẽ trả về chính object <code>s1</code> trong pool, nên <code>s1 == s4.intern()</code> là <code>true</code>. Lưu ý nó trả về reference chứ không sửa <code>s4</code>."]},

{id:"2.5", t:2, p:3, q:"== vs .equals() với String", a:[
 "<b>Khác biệt cơ bản.</b> <code>==</code> so sánh reference, tức hai biến có trỏ tới cùng một object hay không. <code>.equals()</code> của String đã được override để so sánh <b>nội dung</b> từng ký tự.",
 "<b>Vì sao đây là nguồn bug khó tìm.</b> Với literal, <code>==</code> tình cờ cho kết quả đúng nhờ String Pool, nên code có thể chạy đúng suốt quá trình phát triển. Nhưng chuỗi đọc từ database, từ HTTP request, từ file, hay nối lúc runtime <b>không nằm trong pool</b>, và cùng đoạn code đó sẽ sai ở production.",
 "<b>Một ngoại lệ đáng biết.</b> Nếu nối hai literal hằng như <code>\"qu\" + \"an\"</code>, compiler gộp chúng lúc biên dịch thành một literal duy nhất, nên kết quả vẫn vào pool và <code>==</code> vẫn đúng. Nhưng nếu một vế là biến (kể cả biến chứa cùng nội dung), phép nối xảy ra lúc runtime và tạo object mới ngoài pool.",
 "<b>Trường hợp biến <code>final</code>.</b> Nếu biến được khai báo <code>static final String X = \"qu\"</code> thì compiler coi nó là hằng biên dịch và vẫn gộp được. Đây là chi tiết tinh vi, thỉnh thoảng xuất hiện trong câu hỏi vặn.",
 "<b>Quy tắc thực hành.</b> Luôn dùng <code>.equals()</code>, hoặc tốt hơn là <code>Objects.equals(a, b)</code> để an toàn với <code>null</code>. Nếu so sánh với hằng thì viết <code>\"ADMIN\".equals(role)</code> để tránh NPE khi <code>role</code> là null."]},

{id:"2.6", t:2, p:2, q:"String.intern() làm gì?", a:[
 "<b>Chức năng.</b> Trả về reference tới bản sao của chuỗi trong String Pool; nếu pool chưa có chuỗi với nội dung đó thì thêm vào rồi trả về. Nó không sửa object gốc mà chỉ trả ra một reference khác.",
 "<b>Trường hợp dùng hợp lý.</b> Khi ứng dụng sinh ra rất nhiều String trùng nội dung lúc runtime — ví dụ parse một file lớn có hàng triệu dòng với vài chục giá trị lặp đi lặp lại ở một cột. Intern giúp tất cả chúng dùng chung một object và tiết kiệm heap đáng kể.",
 "<b>Rủi ro khi lạm dụng.</b> StringTable phình to làm tra cứu chậm dần, và bản thân lời gọi <code>intern()</code> cũng tốn chi phí băm và tìm kiếm. Ngoài ra chuỗi trong pool sống lâu hơn bình thường, nên intern chuỗi tạm thời là phản tác dụng.",
 "<b>Thường có giải pháp tốt hơn.</b> Nếu tập giá trị là hữu hạn và biết trước thì <code>enum</code> là lựa chọn đúng hơn hẳn. Nếu cần khử trùng lặp có kiểm soát, một <code>HashMap</code> hoặc <code>ConcurrentHashMap</code> làm cache riêng cho phép bạn quyết định vòng đời, điều mà pool của JVM không cho.",
 "<b>Lưu ý lịch sử.</b> Trước Java 7, intern nhiều dễ gây OOM ở PermGen; sau khi pool chuyển sang heap thì rủi ro này giảm nhiều nhưng vẫn nên dùng có chủ đích."]},

{id:"2.7", t:2, p:3, q:"Trong vòng for muốn nối chuỗi thì làm thế nào? Tại sao += trong loop lại tệ?", anim:"strloop", a:[
 "<b>Cách đúng.</b> Khai báo một <code>StringBuilder</code> <b>ngoài</b> vòng lặp và gọi <code>append()</code> bên trong, rồi <code>toString()</code> một lần sau khi kết thúc. Nếu ước lượng được độ dài, truyền capacity vào constructor để tránh các lần mở rộng mảng.",
 "<b>Các lựa chọn thay thế gọn hơn.</b> Nếu đang có sẵn collection, <code>String.join(\", \", list)</code> hoặc <code>list.stream().collect(Collectors.joining(\", \"))</code> vừa ngắn vừa hiệu quả, lại xử lý luôn phần dấu phân cách mà nối thủ công hay bị dư ở cuối.",
 "<b>Vì sao <code>s += x</code> trong loop lại tệ.</b> Mỗi lần lặp, JVM phải tạo một StringBuilder mới, nạp toàn bộ nội dung chuỗi cũ vào, append phần mới, rồi gọi <code>toString()</code> tạo ra một String mới. Chuỗi cũ lập tức thành rác.",
 "<b>Chi phí tích luỹ theo cấp số.</b> Vòng lặp thứ n phải copy n ký tự, nên tổng chi phí là 1 + 2 + 3 + … + n, tức <b>O(n²)</b>. Với 10.000 vòng lặp, khác biệt so với StringBuilder có thể lên tới hàng nghìn lần — đây không phải tối ưu vi mô mà là khác biệt về độ phức tạp.",
 "<b>Khi nào <code>+</code> vẫn ổn.</b> Nối vài chuỗi trong một biểu thức duy nhất (không trong vòng lặp) thì hoàn toàn không sao — compiler tự tối ưu, và viết <code>a + b + c</code> dễ đọc hơn hẳn StringBuilder thủ công."]},

{id:"2.8", t:2, p:3, q:"Compiler đã tự tối ưu a + b thành StringBuilder rồi mà, sao vẫn chậm?", trap:true, a:[
 "<b>Tối ưu đó có thật, nhưng phạm vi rất hẹp.</b> Compiler chỉ gộp các phép nối nằm trong <b>cùng một biểu thức</b> thành một chuỗi <code>append()</code> duy nhất. Nó không có cách nào nhìn xuyên qua ranh giới của vòng lặp.",
 "<b>Điều thực sự xảy ra trong loop.</b> Mỗi lần lặp là một biểu thức độc lập, nên mỗi vòng JVM tạo <b>một StringBuilder mới</b>, nạp lại toàn bộ chuỗi đã tích luỹ vào, append, rồi build ra String mới. Toàn bộ công sức của vòng trước bị đổ đi và làm lại.",
 "<b>Chi phí copy tích luỹ.</b> Vì mỗi vòng phải copy lại chuỗi cũ ngày càng dài, tổng chi phí là 1 + 2 + … + n = O(n²). StringBuilder khai báo ngoài loop giữ nguyên buffer nên chỉ mất O(n).",
 "<b>Java 9 có thay đổi cơ chế nhưng không thay đổi bản chất.</b> Từ Java 9, phép nối chuỗi được biên dịch thành lệnh <code>invokedynamic</code> gọi tới <code>StringConcatFactory</code>, cho phép JVM sinh chiến lược nối tối ưu lúc runtime. Kết quả nhanh hơn đáng kể trong biểu thức đơn lẻ, nhưng trong vòng lặp thì <b>vẫn là O(n²)</b> vì vấn đề nằm ở cấu trúc code, không nằm ở cách nối.",
 "<b>Vì sao câu này đáng thuộc.</b> Câu trả lời sách vở dừng ở 'compiler đã tối ưu rồi'; câu trả lời phân biệt được phạm vi tối ưu và nêu được lý do O(n²) cho thấy bạn hiểu bytecode chứ không chỉ thuộc quy tắc."]},

/* ============ 3. MEMORY & GC ============ */
{id:"3.1", t:3, p:3, q:"Phân biệt Heap và Stack", anim:"heapstack", a:[
 "<b>Stack — riêng cho từng thread.</b> Mỗi thread có một stack độc lập, chứa các <i>stack frame</i>. Mỗi frame ứng với một lời gọi method và giữ biến local, tham số, reference, cùng địa chỉ trả về. Vì không chia sẻ nên dữ liệu trên stack vốn đã an toàn với đa luồng.",
 "<b>Heap — dùng chung toàn JVM.</b> Mọi object và mảng đều được cấp phát ở đây, bất kể tạo ra từ thread nào. Đây cũng là nơi duy nhất cần đồng bộ khi nhiều thread cùng truy cập.",
 "<b>Cách giải phóng khác hẳn nhau.</b> Stack dọn theo cơ chế LIFO: method return là frame bị pop, hoàn toàn xác định và không tốn chi phí gì. Heap thì cần GC quét và thu hồi, chi phí lớn hơn nhiều và thời điểm không đoán trước được.",
 "<b>Điểm dễ nhầm nhất.</b> Với <code>User u = new User()</code>, biến <code>u</code> (tức reference) nằm trên <b>stack</b>, còn object <code>User</code> nằm trên <b>heap</b>. Nói 'object nằm trên stack' là sai; chỉ có primitive local mới thực sự nằm trọn trên stack.",
 "<b>Lỗi tương ứng khi tràn.</b> Tràn stack cho <code>StackOverflowError</code>, hầu như luôn do đệ quy thiếu điều kiện dừng, và chỉnh bằng <code>-Xss</code>. Tràn heap cho <code>OutOfMemoryError: Java heap space</code>, thường do leak hoặc heap quá nhỏ, chỉnh bằng <code>-Xmx</code>.",
 "<b>Một ngoại lệ nâng cao.</b> JIT có thể áp dụng <i>escape analysis</i>: nếu chứng minh được object không thoát ra khỏi method, nó có thể cấp phát trên stack hoặc tách thành các biến vô hướng. Đây là tối ưu ẩn, không phải điều lập trình viên kiểm soát trực tiếp."]},

{id:"3.2", t:3, p:3, q:"GC hoạt động dựa trên Heap hay Stack?", trap:true, a:[
 "<b>Chỉ Heap.</b> Garbage Collector hoàn toàn không thu gom trên stack. Toàn bộ thuật toán mark–sweep–compact, phân chia thế hệ, và các collector như G1 hay ZGC đều chỉ làm việc trong vùng heap.",
 "<b>Vì sao stack không cần GC.</b> Vòng đời của stack frame hoàn toàn xác định: frame được push khi gọi method và pop khi method return. Không có gì mơ hồ để phải phân tích, nên việc giải phóng chỉ là dịch con trỏ stack — nhanh và miễn phí.",
 "<b>Nhưng stack đóng vai trò then chốt với GC.</b> Các reference nằm trên stack của những thread đang chạy chính là <b>GC Root</b> — điểm khởi đầu để GC duyệt và xác định object nào còn reachable. Nói cách khác, stack quyết định object nào <i>không</i> bị dọn.",
 "<b>Cách diễn đạt ngắn gọn khi trả lời.</b> 'GC chỉ quản Heap; Stack tự dọn theo frame, nhưng Stack là GC Root nên nó quyết định cái gì trên Heap được sống.' Câu này gói trọn ý và tránh được cái bẫy của câu hỏi.",
 "<b>Các GC Root khác ngoài stack.</b> Còn có static field của các class đã nạp, JNI reference, monitor đang bị khoá, và chính các object Thread đang sống. Biết đủ danh sách này giúp trả lời tiếp câu hỏi về memory leak."]},

{id:"3.3", t:3, p:3, q:"GC hoạt động như thế nào? Thuật toán Mark–Sweep–Compact", anim:"gc", a:[
 "<b>Pha Mark.</b> GC bắt đầu từ tập GC Roots và duyệt theo mọi reference, đánh dấu tất cả object còn tới được. Đây là pha tốn thời gian nhất vì phải đi qua toàn bộ đồ thị object đang sống.",
 "<b>Pha Sweep.</b> Quét qua heap và thu hồi vùng nhớ của những object không được đánh dấu. Sau bước này bộ nhớ đã được giải phóng nhưng nằm rải rác thành nhiều mảnh nhỏ.",
 "<b>Pha Compact.</b> Dồn các object còn sống về một phía để loại bỏ phân mảnh. Lợi ích lớn nhất không phải là tiết kiệm chỗ mà là làm cho việc cấp phát mới trở nên cực rẻ: chỉ cần dịch một con trỏ (bump-the-pointer) thay vì tìm khoảng trống vừa đủ.",
 "<b>Young Gen dùng thuật toán khác.</b> Vì đa số object chết rất trẻ, quét Eden theo mark–sweep sẽ lãng phí. Thay vào đó người ta dùng <i>copying collector</i>: chỉ copy số ít object còn sống sang vùng Survivor rồi coi toàn bộ Eden là trống. Chi phí tỉ lệ với số object <b>sống</b>, không phải số object chết.",
 "<b>Vì sao vẫn cần stop-the-world.</b> Mọi collector đều cần ít nhất một khoảnh khắc dừng ứng dụng để chụp được ảnh nhất quán của đồ thị reference. Các collector hiện đại như G1, ZGC không loại bỏ được pha này mà chỉ rút ngắn nó xuống mức rất nhỏ và làm phần lớn công việc song song với ứng dụng."]},

{id:"3.4", t:3, p:3, q:"Object nào đủ điều kiện bị GC? GC Roots là gì?", a:[
 "<b>Tiêu chí duy nhất là reachability.</b> Một object đủ điều kiện thu hồi khi <b>không còn đường đi</b> nào từ bất kỳ GC Root nào tới nó. GC không đếm xem có bao nhiêu reference trỏ tới object — nó chỉ quan tâm object có nằm trong phần đồ thị nối với root hay không.",
 "<b>Danh sách GC Roots.</b> Gồm biến local và tham số trên stack của các thread đang chạy, static field của những class đã được nạp, reference từ mã native qua JNI, monitor đang bị thread giữ, và bản thân các object Thread đang sống.",
 "<b>Hệ quả quan trọng: circular reference không gây rò rỉ.</b> Nếu A trỏ B và B trỏ A nhưng cả cụm đã tách rời khỏi mọi root, chúng vẫn bị thu hồi bình thường. Đây là lợi thế rõ rệt của reachability so với reference counting.",
 "<b>Hệ quả ngược lại: reachable nhưng vô dụng vẫn không bị dọn.</b> Một static <code>List</code> phình mãi vẫn luôn reachable từ root, nên GC không có quyền đụng tới dù chương trình không bao giờ đọc nó nữa. Đây chính là định nghĩa của memory leak trong Java.",
 "<b>Cách kiểm chứng khi debug.</b> Công cụ phân tích heap dump như MAT hiển thị 'path to GC Root' cho từng object — đó là cách nhanh nhất để biết ai đang giữ object mà bạn tưởng đã bỏ đi."]},

{id:"3.5", t:3, p:2, q:"GC dùng reference counting phải không?", trap:true, a:[
 "<b>Không — JVM dùng reachability analysis.</b> Đây là điểm nhiều người nhầm vì reference counting là cơ chế trực quan hơn và được dùng ở Python, PHP, hay Swift với ARC.",
 "<b>Nhược điểm chí mạng của reference counting.</b> Nó không xử lý được <b>circular reference</b>: hai object trỏ vào nhau sẽ luôn có bộ đếm khác 0 dù cả cụm đã bị bỏ rơi. Python phải bổ sung thêm một cycle collector riêng để bù cho lỗ hổng này.",
 "<b>Chi phí runtime cũng là vấn đề.</b> Mỗi phép gán reference đều phải tăng một bộ đếm và giảm một bộ đếm khác, và trong môi trường đa luồng các thao tác đó phải nguyên tử. Với hệ thống throughput cao, chi phí này rải đều trên mọi dòng code là quá đắt.",
 "<b>Đánh đổi của reachability.</b> Nó xử lý vòng tròn một cách tự nhiên và không tốn chi phí lúc gán, nhưng phải trả giá bằng pha mark tốn thời gian và cần stop-the-world. JVM chọn hướng này vì tối ưu cho throughput tổng thể.",
 "<b>Điểm cộng khi trả lời.</b> Nêu được cả lý do vì sao reference counting không phù hợp (chứ không chỉ nói 'Java không dùng nó') cho thấy bạn hiểu trade-off thiết kế của runtime."]},

{id:"3.6", t:3, p:3, q:"Phân vùng Heap: Young Gen, Old Gen. Minor GC vs Major/Full GC", anim:"gc", a:[
 "<b>Cấu trúc Young Gen.</b> Gồm <b>Eden</b> và hai vùng <b>Survivor</b> (S0, S1). Object mới sinh ra luôn nằm ở Eden, trừ những object quá lớn được cấp thẳng vào Old Gen.",
 "<b>Minor GC.</b> Dọn Young Gen, chạy rất thường xuyên và rất nhanh vì đa số object ở Eden đã chết. Object còn sống được copy sang vùng Survivor đang trống và tăng biến đếm <i>age</i> lên một.",
 "<b>Promotion lên Old Gen.</b> Object sống sót qua đủ nhiều lần Minor GC (mặc định ngưỡng là 15, chỉnh bằng <code>-XX:MaxTenuringThreshold</code>) sẽ được chuyển lên Old Gen. Object cũng có thể được promote sớm nếu vùng Survivor không đủ chỗ.",
 "<b>Major GC và Full GC.</b> Major GC dọn Old Gen, chậm hơn nhiều vì vùng này lớn và chứa toàn object sống lâu. Full GC dọn cả Young lẫn Old và cả Metaspace, có thời gian dừng dài nhất — đây là thứ gây ra các đỉnh nhọn khó chịu trên biểu đồ latency.",
 "<b>Dấu hiệu cảnh báo trong thực tế.</b> Full GC chạy liên tục mà bộ nhớ không giảm đáng kể là chỉ báo kinh điển của memory leak hoặc heap cấu hình quá nhỏ. Ngược lại, Minor GC chạy dày nhưng nhanh thường là bình thường và không đáng lo."]},

{id:"3.7", t:3, p:2, q:"Weak generational hypothesis là gì?", a:[
 "<b>Nội dung giả thuyết.</b> Nó gồm hai quan sát thực nghiệm: <i>đa số object chết rất trẻ</i>, và <i>ít khi object cũ trỏ tới object mới</i>. Đây không phải định lý mà là quy luật thống kê rút ra từ việc quan sát chương trình thật.",
 "<b>Vì sao nó đúng trong ứng dụng thực tế.</b> Phần lớn object được tạo ra là DTO, biến tạm, kết quả trung gian của một request — chúng chết ngay khi request xử lý xong. Số object thực sự sống lâu (cache, singleton, connection pool) chiếm tỉ lệ rất nhỏ.",
 "<b>Hệ quả thiết kế trực tiếp.</b> Nếu đa số object chết trẻ thì quét toàn bộ heap mỗi lần là lãng phí lớn. Thay vào đó, chia heap theo thế hệ và quét vùng trẻ thật thường xuyên với chi phí rất thấp, còn vùng già thì hiếm khi chạm tới.",
 "<b>Vì sao copying collector hợp với Young Gen.</b> Do tỉ lệ sống thấp, chi phí copy vài object còn sống rẻ hơn nhiều so với việc quét và dọn hàng nghìn object chết. Chi phí tỉ lệ với số object sống chứ không phải kích thước vùng nhớ.",
 "<b>Phạm vi áp dụng.</b> Đây là nền tảng của mọi generational collector: Serial, Parallel, CMS, G1. ZGC và Shenandoah ban đầu không phân thế hệ nhưng các phiên bản gần đây cũng đã bổ sung chế độ generational vì lợi ích quá rõ ràng."]},

{id:"3.8", t:3, p:3, q:"Các GC collector: Serial, Parallel, CMS, G1, ZGC — trade-off?", a:[
 "<b>Serial GC.</b> Dùng một thread duy nhất, dừng ứng dụng hoàn toàn khi làm việc. Đơn giản và ít tốn tài nguyên nhất, phù hợp với container nhỏ, heap dưới vài trăm MB, hoặc ứng dụng chỉ có một core.",
 "<b>Parallel GC.</b> Dùng nhiều thread để rút ngắn pha thu gom, tối ưu cho <b>throughput</b> tổng thể chứ không phải độ trễ. Thời gian dừng vẫn dài, nên phù hợp với batch job hay hệ thống tính toán nơi tổng thời gian quan trọng hơn độ mượt.",
 "<b>CMS (Concurrent Mark Sweep).</b> Làm phần lớn công việc song song với ứng dụng để giảm pause, nhưng <b>không compact</b> nên gây phân mảnh dần và cuối cùng vẫn phải Full GC để dồn bộ nhớ. Đã bị gỡ khỏi JDK từ phiên bản 14 và không nên nhắc tới như lựa chọn hiện tại.",
 "<b>G1 (Garbage First) — mặc định từ Java 9.</b> Chia heap thành hàng nghìn region nhỏ và ưu tiên dọn những region chứa nhiều rác nhất, do đó có tên 'garbage first'. Điểm mạnh là cho phép đặt mục tiêu độ trễ bằng <code>-XX:MaxGCPauseMillis</code> và G1 sẽ tự điều chỉnh khối lượng công việc mỗi chu kỳ để cố đạt mục tiêu đó.",
 "<b>ZGC và Shenandoah.</b> Giữ thời gian dừng dưới một mili-giây và gần như <b>không phụ thuộc vào kích thước heap</b>, kể cả heap hàng trăm GB. Cái giá phải trả là tiêu tốn CPU và bộ nhớ nhiều hơn do phải dùng load barrier để di chuyển object song song với ứng dụng.",
 "<b>Nguyên tắc chọn khi bị hỏi.</b> Cần throughput tối đa và chấp nhận pause dài thì Parallel; cần cân bằng và ổn định cho service thông thường thì G1; cần độ trễ p99 cực thấp với heap lớn thì ZGC. Và luôn kèm một câu: quyết định cuối cùng nên dựa trên đo đạc với tải thật."]},

{id:"3.9", t:3, p:2, q:"Stop-the-world là gì?", a:[
 "<b>Định nghĩa.</b> Là khoảng thời gian JVM dừng toàn bộ thread ứng dụng để GC (hoặc một số thao tác nội bộ khác) làm việc trên trạng thái tĩnh. Trong khoảng đó chương trình hoàn toàn không xử lý được request nào.",
 "<b>Vì sao bắt buộc phải có.</b> Nếu ứng dụng vừa chạy vừa thay đổi reference trong lúc GC đang duyệt đồ thị, GC có thể bỏ sót object còn sống hoặc giữ lại object đã chết. Cần ít nhất một khoảnh khắc nhất quán để chụp ảnh đúng.",
 "<b>Cơ chế safepoint.</b> Thread không dừng ngay lập tức mà dừng tại các <i>safepoint</i> — những điểm trong bytecode nơi JVM biết chính xác vị trí của mọi reference. Vì vậy một vòng lặp dài không có safepoint có thể làm cả JVM phải chờ, đây là nguyên nhân của những pause dài bất thường khó giải thích.",
 "<b>Ảnh hưởng thực tế.</b> STW tác động trực tiếp lên p99 và p999 latency — trung bình vẫn đẹp nhưng một số request lẻ bị kéo dài hàng trăm mili-giây. Với hệ thống có SLA nghiêm ngặt, đây thường là nguyên nhân đầu tiên cần kiểm tra.",
 "<b>Cách quan sát.</b> Bật GC log (<code>-Xlog:gc*</code> từ Java 9) hoặc dùng JFR để xem tần suất và độ dài từng pause. Ngoài GC, còn có các nguyên nhân STW khác như deoptimization, biased lock revocation, hay thread dump."]},

{id:"3.10", t:3, p:2, q:"Metaspace là gì, khác PermGen thế nào?", a:[
 "<b>Nội dung được lưu.</b> Metaspace chứa metadata của class: cấu trúc class, thông tin method, constant pool, và các bytecode đã nạp. Đây không phải nơi chứa object mà là nơi chứa <i>mô tả về class</i>.",
 "<b>PermGen — cách làm cũ đến Java 7.</b> Nằm bên trong heap và có kích thước cố định đặt bằng <code>-XX:MaxPermSize</code>. Vì cố định nên rất dễ gặp <code>OutOfMemoryError: PermGen space</code>, đặc biệt với ứng dụng nạp nhiều class hoặc redeploy nhiều lần.",
 "<b>Metaspace — từ Java 8.</b> Chuyển ra <b>native memory</b> ngoài heap và <b>tự mở rộng</b> theo nhu cầu, nên loại bỏ được phần lớn lỗi OOM kiểu cũ. Không còn cần tinh chỉnh kích thước trong đa số trường hợp.",
 "<b>Vẫn có thể OOM.</b> Nếu ứng dụng nạp class không kiểm soát — hot redeploy liên tục, sinh proxy động quá nhiều, hoặc classloader bị giữ lại không giải phóng — Metaspace vẫn phình tới khi hết bộ nhớ hệ điều hành. Đây gọi là classloader leak và khó chẩn đoán hơn heap leak thông thường.",
 "<b>Cấu hình khi cần.</b> Đặt trần bằng <code>-XX:MaxMetaspaceSize</code> là thực hành tốt trong container, vì nếu không giới hạn thì Metaspace có thể ăn hết bộ nhớ và khiến container bị OOM-kill ở tầng hệ điều hành — một lỗi trông rất khó hiểu nếu không biết trước."]},

{id:"3.11", t:3, p:3, q:"Memory leak trong Java xảy ra khi nào dù đã có GC? Cách phát hiện?", a:[
 "<b>Định nghĩa chính xác.</b> Leak trong Java không phải là 'quên free' như C, mà là object <b>vẫn còn reachable</b> từ GC Root nhưng chương trình không bao giờ dùng tới nữa. GC nhìn thấy đường đi tới object nên không có quyền thu hồi, dù về mặt logic nó đã là rác.",
 "<b>Các nguồn phổ biến nhất.</b> Static collection phình mãi không giới hạn; cache tự viết không có TTL và không giới hạn kích thước; <code>ThreadLocal</code> không gọi <code>remove()</code> trong thread pool; listener hoặc callback đăng ký mà không bao giờ gỡ; connection, stream, reader không đóng.",
 "<b>Trường hợp khó nhất: ClassLoader leak.</b> Xảy ra khi redeploy ứng dụng mà classloader cũ vẫn bị giữ bởi một reference nào đó — thường là một static field trong thư viện bên thứ ba hoặc một thread chưa dừng. Cả bộ class cũ không được giải phóng, dẫn tới Metaspace phình dần.",
 "<b>Dấu hiệu nhận biết.</b> Old Gen tăng dần theo thời gian và <b>không tụt xuống sau Full GC</b>, Full GC ngày càng dày, throughput giảm từ từ, và cuối cùng là OOM sau vài ngày chạy. Đồ thị bộ nhớ hình răng cưa có xu hướng đi lên là chỉ báo rõ nhất.",
 "<b>Quy trình chẩn đoán.</b> Bật sẵn <code>-XX:+HeapDumpOnOutOfMemoryError</code> để có bằng chứng khi sự cố xảy ra. Chụp hai heap dump cách nhau một khoảng và so sánh xem class nào tăng số instance. Phân tích bằng Eclipse MAT, xem <i>Dominator Tree</i> để biết object nào giữ nhiều bộ nhớ nhất và <i>path to GC Root</i> để biết ai đang giữ nó.",
 "<b>Công cụ hỗ trợ khác.</b> <code>jmap</code> và <code>jcmd</code> để chụp dump, VisualVM hoặc JDK Mission Control để theo dõi trực quan, và Java Flight Recorder cho phép ghi lại liên tục với chi phí rất thấp — phù hợp bật ở production."]},

{id:"3.12", t:3, p:2, q:"Phân biệt OutOfMemoryError và StackOverflowError", a:[
 "<b><code>OutOfMemoryError</code>.</b> Xảy ra khi JVM không cấp phát được bộ nhớ nữa. Thông điệp đi kèm rất quan trọng vì nó chỉ ra vùng nào cạn: <i>Java heap space</i>, <i>Metaspace</i>, <i>Direct buffer memory</i>, hay <i>unable to create native thread</i> — mỗi loại có nguyên nhân và cách xử lý khác nhau.",
 "<b><code>StackOverflowError</code>.</b> Xảy ra khi stack của <b>một thread</b> vượt giới hạn, gần như luôn do đệ quy thiếu điều kiện dừng hoặc đệ quy quá sâu. Cũng có thể do stack frame quá lớn vì method có quá nhiều biến local.",
 "<b>Cả hai đều là <code>Error</code>, không phải <code>Exception</code>.</b> Điều đó có nghĩa chúng biểu thị tình trạng mà ứng dụng không nên cố xử lý và tiếp tục. Catch chúng để 'chạy tiếp' là ý tưởng tồi vì JVM đã ở trạng thái không đáng tin.",
 "<b>Lưu ý với Spring.</b> Dù không nên catch, cần nhớ rằng <code>Error</code> <b>vẫn kích hoạt rollback</b> mặc định của <code>@Transactional</code>, giống như RuntimeException. Đây là chi tiết hay bị bỏ sót.",
 "<b>Tham số điều chỉnh.</b> Heap chỉnh bằng <code>-Xmx</code> và <code>-Xms</code>; stack mỗi thread chỉnh bằng <code>-Xss</code>. Tăng <code>-Xss</code> để chữa StackOverflow thường chỉ là che giấu vấn đề — nên sửa thuật toán đệ quy thành lặp thì đúng hơn."]},

{id:"3.13", t:3, p:1, q:"Gọi System.gc() có đảm bảo GC chạy không?", a:[
 "<b>Không đảm bảo gì cả.</b> Theo đặc tả, <code>System.gc()</code> chỉ là một <i>gợi ý</i> cho JVM rằng đây là lúc thích hợp để thu gom. JVM hoàn toàn có quyền bỏ qua và trong nhiều trường hợp thực sự bỏ qua.",
 "<b>Thường gây hại hơn có lợi.</b> Khi JVM thực sự làm theo, nó thường kích hoạt một <b>Full GC</b> — loại tốn kém nhất, dừng ứng dụng lâu nhất. Gọi trong code xử lý request là cách chắc chắn để tạo ra các đỉnh latency ngẫu nhiên.",
 "<b>Có thể bị vô hiệu hoá hoàn toàn.</b> Cờ <code>-XX:+DisableExplicitGC</code> khiến mọi lời gọi <code>System.gc()</code> trở thành no-op. Nhiều môi trường production bật cờ này để tự bảo vệ trước thư viện bên thứ ba gọi bừa.",
 "<b>Ngoại lệ hiếm.</b> Một số trường hợp đặc thù liên quan tới <code>DirectByteBuffer</code> cần GC chạy để giải phóng bộ nhớ native, nên có thư viện gọi tường minh. Nhưng đó là ngoại lệ có lý do rõ ràng, không phải cách dùng thông thường.",
 "<b>Ý nghĩa khi review code.</b> Thấy <code>System.gc()</code> trong code nghiệp vụ gần như luôn là dấu hiệu ai đó đang cố chữa triệu chứng của một vấn đề khác — thường là memory leak chưa được tìm ra."]},

{id:"3.14", t:3, p:1, q:"Strong / Soft / Weak / Phantom reference", a:[
 "<b>Strong reference.</b> Là reference thông thường mà bạn viết hằng ngày. Chừng nào còn strong reference từ GC Root thì object tuyệt đối không bị thu hồi, kể cả khi JVM sắp hết bộ nhớ.",
 "<b>Soft reference.</b> Object chỉ bị thu hồi khi JVM sắp cạn bộ nhớ, nên phù hợp làm cache: giữ được lâu nếu còn chỗ, tự nhường khi cần. Nhược điểm là hành vi khó đoán và có thể khiến GC làm việc vất vả trước khi chịu dọn.",
 "<b>Weak reference.</b> Bị thu hồi ngay ở lần GC kế tiếp nếu không còn strong reference nào khác. Dùng để gắn metadata cho object mà không muốn kéo dài vòng đời của nó — <code>WeakHashMap</code> là ứng dụng điển hình.",
 "<b>Phantom reference.</b> Không bao giờ lấy được object qua nó (<code>get()</code> luôn trả null); mục đích duy nhất là nhận thông báo qua <code>ReferenceQueue</code> sau khi object đã bị thu hồi. Dùng để dọn tài nguyên native một cách đáng tin cậy, thay cho <code>finalize()</code>.",
 "<b>Cạm bẫy kinh điển với ThreadLocal.</b> <code>ThreadLocalMap</code> dùng <b>weak reference cho key</b> nhưng <b>strong reference cho value</b>. Khi biến ThreadLocal không còn được tham chiếu, key bị dọn nhưng value vẫn bị giữ bởi thread — và trong thread pool thì thread sống mãi, nên value không bao giờ được giải phóng. Đây là lý do bắt buộc phải gọi <code>remove()</code> trong khối <code>finally</code>."]}
];
const QUESTIONS_2 = [
/* ============ 4. COLLECTIONS ============ */
{id:"4.1", t:4, p:1, q:"Bạn đã dùng những Collection nào? Vẽ cây phân cấp Collection Framework", a:[
 "<code>Iterable</code> → <code>Collection</code> → <b>List</b>, <b>Set</b>, <b>Queue</b>. <b>Map</b> đứng riêng, không kế thừa Collection.",
 "List: ArrayList, LinkedList, CopyOnWriteArrayList.",
 "Set: HashSet, LinkedHashSet, TreeSet.",
 "Queue/Deque: ArrayDeque, PriorityQueue, LinkedBlockingQueue.",
 "Map: HashMap, LinkedHashMap, TreeMap, ConcurrentHashMap.",
 "Nên trả lời kèm việc bạn thực sự chọn cái nào trong dự án và vì sao."]},

{id:"4.2", t:4, p:1, q:"List khác gì với Set?", a:[
 "List: có thứ tự theo index, <b>cho phép trùng</b>, truy cập theo vị trí.",
 "Set: <b>không trùng</b>, thường không đảm bảo thứ tự (trừ LinkedHashSet / TreeSet).",
 "Set kiểm tra trùng dựa trên <code>equals()</code> + <code>hashCode()</code> (hoặc <code>compareTo()</code> với TreeSet).",
 "<code>contains()</code> trên ArrayList là O(n), trên HashSet là O(1) — khác biệt lớn khi dữ liệu nhiều."]},

{id:"4.3", t:4, p:2, q:"ArrayList vs LinkedList — độ phức tạp và khi nào dùng", a:[
 "ArrayList: mảng động. get O(1), add cuối O(1) amortized, chèn/xoá giữa O(n) do phải dịch phần tử.",
 "LinkedList: doubly linked list. get O(n), chèn/xoá O(1) <b>nếu đã có con trỏ node</b>.",
 "Bẫy: chèn giữa LinkedList vẫn O(n) vì phải duyệt tới vị trí đó trước.",
 "Thực tế <b>gần như luôn chọn ArrayList</b> — cache locality tốt hơn nhiều, LinkedList tốn 3 object header mỗi phần tử.",
 "LinkedList chỉ hợp khi dùng như Deque, mà <code>ArrayDeque</code> còn nhanh hơn."]},

{id:"4.4", t:4, p:3, q:"HashMap vs HashSet — quan hệ giữa chúng?", a:[
 "<b>HashSet bọc HashMap bên trong</b>: mỗi phần tử là key, value là một object hằng dùng chung (<code>PRESENT</code>).",
 "Vì vậy hai cấu trúc có cùng đặc tính hiệu năng và cùng phụ thuộc <code>equals</code>/<code>hashCode</code>.",
 "HashMap lưu cặp key-value; HashSet chỉ lưu phần tử duy nhất.",
 "<code>set.add(x)</code> thực chất là <code>map.put(x, PRESENT) == null</code>."]},

{id:"4.5", t:4, p:3, q:"HashMap hoạt động bên trong thế nào?", anim:"hashmap", a:[
 "Mảng <code>Node[] table</code> (bucket). Chỉ số = <code>(n-1) &amp; hash(key)</code>.",
 "<code>hash()</code> lấy <code>hashCode()</code> rồi XOR với 16 bit cao (spread) để giảm va chạm khi bảng nhỏ.",
 "Va chạm → nối vào linked list tại bucket đó.",
 "Load factor mặc định <b>0.75</b>: khi size > capacity × 0.75 thì <b>resize gấp đôi</b> và rehash lại toàn bộ.",
 "Capacity luôn là luỹ thừa của 2 để thay phép chia bằng phép AND bit.",
 "get: tính hash → tìm bucket → so <code>hash</code> rồi <code>equals</code> trong bucket."]},

{id:"4.6", t:4, p:3, q:"Từ Java 8, khi 1 bucket có hơn 8 phần tử thì chuyện gì xảy ra?", trap:true, anim:"hashmap", a:[
 "Linked list được chuyển thành <b>red-black tree</b> (treeify).",
 "Độ phức tạp worst-case của bucket đó: <b>O(n) → O(log n)</b>.",
 "Điều kiện đầy đủ: bucket ≥ 8 phần tử <b>và</b> capacity của bảng ≥ 64; nếu capacity nhỏ hơn thì JVM chọn resize thay vì treeify.",
 "Khi số phần tử trong bucket giảm xuống ≤ 6 thì chuyển ngược về linked list (untreeify).",
 "Mục đích: phòng thủ trước <b>hash collision DoS attack</b> — kẻ tấn công cố tình gửi key trùng hash để đẩy HashMap về O(n)."]},

{id:"4.7", t:4, p:1, q:"Có push trùng key vào HashMap được không? Chuyện gì xảy ra?", a:[
 "Được — nhưng không tạo entry mới, mà <b>ghi đè value cũ</b>.",
 "<code>put()</code> trả về value cũ (hoặc <code>null</code> nếu chưa có) → dùng để biết đã tồn tại chưa.",
 "HashMap cho phép <b>1 key null</b> (nằm ở bucket 0) và nhiều value null.",
 "Muốn không ghi đè: <code>putIfAbsent()</code>, hoặc <code>merge()</code>/<code>compute()</code> để gộp giá trị."]},

{id:"4.8", t:4, p:3, q:"Key của HashMap là object custom được không? Cần điều kiện gì?", a:[
 "Được, nhưng bắt buộc override <b>cả</b> <code>equals()</code> và <code>hashCode()</code>.",
 "Nên để class <b>immutable</b>, hoặc ít nhất các field dùng trong hashCode phải không đổi.",
 "hashCode nên phân bố đều để tránh dồn về ít bucket.",
 "Nếu không override: dùng mặc định của <code>Object</code> (dựa trên identity) → hai object cùng nội dung vẫn là 2 key khác nhau.",
 "<code>record</code> tự sinh sẵn equals/hashCode → là lựa chọn tốt làm composite key."]},

{id:"4.9", t:4, p:3, q:"Nếu A.equals(B) nhưng hashCode() khác nhau, dùng cả hai làm key thì sao?", trap:true, anim:"hashmap", a:[
 "Hai object rơi vào <b>hai bucket khác nhau</b> → tồn tại song song như 2 entry riêng biệt.",
 "HashMap tìm bucket <b>trước</b>, so equals <b>sau</b> — nên equals không bao giờ được gọi giữa chúng.",
 "Hệ quả: <code>map.get(B)</code> có thể trả <code>null</code> dù <code>map.containsKey(A)</code> là true.",
 "Đây là dạng bug âm thầm, không exception, chỉ sai dữ liệu — rất khó truy vết.",
 "Vi phạm trực tiếp contract: <i>equals bằng nhau thì hashCode bắt buộc bằng nhau</i>."]},

{id:"4.10", t:4, p:3, q:"Ngược lại: hashCode() giống nhưng equals() khác thì sao?", a:[
 "Hoàn toàn <b>hợp lệ</b> — đó chính là hash collision bình thường.",
 "Hai object nằm cùng bucket, được phân biệt bằng <code>equals()</code>.",
 "Không sai dữ liệu, chỉ giảm hiệu năng nếu quá nhiều va chạm.",
 "Trường hợp cực đoan (<code>hashCode()</code> luôn return 0) vẫn chạy đúng nhưng thoái hoá về O(n) hoặc O(log n) sau treeify."]},

{id:"4.11", t:4, p:3, q:"Contract giữa equals() và hashCode()", a:[
 "1 — Nếu <code>a.equals(b)</code> thì <b>bắt buộc</b> <code>a.hashCode() == b.hashCode()</code>.",
 "2 — hashCode bằng nhau <b>không</b> bắt buộc equals bằng nhau (được phép va chạm).",
 "3 — hashCode phải <b>nhất quán</b>: gọi nhiều lần trên object không đổi phải cho cùng kết quả.",
 "equals còn phải: reflexive, symmetric, transitive, consistent, và <code>x.equals(null)</code> luôn false.",
 "Luôn override cả cặp cùng lúc, hoặc dùng <code>record</code>/Lombok/IDE generate."]},

{id:"4.12", t:4, p:3, q:"Nếu key là mutable object và bạn sửa field sau khi put thì sao?", trap:true, anim:"mutablekey", a:[
 "Object <b>vẫn nằm ở bucket cũ</b> (tính theo hash lúc put), nhưng hashCode giờ đã đổi.",
 "<code>get(key)</code> tính hash mới → tìm sang bucket khác → <b>không thấy gì, trả về null</b>.",
 "Ngay cả khi truyền đúng chính object đó vào cũng không lấy ra được.",
 "Entry vẫn chiếm bộ nhớ, <code>remove()</code> cũng thất bại → dạng memory leak.",
 "Chỉ còn duyệt <code>entrySet()</code> mới thấy nó — đây là lý do <b>key phải immutable</b>."]},

{id:"4.13", t:4, p:2, q:"HashMap vs LinkedHashMap vs TreeMap", a:[
 "<b>HashMap</b>: O(1), không đảm bảo thứ tự.",
 "<b>LinkedHashMap</b>: O(1), giữ thứ tự chèn (hoặc access-order) nhờ doubly linked list phụ → dựng LRU cache bằng cách override <code>removeEldestEntry()</code>.",
 "<b>TreeMap</b>: O(log n), sắp xếp theo key (Comparable/Comparator), hỗ trợ truy vấn khoảng (<code>headMap</code>, <code>subMap</code>, <code>floorKey</code>).",
 "TreeMap <b>không cho key null</b> vì phải so sánh."]},

{id:"4.14", t:4, p:3, q:"HashMap vs Hashtable vs ConcurrentHashMap", a:[
 "<b>HashMap</b>: không thread-safe, cho phép null key/value, nhanh nhất.",
 "<b>Hashtable</b>: đồng bộ toàn bộ bằng <code>synchronized</code> trên từng method → nghẽn cổ chai. Legacy, không dùng nữa.",
 "<b>ConcurrentHashMap</b>: thread-safe với khoá mịn, không cho null key/value, throughput cao.",
 "ConcurrentHashMap cấm null vì trong môi trường concurrent không phân biệt được 'không có key' và 'value là null'.",
 "<code>Collections.synchronizedMap()</code> cũng khoá toàn cục → vẫn kém ConcurrentHashMap."]},

{id:"4.15", t:4, p:3, q:"ConcurrentHashMap đạt thread-safe bằng cách nào?", a:[
 "<b>Java 7</b>: chia thành các <b>Segment</b> (mặc định 16), mỗi segment một lock → tối đa 16 thread ghi song song.",
 "<b>Java 8+</b>: bỏ segment. Ghi vào bucket rỗng dùng <b>CAS</b> (không khoá); nếu bucket đã có phần tử thì <code>synchronized</code> trên <b>node đầu của bucket đó</b>.",
 "→ Mức độ song song bằng số bucket, mịn hơn nhiều so với 16 segment.",
 "Đọc <b>hoàn toàn không khoá</b> nhờ <code>volatile</code> node.",
 "<code>size()</code> dùng bộ đếm phân tán (<code>CounterCell</code>), chỉ là ước lượng gần đúng."]},

{id:"4.16", t:4, p:2, q:"fail-fast vs fail-safe iterator, ConcurrentModificationException", a:[
 "<b>fail-fast</b> (ArrayList, HashMap): iterator giữ <code>modCount</code>; nếu collection bị sửa ngoài iterator → ném <code>ConcurrentModificationException</code> ngay.",
 "Xảy ra cả trong <b>single thread</b> nếu gọi <code>list.remove()</code> trong vòng for-each.",
