 "Cách đúng: dùng <code>iterator.remove()</code>, hoặc <code>removeIf()</code>, hoặc gom rồi <code>removeAll()</code>.",
 "<b>fail-safe</b> (CopyOnWriteArrayList, ConcurrentHashMap): duyệt trên snapshot hoặc chấp nhận thay đổi → không ném, nhưng có thể đọc dữ liệu cũ.",
 "CME là thiết kế cố ý: thà fail sớm còn hơn duyệt sai âm thầm."]},

{id:"4.17", t:4, p:2, q:"Comparable vs Comparator", a:[
 "<b>Comparable</b>: nằm trong chính class, định nghĩa thứ tự <i>tự nhiên</i>, method <code>compareTo()</code>. Chỉ 1 cách sắp xếp.",
 "<b>Comparator</b>: nằm ngoài, method <code>compare()</code>, tạo được nhiều tiêu chí khác nhau.",
 "Java 8: <code>Comparator.comparing(X::getA).thenComparing(X::getB).reversed()</code>.",
 "compareTo nên <b>nhất quán với equals</b> — nếu không, TreeSet/TreeMap sẽ hành xử khác HashSet/HashMap trên cùng dữ liệu."]},

/* ============ 5. CONCURRENCY ============ */
{id:"5.1", t:5, p:3, q:"Multithread vs Multiprocess", a:[
 "<b>Thread</b>: chia sẻ chung không gian địa chỉ (heap, file descriptor) trong một process; context switch rẻ; giao tiếp qua bộ nhớ chung.",
 "<b>Process</b>: bộ nhớ tách biệt hoàn toàn; context switch đắt (đổi page table, xả TLB); giao tiếp qua IPC/socket/pipe.",
 "Thread: nhanh, nhẹ, nhưng một lỗi (OOM, crash) hạ cả process; phải tự lo đồng bộ.",
 "Process: cách ly tốt, một process chết không ảnh hưởng cái khác; đổi lại tốn tài nguyên.",
 "Java thiên về multithread; scale ngang ở tầng process thường giao cho container/K8s."]},

{id:"5.2", t:5, p:3, q:"Thread-safe là gì? Unthread-safe là gì?", a:[
 "Thread-safe: code cho kết quả <b>đúng và nhất quán</b> khi nhiều thread chạy đồng thời, không cần đồng bộ từ bên ngoài.",
 "Không thread-safe: có <b>shared mutable state</b> mà không được bảo vệ → race condition, dữ liệu sai, vô hạn lặp (HashMap resize đồng thời ở Java 7).",
 "Ba điều kiện đủ để an toàn: không chia sẻ, hoặc không thay đổi, hoặc có đồng bộ.",
 "Ba vấn đề cần giải: <b>atomicity</b>, <b>visibility</b> (cache CPU), <b>ordering</b> (reordering của compiler/CPU).",
 "Lưu ý: thread-safe ở từng thao tác không đảm bảo thread-safe cho <b>chuỗi thao tác</b> (check-then-act)."]},

{id:"5.3", t:5, p:3, q:"Race condition, deadlock, livelock, starvation", a:[
 "<b>Race condition</b>: kết quả phụ thuộc thứ tự thực thi. Điển hình: check-then-act, read-modify-write (<code>i++</code>).",
 "<b>Deadlock</b>: các thread chờ lock của nhau vòng tròn, đứng im mãi. Cần đủ 4 điều kiện Coffman.",
 "<b>Livelock</b>: các thread vẫn chạy, liên tục nhường nhau nhưng không ai tiến triển.",
 "<b>Starvation</b>: một thread mãi không được cấp tài nguyên do bị thread khác giành liên tục.",
 "Phòng deadlock: luôn lấy lock theo <b>cùng một thứ tự</b>, dùng <code>tryLock()</code> có timeout, giảm phạm vi lock.",
 "Phát hiện: <code>jstack</code> báo trực tiếp 'Found one Java-level deadlock'."]},

{id:"5.4", t:5, p:3, q:"Các cách tránh unthread-safe", a:[
 "<b>Không chia sẻ</b> — biến local, thread confinement, <code>ThreadLocal</code>.",
 "<b>Bất biến</b> — immutable object không cần đồng bộ.",
 "<b>Đồng bộ</b> — <code>synchronized</code>, <code>ReentrantLock</code>, <code>ReadWriteLock</code>.",
 "<b>Atomic</b> — <code>AtomicInteger</code>, <code>LongAdder</code> cho phép cập nhật không khoá.",
 "<b>Concurrent collection</b> — ConcurrentHashMap, BlockingQueue thay vì tự khoá.",
 "<b>volatile</b> cho biến cờ chỉ ghi/đọc đơn giản.",
 "Ưu tiên theo thứ tự này: không chia sẻ > bất biến > concurrent collection > lock thủ công."]},

{id:"5.5", t:5, p:3, q:"Runnable là gì? Có những method nào?", a:[
 "Functional interface, đúng <b>một method</b>: <code>void run()</code>.",
 "Không trả về giá trị, <b>không throw checked exception</b>.",
 "Dùng cho <code>new Thread(runnable)</code> và <code>executor.execute()</code>.",
 "Vì <code>run()</code> không throw checked exception nên mọi lỗi phải xử lý bên trong hoặc bọc thành unchecked.",
 "Exception không bắt sẽ đi tới <code>UncaughtExceptionHandler</code> và thường <b>biến mất lặng lẽ</b> trong thread pool."]},

{id:"5.6", t:5, p:3, q:"So sánh Runnable vs Callable", a:[
 "<code>Runnable.run()</code> → <code>void</code>, không throw checked exception.",
 "<code>Callable&lt;V&gt;.call()</code> → trả về <code>V</code>, <b>được throw checked exception</b>.",
 "Callable dùng với <code>executor.submit()</code> → trả về <code>Future&lt;V&gt;</code>; Runnable dùng với <code>execute()</code> → không có kết quả.",
 "Exception trong Callable được <b>giữ lại</b> và ném ra khi gọi <code>future.get()</code> dưới dạng <code>ExecutionException</code>.",
 "Đây là lý do nên ưu tiên <code>submit()</code>: <code>execute()</code> làm exception bị nuốt mất.",
 "Chuyển đổi: <code>Executors.callable(runnable)</code>."]},

{id:"5.7", t:5, p:2, q:"Future là gì? Các method? Hạn chế?", a:[
 "Đại diện cho kết quả của tác vụ bất đồng bộ sẽ có trong tương lai.",
 "Method: <code>get()</code>, <code>get(timeout)</code>, <code>cancel()</code>, <code>isDone()</code>, <code>isCancelled()</code>.",
 "Hạn chế lớn: <code>get()</code> <b>blocking</b> — mất luôn ý nghĩa async nếu gọi ngay.",
 "Không chain được, không kết hợp nhiều Future, không có callback khi hoàn thành, không xử lý exception theo kiểu functional.",
 "→ <code>CompletableFuture</code> ra đời để giải quyết đúng những điểm này."]},

{id:"5.8", t:5, p:3, q:"CompletableFuture giải quyết vấn đề gì? Các method chính?", a:[
 "Cho phép <b>chain</b> và <b>kết hợp</b> tác vụ async mà không block.",
 "<code>thenApply</code> — biến đổi kết quả (sync). <code>thenApplyAsync</code> — chạy trên pool khác.",
 "<code>thenCompose</code> — nối hai async phụ thuộc nhau (flatMap, tránh Future lồng Future).",
 "<code>thenCombine</code> — gộp kết quả 2 future độc lập chạy song song.",
 "<code>allOf</code> / <code>anyOf</code> — chờ tất cả / chờ cái đầu tiên xong.",
 "<code>exceptionally</code> / <code>handle</code> / <code>whenComplete</code> — xử lý lỗi.",
 "Mặc định chạy trên <code>ForkJoinPool.commonPool()</code> → <b>nên truyền executor riêng</b> cho tác vụ có I/O."]},

{id:"5.9", t:5, p:2, q:"Gọi thread.run() thay vì thread.start() thì sao?", trap:true, a:[
 "<code>run()</code> chỉ là lời gọi method thông thường → chạy <b>trên thread hiện tại</b>, tuần tự.",
 "<b>Không</b> có thread mới nào được tạo, không có gì song song.",
 "<code>start()</code> mới yêu cầu JVM cấp OS thread rồi gọi <code>run()</code> trong đó.",
 "Gọi <code>start()</code> hai lần trên cùng object → <code>IllegalThreadStateException</code>."]},

{id:"5.10", t:5, p:2, q:"Vòng đời của Thread", a:[
 "<b>NEW</b> → đã tạo, chưa <code>start()</code>.",
 "<b>RUNNABLE</b> → sẵn sàng hoặc đang chạy (Java không tách riêng RUNNING).",
 "<b>BLOCKED</b> → đang chờ lấy monitor lock để vào khối <code>synchronized</code>.",
 "<b>WAITING</b> → chờ vô hạn: <code>wait()</code>, <code>join()</code>, <code>park()</code>.",
 "<b>TIMED_WAITING</b> → chờ có hạn: <code>sleep(n)</code>, <code>wait(n)</code>, <code>tryLock(timeout)</code>.",
 "<b>TERMINATED</b> → đã kết thúc, không quay lại được.",
 "Đọc <code>jstack</code>: nhiều thread BLOCKED trên cùng một lock = điểm nghẽn."]},

{id:"5.11", t:5, p:3, q:"synchronized vs ReentrantLock", a:[
 "<code>synchronized</code>: keyword, JVM tự nhả lock kể cả khi exception; đơn giản, khó sai.",
 "<code>ReentrantLock</code>: phải <code>unlock()</code> trong <code>finally</code>, đổi lại linh hoạt hơn nhiều.",
 "Chỉ ReentrantLock có: <code>tryLock()</code>, <code>tryLock(timeout)</code>, <code>lockInterruptibly()</code>, <b>fairness</b>, nhiều <code>Condition</code>.",
 "Hiệu năng ngày nay gần như tương đương (JVM có biased/lightweight lock).",
 "Chọn: mặc định <code>synchronized</code>; dùng ReentrantLock khi cần timeout, tránh deadlock, hoặc nhiều điều kiện chờ.",
 "Với virtual thread, <code>synchronized</code> gây <b>pinning</b> → nên chuyển sang ReentrantLock."]},

{id:"5.12", t:5, p:3, q:"volatile giải quyết vấn đề gì? Nó có đảm bảo atomic không?", a:[
 "Đảm bảo <b>visibility</b>: ghi xong thì mọi thread khác đọc thấy ngay (đọc/ghi thẳng main memory, không dùng cache CPU cục bộ).",
 "Đảm bảo <b>ordering</b>: chặn reordering qua memory barrier, tạo quan hệ happens-before.",
 "<b>KHÔNG đảm bảo atomicity</b>: <code>count++</code> trên biến volatile vẫn sai vì đó là 3 thao tác read-modify-write.",
 "Dùng đúng: biến cờ boolean (<code>volatile boolean running</code>), double-checked locking, publish object đã khởi tạo xong.",
 "Cần atomic → dùng <code>AtomicInteger</code> hoặc <code>synchronized</code>."]},

{id:"5.13", t:5, p:2, q:"Java Memory Model, happens-before", a:[
 "JMM định nghĩa khi nào một thread <b>chắc chắn nhìn thấy</b> thay đổi của thread khác.",
 "Cần thiết vì compiler và CPU được phép reorder lệnh, và mỗi core có cache riêng.",
 "Các quan hệ happens-before chính: trong cùng thread theo thứ tự chương trình; <code>unlock</code> trước <code>lock</code> cùng monitor; ghi <code>volatile</code> trước đọc nó; <code>Thread.start()</code> trước mọi lệnh trong thread con; mọi lệnh trong thread trước <code>join()</code> trả về.",
 "Có tính bắc cầu: A hb B, B hb C → A hb C.",
 "Không có happens-before thì việc thấy hay không thấy là <b>không xác định</b> — chạy đúng trên máy dev không chứng minh được gì."]},

{id:"5.14", t:5, p:2, q:"Atomic classes hoạt động thế nào? CAS là gì? Vấn đề ABA?", a:[
 "<b>CAS (Compare-And-Swap)</b>: lệnh CPU nguyên tử — 'nếu giá trị hiện tại đúng bằng V cũ thì ghi V mới'.",
 "Atomic class lặp CAS trong vòng while cho tới khi thành công → <b>lock-free</b>, không block thread.",
 "Ưu: không deadlock, không context switch. Nhược: tranh chấp cao thì quay vòng tốn CPU.",
 "<b>ABA</b>: giá trị đổi A→B→A, CAS tưởng chưa ai đụng vào nhưng thực tế đã thay đổi. Khắc phục bằng <code>AtomicStampedReference</code> (gắn thêm số phiên bản).",
 "Ghi rất nhiều thread → dùng <code>LongAdder</code> thay <code>AtomicLong</code> (tách bộ đếm theo cell, giảm cache contention)."]},

{id:"5.15", t:5, p:3, q:"ExecutorService và ThreadPoolExecutor hoạt động ra sao?", anim:"threadpool", a:[
 "Tách việc <b>tạo thread</b> khỏi việc <b>gửi task</b> — tái sử dụng thread, giới hạn tài nguyên.",
 "Tham số: <code>corePoolSize</code>, <code>maximumPoolSize</code>, <code>keepAliveTime</code>, <code>workQueue</code>, <code>threadFactory</code>, <code>rejectedHandler</code>.",
 "Thứ tự xử lý task mới: (1) chưa đủ core → tạo thread mới; (2) đủ core → <b>đẩy vào queue</b>; (3) queue đầy → tạo thêm thread tới max; (4) vẫn không được → gọi reject handler.",
 "<code>Executors.newFixedThreadPool()</code> dùng queue <b>không giới hạn</b> → maxPoolSize vô nghĩa, và OOM khi task dồn.",
 "<code>newCachedThreadPool()</code> có max = Integer.MAX_VALUE → tạo thread không kiểm soát.",
 "Khuyến nghị: tự tạo <code>ThreadPoolExecutor</code> với bounded queue."]},

{id:"5.16", t:5, p:3, q:"core=2, max=10, queue=100, gửi 50 task cùng lúc → bao nhiêu thread chạy?", trap:true, anim:"threadpool", a:[
 "<b>Chỉ 2 thread.</b>",
 "Vì queue sức chứa 100 vẫn còn chỗ cho 48 task còn lại → pool <b>không có lý do</b> tạo thêm thread.",
 "Pool chỉ vượt corePoolSize <b>sau khi queue đã đầy</b>.",
 "Muốn thấy 10 thread thì phải gửi hơn 102 task cùng lúc (2 đang chạy + 100 trong queue).",
 "Trực giác thường sai theo hướng ngược lại — tưởng pool tăng thread trước rồi mới xếp hàng.",
 "Hệ quả thực tế: đặt queue quá lớn khiến maxPoolSize thành trang trí, và latency tăng vì task nằm chờ."]},

{id:"5.17", t:5, p:2, q:"RejectedExecutionHandler có mấy policy?", a:[
 "<b>AbortPolicy</b> (mặc định) — ném <code>RejectedExecutionException</code>.",
 "<b>CallerRunsPolicy</b> — thread gọi tự chạy task → tạo back-pressure tự nhiên, làm chậm nguồn gửi. Thường là lựa chọn tốt nhất.",
 "<b>DiscardPolicy</b> — bỏ lặng lẽ, nguy hiểm vì mất dữ liệu không dấu vết.",
 "<b>DiscardOldestPolicy</b> — bỏ task cũ nhất trong queue rồi thử lại.",
 "Tự viết handler để log, đẩy vào DLQ, hoặc ghi metric cảnh báo."]},

{id:"5.18", t:5, p:3, q:"Async hoạt động như thế nào? @Async trong Spring cần gì?", a:[
 "Async = giao việc cho thread khác, thread gọi trả về ngay, không chờ kết quả.",
 "Spring: bật <code>@EnableAsync</code>, đặt <code>@Async</code> lên method, method nên trả <code>void</code> hoặc <code>CompletableFuture</code>.",
 "Cơ chế: <b>AOP proxy</b> chặn lời gọi, đẩy task sang <code>TaskExecutor</code>.",
 "Mặc định Spring Boot dùng <code>SimpleAsyncTaskExecutor</code> — <b>tạo thread mới mỗi lần</b>, không phải pool → phải cấu hình <code>ThreadPoolTaskExecutor</code> riêng.",
 "Exception trong <code>@Async void</code> bị nuốt mất → cần <code>AsyncUncaughtExceptionHandler</code>.",
 "<code>SecurityContext</code> và transaction <b>không</b> tự truyền sang thread mới."]},

{id:"5.19", t:5, p:3, q:"@Async gọi nội bộ trong cùng class có chạy async không?", trap:true, anim:"proxy", a:[
 "<b>Không.</b> Y hệt bẫy của <code>@Transactional</code>.",
 "Gọi <code>this.methodAsync()</code> là lời gọi Java thuần, <b>không đi qua proxy</b> → annotation vô hiệu.",
 "Kết quả: chạy đồng bộ trên chính thread hiện tại, và không có cảnh báo nào.",
 "Cách khắc phục: tách sang bean khác, self-inject proxy, dùng <code>AopContext.currentProxy()</code>, hoặc AspectJ load-time weaving.",
 "Cùng nguyên lý áp dụng cho <code>@Transactional</code>, <code>@Cacheable</code>, <code>@PreAuthorize</code>, <code>@Retryable</code>."]},

{id:"5.20", t:5, p:3, q:"Virtual Thread (Java 21) là gì? Khác platform thread thế nào? Pinning?", a:[
 "Thread nhẹ do <b>JVM</b> quản lý, không ánh xạ 1-1 với OS thread; nhiều virtual thread được mount/unmount lên một nhóm carrier thread.",
 "Stack lưu trên heap, khởi tạo ~vài trăm byte thay vì ~1MB → tạo hàng triệu thread là bình thường.",
 "Khi gặp blocking I/O, virtual thread tự <b>unmount</b>, trả carrier thread lại cho task khác → viết code blocking mà đạt hiệu quả như async.",
 "Rất gần mô hình goroutine của Go — khác ở chỗ scheduler của Java dùng ForkJoinPool và không có channel dựng sẵn.",
 "<b>Pinning</b>: đang trong khối <code>synchronized</code> hoặc native call thì <b>không unmount được</b>, giữ luôn carrier thread → mất hết lợi ích, có thể cạn pool. Khắc phục bằng <code>ReentrantLock</code>.",
 "Không hợp với tác vụ CPU-bound; pooling virtual thread là phản mẫu (chúng vốn đã rẻ)."]},

{id:"5.21", t:5, p:2, q:"ThreadLocal dùng để làm gì? Rủi ro memory leak với thread pool?", a:[
 "Mỗi thread giữ một bản riêng → tránh chia sẻ mà không cần khoá.",
 "Dùng cho: <code>SecurityContextHolder</code>, transaction context, MDC log correlation ID, <code>SimpleDateFormat</code> (vốn không thread-safe).",
 "<b>Leak</b>: <code>ThreadLocalMap</code> giữ key là weak reference nhưng <b>value là strong</b>. Thread trong pool sống mãi → value không bao giờ được dọn.",
 "Nghiêm trọng hơn: dữ liệu của request trước còn sót lại và <b>rò rỉ sang request sau</b> — lỗi bảo mật thực sự.",
 "Bắt buộc gọi <code>remove()</code> trong <code>finally</code>."]},

{id:"5.22", t:5, p:2, q:"wait() / notify() / notifyAll() — tại sao phải gọi trong synchronized?", a:[
 "Vì cần giữ monitor lock để tránh <b>lost wakeup</b>: nếu kiểm tra điều kiện và gọi <code>wait()</code> không nguyên tử, <code>notify()</code> có thể xảy ra ở giữa và bị bỏ lỡ mãi mãi.",
 "<code>wait()</code> nhả lock rồi chờ; <code>notify()</code> đánh thức nhưng <b>chưa</b> nhả lock cho tới khi ra khỏi khối synchronized.",
 "Luôn gọi <code>wait()</code> trong vòng <code>while</code>, không dùng <code>if</code> — vì có <b>spurious wakeup</b> và điều kiện có thể đã bị thread khác lấy mất.",
 "<code>notifyAll()</code> an toàn hơn <code>notify()</code> khi có nhiều điều kiện chờ khác nhau.",
 "Thực tế nên dùng <code>BlockingQueue</code>, <code>CountDownLatch</code>, <code>Condition</code> thay vì tự viết."]},

{id:"5.23", t:5, p:1, q:"CountDownLatch vs CyclicBarrier vs Semaphore", a:[
 "<b>CountDownLatch</b>: đếm ngược một chiều, dùng một lần. Chờ N việc xong rồi mới đi tiếp.",
 "<b>CyclicBarrier</b>: các thread chờ nhau tại một điểm, đủ N thì cùng đi tiếp; <b>tái sử dụng</b> được, có thể chạy barrier action.",
 "<b>Semaphore</b>: giới hạn số thread truy cập đồng thời (rate limit, giới hạn kết nối).",
 "Khác biệt cốt lõi: latch chờ <i>sự kiện</i>, barrier chờ <i>các thread khác</i>, semaphore quản <i>số lượng giấy phép</i>.",
 "Java 21 bổ sung <code>StructuredTaskScope</code> cho việc chờ nhóm task có cấu trúc."]}
];
const QUESTIONS_3 = [
/* ============ 6. IMMUTABLE / EXCEPTION / SERIALIZATION ============ */
{id:"6.1", t:6, p:3, q:"So sánh Mutable và Immutable. Ưu nhược điểm của immutable?", a:[
 "Immutable: state cố định sau khi khởi tạo, mọi 'thay đổi' đều trả về object mới.",
 "<b>Ưu</b>: thread-safe miễn phí, an toàn làm key của Map/Set, cache được hashCode, dễ suy luận, không bị sửa ngầm khi truyền đi.",
 "<b>Nhược</b>: tạo nhiều object → áp lực GC; tốn kém khi object lớn thay đổi liên tục.",
 "Ví dụ immutable trong JDK: <code>String</code>, wrapper class, <code>LocalDate</code>, <code>BigDecimal</code>, <code>List.of()</code>, <code>record</code>.",
 "Nguyên tắc thực dụng: mặc định immutable, chỉ mutable khi đo được là cần."]},

{id:"6.2", t:6, p:3, q:"Cách tạo một class immutable hoàn chỉnh?", a:[
 "Khai báo class <code>final</code> (chặn class con phá vỡ tính bất biến).",
 "Mọi field <code>private final</code>.",
 "Không setter, không method nào thay đổi state.",
 "Khởi tạo toàn bộ qua constructor.",
 "<b>Defensive copy ở constructor</b>: copy các tham số mutable trước khi gán vào field.",
 "<b>Defensive copy ở getter</b>: trả bản sao hoặc view không sửa được (<code>List.copyOf</code>, <code>Collections.unmodifiableList</code>)."]},

{id:"6.3", t:6, p:3, q:"Tại sao cần defensive copy? Nếu field là List thì sao?", trap:true, a:[
 "Vì <code>final</code> chỉ khoá reference — người gọi vẫn giữ reference tới chính list đó và sửa được từ bên ngoài.",
 "<code>new Person(list); list.add(\"x\");</code> → nội dung bên trong Person <b>bị đổi</b> dù class trông có vẻ immutable.",
 "Tương tự, getter trả thẳng list ra ngoài cũng để lộ state nội bộ.",
 "Đúng: <code>this.items = List.copyOf(items);</code> ở constructor và trả về bản không sửa được ở getter.",
 "Lưu ý: <code>List.copyOf</code> là <b>shallow copy</b> — nếu phần tử bên trong mutable thì vẫn chưa an toàn tuyệt đối."]},

{id:"6.4", t:6, p:2, q:"record (Java 16+) có thực sự immutable không?", a:[
 "<b>Shallow immutable</b>: field được khai báo final, có sẵn constructor, accessor, <code>equals</code>, <code>hashCode</code>, <code>toString</code>.",
 "Nhưng nếu component là kiểu mutable (<code>List</code>, mảng, object thường) thì <b>nội dung vẫn sửa được</b>.",
 "Muốn immutable thật: dùng <b>compact constructor</b> để copy phòng thủ.",
 "record không kế thừa class khác được (đã ngầm extends <code>Record</code>), nhưng implement interface được.",
 "Rất hợp làm DTO, value object, composite key của Map."]},

{id:"6.5", t:6, p:3, q:"Checked exception vs unchecked exception", a:[
 "<b>Checked</b>: kế thừa <code>Exception</code> (không qua RuntimeException). Compiler <b>bắt buộc</b> catch hoặc khai báo <code>throws</code>. VD: <code>IOException</code>, <code>SQLException</code>.",
 "<b>Unchecked</b>: kế thừa <code>RuntimeException</code>. Không bắt buộc xử lý. VD: <code>NullPointerException</code>, <code>IllegalArgumentException</code>.",
 "Ý đồ thiết kế: checked cho lỗi <i>có thể phục hồi</i>, unchecked cho lỗi <i>do lập trình sai</i>.",
 "Thực tế nhiều framework hiện đại (Spring, Hibernate) chuyển hết sang unchecked vì checked làm bẩn signature và khuyến khích catch rỗng.",
 "Ảnh hưởng trực tiếp tới Spring: <b>chỉ unchecked mới rollback mặc định</b>."]},

{id:"6.6", t:6, p:2, q:"Error vs Exception", a:[
 "Cả hai kế thừa <code>Throwable</code>.",
 "<b>Error</b>: lỗi nghiêm trọng ở tầng JVM, ứng dụng không nên và không thể xử lý — <code>OutOfMemoryError</code>, <code>StackOverflowError</code>.",
 "<b>Exception</b>: điều kiện bất thường mà ứng dụng có thể xử lý.",
 "Không nên <code>catch (Throwable)</code> vì sẽ nuốt luôn Error và che giấu tình trạng JVM đang hỏng.",
 "Spring rollback với cả <code>RuntimeException</code> <b>và</b> <code>Error</code>."]},

{id:"6.7", t:6, p:3, q:"Spring rollback mặc định với loại exception nào?", trap:true, a:[
 "Chỉ với <b>unchecked exception</b> (<code>RuntimeException</code>) và <b>Error</b>.",
 "<b>Checked exception KHÔNG rollback</b> — transaction vẫn commit bình thường.",
 "Đây là nguồn bug nghiêm trọng: ném <code>IOException</code> giữa chừng, dữ liệu dở dang vẫn được ghi.",
 "Khắc phục: <code>@Transactional(rollbackFor = Exception.class)</code>.",
 "Lý do lịch sử: EJB quy ước checked exception là 'lỗi nghiệp vụ đã lường trước', Spring giữ tương thích.",
 "Rất nhiều team đặt <code>rollbackFor = Exception.class</code> làm mặc định cho toàn dự án."]},

{id:"6.8", t:6, p:2, q:"try-with-resources và AutoCloseable", a:[
 "Tự động gọi <code>close()</code> theo thứ tự <b>ngược</b> với thứ tự khai báo, kể cả khi có exception.",
 "Điều kiện: resource phải implement <code>AutoCloseable</code> (hoặc <code>Closeable</code>).",
 "Giải quyết vấn đề của finally thủ công: nếu cả body và <code>close()</code> đều ném exception thì exception của close bị 'nuốt'.",
 "try-with-resources giữ exception gốc và gắn exception của close vào <b>suppressed</b> (<code>getSuppressed()</code>).",
 "Từ Java 9 dùng được biến effectively final khai báo sẵn bên ngoài."]},

{id:"6.9", t:6, p:2, q:"Nếu trong finally có return thì sao?", trap:true, a:[
 "<code>return</code> trong <code>finally</code> <b>ghi đè</b> giá trị return của try/catch.",
 "Nghiêm trọng hơn: nó <b>nuốt luôn exception</b> đang được ném ra khỏi try → lỗi biến mất hoàn toàn.",
 "Tương tự với <code>throw</code>, <code>break</code>, <code>continue</code> trong finally.",
 "Đây là anti-pattern, mọi công cụ static analysis đều cảnh báo.",
 "Lưu ý phụ: gán lại biến trong finally không đổi được giá trị đã return với primitive (đã copy sang stack)."]},

{id:"6.10", t:6, p:2, q:"Serializable / Deserializable là gì? Khi nào cần?", a:[
 "Chuyển object thành chuỗi byte để lưu trữ hoặc truyền qua mạng, và khôi phục lại.",
 "Java native: implement <code>Serializable</code> (interface đánh dấu, không có method).",
 "Dùng khi: session replication, cache phân tán, RMI, ghi object ra file.",
 "Thực tế hiện đại phần lớn dùng <b>JSON (Jackson)</b>, <b>Protobuf</b>, <b>Avro</b> thay vì Java serialization — vì cross-language, gọn hơn, an toàn hơn.",
 "Deserialize không kích hoạt constructor — object được dựng lại qua cơ chế riêng của JVM."]},

{id:"6.11", t:6, p:2, q:"serialVersionUID để làm gì? Nếu không khai báo thì sao?", a:[
 "Số phiên bản để kiểm tra tương thích giữa class lúc serialize và lúc deserialize.",
 "Không khai báo → JVM <b>tự sinh</b> dựa trên cấu trúc class (tên field, method, modifier).",
 "Hệ quả: chỉ cần thêm một field hay đổi modifier là UID đổi → <code>InvalidClassException</code> khi đọc dữ liệu cũ.",
 "Nguy hiểm trong hệ thống rolling deploy hoặc cache phân tán có nhiều phiên bản chạy song song.",
 "Luôn khai báo tường minh: <code>private static final long serialVersionUID = 1L;</code>"]},

{id:"6.12", t:6, p:1, q:"transient keyword", a:[
 "Đánh dấu field <b>không</b> được serialize.",
 "Dùng cho: mật khẩu, token, connection, logger, cache tính toán lại được.",
 "Sau khi deserialize, field transient nhận giá trị mặc định (<code>null</code> / <code>0</code> / <code>false</code>).",
 "Khôi phục lại giá trị bằng <code>readObject()</code> tuỳ chỉnh nếu cần."]},

{id:"6.13", t:6, p:1, q:"Rủi ro bảo mật của Java native deserialization", a:[
 "Deserialize dữ liệu <b>không tin cậy</b> có thể dẫn tới <b>RCE</b> (remote code execution).",
 "Cơ chế: kẻ tấn công dựng chuỗi gadget từ các thư viện có sẵn (Commons Collections...), quá trình dựng lại object tự kích hoạt chuỗi lệnh.",
 "Đây là nhóm lỗ hổng nổi tiếng, xuất hiện trong nhiều CVE lớn.",
 "Phòng thủ: không deserialize dữ liệu ngoài, dùng JSON/Protobuf, bật <b>serialization filter</b> (<code>ObjectInputFilter</code>, Java 9+), cập nhật thư viện."]},

/* ============ 7. JAVA 8+ ============ */
{id:"7.1", t:7, p:3, q:"Lambda Expression là gì? Nó được compile thành gì?", a:[
 "Cú pháp gọn để biểu diễn một hàm ẩn danh, cài đặt cho functional interface.",
 "<b>Không</b> phải anonymous class: không sinh ra file <code>.class$1</code>, không có <code>this</code> riêng — <code>this</code> trong lambda trỏ tới object bao ngoài.",
 "Compile thành lệnh <code>invokedynamic</code> + bootstrap <code>LambdaMetafactory</code>, JVM sinh implementation lúc runtime.",
 "Lợi ích: giảm số class phải load, cho phép JIT tối ưu tốt hơn.",
 "Lambda chỉ bắt được biến <b>effectively final</b>."]},

{id:"7.2", t:7, p:3, q:"Functional Interface là gì? @FunctionalInterface để làm gì?", a:[
 "Interface có <b>đúng một abstract method</b> (SAM — Single Abstract Method).",
 "Được phép có nhiều <code>default</code> và <code>static</code> method.",
 "<code>@FunctionalInterface</code> là annotation <b>kiểm tra lúc compile</b> — không bắt buộc, nhưng ngăn người sau vô tình thêm abstract method thứ hai.",
 "Chỉ interface dạng này mới gán được lambda hoặc method reference.",
 "Method của <code>Object</code> (<code>equals</code>, <code>toString</code>) không tính vào số abstract method."]},

{id:"7.3", t:7, p:3, q:"Các functional interface built-in chính?", a:[
 "<code>Function&lt;T,R&gt;</code> — <code>apply</code>: nhận T trả R.",
 "<code>Supplier&lt;T&gt;</code> — <code>get</code>: không nhận gì, trả T (lazy).",
 "<code>Consumer&lt;T&gt;</code> — <code>accept</code>: nhận T, không trả gì.",
 "<code>Predicate&lt;T&gt;</code> — <code>test</code>: nhận T, trả boolean.",
 "<code>BiFunction</code>, <code>BinaryOperator</code>, <code>UnaryOperator</code>, <code>BiConsumer</code>.",
 "Bản primitive tránh autoboxing: <code>IntPredicate</code>, <code>ToIntFunction</code>, <code>IntSupplier</code>...",
 "Kết hợp: <code>andThen</code>, <code>compose</code>, <code>negate</code>, <code>and</code>, <code>or</code>."]},

{id:"7.4", t:7, p:2, q:"Method reference có mấy dạng?", a:[
 "Static: <code>Integer::parseInt</code>.",
 "Instance của object cụ thể: <code>System.out::println</code>.",
 "Instance của object bất kỳ thuộc kiểu đó: <code>String::toUpperCase</code>.",
 "Constructor: <code>ArrayList::new</code>.",
 "Chỉ là đường cú pháp của lambda, giúp code sạch hơn khi lambda chỉ gọi thẳng một method."]},

{id:"7.5", t:7, p:3, q:"Stream API: intermediate vs terminal, lazy evaluation", a:[
 "<b>Intermediate</b> (<code>map</code>, <code>filter</code>, <code>sorted</code>, <code>limit</code>) — trả về Stream mới, <b>lazy</b>, chưa chạy gì.",
 "<b>Terminal</b> (<code>collect</code>, <code>forEach</code>, <code>reduce</code>, <code>count</code>, <code>findFirst</code>) — kích hoạt toàn bộ pipeline.",
 "Không có terminal → không dòng nào được thực thi.",
 "Lazy cho phép <b>short-circuit</b>: <code>findFirst()</code> dừng ngay khi có kết quả, không duyệt hết.",
 "Phần tử đi qua toàn bộ pipeline <b>từng cái một</b>, không phải xử lý hết map rồi mới sang filter.",
 "Stream không lưu dữ liệu và <b>không tái sử dụng được</b>."]},

{id:"7.6", t:7, p:3, q:"map vs flatMap", a:[
 "<code>map</code>: 1 phần tử → 1 phần tử. <code>Stream&lt;T&gt;</code> → <code>Stream&lt;R&gt;</code>.",
 "<code>flatMap</code>: 1 phần tử → 1 stream, rồi <b>làm phẳng</b> tất cả thành một stream duy nhất.",
 "Dùng flatMap khi map sẽ cho ra <code>Stream&lt;List&lt;T&gt;&gt;</code> hoặc <code>Stream&lt;Stream&lt;T&gt;&gt;</code>.",
 "Ví dụ: danh sách đơn hàng → tất cả sản phẩm trong mọi đơn.",
 "Cùng bản chất với <code>Optional.flatMap</code> và <code>CompletableFuture.thenCompose</code>."]},

{id:"7.7", t:7, p:2, q:"Collectors.groupingBy, partitioningBy, joining, toMap", a:[
 "<code>groupingBy(f)</code> → <code>Map&lt;K, List&lt;T&gt;&gt;</code>; có bản 2 tham số với downstream: <code>groupingBy(f, counting())</code>.",
 "<code>partitioningBy(pred)</code> → <code>Map&lt;Boolean, List&lt;T&gt;&gt;</code>, luôn có đủ cả 2 key.",
 "<code>joining(\", \", \"[\", \"]\")</code> nối chuỗi có phân cách và bao ngoài.",
 "<code>toMap(k, v)</code> — <b>ném <code>IllegalStateException</code> nếu key trùng</b>; phải truyền merge function làm tham số thứ ba.",
 "<code>toMap</code> cũng ném NPE nếu value là null (khác <code>HashMap.put</code>)."]},

{id:"7.8", t:7, p:3, q:"Tại sao Stream API lại chậm hơn for loop?", trap:true, a:[
 "<b>Chi phí khởi tạo pipeline</b>: mỗi stage tạo object, spliterator, sink — với vài chục phần tử thì chi phí này lớn hơn chính công việc.",
 "<b>Megamorphic call site</b>: cùng một điểm gọi lambda được dùng cho nhiều implementation khác nhau → JIT không inline được, mất luôn cơ hội tối ưu.",
 "<b>Autoboxing</b>: <code>Stream&lt;Integer&gt;</code> tạo object mỗi phần tử; for loop trên <code>int[]</code> thì không. Dùng <code>IntStream</code> để tránh.",
 "For loop trên mảng được JIT tối ưu rất tốt: loop unrolling, bounds-check elimination, vectorization.",
 "<b>Nhưng</b>: với dữ liệu lớn, pipeline phức tạp, hoặc parallel thì Stream thắng; và khác biệt thường chỉ vài nanosecond/phần tử — không đáng đánh đổi tính dễ đọc trừ khi ở hot path.",
 "Câu trả lời tốt nhất: 'chậm hơn ở trường hợp nào, đo bằng JMH, và ở hầu hết code nghiệp vụ thì khác biệt không đáng kể'."]},

{id:"7.9", t:7, p:3, q:"Khi nào parallelStream() gây hại?", a:[
 "Mặc định chạy trên <b><code>ForkJoinPool.commonPool()</code> dùng chung toàn JVM</b> → một tác vụ chậm làm nghẽn mọi nơi khác.",
 "Task có <b>I/O blocking</b>: chiếm thread của common pool mà không làm gì → tệ hại nhất.",
 "Dữ liệu nhỏ: chi phí chia/gộp lớn hơn lợi ích.",
 "Nguồn khó chia đều: <code>LinkedList</code>, <code>Stream.iterate</code>.",
 "Thao tác cần thứ tự (<code>forEachOrdered</code>) hoặc có state chia sẻ → mất hết lợi ích hoặc sai kết quả.",
 "Trong web server vốn đã đa luồng theo request, parallel stream thường <b>thừa</b>."]},

{id:"7.10", t:7, p:2, q:"Optional — dùng đúng chỗ nào, tránh chỗ nào?", a:[
 "Thiết kế cho <b>return type</b> của method có thể không có kết quả.",
 "<b>Không</b> dùng làm field của entity (không serialize được, tốn bộ nhớ) hay tham số method (bắt caller bọc thừa).",
 "Tránh <code>optional.get()</code> trần — dùng <code>orElse</code>, <code>orElseGet</code>, <code>orElseThrow</code>, <code>map</code>, <code>ifPresent</code>.",
 "<code>orElse</code> luôn tính tham số kể cả khi có giá trị; <code>orElseGet</code> lazy → dùng orElseGet nếu tạo giá trị mặc định tốn kém.",
 "Không trả về <code>Optional&lt;List&gt;</code> — trả list rỗng thay vì đó."]},

{id:"7.11", t:7, p:1, q:"Stream có tái sử dụng được không?", a:[
 "Không. Sau khi gọi terminal operation, stream bị đánh dấu đã tiêu thụ.",
 "Dùng lại → <code>IllegalStateException: stream has already been operated upon or closed</code>.",
 "Muốn dùng nhiều lần: giữ nguồn dữ liệu (collection) và tạo stream mới mỗi lần, hoặc dùng <code>Supplier&lt;Stream&lt;T&gt;&gt;</code>."]},

/* ============ 8. SPRING CORE ============ */
{id:"8.1", t:8, p:3, q:"IoC là gì? DI là gì? Quan hệ giữa hai khái niệm?", a:[
 "<b>IoC (Inversion of Control)</b> — nguyên lý: đảo quyền điều khiển, framework gọi code của bạn thay vì bạn gọi framework. Bạn không tự tạo và quản lý dependency.",
 "<b>DI (Dependency Injection)</b> — <b>một cách hiện thực hoá</b> IoC: dependency được đưa từ ngoài vào thay vì tự <code>new</code>.",
 "Quan hệ: DI ⊂ IoC. IoC còn có cách khác như Service Locator, Template Method, Strategy.",
 "Lợi ích: giảm coupling, dễ test (inject mock), dễ thay implementation, quản lý lifecycle tập trung.",
 "Spring IoC Container (<code>ApplicationContext</code>) chịu trách nhiệm tạo, nối và quản lý vòng đời bean."]},

{id:"8.2", t:8, p:3, q:"Spring Boot vs Spring Framework — khác nhau ở đâu?", a:[
 "<b>Spring Framework</b>: nền tảng cốt lõi — IoC container, AOP, MVC, transaction. Cấu hình thủ công nhiều.",
 "<b>Spring Boot</b>: lớp bọc <b>trên</b> Spring Framework, không thay thế nó.",
 "Boot mang lại: auto-configuration, starter dependency, embedded server, Actuator, cấu hình theo quy ước.",
 "Trước Boot: khai báo XML dài, tự chọn version thư viện, build WAR rồi deploy lên Tomcat ngoài.",
 "Với Boot: chạy <code>java -jar</code> là xong — rất hợp container và microservices.",
 "Triết lý: <i>opinionated defaults</i> — có sẵn lựa chọn hợp lý nhưng vẫn override được."]},

{id:"8.3", t:8, p:3, q:"Spring Framework gồm những module nào?", a:[
 "<b>Core Container</b>: <code>spring-core</code>, <code>spring-beans</code>, <code>spring-context</code>, <code>spring-expression</code> (SpEL).",
 "<b>AOP</b>: <code>spring-aop</code>, <code>spring-aspects</code>.",
 "<b>Data Access</b>: JDBC, ORM, Transaction, JMS.",
 "<b>Web</b>: <code>spring-web</code>, <code>spring-webmvc</code>, <code>spring-webflux</code>.",
 "<b>Test</b>: hỗ trợ test tích hợp với container.",
 "Ngoài ra là các dự án riêng, không thuộc core: Spring Data, Security, Cloud, Batch, Integration."]},

{id:"8.4", t:8, p:3, q:"Spring Boot mang lại những gì?", a:[
 "<b>Auto-configuration</b> — tự cấu hình dựa trên class có trên classpath.",
 "<b>Starter</b> — gom nhóm dependency đã kiểm chứng version tương thích.",
 "<b>Embedded server</b> — Tomcat/Jetty/Undertow nhúng sẵn, chạy jar độc lập.",
 "<b>Actuator</b> — health, metrics, info, env qua HTTP endpoint.",
 "<b>Externalized config</b> — properties/yaml, profile, biến môi trường theo thứ tự ưu tiên rõ ràng.",
 "<b>Dev tools</b> — hot restart khi phát triển."]},

{id:"8.5", t:8, p:3, q:"Auto-configuration hoạt động thế nào?", a:[
 "<code>@SpringBootApplication</code> gồm <code>@EnableAutoConfiguration</code> + <code>@ComponentScan</code> + <code>@Configuration</code>.",
 "Spring đọc danh sách class cấu hình từ file <code>META-INF/spring/...AutoConfiguration.imports</code> (Boot 3; trước là <code>spring.factories</code>).",
 "Mỗi class được lọc bằng <code>@Conditional</code>: <code>@ConditionalOnClass</code>, <code>@ConditionalOnMissingBean</code>, <code>@ConditionalOnProperty</code>, <code>@ConditionalOnWebApplication</code>.",
 "<code>@ConditionalOnMissingBean</code> là mấu chốt: bean bạn tự định nghĩa <b>luôn thắng</b> bean auto-config.",
 "Debug: chạy với <code>--debug</code> để xem báo cáo positive/negative matches.",
 "Tắt có chọn lọc: <code>@SpringBootApplication(exclude = DataSourceAutoConfiguration.class)</code>."]},

{id:"8.6", t:8, p:3, q:"Có những cách nào để tạo một Bean?", a:[
 "<b>Stereotype annotation</b> + component scan: <code>@Component</code>, <code>@Service</code>, <code>@Repository</code>, <code>@Controller</code>, <code>@RestController</code>.",
 "<b><code>@Bean</code></b> trong class <code>@Configuration</code> — dùng khi cần cấu hình class của thư viện bên thứ ba.",
 "<b>XML</b> — cách cũ, vẫn hỗ trợ.",
 "<b><code>FactoryBean</code></b> — cho object cần logic khởi tạo phức tạp.",
 "<b>Đăng ký programmatic</b> — <code>BeanDefinitionRegistry</code>, <code>@Import</code>, <code>ImportBeanDefinitionRegistrar</code>.",
 "<code>@Repository</code> có thêm giá trị: dịch exception của JDBC/JPA sang <code>DataAccessException</code> của Spring."]},

{id:"8.7", t:8, p:3, q:"Nếu có nhiều bean cùng type thì phân biệt bằng cách nào?", a:[
 "<b><code>@Qualifier(\"name\")</code></b> — chỉ đích danh, rõ ràng nhất.",
 "<b><code>@Primary</code></b> — đánh dấu bean mặc định khi không chỉ định.",
 "<b>Đặt tên biến trùng bean name</b> — Spring fallback theo tên khi type bị mơ hồ.",
 "<b><code>@Resource(name=\"...\")</code></b> — chuẩn JSR-250, match theo tên trước.",
 "<b>Custom qualifier annotation</b> — tự tạo annotation gắn <code>@Qualifier</code>, an toàn kiểu hơn chuỗi.",
 "Hoặc inject <code>List&lt;T&gt;</code> / <code>Map&lt;String,T&gt;</code> để nhận <b>tất cả</b> — nền tảng của Strategy pattern trong Spring.",
 "Không xử lý → <code>NoUniqueBeanDefinitionException</code>."]},

{id:"8.8", t:8, p:3, q:"Có mấy cách inject bean?", a:[
 "<b>Constructor injection</b> — truyền qua constructor. Từ Spring 4.3, class có 1 constructor thì không cần <code>@Autowired</code>.",
 "<b>Setter injection</b> — qua setter, hợp với dependency tuỳ chọn.",
 "<b>Field injection</b> — <code>@Autowired</code> thẳng lên field, ngắn nhất nhưng nhiều nhược điểm.",
 "Ngoài ra: method injection thông thường, hoặc lấy trực tiếp từ <code>ApplicationContext</code> (Service Locator — nên tránh)."]},

{id:"8.9", t:8, p:3, q:"Cách inject nào tốt nhất và TẠI SAO?", trap:true, a:[
 "<b>Constructor injection.</b> Lý do cụ thể:",
 "<b>Bắt buộc</b> — object không thể tồn tại ở trạng thái thiếu dependency; không có nguy cơ NPE do chưa inject.",
 "<b>Immutable</b> — field khai báo được <code>final</code>, an toàn thread.",
 "<b>Dễ test</b> — <code>new MyService(mockRepo)</code>, không cần Spring container hay reflection.",
 "<b>Lộ code smell</b> — constructor 8 tham số nhìn thấy ngay là class đang làm quá nhiều việc; field injection giấu điều đó đi.",
 "<b>Phát hiện circular dependency sớm</b> — fail ngay lúc khởi động thay vì âm thầm hoạt động.",
 "Field injection còn khiến class <b>phụ thuộc chặt vào Spring</b>, không dùng lại được ngoài container."]},

{id:"8.10", t:8, p:2, q:"Việc đưa bean vào qua constructor gọi là gì?", a:[
 "<b>Constructor Injection</b> — một dạng của Dependency Injection.",
 "Cơ chế: Spring phân tích tham số constructor, tìm bean khớp kiểu trong container, tạo và truyền vào.",
 "Nếu chỉ có một constructor, <code>@Autowired</code> là tuỳ chọn (Spring 4.3+).",
 "Lombok <code>@RequiredArgsConstructor</code> sinh sẵn constructor cho các field <code>final</code> — cách viết phổ biến nhất hiện nay."]},

{id:"8.11", t:8, p:3, q:"Circular dependency xử lý thế nào? Tại sao constructor injection lại fail?", a:[
 "A cần B, B cần A. Với <b>constructor injection</b>: không thể tạo A khi chưa có B và ngược lại → <code>BeanCurrentlyInCreationException</code> ngay lúc khởi động.",
 "Với <b>field/setter injection</b>: Spring dùng <b>three-level cache</b>, tạo object trước rồi inject sau → vòng lặp được 'giấu đi' và app vẫn chạy.",
 "Từ <b>Spring Boot 2.6</b>, circular reference bị <b>cấm mặc định</b>; muốn bật lại phải đặt <code>spring.main.allow-circular-references=true</code>.",
 "Giải pháp đúng: <b>tái cấu trúc</b> — tách phần dùng chung ra bean thứ ba, hoặc dùng event.",
 "Giải pháp tình thế: <code>@Lazy</code> trên một phía để inject proxy.",
 "Fail sớm ở đây là <b>tính năng</b>, không phải hạn chế: circular dependency gần như luôn báo hiệu thiết kế sai."]},

{id:"8.12", t:8, p:2, q:"Bean scope trong Spring", a:[
 "<b>singleton</b> (mặc định) — một instance cho mỗi container.",
 "<b>prototype</b> — tạo mới mỗi lần yêu cầu; Spring <b>không</b> quản lý destroy, không gọi <code>@PreDestroy</code>.",
 "<b>request</b>, <b>session</b>, <b>application</b>, <b>websocket</b> — chỉ trong web context.",
 "Bẫy: inject prototype vào singleton → chỉ tạo <b>một lần</b>, mất ý nghĩa prototype. Khắc phục bằng <code>@Lookup</code>, <code>ObjectProvider</code>, hoặc scoped proxy.",
 "Bean scope request inject vào singleton cần <code>proxyMode = TARGET_CLASS</code>."]},

{id:"8.13", t:8, p:2, q:"Singleton bean của Spring có phải Singleton pattern không?", trap:true, a:[
 "<b>Không giống nhau.</b>",
 "Singleton pattern (GoF): <b>một instance cho mỗi JVM/classloader</b>, tự quản lý bằng static field và private constructor.",
 "Spring singleton: <b>một instance cho mỗi ApplicationContext</b>. Hai context trong cùng JVM sẽ có hai instance.",
 "Spring singleton không cần private constructor, vẫn tạo thủ công bằng <code>new</code> được.",
 "Cách quản lý cũng khác: container giữ trong registry, không phải static field."]},

{id:"8.14", t:8, p:3, q:"Singleton bean có thread-safe không?", trap:true, a:[
 "<b>Không tự động thread-safe.</b> Một instance phục vụ mọi request đồng thời.",
 "An toàn <b>nếu stateless</b> — chỉ có field là các dependency bất biến. Đây là lý do service/controller nên stateless.",
 "Thêm field mutable (biến đếm, biến tạm giữa các bước) → race condition ngay.",
 "Nhiều bug loại này chỉ lộ ra khi có tải, không thấy khi test đơn lẻ.",
 "Nếu cần state theo request: dùng biến local, <code>ThreadLocal</code>, hoặc bean scope request."]},

{id:"8.15", t:8, p:2, q:"Bean lifecycle đầy đủ", a:[
 "Đọc BeanDefinition → <b>instantiate</b> (constructor) → <b>populate</b> (inject field/setter).",
 "Gọi các <code>*Aware</code>: <code>BeanNameAware</code>, <code>BeanFactoryAware</code>, <code>ApplicationContextAware</code>.",
 "<code>BeanPostProcessor.postProcessBeforeInitialization()</code>.",
 "<b><code>@PostConstruct</code></b> → <code>InitializingBean.afterPropertiesSet()</code> → <code>initMethod</code>.",
 "<code>BeanPostProcessor.postProcessAfterInitialization()</code> — <b>đây là nơi AOP proxy được tạo</b>.",
 "Bean sẵn sàng → khi shutdown: <code>@PreDestroy</code> → <code>DisposableBean.destroy()</code> → <code>destroyMethod</code>.",
 "Điểm quan trọng: trong <code>@PostConstruct</code>, <b>proxy chưa được tạo</b> → gọi method có <code>@Transactional</code> ở đó sẽ không có transaction."]},

{id:"8.16", t:8, p:1, q:"BeanFactory vs ApplicationContext", a:[
 "<code>BeanFactory</code>: container cơ bản, khởi tạo bean <b>lazy</b>.",
 "<code>ApplicationContext</code>: kế thừa BeanFactory, thêm i18n, event publishing, resource loading, tích hợp AOP, tự động nhận diện BeanPostProcessor.",
 "ApplicationContext khởi tạo singleton <b>eager</b> ngay lúc startup → phát hiện lỗi cấu hình sớm.",
 "Thực tế luôn dùng ApplicationContext."]},

{id:"8.17", t:8, p:3, q:"Spring AOP hoạt động thế nào? JDK Dynamic Proxy vs CGLIB", anim:"proxy", a:[
 "Spring bọc bean bằng một <b>proxy object</b>; mọi lời gọi từ ngoài đi qua proxy để thêm hành vi (transaction, cache, security, log).",
 "<b>JDK Dynamic Proxy</b>: dùng khi bean <b>implement interface</b>; proxy cũng implement interface đó, dựa trên <code>java.lang.reflect.Proxy</code>.",
 "<b>CGLIB</b>: khi không có interface; sinh <b>class con</b> kế thừa class gốc và override method.",
 "Vì CGLIB dùng kế thừa nên <b>không proxy được</b> method <code>final</code>, <code>private</code>, <code>static</code>, và class <code>final</code>.",
 "<b>Spring Boot từ 2.0 mặc định dùng CGLIB</b> cho mọi trường hợp (<code>proxyTargetClass=true</code>).",
 "Hệ quả cốt lõi: lời gọi <b>nội bộ</b> (<code>this.method()</code>) không đi qua proxy → mọi annotation dựa trên AOP đều mất tác dụng."]}
];
const QUESTIONS_4 = [
/* ============ 9. TRANSACTION ============ */
{id:"9.1", t:9, p:3, q:"@Transactional hoạt động như thế nào?", anim:"proxy", a:[
 "Dựa trên <b>AOP proxy</b>: proxy chặn lời gọi, mở transaction trước, commit hoặc rollback sau.",
 "Cụ thể: lấy connection từ <code>DataSource</code> → <code>setAutoCommit(false)</code> → gắn connection vào <b>ThreadLocal</b> (<code>TransactionSynchronizationManager</code>).",
 "Mọi thao tác DB trong cùng thread sau đó <b>dùng lại đúng connection</b> đó.",
 "Kết thúc bình thường → <code>commit()</code>; gặp RuntimeException/Error → <code>rollback()</code>; cuối cùng trả connection về pool.",
 "Bản chất là <b>declarative transaction</b> — thay cho việc viết try/catch/commit/rollback thủ công.",
 "<code>PlatformTransactionManager</code> là abstraction: <code>DataSourceTransactionManager</code> (JDBC), <code>JpaTransactionManager</code>, <code>JtaTransactionManager</code>."]},

{id:"9.2", t:9, p:3, q:"@Transactional khác gì với transaction ở tầng Database?", a:[
 "<b>DB transaction</b> là thứ thật sự đảm bảo ACID — do database engine thực thi bằng WAL, lock, MVCC.",
 "<b>@Transactional</b> chỉ là <b>lớp điều phối</b>: quyết định khi nào BEGIN, COMMIT, ROLLBACK, và quản lý phạm vi.",
 "Giá trị Spring thêm vào: quản lý ranh giới theo method, <b>propagation</b> (khái niệm không tồn tại ở DB), gắn connection vào thread, thống nhất API cho JDBC/JPA/JTA.",
 "Spring không tự tạo được isolation hay durability — nó chỉ <b>truyền cấu hình xuống</b> cho DB.",
 "Ví dụ: <code>REQUIRES_NEW</code> không phải tính năng của DB — Spring hiện thực bằng cách <b>tạm treo</b> transaction cũ và mở connection thứ hai."]},

{id:"9.3", t:9, p:3, q:"Cách transaction hoạt động ở DB: ACID", a:[
 "<b>Atomicity</b> — tất cả hoặc không gì cả; hiện thực bằng undo log.",
 "<b>Consistency</b> — dữ liệu luôn thoả ràng buộc trước và sau transaction.",
 "<b>Isolation</b> — các transaction chạy song song không nhìn thấy trạng thái dở dang của nhau; hiện thực bằng lock hoặc MVCC.",
 "<b>Durability</b> — đã commit thì tồn tại kể cả khi mất điện; hiện thực bằng <b>WAL</b> (write-ahead log) ghi xuống đĩa trước khi báo thành công.",
 "PostgreSQL và MySQL InnoDB dùng <b>MVCC</b>: mỗi transaction thấy một snapshot riêng, đọc không chặn ghi và ngược lại."]},

{id:"9.4", t:9, p:3, q:"Các isolation level và anomaly tương ứng", a:[
 "<b>READ UNCOMMITTED</b> — cho phép dirty read (đọc dữ liệu chưa commit).",
 "<b>READ COMMITTED</b> — chặn dirty read; vẫn có non-repeatable read. <i>Mặc định của PostgreSQL, Oracle, SQL Server.</i>",
 "<b>REPEATABLE READ</b> — chặn thêm non-repeatable read. <i>Mặc định của MySQL InnoDB</i> (và InnoDB chặn luôn phantom nhờ gap lock).",
 "<b>SERIALIZABLE</b> — chặn cả phantom read; an toàn nhất, chậm nhất.",
 "Anomaly: <b>dirty read</b> (đọc dữ liệu chưa commit), <b>non-repeatable read</b> (đọc lại cùng row ra giá trị khác), <b>phantom read</b> (đọc lại cùng điều kiện ra thêm row mới).",
 "Trong Spring: <code>@Transactional(isolation = Isolation.REPEATABLE_READ)</code>; mặc định là <code>DEFAULT</code> — theo cấu hình của DB."]},

{id:"9.5", t:9, p:3, q:"Có dùng @Transactional trên class được không?", a:[
 "Được. Khi đó áp dụng cho <b>tất cả method public</b> của class.",
 "Annotation ở cấp method <b>override</b> annotation ở cấp class.",
 "Method <code>private</code>, <code>protected</code>, package-private <b>bị bỏ qua hoàn toàn</b> (với proxy-based AOP).",
 "Nhược điểm: bọc transaction cả những method chỉ đọc hoặc không cần DB → giữ connection vô ích.",
 "Thực hành tốt: đặt ở method, hoặc đặt <code>@Transactional(readOnly = true)</code> ở class rồi override ở method ghi."]},

{id:"9.6", t:9, p:3, q:"@Transactional trên method private, final, hoặc static có hoạt động không?", trap:true, anim:"proxy", a:[
 "<b>Không, cả ba đều không.</b>",
 "<code>private</code>: proxy không nhìn thấy, không override được.",
 "<code>final</code>: CGLIB tạo class con nên không override được method final.",
 "<code>static</code>: thuộc class, không tham gia dynamic dispatch.",
 "Điều nguy hiểm: <b>không có lỗi, không có cảnh báo</b> — code chạy bình thường nhưng không hề có transaction.",
 "Cùng lý do đó, class khai báo <code>final</code> cũng không được proxy bằng CGLIB.",
 "Chỉ AspectJ (compile-time / load-time weaving) mới vượt qua được giới hạn này."]},

{id:"9.7", t:9, p:3, q:"Method A gọi method B trong CÙNG service, B có @Transactional — rollback diễn ra thế nào?", trap:true, anim:"selfinvocation", a:[
 "<b>@Transactional của B hoàn toàn vô hiệu.</b>",
 "Lời gọi <code>this.B()</code> là lời gọi Java trực tiếp trên object thật, <b>không đi qua proxy</b> → không có interceptor nào chạy.",
 "Nếu A <b>không</b> có <code>@Transactional</code>: B chạy không transaction, mỗi câu lệnh auto-commit, <b>không rollback gì cả</b>.",
 "Nếu A <b>có</b> <code>@Transactional</code>: B chạy trong transaction của A. Rollback vẫn xảy ra, nhưng <b>rollback toàn bộ A</b>, còn <code>propagation</code> hay <code>REQUIRES_NEW</code> khai báo ở B thì bị bỏ qua sạch.",
 "Trường hợp thứ hai đặc biệt nguy hiểm: có vẻ như đang chạy đúng, cho tới khi ai đó dựa vào REQUIRES_NEW của B để giữ lại log audit khi A fail — và log đó biến mất.",
 "Đây là câu hỏi phân loại rõ nhất giữa người dùng Spring và người <b>hiểu</b> Spring."]},

{id:"9.8", t:9, p:3, q:"Cách khắc phục self-invocation?", a:[
 "<b>Tách method B sang một bean khác</b> rồi inject vào — sạch nhất, được khuyến nghị.",
 "<b>Self-injection</b>: inject chính bean đó vào nó (<code>@Lazy private MyService self;</code>) rồi gọi <code>self.B()</code>.",
 "<b><code>AopContext.currentProxy()</code></b> — cần bật <code>@EnableAspectJAutoProxy(exposeProxy = true)</code>. Hiệu quả nhưng làm code phụ thuộc Spring.",
 "<b><code>TransactionTemplate</code></b> — quản lý transaction lập trình, kiểm soát rõ ràng, không phụ thuộc proxy.",
 "<b>AspectJ weaving</b> — can thiệp bytecode, bắt được cả lời gọi nội bộ; đổi lại cấu hình phức tạp.",
 "Tách bean thường là câu trả lời đúng vì self-invocation cũng là dấu hiệu class đang gánh hai trách nhiệm."]},

{id:"9.9", t:9, p:3, q:"Controller gọi 10 service đều có @Transactional → tạo ra bao nhiêu transaction?", trap:true, anim:"propagation", a:[
 "<b>Tuỳ vào việc controller có transaction hay không, và propagation là gì.</b>",
 "<b>Controller KHÔNG có <code>@Transactional</code></b> (trường hợp phổ biến), propagation mặc định <code>REQUIRED</code> → <b>10 transaction độc lập</b>, mỗi cái commit riêng.",
 "→ Service thứ 7 lỗi thì 6 cái trước <b>đã commit và không rollback</b>. Đây chính là nguồn dữ liệu bất nhất trong thực tế.",
 "<b>Controller CÓ <code>@Transactional</code></b> → <b>1 transaction duy nhất</b>, cả 10 service <i>join</i> vào; lỗi ở bất kỳ đâu rollback tất cả.",
 "<b>Nếu service dùng <code>REQUIRES_NEW</code></b> → mỗi cái tạo transaction riêng dù có outer transaction; outer bị treo lại, và 10 connection được dùng.",
 "Cảnh báo kèm theo: gộp 10 service vào 1 transaction làm transaction kéo dài, giữ connection và lock lâu → cạn Hikari pool. Đây là chỗ nên nói tới <b>Saga</b> hoặc chia nhỏ nghiệp vụ."]},

{id:"9.10", t:9, p:3, q:"7 propagation level của Spring", anim:"propagation", a:[
 "<b>REQUIRED</b> (mặc định) — có sẵn thì tham gia, chưa có thì tạo mới.",
 "<b>REQUIRES_NEW</b> — luôn tạo transaction mới, <b>treo</b> transaction hiện tại. Dùng cho audit log, gửi thông báo — thứ cần giữ lại kể cả khi nghiệp vụ chính fail.",
 "<b>SUPPORTS</b> — có thì tham gia, không có thì chạy không transaction.",
 "<b>NOT_SUPPORTED</b> — luôn chạy không transaction, treo cái đang có.",
 "<b>MANDATORY</b> — bắt buộc phải có sẵn, không có thì ném exception.",
 "<b>NEVER</b> — bắt buộc không được có, có thì ném exception.",
 "<b>NESTED</b> — tạo <b>savepoint</b> trong transaction hiện tại; rollback được phần con mà không huỷ cha."]},

{id:"9.11", t:9, p:2, q:"REQUIRES_NEW vs NESTED khác nhau thế nào?", a:[
 "<b>REQUIRES_NEW</b>: transaction thật sự độc lập, <b>connection riêng</b>. Commit của nó tồn tại kể cả khi outer rollback.",
 "<b>NESTED</b>: cùng một transaction vật lý, dùng <b>savepoint</b>. Rollback inner chỉ quay về savepoint.",
 "Điểm mấu chốt: NESTED commit của outer rollback thì <b>inner cũng mất</b>; REQUIRES_NEW thì không.",
 "REQUIRES_NEW tiêu thụ 2 connection cùng lúc → nguy cơ <b>deadlock tự thân</b> nếu pool nhỏ.",
 "NESTED chỉ hoạt động với <code>DataSourceTransactionManager</code> và DB hỗ trợ savepoint; JPA thường không hỗ trợ tốt."]},

{id:"9.12", t:9, p:3, q:"Bắt exception bên trong method @Transactional rồi không throw lại → có rollback không?", trap:true, a:[
 "<b>Không rollback.</b> Proxy chỉ thấy method kết thúc bình thường → commit.",
 "Đây là cách 'mất dữ liệu thầm lặng' phổ biến nhất: try/catch rồi log rồi đi tiếp.",
 "Muốn rollback mà vẫn bắt exception: gọi <code>TransactionAspectSupport.currentTransactionStatus().setRollbackOnly()</code>.",
 "Trường hợp ngược cũng đáng biết: nếu inner (REQUIRED) đã đánh dấu rollback-only rồi outer catch và commit → <code>UnexpectedRollbackException</code>.",
 "Nguyên tắc: exception nghiệp vụ cần rollback thì <b>để nó bay lên</b> tới ranh giới transaction."]},

{id:"9.13", t:9, p:2, q:"rollbackFor / noRollbackFor dùng khi nào?", a:[
 "<code>rollbackFor = Exception.class</code> — ép rollback cả với checked exception (rất phổ biến).",
 "<code>noRollbackFor = XyzException.class</code> — bỏ qua một số exception nghiệp vụ không cần huỷ transaction.",
 "Áp dụng theo quan hệ kế thừa: khai báo cha thì áp cho cả con.",
 "Nếu một exception khớp cả hai thì quy tắc <b>cụ thể hơn</b> thắng.",
 "Nhiều dự án đặt luôn <code>rollbackFor = Exception.class</code> ở mọi chỗ để tránh bẫy checked exception."]},

{id:"9.14", t:9, p:2, q:"readOnly = true có tác dụng gì thật sự?", a:[
 "Với <b>Hibernate</b>: đặt <code>FlushMode.MANUAL</code> → bỏ qua <b>dirty checking</b>, không snapshot entity → giảm bộ nhớ và CPU đáng kể khi đọc nhiều.",
 "Với <b>JDBC</b>: gọi <code>Connection.setReadOnly(true)</code> — driver có thể tối ưu hoặc bỏ qua tuỳ DB.",
 "Với hệ thống <b>read-write splitting</b>: dùng làm tín hiệu để routing sang replica.",
 "<b>Không</b> phải cơ chế bảo mật — không đảm bảo chặn được lệnh ghi ở mọi tầng.",
 "Nên đặt cho mọi method chỉ đọc; hiệu quả rõ rệt trên truy vấn trả về nhiều entity."]},

{id:"9.15", t:9, p:3, q:"Transaction có lan sang thread con khi dùng @Async / multi-thread không?", trap:true, a:[
 "<b>Không.</b> Transaction context lưu trong <b>ThreadLocal</b> → mỗi thread một context riêng.",
 "Thread con hoàn toàn không thấy transaction của thread cha; nó tự lấy connection mới hoặc chạy không transaction.",
 "Hệ quả: rollback ở thread cha <b>không</b> ảnh hưởng gì tới việc thread con đã ghi.",
 "Tương tự với <code>SecurityContext</code> và MDC log context — trừ khi cấu hình <code>DelegatingSecurityContextExecutor</code> / <code>TaskDecorator</code>.",
 "Cần nhất quán qua nhiều thread → phải dùng cơ chế khác: outbox pattern, saga, hoặc gom về một thread."]},

{id:"9.16", t:9, p:3, q:"Distributed transaction trong microservices: 2PC, Saga, Outbox", a:[
 "<b>2PC (Two-Phase Commit)</b>: coordinator hỏi prepare → tất cả đồng ý → commit. Đảm bảo mạnh nhưng <b>khoá tài nguyên lâu</b>, coordinator là single point of failure → gần như không dùng trong microservices.",
 "<b>Saga</b>: chuỗi transaction cục bộ; lỗi ở bước n thì chạy <b>compensating transaction</b> để hoàn tác các bước trước. Chấp nhận <i>eventual consistency</i>.",
 "Saga <b>choreography</b>: các service tự lắng nghe event của nhau — đơn giản, nhưng khó theo dõi luồng khi nhiều bước.",
 "Saga <b>orchestration</b>: một orchestrator điều phối — dễ quan sát và debug, đổi lại có điểm tập trung.",
 "<b>Outbox pattern</b>: ghi dữ liệu nghiệp vụ và bản ghi event vào <b>cùng một transaction DB</b>, rồi một tiến trình riêng đọc bảng outbox đẩy sang Kafka. Giải quyết bài toán 'ghi DB xong thì gửi message lỗi'.",
 "Kèm theo bắt buộc: consumer phải <b>idempotent</b> vì message có thể tới nhiều lần."]},

/* ============ 10. JPA / HIBERNATE ============ */
{id:"10.1", t:10, p:3, q:"Bạn dùng gì để kết nối DB? Query bằng cách nào?", a:[
 "Tầng thấp nhất: <b>JDBC</b> + <code>DataSource</code> (HikariCP quản lý pool).",
 "<b>JdbcTemplate</b> — bọc JDBC, tự dọn tài nguyên, dịch exception; kiểm soát SQL hoàn toàn.",
 "<b>Spring Data JPA</b> — repository interface, sinh query từ tên method, mặc định dùng Hibernate.",
 "<b>MyBatis</b> — map SQL viết tay sang object.",
 "<b>jOOQ</b> — sinh DSL kiểu an toàn từ schema, kiểm tra SQL lúc compile.",
 "Thực tế thường kết hợp: JPA cho CRUD đơn giản, native query / MyBatis cho báo cáo và truy vấn phức tạp."]},

{id:"10.2", t:10, p:3, q:"Phân biệt JPA và Hibernate", a:[
 "<b>JPA</b> là <b>đặc tả</b> (specification) — chỉ gồm interface và annotation, không chạy được một mình. Nay là Jakarta Persistence.",
 "<b>Hibernate</b> là <b>implementation</b> phổ biến nhất của JPA (còn có EclipseLink, OpenJPA).",
 "Hibernate ra đời <b>trước</b> JPA và là nguồn cảm hứng cho đặc tả này.",
 "Hibernate có tính năng riêng ngoài chuẩn JPA: <code>@BatchSize</code>, filter, natural id, HQL mở rộng.",
 "Dùng thuần API JPA thì đổi implementation dễ; dùng tính năng riêng thì bị khoá vào Hibernate."]},

{id:"10.3", t:10, p:3, q:"Phân biệt Hibernate vs MyBatis — khi nào chọn cái nào?", a:[
 "<b>Hibernate</b>: full ORM. Tự sinh SQL, quản lý entity state, dirty checking, cache, lazy loading.",
 "<b>MyBatis</b>: SQL mapper. Bạn viết SQL, nó lo map kết quả sang object.",
 "Hibernate mạnh khi: CRUD nhiều, domain model rõ ràng, muốn độc lập DB.",
 "MyBatis mạnh khi: truy vấn phức tạp, báo cáo, cần tối ưu SQL thủ công, dùng nhiều tính năng riêng của DB.",
 "Hibernate có đường cong học dốc: không hiểu persistence context thì dễ dính N+1, LazyInitializationException, cập nhật ngoài ý muốn.",
 "MyBatis dễ đoán hơn nhưng viết nhiều code hơn và không tự quản lý state.",
 "Nhiều dự án lớn dùng <b>cả hai</b>: JPA cho ghi, MyBatis/jOOQ cho đọc phức tạp."]},

{id:"10.4", t:10, p:3, q:"Entity lifecycle: transient, persistent, detached, removed", a:[
 "<b>Transient</b> — vừa <code>new</code>, chưa có id, không được persistence context quản lý.",
 "<b>Persistent (managed)</b> — đang nằm trong persistence context; <b>mọi thay đổi tự được ghi xuống DB khi flush</b>.",
 "<b>Detached</b> — từng managed nhưng context đã đóng; sửa không có tác dụng cho tới khi <code>merge()</code>.",
 "<b>Removed</b> — đã gọi <code>remove()</code>, sẽ bị DELETE khi flush.",
 "Chuyển trạng thái: <code>persist</code>, <code>merge</code>, <code>remove</code>, <code>detach</code>, <code>clear</code>, <code>close</code>.",
 "Hệ quả thực tế: sửa field của entity managed rồi <b>không gọi save()</b> vẫn UPDATE xuống DB — nguồn của nhiều thay đổi ngoài ý muốn."]},

{id:"10.5", t:10, p:3, q:"Persistence Context / First-level cache. Dirty checking là gì?", a:[
 "Persistence Context là vùng nhớ giữ các entity managed trong phạm vi một transaction — chính là <b>first-level cache</b>, luôn bật, không tắt được.",
 "Trong cùng transaction, <code>findById</code> hai lần cùng id → chỉ <b>một</b> câu SQL; lần sau lấy từ cache.",
 "Đảm bảo <b>identity</b>: cùng id trong cùng context thì cùng một instance Java (<code>==</code> đúng).",
 "<b>Dirty checking</b>: lúc load, Hibernate chụp snapshot; khi flush thì so sánh và tự sinh UPDATE cho field đã đổi.",
 "Vì thế <code>save()</code> với entity managed thường là thừa.",
 "Chi phí: giữ 2 bản mỗi entity → load hàng chục nghìn entity trong một transaction gây tốn heap. Đây là lúc <code>readOnly = true</code> phát huy tác dụng."]},

{id:"10.6", t:10, p:3, q:"Lazy vs Eager loading. LazyInitializationException xảy ra khi nào?", a:[
 "<b>Lazy</b>: chỉ load quan hệ khi truy cập lần đầu, thông qua proxy. Mặc định cho <code>@OneToMany</code>, <code>@ManyToMany</code>.",
 "<b>Eager</b>: load ngay cùng entity cha. Mặc định cho <code>@ManyToOne</code>, <code>@OneToOne</code> — mặc định này thường <b>không</b> mong muốn.",
 "<code>LazyInitializationException</code>: truy cập quan hệ lazy <b>sau khi</b> persistence context đã đóng (thường ở tầng controller hoặc lúc serialize JSON).",
 "Cách fix đúng: <code>JOIN FETCH</code>, <code>@EntityGraph</code>, hoặc map sang DTO <b>trong</b> transaction.",
 "Cách fix sai phổ biến: bật <code>spring.jpa.open-in-view=true</code> (mặc định là true) — giấu lỗi đi nhưng giữ connection suốt thời gian render view → <b>nên tắt</b>.",
 "Cũng sai: đổi hết sang EAGER — dẫn thẳng tới việc load cả nửa database cho một truy vấn."]},

{id:"10.7", t:10, p:3, q:"N+1 query problem — nguyên nhân và cách fix", trap:true, anim:"nplus1", a:[
 "Chạy 1 query lấy N bản ghi cha, rồi <b>N query nữa</b> để lấy quan hệ của từng cha → tổng N+1.",
 "Nguyên nhân: quan hệ lazy được truy cập trong vòng lặp, hoặc EAGER không được fetch join.",
 "Triệu chứng: API chậm tuyến tính theo số bản ghi; log SQL lặp cùng một câu chỉ khác tham số.",
 "<b><code>JOIN FETCH</code></b> — <code>select o from Order o join fetch o.items</code>. Hiệu quả nhất, nhưng không phân trang được khi fetch collection (Hibernate cảnh báo <code>firstResult/maxResults specified with collection fetch</code>).",
 "<b><code>@EntityGraph</code></b> — khai báo trên repository method, sạch hơn, không phải viết JPQL.",
 "<b><code>@BatchSize(size = 50)</code></b> — gom N query thành N/50 query dùng <code>IN (...)</code>. Kết hợp tốt với phân trang.",
 "<b>DTO projection</b> — <code>select new com.x.Dto(...)</code>, chỉ lấy đúng cột cần; tốt nhất cho API đọc.",
 "Phát hiện sớm: bật <code>spring.jpa.show-sql</code> hoặc dùng datasource-proxy để đếm số query mỗi request."]},

{id:"10.8", t:10, p:2, q:"save() vs saveAndFlush(), flush() vs commit()", a:[
 "<code>save()</code> — đưa entity vào persistence context; SQL <b>chưa chắc</b> chạy ngay.",
 "<code>saveAndFlush()</code> — ép đẩy SQL xuống DB ngay lập tức.",
 "<code>flush()</code> — đồng bộ persistence context xuống DB, <b>nhưng chưa commit</b>; vẫn rollback được.",
 "<code>commit()</code> — kết thúc transaction, dữ liệu trở thành vĩnh viễn và các transaction khác mới nhìn thấy.",
 "Hibernate tự flush trước khi commit và trước một số truy vấn để đảm bảo đọc đúng dữ liệu.",
 "Dùng flush khi cần lấy id sinh tự động hoặc cần DB validate ràng buộc sớm."]},

{id:"10.9", t:10, p:2, q:"getReferenceById() vs findById()", a:[
 "<code>findById()</code> — chạy SELECT ngay, trả <code>Optional</code>; không có thì rỗng.",
 "<code>getReferenceById()</code> (trước là <code>getOne()</code>) — trả <b>proxy</b>, chưa query gì.",
 "Query chỉ chạy khi truy cập field khác ngoài id; không tồn tại → <code>EntityNotFoundException</code> ở thời điểm đó, không phải lúc gọi.",
 "Hữu ích khi chỉ cần gán quan hệ khoá ngoại — tiết kiệm hẳn một câu SELECT.",
 "Rủi ro: proxy thoát khỏi transaction → <code>LazyInitializationException</code>."]},

{id:"10.10", t:10, p:3, q:"Optimistic vs Pessimistic locking", a:[
 "<b>Optimistic</b>: giả định ít xung đột. Dùng cột <code>@Version</code>; lúc UPDATE thêm điều kiện <code>WHERE version = ?</code>. Không khớp → <code>OptimisticLockException</code>.",
 "Không khoá gì ở DB → throughput cao. Hợp với web app, tỷ lệ xung đột thấp, và người dùng có thể thử lại.",
 "<b>Pessimistic</b>: khoá row ngay khi đọc — <code>SELECT ... FOR UPDATE</code> qua <code>@Lock(PESSIMISTIC_WRITE)</code>.",
 "Đảm bảo chắc chắn nhưng chặn transaction khác, dễ deadlock, giữ lock suốt transaction.",
 "Hợp với: trừ tồn kho, chuyển tiền, nơi mà thử lại tốn kém hoặc không chấp nhận được.",
 "Với optimistic, nhớ thiết kế cơ chế <b>retry</b> ở tầng ứng dụng."]},

{id:"10.11", t:10, p:2, q:"JPQL vs Native Query vs Criteria API vs QueryDSL", a:[
 "<b>JPQL</b>: truy vấn theo entity và field, độc lập DB; sai tên field chỉ phát hiện lúc runtime.",
 "<b>Native</b>: SQL thuần, dùng được tính năng riêng của DB (window function, CTE, JSONB); mất tính di động.",
 "<b>Criteria API</b>: dựng query bằng code, an toàn kiểu, hợp query động; cú pháp rất dài dòng.",
 "<b>QueryDSL</b>: giải quyết đúng điểm yếu của Criteria — an toàn kiểu và dễ đọc, sinh Q-class lúc build.",
 "Query động nhiều điều kiện lọc → QueryDSL hoặc <code>Specification</code> là lựa chọn thực tế nhất."]},

{id:"10.12", t:10, p:1, q:"Second-level cache trong Hibernate", a:[
 "First-level cache theo <b>transaction</b>; second-level cache dùng chung cho toàn <b>SessionFactory</b>, sống qua nhiều transaction.",
 "Cần provider ngoài: Ehcache, Hazelcast, Infinispan, Redis.",
 "Bật bằng <code>@Cacheable</code> trên entity + cấu hình cache region.",
 "Chỉ hợp với dữ liệu <b>đọc nhiều, ghi ít</b>: danh mục, cấu hình.",
 "Rủi ro trong hệ thống nhiều instance: cache không nhất quán nếu không dùng distributed cache và invalidation đúng."]},

{id:"10.13", t:10, p:2, q:"Cascade types và orphanRemoval", a:[
 "<code>PERSIST</code>, <code>MERGE</code>, <code>REMOVE</code>, <code>REFRESH</code>, <code>DETACH</code>, <code>ALL</code> — lan thao tác từ cha sang con.",
 "<code>orphanRemoval = true</code>: gỡ con khỏi collection của cha thì <b>xoá luôn khỏi DB</b>.",
 "Khác biệt: <code>CascadeType.REMOVE</code> chỉ tác dụng khi xoá <b>cha</b>; orphanRemoval tác dụng cả khi chỉ gỡ khỏi quan hệ.",
 "<code>CascadeType.ALL</code> trên <code>@ManyToMany</code> rất nguy hiểm — xoá một bên có thể quét sạch dữ liệu bên kia.",
 "Nguyên tắc: chỉ cascade khi con thật sự thuộc sở hữu của cha (quan hệ composition)."]},

{id:"10.14", t:10, p:1, q:"DB migration: Flyway vs Liquibase", a:[
 "<b>Flyway</b>: script SQL thuần đánh số phiên bản (<code>V1__init.sql</code>), đơn giản, dễ đọc, gần với DBA.",
 "<b>Liquibase</b>: changelog XML/YAML/JSON/SQL, trừu tượng hơn, hỗ trợ rollback tốt hơn và độc lập DB.",
 "Cả hai đều giữ bảng lịch sử để biết migration nào đã chạy, kèm checksum chống sửa file cũ.",
 "<b>Không bao giờ</b> dùng <code>hibernate.ddl-auto=update</code> ở production.",
 "Với zero-downtime deploy: migration phải tương thích ngược (thêm cột nullable trước, backfill, rồi mới đổi ràng buộc)."]},

/* ============ 11. HIKARI ============ */
{id:"11.1", t:11, p:3, q:"Connection pool giải quyết vấn đề gì? Tại sao Hikari là mặc định?", a:[
 "Mở kết nối DB rất đắt: TCP handshake, xác thực, cấp phát tài nguyên phía server — hàng chục tới hàng trăm ms.",
 "Pool giữ sẵn kết nối để tái sử dụng, đồng thời <b>giới hạn</b> số kết nối tới DB (bảo vệ database).",
 "HikariCP nhanh nhất nhờ: bytecode gọn, <code>ConcurrentBag</code> tối ưu cho thread-local, tránh khoá, ít lớp bọc.",
 "Trở thành mặc định của Spring Boot từ 2.0, thay Tomcat JDBC pool.",
 "Triết lý của Hikari: ít tuỳ chọn, mặc định đúng, thà fail nhanh còn hơn che giấu vấn đề."]},

{id:"11.2", t:11, p:3, q:"Khi kết nối DB quá tải, Hikari có ngắt transaction ngay lập tức không?", trap:true, anim:"hikari", a:[
 "<b>Không.</b> Hikari không hề can thiệp vào transaction đang chạy.",
 "Thread xin connection mà pool đã cạn sẽ <b>chờ</b> tối đa <code>connectionTimeout</code> (mặc định <b>30 giây</b>).",
 "Hết thời gian chờ → ném <code>SQLTransientConnectionException: Connection is not available, request timed out after 30000ms</code>.",
 "Các transaction <b>đang giữ</b> connection vẫn chạy bình thường tới khi xong — Hikari chỉ từ chối cấp connection <b>mới</b>.",
 "Hệ quả nguy hiểm: request xếp hàng chờ 30 giây rồi mới lỗi → thread của web server cũng cạn theo → <b>toàn bộ service treo</b> dù DB vẫn khoẻ.",
 "Nên giảm <code>connectionTimeout</code> xuống 2–5 giây để fail nhanh, và đặt <code>leakDetectionThreshold</code> để phát hiện connection bị giữ quá lâu."]},

{id:"11.3", t:11, p:3, q:"Các tham số quan trọng của HikariCP", a:[
 "<code>maximumPoolSize</code> — số connection tối đa (mặc định 10). Tham số quan trọng nhất.",
 "<code>minimumIdle</code> — số connection nhàn rỗi tối thiểu; Hikari khuyến nghị để bằng max (pool cố định) cho ổn định latency.",
 "<code>connectionTimeout</code> — thời gian chờ lấy connection, mặc định 30s.",
 "<code>idleTimeout</code> — connection nhàn rỗi bao lâu thì bị đóng (mặc định 10 phút).",
 "<code>maxLifetime</code> — tuổi thọ tối đa của connection (mặc định 30 phút); phải <b>nhỏ hơn</b> timeout phía DB và phía firewall.",
 "<code>leakDetectionThreshold</code> — cảnh báo nếu connection bị giữ quá N ms mà chưa trả; đặt ~30–60s ở môi trường test rất hữu ích.",
 "<code>validationTimeout</code>, <code>keepaliveTime</code> — giữ connection sống qua firewall."]},

{id:"11.4", t:11, p:3, q:"Chọn maximumPoolSize bao nhiêu? Tại sao pool lớn chưa chắc nhanh hơn?", a:[
 "Công thức tham khảo của PostgreSQL wiki: <code>connections = ((core_count × 2) + effective_spindle_count)</code>.",
 "Thực tế con số hợp lý thường <b>nhỏ hơn nhiều so với trực giác</b> — 10–20 cho phần lớn service.",
 "Pool lớn không giúp vì DB chỉ xử lý song song được số lượng hữu hạn: quá nhiều connection gây tranh chấp CPU, context switch, tranh lock, và tốn bộ nhớ mỗi backend process.",
 "Ngoài ngưỡng đó, throughput <b>giảm</b> còn latency <b>tăng</b> — đường cong hình chuông.",
 "Nhớ tính tổng: 20 instance × pool 20 = 400 connection tới DB, dễ vượt <code>max_connections</code>.",
 "Cần nhiều connection hơn thật sự → dùng <b>PgBouncer</b> hoặc read replica thay vì phình pool."]},

{id:"11.5", t:11, p:3, q:"Pool exhaustion xảy ra khi nào? Dấu hiệu và cách debug?", a:[
 "Nguyên nhân: transaction quá dài, gọi API bên ngoài trong transaction, N+1 query, connection leak, <code>REQUIRES_NEW</code> lồng nhau, batch job chạy cùng traffic.",
 "Dấu hiệu: <code>SQLTransientConnectionException ... request timed out</code>, latency tăng vọt rồi service treo, metric <code>hikaricp.connections.pending</code> tăng.",
 "Debug: bật <code>leakDetectionThreshold</code>; xem Hikari metrics qua Actuator/Micrometer; chụp <code>jstack</code> xem thread đang chờ ở đâu.",
 "Phía DB: <code>SELECT * FROM pg_stat_activity</code> tìm session <code>idle in transaction</code> — đó thường là thủ phạm.",
 "Sửa: rút ngắn transaction, đưa lời gọi mạng ra ngoài, sửa N+1, đặt <code>statement_timeout</code> ở DB."]},

{id:"11.6", t:11, p:3, q:"Tại sao @Transactional bọc cả đoạn gọi external API lại nguy hiểm?", trap:true, a:[
 "Connection bị <b>giữ suốt</b> thời gian chờ mạng, dù không thực hiện lệnh SQL nào.",
 "API bên ngoài chậm 5 giây → connection nằm không 5 giây. Với pool 10 và 100 request đồng thời thì pool cạn ngay.",
 "Row lock cũng bị giữ theo → transaction khác chờ theo dây chuyền.",
 "Kèm rủi ro nghiệp vụ: gọi API thành công nhưng transaction rollback sau đó → hai hệ thống lệch nhau (API bên ngoài không rollback được).",
 "Cách đúng: tách ranh giới — ghi DB và commit trước, rồi mới gọi API; hoặc dùng <b>outbox pattern</b> để đảm bảo gửi đi ít nhất một lần.",
 "Đây là một trong những nguyên nhân sự cố production phổ biến nhất với Spring Boot."]}
];
const QUESTIONS_5 = [
/* ============ 12. DATABASE & INDEX ============ */
{id:"12.1", t:12, p:3, q:"Có những cách nào để tối ưu câu lệnh trong DB?", a:[
 "<b>Đọc <code>EXPLAIN ANALYZE</code> trước</b> — đoán mò là cách tối ưu tệ nhất.",
 "Đánh index đúng cột trong <code>WHERE</code>, <code>JOIN</code>, <code>ORDER BY</code>.",
 "Chỉ <code>SELECT</code> cột cần, tránh <code>SELECT *</code> (giảm I/O, mở đường cho index-only scan).",
 "Viết lại query: bỏ subquery tương quan, đổi <code>OR</code> thành <code>UNION</code>, tránh function lên cột được index.",
 "Phân trang bằng <b>keyset pagination</b> (<code>WHERE id &gt; ?</code>) thay vì <code>OFFSET</code> lớn.",
 "Batch insert/update thay vì lặp từng dòng; <code>rewriteBatchedStatements=true</code> với MySQL.",
 "Tầng cao hơn: cache (Redis), read replica, partition bảng lớn, denormalize có kiểm soát, cập nhật statistics."]},

{id:"12.2", t:12, p:3, q:"Đọc EXPLAIN như thế nào? Các loại scan?", a:[
 "<code>EXPLAIN</code> cho kế hoạch dự kiến; <b><code>EXPLAIN ANALYZE</code></b> chạy thật và cho số liệu thực.",
 "So sánh <code>rows</code> ước lượng với <code>actual rows</code> — lệch nhiều nghĩa là statistics cũ, cần <code>ANALYZE</code>.",
 "<b>Seq Scan</b> — quét toàn bảng. Không phải lúc nào cũng xấu: với bảng nhỏ hoặc lấy phần lớn dữ liệu thì nhanh hơn index.",
 "<b>Index Scan</b> — dùng index rồi lấy row từ heap.",
 "<b>Index Only Scan</b> — lấy đủ dữ liệu ngay trong index, không chạm heap. Nhanh nhất.",
 "<b>Bitmap Heap Scan</b> — gom nhiều trúng khớp rồi đọc heap theo thứ tự vật lý; hợp khi số dòng ở mức trung bình.",
 "Chú ý cả loại join (Nested Loop / Hash / Merge) và các nút có <code>Sort</code>, <code>Filter</code> loại bỏ quá nhiều dòng."]},

{id:"12.3", t:12, p:3, q:"Index có những loại nào?", a:[
 "Theo cấu trúc: <b>B-tree</b> (mặc định), <b>Hash</b>, <b>GiST</b>, <b>SP-GiST</b>, <b>GIN</b>, <b>BRIN</b>.",
 "<b>GIN</b> — cho dữ liệu nhiều giá trị: full-text search, JSONB, mảng.",
 "<b>GiST</b> — dữ liệu hình học, range type, tìm kiếm lân cận.",
 "<b>BRIN</b> — bảng rất lớn có dữ liệu sắp xếp tự nhiên (log theo thời gian); index cực nhỏ.",
 "Theo tính chất: unique, composite (nhiều cột), partial (<code>WHERE deleted = false</code>), expression (<code>ON lower(email)</code>), covering (<code>INCLUDE</code>).",
 "<b>Clustered vs non-clustered</b>: MySQL InnoDB có clustered index (dữ liệu nằm ngay trong B-tree theo primary key); <b>PostgreSQL không có</b>."]},

{id:"12.4", t:12, p:3, q:"B-tree và Hash index khác nhau ở điểm nào?", anim:"index", a:[
 "<b>B-tree</b>: cây cân bằng, các lá được <b>sắp xếp</b> và liên kết với nhau. Độ phức tạp O(log n).",
 "<b>Hash</b>: bảng băm, ánh xạ giá trị → vị trí. O(1) trung bình.",
 "B-tree hỗ trợ: <code>=</code>, <code>&lt;</code>, <code>&gt;</code>, <code>BETWEEN</code>, <code>ORDER BY</code>, prefix <code>LIKE 'abc%'</code>, và cả IS NULL.",
 "Hash <b>chỉ hỗ trợ <code>=</code></b>. Không range, không sort, không prefix.",
 "Hash nhỏ gọn hơn và tra cứu equality nhanh hơn chút với dữ liệu lớn.",
 "B-tree hỗ trợ composite index nhiều cột; Hash thì không."]},

{id:"12.5", t:12, p:3, q:"Khi nào dùng B-tree, khi nào dùng Hash?", a:[
 "<b>B-tree: mặc định cho gần như mọi trường hợp.</b> Chỉ cần một index phục vụ được cả equality, range và sort.",
 "<b>Hash</b>: chỉ khi cột <b>duy nhất</b> được truy vấn bằng <code>=</code>, giá trị dài (URL, hash key), và bảng rất lớn — khi đó tiết kiệm được dung lượng.",
 "Thực tế trong PostgreSQL, Hash index <b>hiếm khi đáng dùng</b>: lợi ích nhỏ, mất hết tính linh hoạt.",
 "Muốn tiết kiệm cho chuỗi dài: dùng expression index trên hàm băm (<code>ON md5(url)</code>) với B-tree.",
 "Câu trả lời an toàn khi phỏng vấn: 'mặc định B-tree; Hash chỉ khi đo được là có lợi và chắc chắn chỉ dùng equality'."]},

{id:"12.6", t:12, p:3, q:"Cơ chế index ở PostgreSQL khác gì các DB khác?", trap:true, a:[
 "<b>Không có clustered index.</b> Dữ liệu nằm ở <i>heap</i> vô thứ tự; mọi index đều là secondary, trỏ tới <b>TID</b> (block, offset). MySQL InnoDB ngược lại: dữ liệu nằm ngay trong B-tree của primary key.",
 "Hệ quả: ở InnoDB, secondary index lưu primary key nên tra cứu phải đi <b>hai lần</b> cây; PostgreSQL chỉ một lần nhưng luôn phải chạm heap.",
 "<b>MVCC tạo dead tuple</b>: UPDATE trong PostgreSQL thực chất là ghi phiên bản mới; bản cũ nằm lại tới khi <b>VACUUM</b> dọn. Bảng và index đều bị <i>bloat</i>.",
 "<b>Index-only scan phụ thuộc visibility map</b>: chỉ bỏ qua được heap khi trang đã được đánh dấu 'toàn bộ hiển thị' — nghĩa là VACUUM chạy đủ thường xuyên thì index-only scan mới hiệu quả.",
 "Mọi index đều phải cập nhật khi UPDATE bất kỳ cột nào, trừ khi <b>HOT update</b> áp dụng được (cột thay đổi không được index và trang còn chỗ trống).",
 "PostgreSQL phong phú hơn về loại index: GIN, GiST, BRIN, SP-GiST; hỗ trợ <b>partial index</b> và <b>expression index</b> — cả hai đều mạnh và ít DB khác có đầy đủ.",
 "Hỗ trợ <code>CREATE INDEX CONCURRENTLY</code> để tạo index không khoá ghi."]},

{id:"12.7", t:12, p:2, q:"Hash index ở PostgreSQL trước v10 có nhược điểm gì?", a:[
 "<b>Không được ghi vào WAL</b> → không crash-safe: sau khi crash phải rebuild thủ công.",
 "Vì không WAL nên <b>không replicate</b> sang standby.",
 "PostgreSQL từng khuyến cáo trực tiếp không nên dùng.",
 "Từ <b>v10</b>, Hash index đã WAL-logged, an toàn và có hiệu năng tốt hơn nhiều.",
 "Dù vậy B-tree vẫn là lựa chọn mặc định vì linh hoạt hơn hẳn."]},

{id:"12.8", t:12, p:3, q:"Composite index và quy tắc leftmost prefix", a:[
 "<code>INDEX(a, b, c)</code> phục vụ được: <code>WHERE a</code>, <code>WHERE a AND b</code>, <code>WHERE a AND b AND c</code>.",
 "<b>Không</b> phục vụ hiệu quả <code>WHERE b = ?</code> hay <code>WHERE c = ?</code> — thiếu cột trái nhất.",
 "PostgreSQL vẫn có thể quét toàn bộ index (index scan không dùng prefix) nhưng thường kém hơn nhiều so với index đúng.",
 "Thứ tự cột nên: cột dùng <code>=</code> trước, cột dùng range sau cùng. Vì sau một điều kiện range thì các cột phía sau không lọc được nữa.",
 "Cột có độ chọn lọc cao (cardinality lớn) nên đứng trước.",
 "Composite index cũng phục vụ được <code>ORDER BY</code> nếu khớp thứ tự và hướng sắp xếp."]},

{id:"12.9", t:12, p:3, q:"Khi nào index LÀM CHẬM hệ thống?", a:[
 "Mỗi INSERT/UPDATE/DELETE phải cập nhật <b>toàn bộ</b> index liên quan → ghi chậm đi rõ rệt khi có 10+ index.",
 "Index chiếm dung lượng đĩa và bộ nhớ cache — đẩy dữ liệu nóng ra khỏi buffer pool.",
 "<b>Cardinality thấp</b> (cột <code>status</code>, <code>gender</code>): optimizer thường bỏ qua vì seq scan rẻ hơn → index vô dụng nhưng vẫn tốn chi phí ghi.",
 "Index trùng lặp: đã có <code>(a,b)</code> thì <code>(a)</code> gần như thừa.",
 "Index bloat sau nhiều UPDATE/DELETE (PostgreSQL) → cần <code>REINDEX CONCURRENTLY</code>.",
 "Với cột low-cardinality nên cân nhắc <b>partial index</b>: <code>CREATE INDEX ... WHERE status = 'PENDING'</code> — nhỏ và hiệu quả."]},

{id:"12.10", t:12, p:2, q:"Tại sao dùng function lên cột lại làm mất index?", a:[
 "Index lưu <b>giá trị gốc</b> của cột; <code>UPPER(name)</code> tạo ra giá trị khác nên không tra cứu được.",
 "Ví dụ mất index: <code>WHERE UPPER(email) = ?</code>, <code>WHERE DATE(created_at) = ?</code>, <code>WHERE id::text = ?</code>, hoặc so sánh khác kiểu dữ liệu gây ép kiểu ngầm.",
 "Khắc phục 1 — <b>expression index</b>: <code>CREATE INDEX ON users (lower(email))</code>, rồi query cũng dùng <code>lower(email)</code>.",
 "Khắc phục 2 — viết lại thành range: <code>WHERE created_at &gt;= '2026-01-01' AND created_at &lt; '2026-01-02'</code>.",
 "<code>LIKE '%abc%'</code> (có ký tự đại diện đầu chuỗi) cũng không dùng được B-tree → cần GIN + pg_trgm."]},

{id:"12.11", t:12, p:2, q:"Covering index / INCLUDE clause", a:[
 "Index chứa đủ mọi cột mà query cần → không phải đọc heap → <b>index-only scan</b>.",
 "PostgreSQL 11+: <code>CREATE INDEX ... ON t (a, b) INCLUDE (c, d)</code> — c, d chỉ được lưu ở lá, không tham gia sắp xếp.",
 "Ưu điểm so với đưa hết vào key: index nhỏ hơn, và vẫn giữ được ràng buộc unique trên (a, b).",
 "Ở PostgreSQL còn phụ thuộc <b>visibility map</b> — VACUUM không kịp thì vẫn phải chạm heap.",
 "Rất hiệu quả cho query đọc nhiều, cố định, đúng vài cột."]},

{id:"12.12", t:12, p:2, q:"VACUUM và AUTOVACUUM giải quyết vấn đề gì?", a:[
 "MVCC khiến UPDATE/DELETE để lại <b>dead tuple</b> — bản ghi cũ không còn ai nhìn thấy nhưng vẫn chiếm chỗ.",
 "<code>VACUUM</code> thu hồi không gian đó để tái sử dụng và cập nhật <b>visibility map</b> (điều kiện của index-only scan).",
 "<code>VACUUM FULL</code> viết lại toàn bộ bảng, trả đĩa về OS, nhưng <b>khoá bảng hoàn toàn</b> → tránh ở production.",
 "<code>ANALYZE</code> cập nhật statistics cho query planner — planner sai thường do statistics cũ.",
 "Chống <b>transaction ID wraparound</b> — nếu để xảy ra, PostgreSQL sẽ dừng nhận ghi.",
 "Autovacuum thường cần chỉnh lại (<code>scale_factor</code>) cho bảng lớn ghi nhiều, vì mặc định 20% là quá thưa."]},

/* ============ 13. MICROSERVICES ============ */
{id:"13.1", t:13, p:3, q:"Microservices có ưu, nhược điểm gì so với Monolithic?", a:[
 "<b>Ưu</b>: deploy độc lập; scale riêng từng phần theo tải; team tự chủ; cách ly lỗi; tự do chọn công nghệ; codebase mỗi service dễ nắm.",
 "<b>Nhược</b>: độ phức tạp vận hành tăng vọt (deploy, monitor, tracing); network là điểm lỗi mới (latency, timeout, retry); dữ liệu phân tán nên <b>mất transaction ACID xuyên service</b>; debug xuyên service khó; chi phí hạ tầng và nhân lực cao.",
 "Monolith ưu: đơn giản, transaction dễ, refactor xuyên module dễ, một lần deploy, dễ test end-to-end.",
 "Monolith nhược: build/deploy chậm khi lớn, coupling dần dần, scale phải nhân bản toàn bộ, một lỗi hạ cả hệ thống.",
 "Điểm mấu chốt: microservices là đánh đổi <b>độ phức tạp kỹ thuật</b> để lấy <b>khả năng mở rộng tổ chức</b>."]},

{id:"13.2", t:13, p:3, q:"Khi nào KHÔNG nên dùng microservices?", trap:true, a:[
 "Team nhỏ (dưới ~15–20 người) — chi phí vận hành vượt xa lợi ích.",
 "Chưa hiểu rõ domain — tách sai ranh giới rồi phải gộp lại là việc cực kỳ đắt.",
 "Chưa có nền tảng: CI/CD, monitoring, centralized logging, distributed tracing, container orchestration.",
 "Nghiệp vụ đòi hỏi consistency mạnh, nhiều transaction xuyên module.",
 "Sản phẩm giai đoạn đầu, yêu cầu còn thay đổi liên tục.",
 "Khuyến nghị được nhiều người đồng thuận: <b>bắt đầu bằng modular monolith</b>, giữ ranh giới module rõ ràng, tách ra khi có lý do cụ thể (một module cần scale riêng, một team cần tự chủ).",
 "Trả lời được câu này cho thấy bạn đánh giá bằng trade-off chứ không chạy theo xu hướng."]},

{id:"13.3", t:13, p:3, q:"Cấu trúc một hệ thống microservices gồm những thành phần gì?", a:[
 "<b>API Gateway</b> — cửa vào duy nhất từ client.",
 "<b>Service Registry / Discovery</b> — Eureka, Consul, hoặc DNS của Kubernetes.",
 "<b>Config Server</b> — cấu hình tập trung theo môi trường.",
 "<b>Message Broker</b> — Kafka/RabbitMQ cho giao tiếp bất đồng bộ.",
