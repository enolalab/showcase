<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1120">
<title>Java Core LTS - Ôn Luyện Kiến Thức</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B1120; --panel:#131C2E; --panel2:#1A2438; --line:#27354F;
  --paper:#E6EDF7; --muted:#8296B8; --dim:#5E739A;
  --amber:#F5A623; --ember:#E2564A; --mint:#3FD08E; --azure:#4C9EEB; --violet:#9B7BE8;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --sans:'IBM Plex Sans',system-ui,sans-serif;
  --disp:'Space Grotesk',var(--sans);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--ink); color:var(--paper); font-family:var(--sans);
  font-size:clamp(14px,2.5vw,16px); line-height:1.6; -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(ellipse 80% 50% at 50% -10%, rgba(76,158,235,.10), transparent 70%);
  background-attachment:fixed;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
code{font-family:var(--mono);font-size:.87em;background:rgba(76,158,235,.13);
  color:#A9CDF3;padding:.1em .38em;border-radius:4px;border:1px solid rgba(76,158,235,.16)}
b{font-weight:600;color:#fff}
i{color:var(--muted)}

.wrap{max-width:860px;margin:0 auto;padding:0 clamp(12px,3vw,20px) calc(clamp(40px,8vw,64px) + env(safe-area-inset-bottom))}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:50;background:rgba(11,17,32,.88);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line);margin-bottom:20px}
.bar-in{max-width:860px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) clamp(12px,3vw,20px) 12px;
  display:flex;align-items:center;gap:12px}
.brand{font-family:var(--disp);font-weight:700;font-size:clamp(13px,2.5vw,15px);letter-spacing:-.01em;white-space:nowrap}
.brand span{color:var(--azure)}
.bar-sp{flex:1}
.counter{font-family:var(--mono);font-size:clamp(10px,2vw,12px);color:var(--muted);white-space:nowrap}
.counter b{color:var(--paper)}
.track{height:2px;background:var(--line);position:relative;overflow:hidden}
.track i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--azure),var(--mint));
  width:0;transition:width .45s cubic-bezier(.4,0,.2,1)}

/* ---------- setup ---------- */
.hero{padding:clamp(30px,6vw,52px) 0 clamp(20px,4vw,34px);border-bottom:1px solid var(--line);margin-bottom:20px}
.eyebrow{font-family:var(--mono);font-size:clamp(9px,2vw,11px);letter-spacing:.16em;text-transform:uppercase;
  color:var(--azure);margin-bottom:12px}
h1{font-family:var(--disp);font-size:clamp(24px,5vw,46px);line-height:1.08;
  font-weight:700;letter-spacing:-.028em;margin-bottom:12px}
h1 em{font-style:normal;color:var(--azure)}
.lede{color:var(--muted);max-width:56ch;font-size:clamp(13px,2.5vw,16.5px)}
.lede b{color:var(--paper);font-weight:600}

.sec{margin-bottom:24px}
.sec-h{font-family:var(--mono);font-size:clamp(9px,2vw,11px);letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);margin-bottom:12px;display:flex;align-items:center;gap:10px}
.sec-h:after{content:'';flex:1;height:1px;background:var(--line)}

.chips{display:flex;flex-wrap:wrap;gap:clamp(6px,2vw,8px)}
.chip{padding:clamp(5px,1.5vw,7px) clamp(10px,2vw,13px);border:1px solid var(--line);border-radius:999px;
  font-size:clamp(12px,2vw,13.5px);color:var(--muted);transition:.15s;background:var(--panel)}
.chip:hover{border-color:var(--dim);color:var(--paper)}
.chip.on{background:rgba(76,158,235,.11);border-color:var(--azure);color:var(--azure)}
.chip .n{font-family:var(--mono);font-size:clamp(9px,1.5vw,11px);opacity:.65;margin-left:4px}

.tabs{display:flex;gap:clamp(6px,2vw,8px);margin-bottom:20px;border-bottom:1px solid var(--line);
  padding-bottom:12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{padding:clamp(6px,1.5vw,8px) clamp(12px,2.5vw,16px);border:1px solid var(--line);border-radius:6px;
  background:var(--panel);color:var(--muted);transition:.15s;cursor:pointer;font-family:var(--disp);
  font-weight:600;font-size:clamp(12px,2vw,14px);white-space:nowrap;min-height:44px;display:flex;align-items:center}
.tab:active{background:var(--panel2)}
.tab:hover{border-color:var(--dim);color:var(--paper)}
.tab.active{border-color:var(--azure);background:rgba(76,158,235,.07);color:var(--azure)}

.sidebar{display:grid;grid-template-columns:1fr;gap:clamp(16px,3vw,24px)}
@media(min-width:768px){
  .sidebar{grid-template-columns:200px 1fr}
}

.sidebar-menu{display:flex;flex-direction:column;gap:16px;height:fit-content}
.menu-group{display:flex;flex-direction:column;gap:8px}
.menu-label{font-family:var(--mono);font-size:clamp(10px,1.8vw,12px);letter-spacing:.08em;
  text-transform:uppercase;color:var(--dim);font-weight:600}
.menu-row{display:flex;flex-direction:row;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.menu-item{padding:clamp(8px,1.5vw,10px) clamp(12px,2vw,14px);border-radius:6px;font-size:clamp(12px,2vw,13.5px);
  color:var(--muted);cursor:pointer;transition:.15s;border:1px solid var(--line);min-height:44px;
  display:flex;align-items:center;white-space:nowrap;flex:0 0 auto;-webkit-tap-highlight-color:transparent}
.menu-item:active{background:var(--panel2)}
.menu-item:hover{color:var(--paper);border-color:var(--dim)}
.menu-item.active{background:rgba(76,158,235,.07);border-color:var(--azure);color:var(--azure)}
@media(min-width:768px){
  .sidebar-menu{position:sticky;top:100px}
  .menu-row{flex-direction:column;overflow-x:visible;padding-bottom:0}
  .menu-item{white-space:normal;flex:none;border-color:transparent}
  .menu-item:hover{border-color:var(--line)}
}

.content{flex:1;min-width:0}
.tutorial,.drill{display:none}
.tutorial.active,.drill.active{display:block}

.tag{padding:clamp(2px,1vw,3px) clamp(7px,1.5vw,9px);border-radius:4px;border:1px solid var(--line);
  color:var(--muted);font-size:clamp(9px,1.5vw,11px);display:inline-block}
.tag.beginner{color:var(--mint);border-color:rgba(63,208,142,.4);background:rgba(63,208,142,.09)}
.tag.intermediate{color:var(--amber);border-color:rgba(245,166,35,.35);background:rgba(245,166,35,.08)}
.tag.advanced{color:var(--ember);border-color:rgba(226,86,74,.4);background:rgba(226,86,74,.09)}
.tag.v8{color:var(--azure);border-color:rgba(76,158,235,.4);background:rgba(76,158,235,.09)}
.tag.v11{color:var(--mint);border-color:rgba(63,208,142,.4);background:rgba(63,208,142,.09)}
.tag.v17{color:var(--violet);border-color:rgba(155,123,232,.4);background:rgba(155,123,232,.1)}
.tag.v21{color:var(--amber);border-color:rgba(245,166,35,.35);background:rgba(245,166,35,.08)}

.q{font-family:var(--disp);font-size:clamp(16px,4vw,26px);line-height:1.3;
  font-weight:700;letter-spacing:-.02em;margin-bottom:16px}

.code-block{background:var(--panel2);padding:clamp(10px,2vw,16px);border-radius:6px;border:1px solid var(--line);
  overflow-x:auto;-webkit-overflow-scrolling:touch;margin:12px 0;font-family:var(--mono);
  font-size:clamp(11px,1.8vw,13px);line-height:1.5}
.code-block code{background:none;padding:0;border:none;color:#A9CDF3}

.choices{display:flex;flex-direction:column;gap:10px;margin:16px 0}
.choice{padding:clamp(12px,2vw,16px);border:2px solid var(--line);border-radius:6px;background:var(--panel);
  cursor:pointer;transition:.15s;-webkit-tap-highlight-color:transparent;min-height:44px;display:flex;
  align-items:center;font-size:clamp(12px,2vw,14px)}
.choice:active{background:var(--panel2)}
.choice:hover{border-color:var(--dim)}
.choice.selected{border-color:var(--azure);background:rgba(76,158,235,.07)}
.choice.correct{border-color:var(--mint);background:rgba(63,208,142,.09)}
.choice.incorrect{border-color:var(--ember);background:rgba(226,86,74,.09)}

.btn{padding:clamp(10px,2vw,12px) clamp(16px,3vw,20px);border-radius:6px;background:var(--azure);
  color:#fff;font-family:var(--disp);font-weight:600;border:none;cursor:pointer;transition:.15s;
  font-size:clamp(12px,2vw,14px);min-height:44px;-webkit-tap-highlight-color:transparent}
.btn:active{filter:brightness(0.9)}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.progress-bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.progress-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--azure),var(--mint));
  width:0;transition:width .6s ease}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:clamp(8px,2vw,12px);margin:16px 0}
.stat-card{padding:clamp(12px,2vw,16px);border:1px solid var(--line);border-radius:6px;background:var(--panel);
  text-align:center}
.stat-card .num{font-family:var(--mono);font-size:clamp(18px,3vw,24px);font-weight:700;color:var(--azure);margin-bottom:4px}
.stat-card .label{font-size:clamp(10px,1.5vw,12px);color:var(--muted)}

.placeholder{padding:clamp(24px,4vw,40px) clamp(16px,2vw,20px);text-align:center;color:var(--dim);
  font-size:clamp(13px,2vw,14px)}

h2{font-family:var(--disp);font-size:clamp(18px,4vw,24px);margin-bottom:12px;font-weight:700}
h3{font-family:var(--disp);font-size:clamp(14px,3vw,18px);margin-bottom:8px;font-weight:600}

.card{margin-bottom:16px;padding:clamp(12px,2vw,20px);border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.card ul{margin:8px 0 0 clamp(16px,3vw,20px);color:var(--muted);font-size:clamp(12px,2vw,13px)}
.card li{margin-bottom:4px}
</style>
</head>
<body>

<div class="bar">
  <div class="bar-in">
    <div class="brand">Java <span>LTS</span></div>
    <div class="bar-sp"></div>
    <div class="counter">
      <span id="current-count">0</span><b>/</b><span id="total-count">0</span>
    </div>
    <div class="track"><i id="progress-fill"></i></div>
  </div>
</div>

<div class="wrap">
  <div class="hero">
    <div class="eyebrow">📚 Ôn Luyện Kiến Thức</div>
    <h1>Java Core <em>LTS</em> Mastery</h1>
    <p class="lede">Nắm vững <b>kiến thức nền tảng Java</b> qua <b>4 phiên bản LTS</b>: Java 8, 11, 17 và 21. Kết hợp <b>hướng dẫn chi tiết</b> và <b>bài tập thực hành</b> để luyện tập hiệu quả.</p>
  </div>

  <div class="sec">
    <div class="sec-h">Java LTS Versions</div>
    <div class="chips">
      <div class="chip on">
        <span>Java 8</span>
        <span class="n">2014</span>
      </div>
      <div class="chip">
        <span>Java 11</span>
        <span class="n">2018</span>
      </div>
      <div class="chip">
        <span>Java 17</span>
        <span class="n">2021</span>
      </div>
      <div class="chip">
        <span>Java 21</span>
        <span class="n">2023</span>
      </div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchMode('tutorials')">📚 Hướng Dẫn</div>
    <div class="tab" onclick="switchMode('drills')">⚡ Bài Tập</div>
  </div>

  <!-- Tutorials Section -->
  <div id="tutorials-mode">
    <div class="sidebar">
      <div class="sidebar-menu" id="topics-menu"></div>
      <div class="content" id="tutorials-content"></div>
    </div>
  </div>

  <!-- Drills Section -->
  <div id="drills-mode" style="display:none">
    <div class="sidebar">
      <div class="sidebar-menu" id="filters-menu"></div>
      <div class="content" id="drills-content"></div>
    </div>
  </div>
</div>

<script>
// Topics
const TOPICS = [
  { id: 1, name: "Java Cơ Bản", desc: "Biến, toán tử, luồng điều khiển" },
  { id: 2, name: "Lập Trình Hướng Đối Tượng", desc: "Class, kế thừa, interface, đa hình" },
  { id: 3, name: "Collections", desc: "List, Set, Map, iterator" },
  { id: 4, name: "Xử Lý Chuỗi", desc: "String handling và APIs" },
  { id: 5, name: "Generics", desc: "Type parameters và wildcard" },
  { id: 6, name: "Exception Handling", desc: "Try-catch, try-with-resources" },
  { id: 7, name: "Bộ Nhớ & GC", desc: "Heap, stack, garbage collection" },
  { id: 8, name: "Lambdas", desc: "Functional interfaces, method reference" },
  { id: 9, name: "Streams API", desc: "Map, filter, reduce, collector" },
  { id: 10, name: "Optional", desc: "Xử lý null hiệu quả" },
  { id: 11, name: "Modules", desc: "Java modules (Java 9+)" },
  { id: 12, name: "HTTP Client", desc: "Modern HTTP (Java 11+)" },
  { id: 13, name: "Type Inference", desc: "Từ khóa var (Java 10+)" },
  { id: 14, name: "Records", desc: "Immutable data classes (Java 17+)" },
  { id: 15, name: "Sealed Classes", desc: "Hạn chế kế thừa (Java 17+)" },
  { id: 16, name: "Pattern Matching", desc: "Pattern matching nâng cao (Java 17+)" },
  { id: 17, name: "Virtual Threads", desc: "Lightweight threading (Java 21+)" },
  { id: 18, name: "Concurrency", desc: "Thread, lock, executor" },
  { id: 19, name: "Design Patterns", desc: "Các pattern thông dụng" },
  { id: 20, name: "Best Practices", desc: "Performance, testing, architecture" }
];

const TUTORIALS = [
  // Topic 1: Java Cơ Bản
  { id: "t-1-1", topicId: 1, versions: [8, 11, 17, 21], title: "Biến và Kiểu Dữ Liệu", content: "Tìm hiểu về các kiểu nguyên thủy (int, long, float, double, boolean, char) và kiểu tham chiếu. Hiểu về casting và auto-boxing.", example: "int age = 25;\nlong pop = 8000000000L;\ndouble pi = 3.14159;\nboolean active = true;", keyPoints: ["Kiểu nguyên thủy vs tham chiếu", "Casting và chuyển đổi", "Auto-boxing"] },
  { id: "t-1-2", topicId: 1, versions: [8, 11, 17, 21], title: "If-Else, Loops, Switch", content: "Thành thạo câu lệnh điều kiện và vòng lặp. Hiểu sự khác biệt giữa for, while và enhanced for.", example: "for (int i = 0; i < 10; i++) {\n  if (i % 2 == 0) System.out.println(i);\n}\nswitch (day) {\n  case 1: System.out.println(\"Thứ Hai\");\n}", keyPoints: ["If-else-if chains", "For và while loop", "Switch statement"] },
  { id: "t-1-3", topicId: 1, versions: [8, 11, 17, 21], title: "Arrays và ArrayList", content: "Làm việc với mảng và ArrayList. Hiểu sự khác biệt giữa mảng cố định và collection động.", example: "int[] nums = {1, 2, 3, 4, 5};\nList<Integer> list = new ArrayList<>();\nlist.add(10);", keyPoints: ["Mảng cố định", "ArrayList động", "Các pattern iteration"] },
  { id: "t-1-4", topicId: 1, versions: [8, 11, 17, 21], title: "Toán Tử và Độ Ưu Tiên", content: "Hiểu các toán tử số học, logic và bitwise. Nắm rõ thứ tự ưu tiên toán tử để tránh lỗi.", example: "int result = 5 + 3 * 2;  // 11, không phải 16\nboolean flag = true && false || true;  // true", keyPoints: ["Toán tử số học và logic", "Độ ưu tiên toán tử", "Toán tử ba ngôi (?:)"] },
  { id: "t-1-5", topicId: 1, versions: [8, 11, 17, 21], title: "Phạm Vi và Vòng Đời Biến", content: "Hiểu phạm vi biến (local, class, tham số). Tìm hiểu về việc che khuất biến (shadowing) và rủi ro của nó.", example: "{\n  int x = 10;  // phạm vi local\n  {\n    int x = 20;  // che khuất x bên ngoài\n  }\n}", keyPoints: ["Biến local vs biến instance", "Che khuất biến (shadowing)", "Quy tắc phạm vi"] },

  // Topic 2: OOP
  { id: "t-2-1", topicId: 2, versions: [8, 11, 17, 21], title: "Class, Object, Constructor", content: "Học cách định nghĩa class và tạo object. Hiểu constructor và method overloading.", example: "class Person {\n  String name;\n  int age;\n  Person(String name, int age) {\n    this.name = name; this.age = age;\n  }\n}", keyPoints: ["Định nghĩa class", "Constructor", "Từ khóa this"] },
  { id: "t-2-2", topicId: 2, versions: [8, 11, 17, 21], title: "Kế Thừa và Ghi Đè Phương Thức", content: "Nắm vững cấu trúc kế thừa. Hiểu về ghi đè phương thức (override), từ khóa super và cách gọi constructor theo chuỗi.", example: "class Animal {\n  void speak() { System.out.println(\"...\"); }\n}\nclass Dog extends Animal {\n  @Override\n  void speak() { System.out.println(\"Woof\"); }\n}", keyPoints: ["Từ khóa extends", "Ghi đè phương thức", "Từ khóa super", "Constructor chaining"] },
  { id: "t-2-3", topicId: 2, versions: [8, 11, 17, 21], title: "Interface và Abstract Class", content: "Hiểu về hợp đồng (contract) được định nghĩa bởi interface và abstract class. Biết khi nào nên dùng loại nào.", example: "interface Animal {\n  void speak();\n}\nabstract class Mammal implements Animal {\n  abstract void sleep();\n}", keyPoints: ["Hợp đồng của interface", "Abstract class", "Implement nhiều interface"] },
  { id: "t-2-4", topicId: 2, versions: [8, 11, 17, 21], title: "Đa Hình (Polymorphism)", content: "Tận dụng tính đa hình để viết code linh hoạt. Hiểu về cơ chế phân giải phương thức lúc runtime.", example: "List<Animal> animals = Arrays.asList(new Dog(), new Cat());\nfor (Animal a : animals) a.speak();  // Gọi phương thức đã override", keyPoints: ["Đa hình lúc runtime", "Phân giải phương thức", "Nguyên lý thay thế Liskov"] },
  { id: "t-2-5", topicId: 2, versions: [8, 11, 17, 21], title: "Access Modifier và Encapsulation", content: "Kiểm soát khả năng truy cập với public, private, protected. Áp dụng pattern getter/setter.", example: "public class Account {\n  private double balance;\n  public double getBalance() { return balance; }\n  public void deposit(double amount) { balance += amount; }\n}", keyPoints: ["Access modifier", "Tính đóng gói (Encapsulation)", "Ẩn thông tin"] },

  // Topic 3: Collections
  { id: "t-3-1", topicId: 3, versions: [8, 11, 17, 21], title: "List Interface", content: "Sử dụng ArrayList, LinkedList và các implementation khác. Hiểu tính năng hiệu suất.", example: "List<String> list = new ArrayList<>();\nlist.add(\"Java\");\nlist.add(0, \"Hello\");", keyPoints: ["ArrayList vs LinkedList", "Add, remove, get", "Iteration"] },
  { id: "t-3-2", topicId: 3, versions: [8, 11, 17, 21], title: "Set Interface và Tính Duy Nhất", content: "Sử dụng HashSet, TreeSet và LinkedHashSet. Hiểu cách chúng đảm bảo tính duy nhất của phần tử.", example: "Set<Integer> numbers = new HashSet<>(Arrays.asList(1, 2, 2, 3));\nSystem.out.println(numbers);  // [1, 2, 3]", keyPoints: ["Hiệu năng HashSet", "Thứ tự trong TreeSet", "Thứ tự chèn của LinkedHashSet"] },
  { id: "t-3-3", topicId: 3, versions: [8, 11, 17, 21], title: "Map Interface và Lưu Trữ Key-Value", content: "Lưu trữ và truy xuất dữ liệu với HashMap, TreeMap và ConcurrentHashMap.", example: "Map<String, Integer> scores = new HashMap<>();\nscores.put(\"Alice\", 95);\nscores.put(\"Bob\", 87);\nInteger diem = scores.get(\"Alice\");", keyPoints: ["Cơ bản về HashMap", "Thao tác key-value", "Các cách duyệt (iterate)"] },
  { id: "t-3-4", topicId: 3, versions: [8, 11, 17, 21], title: "Iterator và Enhanced For Loop", content: "Thành thạo các cách duyệt phần tử khác nhau. Biết khi nào dùng Iterator, khi nào dùng enhanced for loop.", example: "Iterator<String> it = list.iterator();\nwhile (it.hasNext()) {\n  String item = it.next();\n  it.remove();  // Xóa an toàn\n}", keyPoints: ["Iterator pattern", "ConcurrentModificationException", "Enhanced for loop"] },

  { id: "d-9-6", topicId: 9, versions: [8, 11, 17, 21], difficulty: "intermediate", question: "Ưu điểm hiệu năng của parallel stream là gì?", choices: ["Luôn luôn nhanh hơn", "Nhanh hơn trên máy nhiều nhân (multi-core)", "Luôn luôn chậm hơn", "Không khác biệt"], correctAnswer: 1, explanation: "parallelStream() dùng ForkJoinPool để xử lý song song. Có lợi trên hệ thống nhiều nhân với dataset lớn." },
  { id: "d-9-7", topicId: 9, versions: [8, 11, 17, 21], difficulty: "advanced", question: "Lazy evaluation trong stream là gì?", choices: ["Các thao tác thực thi ngay lập tức", "Các thao tác chỉ thực thi khi terminal operation được gọi", "Cả hai", "Không cái nào"], correctAnswer: 1, explanation: "Stream là lazy: intermediate operation không thực thi cho đến khi có terminal operation kích hoạt." },
  { id: "d-9-8", topicId: 9, versions: [8, 11, 17, 21], difficulty: "advanced", question: ".reduce(0, Integer::sum) làm gì?", choices: ["Tính tổng các phần tử bắt đầu từ 0", "Giảm kích thước list", "Xóa số 0", "Đếm phần tử"], correctAnswer: 0, explanation: "reduce(identity, accumulator) kết hợp các phần tử stream. reduce(0, Integer::sum) tính tổng tất cả: 0 + tất cả phần tử." },

  // Topic 14: Records (Java 17+)
  { id: "d-14-1", topicId: 14, versions: [17, 21], difficulty: "beginner", question: "record keyword làm gì?", choices: ["Record data to file", "Tạo data class", "Implements Serializable", "Mutable class"], correctAnswer: 1, explanation: "record (Java 17+): tạo immutable data class với auto-generated equals, hashCode, toString" },
  { id: "d-14-2", topicId: 14, versions: [17, 21], difficulty: "beginner", question: "public record Point(int x, int y) { } tự động sinh ra gì?", choices: ["Constructor", "equals() và hashCode()", "toString()", "Tất cả các đáp án trên"], correctAnswer: 3, explanation: "Record tự động sinh: constructor, equals, hashCode, toString, getter (x(), y())." },
  { id: "d-14-3", topicId: 14, versions: [17, 21], difficulty: "intermediate", question: "Record có thể có custom method không?", choices: ["Có", "Không", "Chỉ từ Java 21+", "Chỉ static method"], correctAnswer: 0, explanation: "Record có thể có custom instance method và static method. Cũng có thể thêm validate trong compact constructor." },

  // Topic 17: Virtual Threads (Java 21+)
  { id: "d-17-1", topicId: 17, versions: [21], difficulty: "beginner", question: "Virtual thread là gì?", choices: ["Thread nhẹ được quản lý bởi JVM", "Thread OS nặng", "Thread pool", "Tác vụ bất đồng bộ (async task)"], correctAnswer: 0, explanation: "Virtual thread (Java 21+) là thread nhẹ do JVM quản lý, không phải OS. Có thể chạy hàng triệu thread đồng thời." },
  { id: "d-17-2", topicId: 17, versions: [21], difficulty: "beginner", question: "Executors.newVirtualThreadPerTaskExecutor() dùng để làm gì?", choices: ["Tạo thread pool gồm các virtual thread", "Tạo một virtual thread duy nhất", "Tạo OS thread", "Không hợp lệ"], correctAnswer: 0, explanation: "newVirtualThreadPerTaskExecutor() trả về ExecutorService tạo một virtual thread mới cho mỗi tác vụ." },

  // Topic 18: Concurrency
  { id: "d-18-1", topicId: 18, versions: [8, 11, 17, 21], difficulty: "beginner", question: "Race condition là gì?", choices: ["Threads cạnh tranh resource", "Program chạy quá nhanh", "Threads finish out of order", "Thread scheduling"], correctAnswer: 0, explanation: "Race condition: nhiều thread access shared resource cùng lúc → kết quả không dự đoán" },
  { id: "d-18-2", topicId: 18, versions: [8, 11, 17, 21], difficulty: "intermediate", question: "Sự khác biệt giữa wait() vs sleep()?", choices: ["wait() release lock, sleep() không", "sleep() nhanh hơn", "Không khác", "Cả 2 release"], correctAnswer: 0, explanation: "wait(): release lock (threads khác có thể acquire). sleep(): giữ lock." },
  { id: "d-18-3", topicId: 18, versions: [8, 11, 17, 21], difficulty: "beginner", question: "Từ khóa synchronized làm gì?", choices: ["Làm method thread-safe", "Làm method chạy nhanh hơn", "Làm method private", "Làm method static"], correctAnswer: 0, explanation: "synchronized đảm bảo chỉ một thread thực thi method/block đó tại một thời điểm, tránh race condition." },
  { id: "d-18-4", topicId: 18, versions: [8, 11, 17, 21], difficulty: "intermediate", question: "Deadlock là gì?", choices: ["Thread hoàn thành", "Hai (hoặc nhiều) thread chờ lock của nhau", "Chương trình bị crash", "Thread bị block"], correctAnswer: 1, explanation: "Deadlock: Thread A giữ Lock 1 và chờ Lock 2; Thread B giữ Lock 2 và chờ Lock 1. Cả hai bị kẹt mãi mãi." },
  { id: "d-18-5", topicId: 18, versions: [8, 11, 17, 21], difficulty: "advanced", question: "Cách nào giúp tránh deadlock? (1) Dùng tryLock() với timeout, (2) Luôn lấy lock theo cùng một thứ tự", choices: ["Chỉ cách (1)", "Chỉ cách (2)", "Cả hai đều giúp tránh", "Không cách nào có tác dụng"], correctAnswer: 2, explanation: "Cả hai chiến lược đều giúp tránh deadlock: tryLock() tránh chờ vô thời hạn; lấy lock theo thứ tự nhất quán tránh chờ vòng tròn (circular wait)." },

  // Topic 20: Best Practices
  { id: "d-20-1", topicId: 20, versions: [8, 11, 17, 21], difficulty: "beginner", question: "Unit test là gì?", choices: ["Test toàn bộ app", "Test single method/class", "Test UI", "Test database"], correctAnswer: 1, explanation: "Unit test: test đơn vị nhỏ nhất (single method/class) một cách cô lập" },
  { id: "d-20-2", topicId: 20, versions: [8, 11, 17, 21], difficulty: "intermediate", question: "Single Responsibility Principle?", choices: ["Class chỉ làm 1 việc", "Method return 1 value", "Variable có 1 value", "Tất cả"], correctAnswer: 0, explanation: "SRP: class chỉ nên có DUY NHẤT một lý do để thay đổi" },
  { id: "d-20-3", topicId: 20, versions: [8, 11, 17, 21], difficulty: "beginner", question: "Code smell là gì?", choices: ["Code biên dịch được", "Code chạy nhanh", "Dấu hiệu của vấn đề thiết kế sâu xa hơn", "Code hợp lệ nào cũng vậy"], correctAnswer: 2, explanation: "Code smell: dấu hiệu cảnh báo code có thể có vấn đề thiết kế (method quá dài, code trùng lặp, quá nhiều tham số, v.v.)." }
];

// State
let currentMode = 'tutorials';
let currentTopic = 1;
let currentDrillFilter = { topic: 1, difficulty: 'all', version: 'all' };
let completedDrills = new Set();

// Initialize
function init() {
  loadState();
  renderTopicsMenu();
  renderTutorial(1);
  renderDrillsFilters();
  updateProgress();
}

function loadState() {
  const saved = localStorage.getItem('java-core-lts-state');
  if (saved) {
    const state = JSON.parse(saved);
    completedDrills = new Set(state.completedDrills);
  }
}

function saveState() {
  localStorage.setItem('java-core-lts-state', JSON.stringify({
    completedDrills: Array.from(completedDrills)
  }));
}

function switchMode(mode) {
  currentMode = mode;
  document.getElementById('tutorials-mode').style.display = mode === 'tutorials' ? 'block' : 'none';
  document.getElementById('drills-mode').style.display = mode === 'drills' ? 'block' : 'none';
  document.querySelectorAll('.tab').forEach((tab, i) => {
    tab.classList.toggle('active', (i === 0 && mode === 'tutorials') || (i === 1 && mode === 'drills'));
  });
  updateProgress();
}

function renderTopicsMenu() {
  const menu = document.getElementById('topics-menu');
  menu.innerHTML = `
    <div class="menu-row">
      ${TOPICS.map(t => `
        <div class="menu-item ${t.id === currentTopic ? 'active' : ''}" onclick="selectTopic(${t.id})">
          ${t.name}
        </div>
      `).join('')}
    </div>
  `;
}

function selectTopic(id) {
  currentTopic = id;
  renderTopicsMenu();
  renderTutorial(id);
}

function renderTutorial(topicId) {
  const topic = TOPICS.find(t => t.id === topicId);
  const tutorialsForTopic = TUTORIALS.filter(t => t.topicId === topicId);
  const content = document.getElementById('tutorials-content');

  if (tutorialsForTopic.length === 0) {
    content.innerHTML = `<div class="placeholder">📝 Hướng dẫn cho ${topic.name} sắp có...</div>`;
    return;
  }

  content.innerHTML = `
    <div>
      <h2>${topic.name}</h2>
      <p class="lede">${topic.desc}</p>
      <div class="sec" style="margin-top: 20px">
        ${tutorialsForTopic.map(t => `
          <div class="card">
            <div style="display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap">
              ${t.versions.map(v => `<span class="tag v${v}">Java ${v}</span>`).join('')}
            </div>
            <h3>${t.title}</h3>
            <p style="color:var(--muted);margin-bottom:12px;font-size:clamp(12px,2vw,13px)">${t.content}</p>
            <div class="code-block"><code>${escapeHtml(t.example)}</code></div>
            <div>
              <strong style="color:var(--azure)">💡 Điểm chính:</strong>
              <ul style="margin:6px 0 0 clamp(14px,3vw,18px);color:var(--muted);font-size:clamp(11px,2vw,12px)">
                ${t.keyPoints.map(kp => `<li>${kp}</li>`).join('')}
              </ul>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function renderDrillsFilters() {
  const menu = document.getElementById('filters-menu');
  menu.innerHTML = `
    <div class="menu-group">
      <div class="menu-label">Chủ Đề</div>
      <div class="menu-row">
        ${TOPICS.map(t => `
          <div class="menu-item ${t.id === currentDrillFilter.topic ? 'active' : ''}" onclick="filterDrills('topic', ${t.id})">
            ${t.name}
          </div>
        `).join('')}
      </div>
    </div>
    <div class="menu-group">
      <div class="menu-label">Độ Khó</div>
      <div class="menu-row">
        <div class="menu-item ${currentDrillFilter.difficulty === 'all' ? 'active' : ''}" onclick="filterDrills('difficulty', 'all')">Tất Cả</div>
        <div class="menu-item ${currentDrillFilter.difficulty === 'beginner' ? 'active' : ''}" onclick="filterDrills('difficulty', 'beginner')">Cơ Bản</div>
        <div class="menu-item ${currentDrillFilter.difficulty === 'intermediate' ? 'active' : ''}" onclick="filterDrills('difficulty', 'intermediate')">Trung Bình</div>
        <div class="menu-item ${currentDrillFilter.difficulty === 'advanced' ? 'active' : ''}" onclick="filterDrills('difficulty', 'advanced')">Nâng Cao</div>
      </div>
    </div>
  `;
  renderDrills();
}

function filterDrills(type, value) {
  currentDrillFilter[type] = value;
  renderDrillsFilters();
}

function renderDrills() {
  const filtered = DRILLS.filter(d => {
    const topicMatch = d.topicId === currentDrillFilter.topic;
    const diffMatch = currentDrillFilter.difficulty === 'all' || d.difficulty === currentDrillFilter.difficulty;
    return topicMatch && diffMatch;
  });

  const content = document.getElementById('drills-content');
  if (filtered.length === 0) {
    content.innerHTML = '<div class="placeholder">Bài tập cho bộ lọc này sắp có...</div>';
    return;
  }

  content.innerHTML = `
    <div>
      <div class="sec-h" style="margin-bottom:16px">Bài Tập (${filtered.length})</div>
      ${filtered.map((d, idx) => `
        <div id="drill-${d.id}" class="card">
          <div style="display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap">
            <span class="tag ${d.difficulty}">${getDifficultyLabel(d.difficulty)}</span>
            ${d.versions.map(v => `<span class="tag v${v}">Java ${v}</span>`).join('')}
            <span style="margin-left:auto;font-family:var(--mono);font-size:clamp(9px,1.5vw,11px);color:var(--dim)">${d.id}</span>
          </div>
          <div class="q">${d.question}</div>
          <div class="choices" id="choices-${d.id}">
            ${d.choices.map((choice, i) => `
              <div class="choice" onclick="selectChoice('${d.id}', ${i})">
                ${choice}
              </div>
            `).join('')}
          </div>
          <button class="btn" style="width:100%;margin-top:12px" onclick="revealAnswer('${d.id}')">
            Xem Đáp Án
          </button>
          <div id="answer-${d.id}" style="display:none;margin-top:12px;padding:clamp(10px,2vw,16px);border-radius:6px;background:var(--panel2);border-left:4px solid var(--mint)"></div>
        </div>
      `).join('')}
    </div>
  `;
}

function getDifficultyLabel(diff) {
  return { beginner: "Cơ Bản", intermediate: "Trung Bình", advanced: "Nâng Cao" }[diff];
}

function selectChoice(drillId, choiceIdx) {
  const choices = document.querySelectorAll(`#choices-${drillId} .choice`);
  choices.forEach(c => c.classList.remove('selected'));
  choices[choiceIdx].classList.add('selected');
}

function revealAnswer(drillId) {
  const d = DRILLS.find(x => x.id === drillId);
  const choicesDiv = document.getElementById(`choices-${drillId}`);
  const choices = choicesDiv.querySelectorAll('.choice');
  choices.forEach((c, i) => {
    if (i === d.correctAnswer) {
      c.classList.add('correct');
    }
  });
  const answerDiv = document.getElementById(`answer-${drillId}`);
  answerDiv.innerHTML = `
    <strong style="color:var(--mint)">✓ Đáp Án Đúng:</strong>
    <p style="margin:6px 0;color:var(--paper);font-size:clamp(12px,2vw,14px)">${escapeHtml(d.choices[d.correctAnswer])}</p>
    <strong style="color:var(--azure);display:block;margin-top:8px">📖 Giải Thích:</strong>
    <p style="margin:6px 0;color:var(--muted);font-size:clamp(11px,2vw,13px)">${escapeHtml(d.explanation)}</p>
    <button class="btn" style="margin-top:12px;width:100%" onclick="markCompleted('${drillId}')">Đánh Dấu Hoàn Thành ✓</button>
  `;
  answerDiv.style.display = 'block';
  updateProgress();
}

function markCompleted(drillId) {
  completedDrills.add(drillId);
  saveState();
  updateProgress();
  document.getElementById(`drill-${drillId}`).style.opacity = '0.6';
}

function updateProgress() {
  const total = DRILLS.length;
  const completed = completedDrills.size;
  document.getElementById('current-count').textContent = completed;
  document.getElementById('total-count').textContent = total;
  const percent = (completed / total) * 100;
  document.getElementById('progress-fill').style.width = percent + '%';
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
