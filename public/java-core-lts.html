ảy ra như mong đợi.","followUp":["Vì sao Spring Boot mặc định dùng CGLIB thay vì JDK dynamic proxy?","Nếu bắt buộc phải gọi method @Transactional từ trong cùng class, bạn xử lý thế nào?"]},{"id":"t-20-1","topicId":20,"versions":[8,11,17,21],"title":"Đo trước khi tối ưu: vì sao benchmark viết tay hầu như luôn sai","summary":"JIT làm mọi phép đo ngây thơ trở nên vô nghĩa — warm-up, dead code elimination, constant folding và lý do JMH tồn tại.","sections":["<b>Câu của Knuth bị trích sai suốt.</b> Nguyên văn là 'premature optimization is the root of all evil' <i>trong khoảng 97% trường hợp không quan trọng</i> — vế sau thường bị bỏ đi. Ý thật không phải 'đừng quan tâm hiệu năng' mà là: hãy tìm ra 3% thực sự quan trọng bằng cách <b>đo</b>, thay vì đoán. Trực giác của lập trình viên về chỗ chậm sai gần như luôn luôn, vì bottleneck thật thường nằm ở I/O, ở truy vấn N+1, hoặc ở một vòng lặp không ai ngờ tới.","<b>JIT làm hỏng mọi phép đo ngây thơ.</b> HotSpot chạy thông dịch trước, thu thập profile, rồi mới biên dịch method nóng sang mã máy (C1 rồi C2), và có thể deoptimize khi giả định bị phá vỡ. Nghĩa là vài nghìn vòng lặp đầu tiên chạy chậm hơn nhiều lần so với trạng thái ổn định. Đo bằng <code>System.nanoTime()</code> quanh một vòng lặp chạy một lần thì bạn chủ yếu đang đo tốc độ của interpreter — kết quả có thể lệch hàng chục lần so với thực tế production.","<b>Dead code elimination.</b> Nếu bạn tính một giá trị mà không dùng đến nó, C2 hoàn toàn có quyền xoá luôn phép tính đó. Benchmark đo <code>Math.log(x)</code> mà không dùng kết quả sẽ ra thời gian gần bằng 0 — không phải vì hàm nhanh mà vì nó không hề được chạy. Tương tự, <i>constant folding</i>: nếu đầu vào là hằng số biết trước lúc biên dịch, JIT tính sẵn kết quả và vòng lặp trở thành rỗng.","<b>JMH giải quyết đúng những vấn đề đó.</b> JMH (Java Microbenchmark Harness, do chính đội HotSpot viết) chạy warm-up iteration riêng để JIT đạt trạng thái ổn định, fork JVM mới cho mỗi benchmark để tránh nhiễu profile giữa các bài, dùng <code>Blackhole</code> để nuốt kết quả và chặn dead code elimination, và dùng <code>@State</code> để đầu vào không bị coi là hằng. Chạy microbenchmark bằng bất cứ cách nào khác nên bị coi là không đáng tin cho tới khi chứng minh ngược lại.","<b>Đo cái đúng, ở tầng đúng.</b> Microbenchmark chỉ trả lời câu hỏi vi mô. Trong hệ thống thật, thứ quyết định trải nghiệm là <i>phân vị</i> chứ không phải trung bình: p99 mới là con số người dùng cảm nhận, và trung bình cộng che giấu hoàn toàn đuôi phân phối. Công cụ tương ứng là profiler (async-profiler, JFR) để tìm hotspot, và tracing phân tán để biết thời gian thực sự bị tiêu ở service nào.","<b>Quy trình đúng.</b> Đặt mục tiêu số cụ thể (p99 dưới 200ms), đo baseline, profile để tìm điểm nóng thật, sửa một thứ, đo lại, giữ nếu tốt hơn. Mỗi tối ưu đều có giá — code khó đọc hơn, cache phải invalidate, thêm một tầng phải bảo trì — nên tối ưu không đo được là tối ưu chỉ có chi phí mà không có lợi ích."],"example":"// SAI: đo interpreter, và JIT có thể xoá sạch vòng lặp\nlong t0 = System.nanoTime();\nfor (int i = 0; i < 1000; i++) {\n    Math.log(42);           // kết quả không dùng -> dead code\n}\nSystem.out.println(System.nanoTime() - t0);\n\n// ĐÚNG: JMH\n@BenchmarkMode(Mode.AverageTime)\n@OutputTimeUnit(TimeUnit.NANOSECONDS)\n@Warmup(iterations = 5, time = 1)\n@Measurement(iterations = 10, time = 1)\n@Fork(2)\n@State(Scope.Benchmark)\npublic class LogBenchmark {\n\n    private double x;                    // không phải hằng -> chặn constant folding\n\n    @Setup\n    public void setup() { x = ThreadLocalRandom.current().nextDouble(1, 100); }\n\n    @Benchmark\n    public double measure() {\n        return Math.log(x);              // trả về giá trị -> JMH tự nuốt, chặn DCE\n    }\n\n    @Benchmark\n    public void measureWithBlackhole(Blackhole bh) {\n        bh.consume(Math.log(x));         // cách khác khi có nhiều kết quả\n    }\n}","exampleTitle":"Benchmark sai và bản JMH tương ứng","keyPoints":["Đo trước, tối ưu sau — trực giác về chỗ chậm gần như luôn sai, bottleneck thật thường ở I/O hoặc truy vấn.","Không warm-up thì bạn đang đo interpreter chứ không phải mã đã được JIT biên dịch.","Kết quả không được dùng sẽ bị dead code elimination xoá; đầu vào là hằng sẽ bị constant folding tính sẵn.","JMH xử lý warm-up, fork JVM, Blackhole và @State — đây là công cụ chuẩn cho microbenchmark trên JVM.","Trong hệ thống thật hãy nhìn p99 chứ không nhìn trung bình, và dùng profiler (async-profiler, JFR) để tìm hotspot."],"trap":"Benchmark cho ra con số 0.3ns cho một phép tính phức tạp không có nghĩa là code nhanh — nó gần như luôn có nghĩa là JIT đã xoá đoạn code đó. Con số đẹp bất thường là dấu hiệu benchmark hỏng, không phải dấu hiệu tối ưu thành công.","followUp":["Vì sao JMH phải fork một JVM mới cho mỗi benchmark?","Vì sao p99 quan trọng hơn giá trị trung bình khi đánh giá độ trễ?","Làm sao phát hiện một microbenchmark đã bị dead code elimination phá hỏng?"]},{"id":"t-20-2","topicId":20,"versions":[8,11,17,21],"title":"Immutability và fail fast: hai nguyên tắc rẻ tiền nhất để giảm bug","summary":"Vì sao object bất biến làm code dễ suy luận và thread-safe miễn phí, và vì sao kiểm tra ở biên tốt hơn phòng thủ ở khắp nơi.","sections":["<b>Immutability làm giảm không gian trạng thái.</b> Một object bất biến chỉ có đúng một trạng thái trong suốt vòng đời, nên khi đọc code bạn không phải truy vết xem ai đã sửa nó ở đâu. Hệ quả kèm theo là <b>thread-safe miễn phí</b>: không có ghi thì không có race condition, không cần <code>synchronized</code>, không cần nghĩ về visibility. Nó cũng làm object an toàn khi dùng làm key của <code>HashMap</code> — key bị mutate sau khi put là một trong những bug kinh điển nhất.","<b>Cách làm một class bất biến đúng chuẩn.</b> Class <code>final</code> (hoặc mọi constructor <code>private</code>), tất cả field <code>private final</code>, không có setter, và <b>defensive copy ở cả hai đầu</b>: sao chép collection/mảng/<code>Date</code> khi nhận vào constructor và khi trả ra qua getter. Bỏ qua bước copy là lỗi hay gặp nhất — một field <code>final</code> kiểu <code>List</code> chỉ đảm bảo reference không đổi, còn nội dung list vẫn bị người ngoài sửa thoải mái.","<b>Record (Java 16, có ở LTS 17 và 21) làm việc này gọn hơn.</b> <code>record Point(int x, int y) {}</code> sinh sẵn constructor, accessor, <code>equals</code>, <code>hashCode</code>, <code>toString</code>, và field là final. Nhưng cần nói rõ sắc thái ở phỏng vấn: record là <i>shallow immutable</i> — nếu một component là <code>List</code> mutable thì record đó không thật sự bất biến. Muốn chặt chẽ phải dùng compact constructor để copy: <code>List.copyOf(items)</code>.","<b>Fail fast: lỗi phải nổ càng gần nguyên nhân càng tốt.</b> Một <code>null</code> lọt vào constructor và chỉ gây <code>NullPointerException</code> sau ba tầng gọi, nửa tiếng sau, trong một thread khác, là cơn ác mộng khi debug. <code>Objects.requireNonNull(x, \"x\")</code> ngay tại constructor biến nó thành lỗi tại đúng dòng gây ra. Chi phí gần bằng 0, lợi ích là stack trace chỉ thẳng vào thủ phạm.","<b>Validate ở biên, tin tưởng ở trong.</b> Chiến lược đúng là kiểm tra dữ liệu <i>một lần</i> tại nơi nó đi vào hệ thống (controller, message listener, tầng đọc file), rồi chuyển nó thành một kiểu đã được đảm bảo hợp lệ. Sau ranh giới đó, code nội bộ không cần kiểm tra lại. Rải <code>if (x == null) return;</code> khắp mọi tầng là kiểu 'phòng thủ' làm code phình ra mà vẫn không ai biết ai chịu trách nhiệm về tính hợp lệ.","<b>Chi phí thật của immutability.</b> Nó tạo nhiều object hơn. Trong phần lớn trường hợp điều đó không đáng lo vì object ngắn hạn rất rẻ với GC theo thế hệ. Chỉ ở vòng lặp thật sự nóng — ví dụ ghép chuỗi hàng triệu lần — mới nên đổi sang cấu trúc mutable cục bộ như <code>StringBuilder</code>, và chỉ khi phép đo cho thấy nó đáng."],"example":"// Bất biến đúng: defensive copy cả hai đầu\npublic final class Order {\n    private final String id;\n    private final List<Item> items;\n\n    public Order(String id, List<Item> items) {\n        this.id = Objects.requireNonNull(id, \"id\");           // fail fast\n        this.items = List.copyOf(items);                      // copy khi nhan (List.copyOf: Java 10+)\n        // Java 8: this.items = Collections.unmodifiableList(new ArrayList<>(items));\n    }\n\n    public List<Item> getItems() { return items; }            // đã unmodifiable\n}\n\n// Record: shallow immutable, cần compact constructor để chặt chẽ\npublic record Shipment(String code, List<Item> items) {\n    public Shipment {\n        Objects.requireNonNull(code, \"code\");\n        items = List.copyOf(items);      // nếu không, list bên ngoài vẫn sửa được\n    }\n}\n\n// Bẫy kinh điển: field final nhưng nội dung vẫn mutable\npublic class Bad {\n    private final List<String> tags = new ArrayList<>();\n    public List<String> getTags() { return tags; }   // caller gọi add() thoải mái\n}","exampleTitle":"Bất biến thật vs bất biến giả","keyPoints":["Object bất biến chỉ có một trạng thái nên thread-safe mà không cần đồng bộ hoá, và an toàn khi làm key của HashMap.","final trên field chỉ khoá reference; muốn bất biến thật phải defensive copy khi nhận vào và khi trả ra.","Record (Java 16+, có ở LTS 17/21) là shallow immutable — dùng compact constructor với List.copyOf để làm chặt.","Objects.requireNonNull tại constructor biến bug xa nguồn thành lỗi ngay tại dòng gây ra.","Validate một lần ở biên rồi tin tưởng bên trong, thay vì rải kiểm tra null khắp mọi tầng."],"trap":"Coi record là 'immutable data class' rồi bỏ qua defensive copy. Một record chứa List mutable hoàn toàn có thể bị sửa từ bên ngoài, và equals/hashCode sinh sẵn sẽ thay đổi theo — đủ để phá hỏng một HashMap.","followUp":["Vì sao mutate một object đang dùng làm key của HashMap lại làm get() trả về null?","Record có phải luôn immutable không, và vì sao?","Khi nào bạn chấp nhận dùng object mutable thay vì bất biến?"]},{"id":"t-20-3","topicId":20,"versions":[8,11,17,21],"title":"Chiến lược test: kim tự tháp, mock vừa đủ, test hành vi chứ không test cài đặt","summary":"Vì sao mock quá nhiều làm test luôn xanh mà hệ thống vẫn hỏng, và cách chia tỉ lệ giữa unit test và integration test.","sections":["<b>Kim tự tháp test và lý do nó có hình đó.</b> Đáy là nhiều unit test — nhanh, ổn định, chạy trong mili giây, chỉ ra chính xác chỗ hỏng. Giữa là ít integration test hơn — chạy chậm hơn nhưng kiểm chứng được những thứ unit test không thể: SQL có đúng không, transaction có commit không, JSON có serialize đúng không. Đỉnh là rất ít end-to-end test — đắt, chậm, dễ flaky. Hình dạng này xuất phát từ đánh đổi giữa tốc độ phản hồi và độ tin cậy, không phải từ giáo điều.","<b>Ice-cream cone — phản đề hay gặp.</b> Nhiều đội có rất nhiều E2E test và gần như không có unit test. Kết quả: bộ test chạy 40 phút, hỏng ngẫu nhiên, và khi đỏ thì không ai biết hỏng ở đâu. Dần dần mọi người bỏ qua kết quả test — lúc đó bộ test có cũng như không.","<b>Test hành vi, không test cài đặt.</b> Test tốt khẳng định <i>kết quả quan sát được</i>: giá trị trả về, trạng thái đã thay đổi, message đã được gửi đi. Test tệ khẳng định <i>cách làm</i>: gọi đúng bao nhiêu lần method nào theo thứ tự nào. Loại thứ hai sẽ đỏ mỗi lần bạn refactor dù hành vi không đổi — nó biến bộ test từ lưới an toàn thành xiềng xích, đúng ngược lại mục đích ban đầu.","<b>Mock quá nhiều làm test mất ý nghĩa.</b> Khi mọi collaborator đều bị mock, thứ bạn test là <i>giả định của bạn về collaborator</i> chứ không phải hệ thống thật. Mock trả về đúng thứ bạn muốn, nên test luôn xanh trong khi production hỏng vì collaborator thật hành xử khác. Nguyên tắc thực dụng: chỉ mock những gì bạn <b>không kiểm soát</b> hoặc <b>không đủ rẻ để chạy thật</b> — HTTP client bên thứ ba, đồng hồ, sinh số ngẫu nhiên, hàng đợi. Đừng mock repository của chính bạn khi có thể chạy Testcontainers với database thật.","<b>Integration test đáng tin nhờ Testcontainers.</b> Mock JDBC không bao giờ phát hiện được lỗi cú pháp SQL, sai kiểu cột hay lỗi khoá ngoại. Testcontainers khởi động PostgreSQL/Kafka thật trong Docker cho từng lần chạy, cho độ tin cậy gần production mà vẫn tự động hoá được trong CI. Database in-memory như H2 rẻ hơn nhưng khác biệt phương ngữ SQL sẽ giấu bug tới tận khi deploy.","<b>Coverage là chỉ báo, không phải mục tiêu.</b> 100% coverage với toàn assert vô nghĩa còn tệ hơn 60% coverage tập trung vào logic nghiệp vụ và các nhánh biên. Chỉ số hữu ích hơn là: bug thoát ra production, thời gian chạy CI, và tỉ lệ test flaky. Một test flaky nên bị coi như bug nghiêm trọng — vì nó dạy cả đội thói quen chạy lại cho tới khi xanh."],"example":"// Test tệ: khẳng định cách làm, sẽ đỏ mỗi lần refactor\n@Test\nvoid badTest() {\n    service.placeOrder(order);\n    verify(repo, times(1)).findById(1L);\n    verify(repo).save(any());\n    verify(mailer).send(any());\n    verifyNoMoreInteractions(repo, mailer);   // xiềng xích, không phải lưới an toàn\n}\n\n// Test tốt: khẳng định hành vi quan sát được\n@Test\nvoid shouldRejectOrderWhenStockInsufficient() {\n    stock.set(\"SKU-1\", 2);\n\n    assertThatThrownBy(() -> service.placeOrder(orderOf(\"SKU-1\", 5)))\n        .isInstanceOf(InsufficientStockException.class);\n\n    assertThat(stock.get(\"SKU-1\")).isEqualTo(2);   // trạng thái không đổi\n}\n\n// Integration test với database thật\n@Testcontainers\n@SpringBootTest\nclass OrderRepositoryIT {\n    @Container\n    static PostgreSQLContainer<?> db = new PostgreSQLContainer<>(\"postgres:16\");\n\n    @Test\n    void shouldPersistAndReloadOrder() {\n        Order saved = repo.save(new Order(\"A-1\", items));\n        assertThat(repo.findById(saved.getId())).isPresent();\n    }\n}","exampleTitle":"Test cài đặt vs test hành vi","keyPoints":["Nhiều unit test nhanh ở đáy, ít integration test ở giữa, rất ít E2E ở đỉnh — vì đánh đổi giữa tốc độ và độ tin cậy.","Assert vào kết quả và trạng thái quan sát được, không assert vào số lần gọi và thứ tự gọi.","Chỉ mock thứ bạn không kiểm soát hoặc quá đắt để chạy thật; mock hết mọi thứ nghĩa là đang test chính giả định của mình.","Testcontainers cho database thật trong CI; H2 giấu bug do khác biệt phương ngữ SQL.","Coverage là chỉ báo chứ không phải mục tiêu; test flaky phải được xử lý như bug nghiêm trọng."],"trap":"Bộ test 100% xanh nhưng production vẫn hỏng thường là dấu hiệu mock quá tay: mọi collaborator đều trả về đúng thứ test mong đợi, nên test chỉ chứng minh rằng mock đã được cấu hình đúng chứ không chứng minh hệ thống chạy được.","followUp":["Khi nào bạn dùng mock và khi nào dùng object thật trong unit test?","Vì sao verify(...) quá nhiều làm refactor trở nên đắt đỏ?","H2 và Testcontainers khác nhau ở điểm nào về độ tin cậy?"]},{"id":"t-20-4","topicId":20,"versions":[8,11,17,21],"title":"Thiết kế API: Optional đúng chỗ, tên đúng nghĩa, hàm đủ nhỏ","summary":"Optional sinh ra cho kiểu trả về chứ không phải cho field hay tham số, và vì sao cách đặt tên quyết định chi phí bảo trì.","sections":["<b>Optional giải quyết đúng một vấn đề: kiểu trả về mơ hồ.</b> Trước Java 8, một method trả về <code>User</code> không cho biết <code>null</code> có phải kết quả hợp lệ hay không, và người gọi buộc phải đọc javadoc hoặc đọc code. <code>Optional&lt;User&gt;</code> đưa thông tin đó vào <i>kiểu</i>, khiến compiler nhắc người gọi phải xử lý trường hợp không có giá trị. Đó là toàn bộ ý đồ thiết kế — Brian Goetz nói rõ Optional được thêm vào cho kiểu trả về của method.","<b>Nơi không nên dùng Optional.</b> <i>Field</i>: <code>Optional</code> không implement <code>Serializable</code>, tốn thêm một lớp object cho mỗi instance, và nhiều framework ánh xạ (JPA, Jackson) xử lý không tự nhiên. <i>Tham số method</i>: bắt người gọi bọc giá trị vào <code>Optional.of(...)</code> chỉ để bạn mở ra ngay — hãy dùng overload hoặc chấp nhận <code>null</code> có tài liệu rõ ràng. <i>Collection rỗng</i>: đừng bao giờ trả <code>Optional&lt;List&lt;T&gt;&gt;</code>, hãy trả list rỗng — một collection rỗng đã tự nó diễn đạt 'không có gì'.","<b>Dùng Optional sai cách còn tệ hơn không dùng.</b> <code>if (o.isPresent()) { o.get(); }</code> chỉ là <code>if (x != null)</code> viết dài hơn và không hưởng lợi ích nào. Cách dùng đúng là chuỗi hàm: <code>map</code>, <code>filter</code>, <code>flatMap</code>, kết thúc bằng <code>orElse</code>, <code>orElseGet</code> hoặc <code>orElseThrow</code>. Lưu ý một bẫy hiệu năng: <code>orElse(expensive())</code> luôn tính đối số dù giá trị có mặt hay không, còn <code>orElseGet(() -&gt; expensive())</code> chỉ tính khi cần.","<b>Đặt tên là công cụ giảm chi phí đọc.</b> Code được đọc nhiều lần hơn được viết. Tên nên nói <i>ý định</i> chứ không nói <i>cơ chế</i>: <code>expiredSessions</code> tốt hơn <code>list2</code>; <code>calculateShippingFee</code> tốt hơn <code>process</code>. Method boolean nên đọc được như một mệnh đề (<code>isEligible</code>, <code>hasPendingPayment</code>). Một tên tốt tiết kiệm nhiều thời gian hơn bất kỳ dòng comment nào, và comment giải thích 'code này làm gì' thường là dấu hiệu tên chưa đủ tốt.","<b>Hàm nhỏ, một mức trừu tượng.</b> Vấn đề của hàm dài không phải số dòng mà là việc trộn nhiều mức trừu tượng: một hàm vừa nói chuyện nghiệp vụ vừa thao tác chỉ số mảng buộc người đọc nhảy qua lại giữa hai tầng tư duy. Tách ra để mỗi hàm chỉ ở một mức làm code tự mô tả. Tuy vậy đừng biến nó thành giáo điều: tách quá nhỏ tạo ra kiểu code phải mở mười file mới hiểu được một luồng, và điều đó cũng tệ tương đương.","<b>Comment nên trả lời câu hỏi vì sao.</b> Cái <i>gì</i> đã nằm trong code. Cái đáng viết là lý do một quyết định kỳ lạ tồn tại: vì sao phải retry đúng ba lần, vì sao phải sắp xếp trước khi gọi API bên thứ ba, tại sao đoạn tối ưu khó đọc này lại cần thiết (kèm số đo). Comment mô tả lại code sẽ lỗi thời ngay lần refactor đầu tiên và trở thành thông tin sai lệch."],"example":"// Đúng: Optional cho kiểu trả về\npublic Optional<User> findByEmail(String email) { ... }\n\n// Dùng đúng: chuỗi hàm, không isPresent + get\nString name = findByEmail(email)\n        .map(User::getName)\n        .filter(n -> !n.isBlank())\n        .orElse(\"anonymous\");\n\n// Bẫy hiệu năng: orElse luôn tính đối số\nUser u1 = findByEmail(e).orElse(loadDefaultUser());       // luôn chạy loadDefaultUser()\nUser u2 = findByEmail(e).orElseGet(() -> loadDefaultUser()); // chỉ chạy khi rỗng\n\n// Sai: Optional làm field và làm tham số\npublic class Bad {\n    private Optional<String> nickname;                    // không Serializable\n    public void update(Optional<String> note) { ... }     // ép caller bọc lại\n}\n\n// Sai: Optional cho collection\npublic Optional<List<Item>> getItems();                   // hãy trả List rỗng\npublic List<Item> getItems();                             // đúng","exampleTitle":"Optional dùng đúng chỗ và các bẫy đi kèm","keyPoints":["Optional được thiết kế cho kiểu trả về của method, không phải cho field hay tham số.","Không trả Optional cho collection — collection rỗng đã diễn đạt đủ ý 'không có gì'.","isPresent() + get() không hơn gì kiểm tra null; hãy dùng map/filter/orElseGet/orElseThrow.","orElse luôn tính đối số kể cả khi không cần; dùng orElseGet cho giá trị đắt tiền.","Tên nói ý định chứ không nói cơ chế; comment nên giải thích vì sao chứ không mô tả lại code."],"trap":"Dùng Optional làm field của entity JPA hoặc DTO. Nó không Serializable, gây rắc rối với Jackson và Hibernate, và thêm một lớp object cho mỗi instance — đây là lỗi thiết kế mà người phỏng vấn rất hay dùng để kiểm tra xem ứng viên có hiểu ý đồ của Optional hay chỉ đang dùng theo trào lưu.","followUp":["Vì sao orElse(expensiveCall()) có thể làm chậm code dù giá trị luôn có mặt?","Optional có phải là cách thay thế hoàn toàn cho null không?","Khi nào trả về null vẫn là lựa chọn hợp lý?"]},{"id":"t-20-5","topicId":20,"versions":[8,11,17,21],"title":"Log, xử lý lỗi ở biên, code review và YAGNI","summary":"Những thói quen quyết định việc bạn có debug được sự cố lúc 2 giờ sáng hay không, và vì sao kiến trúc thừa đắt hơn kiến trúc thiếu.","sections":["<b>Log có cấu trúc thay vì log thành câu văn.</b> Trong hệ thống phân tán, log chỉ có giá trị khi <i>truy vấn được</i>. Log dạng JSON với các trường cố định (<code>traceId</code>, <code>userId</code>, <code>orderId</code>, <code>durationMs</code>) cho phép lọc và tổng hợp; câu văn tự do thì chỉ grep được. MDC của SLF4J là cách chuẩn để gắn <code>traceId</code> vào mọi dòng log trong cùng một request — nhớ xoá MDC ở cuối request vì thread pool tái sử dụng thread, đúng vấn đề như ThreadLocal.","<b>Dùng placeholder, không nối chuỗi.</b> <code>log.debug(\"user={} order={}\", u, o)</code> chỉ định dạng chuỗi khi mức debug đang bật; <code>log.debug(\"user=\" + u)</code> thì phép nối chuỗi (và <code>toString()</code>) luôn chạy dù dòng log bị bỏ qua. Trong đường dẫn nóng, khác biệt này đo được. Với đối số thực sự đắt, hãy dùng dạng lambda của SLF4J 2.x hoặc kiểm tra <code>isDebugEnabled()</code>.","<b>Không bao giờ log dữ liệu nhạy cảm.</b> Mật khẩu, token, số thẻ, CCCD, thông tin y tế — log thường được gửi tới hệ thống tập trung mà rất nhiều người truy cập được, và giữ hàng tháng. Đừng log nguyên object request; hãy viết <code>toString()</code> có che dữ liệu, và cẩn thận với việc để dữ liệu nhạy cảm lọt vào <i>message của exception</i>, vì message đó sẽ đi vào log cùng stack trace.","<b>Xử lý lỗi tập trung ở biên.</b> Mỗi hệ thống nên có đúng một nơi biến exception thành phản hồi cho thế giới bên ngoài: <code>@RestControllerAdvice</code> cho HTTP, một wrapper cho message consumer, vòng lặp chính cho batch job. Ở đó bạn ánh xạ exception sang mã lỗi, log đầy đủ kèm stack trace, và trả về một thông điệp <i>không lộ chi tiết nội bộ</i> — tuyệt đối không trả stack trace ra client. Các tầng bên dưới thì để exception bay lên, không try-catch rải rác.","<b>YAGNI và cái giá của over-engineering.</b> Một tầng trừu tượng thêm vào 'phòng khi sau này đổi database' là code phải đọc, phải test, phải bảo trì ngay hôm nay để đổi lấy một lợi ích có thể không bao giờ tới. Trong thực tế, sự trừu tượng đoán trước thường sai vì bạn chưa biết yêu cầu thật. Trừu tượng tốt nhất được <i>rút ra</i> khi đã có hai hoặc ba trường hợp cụ thể, chứ không được <i>đoán</i> từ trước. Nguyên tắc thực dụng: viết đơn giản nhất có thể chạy đúng, refactor khi yêu cầu thứ hai xuất hiện.","<b>Code review là công cụ chia sẻ hiểu biết, không phải cổng kiểm duyệt.</b> PR nhỏ (dưới ~400 dòng) được review kỹ hơn hẳn PR khổng lồ vốn chỉ nhận được 'LGTM'. Người review nên tách rõ ý kiến bắt buộc sửa với ý kiến gợi ý (quy ước <i>nit:</i> rất hữu ích), bình luận về code chứ không về người, và luôn nói cả lý do. Mọi thứ máy làm được — format, import thừa, quy tắc đặt tên — hãy để cho formatter và linter trong CI, để con người dành thời gian cho thứ máy không thấy được: tính đúng đắn, các trường hợp biên, và thiết kế."],"example":"// Log: placeholder + MDC, và dọn MDC vì thread được tái sử dụng\ntry {\n    MDC.put(\"traceId\", traceId);\n    MDC.put(\"orderId\", order.getId());\n    log.info(\"order accepted amount={} currency={}\", order.getAmount(), order.getCurrency());\n} finally {\n    MDC.clear();\n}\n\n// Sai: nối chuỗi luôn chạy, và làm lộ dữ liệu nhạy cảm\n// log.debug(\"login request: \" + request);   // request chứa password\n\n// Đúng: che dữ liệu trong toString\n@Override\npublic String toString() {\n    return \"LoginRequest{user=\" + username + \", password=***}\";\n}\n\n// Xử lý lỗi tập trung ở biên HTTP\n@RestControllerAdvice\nclass ApiExceptionHandler {\n\n    @ExceptionHandler(InsufficientStockException.class)\n    ResponseEntity<ApiError> onStock(InsufficientStockException e) {\n        log.warn(\"insufficient stock sku={}\", e.getSku());          // log đủ để điều tra\n        return ResponseEntity.status(409)\n                .body(new ApiError(\"OUT_OF_STOCK\", \"Sản phẩm không đủ tồn kho\"));\n    }\n\n    @ExceptionHandler(Exception.class)\n    ResponseEntity<ApiError> onUnexpected(Exception e) {\n        log.error(\"unhandled error\", e);                            // stack trace vào log\n        return ResponseEntity.status(500)\n                .body(new ApiError(\"INTERNAL\", \"Đã có lỗi xảy ra\")); // không lộ ra client\n    }\n}","exampleTitle":"Log an toàn và một điểm xử lý lỗi duy nhất","keyPoints":["Log có cấu trúc với traceId/MDC mới truy vấn được; nhớ MDC.clear() vì thread pool tái sử dụng thread.","Dùng placeholder {} thay vì nối chuỗi để không trả chi phí khi mức log đang tắt.","Không log mật khẩu, token, dữ liệu cá nhân — kể cả gián tiếp qua message của exception.","Chuyển exception thành response tại đúng một nơi ở biên; không bao giờ trả stack trace ra client.","YAGNI: trừu tượng nên được rút ra từ hai ba trường hợp thật, không nên đoán trước."],"trap":"Bắt Exception ở mọi tầng để 'cho an toàn' rồi log ở từng tầng. Kết quả là một sự cố sinh ra năm dòng ERROR cho cùng một nguyên nhân, cảnh báo bị nhiễu, và không ai biết tầng nào thực sự đã xử lý lỗi. Log ở nơi xử lý, ném lên ở nơi không xử lý được.","followUp":["Vì sao cần MDC.clear() ở cuối request khi chạy trên thread pool?","Trả stack trace về client gây rủi ro bảo mật gì?","Làm sao phân biệt trừu tượng cần thiết với over-engineering khi review PR?"]}];
const DRILLS = [{"id":"d-1-1","topicId":1,"versions":[8,11,17,21],"difficulty":"beginner","question":"Đoạn code sau in ra gì?","code":"Integer a = 127, b = 127;\nInteger c = 128, d = 128;\nSystem.out.println((a == b) + \" \" + (c == d));","choices":["true true","true false","false true","false false"],"correctAnswer":1,"explanation":"In ra 'true false'. Autoboxing gọi Integer.valueOf(), và method này trả về object dùng lại từ cache đúc sẵn cho các giá trị -128..127, nên a và b là cùng một object và == cho true. Với 128 thì mỗi lần tạo một object mới nên == so sánh hai tham chiếu khác nhau và cho false. Quy tắc rút ra: == trên wrapper là so sánh tham chiếu, luôn dùng equals() hoặc so sánh trên kiểu nguyên thuỷ.","whyWrong":["Giá trị 128 nằm ngoài khoảng cache nên hai Integer là hai object khác nhau; == cho false chứ không phải true.","","127 nằm trong khoảng cache -128..127 nên a và b trỏ tới cùng một object; == cho true chứ không phải false.","Cả hai đều false chỉ đúng nếu Java không cache wrapper; thực tế Integer.valueOf dùng lại object cho mọi giá trị trong khoảng -128..127."]},{"id":"d-1-2","topicId":1,"versions":[8,11,17,21],"difficulty":"beginner","question":"Bốn dòng sau in ra lần lượt những giá trị nào?","code":"System.out.println(-7 / 2);\nSystem.out.println(-7 % 2);\nSystem.out.println(Math.floorDiv(-7, 2));\nSystem.out.println(Math.floorMod(-7, 2));","choices":["-4, 1, -4, 1","-3, 1, -4, 1","-3, -1, -4, 1","-4, -1, -3, -1"],"correctAnswer":2,"explanation":"Kết quả là -3, -1, -4, 1. Phép chia số nguyên của Java cắt phần thập phân về phía 0 nên -7/2 = -3, và phần dư luôn mang dấu của số bị chia nên -7%2 = -1. Math.floorDiv làm tròn xuống (về phía âm vô cực) nên cho -4, còn Math.floorMod cho kết quả cùng dấu với số chia nên cho 1. Trong thực tế điều này quan trọng khi băm: hash % numShards có thể ra số âm và làm vỡ chỉ số mảng, còn Math.floorMod thì luôn không âm khi số chia dương.","whyWrong":["Phép chia nguyên cắt về phía 0 nên -7/2 là -3; chỉ Math.floorDiv mới làm tròn xuống thành -4.","Toán tử % trong Java trả phần dư mang dấu của số bị chia nên -7%2 là -1; giá trị 1 là kết quả của Math.floorMod.","","Cả hai method Math đều bị hiểu sai: floorDiv làm tròn xuống nên là -4, còn floorMod luôn trả kết quả không âm khi số chia dương nên là 1."]},{"id":"d-1-3","topicId":1,"versions":[8,11,17,21],"difficulty":"beginner","question":"Hai dòng sau in ra gì?","code":"System.out.println(0.1 + 0.2);\nSystem.out.println(0.1 + 0.2 == 0.3);","choices":["0.30000000000000004 và false","0.3 và true","0.30000000000000004 và true","0.3 và false"],"correctAnswer":0,"explanation":"In ra 0.30000000000000004 rồi false. double tuân theo IEEE 754 và lưu số theo cơ số 2, mà 0.1 và 0.2 đều không biểu diễn hết được trong hệ nhị phân nên giá trị thật là xấp xỉ gần nhất; sai số của hai xấp xỉ cộng lại vượt qua ngưỡng làm tròn nên kết quả lệch khỏi 0.3 ở chữ số cuối. Vì thế không bao giờ so sánh số thực bằng ==; hãy so sánh sai số Math.abs(a-b) < epsilon, và dùng BigDecimal hoặc số nguyên đơn vị nhỏ nhất cho tiền tệ.","whyWrong":["","Nếu 0.1 + 0.2 ra đúng 0.3 thì phép so sánh mới cho true; thực tế phép cộng nhị phân để lại sai số ở chữ số thứ 17.","Giá trị in ra đúng là 0.30000000000000004, nhưng chính vì nó khác 0.3 nên phép so sánh cho false chứ không phải true.","Phép so sánh đúng là false, nhưng giá trị in ra không phải 0.3: println của double in đủ số chữ số cần thiết để phân biệt giá trị nên hiện ra 0.30000000000000004."]},{"id":"d-1-4","topicId":1,"versions":[8,11,17,21],"difficulty":"intermediate","question":"Đoạn code tính số mili giây trong 30 ngày. Nó in ra gì?","code":"long millis = 1000 * 60 * 60 * 24 * 30;\nSystem.out.println(millis);","choices":["2592000000","-1702967296","Lỗi biên dịch vì giá trị vượt quá phạm vi kiểu int","0"],"correctAnswer":1,"explanation":"In ra -1702967296. Kiểu của một biểu thức do các toán hạng quyết định chứ không phải do kiểu của biến đích, mà cả năm literal đều là int nên toàn bộ phép nhân diễn ra trong 32 bit. Kết quả đúng 2592000000 vượt Integer.MAX_VALUE nên bị quấn vòng theo modulo 2^32 rồi mới được mở rộng lên long — việc gán vào long xảy ra sau khi đã mất bit. Cách sửa là để một toán hạng là long: 1000L * 60 * 60 * 24 * 30.","whyWrong":["Đây là kết quả toán học đúng, nhưng chỉ đạt được nếu phép nhân được thực hiện ở kiểu long; ở đây nó chạy hoàn toàn trong int và đã tràn.","","Compiler chỉ báo lỗi khi một literal đơn lẻ vượt phạm vi int; tràn số trong lúc tính toán là hành vi hợp lệ được đặc tả, không phải lỗi biên dịch.","Tràn số là phép lấy modulo 2^32 rồi diễn giải lại theo bù hai, không phải là cắt về 0."]},{"id":"d-1-5","topicId":1,"versions":[8,11,17,21],"difficulty":"intermediate","question":"Sau khi chạy đoạn code, x và y có giá trị bao nhiêu?","code":"int x = 5;\nint y = x++ + ++x;\nSystem.out.println(x + \" \" + y);","choices":["x = 7, y = 11","x = 6, y = 12","x = 7, y = 12","x = 7, y = 13"],"correctAnswer":2,"explanation":"In ra '7 12'. Java quy định toán hạng trái được đánh giá hoàn toàn, kể cả hiệu ứng phụ, trước toán hạng phải — khác với C/C++ nơi thứ tự này là undefined. Vậy x++ trả về 5 rồi đẩy x lên 6; tiếp theo ++x đẩy x lên 7 rồi trả về 7; tổng là 5 + 7 = 12 và x còn lại 7. Chính vì thứ tự được đặc tả chặt nên biểu thức này có một kết quả duy nhất trên mọi JVM và trở thành câu hỏi phỏng vấn quen thuộc.","whyWrong":["Giá trị 11 xuất hiện nếu ++x được cho là trả về 6, nhưng x đã bị x++ đẩy lên 6 từ trước nên ++x cho 7.","x bị tăng hai lần nên kết thúc ở 7 chứ không phải 6.","","Giá trị 13 tương ứng với 6 + 7, tức là hiểu nhầm rằng x++ trả về giá trị sau khi tăng; hậu tố trả về giá trị cũ."]},{"id":"d-1-6","topicId":1,"versions":[8,11,17,21],"difficulty":"intermediate","question":"Đoạn code sau xảy ra chuyện gì khi chạy?","code":"Map<String, Integer> counts = new HashMap<>();\ncounts.put(\"a\", 1);\nint n = counts.get(\"missing\");\nSystem.out.println(n);","choices":["In ra 0","In ra null","Ném NullPointerException","Lỗi biên dịch vì không thể gán Integer cho int"],"correctAnswer":2,"explanation":"Ném NullPointerException ngay tại dòng gán. HashMap.get trả về null cho key không tồn tại, và vì biến đích là int nên compiler chèn thêm lời gọi intValue() để unbox — gọi method trên null chính là NPE. Điều gây khó chịu là stack trace chỉ vào dòng gán chứ không nhắc gì tới map nên người mới hay tìm sai chỗ. Cách phòng chuẩn là counts.getOrDefault(\"missing\", 0), hoặc giữ kiểu Integer và kiểm tra null tường minh.","whyWrong":["int có giá trị mặc định 0 khi nó là field, nhưng ở đây giá trị đến từ map; unbox null không cho 0 mà ném exception.","Biến n có kiểu int nên không bao giờ giữ được null; phép unbox xảy ra trước khi có gì để in.","","Phép gán này biên dịch hoàn toàn bình thường vì Java tự động unboxing từ Integer sang int; lỗi chỉ lộ ra lúc chạy."]},{"id":"d-1-7","topicId":1,"versions":[8,11,17,21],"difficulty":"intermediate","question":"Đoạn code sau chạy ra sao?","code":"int[] data = null;\nif (data != null & data.length > 0) {\n    System.out.println(\"có dữ liệu\");\n} else {\n    System.out.println(\"rỗng\");\n}","choices":["In ra rỗng","Ném NullPointerException","Lỗi biên dịch vì & không dùng được cho boolean","In ra có dữ liệu"],"correctAnswer":1,"explanation":"Ném NullPointerException. Trên toán hạng boolean, & là toán tử logic hợp lệ nhưng KHÔNG cắt ngắn: nó luôn đánh giá cả hai vế trước khi lấy kết quả AND. Vì thế data.length vẫn được thực thi dù vế trái đã cho false, và truy cập length trên tham chiếu null gây NPE. Chỉ && mới bảo đảm bỏ qua vế phải khi vế trái đã false — lỗi gõ thiếu một ký tự này rất khó phát hiện khi đọc lướt code.","whyWrong":["Nhánh else chỉ chạy được nếu biểu thức điều kiện tính xong; ở đây nó ném exception ngay khi đánh giá vế phải.","","& hoàn toàn hợp lệ với hai toán hạng boolean, khi đó nó là phép AND logic không cắt ngắn; với hai toán hạng số nguyên thì nó là phép AND bit.","Vế trái đã là false nên kết quả AND không thể là true; vấn đề nằm ở chỗ vế phải vẫn bị đánh giá."]},{"id":"d-1-8","topicId":1,"versions":[8,11,17,21],"difficulty":"advanced","question":"Đoạn code sau in ra gì?","code":"byte b = 10;\n// b = b + 300;   // dòng này KHÔNG biên dịch được\nb += 300;\nSystem.out.println(b);","choices":["310","Lỗi biên dịch vì 300 vượt phạm vi byte","54","127"],"correctAnswer":2,"explanation":"In ra 54. Toán tử gán rút gọn mang sẵn một phép ép kiểu ngầm về kiểu của vế trái, nên b += 300 tương đương b = (byte)(b + 300). Phép cộng được thực hiện ở kiểu int cho 310, sau đó ép về byte chỉ giữ lại 8 bit thấp: 310 - 256 = 54, vẫn nhỏ hơn 128 nên giá trị cuối là 54. Đây là lý do b = b + 300 báo lỗi biên dịch còn b += 300 thì im lặng làm hỏng dữ liệu — hai cách viết trông tương đương nhưng không hề tương đương.","whyWrong":["byte chỉ chứa được -128..127 nên không thể giữ 310; giá trị bị cắt còn 8 bit thấp.","Chính vì += có ép kiểu ngầm nên dòng này biên dịch bình thường; chỉ dạng b = b + 300 mới bị compiler từ chối.","","Java không kẹp giá trị về biên (saturating) khi ép kiểu; nó cắt bit, nên kết quả không phải là giá trị lớn nhất của byte."]},{"id":"d-1-9","topicId":1,"versions":[8,11,17,21],"difficulty":"advanced","question":"Đoạn code so sánh hai BigDecimal in ra gì?","code":"BigDecimal a = new BigDecimal(\"2.0\");\nBigDecimal b = new BigDecimal(\"2.00\");\nSystem.out.println(a.equals(b));\nSystem.out.println(a.compareTo(b) == 0);","choices":["true / true","true / false","false / false","false / true"],"correctAnswer":3,"explanation":"In ra false rồi true. BigDecimal lưu một số nguyên không dấu cùng với scale, và equals() so sánh cả hai thành phần nên 2.0 (scale 1) không equals 2.00 (scale 2) dù giá trị số học bằng nhau; compareTo chỉ so giá trị nên cho 0. Hệ quả thực tế rất nghiêm trọng: đặt BigDecimal làm key của HashMap hoặc vào HashSet sẽ khiến hai số bằng nhau về giá trị bị coi là hai phần tử khác nhau. Quy tắc: luôn dùng compareTo() == 0 để so tiền, và cân nhắc stripTrailingZeros hoặc setScale trước khi lưu.","whyWrong":["equals của BigDecimal cố tình so cả scale để phân biệt 2.0 với 2.00 về mặt độ chính xác, nên nó trả về false.","compareTo so sánh thuần giá trị số học và bỏ qua scale, nên với 2.0 và 2.00 nó trả về 0 chứ không phải khác 0.","Nếu cả hai đều false thì BigDecimal sẽ không dùng được để so sánh giá trị; thực tế compareTo là cách đúng và cho kết quả bằng nhau.",""]},{"id":"d-2-1","topicId":2,"versions":[8,11,17,21],"difficulty":"beginner","question":"Đoạn code sau in ra gì?","code":"class Parent {\n    static String who() { return \"Parent\"; }\n}\nclass Child extends Parent {\n    static String who() { return \"Child\"; }\n}\n\nParent p = new Child();\nSystem.out.println(p.who());","choices":["Child","Parent","Lỗi biên dịch vì static method không được khai báo lại ở class con","Ném exception lúc chạy vì lời gọi mơ hồ"],"correctAnswer":1,"explanation":"In ra 'Parent'. static method không được override mà chỉ bị che (method hiding): hai method tồn tại song song và việc chọn dựa hoàn toàn vào kiểu khai báo của tham chiếu lúc biên dịch. Về bytecode, lời gọi được dịch thành invokestatic với tên class đã ghi cố định, còn instance method mới dùng invokevirtual và tra bảng method ảo theo object thật. Vì cách viết này gây hiểu nhầm, quy tắc thực hành là luôn gọi static method qua tên class: Parent.who().","whyWrong":["Đây là kết quả nếu who() là instance method được override; static method không tham gia dynamic dispatch nên object thật là Child không ảnh hưởng gì.","","Khai báo lại static method ở class con là hợp lệ và được gọi là hiding; compiler chỉ báo lỗi nếu kiểu trả về không tương thích.","Không có sự mơ hồ nào: compiler đã quyết định xong bản nào được gọi ngay lúc biên dịch."]},{"id":"d-2-2","topicId":2,"versions":[8,11,17,21],"difficulty":"beginner","question":"Vì sao Java cho một class implements nhiều interface nhưng chỉ extends được đúng một class?","choices":["Vì JVM chỉ cấp phát được một vùng nhớ liên tục cho object nên không chứa nổi hai phần class cha","Vì interface được nạp lúc runtime còn class được nạp lúc biên dịch nên không xung đột","Vì interface không có field instance và (trước Java 8) không có thân method, nên đa kế thừa interface không sinh ra mơ hồ về state hay hành vi; còn đa kế thừa class dẫn tới diamond problem","Vì đây chỉ là hạn chế tạm thời của JVM, các phiên bản sau sẽ mở đa kế thừa class như C++"],"correctAnswer":2,"explanation":"Java cho đa kế thừa kiểu chứ không cho đa kế thừa state và cài đặt. Với diamond problem, nếu D kế thừa B và C mà cả hai cùng kế thừa A, thì không có quy tắc tự nhiên nào chọn bản method nào, và tệ hơn là không rõ D chứa một hay hai bản sao field của A; C++ phải thêm virtual inheritance chỉ để trả lời câu hỏi đó. Interface không có field instance nên vấn đề không tồn tại. Cần nói thêm cho đủ: từ Java 8, default method mang xung đột hành vi quay lại, và Java xử lý bằng cách bắt compiler báo lỗi buộc class phải override, giải bằng Interface.super.method().","whyWrong":["Bố cục bộ nhớ không phải trở ngại: C++ vẫn làm được đa kế thừa. Đây là quyết định thiết kế ngôn ngữ chứ không phải giới hạn cấp phát.","Cả class lẫn interface đều được nạp lúc runtime bởi class loader; thời điểm nạp không liên quan gì tới câu hỏi.","","Đây là lựa chọn thiết kế cố ý và ổn định từ đầu, không phải hạn chế tạm thời; Java 8 chỉ nới về hành vi qua default method chứ không mở đa kế thừa state."]},{"id":"d-2-3","topicId":2,"versions":[8,11,17,21],"difficulty":"beginner","question":"Class cha có method như trong đoạn code. Khai báo nào ở class con là một override HỢP LỆ?","code":"class Parent {\n    protected Number calc() throws java.io.IOException {\n        return 1;\n    }\n}","choices":["private Integer calc() throws java.io.IOException","public Object calc()","public Number calc() throws Exception","public Integer calc() throws java.io.FileNotFoundException"],"correctAnswer":3,"explanation":"Chỉ phương án cuối hợp lệ: nó mở rộng access từ protected lên public (được phép), trả về Integer là kiểu con của Number nên hợp lệ theo covariant return (có từ Java 5), và ném FileNotFoundException là class con của IOException nên hẹp hơn bản cha. Ba ràng buộc này đều phục vụ nguyên lý Liskov: mọi chỗ đang dùng Parent phải dùng được class con mà không phải sửa code gọi. Vì thế thu hẹp access, nới rộng checked exception, hay nới rộng kiểu trả về đều bị compiler từ chối.","whyWrong":["Bản override không được thu hẹp access modifier; từ protected xuống private sẽ khiến code đang gọi qua tham chiếu Parent không dùng được nữa.","Kiểu trả về chỉ được thu hẹp chứ không được nới rộng; caller đang mong nhận Number sẽ vỡ nếu nhận về Object.","Bản override không được ném checked exception mới hoặc rộng hơn bản cha; Exception rộng hơn IOException nên code gọi cũ sẽ không xử lý hết.",""]},{"id":"d-2-4","topicId":2,"versions":[8,11,17,21],"difficulty":"intermediate","question":"Hai lời gọi print() in ra gì?","code":"static void print(Object o) { System.out.println(\"Object\"); }\nstatic void print(String s) { System.out.println(\"String\"); }\n\nObject o = \"abc\";\nprint(o);\nprint(\"abc\");","choices":["String / String","Object / String","Object / Object","String / Object"],"correctAnswer":1,"explanation":"In ra 'Object' rồi 'String'. Overload resolution xảy ra hoàn toàn lúc biên dịch và dựa vào kiểu khai báo của biểu thức đối số, không phải kiểu thật của giá trị: biến o được khai báo Object nên compiler ghi cứng lời gọi tới print(Object), dù runtime giá trị là String. Lời gọi thứ hai có đối số là literal kiểu String nên compiler chọn bản cụ thể hơn. Rút ra: overloading là static binding, chỉ overriding mới là dynamic binding — và vì thế nhiều overload có kiểu tham số gần nhau là một nguồn nhầm lẫn nên tránh khi thiết kế API.","whyWrong":["Lời gọi đầu đi qua biến khai báo kiểu Object nên compiler không thể và không được phép nhìn vào giá trị thật để chọn print(String).","","Lời gọi thứ hai có đối số là literal String, và khi có nhiều bản khả dụng compiler luôn chọn bản cụ thể nhất, tức print(String).","Cả hai kết quả đều bị đảo: đây là hiểu nhầm rằng overload được chọn theo kiểu thật lúc runtime."]},{"id":"d-2-5","topicId":2,"versions":[8,11,17,21],"difficulty":"intermediate","question":"Đoạn code sau in ra hai dòng nào?","code":"class Animal {\n    String name = \"Animal\";\n    String describe() { return \"tôi là \" + name; }\n}\nclass Dog extends Animal {\n    String name = \"Dog\";\n    @Override String describe() { return \"tôi là \" + name; }\n}\n\nAnimal a = new Dog();\nSystem.out.println(a.name);\nSystem.out.println(a.describe());","choices":["Animal / tôi là Dog","Dog / tôi là Dog","Animal / tôi là Animal","Dog / tôi là Animal"],"correctAnswer":0,"explanation":"In ra 'Animal' rồi 'tôi là Dog'. Field không đa hình: truy cập field được giải quyết lúc biên dịch theo kiểu khai báo của tham chiếu, mà a được khai báo Animal nên a.name đọc field của Animal. Ngược lại describe() là instance method được override nên JVM tra bảng method ảo theo object thật và chạy bản của Dog, bản này đọc field name của Dog. Điểm cốt lõi: object thật chứa CẢ HAI field name, chúng không đè lên nhau — đó là lý do vì sao nên luôn để field private và chỉ truy cập qua method.","whyWrong":["","a.name không lấy field của Dog vì truy cập field đi theo kiểu khai báo Animal, không theo kiểu thật.","describe() được override nên bản của Dog chạy và đọc field name của Dog; đây không phải trường hợp method bị hide.","Cả hai vế đều bị đảo: field mới là thứ đi theo kiểu khai báo, còn method đi theo kiểu thật."]},{"id":"d-2-6","topicId":2,"versions":[8,11,17,21],"difficulty":"intermediate","question":"Dòng new Child(); dẫn tới kết quả gì?","code":"class Base {\n    Base() { init(); }\n    void init() { }\n}\nclass Child extends Base {\n    private String value = \"hello\";\n    @Override void init() { System.out.println(value.length()); }\n}\n\nnew Child();","choices":["In ra 5","Ném NullPointerException","In ra 0","Lỗi biên dịch vì không được gọi method có thể override trong constructor"],"correctAnswer":1,"explanation":"Ném NullPointerException. Trình tự khởi tạo là: constructor của Child gọi super() trước, constructor của Base chạy và gọi init(); vì init() bị override nên dynamic dispatch chạy bản của Child — nhưng lúc này các field initializer của Child CHƯA chạy, nên value vẫn là null và value.length() ném NPE. Đây là lý do quy tắc 'không gọi method có thể override từ constructor' tồn tại; nếu bắt buộc phải gọi thì khai báo method đó final, private hoặc static, hoặc tách logic ra một init() gọi sau khi object đã dựng xong.","whyWrong":["Giá trị \"hello\" chỉ được gán sau khi constructor của Base chạy xong, nên tại thời điểm init() được gọi field vẫn chưa có giá trị.","","value là kiểu tham chiếu nên mặc định là null chứ không phải chuỗi rỗng; không có cách nào để length() trả về 0 ở đây.","Compiler không cấm gọi method overridable trong constructor; nó chỉ là một cảnh báo về thiết kế mà nhiều công cụ static analysis nêu ra."]},{"id":"d-2-7","topicId":2,"versions":[8,11,17,21],"difficulty":"intermediate","question":"Chạy new Child(); một lần, chương trình in ra chuỗi nào?","code":"class Parent {\n    static { System.out.print(\"1\"); }\n    { System.out.print(\"2\"); }\n    Parent() { System.out.print(\"3\"); }\n}\nclass Child extends Parent {\n    static { System.out.print(\"4\"); }\n    { System.out.print(\"5\"); }\n    Child() { System.out.print(\"6\"); }\n}\n\nnew Child();","choices":["123456","412356","142356","145236"],"correctAnswer":2,"explanation":"In ra 142356. Trước hết class được khởi tạo: JVM khởi tạo superclass trước nên static block của Parent chạy ('1') rồi tới của Child ('4'); phần này chỉ chạy đúng một lần cho toàn bộ vòng đời class. Sau đó tới khởi tạo instance: constructor của Child ngầm gọi super() nên toàn bộ chuỗi của Parent hoàn tất trước — instance initializer '2' rồi thân constructor '3'; cuối cùng mới tới instance initializer của Child '5' và thân constructor '6'. Trật tự cần nhớ là: super() -> instance/field initializer của lớp hiện tại theo thứ tự khai báo -> thân constructor.","whyWrong":["Đây là thứ tự nếu static block chạy xen kẽ theo từng class ngay trước constructor tương ứng; thực tế mọi static block đều chạy xong trước khi có object đầu tiên.","Static block của Parent chạy trước của Child vì JVM luôn khởi tạo superclass trước.","","Instance initializer của Child không thể chạy trước constructor của Parent; lời gọi super() luôn hoàn tất trước khi phần thân của class con bắt đầu."]},{"id":"d-2-8","topicId":2,"versions":[8,11,17,21],"difficulty":"advanced","question":"Chuyện gì xảy ra với đoạn code sau?","code":"interface Flyer   { default String move() { return \"bay\"; } }\ninterface Swimmer { default String move() { return \"bơi\"; } }\n\nclass Duck implements Flyer, Swimmer { }\n\nSystem.out.println(new Duck().move());","choices":["Biên dịch được, Duck lấy bản của Flyer vì interface này được liệt kê trước","Biên dịch được nhưng ném exception lúc chạy vì lời gọi mơ hồ","Lỗi biên dịch: Duck buộc phải override move(), và trong bản override có thể chọn bản cha bằng Flyer.super.move()","Biên dịch được, JVM chọn bản của interface được class loader nạp trước"],"correctAnswer":2,"explanation":"Lỗi biên dịch với thông báo kiểu 'inherits unrelated defaults for move()'. Từ Java 8, default method mang thân hàm vào interface nên diamond problem về hành vi quay trở lại; Java xử lý bằng cách từ chối đoán thay lập trình viên và bắt class phải override để chọn tường minh, bên trong có thể ủy quyền bằng Flyer.super.move() hoặc Swimmer.super.move(). Lưu ý hai quy tắc ưu tiên liên quan: method kế thừa từ superclass luôn thắng default method của interface ('class wins'), và giữa hai interface có quan hệ kế thừa thì bản của interface cụ thể hơn thắng, khi đó không có xung đột.","whyWrong":["Thứ tự liệt kê trong mệnh đề implements không có ý nghĩa ngữ nghĩa nào; Java cố tình không dùng nó để phá vỡ xung đột.","Xung đột được phát hiện hoàn toàn lúc biên dịch nên không thể tồn tại một chương trình chạy được rồi mới ném exception vì lý do này.","","Thứ tự nạp class là chi tiết cài đặt và không xác định; nếu ngữ nghĩa chương trình phụ thuộc vào nó thì kết quả sẽ không tất định, điều Java không cho phép."]},{"id":"d-2-9","topicId":2,"versions":[8,11,17,21],"difficulty":"advanced","question":"Dòng cuối in ra gì?","code":"class Point {\n    final int x, y;\n    Point(int x, int y) { this.x = x; this.y = y; }\n\n    public boolean equals(Point p) {\n        return p.x == x && p.y == y;\n    }\n}\n\nSet<Point> set = new HashSet<>();\nset.add(new Point(1, 1));\nSystem.out.println(set.contains(new Point(1, 1)));","choices":["true","false","Lỗi biên dịch vì override equals mà không override hashCode","true, nhưng chỉ khi thêm @Override lên equals"],"correctAnswer":1,"explanation":"In ra false, và có hai tầng nguyên nhân. Tầng thứ nhất: equals(Point) là một OVERLOAD chứ không phải override, vì Object.equals nhận tham số kiểu Object; mọi collection gọi qua equals(Object) nên rơi về so sánh tham chiếu mặc định của Object. Tầng thứ hai: hashCode cũng không được override, mà HashSet dùng hashCode để chọn bucket trước rồi mới so equals, nên hai object khác identity hash gần như chắc chắn rơi vào bucket khác nhau và không bao giờ được đem ra so. Cách sửa là đổi tham số thành Object, thêm @Override để compiler bắt lỗi chữ ký, và override hashCode bằng Objects.hash(x, y) — hoặc dùng record từ Java 16 trở đi để trình biên dịch tự sinh cả hai.","whyWrong":["Kết quả true chỉ đạt được khi cả equals(Object) lẫn hashCode đều được override đúng; ở đây không có cái nào được override.","","Việc override equals mà quên hashCode chỉ là một cảnh báo của công cụ phân tích tĩnh, không phải lỗi biên dịch; ngoài ra ở đây equals còn chưa được override.","Thêm @Override vào equals(Point) sẽ khiến code KHÔNG biên dịch được, vì đó không phải override — đúng ra phải đổi tham số thành Object và bổ sung hashCode."]},{"id":"d-3-1","topicId":3,"versions":[8,11,17,21],"difficulty":"beginner","question":"Đoạn code sau in ra gì?","code":"List<String> list = Arrays.asList(\"a\", \"b\", \"c\");\nlist.set(0, \"z\");\nlist.add(\"d\");\nSystem.out.println(list);","choices":["In ra [z, b, c, d]","In ra [a, b, c, d]","Ném UnsupportedOperationException tại list.add(\"d\")","Ném UnsupportedOperationException ngay tại list.set(0, \"z\")"],"correctAnswer":2,"explanation":"Arrays.asList không trả về java.util.ArrayList mà trả về lớp nội bộ java.util.Arrays$ArrayList — một view cố định kích thước bọc quanh mảng gốc. set() được hỗ trợ vì nó chỉ ghi đè một ô của mảng nền mà không đổi kích thước, nên dòng thứ hai chạy trót lọt. add() thì làm đổi kích thước nên rơi vào cài đặt mặc định của AbstractList và ném UnsupportedOperationException, chương trình dừng trước khi kịp in. Muốn có list thay đổi được thì bọc lại: new ArrayList<>(Arrays.asList(...)).","whyWrong":["Chương trình không in được gì vì add() ném exception trước dòng println.","Sai ở cả hai chỗ: set() thực sự có hiệu lực nên phần tử đầu là z, và add() không bao giờ thành công.","","set() hoàn toàn hợp lệ trên view của Arrays.asList vì nó chỉ ghi vào mảng nền, không đổi kích thước."]},{"id":"d-3-2","topicId":3,"versions":[8,11,17,21],"difficulty":"beginner","question":"Đoạn code sau in ra gì?","code":"List<Integer> list = new ArrayList<>(Arrays.asList(1, 2, 3));\nlist.remove(1);\nSystem.out.println(list);","choices":["[2, 3]","[1, 3]","[1, 2, 3]","Ném ClassCastException"],"correctAnswer":1,"explanation":"List có hai overload: remove(int index) và remove(Object o). Với literal 1 kiểu int, compiler chọn remove(int) vì nó khớp trực tiếp mà không cần autoboxing — quy tắc overload resolution chỉ xét boxing ở pha sau, khi không còn ứng viên nào khớp trực tiếp. Vì vậy phần tử ở chỉ số 1 (giá trị 2) bị xoá và kết quả là [1, 3]. Muốn xoá theo giá trị phải ép kiểu tường minh: list.remove(Integer.valueOf(1)) hoặc list.remove((Integer) 1).","whyWrong":["Đó là kết quả nếu remove(Object) được chọn, nhưng autoboxing chỉ được xét sau khi không còn overload nào khớp trực tiếp.","","remove(int) với chỉ số hợp lệ luôn xoá đúng một phần tử, list không thể giữ nguyên.","Không có phép ép kiểu sai nào ở đây; cả hai overload đều hợp lệ về kiểu, chỉ là compiler chọn bản int."]},{"id":"d-3-3","topicId":3,"versions":[8,11,17,21],"difficulty":"beginner","question":"Class P override equals nhưng không override hashCode. Đoạn code sau in ra gì?","code":"class P {\n    final String name;\n    P(String name) { this.name = name; }\n    @Override public boolean equals(Object o) {\n        return o instanceof P && ((P) o).name.equals(this.name);\n    }\n    // KHÔNG override hashCode()\n}\n\nSet<P> set = new HashSet<>();\nset.add(new P(\"an\"));\nset.add(new P(\"an\"));\nSystem.out.println(set.size());\nSystem.out.println(set.contains(new P(\"an\")));","choices":["1 rồi true","2 rồi true","2 rồi false","Không biên dịch được vì override equals mà không override hashCode"],"correctAnswer":2,"explanation":"Không override hashCode nên P dùng bản của Object, vốn dựa trên identity — hai instance khác nhau gần như chắc chắn cho hash khác nhau và rơi vào hai bucket khác nhau. HashSet luôn định vị bucket trước rồi mới gọi equals, nên nó không bao giờ chạm tới phần tử kia: set có 2 phần tử và contains trả false. Đây đúng là hệ quả của việc vi phạm hợp đồng 'equals bằng nhau thì hashCode phải bằng nhau'. (Về lý thuyết hai identity hash có thể vô tình rơi cùng bucket, nhưng đó là ngẫu nhiên và không thể trông cậy.)","whyWrong":["Đó là kết quả khi hashCode cũng được override theo name; ở đây thì không, nên hai object không bao giờ gặp nhau.","contains chỉ trả true khi tìm đúng bucket rồi equals khớp; ở đây bucket đã sai ngay từ bước đầu.","","Compiler không bắt buộc override song song — hầu hết chỉ là cảnh báo của IDE. Đây là lỗi logic lúc chạy, không phải lỗi biên dịch."]},{"id":"d-3-4","topicId":3,"versions":[8,11,17,21],"difficulty":"intermediate","question":"Đoạn code sau in ra gì?","code":"class Box {\n    int v;\n    Box(int v) { this.v = v; }\n    @Override public boolean equals(Object o) {\n        return o instanceof Box && ((Box) o).v == this.v;\n    }\n    @Override public int hashCode() { return v; }\n}\n\nSet<Box> set = new HashSet<>();\nBox b = new Box(1);\nset.add(b);\nb.v = 99;\n\nSystem.out.println(set.contains(b));\nSystem.out.println(set.contains(new Box(1)));\nSystem.out.println(set.size());","choices":["true, false, 1","false, true, 1","false, false, 1","false, false, 0"],"correctAnswer":2,"explanation":"HashSet dựng trên HashMap và HashMap lưu sẵn giá trị hash của key trong node lúc put. Sau khi đổi b.v thành 99, contains(b) tính hash mới nên đi tìm ở bucket của 99, còn node vẫn nằm ở bucket của 1 — trả false. contains(new Box(1)) tìm đúng bucket của 1 và gặp node chứa b, nhưng equals so 99 với 1 nên cũng false. size vẫn là 1 vì không có gì bị xoá: phần tử đó kẹt lại trong set, không tìm được và cũng không remove được. Quy tắc rút ra: mọi field tham gia hashCode phải bất biến sau khi object được đưa vào collection băm.","whyWrong":["contains(b) không thể true: hash của b đã đổi nên nó tìm sang bucket khác chỗ node đang nằm.","contains(new Box(1)) tìm đúng bucket nhưng equals so v=99 với v=1 nên thất bại.","","Không thao tác nào xoá phần tử khỏi set, nên size vẫn là 1 — đây chính là phần 'rò rỉ' của bug này."]},{"id":"d-3-5","topicId":3,"versions":[8,11,17,21],"difficulty":"intermediate","question":"Đoạn code sau chạy ra sao?","code":"List<String> list = new ArrayList<>(Arrays.asList(\"a\", \"b\", \"c\"));\nfor (String s : list) {\n    if (s.equals(\"b\")) list.remove(s);\n}\nSystem.out.println(list);","choices":["Ném ConcurrentModificationException","In [a, c] và không ném exception","In [a, b, c]","Ném UnsupportedOperationException"],"correctAnswer":1,"explanation":"Iterator của ArrayList chỉ kiểm tra modCount trong next(), còn hasNext() đơn thuần so cursor != size. Sau khi xoá \"b\", size giảm còn 2 đúng lúc cursor cũng bằng 2, nên hasNext() trả false và vòng lặp kết thúc trước khi next() kịp phát hiện modCount lệch. Đây là lý do câu 'xoá phần tử áp chót thì không ném CME' luôn đúng với ArrayList — và cũng là bằng chứng fail-fast chỉ là best-effort, không phải cơ chế đảm bảo. Đổi \"b\" thành \"a\" thì đúng là CME. Cách viết an toàn là Iterator.remove() hoặc list.removeIf(s -> s.equals(\"b\")).","whyWrong":["Sẽ ném nếu xoá phần tử khác, ví dụ \"a\"; nhưng với phần tử áp chót thì vòng lặp dừng trước khi next() kiểm tra modCount.","","Phần tử \"b\" thực sự bị xoá khỏi list, chỉ là vòng lặp kết thúc sớm hơn bình thường.","list được tạo bằng new ArrayList<>(...) nên hoàn toàn thay đổi được; Arrays.asList ở đây chỉ dùng làm nguồn sao chép."]},{"id":"d-3-6","topicId":3,"versions":[8,11,17,21],"difficulty":"intermediate","question":"Từ Java 8, một bucket của HashMap được chuyển từ danh sách liên kết sang cây đỏ-đen khi nào?","choices":["Ngay khi bucket đạt 8 node, không cần điều kiện nào khác","Khi tổng số phần tử trong map vượt 64","Khi size vượt threshold = capacity * 0.75","Khi bucket đạt 8 node VÀ độ dài bảng đã ít nhất 64; nếu bảng nhỏ hơn 64 thì HashMap resize thay vì treeify"],"correctAnswer":3,"explanation":"Java 8 đặt hai ngưỡng: số node trong một bucket phải đạt 8, và độ dài bảng phải đạt tối thiểu 64. Lý do của điều kiện thứ hai rất thực tế: khi bảng còn nhỏ, va chạm dồn đống thường là do bảng chật chứ không phải do hashCode xấu, nên nhân đôi bảng vừa rẻ hơn vừa giải quyết đúng nguyên nhân. Chỉ khi bảng đã đủ lớn mà một bucket vẫn dài thì mới đáng đổi sang cây đỏ-đen để hạ tra cứu từ O(k) xuống O(log k). Khi cây co lại còn khoảng 6 node, nó quay về danh sách liên kết.","whyWrong":["Thiếu điều kiện độ dài bảng; nếu bảng chưa đủ 64 ô, HashMap gọi resize() chứ không treeify.","Điều kiện 64 áp cho ĐỘ DÀI BẢNG chứ không phải tổng số phần tử trong map.","Vượt threshold kích hoạt resize (nhân đôi bảng), hoàn toàn không liên quan tới việc chuyển bucket thành cây.",""]},{"id":"d-3-7","topicId":3,"versions":[8,11,17,21],"difficulty":"intermediate","question":"Bạn cần chèn nhiều phần tử vào GIỮA một danh sách lớn rồi duyệt tuần tự nhiều lần. Nhận định nào đúng nhất về ArrayList so với LinkedList?","choices":["LinkedList chèn giữa vẫn phải duyệt tới vị trí nên là O(n); thêm nữa mỗi node là một object rời rạc phá cache CPU, nên thực tế ArrayList thường vẫn nhanh hơn dù phải dịch mảng","LinkedList luôn nhanh hơn vì chèn/xoá là O(1)","ArrayList không chèn được vào giữa, chỉ append được ở cuối","Hai cấu trúc tương đương vì cả hai đều là O(n)"],"correctAnswer":0,"explanation":"Con số O(1) của LinkedList chỉ đúng khi bạn ĐÃ cầm sẵn node, tức đang duyệt bằng ListIterator. Gọi list.add(i, x) hay list.get(i) vẫn phải đi từ đầu hoặc từ cuối tới vị trí i, nên tổng chi phí là O(n) và mỗi bước là một lần nhảy con trỏ tới object nằm rải rác trên heap — gần như luôn miss cache. ArrayList tuy phải dịch mảng nhưng làm bằng System.arraycopy, một intrinsic được JIT dịch thành lệnh copy khối trên vùng nhớ liên tục. Cộng thêm việc mỗi node LinkedList tốn khoảng 24-40 byte phụ và tạo áp lực GC, kết quả đo thực tế gần như luôn nghiêng về ArrayList. Cho hàng đợi hai đầu thì ArrayDeque còn tốt hơn LinkedList.","whyWrong":["","Đây là câu trả lời máy móc mà người phỏng vấn đang chờ để vặn lại: O(1) chỉ tính riêng thao tác nối lại con trỏ, chưa tính chi phí đi tới vị trí.","ArrayList có add(int index, E element) hoạt động bình thường, chỉ là phải dịch phần đuôi mảng.","Cùng ký hiệu Big-O không có nghĩa là cùng tốc độ; hằng số nhân và hành vi cache chênh nhau nhiều lần."]},{"id":"d-3-8","topicId":3,"versions":[8,11,17,21],"difficulty":"advanced","question":"So sánh ConcurrentHashMap (Java 8+) với Collections.synchronizedMap, phát biểu nào đúng?","choices":["ConcurrentHashMap cũng khoá toàn bộ map khi ghi giống synchronizedMap, chỉ khác ở chỗ iterator không ném ConcurrentModificationException","ConcurrentHashMap cho phép null key và null value, còn synchronizedMap thì không","ConcurrentHashMap khoá ở mức từng bucket (CAS khi bucket rỗng, synchronized trên node đầu bucket khi có va chạm), iterator weakly consistent nên không ném CME, và không chấp nhận null key lẫn null value","Cả hai đều biến chuỗi thao tác get-rồi-put thành nguyên tử"],"correctAnswer":2,"explanation":"Collections.synchronizedMap chỉ bọc một HashMap thường và đặt cùng một lock lên mọi method, nên mọi thread tranh nhau một điểm nghẽn duy nhất, và khi duyệt bạn vẫn phải tự synchronized trên đối tượng bọc. ConcurrentHashMap từ Java 8 bỏ cơ chế segment của Java 7, chuyển sang khoá mịn hơn: CAS để đặt node đầu tiên vào bucket rỗng, và synchronized trên chính node đầu bucket khi phải nối thêm — hai thread ghi vào hai bucket khác nhau hoàn toàn không chặn nhau. Nó cấm null vì trong môi trường không khoá, get() trả null sẽ không phân biệt được 'không có key' với 'giá trị là null', mà cũng không có cách kiểm tra lại một cách nguyên tử. Quan trọng nhất: từng method là nguyên tử nhưng chuỗi thao tác thì không — phải dùng putIfAbsent, computeIfAbsent, merge hoặc compute.","whyWrong":["ConcurrentHashMap không khoá toàn bộ map; đó chính là điểm khác biệt về hiệu năng lớn nhất so với synchronizedMap.","Ngược hoàn toàn: ConcurrentHashMap cấm null ở cả key lẫn value, còn synchronizedMap bọc HashMap nên vẫn cho phép.","","Không cấu trúc nào làm được điều đó. Chuỗi get-rồi-put là hai lời gọi riêng biệt, phải dùng method ghép sẵn hoặc lock ngoài."]},{"id":"d-3-9","topicId":3,"versions":[8,11,17,21],"difficulty":"advanced","question":"Với load factor mặc định, mảng nội bộ của map có độ dài bao nhiêu sau vòng lặp?","code":"Map<Integer, String> map = new HashMap<>(16);\nfor (int i = 0; i < 13; i++) {\n    map.put(i, \"v\" + i);\n}","choices":["16 — vì 13 vẫn nhỏ hơn 16","32 — vì phần tử thứ 13 làm size vượt threshold 12 nên bảng nhân đôi","24 — vì bảng tăng 1.5 lần giống ArrayList","64 — vì bảng phải đạt tối thiểu 64 ô"],"correctAnswer":1,"explanation":"threshold = capacity × loadFactor = 16 × 0.75 = 12. HashMap kiểm tra SAU khi chèn: khi size tăng lên vượt threshold thì gọi resize(). Sau 12 lần put, size = 12 và 12 không vượt 12 nên chưa resize. Lần put thứ 13 đưa size lên 13 > 12, bảng nhân đôi thành 32 và threshold thành 24. Lưu ý HashMap luôn nhân đôi để giữ tính chất luỹ thừa của 2 — điều kiện bắt buộc để chỉ số bucket tính được bằng phép AND; hệ số 1.5 là quy tắc của ArrayList.grow(), không phải của HashMap.","whyWrong":["So sánh sai đại lượng: ngưỡng là threshold 12 chứ không phải capacity 16.","","1.5 lần là chiến lược tăng trưởng của ArrayList; HashMap bắt buộc nhân đôi để capacity luôn là luỹ thừa của 2.","64 là ngưỡng độ dài bảng tối thiểu để cho phép treeify một bucket, không phải kích thước bắt buộc của bảng."]},{"id":"d-4-1","topicId":4,"versions":[8,11,17,21],"difficulty":"beginner","question":"Đoạn code sau in ra gì?","code":"String a = \"hello\";\nString b = new String(\"hello\");\nString c = b.intern();\n\nSystem.out.println(a == b);\nSystem.out.println(a.equals(b));\nSystem.out.println(a == c);","choices":["true, true, true","false, true, true","false, true, false","false, false, true"],"correctAnswer":1,"explanation":"Literal \"hello\" nằm trong String Pool nên biến a trỏ tới object trong pool. Toán tử new theo định nghĩa cấp phát object mới trên heap, nên a == b là false dù nội dung giống hệt. equals so từng ký tự nên trả true. intern() tra pool, thấy đã có chuỗi \"hello\" và trả về đúng tham chiếu đó, nên a == c là true. Quy tắc thực hành: so chuỗi luôn dùng equals (hoặc Objects.equals khi có thể null), đừng bao giờ dựa vào == cho dù nó đôi lúc 'may mắn' đúng nhờ pool.","whyWrong":["a == b không thể true: new String() luôn tạo object mới nằm ngoài pool.","","intern() trả về chính tham chiếu trong pool, mà a cũng trỏ vào pool, nên a == c phải là true.","equals so sánh nội dung chứ không so tham chiếu, nên a.equals(b) là true."]},{"id":"d-4-2","topicId":4,"versions":[8,11,17,21],"difficulty":"beginner","question":"Đoạn code sau in ra gì?","code":"String s = \"  Java  \";\ns.trim();\ns.toUpperCase();\nSystem.out.println(\"[\" + s + \"]\");","choices":["[JAVA]","[  JAVA  ]","[Java]","[  Java  ]"],"correctAnswer":3,"explanation":"String bất biến: trim() và toUpperCase() không sửa object gốc mà trả về String MỚI. Ở đây giá trị trả về bị vứt đi nên s giữ nguyên cả khoảng trắng lẫn chữ thường. Muốn có hiệu lực phải gán lại: s = s.trim().toUpperCase(). Đây là lỗi cơ bản nhưng vẫn xuất hiện thường xuyên, và hầu hết IDE đều cảnh báo 'result of String.trim() is ignored' chính vì lý do đó.","whyWrong":["Đó là kết quả nếu cả hai lời gọi được gán lại vào s, nhưng ở đây không có phép gán nào.","toUpperCase() cũng trả về chuỗi mới và bị bỏ đi, nên s không hề in hoa.","trim() trả về chuỗi mới đã cắt khoảng trắng, nhưng kết quả bị vứt đi nên s vẫn còn khoảng trắng.",""]},{"id":"d-4-3","topicId":4,"versions":[8,11,17,21],"difficulty":"beginner","question":"Khác biệt thực chất giữa StringBuilder và StringBuffer là gì?","choices":["StringBuffer nhanh hơn vì được JVM tối ưu đặc biệt","StringBuilder có capacity động còn StringBuffer thì cố định","StringBuffer đồng bộ hoá (synchronized) từng method nên an toàn ở mức từng thao tác nhưng chậm hơn; StringBuilder không đồng bộ và là lựa chọn mặc định","StringBuilder bất biến còn StringBuffer thì thay đổi được"],"correctAnswer":2,"explanation":"Hai class có API gần như giống hệt nhau; khác biệt duy nhất đáng kể là StringBuffer (có từ JDK 1.0) đánh dấu synchronized trên mọi method, còn StringBuilder (Java 5) thì không. Điểm nên nói thêm để ghi điểm: đồng bộ ở mức từng method gần như không bao giờ đủ để chương trình đúng, vì một chuỗi append liên tiếp vẫn cần lock ở tầng ngoài — nên StringBuffer hiếm khi là câu trả lời đúng cho bài toán đa luồng thật. Ngoài ra khi builder là biến cục bộ không thoát khỏi method, JIT thường loại bỏ được lock qua escape analysis.","whyWrong":["Ngược lại: chi phí đồng bộ hoá khiến StringBuffer chậm hơn hoặc bằng, không bao giờ nhanh hơn.","Cả hai đều có capacity động và cùng cơ chế nở buffer; đây không phải điểm khác biệt.","","Cả hai đều thay đổi được — đó chính là lý do chúng tồn tại bên cạnh String bất biến."]},{"id":"d-4-4","topicId":4,"versions":[8,11,17,21],"difficulty":"intermediate","question":"Đoạn code sau in ra gì?","code":"String a = \"ja\";\nString b = \"va\";\nfinal String c = \"ja\";\nfinal String d = \"va\";\n\nSystem.out.println((\"ja\" + \"va\") == \"java\");\nSystem.out.println((a + b) == \"java\");\nSystem.out.println((c + d) == \"java\");","choices":["true, true, true","true, false, true","true, false, false","false, false, false"],"correctAnswer":1,"explanation":"Dòng đầu là biểu thức hằng compile-time: javac ghép ngay lúc biên dịch thành literal \"java\", mà literal thì nằm trong pool nên cùng object với \"java\" — true. Dòng hai dùng biến thường nên phép nối xảy ra lúc runtime và tạo String mới nằm ngoài pool — false. Dòng ba: c và d là biến final khởi tạo bằng literal nên chúng cũng là hằng compile-time, javac lại folding thành \"java\" — true. Chi tiết hay bị bỏ sót: chỉ từ khoá final mới biến biến thành hằng compile-time; 'effectively final' không có tác dụng này.","whyWrong":["Dòng hai không thể true: a và b là biến thường nên phép nối diễn ra lúc chạy và sinh object mới.","","Dòng ba là true vì c và d được khai báo final với giá trị hằng, nên javac gộp chúng lúc biên dịch.","Dòng đầu chắc chắn true vì javac gộp hai literal thành một literal duy nhất trong pool."]},{"id":"d-4-5","topicId":4,"versions":[8,11,17,21],"difficulty":"intermediate","question":"Vì sao nối chuỗi bằng += trong vòng lặp n lần vẫn là O(n^2), dù từ Java 9 compiler đã dùng invokedynamic và StringConcatFactory?","choices":["Vì invokedynamic chậm hơn chuỗi lệnh StringBuilder của Java 8","Vì mỗi lần lặp là một biểu thức nối độc lập: kết quả cũ bị sao chép lại toàn bộ vào chuỗi mới, tổng chi phí sao chép là 1+2+...+n","Vì String không có capacity nên phải tính lại hash sau mỗi lần nối","Vì GC bắt buộc phải chạy sau mỗi lần nối chuỗi"],"correctAnswer":1,"explanation":"Cả cơ chế StringBuilder của Java 8 lẫn invokedynamic của Java 9+ chỉ tối ưu trong phạm vi MỘT biểu thức. Trong vòng lặp, biến trung gian s là một String hoàn chỉnh có thể bị dùng ở bất kỳ đâu, nên compiler không được phép gộp các lần lặp lại thành một buffer chung. Kết quả là mỗi vòng đều phải sao chép lại toàn bộ nội dung đã tích luỹ; sau n vòng tổng số ký tự phải copy là 1+2+...+n, tức O(n^2). Cách sửa duy nhất là tự giữ một StringBuilder ngoài vòng lặp, hoặc dùng Collectors.joining.","whyWrong":["invokedynamic thường nhanh hơn vì runtime có thể tính trước tổng độ dài và ghi một lần; nó không phải nguyên nhân.","","hashCode của String chỉ được tính khi có ai gọi tới, và hoàn toàn không liên quan tới chi phí nối chuỗi.","GC chạy theo lịch của JVM chứ không bị ép chạy sau mỗi lần nối; rác sinh ra là hệ quả chứ không phải nguyên nhân của O(n^2)."]},{"id":"d-4-6","topicId":4,"versions":[8,11,17,21],"difficulty":"intermediate","question":"String Pool nằm ở đâu, và điều đó thay đổi ra sao qua các phiên bản?","choices":["Luôn nằm trong stack của thread đang chạy","Nằm trong PermGen tới Java 6; từ Java 7 chuyển sang heap, nên chuỗi trong pool bị GC thu hồi được và intern() nhiều không còn làm tràn PermGen","Nằm trong Metaspace từ Java 8, trước đó nằm trong heap","Nằm trong vùng nhớ native ngoài heap ở mọi phiên bản"],"correctAnswer":1,"explanation":"Tới Java 6, String Pool nằm trong PermGen vốn có kích thước cố định, nên gọi intern() ồ ạt (ví dụ khi nạp hàng triệu chuỗi từ file) có thể ném OutOfMemoryError: PermGen space. Java 7 chuyển pool sang heap: pool lớn theo heap, và các entry không còn tham chiếu nào có thể bị GC thu hồi. Cần tách bạch hai mốc thường bị gộp làm một: pool chuyển sang heap ở Java 7, còn PermGen bị bỏ hẳn và thay bằng Metaspace ở Java 8. Số bucket của bảng pool chỉnh được bằng -XX:StringTableSize.","whyWrong":["Stack chỉ chứa frame và biến cục bộ; mọi object String đều nằm trên heap.","","Đảo ngược trình tự: pool ở PermGen trước rồi mới chuyển sang heap ở Java 7; pool chưa bao giờ nằm trong Metaspace.","Pool là cấu trúc trong JVM trỏ tới các object String nằm trong vùng nhớ do JVM quản lý, không phải vùng native ngoài heap."]},{"id":"d-4-7","topicId":4,"versions":[11,17,21],"difficulty":"intermediate","question":"Compact Strings (Java 9) thay đổi gì trong cách String lưu dữ liệu?","choices":["String lưu byte[] kèm một cờ coder (LATIN1 hoặc UTF16): chuỗi chỉ gồm ký tự Latin-1 dùng 1 byte mỗi ký tự, còn chỉ cần một ký tự nằm ngoài Latin-1 là cả chuỗi dùng 2 byte mỗi ký tự","String tự nén dữ liệu bằng thuật toán nén khi chuỗi đủ dài","String chuyển sang lưu UTF-8 nên tiếng Việt có dấu cũng chỉ tốn 1 byte mỗi ký tự","String dùng byte[] và mọi ký tự luôn chiếm đúng 1 byte"],"correctAnswer":0,"explanation":"Trước Java 9, String lưu char[] với 2 byte cho mọi ký tự, lãng phí phân nửa bộ nhớ với dữ liệu ASCII vốn chiếm đa số trong ứng dụng thực tế. JEP 254 đổi sang byte[] cộng một byte coder, và quyết định là theo TỪNG String chứ không theo từng ký tự — chỉ một ký tự ngoài Latin-1 là cả chuỗi rơi về chế độ UTF16. Với dữ liệu tiếng Việt có dấu (ví dụ 'ế' nằm ngoài Latin-1) chuỗi vẫn dùng 2 byte mỗi ký tự, nên đừng hứa mức tiết kiệm đồng đều. API bên ngoài không đổi: length() và charAt() vẫn tính theo đơn vị char UTF-16.","whyWrong":["","Không có bước nén nào; đây chỉ là chọn giữa hai cách mã hoá cố định, không tốn CPU giải nén.","Chế độ tiết kiệm là Latin-1 chứ không phải UTF-8, và ký tự tiếng Việt có dấu nằm ngoài Latin-1 nên vẫn dùng 2 byte.","Chỉ đúng khi toàn bộ chuỗi nằm trong Latin-1; ngoài phạm vi đó chuỗi dùng 2 byte mỗi ký tự."]},{"id":"d-4-8","topicId":4,"versions":[8,11,17,21],"difficulty":"advanced","question":"Đoạn code sau in ra gì?","code":"StringBuilder a = new StringBuilder(\"java\");\nStringBuilder b = new StringBuilder(\"java\");\n\nSystem.out.println(a.equals(b));\nSystem.out.println(a.toString().equals(b.toString()));\n\nSet<StringBuilder> set = new HashSet<>();\nset.add(a);\nSystem.out.println(set.contains(b));","choices":["true, true, true","false, true, false","false, true, true","true, true, false"],"correctAnswer":1,"explanation":"StringBuilder và StringBuffer KHÔNG override equals/hashCode, nên chúng dùng bản identity của Object: hai builder cùng nội dung vẫn là hai object khác nhau và không bao giờ 'bằng nhau'. Vì thế a.equals(b) là false, còn so sánh sau khi gọi toString() thì đúng vì lúc đó là hai String. Hệ quả trực tiếp: đừng bao giờ dùng StringBuilder làm key của Map hay phần tử của Set, và luôn gọi toString() trước khi so sánh. (Java 11 có bổ sung compareTo cho StringBuilder/StringBuffer, nhưng equals thì vẫn giữ nguyên hành vi identity.)","whyWrong":["a.equals(b) không thể true vì StringBuilder không override equals; nó rơi về so sánh tham chiếu.","","contains(b) phải dùng hashCode và equals của StringBuilder, cả hai đều theo identity nên không tìm thấy a.","Kết quả đầu tiên sai: equals của StringBuilder là so sánh tham chiếu nên trả false."]},{"id":"d-4-9","topicId":4,"versions":[17,21],"difficulty":"advanced","question":"Với text block sau, nội dung của biến s là gì? (bốn dấu cách trước Hello, sáu dấu cách trước World, bốn dấu cách trước dấu đóng)","code":"String s = \"\"\"\n    Hello\n      World\n    \"\"\";\nSystem.out.print(\"[\" + s + \"]\");","choices":["Hello, xuống dòng, hai dấu cách, World, xuống dòng — toàn bộ lề chung 4 dấu cách bị cắt và có ký tự xuống dòng ở cuối","Giữ nguyên 4 dấu cách ở đầu mỗi dòng vì text block không tự cắt lề","Hello, xuống dòng, hai dấu cách, World — lề bị cắt nhưng KHÔNG có ký tự xuống dòng ở cuối","Không biên dịch được vì dấu mở \"\"\" phải đi kèm nội dung trên cùng một dòng"],"correctAnswer":0,"explanation":"Lề phụ (incidental white space) được xác định bằng số dấu cách nhỏ nhất trong các dòng không rỗng, TÍNH CẢ dòng chứa dấu đóng. Ở đây Hello thụt 4, World thụt 6, dòng đóng thụt 4, nên lề chung là 4 và bị cắt hết; World còn dư 2 dấu cách nên giữ lại phần thụt tương đối đó. Vì dấu đóng nằm trên dòng riêng nên dòng cuối cùng có nội dung vẫn kết thúc bằng ký tự xuống dòng. Muốn bỏ ký tự xuống dòng cuối, đặt dấu đóng ngay sau World, hoặc thêm dấu gạch chéo ngược ở cuối dòng để nối dòng. Text block chuẩn hoá ở Java 15 nên có mặt trong LTS 17 và 21.","whyWrong":["","Text block cắt lề phụ theo thuật toán chuẩn hoá của Java 15; đây chính là điểm khác biệt so với chuỗi thường nối bằng \\n.","Dấu đóng nằm trên dòng riêng nên dòng nội dung cuối cùng vẫn được kết thúc bằng ký tự xuống dòng.","Ngược lại mới đúng: dấu mở \"\"\" bắt buộc phải là ký tự cuối của dòng đó, nội dung chỉ được bắt đầu từ dòng kế tiếp — đúng như code ở trên, nên nó biên dịch bình thường."]},{"id":"d-5-1","topicId":5,"versions":[8,11,17,21],"difficulty":"beginner","question":"Vì sao dòng lệnh List<Object> l = new ArrayList<String>(); không biên dịch được?","choices":["Vì ArrayList không implement List","Vì generic là bất biến (invariant): List<String> không phải kiểu con của List<Object> dù String là kiểu con của Object — nếu cho phép thì có thể add một Integer vào list vốn chỉ chứa String","Vì phải dùng toán tử diamond new ArrayList<>()","Vì type erasure xoá tham số kiểu nên compiler không so sánh được hai kiểu"],"correctAnswer":1,"explanation":"Quan hệ kiểu con giữa các tham số kiểu KHÔNG được nâng lên kiểu chứa chúng: List<String> và List<Object> là hai kiểu không liên quan. Nếu Java cho phép phép gán này thì qua biến l bạn có thể gọi l.add(42) một cách hoàn toàn hợp lệ về kiểu, và đoạn code khác đang đọc list đó dưới dạng String sẽ ném ClassCastException. Đây chính là điểm khác biệt then chốt với mảng: String[] gán được vào Object[] và lỗi tương ứng chỉ lộ ra lúc chạy dưới dạng ArrayStoreException. Muốn nhận được nhiều kiểu list thì dùng wildcard: List<? extends Object> hoặc List<?>.","whyWrong":["ArrayList có implement List; nếu vấn đề nằm ở đó thì new ArrayList<String>() gán vào List<String> cũng phải lỗi.","","Diamond chỉ là cú pháp rút gọn; viết new ArrayList<>() thì compiler suy ra String từ vế trái và lỗi vẫn còn nguyên bản chất.","Erasure diễn ra SAU khi kiểm tra kiểu. Chính vì kiểm tra kiểu xảy ra trước erasure nên compiler mới bắt được lỗi này."]},{"id":"d-5-2","topicId":5,"versions":[8,11,17,21],"difficulty":"beginner","question":"Đoạn code sau in ra gì?","code":"List<String> a = new ArrayList<>();\nList<Integer> b = new ArrayList<>();\n\nSystem.out.println(a.getClass() == b.getClass());\nSystem.out.println(a.getClass().getName());","choices":["true rồi java.util.ArrayList","false rồi java.util.ArrayList<java.lang.String>","true rồi java.util.ArrayList<java.lang.String>","false rồi java.util.ArrayList"],"correctAnswer":0,"explanation":"Type erasure xoá tham số kiểu trước khi sinh bytecode, nên lúc runtime chỉ tồn tại đúng một class java.util.ArrayList. Cả hai biến đều trỏ tới instance của cùng class đó, và getClass() trả về cùng một đối tượng Class nên so sánh bằng == cho true. getName() cũng chỉ trả tên class thuần, không có phần tham số kiểu. Hệ quả thực tế: không thể phân biệt List<String> với List<Integer> lúc runtime — muốn biết kiểu thật thì phải tự mang theo một Class<T> (type token) như cách Jackson hay Spring làm.","whyWrong":["","Chỉ có một class ArrayList lúc runtime nên phép so sánh phải trả true, và tên class không bao giờ chứa tham số kiểu.","Vế đầu đúng nhưng vế sau sai: getName() trả về java.util.ArrayList, tham số kiểu đã bị xoá khỏi bytecode.","Hai instance thuộc cùng một class nên getClass() trả về cùng một đối tượng Class, so sánh bằng == cho true."]},{"id":"d-5-3","topicId":5,"versions":[8,11,17,21],"difficulty":"beginner","question":"Vì sao hai method sau không thể cùng tồn tại trong một class: void f(List<String> l) và void f(List<Integer> l)?","choices":["Vì Java không cho phép overload method có tham số kiểu generic","Vì lúc runtime hai kiểu giống hệt nhau nên lời gọi sẽ nhập nhằng và JVM không chọn được bản nào","Vì sau erasure cả hai đều trở thành f(List) — trùng signature nên compiler từ chối ngay lúc biên dịch, chương trình không bao giờ chạy tới runtime","Vì chúng chỉ khác nhau ở kiểu trả về"],"correctAnswer":2,"explanation":"Overload được phân biệt bằng signature, và signature sau erasure của cả hai method đều là f(List). Compiler báo lỗi 'name clash: both methods have same erasure' ngay tại chỗ khai báo, chứ không đợi tới lúc gọi. Đây là một trong những giới hạn trực tiếp nhất của erasure và rất hay được dùng để kiểm tra xem ứng viên hiểu erasure ở mức khái niệm hay chỉ thuộc lòng. Cách vòng tránh trong thực tế là đặt tên method khác nhau — điều mà thư viện chuẩn cũng làm.","whyWrong":["Java cho phép overload với tham số generic bình thường, miễn là erasure của chúng khác nhau, ví dụ f(List<String>) và f(Set<String>).","Gần đúng về nguyên nhân nhưng sai về thời điểm: lỗi xảy ra lúc biên dịch tại chỗ khai báo, chương trình không bao giờ được sinh ra để chạy.","","Hai method này có cùng kiểu trả về void; vấn đề nằm hoàn toàn ở danh sách tham số sau erasure."]},{"id":"d-5-4","topicId":5,"versions":[8,11,17,21],"difficulty":"intermediate","question":"Đoạn code sau có vấn đề gì?","code":"List<Integer> ints = new ArrayList<>(Arrays.asList(1, 2, 3));\nList<? extends Number> nums = ints;\n\nNumber n = nums.get(0);\nnums.add(4);","choices":["Chạy bình thường, nums có 4 phần tử","Lỗi biên dịch tại nums.add(4) — với ? extends Number, compiler không biết kiểu thật là gì nên không chấp nhận add bất cứ giá trị nào ngoài null","Lỗi biên dịch tại dòng Number n = nums.get(0)","Biên dịch được nhưng ném UnsupportedOperationException lúc chạy"],"correctAnswer":1,"explanation":"Kiểu ? extends Number nghĩa là 'một kiểu con nào đó của Number, nhưng không rõ là kiểu nào'. Đọc thì luôn an toàn vì bất kỳ kiểu con nào cũng là Number, nên dòng get(0) hợp lệ. Ghi thì không: nums hoàn toàn có thể là một List<Double>, khi đó add(4) sẽ nhét Integer vào list Double. Vì compiler không thể chứng minh phép add nào là an toàn, nó chặn tất cả, trừ null vì null hợp với mọi kiểu tham chiếu. Đây đúng là vế Producer-Extends
