/code>; đối số là một hằng hay biến sẵn thì dùng <code>orElse</code>.","<b>Cùng một bẫy xuất hiện ở nhiều nơi khác.</b> <code>orElseThrow(Supplier)</code> dùng supplier chính vì lý do này — nếu nhận thẳng một exception thì object exception (kèm chi phí điền stack trace) sẽ được tạo ở mọi lần gọi. Tư duy tương tự áp dụng cho <code>Map.computeIfAbsent</code> so với <code>getOrDefault</code>, và cho các API logging nhận supplier.","<b>Một nhầm lẫn thường đi kèm.</b> Nhiều người tưởng <code>orElse</code> không được gọi khi Optional có giá trị. Chính xác là <b>method <code>orElse</code> vẫn được gọi</b> và vẫn trả về giá trị bên trong Optional; chỉ có điều đối số của nó đã bị tính xong từ trước khi lời gọi bắt đầu. Nói rõ được điều này chứng tỏ bạn hiểu cơ chế chứ không chỉ thuộc lòng lời khuyên."],"example":"static String loadFromDb(String k) {\n    System.out.println(\"truy van DB\");\n    return \"db-\" + k;\n}\n\nOptional<String> cached = Optional.of(\"cache-hit\");\n\n// In ra \"truy van DB\" DÙ Optional có giá trị; kết quả vẫn là \"cache-hit\"\nString v1 = cached.orElse(loadFromDb(\"k\"));\n\n// KHÔNG gọi DB\nString v2 = cached.orElseGet(() -> loadFromDb(\"k\"));\n\n// orElse hợp lý khi mặc định là hằng số\nString name = opt.orElse(\"\");\n\n// Cùng lý do: exception được tạo lười\nUser u = repo.findById(id)\n             .orElseThrow(() -> new UserNotFoundException(id));","exampleTitle":"Cùng kết quả, khác hoàn toàn về tác dụng phụ","keyPoints":["Java đánh giá đối số trước khi gọi method, nên biểu thức trong orElse luôn chạy","orElseGet nhận Supplier nên chỉ chạy khi Optional rỗng","Đối số là lời gọi method thì dùng orElseGet; là hằng hay biến sẵn thì dùng orElse","Đối số có side effect trong orElse gây sai ngữ nghĩa chứ không chỉ chậm","orElseThrow nhận Supplier cũng vì lý do đánh giá lười — tránh tạo exception ở mọi lần gọi"],"trap":"Người phỏng vấn đưa code có println bên trong hàm truyền vào orElse rồi hỏi output. Trả lời 'không in gì vì Optional có giá trị' là sai — nó in, vì đối số được tính trước khi orElse chạy.","followUp":["Vì sao orElseThrow lại nhận Supplier<X> thay vì nhận thẳng một exception?","Có trường hợp nào orElseGet tệ hơn orElse không?","Nêu một API khác trong JDK cũng dùng Supplier vì lý do đánh giá lười tương tự."]},{"id":"t-10-4","topicId":10,"versions":[8,11,17,21],"title":"map, flatMap và filter: xâu chuỗi Optional đúng cách","summary":"Optional là một container có thể duyệt, nên nó có map và flatMap với đúng ngữ nghĩa như của Stream.","sections":["<b><code>map</code> tự bọc kết quả bằng <code>ofNullable</code>.</b> <code>opt.map(f)</code> trả về <code>Optional.empty()</code> nếu opt rỗng, ngược lại trả về <code>Optional.ofNullable(f.apply(value))</code>. Chi tiết quan trọng nằm ở chữ <code>ofNullable</code>: nếu hàm <code>f</code> trả về <code>null</code>, kết quả là một Optional <b>rỗng</b> chứ không phải Optional chứa null. Nhờ đó chuỗi <code>map</code> tự động hấp thụ mọi null xuất hiện ở giữa.","<b><code>flatMap</code> dành cho hàm vốn đã trả về Optional.</b> Nếu <code>getAddress()</code> trả <code>Optional&lt;Address&gt;</code> mà bạn dùng <code>map</code>, kết quả sẽ là <code>Optional&lt;Optional&lt;Address&gt;&gt;</code> — hợp lệ về kiểu nhưng vô dụng, và thường lộ ra dưới dạng lỗi biên dịch ở dòng tiếp theo. <code>flatMap</code> phẳng hoá một tầng, cho ra <code>Optional&lt;Address&gt;</code>. Quy tắc: hàm trả về giá trị thường thì <code>map</code>, hàm trả về Optional thì <code>flatMap</code>.","<b><code>filter</code> biến điều kiện thành rỗng.</b> <code>opt.filter(p)</code> giữ nguyên Optional nếu có giá trị và giá trị thoả predicate, ngược lại trả về rỗng. Nó cho phép gộp kiểm tra tồn tại và kiểm tra hợp lệ vào một chuỗi duy nhất, ví dụ <code>findUser(id).filter(User::isActive).map(User::getEmail)</code>.","<b>Chuỗi map thay cho kim tự tháp if.</b> Đây là lợi ích thực tế rõ nhất: thay vì bốn tầng <code>if (x != null)</code> lồng nhau để đi từ <code>Order</code> tới tên thành phố, ta viết một chuỗi phẳng và đọc theo đúng thứ tự nghiệp vụ. Điều kiện là các getter phải trả về giá trị có thể bọc được; nếu chúng đã trả Optional thì dùng <code>flatMap</code>.","<b>Nhưng đừng lạm dụng.</b> Nếu chỉ có đúng một lần kiểm tra null, viết <code>if (x != null)</code> vẫn rõ ràng và rẻ hơn — mỗi lời gọi <code>Optional.ofNullable</code> là một object mới trên heap. Optional có giá trị khi nó nằm trong <b>chữ ký</b> của API để truyền đạt ý nghĩa, hoặc khi chuỗi kiểm tra đủ dài để cách viết cũ trở nên khó đọc. Bọc một biến local vào Optional chỉ để tránh một lệnh <code>if</code> là dùng sai công cụ.","<b>Chi phí và giới hạn.</b> Optional là một class thường (không phải value type), nên mỗi instance là một object trên heap; JIT có thể loại bỏ được khi nó không thoát khỏi method, nhưng không có gì đảm bảo. Trong vòng lặp nóng hoặc trên đường đi được gọi hàng triệu lần mỗi giây, đó là chi phí cần cân nhắc — thêm một lý do nữa để giữ Optional ở ranh giới API chứ không rải xuống mọi tầng bên trong."],"example":"// Kim tự tháp if\nString city = \"unknown\";\nif (order != null) {\n    Customer c = order.getCustomer();\n    if (c != null) {\n        Address a = c.getAddress();\n        if (a != null && a.getCity() != null) city = a.getCity();\n    }\n}\n\n// Chuỗi map: null ở bất kỳ bước nào cũng thành empty\nString city2 = Optional.ofNullable(order)\n        .map(Order::getCustomer)\n        .map(Customer::getAddress)\n        .map(Address::getCity)\n        .orElse(\"unknown\");\n\n// Getter đã trả Optional -> phải flatMap\n// Customer.getAddress() : Optional<Address>\nOptional<Optional<Address>> sai = optOrder.map(Order::getCustomer).map(Customer::getAddress);\nOptional<Address> dung = optOrder.map(Order::getCustomer).flatMap(Customer::getAddress);\n\n// filter gộp kiểm tra tồn tại và kiểm tra hợp lệ\nOptional<String> email = repo.findById(id)\n        .filter(User::isActive)\n        .map(User::getEmail);","exampleTitle":"map, flatMap, filter và giới hạn của chúng","keyPoints":["map bọc kết quả bằng ofNullable nên hàm trả null cho ra Optional rỗng, không phải Optional chứa null","Hàm trả về Optional thì dùng flatMap, nếu không sẽ ra Optional<Optional<T>>","filter biến giá trị không thoả điều kiện thành Optional rỗng","Chuỗi map thay được kim tự tháp if và đọc theo đúng thứ tự nghiệp vụ","Mỗi Optional là một object trên heap — đừng dùng chỉ để né một lệnh if trong code nội bộ"],"trap":"Đưa ra một getter trả về Optional rồi hỏi kiểu kết quả khi dùng map. Đáp án Optional<Optional<T>> làm nhiều người bất ngờ vì họ quen nghĩ map luôn phẳng hoá.","followUp":["Optional.of(\"a\").map(s -> null) cho ra gì?","Khi nào chuỗi Optional trở nên khó đọc hơn cách viết if truyền thống?","Vì sao nói Optional có chi phí allocation, và JIT xử lý được tới đâu?"]},{"id":"t-10-5","topicId":10,"versions":[11,17,21],"title":"Optional từ Java 9 tới 11: ifPresentOrElse, or, stream, isEmpty","summary":"Ba phiên bản sau Java 8 bổ sung đúng những method còn thiếu để không phải quay lại isPresent + get.","sections":["<b><code>ifPresentOrElse</code> (Java 9).</b> Java 8 chỉ có <code>ifPresent(Consumer)</code>, nên khi cần cả nhánh 'không có gì' người ta buộc phải quay lại <code>if (opt.isPresent()) ... else ...</code>. <code>ifPresentOrElse(consumer, runnable)</code> lấp đúng khoảng trống đó và giữ được phong cách hàm.","<b><code>or</code> (Java 9).</b> <code>or(Supplier&lt;Optional&lt;T&gt;&gt;)</code> trả về chính Optional nếu có giá trị, ngược lại trả về Optional do supplier sinh ra. Khác biệt với <code>orElseGet</code> nằm ở kiểu trả về: <code>or</code> trả về <code>Optional</code> nên xâu chuỗi tiếp được, còn <code>orElseGet</code> trả về giá trị trần và kết thúc chuỗi. Đây là công cụ đúng cho mẫu fallback nhiều tầng: tìm trong cache, không có thì tìm DB, không có nữa thì tìm service ngoài — và vì là <code>Supplier</code> nên các tầng sau chỉ chạy khi thực sự cần.","<b><code>stream()</code> (Java 9).</b> Biến Optional thành một stream có 0 hoặc 1 phần tử. Kết hợp với <code>flatMap</code>, nó cho phép lọc và mở một <code>Stream&lt;Optional&lt;T&gt;&gt;</code> chỉ trong một bước: <code>stream.flatMap(Optional::stream)</code>, thay cho cặp <code>filter(Optional::isPresent).map(Optional::get)</code> vốn dài hơn và có <code>get()</code> ở giữa.","<b><code>isEmpty</code> (Java 11).</b> Chỉ là <code>!isPresent()</code> nhưng đọc rõ hơn nhiều trong điều kiện phủ định và trong early return. Đây là bổ sung nhỏ nhất nhưng lại hay được hỏi vì nó xác định người trả lời có thực sự dùng Java hiện đại hay không.","<b>So sánh Optional phải dùng <code>equals</code>.</b> <code>Optional</code> override <code>equals</code>: hai Optional bằng nhau khi cùng rỗng, hoặc cùng có giá trị và hai giá trị <code>equals</code> nhau. Dùng <code>==</code> là so sánh tham chiếu object bao ngoài và gần như luôn sai. Ngoài ra <code>Optional.empty()</code> trong OpenJDK trả về một instance dùng chung, nên <code>==</code> có thể tình cờ đúng với Optional rỗng và khiến bạn tin nhầm — đây là chi tiết cài đặt, đừng dựa vào.","<b>Ba lưu ý cuối khi thiết kế API.</b> Đừng bao giờ trả về <code>null</code> từ một method có kiểu trả về là <code>Optional</code> — đó là lỗi tệ nhất có thể mắc với Optional, vì người gọi không còn cách nào tự bảo vệ. Không dùng Optional làm khoá hay giá trị trong map. Và nếu method của bạn trả <code>Optional</code>, hãy giữ nguyên như vậy suốt chuỗi gọi thay vì mở ra rồi bọc lại nhiều lần."],"example":"// Java 9\nrepo.findById(id).ifPresentOrElse(\n        u -> log.info(\"found {}\", u),\n        () -> log.warn(\"khong thay {}\", id));\n\n// Fallback nhiều tầng: tầng sau chỉ chạy khi cần\nOptional<Config> cfg = fromCache(k)\n        .or(() -> fromDatabase(k))\n        .or(() -> fromRemote(k));\n\n// Lọc Stream<Optional<T>> gọn gàng\nList<Optional<String>> raw = List.of(Optional.of(\"a\"), Optional.empty(), Optional.of(\"b\"));\n\nList<String> cu = raw.stream()\n        .filter(Optional::isPresent).map(Optional::get)\n        .collect(Collectors.toList());              // Java 8\n\nList<String> moi = raw.stream()\n        .flatMap(Optional::stream)\n        .collect(Collectors.toList());              // Java 9+\n\n// Java 11\nif (opt.isEmpty()) return;\n\n// So sánh\nOptional<String> a = Optional.of(new String(\"java\"));\nOptional<String> b = Optional.of(\"java\");\na == b;        // false\na.equals(b);   // true","exampleTitle":"Những bổ sung sau Java 8 và cách so sánh Optional","keyPoints":["Java 9 thêm ifPresentOrElse, or(Supplier<Optional<T>>) và stream()","or trả về Optional nên xâu chuỗi tiếp được; orElseGet trả giá trị trần và kết thúc chuỗi","flatMap(Optional::stream) thay cho filter(isPresent).map(get)","Java 11 thêm isEmpty()","So sánh Optional bằng equals; đừng bao giờ trả về null từ method có kiểu trả về Optional"],"trap":"Nhầm or với orElse. or nhận Supplier<Optional<T>> và trả về Optional<T>; orElse nhận T và trả về T. Gọi nhầm sẽ không biên dịch được, nhưng khi hỏi miệng thì rất nhiều người mô tả sai kiểu.","followUp":["or và orElseGet khác nhau ở kiểu trả về như thế nào, và điều đó ảnh hưởng gì tới cách xâu chuỗi?","Vì sao trả về null từ một method khai báo Optional lại là lỗi nghiêm trọng hơn cả trả null thông thường?","Optional.empty() == Optional.empty() cho ra gì, và có nên dựa vào kết quả đó không?"]},{"id":"t-11-1","topicId":11,"versions":[11,17,21],"title":"JPMS ra đời để giải quyết vấn đề gì?","summary":"Classpath phẳng khiến phụ thuộc không kiểm chứng được và public nghĩa là public với cả thế giới — module hoá là câu trả lời của Java 9.","sections":["<b>Classpath là một danh sách phẳng, không phải một đồ thị phụ thuộc.</b> Trước Java 9, mọi JAR được đổ chung vào một không gian tên duy nhất và JVM nạp class theo thứ tự xuất hiện. Nếu hai JAR cùng chứa <code>org/example/Foo.class</code>, bản đứng trước sẽ thắng một cách âm thầm — không cảnh báo, không lỗi. Đây chính là <i>JAR hell</i>: hậu quả chỉ lộ ra lúc runtime dưới dạng <code>NoSuchMethodError</code> hoặc <code>NoClassDefFoundError</code>, thường là sau khi đã deploy.","<b>Không có kiểm tra phụ thuộc lúc khởi động.</b> Classpath không mô tả 'tôi cần những gì'. Thiếu một JAR thì chương trình vẫn khởi động bình thường và chỉ chết khi chạy đúng vào nhánh code cần class đó. Module path thì ngược lại: JVM chạy bước <i>module resolution</i> ngay lúc khởi động, thiếu module nào là báo lỗi ngay và dừng — fail fast thay vì fail muộn.","<b>Không có mức đóng gói nào cao hơn package.</b> Một class <code>public</code> trong package nội bộ vẫn public với toàn thế giới. Thư viện muốn tách code ra nhiều package để tổ chức cho gọn thì buộc phải để chúng public, và người dùng lập tức phụ thuộc vào những thứ tác giả không hề coi là API. JPMS bổ sung đúng mức thiếu đó: chỉ package nào được <code>exports</code> mới nhìn thấy được từ module khác, kể cả nó có public đi nữa.","<b>JDK là một khối liền.</b> Trước Java 9, <code>rt.jar</code> chứa toàn bộ thư viện chuẩn, kể cả CORBA hay applet mà hầu như không ai còn dùng. Java 9 tách JDK thành hơn 70 module (<code>java.base</code>, <code>java.sql</code>, <code>java.xml</code>, <code>java.logging</code>...), nhờ đó JVM có thể chỉ nạp phần cần thiết và <code>jlink</code> có thể dựng runtime image gọn. Nói cho chính xác về mốc: <code>java.net.http</code> <b>chưa</b> có trong Java 9 — lúc đó HttpClient mới chỉ là module incubator <code>jdk.incubator.httpclient</code> (package <code>jdk.incubator.http</code>); phải tới Java 11 (JEP 321) nó mới thành module chuẩn <code>java.net.http</code>.","<b>Module trong Java là gì.</b> Một module gồm ba thứ: một cái tên duy nhất, tập package nó cho phép người khác dùng, và tập module nó cần. Ba thứ này được khai báo trong <code>module-info.java</code> đặt ở gốc source root và được biên dịch thành <code>module-info.class</code> — nghĩa là metadata này được compiler và JVM cùng đọc, chứ không phải một quy ước xây dựng ở tầng Maven/Gradle.","<b>Góc LTS quan trọng nhất khi lên Java 11.</b> JEP 320 xoá hẳn các module Java EE khỏi JDK 11: <code>java.xml.bind</code> (JAXB), <code>java.activation</code>, <code>java.xml.ws</code>, <code>java.transaction</code>, <code>java.corba</code> và aggregator <code>java.se.ee</code>. Ở Java 9/10 chúng chỉ bị deprecate và còn cứu được bằng <code>--add-modules java.xml.bind</code>; từ Java 11 cờ đó vô nghĩa vì module không còn tồn tại, buộc phải thêm dependency Maven tương ứng. Đây là nguyên nhân số một khiến dự án 8 → 11 vỡ với <code>NoClassDefFoundError: javax/xml/bind/JAXBException</code>."],"example":"// src/main/java/module-info.java\nmodule com.acme.order {\n    requires java.sql;                 // cần lúc compile va runtime\n    requires transitive com.acme.model; // ai dung minh cung thay duoc com.acme.model\n    requires static org.projectlombok;  // chi can luc compile\n\n    exports com.acme.order.api;         // API cong khai\n    // com.acme.order.internal KHONG export -> module khac khong dung duoc\n\n    opens com.acme.order.dto;           // cho phep reflection sau luc runtime\n\n    uses com.acme.order.spi.PricingRule;              // consumer cua service\n    provides com.acme.order.spi.PricingRule\n        with com.acme.order.internal.DefaultPricingRule; // provider\n}","exampleTitle":"Một module-info.java đầy đủ các mệnh đề","keyPoints":["Classpath không mô tả phụ thuộc nên lỗi thiếu class chỉ lộ lúc runtime; module path kiểm tra ngay khi khởi động","Trước Java 9 không có mức đóng gói nào giữa package và toàn hệ thống — public là public với tất cả","module-info.java được biên dịch thành module-info.class, compiler và JVM cùng đọc","Java 9 tách JDK thành hơn 70 module, mở đường cho jlink; java.net.http thì tới Java 11 mới có","JEP 320 xoá module Java EE khỏi Java 11 — đây là lỗi migration 8 → 11 phổ biến nhất"],"trap":"Nhiều người nghĩ phải module hoá thì mới chạy được Java 9+. Sai: code để nguyên trên classpath vẫn chạy bình thường vì nó nằm trong unnamed module. JPMS là tuỳ chọn, không bắt buộc.","followUp":["Nếu dự án vẫn dùng classpath thì Java 9+ có thay đổi gì với code của bạn không?","Vì sao lỗi JAXB lại xuất hiện đúng lúc nâng từ Java 8 lên Java 11?"]},{"id":"t-11-2","topicId":11,"versions":[11,17,21],"title":"requires, exports, opens, uses/provides — đọc hiểu module-info","summary":"Mỗi mệnh đề trong module-info trả lời một câu hỏi khác nhau về khả năng đọc và khả năng truy cập.","sections":["<b><code>requires</code> — quan hệ readability.</b> <code>requires B</code> nghĩa là module hiện tại <i>đọc được</i> B, điều kiện cần để dùng bất cứ thứ gì B export. Readability không bắc cầu theo mặc định: A requires B, B requires C thì A vẫn <b>không</b> đọc được C. Đây là điểm khiến người mới bối rối nhất vì trực giác từ Maven (transitive dependency) hoàn toàn ngược lại.","<b><code>requires transitive</code> — implied readability.</b> Khi B khai báo <code>requires transitive C</code>, mọi module requires B sẽ tự động đọc được C. Quy tắc thực hành: nếu kiểu của C <b>xuất hiện trong chữ ký API</b> của bạn (tham số, kiểu trả về, kiểu cha), bạn <i>phải</i> dùng <code>transitive</code>, nếu không người gọi sẽ không compile được chính dòng họ gọi API của bạn. Nếu C chỉ dùng nội bộ thì để <code>requires</code> thường.","<b><code>requires static</code> — phụ thuộc tuỳ chọn.</b> Module bắt buộc phải có lúc compile nhưng được phép vắng mặt lúc runtime, và module resolution sẽ không lỗi nếu thiếu. Dùng cho annotation processor, các annotation chỉ tồn tại lúc biên dịch, hoặc tích hợp tuỳ chọn mà code có nhánh dự phòng. Đổi lại, code phải tự chịu trách nhiệm không chạm tới class đó khi nó vắng mặt.","<b><code>exports</code> — khả năng truy cập lúc compile và runtime.</b> <code>exports p</code> cho phép module khác dùng các thành viên <code>public</code> và <code>protected</code> của các kiểu public trong package <code>p</code>. Có biến thể qualified: <code>exports p to com.acme.web, com.acme.batch</code> chỉ mở cho đúng những module được liệt kê — rất hữu ích để chia sẻ code nội bộ giữa các module của cùng một sản phẩm mà không mở ra ngoài.","<b><code>opens</code> — chỉ runtime, nhưng cho reflection sâu.</b> <code>opens p</code> cho phép mọi thao tác reflection trên package <code>p</code> lúc runtime, kể cả <code>setAccessible(true)</code> trên field và method <code>private</code>. Nó <b>không</b> cấp quyền truy cập lúc compile — code module khác vẫn không import được kiểu trong <code>p</code>. Khai báo <code>open module M { }</code> thì mở toàn bộ package của module.","<b><code>uses</code>/<code>provides ... with</code> — ServiceLoader ở cấp module.</b> <code>uses S</code> khai báo module này sẽ tra cứu implementation của interface <code>S</code> qua <code>ServiceLoader</code>; <code>provides S with Impl</code> khai báo module này cung cấp một implementation. Cơ chế này thay cho file <code>META-INF/services</code> và có ưu điểm là được compiler kiểm tra: <code>Impl</code> phải thực sự implement <code>S</code> và phải có constructor không tham số hoặc method <code>provider()</code> static, nếu không sẽ lỗi biên dịch. Đáng chú ý: class <code>Impl</code> không cần nằm trong package được export."],"example":"// Module cung cap service\nmodule com.acme.payment.momo {\n    requires com.acme.payment.spi;\n    provides com.acme.payment.spi.Gateway\n        with com.acme.payment.momo.MomoGateway; // khong can exports package nay\n}\n\n// Module tieu thu service\nmodule com.acme.checkout {\n    requires com.acme.payment.spi;\n    uses com.acme.payment.spi.Gateway;\n}\n\n// Trong code cua com.acme.checkout\nServiceLoader<Gateway> loaded = ServiceLoader.load(Gateway.class);\nGateway gw = loaded.findFirst()\n        .orElseThrow(() -> new IllegalStateException(\"Khong co Gateway nao\"));","exampleTitle":"uses/provides thay cho META-INF/services","keyPoints":["readability không bắc cầu; muốn bắc cầu phải dùng requires transitive","Quy tắc: kiểu lộ ra trong chữ ký API thì module chứa nó phải requires transitive","requires static = bắt buộc lúc compile, tuỳ chọn lúc runtime","exports có biến thể qualified (exports p to M1, M2) để mở giới hạn","provides ... with được compiler kiểm tra, an toàn hơn META-INF/services"],"trap":"Quên requires transitive cho kiểu xuất hiện trong chữ ký public. Module của bạn compile sạch, nhưng mọi module dùng API của bạn đều lỗi biên dịch — và thông báo lỗi trỏ vào code của họ chứ không phải của bạn.","followUp":["Khi nào bạn dùng exports ... to thay vì exports thường?","Vì sao class implementation trong provides ... with lại không cần được export?"]},{"id":"t-11-3","topicId":11,"versions":[11,17,21],"title":"exports vs opens — vì sao Spring và Hibernate cần opens","summary":"Khác biệt giữa hai mệnh đề này là nguyên nhân trực tiếp của InaccessibleObjectException trong mọi framework dùng reflection.","sections":["<b>Hai trục hoàn toàn khác nhau: thời điểm và độ sâu.</b> <code>exports</code> cấp quyền ở <i>cả compile lẫn runtime</i> nhưng chỉ tới mức <i>public API</i>. <code>opens</code> cấp quyền <i>chỉ runtime</i> nhưng tới mức <i>mọi thành viên, kể cả private</i>. Chúng không phải là hai mức mạnh yếu của cùng một thứ, mà là hai chiều vuông góc — đó là lý do một package có thể vừa <code>exports</code> vừa <code>opens</code>, và cả hai khai báo đều có ý nghĩa riêng.","<b>Deep reflection là gì.</b> Đó là các thao tác cần <code>setAccessible(true)</code>: đọc/ghi field <code>private</code>, gọi constructor không public, gọi method private. Với package chỉ được <code>exports</code>, reflection lên thành viên <b>public</b> vẫn hoạt động bình thường; nhưng <code>setAccessible(true)</code> lên thành viên private sẽ ném <code>InaccessibleObjectException</code> (một <code>RuntimeException</code>, kế thừa <code>RuntimeException</code> chứ không phải checked).","<b>Vì sao framework cần điều đó.</b> Hibernate ghi thẳng vào field private của entity khi hydrate object từ ResultSet để tránh gọi setter (setter có thể chứa logic, và entity có thể không có setter). Jackson đọc/ghi field private khi không có getter/setter. Spring inject vào field <code>@Autowired</code> private, và tạo bean qua constructor có thể không public. Tất cả đều là deep reflection, nên module chứa entity/DTO phải <code>opens</code> package đó.","<b>Vì sao không mở tất cả cho xong.</b> Vì <code>opens</code> phá bỏ đóng gói ở đúng nơi mà JPMS sinh ra để bảo vệ. Cách làm chuẩn là <code>opens</code> có định danh: <code>opens com.acme.entity to org.hibernate.orm.core;</code> — chỉ Hibernate mới soi được vào entity, phần còn lại của hệ thống vẫn bị chặn. Nếu dùng <code>open module</code> cho cả module thì bạn đã tự nguyện quay về mô hình classpath.","<b>Ranh giới thường bị hiểu nhầm.</b> <code>opens</code> không giúp gì lúc compile: nếu module khác cần <code>import</code> kiểu trong package đó, bạn vẫn phải <code>exports</code>. Ngược lại, entity của bạn thường <b>không</b> cần export ra ngoài mà chỉ cần <code>opens</code> cho ORM — đây là trường hợp <code>opens</code> đơn độc rất hợp lý.","<b>Liên hệ với JDK internals.</b> Cùng cơ chế đó áp dụng cho chính JDK. Các thủ thuật cũ như <code>setAccessible</code> vào <code>java.lang.String.value</code> hay <code>ClassLoader</code> nay bị chặn vì <code>java.base</code> không <code>opens</code> các package đó. Java 9–15 còn cho qua kèm cảnh báo (<code>--illegal-access=permit</code> mặc định); Java 16 (JEP 396) đổi mặc định thành <code>deny</code>; Java 17 (JEP 403) đóng hẳn và cờ <code>--illegal-access</code> không còn tác dụng. Từ đó, muốn dùng phải khai báo tường minh <code>--add-opens</code>."],"example":"// Module cua ung dung\nmodule com.acme.app {\n    requires org.hibernate.orm.core;\n    requires com.fasterxml.jackson.databind;\n\n    exports com.acme.app.api;                  // API cho module khac dung\n\n    opens com.acme.app.entity to org.hibernate.orm.core;      // ORM ghi vao field private\n    opens com.acme.app.dto to com.fasterxml.jackson.databind; // Jackson serialize\n}\n\n// Neu chi exports ma khong opens, dong duoi day se nem\n// InaccessibleObjectException luc runtime:\nField f = Order.class.getDeclaredField(\"total\");\nf.setAccessible(true);   // <-- deep reflection","exampleTitle":"opens có định danh cho đúng framework cần","keyPoints":["exports = compile + runtime, chỉ tới public API","opens = chỉ runtime, nhưng cho phép setAccessible trên thành viên private","Một package có thể vừa exports vừa opens; hai mệnh đề độc lập nhau","opens có định danh (opens ... to tên module) giữ được phần lớn tính đóng gói","Java 16 đổi mặc định sang deny, Java 17 (JEP 403) đóng hẳn JDK internals"],"trap":"Thêm exports rồi vẫn gặp InaccessibleObjectException và tưởng cấu hình sai. Không sai — exports không bao giờ cho phép deep reflection; phải dùng opens.","followUp":["Nếu entity chỉ dùng nội bộ, bạn cần exports, opens, hay cả hai?","Vì sao Hibernate lại ghi thẳng vào field thay vì gọi setter?"]},{"id":"t-11-4","topicId":11,"versions":[11,17,21],"title":"Migration từng bước: unnamed module, automatic module, split package","summary":"JPMS được thiết kế để cho phép chuyển dần — hiểu ba khái niệm này là hiểu toàn bộ con đường migration.","sections":["<b>Unnamed module — tất cả những gì nằm trên classpath.</b> Mọi class nạp từ classpath thuộc về một module đặc biệt không tên. Nó <i>đọc được mọi module</i> và <i>export toàn bộ package</i> của mình, nên code cũ chạy y như trước. Chiều ngược lại là giới hạn then chốt: một named module <b>không thể</b> <code>requires</code> unnamed module, vì unnamed module không có tên để mà khai báo. Hệ quả thực tế: bạn phải module hoá từ dưới lên, thư viện nền trước, ứng dụng sau.","<b>Automatic module — cầu nối cho JAR chưa module hoá.</b> Đặt một JAR không có <code>module-info.class</code> lên <b>module path</b> thì nó trở thành automatic module. Tên lấy từ manifest <code>Automatic-Module-Name</code> nếu có; nếu không, suy ra từ tên file (bỏ phần version, thay ký tự không hợp lệ bằng dấu chấm) — cách thứ hai rất mong manh vì đổi tên file là đổi tên module. Automatic module <i>export toàn bộ</i> package và <i>đọc được</i> mọi module đã resolve, kể cả unnamed module. Nhưng phần implied readability phải nói cho đúng, vì rất hay bị phóng đại: automatic module chỉ <code>requires transitive</code> <b>các automatic module khác</b>. Nghĩa là module của bạn <code>requires auto.one</code> thì đọc ké được <code>auto.two</code>, nhưng <b>không</b> vì thế mà đọc được một explicit module như <code>java.sql</code> — javac vẫn báo &quot;package java.sql is declared in module java.sql, but module com.acme.app does not read it&quot;, kể cả khi bạn đã <code>--add-modules java.sql</code>. Muốn dùng thì vẫn phải tự <code>requires java.sql</code>. Nó là lối thoát để module của bạn <code>requires</code> được thư viện chưa module hoá.","<b>Vì sao Automatic-Module-Name quan trọng với tác giả thư viện.</b> Chỉ cần thêm một dòng vào manifest là thư viện có tên module ổn định, người dùng <code>requires</code> được, mà không phải cam kết gì về cấu trúc module thật. Đây là bước 'nửa vời' được khuyến nghị chính thức và rất nhiều thư viện phổ biến dừng lại ở đúng bước này.","<b>Split package — lỗi chặn đứng migration hay gặp nhất.</b> JPMS cấm hai module cùng chứa class trong một package; JVM sẽ từ chối khởi động với thông báo kiểu <code>Package ... in both module A and module B</code>. Trong hệ sinh thái cũ điều này rất phổ biến: các JAR JAXB/annotation tách nhỏ cùng đóng góp vào <code>javax.annotation</code>, hay các JAR shaded chồng lấn nhau. Cách xử lý là gộp JAR, loại bớt dependency, hoặc để cả hai trên classpath (unnamed module không bị luật này ràng buộc).","<b>Chiến lược thực tế: bottom-up.</b> Bắt đầu bằng <code>jdeps</code> để phát hiện phụ thuộc vào JDK internals và các split package. Sau đó chuyển dependency lên module path dần, giữ code ứng dụng trên classpath càng lâu càng tốt. Chỉ khi mọi thứ mình cần đã có tên module ổn định thì mới viết <code>module-info.java</code> cho ứng dụng — viết sớm quá sẽ mắc kẹt vì phải <code>requires</code> những automatic module có tên suy ra từ tên file.","<b>Cờ thoát hiểm khi không sửa được thư viện bên thứ ba.</b> <code>--add-opens</code> mở deep reflection lúc runtime, <code>--add-exports</code> mở public API ở cả javac lẫn runtime, <code>--add-reads</code> thêm quan hệ đọc. Đích <code>ALL-UNNAMED</code> nghĩa là 'cho mọi thứ trên classpath'. Lưu ý <code>--add-opens</code> là cờ <b>thuần runtime</b>: <code>javac</code> vẫn <i>nhận</i> nó nhưng bỏ qua và cảnh báo <code>warning: [options] --add-opens has no effect at compile time</code>, chứ không báo lỗi — nên đừng nói &quot;javac không nhận&quot;, hãy nói &quot;javac nhận nhưng nó không có tác dụng lúc biên dịch&quot;. Với JAR chạy bằng <code>java -jar</code>, có thể ghi các attribute <code>Add-Opens</code>/<code>Add-Exports</code> vào manifest thay vì bắt người dùng gõ cờ."],"example":"# Phat hien phu thuoc vao JDK internals truoc khi nang phien ban\njdeps --jdk-internals --multi-release 21 target/app.jar\n\n# Sinh module-info goi y cho cac JAR chua module hoa\njdeps --generate-module-info ./out target/lib/legacy-1.2.jar\n\n# Cho thu vien cu dung reflection vao java.base\njava --add-opens java.base/java.lang=ALL-UNNAMED \\\n     --add-opens java.base/java.util=ALL-UNNAMED \\\n     -jar app.jar\n\n# Mo public API noi bo cua JDK cho ca javac va runtime\njavac --add-exports jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED ...","exampleTitle":"jdeps và các cờ thoát hiểm","keyPoints":["Unnamed module đọc được mọi thứ, nhưng named module không thể requires nó","Automatic module = JAR không có module-info nhưng đặt trên module path","Automatic-Module-Name trong manifest cho tên ổn định, không phụ thuộc tên file","Split package làm JVM từ chối khởi động — đây là rào cản migration lớn nhất","--add-opens là cờ thuần runtime: javac nhận nhưng chỉ cảnh báo 'has no effect at compile time'; --add-exports thì có tác dụng ở cả javac lẫn runtime"],"trap":"Nghĩ rằng cứ để JAR ở đâu cũng như nhau. Cùng một JAR: nằm trên classpath thì thuộc unnamed module, nằm trên module path thì thành automatic module — hai hành vi khác hẳn nhau về đóng gói và về luật split package.","followUp":["Vì sao phải module hoá từ thư viện nền lên chứ không phải từ ứng dụng xuống?","Automatic module suy tên từ tên file thì rủi ro gì khi nâng version dependency?"]},{"id":"t-11-5","topicId":11,"versions":[11,17,21],"title":"jlink, runtime image gọn, và trade-off: có nên module hoá không?","summary":"Lợi ích lớn nhất của JPMS trong thực tế lại là công cụ đóng gói, chứ không phải mô hình đóng gói code.","sections":["<b><code>jlink</code> làm gì.</b> Nó ghép các module bạn chỉ định cùng phần JDK cần thiết thành một runtime image độc lập có sẵn launcher — người dùng không cần cài JRE. Với ứng dụng chỉ dùng <code>java.base</code>, image có thể xuống quanh mức vài chục MB thay vì hàng trăm MB của JDK đầy đủ; con số cụ thể phụ thuộc nền tảng và các tuỳ chọn nén nên đừng học thuộc một con số. Điều này rất có giá trị cho image Docker và cho công cụ CLI.","<b>Điều kiện ngặt của jlink.</b> <code>jlink</code> chỉ nhận modular JAR — nó <b>từ chối automatic module</b>. Nghĩa là muốn dựng image chỉ chứa đúng phần cần, toàn bộ cây phụ thuộc phải đã có <code>module-info</code> thật. Đây là lý do nhiều dự án muốn dùng jlink nhưng không dùng được. Giải pháp thường thấy là chỉ jlink phần JDK (chọn các module <code>java.*</code> cần thiết) rồi vẫn chạy ứng dụng trên classpath bên trong image đó — cách này hoàn toàn hợp lệ và phổ biến hơn nhiều so với module hoá toàn bộ.","<b><code>jdeps</code> là công cụ đi kèm quan trọng.</b> Nó phân tích bytecode để liệt kê module JDK mà code bạn thực sự chạm tới, phát hiện việc dùng JDK internals (<code>--jdk-internals</code>), và sinh khung <code>module-info</code> (<code>--generate-module-info</code>). Ngay cả khi không định module hoá, chạy <code>jdeps --jdk-internals</code> trước mỗi lần nâng LTS là việc nên làm để biết trước cái gì sẽ vỡ.","<b>Lợi ích thật của strong encapsulation.</b> Với thư viện có nhiều người dùng, việc chặn được truy cập vào package nội bộ là giá trị lớn: bạn refactor bên trong mà không sợ phá vỡ ai. Với ứng dụng nghiệp vụ nội bộ nơi mọi thứ nằm cùng một repo và một team, lợi ích này nhỏ hơn nhiều so với chi phí.","<b>Chi phí thực tế — nên nói thẳng khi phỏng vấn.</b> Rất nhiều thư viện phổ biến chỉ dừng ở <code>Automatic-Module-Name</code> chứ không có module-info thật. Các framework dựa nặng vào reflection và classpath scanning (Spring Boot với fat JAR, các agent instrumentation) không hợp với mô hình module. Công cụ build, IDE và test runner đều cần cấu hình thêm. Vì thế phần lớn ứng dụng doanh nghiệp hiện nay vẫn chạy trên classpath — điều đó là hợp lý chứ không phải lạc hậu.","<b>Câu trả lời cân bằng cho câu hỏi 'dự án anh có dùng module không'.</b> Nói rõ rằng bạn hưởng lợi từ JPMS <i>gián tiếp</i> mỗi ngày: JDK đã được module hoá, strong encapsulation của JDK internals buộc code phải sạch hơn, và các cờ <code>--add-opens</code> trong cấu hình build là hệ quả trực tiếp. Còn module hoá code ứng dụng thì chỉ đáng làm khi bạn phát hành thư viện, cần jlink thật sự, hoặc muốn ép ranh giới kiến trúc ở mức compiler."],"example":"# Xem ung dung can nhung module JDK nao\njdeps --print-module-deps --ignore-missing-deps target/app.jar\n# vi du ket qua: java.base,java.sql,java.net.http\n\n# Dung runtime image chi chua nhung module do\n# Tu JDK 21, --compress=2 da bi deprecated; dung dang zip-N (mac dinh zip-6)\njlink \\\n  --add-modules java.base,java.sql,java.net.http \\\n  --strip-debug --no-header-files --no-man-pages \\\n  --compress=zip-6 \\\n  --output ./runtime\n\n# Chay ung dung tren classpath ben trong image vua dung\n./runtime/bin/java -cp app.jar:lib/* com.acme.Main","exampleTitle":"jlink phần JDK nhưng vẫn chạy app trên classpath","keyPoints":["jlink dựng runtime image độc lập, rất hợp cho Docker và CLI","jlink không chấp nhận automatic module — đây là rào cản lớn nhất","Có thể jlink riêng phần JDK rồi vẫn chạy ứng dụng trên classpath","jdeps --jdk-internals nên chạy trước mỗi lần nâng LTS","Đa số ứng dụng doanh nghiệp vẫn dùng classpath; điều đó là lựa chọn hợp lý"],"trap":"Nói 'module giúp app nhẹ hơn' mà không phân biệt được rằng cái làm image nhẹ là jlink chứ không phải bản thân module-info, và jlink lại đòi toàn bộ cây phụ thuộc phải modular.","followUp":["Nếu một dependency chỉ có Automatic-Module-Name thì jlink có dùng được không?","Ngoài kích thước image, jlink còn mang lại lợi ích gì về bảo mật?"]},{"id":"t-12-1","topicId":12,"versions":[11,17,21],"title":"Vì sao Java 11 thay HttpURLConnection bằng java.net.http","summary":"HttpURLConnection là API từ Java 1.1, không có HTTP/2, khó dùng và gần như không sửa được — HttpClient là bản viết lại từ đầu.","sections":["<b>Vấn đề của <code>HttpURLConnection</code>.</b> Nó ra đời từ Java 1.1 với mô hình protocol handler tổng quát cho cả <code>ftp:</code> và <code>gopher:</code>, nên API không phản ánh khái niệm HTTP. Bạn cấu hình bằng cách gọi setter theo đúng thứ tự, đọc body lỗi ở <code>getErrorStream()</code> chứ không phải <code>getInputStream()</code>, và không có cách gọn nào để gửi request body. Nó cũng giữ trạng thái nên không thread-safe, chỉ dùng được một lần cho một request.","<b>Những giới hạn không sửa được.</b> Chỉ HTTP/1.1, chỉ blocking I/O, không hỗ trợ WebSocket, và mọi thay đổi hành vi đều rủi ro phá vỡ code cũ có sẵn trên toàn thế giới. Vì thế nhóm JDK chọn viết một API mới trong package mới thay vì vá cái cũ — <code>HttpURLConnection</code> vẫn tồn tại và vẫn chạy, không hề bị xoá.","<b>Dòng thời gian phiên bản — hay bị hỏi.</b> API xuất hiện lần đầu ở Java 9 dưới dạng incubator trong package <code>jdk.incubator.http</code>, tiếp tục incubate ở Java 10, rồi được chuẩn hoá ở <b>Java 11</b> (JEP 321) trong package <code>java.net.http</code> thuộc module <code>java.net.http</code>. Điều này có nghĩa code viết cho bản incubator ở Java 9/10 <i>không</i> chạy được trên Java 11 vì package đã đổi tên — incubator không cam kết tương thích, đó chính là mục đích của cơ chế incubator.","<b>Ba lớp trung tâm.</b> <code>HttpClient</code> giữ cấu hình dùng chung (phiên bản HTTP, timeout kết nối, proxy, redirect, cookie, executor, SSLContext). <code>HttpRequest</code> là đối tượng bất biến mô tả một lời gọi. <code>HttpResponse&lt;T&gt;</code> mang status, header và body đã được chuyển thành kiểu <code>T</code>. Cả ba đều dùng builder và đều bất biến sau khi build.","<b>Điểm thiết kế đáng nói khi phỏng vấn: body là một chiến lược, không phải một kiểu cố định.</b> Request body do <code>HttpRequest.BodyPublishers</code> tạo ra, response body do <code>HttpResponse.BodyHandlers</code> xử lý. Bên dưới chúng là <code>Flow.Publisher</code>/<code>Flow.Subscriber</code> của Reactive Streams có sẵn trong JDK 9, nên API vừa hỗ trợ streaming vừa cho phép viết handler tuỳ biến mà không phải nạp cả body vào bộ nhớ.","<b>Module hoá.</b> <code>java.net.http</code> là một module riêng chứ không nằm trong <code>java.base</code>. Chạy trên classpath thì không cần làm gì vì nó nằm trong tập module gốc mặc định, nhưng nếu ứng dụng của bạn có <code>module-info.java</code> thì phải khai báo <code>requires java.net.http;</code>."],"example":"// Java 11+\nHttpClient client = HttpClient.newBuilder()\n        .connectTimeout(Duration.ofSeconds(5))\n        .followRedirects(HttpClient.Redirect.NORMAL)\n        .build();\n\nHttpRequest request = HttpRequest.newBuilder()\n        .uri(URI.create(\"https://api.example.com/orders/42\"))\n        .timeout(Duration.ofSeconds(10))\n        .header(\"Accept\", \"application/json\")\n        .GET()\n        .build();\n\nHttpResponse<String> response =\n        client.send(request, HttpResponse.BodyHandlers.ofString());\n\nSystem.out.println(response.statusCode());  // vi du 200\nSystem.out.println(response.body());","exampleTitle":"Request GET đồng bộ cơ bản","keyPoints":["HttpURLConnection có trạng thái, không thread-safe, chỉ HTTP/1.1","HttpClient incubate ở Java 9/10 (jdk.incubator.http), chuẩn hoá ở Java 11 (java.net.http)","Code viết cho bản incubator không tương thích với bản chuẩn vì đổi package","BodyPublishers/BodyHandlers dựa trên Flow API nên hỗ trợ streaming","Ứng dụng có module-info phải khai báo requires java.net.http"],"trap":"Nói HttpClient có từ Java 9. Đúng một nửa: Java 9 chỉ có bản incubator ở package khác; bản chuẩn hoá và ổn định API là Java 11.","followUp":["Vì sao JDK không nâng cấp thẳng HttpURLConnection lên HTTP/2?","Cơ chế incubator module dùng để làm gì và nó khác preview feature ra sao?"]},{"id":"t-12-2","topicId":12,"versions":[11,17,21],"title":"Vòng đời HttpClient: bất biến, thread-safe, và AutoCloseable từ Java 21","summary":"Tạo HttpClient cho mỗi request là lỗi hiệu năng nghiêm trọng nhất khi dùng API này, và trước Java 21 còn là rò rỉ tài nguyên.","sections":["<b>HttpClient là bất biến và thread-safe.</b> Sau khi <code>build()</code>, không có setter nào thay đổi được cấu hình, và nhiều thread có thể gọi <code>send()</code>/<code>sendAsync()</code> đồng thời trên cùng một instance. Vì thế mô hình dùng đúng là <b>một instance dùng chung cho toàn ứng dụng</b> (hoặc một instance cho mỗi nhóm cấu hình khác nhau), khai báo thành field <code>static final</code> hoặc một bean singleton.","<b>Vì sao tạo mới mỗi lần lại đắt.</b> Mỗi <code>HttpClient</code> mang theo connection pool riêng, một selector thread quản lý I/O bất đồng bộ, và một executor cho tác vụ async nếu bạn không truyền executor của mình. Tạo mới cho mỗi request nghĩa là vứt bỏ toàn bộ connection đang mở, bắt tay TLS lại từ đầu mỗi lần, và không bao giờ tận dụng được multiplexing của HTTP/2.","<b>Trước Java 21 không có cách đóng.</b> Đây là chi tiết mà người phỏng vấn có kinh nghiệm rất hay hỏi: ở Java 11–20, <code>HttpClient</code> không implement <code>AutoCloseable</code> và không có method <code>close()</code>. Tài nguyên chỉ được giải phóng khi instance không còn tham chiếu và bị GC dọn, nên vòng lặp tạo client liên tục sẽ tích luỹ thread và socket — biểu hiện điển hình là số thread tăng dần rồi <code>OutOfMemoryError: unable to create native thread</code>.","<b>Java 21 bổ sung vòng đời tường minh.</b> Từ JDK 21, <code>HttpClient</code> implement <code>AutoCloseable</code> và có <code>close()</code>, <code>shutdown()</code>, <code>shutdownNow()</code>, <code>awaitTermination()</code>. <code>close()</code> chặn cho tới khi mọi request đang chạy hoàn tất, còn <code>shutdownNow()</code> huỷ chúng. Lưu ý sắc thái quan trọng: việc client giờ dùng được trong try-with-resources <b>không</b> có nghĩa là nên tạo mới cho mỗi request — nó chỉ giải quyết bài toán tắt gọn khi ứng dụng dừng hoặc khi một tác vụ ngắn hạn thật sự cần client riêng.","<b>Cấu hình nên đặt ở cấp client hay cấp request.</b> Ở cấp client: <code>connectTimeout</code>, <code>version</code>, <code>followRedirects</code>, <code>proxy</code>, <code>authenticator</code>, <code>cookieHandler</code>, <code>sslContext</code>, <code>executor</code>. Ở cấp request: URI, method, header, body, và <code>timeout</code> cho toàn bộ vòng đời request. Đây là ranh giới hay bị hỏi vặn vì hai loại timeout dễ nhầm với nhau.","<b>Executor mặc định.</b> Nếu không truyền executor, client tự tạo một thread pool nội bộ cho công việc bất đồng bộ. Trong ứng dụng cần kiểm soát (đặt tên thread, giới hạn kích thước, tích hợp metric), nên truyền executor của mình — và chịu trách nhiệm tự tắt nó, vì <code>close()</code> chỉ dọn executor do chính client tạo ra."],"example":"// Dung: mot instance dung chung cho ca ung dung\npublic final class ApiClient {\n    private static final HttpClient CLIENT = HttpClient.newBuilder()\n            .connectTimeout(Duration.ofSeconds(3))\n            .build();\n\n    public static String get(String url) throws Exception {\n        HttpRequest req = HttpRequest.newBuilder(URI.create(url))\n                .timeout(Duration.ofSeconds(10))\n                .build();\n        return CLIENT.send(req, HttpResponse.BodyHandlers.ofString()).body();\n    }\n}\n\n// Java 21+: HttpClient la AutoCloseable\ntry (HttpClient shortLived = HttpClient.newHttpClient()) {\n    shortLived.send(request, HttpResponse.BodyHandlers.discarding());\n}   // close() cho cac request dang chay ket thuc\n\n// SAI trong moi phien ban: tao client trong vong lap\nfor (String url : urls) {\n    HttpClient c = HttpClient.newHttpClient();   // ro ri thread + socket\n    c.send(HttpRequest.newBuilder(URI.create(url)).build(),\n           HttpResponse.BodyHandlers.ofString());\n}","exampleTitle":"Dùng chung một instance, và close() của Java 21","keyPoints":["HttpClient bất biến và thread-safe — dùng chung một instance là mô hình đúng","Mỗi client mang connection pool, selector thread và executor riêng","Java 11–20 không có close(); tài nguyên chỉ được thu hồi khi GC dọn","Java 21 thêm AutoCloseable với close()/shutdown()/shutdownNow()/awaitTermination()","connectTimeout đặt ở client, timeout đặt ở request — hai thứ khác nhau"],"trap":"Thấy Java 21 cho phép try-with-resources rồi kết luận nên bọc mọi lời gọi trong try-with-resources. Làm vậy là tạo client mới mỗi request, mất sạch connection pool và HTTP/2 multiplexing.","followUp":["Nếu bạn truyền executor của mình vào builder thì close() có tắt executor đó không?","Trên Java 17, làm sao phát hiện ứng dụng đang rò rỉ HttpClient?"]},{"id":"t-12-3","topicId":12,"versions":[11,17,21],"title":"send vs sendAsync, BodyPublishers và BodyHandlers","summary":"Hai chế độ gọi và hai họ lớp xử lý body là phần API bạn chạm vào mỗi ngày — và là nơi ẩn nhiều bẫy về xử lý lỗi.","sections":["<b><code>send()</code> — đồng bộ, chặn thread gọi.</b> Nó khai báo <code>throws IOException, InterruptedException</code>. Việc có <code>InterruptedException</code> là chi tiết đáng lưu ý: nếu thread bị interrupt trong lúc chờ, request sẽ bị huỷ, và bạn nên khôi phục cờ interrupt bằng <code>Thread.currentThread().interrupt()</code> thay vì nuốt ngoại lệ.","<b><code>sendAsync()</code> — trả <code>CompletableFuture&lt;HttpResponse&lt;T&gt;&gt;</code>.</b> Nó không ném checked exception; lỗi được chuyển thành future hoàn tất theo nhánh lỗi. Đây là bẫy hay gặp nhất: nếu bạn không gắn <code>exceptionally()</code>/<code>handle()</code> và cũng không bao giờ <code>join()</code>, lỗi sẽ biến mất hoàn toàn không để lại dấu vết nào trong log. Khi <code>join()</code>, ngoại lệ gốc bị bọc trong <code>CompletionException</code> nên phải lấy <code>getCause()</code> mới thấy nguyên nhân thật.","<b>Callback chạy trên thread nào.</b> Các stage nối sau bằng <code>thenApply</code>/<code>thenAccept</code> chạy trên executor của client (hoặc thread hoàn tất future). Vì thế đặt công việc nặng hoặc lời gọi chặn ngay trong các stage này có thể làm nghẽn chính cơ chế I/O của client. Nếu cần xử lý tốn thời gian, hãy dùng biến thể <code>...Async(fn, myExecutor)</code> để đẩy sang pool riêng.","<b><code>HttpRequest.BodyPublishers</code> — nguồn dữ liệu gửi đi.</b> Các lựa chọn thường dùng: <code>ofString</code>, <code>ofByteArray</code>, <code>ofFile</code> (streaming, không nạp cả file vào bộ nhớ), <code>ofInputStream</code> (nhận <code>Supplier</code> để có thể đọc lại khi cần gửi lại), và <code>noBody</code>. Đáng chú ý là JDK <b>không</b> có sẵn publisher cho multipart/form-data — bạn phải tự dựng body, và đây thường là lý do người ta quay lại dùng OkHttp.","<b><code>HttpResponse.BodyHandlers</code> — cách biến body thành kiểu bạn muốn.</b> <code>ofString</code>, <code>ofByteArray</code>, <code>ofFile</code>, <code>ofLines</code> (trả <code>Stream&lt;String&gt;</code>, hợp cho server-sent events hoặc file lớn), <code>ofInputStream</code>, <code>discarding</code>, và <code>buffering</code>. Quan trọng: <code>ofString()</code> và <code>ofByteArray()</code> nạp <b>toàn bộ</b> body vào heap, nên tải file lớn bằng chúng là con đường ngắn nhất tới <code>OutOfMemoryError</code>.","<b>Bẫy lớn nhất: HTTP lỗi không phải là exception.</b> Response 404 hay 500 vẫn là một response hợp lệ — <code>send()</code> trả về bình thường và không ném gì cả. Bạn <b>phải</b> tự kiểm tra <code>response.statusCode()</code>. Nhiều bug thực tế đến từ việc code chỉ bắt <code>IOException</code> rồi coi mọi thứ khác là thành công, và một body lỗi dạng HTML bị parse thành JSON."],"example":"// Bat dong bo, co xu ly loi day du\nCompletableFuture<String> future = client\n        .sendAsync(request, HttpResponse.BodyHandlers.ofString())\n        .thenApply(res -> {\n            if (res.statusCode() / 100 != 2) {          // PHAI tu kiem tra\n                throw new IllegalStateException(\"HTTP \" + res.statusCode());\n            }\n            return res.body();\n        })\n        .thenApplyAsync(body -> parseHeavy(body), workerPool)  // viec nang -> pool rieng\n        .exceptionally(ex -> {                          // khong co dong nay thi loi bien mat\n            log.error(\"Goi API that bai\", ex);\n            return null;\n        });\n\n// Tai file lon: dung ofFile thay vi ofString\nHttpResponse<Path> file = client.send(request,\n        HttpResponse.BodyHandlers.ofFile(Path.of(\"/tmp/report.pdf\")));\n\n// Doc theo dong, khong nap het vao heap\nHttpResponse<Stream<String>> lines = client.send(request,\n        HttpResponse.BodyHandlers.ofLines());","exampleTitle":"sendAsync có xử lý lỗi, và chọn BodyHandler theo kích thước dữ liệu","keyPoints":["send() ném IOException và InterruptedException; nhớ khôi phục cờ interrupt","sendAsync() chuyển lỗi vào future — không gắn exceptionally là mất lỗi","join() bọc ngoại lệ trong CompletionException, phải getCause() mới thấy gốc","ofString/ofByteArray nạp toàn bộ body vào heap; file lớn phải dùng ofFile hoặc ofLines","Status 4xx/5xx không ném exception — luôn tự kiểm tra statusCode()"],"trap":"Chỉ bọc lời gọi trong try/catch IOException rồi coi mọi trường hợp không ném là thành công. Response 500 với body HTML sẽ đi thẳng vào parser JSON và tạo ra lỗi rất khó lần.","followUp":["Vì sao ofInputStream của BodyPublishers nhận Supplier chứ không nhận trực tiếp InputStream?","Nếu bạn chạy tác vụ nặng trong thenApply thì ảnh hưởng gì tới các request khác của cùng client?"]},{"id":"t-12-4","topicId":12,"versions":[11,17,21],"title":"HTTP/2, timeout, redirect và cookie — những mặc định cần nhớ","summary":"Phần lớn sự cố production với HttpClient đến từ việc không biết giá trị mặc định của nó khác với thư viện quen dùng.","sections":["<b>Mặc định là HTTP/2 với cơ chế lùi về HTTP/1.1.</b> Client thử HTTP/2 trước; với HTTPS việc chọn phiên bản diễn ra qua ALPN trong lúc bắt tay TLS, với HTTP thường thì qua cơ chế upgrade. Server không hỗ trợ thì tự động dùng HTTP/1.1, và bạn đọc được phiên bản thực tế qua <code>response.version()</code>. Lợi ích lớn nhất của HTTP/2 ở đây là multiplexing: nhiều request song song đi chung một kết nối TCP, nên việc dùng chung một <code>HttpClient</code> càng có giá trị.","<b>Hai loại timeout, đừng nhầm.</b> <code>HttpClient.Builder.connectTimeout(Duration)</code> giới hạn thời gian thiết lập kết nối; vượt quá sẽ ném <code>HttpConnectTimeoutException</code>. <code>HttpRequest.Builder.timeout(Duration)</code> giới hạn toàn bộ vòng đời request cho tới khi nhận xong response headers/body tuỳ ngữ cảnh; vượt quá sẽ ném <code>HttpTimeoutException</code>. Cả hai đều kế thừa <code>IOException</code> (<code>HttpConnectTimeoutException</code> là con của <code>HttpTimeoutException</code>).","<b>Mặc định không có timeout nào cả.</b> Đây là bẫy production nghiêm trọng: nếu bạn không đặt gì, request có thể treo rất lâu tuỳ tầng mạng và OS. Trong hệ thống có thread pool giới hạn, vài chục request treo là đủ để làm cạn pool và kéo sập cả service. Quy tắc: luôn đặt cả <code>connectTimeout</code> lẫn <code>timeout</code>.","<b>Redirect mặc định là <code>NEVER</code>.</b> Rất nhiều người quen với thư viện tự đi theo redirect nên bị bất ngờ khi nhận về status 301/302 với body rỗng. Ba lựa chọn: <code>NEVER</code>, <code>ALWAYS</code>, và <code>NORMAL</code> — <code>NORMAL</code> đi theo redirect trừ trường hợp chuyển từ HTTPS xuống HTTP, tức là an toàn hơn <code>ALWAYS</code> và là lựa chọn nên dùng.","<b>Cookie mặc định bị bỏ qua.</b> Client không lưu cookie trừ khi bạn gắn <code>cookieHandler(new CookieManager())</code>. Điều này hợp lý cho API client thuần tuý nhưng gây khó hiểu khi gọi endpoint dựa trên session. Lưu ý <code>CookieManager</code> mặc định dùng bộ nhớ trong tiến trình và có chính sách chấp nhận cấu hình được qua <code>CookiePolicy</code>.","<b>Header bị cấm và các chi tiết nhỏ hay vấp.</b> Một số header do client tự quản lý (như <code>Host</code>, <code>Content-Length</code>, <code>Connection</code>, <code>Upgrade</code>) không được đặt thủ công, cố tình đặt sẽ nhận <code>IllegalArgumentException</code>. Ngoài ra <code>HttpHeaders</code> trả về là bất biến và tra cứu không phân biệt hoa thường, truy cập qua <code>response.headers().firstValue(\"content-type\")</code> trả <code>Optional</code>."],"example":"HttpClient client = HttpClient.newBuilder()\n        .version(HttpClient.Version.HTTP_2)          // mac dinh, ghi ro cho tuong minh\n        .connectTimeout(Duration.ofSeconds(3))        // mac dinh: khong gioi han\n        .followRedirects(HttpClient.Redirect.NORMAL)  // mac dinh: NEVER\n        .cookieHandler(new CookieManager())           // mac dinh: khong luu cookie\n        .build();\n\nHttpRequest req = HttpRequest.newBuilder(URI.create(\"https://api.example.com/v1/me\"))\n        .timeout(Duration.ofSeconds(10))              // mac dinh: khong gioi han\n        .header(\"Authorization\", \"Bearer \" + token)\n        .build();\n\ntry {\n    HttpResponse<String> res = client.send(req, HttpResponse.BodyHandlers.ofString());\n    System.out.println(res.version());   // HTTP_2 hoac HTTP_1_1\n    res.headers().firstValue(\"content-type\").ifPresent(System.out::println);\n} catch (HttpConnectTimeoutException e) {\n    // khong ket noi duoc trong 3s\n} catch (HttpTimeoutException e) {\n    // ket noi duoc nhung khong xong trong 10s\n} catch (IOException e) {\n    // loi mang khac\n} catch (InterruptedException e) {\n    Thread.currentThread().interrupt();\n    throw new IllegalStateException(e);\n}","exampleTitle":"Cấu hình tường minh mọi mặc định quan trọng","keyPoints":["Mặc định HTTP/2, tự lùi về HTTP/1.1; kiểm tra bằng response.version()","Mặc định KHÔNG có connectTimeout và KHÔNG có request timeout","HttpConnectTimeoutException là con của HttpTimeoutException, cả hai là IOException","Redirect mặc định là NEVER; nên dùng NORMAL thay vì ALWAYS","Cookie bị bỏ qua nếu không gắn CookieManager"],"trap":"Bắt HttpTimeoutException trước HttpConnectTimeoutException trong chuỗi catch sẽ khiến nhánh connect timeout không bao giờ chạy, vì lớp con phải đứng trước lớp cha.","followUp":["Vì sao Redirect.NORMAL an toàn hơn Redirect.ALWAYS?","Nếu server không hỗ trợ HTTP/2 thì việc đặt version(HTTP_2) có làm request thất bại không?"]},{"id":"t-12-5","topicId":12,"versions":[11,17,21],"title":"HttpClient với virtual thread, retry, và vì sao nhiều dự án vẫn dùng OkHttp/Feign","summary":"Java 21 làm mô hình blocking đơn giản trở lại đúng đắn, nhưng HttpClient vẫn thiếu nhiều thứ mà thư viện ngoài đã có sẵn.","sections":["<b>Virtual thread đổi lại cán cân giữa blocking và async.</b> Từ Java 21 (JEP 444), virtual thread rẻ tới mức có thể tạo hàng trăm nghìn cái. Khi một virtual thread chặn tại <code>client.send()</code>, JVM tháo nó khỏi carrier thread nên carrier vẫn phục vụ việc khác. Kết quả là bạn viết code blocking tuần tự — dễ đọc, stack trace đầy đủ, debug và try/catch hoạt động tự nhiên — mà vẫn đạt mức song song trước đây phải dùng <code>sendAsync</code> với chuỗi <code>CompletableFuture</code>.","<b>Hệ quả thực tế cho thiết kế.</b> Trên Java 21, mặc định nên chọn <code>send()</code> chạy trong <code>Executors.newVirtualThreadPerTaskExecutor()</code>, và chỉ dùng <code>sendAsync</code> khi bạn thực sự cần compose future hoặc phải chạy trên phiên bản cũ hơn. Kết hợp với structured concurrency (vẫn ở dạng preview qua nhiều bản, nên không nên coi là API ổn định) thì mô hình fan-out gọi nhiều API rồi gộp kết quả trở nên rất gọn.","<b>Cảnh báo quan trọng khi dùng virtual thread.</b> Đừng gộp virtual thread vào pool cố định — hãy tạo một virtual thread cho mỗi tác vụ. Và đừng dùng <code>synchronized</code> quanh lời gọi mạng: ở JDK 21, thread bị pin vào carrier khi chặn bên trong khối <code>synchronized</code>, làm mất lợi ích scale; giải pháp là dùng <code>ReentrantLock</code>. Vấn đề pinning này đã được cải thiện ở các bản JDK sau 21, nên hãy nói rõ bạn đang nói về phiên bản nào.","<b>Retry: JDK không cho bạn nhiều.</b> <code>HttpClient</code> không có API cấu hình retry policy. Nó có xử lý lại nội bộ cho một số lỗi kết nối nhất định với method idempotent, nhưng đó không phải thứ bạn nên dựa vào. Trong thực tế bạn tự viết vòng lặp retry với exponential backoff kèm jitter, chỉ retry với method idempotent (GET, PUT, DELETE) và với status đáng retry (408, 429, 502, 503, 504), tôn trọng header <code>Retry-After</code>, và bọc bằng circuit breaker như Resilience4j.","<b>Những thứ HttpClient không có.</b> Không có multipart/form-data dựng sẵn, không có interceptor để log/thêm header tập trung, không có retry/circuit breaker, không có tích hợp serialization JSON, không có connection pool cấu hình được chi tiết (kích thước pool điều chỉnh qua system property chứ không qua API), và không có HTTP/3 trong các bản LTS 11/17/21. Đó là những khoảng trống mà OkHttp, Apache HttpClient 5, hay tầng khai báo như Feign/RestClient lấp vào.","<b>Khi nào chọn cái nào — câu trả lời cân bằng.</b> Với vài lời gọi HTTP đơn giản, dùng JDK là hợp lý nhất vì không thêm dependency, không lo CVE của thư viện ngoài. Với client API phức tạp, nhiều cross-cutting concern, hoặc cần multipart và retry chuẩn, dùng thư viện chuyên dụng tiết kiệm hơn nhiều so với tự viết lại. Trong hệ Spring, <code>RestClient</code> và <code>RestTemplate</code> (Spring 6.1+) có thể chạy trên nền <code>JdkClientHttpRequestFactory</code>, còn phía reactive thì <code>WebClient</code> dùng <code>org.springframework.http.client.reactive.JdkClientHttpConnector</code> — bạn vẫn dùng HttpClient của JDK nhưng có thêm interceptor và chuyển đổi JSON."],"example":"// Java 21: fan-out bang virtual thread, code van la blocking tuan tu\nList<String> urls = List.of(\"https://a/x\", \"https://b/y\", \"https://c/z\");\n\ntry (var executor = Executors.newVirtualThreadPerTaskExecutor()) {\n    List<Future<String>> futures = urls.stream()\n            .map(url -> executor.submit(() -> {\n                HttpRequest r = HttpRequest.newBuilder(URI.create(url))\n                        .timeout(Duration.ofSeconds(5))\n                        .build();\n                // send() chan virtual thread, KHONG chan carrier thread\n                return CLIENT.send(r, HttpResponse.BodyHandlers.ofString()).body();\n            }))\n            .toList();\n\n    for (Future<String> f : futures) {\n        System.out.println(f.get());\n    }\n}\n\n// Retry thu cong: chi cho method idempotent, CO tran so lan thu + backoff kem jitter\nstatic final Set<Integer> RETRYABLE = Set.of(408, 429, 502, 503, 504);\nstatic final int MAX_ATTEMPTS = 3;\n\nHttpResponse<String> sendWithRetry(HttpRequest req) throws IOException, InterruptedException {\n    for (int attempt = 1; attempt <= MAX_ATTEMPTS; attempt++) {   // LUON co tran, khong while(true)\n        final int n = attempt;\n        long waitMs;\n        try {\n            HttpResponse<String> res = CLIENT.send(req, HttpResponse.BodyHandlers.ofString());\n            if (!RETRYABLE.contains(res.statusCode())) return res;  // 500/501/505 KHONG retry\n            if (attempt == MAX_ATTEMPTS) return res;                // het luot: tra ve nguyen trang\n            waitMs = res.headers().firstValue(\"Retry-After\")        // ton trong Retry-After\n                       .map(v -> parseRetryAfterMillis(v))\n                       .orElseGet(() -> backoffWithJitter(n));\n        } catch (IOException e) {\n            if (attempt == MAX_ATTEMPTS) throw e;\n            waitMs = backoffWithJitter(n);\n        }\n        Thread.sleep(waitMs);\n    }\n    throw new IllegalStateException(\"khong the toi day\");\n}\n\nlong backoffWithJitter(int attempt) {\n    long base = (long) (100 * Math.pow(2, attempt - 1));           // 100, 200, 400 ms\n    return base / 2 + ThreadLocalRandom.current().nextLong(base);  // jitter quanh base\n}\n\nLong parseRetryAfterMillis(String v) {   // tra null neu la HTTP-date -> Optional.map thanh empty\n    try { return Long.parseLong(v.trim()) * 1000; } catch (NumberFormatException e) { return null; }\n}","exampleTitle":"Fan-out bằng virtual thread và retry tự viết","keyPoints":["Virtual thread (Java 21) làm blocking send() trở thành mô hình đơn giản mà vẫn scale","Một virtual thread cho một tác vụ; không gộp vào pool cố định","Ở JDK 21, chặn bên trong synchronized làm pin virtual thread — dùng ReentrantLock","HttpClient không có API retry, interceptor, multipart hay HTTP/3 ở LTS 11/17/21","Chọn JDK cho nhu cầu đơn giản; chọn OkHttp/Feign khi cần cross-cutting concern"],"trap":"Cho rằng virtual thread tự khiến mọi thứ nhanh hơn. Nó chỉ giúp với tác vụ chặn vì I/O; với tác vụ tính toán nặng thì số core mới là giới hạn, và virtual thread không đem lại gì.","followUp":["Vì sao chỉ nên retry với method idempotent, và POST thì xử lý thế nào?","Trên Java 17 chưa có virtual thread, bạn chọn send() hay sendAsync() cho mô hình fan-out?"]},{"id":"t-13-1","topicId":13,"versions":[11,17,21],"title":"var là suy luận kiểu lúc biên dịch, không phải dynamic typing","summary":"Hiểu đúng bản chất của var để không rơi vào câu hỏi vặn 'var có biến Java thành ngôn ngữ động không'.","sections":["<b>Java vẫn là ngôn ngữ static typing, không thay đổi gì cả.</b> Khi gặp <code>var</code>, compiler suy ra kiểu từ biểu thức khởi tạo rồi ghi cố định kiểu đó cho biến. Biến vẫn có đúng một kiểu duy nhất trong suốt vòng đời và không bao giờ đổi được — <code>var x = 10; x = \"abc\";</code> là lỗi biên dịch. Điều duy nhất bạn tiết kiệm được là việc gõ tên kiểu ra, chứ không phải sự ràng buộc về kiểu.","<b>Bytecode sinh ra giống hệt như khi viết kiểu tường minh.</b> <code>var x = 10;</code> và <code>int x = 10;</code> cho ra cùng một class file (khác biệt duy nhất có thể xuất hiện là bảng debug tuỳ chọn về tên biến). Vì thế chi phí runtime của <code>var</code> đúng bằng không: không có phép kiểm tra kiểu lúc chạy, không có boxing, không có reflection. Đây là điểm khác biệt căn bản so với <code>var</code> của JavaScript hay biến trong Python, nơi kiểu thật sự được xác định lúc chạy.","<b>var không phải keyword mà là một 'reserved type name'.</b> Nhờ vậy code cũ vẫn tương thích: một biến, method hay package đặt tên <code>var</code> viết từ thời Java 8 vẫn biên dịch được trên các bản sau. Chỉ có một hạn chế là bạn không được đặt tên <i>class hay interface</i> là <code>var</code>. Đây là chi tiết nhỏ nhưng thỉnh thoảng được hỏi để kiểm tra xem ứng viên có đọc đặc tả hay chỉ dùng theo thói quen.","<b>Mốc phiên bản cần nhớ chính xác.</b> <code>var</code> cho biến local xuất hiện ở Java 10 (JEP 286); Java 11 mở rộng cho tham số lambda (JEP 323). Java 8 hoàn toàn không có <code>var</code>, nên mọi ví dụ dùng nó đều yêu cầu tối thiểu Java 11 trong các bản LTS. Từ Java 11 trở đi không có thay đổi ngữ nghĩa nào đáng kể cho <code>var</code> — nó hoạt động y hệt ở 17 và 21.","<b>var không tự động là final.</b> Biến khai báo bằng <code>var</code> vẫn gán lại được (miễn là cùng kiểu). Muốn bất biến thì viết <code>final var x = ...</code>, hoàn toàn hợp lệ. Ngược lại, một biến <code>var</code> chưa bị gán lại vẫn được coi là effectively final nên dùng được trong lambda bình thường.","<b>Cách trả lời gọn khi bị hỏi vặn.</b> 'var chỉ chuyển việc viết kiểu từ lập trình viên sang compiler; kiểu vẫn được kiểm tra đầy đủ lúc biên dịch, bytecode không đổi, và không có bất kỳ chi phí runtime nào.' Nếu người phỏng vấn hỏi tiếp 'vậy nó khác gì Object?', câu trả lời là: <code>Object</code> làm mất thông tin kiểu và buộc phải ép kiểu về sau, còn <code>var</code> giữ nguyên kiểu cụ thể nhất mà compiler suy ra được."],"example":"var count = 10;          // suy ra int\n// count = \"mười\";       // lỗi biên dịch: không gán String cho int\n\nvar name = \"Java\";       // String\nvar list = new ArrayList<String>();  // ArrayList<String>\nfinal var LIMIT = 100;   // vẫn dùng được final\n\n// var không phải keyword: dòng dưới vẫn hợp lệ\nint var = 5;\nSystem.out.println(var);\n\n// nhưng class không được đặt tên var:\n// class var { }         // lỗi biên dịch","exampleTitle":"var suy ra kiểu và bị ràng buộc kiểu như bình thường","keyPoints":["var là suy luận kiểu lúc biên dịch; biến vẫn có đúng một kiểu cố định.","Bytecode sinh ra giống hệt như viết kiểu tường minh, chi phí runtime bằng không.","var là reserved type name chứ không phải keyword: vẫn đặt tên biến là var được, nhưng không đặt tên class.","var cho biến local có từ Java 10; var cho tham số lambda có từ Java 11; Java 8 không có.","var không tự động final, nhưng final var là hợp lệ."],"trap":"Câu hỏi 'var có làm Java thành ngôn ngữ động không?' — trả lời 'có, giống JavaScript' là sai hoàn toàn. Kiểu được xác định và kiểm tra hết lúc biên dịch; không có gì được quyết định lúc chạy.","followUp":["Nếu var và int cho ra cùng bytecode thì thông tin về var còn nằm ở đâu trong class file?","var khác Object ở điểm nào khi khai báo biến?","Vì sao Java chọn làm var thành reserved type name thay vì một keyword thật sự?"]},{"id":"t-13-2","topicId":13,"versions":[11,17,21],"title":"var dùng được ở đâu và không dùng được ở đâu","summary":"Danh sách chính xác các vị trí hợp lệ của var, và lý do đằng sau từng chỗ bị cấm.","sections":["<b>var chỉ dành cho biến local, và bắt buộc phải có biểu thức khởi tạo.</b> Các vị trí hợp lệ gồm: biến local trong method, constructor hoặc block khởi tạo; biến chỉ số của vòng <code>for</code> cổ điển; biến của vòng <code>for-each</code>; và biến resource trong <code>try-with-resources</code>. Ở tất cả những chỗ này, compiler luôn có một biểu thức ngay bên phải để suy kiểu.","<b>Những chỗ bị cấm và lý do chung.</b> Không dùng được cho field (kể cả static), tham số method, tham số constructor, kiểu trả về, tham số của khối <code>catch</code>, hay tham số kiểu generic. Lý do thống nhất: đó đều là những chỗ tạo thành <i>API</i> hoặc giao diện của một thành phần, nơi kiểu cần được viết ra rõ ràng và ổn định; và ở nhiều chỗ trong số đó cũng không có biểu thức khởi tạo nào để suy kiểu.","<b>Không có khởi tạo thì không suy được kiểu.</b> <code>var x;</code> rồi gán ở dòng sau là không hợp lệ, dù compiler 'có vẻ' đoán được. Suy luận trong Java được giới hạn ở phạm vi một khai báo để dễ dự đoán và để thông báo lỗi có nghĩa, chứ không phải suy luận toàn cục kiểu Hindley-Milner như một số ngôn ngữ khác.","<b>Không dùng được với null, lambda hay method reference.</b> <code>var s = null;</code> bị từ chối vì kiểu của <code>null</code> là kiểu null đặc biệt, không phải một kiểu viết ra được. <code>var f = () -&gt; ...;</code> và <code>var g = String::valueOf;</code> cũng bị từ chối vì lambda và method reference là <i>poly expression</i>: bản thân chúng không có kiểu riêng mà lấy kiểu từ ngữ cảnh đích, mà ở đây ngữ cảnh đích lại chính là thứ ta đang muốn suy ra. Mẹo thoát: ép kiểu tường minh, ví dụ <code>var r = (Runnable) () -&gt; {};</code> là hợp lệ vì phép ép kiểu đã cung cấp kiểu đích.","<b>Không dùng được với cú pháp khởi tạo mảng rút gọn và không khai báo nhiều biến một dòng.</b> <code>var arr = {1, 2, 3};</code> sai vì <code>{1,2,3}</code> cũng không có kiểu độc lập; phải viết <code>var arr = new int[]{1, 2, 3};</code>. Ngoài ra <code>var a = 1, b = 2;</code> không hợp lệ, và cũng không được viết <code>var[] a</code> — dấu ngoặc vuông phải nằm ở phía biểu thức khởi tạo.","<b>Trường hợp var thực sự đáng dùng nhất.</b> Là vòng <code>for-each</code> trên collection có kiểu generic dài, ví dụ duyệt <code>Map&lt;String, List&lt;OrderItem&gt;&gt;</code>: viết <code>for (var entry : map.entrySet())</code> ngắn hơn hẳn mà không mất chút thông tin nào cho người đọc, vì kiểu đã hiện rõ ngay ở tên của map."],"example":"// HỢP LỆ\nvar total = 0;\nfor (var i = 0; i < 10; i++) { total += i; }\n\nMap<String, List<Integer>> map = new HashMap<>();\nfor (var entry : map.entrySet()) {\n    System.out.println(entry.getKey());\n}\n\ntry (var in = new BufferedReader(new FileReader(\"a.txt\"))) {\n    System.out.println(in.readLine());\n}\n\nvar r = (Runnable) () -> System.out.println(\"ok\"); // cast cung cấp kiểu đích\nvar arr = new int[]{1, 2, 3};\n\n// KHÔNG HỢP LỆ\n// var x;                      // thiếu khởi tạo\n// var s = null;               // không suy được kiểu\n// var f = () -> {};           // lambda cần kiểu đích\n// var g = String::valueOf;    // method reference cần kiểu đích\n// var nums = {1, 2, 3};       // khởi tạo mảng rút gọn\n// var a = 1, b = 2;           // nhiều biến một dòng\n// private var name = \"x\";     // field\n// void f(var x) { }           // tham số method","exampleTitle":"Hợp lệ và không hợp lệ","keyPoints":["var chỉ dùng cho biến local có khởi tạo, biến vòng for, biến for-each và resource trong try-with-resources.","Cấm ở field, tham số method/constructor, kiểu trả về, tham số catch và tham số generic.","null, lambda và method reference không có kiểu độc lập nên không suy được; ép kiểu tường minh là lối thoát.","Không dùng được với cú pháp mảng rút gọn {1,2,3}, không khai báo nhiều biến một dòng, không viết var[].","Chỗ var có giá trị rõ nhất là for-each trên generic dài dòng."],"trap":"Nhiều người tin rằng var x; rồi x = 5; ở dòng sau là hợp lệ vì compiler thừa sức suy ra. Java cố tình giới hạn suy luận trong phạm vi một khai báo duy nhất để giữ tính dự đoán được và để thông báo lỗi rõ ràng.","followUp":["Vì sao lambda cần kiểu đích, và cách ép kiểu lại làm cho var hợp lệ?","var có dùng được cho tham số của khối catch không, và vì sao?","Nếu var được cho phép ở field thì sẽ nảy sinh vấn đề gì với API công khai?"]},{"id":"t-13-3","topicId":13,"versions":[11,17,21],"title":"var suy ra kiểu gì: literal, diamond và kiểu không gọi tên được","summary":"Quy tắc suy kiểu của var, cái bẫy new ArrayList<>() và trường hợp var làm được điều mà kiểu tường minh không làm được.","sections":["<b>Với literal, kiểu suy ra là kiểu của chính literal.</b> <code>var i = 1;</code> cho <code>int</code>, <code>var l = 1L;</code> cho <code>long</code>, <code>var d = 1.0;</code> cho <code>double</code>, <code>var c = 'a';</code> cho <code>char</code>, <code>var s = \"x\";</code> cho <code>String</code>, <code>var b = true;</code> cho <code>boolean</code>. Không có bước mở rộng nào cả — nghĩa là <code>var x = 1;</code> rồi gán 3 tỉ vào sau đó sẽ hỏng, trong khi nếu bạn viết <code>long x = 1;</code> thì không. Đây là chỗ <code>var</code> âm thầm thu hẹp lựa chọn của bạn.","<b>Phép toán số học vẫn tuân theo numeric promotion.</b> <code>var c = 'x'; var n = c + 1;</code> cho <code>n</code> kiểu <code>int</code> với giá trị 121, không phải <code>char</code> 'y'. Người mới hay tưởng <code>var</code> sẽ 'giữ nguyên kiểu char'; thực tế <code>var</code> chỉ nhận lấy kiểu của biểu thức, và biểu thức <code>char + int</code> có kiểu <code>int</code> theo quy tắc có từ đầu của Java.","<b>Bẫy lớn nhất: var kết hợp với diamond.</b> <code>var list = new ArrayList&lt;&gt;();</code> biên dịch được nhưng suy ra <code>ArrayList&lt;Object&gt;</code>. Lý do: diamond cần một kiểu đích để suy tham số generic, mà khi vế trái là <code>var</code> thì không có kiểu đích nào, nên compiler lùi về ràng buộc yếu nhất là <code>Object</code>. Hậu quả xuất hiện muộn và khó hiểu — bạn <code>add</code> String vào bình thường nhưng <code>get</code> lại trả về <code>Object</code>. Quy tắc: dùng <code>var</code> thì phải ghi tham số generic ở vế phải (<code>new ArrayList&lt;String&gt;()</code>). Tương tự, <code>var l = List.of();</code> cho <code>List&lt;Object&gt;</code>.","<b>var giữ kiểu cụ thể của biểu thức, không giữ interface.</b> <code>var map = new HashMap&lt;String, Integer&gt;();</code> cho biến kiểu <code>HashMap</code> chứ không phải <code>Map</code>. Về mặt kỹ thuật không sai, nhưng về mặt thiết kế nó khoá biến vào một implementation cụ thể: code phía sau có thể vô tình gọi method riêng của <code>HashMap</code>, và khi cần đổi sang <code>LinkedHashMap</code> hay <code>TreeMap</code> thì việc đổi không còn là sửa một chỗ. Đây là lý do thực dụng nhất để viết kiểu tường minh cho các biến quan trọng.","<b>Ngược lại, var làm được một điều mà kiểu tường minh không làm được: giữ kiểu không gọi tên được.</b> <code>var o = new Object() { int twice(int n) { return n * 2; } };</code> cho <code>o</code> kiểu của chính anonymous class đó, nên gọi <code>o.twice(21)</code> hợp lệ. Nếu khai báo <code>Object o = ...</code> thì method biến mất khỏi tầm nhìn. Cùng cơ chế đó áp dụng cho kiểu giao (intersection type) và capture của wildcard sinh ra từ biểu thức — những kiểu bạn không có cú pháp nào để viết ra trong khai báo biến.","<b>Đánh đổi cần nêu khi thảo luận thiết kế.</b> Việc <code>var</code> giữ kiểu chi tiết nhất là con dao hai lưỡi: nó giúp không mất thông tin trong các chuỗi xử lý trung gian, nhưng cũng khiến kiểu của biến trở thành thứ có thể thay đổi khi ai đó sửa vế phải, kể cả khi họ chỉ định đổi implementation. Với biến sống ngắn trong vài dòng thì rủi ro nhỏ; với biến dùng xuyên một method dài thì nên viết kiểu ra."],"example":"var i = 1;        // int\nvar l = 1L;       // long\nvar c = 'x';      // char\nvar n = c + 1;    // int, giá trị 121 (numeric promotion)\nSystem.out.println(n);\n\n// BẪY: diamond + var\nvar bad = new ArrayList<>();       // ArrayList<Object>\nbad.add(\"hello\");\n// String s = bad.get(0);          // lỗi biên dịch: Object không phải String\n\nvar good = new ArrayList<String>(); // ArrayList<String>\nString s = good.get(0);\n\n// var giữ kiểu cụ thể, không giữ interface\nvar map = new HashMap<String, Integer>(); // HashMap, không phải Map\n\n// var giữ được kiểu không gọi tên được\nvar helper = new Object() {\n    int twice(int x) { return x * 2; }\n};\nSystem.out.println(helper.twice(21)); // 42","exampleTitle":"Quy tắc suy kiểu và hai mặt của nó","keyPoints":["var lấy đúng kiểu của biểu thức khởi tạo, không có mở rộng kiểu: var x = 1 luôn là int.","Biểu thức số học vẫn chịu numeric promotion, nên char + int cho var kiểu int.","var + diamond suy ra Object; luôn ghi tham số generic ở vế phải khi dùng var.","var giữ kiểu cài đặt cụ thể (HashMap) chứ không giữ interface (Map) — mất đi một lớp trừu tượng.","var là cách duy nhất để giữ kiểu không gọi tên được như anonymous class hay intersection type."],"trap":"var list = new ArrayList<>(); trông hoàn toàn bình thường và vẫn biên dịch, nhưng suy ra ArrayList<Object>. Lỗi chỉ lộ ra ở chỗ khác, khi get() trả về Object thay vì kiểu mong đợi.","followUp":["Vì sao diamond cần kiểu đích để suy generic, còn var lại không cung cấp được kiểu đích đó?","Nêu một tình huống mà việc var giữ kiểu cụ thể thay vì interface gây rắc rối thật sự khi refactor.","Ngoài anonymous class, còn kiểu nào không viết ra được mà chỉ var mới nắm giữ được?"]},{"id":"t-13-4","topicId":13,"versions":[11,17,21],"title":"var trong tham số lambda và trong các cấu trúc vòng lặp","summary":"Java 11 cho phép var trong tham số lambda — nhưng mục đích thật của nó không phải để gõ ít đi.","sections":["<b>Java 11 bổ sung var cho tham số lambda (JEP 323).</b> Trước đó chỉ có hai lựa chọn: bỏ trống kiểu (<code>(a, b) -&gt; a + b</code>) hoặc ghi kiểu đầy đủ (<code>(Integer a, Integer b) -&gt; a + b</code>). Từ Java 11 có thêm dạng thứ ba: <code>(var a, var b) -&gt; a + b</code>. Về mặt kiểu, dạng này tương đương hoàn toàn với dạng bỏ trống — kiểu vẫn được suy từ functional interface đích.","<b>Mục đích thật là để có chỗ gắn annotation và modifier.</b> Cú pháp Java không cho phép gắn annotation lên một tham số không có kiểu, nên trước Java 11 nếu muốn viết <code>@NonNull</code> hay <code>final</code> trên tham số lambda thì buộc phải ghi kiểu đầy đủ ra, kể cả khi kiểu đó rất dài. <code>var</code> giải quyết đúng chỗ đó: <code>(@NonNull var s) -&gt; s.trim()</code>. Nếu chỉ để cho ngắn thì <code>var</code> ở đây không có lợi gì so với việc bỏ trống — đây chính là điều người phỏng vấn muốn nghe.","<b>Quy tắc all-or-nothing.</b> Trong một danh sách tham số lambda, ba dạng khai báo không được trộn lẫn: hoặc tất cả bỏ trống, hoặc tất cả ghi kiểu tường minh, hoặc tất cả dùng <code>var</code>. Viết <code>(var a, b) -&gt; ...</code> hay <code>(var a, String b) -&gt; ...</code> đều là lỗi biên dịch. Ngoài ra khi dùng <code>var</code> thì bắt buộc phải có dấu ngoặc đơn, kể cả với lambda một tham số.","<b>var trong vòng for-each là chỗ nó phát huy giá trị rõ nhất.</b> Với <code>Map&lt;String, List&lt;OrderItem&gt;&gt;</code>, viết <code>for (Map.Entry&lt;String, List&lt;OrderItem&gt;&gt; e : map.entrySet())</code> chiếm gần hết chiều ngang màn hình mà không nói thêm điều gì; <code>for (var e : map.entrySet())</code> ngắn hơn và người đọc vẫn suy ra được kiểu từ tên biến map. Đây là ví dụ điển hình cho nguyên tắc 'dùng var khi kiểu đã hiển nhiên từ ngữ cảnh'.","<b>var trong try-with-resources và trong for cổ điển.</b> <code>try (var in = new BufferedReader(...))</code> hợp lệ và giữ nguyên mọi bảo đảm đóng tài nguyên, vì kiểu suy ra vẫn phải cài đặt <code>AutoCloseable</code>. Với <code>for (var i = 0; i &lt; n; i++)</code> thì cần cẩn thận: <code>i</code> là <code>int</code>, nên nếu <code>n</code> là <code>long</code> lớn thì vòng lặp có thể không bao giờ kết thúc do tràn số — một lỗi mà kiểu tường minh sẽ khiến bạn phải nghĩ tới.","<b>Không có thay đổi nào từ Java 11 tới 21.</b> Ngữ nghĩa của <code>var</code> ở cả ba bản LTS 11, 17 và 21 là như nhau; những gì mới ở 17 và 21 (record, sealed class, pattern matching) là tính năng khác và không sửa đổi cách <code>var</code> suy kiểu. Nói được điều này giúp tránh việc bịa ra khác biệt phiên bản không tồn tại."],"example":"// Ba dạng tham số lambda — không được trộn lẫn\nBiFunction<Integer, Integer, Integer> a = (x, y) -> x + y;               // bỏ trống\nBiFunction<Integer, Integer, Integer> b = (Integer x, Integer y) -> x + y; // tường minh\nBiFunction<Integer, Integer, Integer> c = (var x, var y) -> x + y;        // Java 11+\n\n// BiFunction<Integer, Integer, Integer> d = (var x, y) -> x + y;  // lỗi: trộn lẫn\n\n// Lý do thật sự để dùng var: gắn annotation\n// Function<String, String> f = (@NonNull var s) -> s.trim();\n\n// for-each với generic dài\nMap<String, List<Integer>> orders = new HashMap<>();\nfor (var entry : orders.entrySet()) {\n    for (var item : entry.getValue()) {\n        System.out.println(entry.getKey() + \" -> \" + item);\n    }\n}\n\ntry (var in = new BufferedReader(new FileReader(\"a.txt\"))) {\n    System.out.println(in.readLine());\n}","exampleTitle":"var trong lambda, for-each và try-with-resources","keyPoints":["var cho tham số lambda có từ Java 11; về kiểu nó tương đương với việc bỏ trống kiểu.","Giá trị thật của nó là tạo chỗ để gắn annotation hoặc final lên tham số lambda.","Ba dạng khai báo tham số lambda không được trộn lẫn; dùng var thì bắt buộc có ngoặc đơn.","for-each trên generic dài dòng là nơi var có lợi rõ nhất mà không mất thông tin.","var trong for cổ điển suy ra int cho literal 0 — cẩn thận khi cận trên là long.","Ngữ nghĩa của var không thay đổi giữa Java 11, 17 và 21."],"trap":"Hỏi 'var trong tham số lambda để làm gì?' — trả lời 'để gõ ngắn hơn' là sai trọng tâm, vì bỏ trống kiểu còn ngắn hơn. Lý do đúng là để có chỗ đặt annotation và modifier.","followUp":["Vì sao Java không cho trộn var với tham số bỏ trống trong cùng một lambda?","for (var i = 0; i < n; i++) với n kiểu long thì có rủi ro gì?","var trong try-with-resources có ảnh hưởng gì tới việc kiểm tra AutoCloseable không?"]},{"id":"t-13-5","topicId":13,"versions":[11,17,21],"title":"Khi nào var giúp, khi nào var hại và chi phí thật sự của nó","summary":"Chi phí runtime bằng không, nên toàn bộ cuộc tranh luận về var là về khả năng đọc code.","sections":["<b>Chi phí kỹ thuật bằng không, nên đây thuần tuý là câu chuyện thiết kế.</b> Không có gì để đo đạc: cùng bytecode, cùng tốc độ, cùng bộ nhớ. Cái được và cái mất đều nằm ở người đọc code sau này. Vì thế mọi lập luận kiểu 'var chậm hơn' hay 'var làm tăng bộ nhớ' đều sai, và người phỏng vấn thường dùng chính điểm này để kiểm tra xem ứng viên hiểu bản chất hay chỉ nghe truyền miệng.","<b>Dùng var khi kiểu đã hiển nhiên ngay ở vế phải.</b> <code>var user = new User();</code>, <code>var items = new ArrayList&lt;OrderItem&gt;();</code>, <code>var entries = map.entrySet();</code> — trong cả ba trường hợp, viết kiểu ra chỉ là lặp lại thông tin đã có. Đặc biệt <code>var</code> loại bỏ kiểu bị lặp hai lần ở hai vế, thứ mà Java bị chê suốt nhiều năm.","<b>Tránh var khi vế phải là lời gọi method mờ nghĩa.</b> <code>var result = service.process(request);</code> buộc người đọc phải mở định nghĩa của <code>process</code> mới biết đang cầm cái gì. Trong code review, một dấu hiệu tốt để quyết định là: nếu bạn phải nhảy sang file khác mới hiểu dòng đó thì đừng dùng <code>var</code>. Nguyên tắc chung, được nhắc trong hướng dẫn phong cách chính thức về type inference của OpenJDK, là <code>var</code> càng an toàn khi phạm vi sống của biến càng ngắn.","<b>Tránh var khi bạn cần một kiểu rộng hơn kiểu của biểu thức.</b> Đây là trường hợp <code>Map m = new HashMap&lt;&gt;()</code> đã nói ở phần suy kiểu, và cũng là trường hợp bạn muốn biến có kiểu <code>long</code> hay <code>double</code> ngay từ đầu để tránh tràn số hoặc chia nguyên. <code>var</code> không cho bạn nói điều đó; nó chỉ lặp lại kiểu của vế phải.","<b>Bù lại bằng cách đặt tên biến tốt hơn.</b> Khi bỏ kiểu đi, tên biến trở thành nguồn thông tin chính. <code>var list = repo.find(id);</code> là tệ, <code>var activeOrders = repo.findActiveOrders(id);</code> thì hoàn toàn ổn dù cũng không có kiểu. Nhiều nhóm áp dụng var thành công chính là vì họ đồng thời siết chặt quy ước đặt tên.","<b>Cách trả l
