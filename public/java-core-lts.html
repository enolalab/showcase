etFirst()</code>); giờ đã thống nhất. Lưu ý các list bất biến vẫn ném UnsupportedOperationException với addFirst/addLast."],"example":"// Tăng trưởng của ArrayList: old + (old >> 1)  ~ 1.5x\n// 10 -> 15 -> 22 -> 33 -> 49 ...\nList<Integer> a = new ArrayList<>();     // mảng nội bộ RỖNG cho tới lần add đầu\na.add(1);                                 // lúc này mới cấp capacity 10\n\n// Biết trước kích thước thì tránh hẳn việc copy nhiều lần\nList<Integer> sized = new ArrayList<>(1_000_000);\n\n// LinkedList chèn giữa: O(1) chỉ khi đã cầm iterator ở đúng chỗ\nListIterator<Integer> it = new LinkedList<>(a).listIterator();\nwhile (it.hasNext()) {\n    if (it.next() == 1) it.add(99);       // O(1) thật sự\n}\n\n// Java 21: API đầu/cuối thống nhất\n// var first = a.getFirst();\n// var rev   = a.reversed();","exampleTitle":"Tăng trưởng, định cỡ và chèn qua iterator","keyPoints":["ArrayList tăng capacity khoảng 1.5 lần (old + old>>1), amortized add() vẫn là O(1)","ArrayList không tham số khởi tạo mảng rỗng, chỉ nở lên 10 ở lần add đầu tiên","LinkedList chỉ O(1) khi đã cầm sẵn node qua iterator; get(i) và add(i, x) vẫn là O(n)","System.arraycopy là intrinsic nên dịch mảng thường nhanh hơn duyệt con trỏ qua node rải rác","Mỗi node LinkedList tốn thêm ~24-40 byte và tạo áp lực GC; ArrayDeque tốt hơn LinkedList cho queue/stack","Java 21 thêm SequencedCollection: getFirst/getLast/addFirst/addLast/reversed"],"trap":"Trả lời máy móc 'chèn/xoá nhiều thì dùng LinkedList'. Người phỏng vấn sẽ hỏi lại: chèn ở đâu, và làm sao bạn tới được vị trí đó? Nếu phải gọi get(i) hay add(i, x) thì LinkedList đã thua ngay từ bước tìm vị trí.","followUp":["Vì sao ArrayList chọn hệ số 1.5 chứ không phải 2?","ArrayDeque hơn LinkedList ở điểm nào khi làm hàng đợi?","Xoá 100.000 phần tử giữa danh sách 1 triệu phần tử, bạn đo và chọn cấu trúc nào?"]},{"id":"t-3-5","topicId":3,"versions":[8,11,17,21],"title":"List cố định kích thước, list bất biến và map cho môi trường đa luồng","summary":"Arrays.asList, List.of, unmodifiableList và ConcurrentHashMap khác nhau ở đâu — và vì sao trả nhầm kiểu là một lỗ hổng thiết kế.","sections":["<b>Ba mức 'không sửa được' hoàn toàn khác nhau.</b> <code>Arrays.asList(...)</code> trả về một view <i>cố định kích thước</i> bọc quanh mảng gốc: <code>set()</code> chạy được và ghi thẳng vào mảng, còn <code>add()</code>/<code>remove()</code> ném UnsupportedOperationException. <code>Collections.unmodifiableList(l)</code> là view <i>chỉ đọc</i> nhưng vẫn phản chiếu mọi thay đổi của list gốc. <code>List.of(...)</code> (Java 9) mới thực sự bất biến: dữ liệu được sao chép và không ai sửa được nữa.","<b>Vì sao khác biệt này quan trọng.</b> Trả về <code>Collections.unmodifiableList(internalList)</code> từ getter tưởng là an toàn, nhưng người gọi vẫn thấy dữ liệu đổi dưới chân mình mỗi khi bên trong bạn sửa list gốc — và nếu họ đang duyệt thì nhận CME. Muốn thật sự cắt liên hệ, dùng <code>List.copyOf(internalList)</code> (Java 10) hoặc <code>new ArrayList&lt;&gt;(internalList)</code>.","<b>Bẫy null của các collection bất biến.</b> <code>List.of</code>, <code>Set.of</code>, <code>Map.of</code> không chấp nhận null: tạo với phần tử null ném NullPointerException. <code>Set.of</code> và <code>Map.of</code> còn ném IllegalArgumentException khi có phần tử/khoá trùng lặp — khác hẳn <code>new HashSet&lt;&gt;()</code> vốn im lặng bỏ qua bản trùng. Trong cài đặt OpenJDK hiện tại, ngay cả <code>contains(null)</code> trên các collection này cũng ném NPE thay vì trả false, nên đừng dùng chúng ở chỗ null là giá trị hợp lệ.","<b>Stream trả về gì.</b> <code>collect(Collectors.toList())</code> không cam kết trả list sửa được hay không (thực tế OpenJDK trả ArrayList, nhưng đừng phụ thuộc). <code>Collectors.toUnmodifiableList()</code> (Java 10) và <code>stream.toList()</code> (Java 16, có trong LTS 17/21) trả về list không sửa được — điểm khác là <code>stream.toList()</code> vẫn cho phép phần tử null, còn <code>toUnmodifiableList()</code> thì không.","<b>Ba lựa chọn map cho đa luồng.</b> <code>Collections.synchronizedMap</code> bọc mọi method trong một lock duy nhất: đơn giản nhưng mọi thread tranh nhau một lock, và bạn vẫn phải tự <code>synchronized</code> khi duyệt. <code>ConcurrentHashMap</code> (Java 8+) khoá ở mức từng bucket — CAS khi bucket rỗng, <code>synchronized</code> trên node đầu bucket khi có va chạm — nên nhiều thread ghi vào bucket khác nhau không chặn nhau. <code>Hashtable</code> là di sản, không nên dùng trong code mới.","<b>Điểm ai cũng quên: thao tác ghép vẫn không nguyên tử.</b> ConcurrentHashMap chỉ đảm bảo từng method là nguyên tử. Chuỗi <code>if (!map.containsKey(k)) map.put(k, v)</code> vẫn có race. Phải dùng method ghép sẵn: <code>putIfAbsent</code>, <code>computeIfAbsent</code>, <code>merge</code>, <code>compute</code>. Và ConcurrentHashMap cấm cả key null lẫn value null, vì trong môi trường không khoá, <code>get()</code> trả null sẽ không phân biệt được 'không có key' với 'giá trị là null'."],"example":"// 1. Cố định kích thước, ghi xuyên xuống mảng gốc\nString[] arr = {\"a\", \"b\"};\nList<String> fixed = Arrays.asList(arr);\nfixed.set(0, \"z\");                 // OK  -> arr[0] cũng thành \"z\"\n// fixed.add(\"c\");                 // UnsupportedOperationException\n\n// 2. Chỉ đọc nhưng VẪN là view: đổi list gốc thì view đổi theo\nList<String> src  = new ArrayList<>(List.of(\"a\"));\nList<String> view = Collections.unmodifiableList(src);\nsrc.add(\"b\");\nSystem.out.println(view.size());   // 2  <-- không hề bất biến\n\n// 3. Bất biến thật sự: sao chép, cắt hẳn liên hệ\nList<String> snapshot = List.copyOf(src);\nsrc.add(\"c\");\nSystem.out.println(snapshot.size()); // 2\n\n// 4. Thao tác ghép trên map đa luồng\nConcurrentHashMap<String, Integer> counts = new ConcurrentHashMap<>();\ncounts.merge(\"hit\", 1, Integer::sum);                  // nguyên tử\ncounts.computeIfAbsent(\"list\", k -> 0);                // nguyên tử\n// if (!counts.containsKey(k)) counts.put(k, v);       // KHÔNG nguyên tử","exampleTitle":"Ba mức bất biến và thao tác nguyên tử","keyPoints":["Arrays.asList: cố định kích thước, set() ghi xuyên xuống mảng gốc, add/remove ném UnsupportedOperationException","Collections.unmodifiableList là view chỉ đọc chứ không phải bản sao — list gốc đổi thì view đổi theo","List.of (Java 9) và List.copyOf (Java 10) mới thực sự bất biến, và đều không chấp nhận null","stream.toList() (Java 16) trả list không sửa được nhưng cho phép null; Collectors.toUnmodifiableList() thì không","ConcurrentHashMap khoá theo bucket (CAS + synchronized trên node đầu), cấm null key và null value","Từng method của ConcurrentHashMap là nguyên tử, nhưng chuỗi thao tác thì không — dùng computeIfAbsent/merge/putIfAbsent"],"trap":"Trả về Collections.unmodifiableList(internalList) rồi tin rằng đã đóng gói xong. Người gọi không sửa được nhưng vẫn thấy dữ liệu thay đổi, và có thể nhận ConcurrentModificationException giữa lúc duyệt.","followUp":["Vì sao ConcurrentHashMap cấm null value trong khi HashMap thì cho phép?","Arrays.asList(new int[]{1,2,3}) cho ra list có bao nhiêu phần tử, và vì sao?","Khi nào CopyOnWriteArrayList là lựa chọn đúng, khi nào là thảm hoạ?"]},{"id":"t-4-1","topicId":4,"versions":[8,11,17,21],"title":"String bất biến: cơ chế và ba lý do thiết kế","summary":"Vì sao Java chấp nhận trả giá bằng rác bộ nhớ để đổi lấy một kiểu String không bao giờ đổi.","sections":["<b>Bất biến nghĩa là gì ở đây.</b> Class <code>String</code> khai báo <code>final</code> nên không ai kế thừa để phá vỡ hành vi; mảng ký tự bên trong là <code>private final</code> và không bao giờ được trả ra ngoài. Mọi method như <code>toUpperCase()</code>, <code>trim()</code>, <code>replace()</code>, <code>substring()</code> đều tạo String mới; object gốc không đổi một bit. Lỗi cơ bản hay gặp là gọi <code>s.trim()</code> rồi tưởng <code>s</code> đã sạch — giá trị trả về bị vứt đi.","<b>Lý do 1 — an toàn.</b> String được dùng làm tên class khi class loader nạp, đường dẫn file, chuỗi kết nối database, tham số của kiểm tra quyền. Nếu String đổi được, một đoạn code có thể vượt qua bước kiểm tra rồi sửa chính giá trị đó ngay sau đó — đúng dạng lỗi time-of-check to time-of-use. Bất biến khiến cả lớp tấn công này biến mất khỏi bàn cân.","<b>Lý do 2 — cache hashCode.</b> String tính hashCode một lần rồi lưu vào field và dùng lại mãi mãi. Điều này chỉ hợp lệ khi nội dung không đổi, và chính nó khiến String trở thành key lý tưởng cho HashMap: tra cứu hàng triệu lần mà chỉ tính hash một lần. Chi tiết thú vị: trong cài đặt cổ điển, giá trị 0 vừa nghĩa là 'chưa tính' vừa là hash thật của chuỗi rỗng, nên riêng trường hợp đó bị tính lại mỗi lần; các JDK mới hơn thêm một cờ riêng để tránh việc này.","<b>Lý do 3 — chia sẻ an toàn giữa thread.</b> Object bất biến không có trạng thái nào để race, nên không cần đồng bộ hoá và có thể publish tự do giữa các thread. Đó cũng là tiền đề để nhiều tham chiếu cùng trỏ vào một literal trong String Pool mà không ai sợ người khác sửa mất.","<b>Cái giá phải trả.</b> Mỗi phép biến đổi sinh một object mới, nên nối chuỗi trong vòng lặp tạo rác cực nhanh và đẩy áp lực lên GC. Đây chính là lý do tồn tại của <code>StringBuilder</code>: một buffer thay đổi được, chỉ đóng băng thành String đúng một lần ở cuối.","<b>Bất biến không đồng nghĩa với an toàn trong bộ nhớ.</b> Vì không ghi đè được nội dung, một mật khẩu lưu trong String nằm lại trong heap cho tới khi GC dọn, và có thể lộ nguyên văn trong heap dump. Đó là lý do <code>JPasswordField.getPassword()</code> trả về <code>char[]</code> chứ không phải String — để bạn tự ghi đè mảng ngay sau khi dùng xong. Đây là câu hỏi vặn khá phổ biến sau khi ứng viên vừa ca ngợi tính bất biến."],"example":"String s = \"  Java  \";\ns.trim();                    // BỎ ĐI kết quả -> s không đổi\nSystem.out.println(\"[\" + s + \"]\");        // [  Java  ]\n\ns = s.trim().toUpperCase();  // phải gán lại\nSystem.out.println(\"[\" + s + \"]\");        // [JAVA]\n\n// hashCode được cache: tính một lần, dùng mãi\nMap<String, Integer> m = new HashMap<>();\nm.put(\"user:1001\", 1);\n\n// Mật khẩu: dùng char[] để ghi đè được sau khi dùng\nchar[] pwd = readPassword();\ntry {\n    authenticate(pwd);\n} finally {\n    java.util.Arrays.fill(pwd, '\\0');     // String không làm được điều này\n}","exampleTitle":"Bất biến trong thực tế","keyPoints":["class String là final, mảng ký tự bên trong private final và không bao giờ lộ ra ngoài","Mọi method biến đổi đều trả về String mới; quên gán lại là lỗi kinh điển","Bất biến cho phép cache hashCode, nền tảng cho việc dùng String làm key HashMap","Object bất biến chia sẻ an toàn giữa thread mà không cần đồng bộ hoá","Đổi lại là rác bộ nhớ khi biến đổi nhiều lần — lý do StringBuilder tồn tại","Mật khẩu nên dùng char[] vì String không xoá được khỏi heap theo ý muốn"],"trap":"Trả lời 'String bất biến nên an toàn' rồi bị hỏi ngược: nếu an toàn thì vì sao API mật khẩu của Java lại trả char[]? Câu trả lời là bất biến chống sửa đổi chứ không chống lộ dữ liệu trong heap dump.","followUp":["Vì sao class String phải là final chứ không chỉ cần các field là final?","hashCode của String được cache ở đâu và trường hợp nào bị tính lại?","Bất biến giúp gì cho String Pool?"]},{"id":"t-4-2","topicId":4,"versions":[8,11,17,21],"title":"String Pool, intern() và == so với equals","summary":"Vì sao hai chuỗi cùng nội dung lúc thì == cho true, lúc thì cho false.","sections":["<b>String Pool là gì.</b> JVM giữ một bảng băm nội bộ chứa tham chiếu tới các chuỗi duy nhất. Mọi String literal trong bytecode đều được đưa vào pool khi hằng số đó được phân giải lần đầu, và mọi nơi dùng cùng literal sẽ nhận đúng một object. Đây là lý do <code>\"java\" == \"java\"</code> trả về true.","<b>Pool nằm ở đâu — chi tiết version rất hay bị hỏi.</b> Tới Java 6, pool nằm trong PermGen với kích thước cố định, nên gọi <code>intern()</code> ồ ạt có thể làm tràn PermGen. Từ Java 7, pool được chuyển sang heap: các chuỗi trong pool trở nên bị GC thu hồi được và không còn giới hạn bởi PermGen. (Riêng PermGen thì mãi tới Java 8 mới bị bỏ hẳn, thay bằng Metaspace — hai thay đổi này khác nhau và khác thời điểm.) Số bucket của bảng có thể chỉnh bằng <code>-XX:StringTableSize</code>.","<b>new String(\"a\") luôn tạo object mới.</b> Toán tử <code>new</code> theo định nghĩa cấp phát object mới trên heap, chép nội dung từ literal trong pool. Vì vậy <code>new String(\"a\") != \"a\"</code> dù nội dung giống hệt. Trong code thật, viết <code>new String(...)</code> gần như luôn là thừa và là mùi code.","<b>intern() làm gì.</b> <code>s.intern()</code> tra pool: nếu đã có chuỗi cùng nội dung thì trả về tham chiếu đó, nếu chưa thì thêm vào rồi trả về. Từ Java 7, khi pool nằm trên heap, nó có thể đăng ký chính object đang có thay vì tạo bản sao. intern hữu ích khi bạn nạp hàng triệu chuỗi lặp lại từ file hay database, nhưng đừng dùng bừa: bảng pool cũng có chi phí tra cứu và giữ tham chiếu.","<b>== so với equals so với compareTo.</b> <code>==</code> so tham chiếu (cùng một object hay không); <code>equals</code> so nội dung từng ký tự; <code>compareTo</code> trả về số âm/0/dương theo thứ tự từ điển dựa trên giá trị char UTF-16, dùng cho sắp xếp chứ không phải để kiểm tra bằng nhau. So chuỗi luôn dùng <code>equals</code>, hoặc <code>Objects.equals(a, b)</code> nếu một vế có thể null.","<b>Vì sao bẫy này hiệu quả.</b> Với chuỗi nhỏ và literal, <code>==</code> thường 'may mắn' đúng nhờ pool, y hệt việc <code>==</code> trên Integer đúng trong khoảng -128..127 nhờ Integer cache. Code chạy đúng trên môi trường dev rồi sai trên production khi chuỗi tới từ đọc file hay HTTP request. Đừng bao giờ dựa vào sự may mắn đó."],"example":"String a = \"java\";\nString b = \"java\";\nString c = new String(\"java\");\nString d = c.intern();\n\nSystem.out.println(a == b);        // true  - cùng object trong pool\nSystem.out.println(a == c);        // false - c là object riêng trên heap\nSystem.out.println(a.equals(c));   // true  - cùng nội dung\nSystem.out.println(a == d);        // true  - intern() trả tham chiếu trong pool\n\n// Chuỗi tới từ input thì không nằm trong pool\nString fromInput = new java.util.Scanner(\"java\").next();\nSystem.out.println(a == fromInput);       // false\nSystem.out.println(a.equals(fromInput));  // true\n\n// An toàn với null\nSystem.out.println(java.util.Objects.equals(null, a));   // false, không NPE","exampleTitle":"Pool, intern và ba cách so sánh","keyPoints":["Mọi String literal được đưa vào String Pool nên literal cùng nội dung là cùng một object","Pool nằm trong PermGen tới Java 6, chuyển sang heap từ Java 7 nên bị GC thu hồi được","PermGen bị bỏ ở Java 8 và thay bằng Metaspace — sự kiện khác với việc pool chuyển sang heap","new String(...) luôn tạo object mới nằm ngoài pool","intern() trả tham chiếu trong pool; hữu ích khi nạp nhiều chuỗi lặp lại nhưng có chi phí tra bảng","== so tham chiếu, equals so nội dung, compareTo dùng để sắp xếp chứ không phải để kiểm tra bằng nhau"],"trap":"Kết luận '== đôi khi vẫn đúng nên dùng được với chuỗi ngắn'. Nó đúng vì literal được interned, không phải vì chuỗi ngắn. Ngay khi chuỗi tới từ I/O, nối chuỗi lúc runtime hay deserialize, == trả false.","followUp":["String Pool chuyển từ PermGen sang heap ở phiên bản nào và điều đó thay đổi gì?","Khi nào intern() thực sự tiết kiệm bộ nhớ, và khi nào nó phản tác dụng?","Vì sao == trên Integer cũng có bẫy tương tự, và biên giá trị là bao nhiêu?"]},{"id":"t-4-3","topicId":4,"versions":[8,11,17,21],"title":"Nối chuỗi: từ StringBuilder tới invokedynamic","summary":"Compiler tối ưu phép + rất giỏi trong một biểu thức, nhưng không bao giờ tối ưu được qua các vòng lặp.","sections":["<b>Java 8 trở về trước: javac sinh StringBuilder.</b> Một biểu thức như <code>\"a\" + x + \"b\"</code> được biên dịch thành <code>new StringBuilder().append(...).append(...).toString()</code>. Đây là lý do câu 'dùng + chậm hơn StringBuilder' là sai khi nói về một biểu thức đơn lẻ — chúng sinh ra bytecode gần như giống hệt nhau.","<b>Java 9 trở đi: invokedynamic.</b> JEP 280 thay chuỗi lệnh StringBuilder bằng một lệnh <code>invokedynamic</code> trỏ tới <code>StringConcatFactory</code>. Bytecode nhỏ hơn hẳn và chiến lược thực thi được quyết định lúc chạy, thường là tính trước tổng độ dài rồi ghi thẳng một lần vào mảng byte — tránh được việc StringBuilder phải nở buffer và copy. Ưu điểm phụ rất lớn: JDK có thể cải tiến cách nối chuỗi mà không cần biên dịch lại ứng dụng.","<b>Vì sao vòng lặp vẫn là O(n^2).</b> Cả hai cơ chế trên chỉ áp dụng trong phạm vi MỘT biểu thức. Trong vòng lặp, mỗi lần <code>s += x</code> là một biểu thức độc lập: nó tạo builder/callsite mới, sao chép lại toàn bộ nội dung cũ rồi sinh String mới. Sau n vòng, tổng số ký tự phải sao chép là 1+2+...+n, tức O(n^2). Compiler không thể gộp lại vì mỗi giá trị trung gian là một String hoàn chỉnh có thể bị dùng ở bất kỳ đâu.","<b>Constant folding.</b> Biểu thức chỉ gồm hằng, như <code>\"ja\" + \"va\"</code>, được ghép ngay lúc biên dịch thành một literal và đưa vào pool — nên <code>(\"ja\" + \"va\") == \"java\"</code> trả về true. Biến <code>final</code> khởi tạo bằng hằng cũng tính là hằng compile-time; biến thường (kể cả effectively final) thì không, và phép nối xảy ra lúc runtime tạo object mới.","<b>StringBuilder so với StringBuffer.</b> StringBuffer có từ JDK 1.0 và <code>synchronized</code> trên mọi method; StringBuilder ra đời ở Java 5, cùng API nhưng bỏ đồng bộ hoá. Điểm mấu chốt để nói trong phỏng vấn: đồng bộ ở mức từng method gần như không bao giờ đủ, vì một chuỗi thao tác append vẫn cần lock ở tầng ngoài — nên StringBuffer hiếm khi là câu trả lời đúng. Thêm nữa, với builder là biến cục bộ không thoát khỏi method, JIT thường loại bỏ được lock qua escape analysis, khiến khác biệt càng vô nghĩa.","<b>Chọn công cụ nào.</b> Vài mảnh trong một biểu thức thì cứ dùng <code>+</code> cho dễ đọc. Nối trong vòng lặp hoặc nhánh điều kiện thì giữ một <code>StringBuilder</code> ngoài vòng lặp và ước lượng capacity nếu được (mặc định 16, nở theo công thức khoảng 2 lần cộng 2). Ghép collection thì dùng <code>String.join</code>, <code>StringJoiner</code> hoặc <code>Collectors.joining</code> — vừa gọn vừa xử lý dấu phân cách đúng."],"example":"// XẤU: mỗi vòng lặp sao chép lại toàn bộ chuỗi -> O(n^2)\nString s = \"\";\nfor (int i = 0; i < 100_000; i++) {\n    s += i;      // ~ s = new StringBuilder().append(s).append(i).toString()\n}\n\n// TỐT: một buffer duy nhất -> O(n)\nStringBuilder sb = new StringBuilder(600_000);\nfor (int i = 0; i < 100_000; i++) {\n    sb.append(i);\n}\nString r = sb.toString();\n\n// Một biểu thức thì dùng + là đủ, không cần StringBuilder thủ công\nString msg = \"user=\" + id + \", role=\" + role;\n\n// Ghép collection\nString csv = String.join(\", \", List.of(\"a\", \"b\", \"c\"));\nString csv2 = list.stream().map(Object::toString)\n                  .collect(java.util.stream.Collectors.joining(\", \", \"[\", \"]\"));","exampleTitle":"Ba cách nối và chi phí của chúng","keyPoints":["Java 8 và trước: javac dịch biểu thức nối thành chuỗi append của StringBuilder","Java 9+ (JEP 280): javac sinh invokedynamic tới StringConcatFactory, chiến lược do runtime chọn","Trong vòng lặp, mỗi lần += là một biểu thức riêng nên tổng chi phí vẫn là O(n^2) ở mọi phiên bản","Biểu thức toàn hằng được ghép lúc biên dịch và vào pool; final khởi tạo bằng hằng cũng vậy, effectively final thì không","StringBuffer đồng bộ từng method — hiếm khi đủ để đúng, nên StringBuilder là lựa chọn mặc định","Ghép collection thì dùng String.join / StringJoiner / Collectors.joining"],"trap":"Nói 'từ Java 9 nối chuỗi đã được tối ưu nên vòng lặp cũng không sao'. Tối ưu chỉ nằm trong phạm vi một biểu thức; vòng lặp vẫn là O(n^2) và đây chính là câu vặn tiếp theo mà người phỏng vấn chờ đợi.","followUp":["Vì sao compiler không thể tự gộp phép nối trong vòng lặp thành một StringBuilder?","invokedynamic mang lại lợi ích gì mà chuỗi lệnh StringBuilder không có?","Escape analysis ảnh hưởng thế nào tới khác biệt giữa StringBuilder và StringBuffer?"]},{"id":"t-4-4","topicId":4,"versions":[8,11,17,21],"title":"Bộ nhớ của String: Compact Strings và bẫy substring","summary":"String chiếm bao nhiêu byte, vì sao Java 9 đổi char[] thành byte[], và vì sao substring từng gây memory leak.","sections":["<b>Trước Java 9: char[] hai byte cho mọi ký tự.</b> Java lưu chuỗi theo UTF-16, mỗi <code>char</code> chiếm 2 byte kể cả khi nội dung toàn ASCII. Trong ứng dụng web điển hình, String chiếm phần lớn heap và phần lớn trong số đó là ASCII — nghĩa là gần một nửa bộ nhớ dành cho chuỗi bị lãng phí vào các byte 0.","<b>Java 9 — Compact Strings (JEP 254).</b> Field nội bộ đổi từ <code>char[]</code> sang <code>byte[]</code> kèm một byte <code>coder</code> nhận giá trị LATIN1 hoặc UTF16. Nếu mọi ký tự trong chuỗi nằm trong Latin-1 thì lưu 1 byte mỗi ký tự; chỉ cần một ký tự nằm ngoài là toàn bộ chuỗi chuyển sang chế độ UTF16 với 2 byte mỗi ký tự. Điểm cần nhấn mạnh: quyết định là theo TỪNG String, không phải theo từng ký tự.","<b>Hệ quả thực tế cho dữ liệu tiếng Việt.</b> Các ký tự có dấu như 'ế' hay 'ộ' nằm ngoài Latin-1, nên chuỗi tiếng Việt có dấu vẫn ở chế độ UTF16 và không hưởng lợi. Đừng hứa với người phỏng vấn rằng Compact Strings giảm một nửa bộ nhớ cho mọi ứng dụng — lợi ích phụ thuộc vào dữ liệu, và trong hệ thống nhiều tiếng Việt thì phần tiết kiệm chủ yếu đến từ các chuỗi kỹ thuật (key, id, header, JSON field name).","<b>API không đổi.</b> <code>length()</code> và <code>charAt()</code> vẫn tính theo đơn vị char UTF-16, nên thay đổi này hoàn toàn trong suốt với code ứng dụng. Chỉ có những thư viện chạm vào nội bộ String bằng reflection hoặc Unsafe mới bị ảnh hưởng — đó cũng là lý do không nên làm vậy.","<b>Bẫy substring cũ và cách nó được sửa.</b> Tới Java 6, String có thêm field <code>offset</code> và <code>count</code>, và <code>substring()</code> trả về String dùng CHUNG mảng ký tự với chuỗi gốc. Cắt 10 ký tự từ một file 10MB đã nạp thành String sẽ giữ nguyên 10MB đó sống trong heap — memory leak kinh điển. Từ Java 7 update 6, substring sao chép mảng: hết rò rỉ, nhưng độ phức tạp đổi từ O(1) sang O(n) theo độ dài kết quả.","<b>Cân nhắc khi parse dữ liệu lớn.</b> Vì substring giờ luôn copy, việc cắt hàng triệu lần trong vòng lặp parse là chi phí thật. Nếu chỉ cần đọc, hãy làm việc trên chỉ số (<code>indexOf</code>, <code>regionMatches</code>, <code>charAt</code>) hoặc dùng <code>CharBuffer</code>/<code>CharSequence</code> làm view, thay vì tạo hàng triệu String trung gian."],"example":"// Java 9+: byte[] + coder\n// \"abc\"      -> coder = LATIN1, 3 byte\n// \"tiếng\"    -> có ký tự ngoài Latin-1 -> coder = UTF16, 10 byte\n\nString ascii = \"user-id-1001\";      // 1 byte/ký tự từ Java 9\nString viet  = \"Nguyễn Văn A\";      // vẫn 2 byte/ký tự vì có ký tự ngoài Latin-1\n\n// API vẫn tính theo char UTF-16, không đổi\nSystem.out.println(viet.length());\nSystem.out.println(viet.charAt(6));\n\n// Bẫy cũ (<= Java 6): substring chia sẻ mảng nền -> giữ sống cả chuỗi lớn\n// String huge = readWholeFile();     // 10 MB\n// String tiny = huge.substring(0, 10);   // Java 6: vẫn giữ 10 MB sống\n\n// Từ Java 7u6 substring copy mảng: an toàn bộ nhớ nhưng là O(n)\n// Parse dữ liệu lớn thì làm việc trên chỉ số thay vì cắt chuỗi\nint idx = viet.indexOf(' ');\nboolean startsWithNguyen = viet.regionMatches(0, \"Nguyễn\", 0, 6);","exampleTitle":"Compact Strings và chi phí của substring","keyPoints":["Trước Java 9 String lưu char[], 2 byte cho mọi ký tự kể cả ASCII","Java 9 JEP 254 đổi sang byte[] + cờ coder (LATIN1 hoặc UTF16), quyết định theo từng String","Chuỗi tiếng Việt có dấu nằm ngoài Latin-1 nên vẫn dùng 2 byte mỗi ký tự","length() và charAt() vẫn theo đơn vị char UTF-16 nên thay đổi trong suốt với ứng dụng","Tới Java 6 substring chia sẻ mảng nền và gây memory leak; từ Java 7u6 nó copy nên an toàn nhưng là O(n)","Parse dữ liệu lớn nên dùng chỉ số hoặc CharSequence view thay vì tạo hàng triệu substring"],"trap":"Khẳng định 'Compact Strings giúp tiết kiệm một nửa bộ nhớ'. Chỉ đúng với chuỗi toàn ký tự Latin-1; chỉ một ký tự tiếng Việt có dấu là cả chuỗi quay về 2 byte mỗi ký tự.","followUp":["Vì sao coder được quyết định theo cả chuỗi chứ không theo từng ký tự?","Trước Java 7u6, vì sao substring lại gây memory leak và JDK sửa bằng cách nào?","Muốn cắt chuỗi hàng triệu lần khi parse thì thay substring bằng gì?"]},{"id":"t-4-5","topicId":4,"versions":[8,11,17,21],"title":"API chuỗi tiến hoá qua các bản LTS: 8 → 11 → 17 → 21","summary":"Những gì thực sự được thêm vào String qua từng bản LTS, và cái nào đáng đổi thói quen.","sections":["<b>Java 7 — switch on String.</b> Từ Java 7 bạn switch được trên String. Bên dưới compiler sinh ra hai bước: switch trên <code>hashCode()</code> để thu hẹp ứng viên, rồi gọi <code>equals()</code> để loại trừ va chạm, cuối cùng switch lần hai trên một chỉ số nội bộ. Nghĩa là nó vẫn dùng equals nên vẫn phân biệt hoa thường, và <code>switch</code> trên biến String null sẽ ném NullPointerException.","<b>Java 8 — ghép và stream.</b> <code>String.join(delim, parts)</code>, <code>StringJoiner</code> (hỗ trợ cả prefix/suffix và giá trị khi rỗng), <code>Collectors.joining</code>, và <code>chars()</code> trả về IntStream. Đây là bộ công cụ nên dùng thay cho việc tự nối rồi cắt dấu phẩy thừa ở cuối.","<b>Java 11 — nhóm method nhỏ nhưng dùng hằng ngày.</b> <code>isBlank()</code>, <code>strip()</code>/<code>stripLeading()</code>/<code>stripTrailing()</code>, <code>lines()</code>, <code>repeat(n)</code>. Khác biệt quan trọng giữa <code>strip()</code> và <code>trim()</code>: trim cắt mọi ký tự có mã nhỏ hơn hoặc bằng U+0020, còn strip dùng định nghĩa khoảng trắng theo Unicode (<code>Character.isWhitespace</code>) nên xử lý đúng các khoảng trắng ngoài ASCII. Với dữ liệu người dùng dán từ web, strip là lựa chọn đúng.","<b>Java 15 — text block, có sẵn trong LTS 17 và 21.</b> Cú pháp <code>\"\"\"</code> cho chuỗi nhiều dòng. Quy tắc cần nhớ: lề phụ (incidental white space) bị cắt dựa trên số dấu cách nhỏ nhất trong các dòng không rỗng, TÍNH CẢ dòng chứa dấu đóng — nên chính vị trí của <code>\"\"\"</code> đóng quyết định lề. Nếu dấu đóng nằm trên dòng riêng thì chuỗi kết thúc bằng ký tự xuống dòng. Dấu <code>\\</code> cuối dòng để nối dòng, <code>\\s</code> để giữ lại khoảng trắng cuối dòng. <code>formatted()</code> cũng ra đời cùng Java 15.","<b>Java 21 — không đổi gì lớn ở String.</b> Đây là chỗ nên trung thực: Java 21 không mang thay đổi đáng kể cho String API. Những thứ liên quan tới chuỗi trong Java 21 nằm ở nơi khác — chẳng hạn pattern matching cho switch đã chuẩn hoá, cho phép <code>case String s -&gt; ...</code> trên biến kiểu Object. Tính năng String Templates từng xuất hiện dạng preview trong một số bản JDK nhưng chưa chuẩn hoá, nên đừng nêu như một tính năng chính thức của LTS.","<b>String.format so với nối chuỗi và logging.</b> <code>String.format</code> phải phân tích chuỗi định dạng, boxing các tham số vào mảng varargs và đi qua <code>Formatter</code> — đắt hơn phép nối nhiều lần, nên tránh trong vòng lặp nóng. Đặc biệt với log: viết <code>log.debug(String.format(...))</code> khiến chi phí định dạng luôn phát sinh kể cả khi mức debug đang tắt; dùng placeholder của SLF4J (<code>log.debug(\"user {} role {}\", id, role)</code>) để chi phí chỉ xảy ra khi log thật sự được ghi."],"example":"// Java 8\nString csv = String.join(\", \", List.of(\"a\", \"b\"));\nStringJoiner j = new StringJoiner(\", \", \"[\", \"]\");\nj.setEmptyValue(\"[rỗng]\");\n\n// Java 11\n\" \\u2003x \".strip();        // \"x\"  - trim() KHÔNG cắt được U+2003\n\"  \".isBlank();              // true\n\"-\".repeat(20);\n\"a\\nb\".lines().count();      // 2\n\n// Java 15+, có trong LTS 17 và 21\nString sql = \"\"\"\n        SELECT id, name\n        FROM users\n        WHERE status = ?\n        \"\"\";\n\n// Logging: dùng placeholder thay vì String.format\n// log.debug(\"user {} role {}\", id, role);","exampleTitle":"Điểm mốc theo phiên bản","keyPoints":["Java 7: switch on String, bên dưới là switch theo hashCode rồi equals; biến null gây NPE","Java 8: String.join, StringJoiner, Collectors.joining, chars()","Java 11: isBlank, strip/stripLeading/stripTrailing, lines, repeat — strip dùng định nghĩa Unicode còn trim chỉ cắt ký tự <= U+0020","Java 15 (có trong LTS 17/21): text block và formatted; vị trí dấu đóng quyết định lề bị cắt","Java 21 không có thay đổi lớn ở String API — trả lời trung thực tốt hơn là bịa","Tránh String.format trong hot path và trong lời gọi log; dùng placeholder của logger"],"trap":"Nói text block là tính năng của Java 17. Nó chuẩn hoá ở Java 15 và chỉ đơn giản là có mặt trong LTS 17. Tương tự, đừng nêu String Templates như tính năng chính thức của Java 21 — nó chưa được chuẩn hoá.","followUp":["switch on String được biên dịch thành gì, và vì sao vẫn cần gọi equals?","strip() khác trim() ở đâu và khi nào khác biệt đó thành bug thật?","Vì sao log.debug(String.format(...)) là thói quen xấu?"]},{"id":"t-5-1","topicId":5,"versions":[8,11,17,21],"title":"Type erasure: generic biến mất trước khi chương trình chạy","summary":"Generic là công cụ của compiler, không phải của JVM — và gần như mọi giới hạn của generic đều bắt nguồn từ điều đó.","sections":["<b>Compiler làm gì.</b> Sau khi kiểm tra kiểu xong, javac <i>xoá</i> tham số kiểu: <code>T</code> không có bound thành <code>Object</code>, <code>&lt;T extends Number&gt;</code> thành <code>Number</code> (bound trái nhất nếu có nhiều bound), rồi chèn các lệnh <code>checkcast</code> ở nơi cần. Bytecode sinh ra gần như trùng khớp với code viết bằng raw type — nghĩa là JVM chưa bao giờ nhìn thấy <code>List&lt;String&gt;</code>.","<b>Vì sao Java chọn erasure.</b> Đổi lấy tương thích ngược cả hai chiều: code viết trước Java 5 vẫn chạy trên JVM mới, và class file mới vẫn dùng được với thư viện cũ mà không phải biên dịch lại toàn bộ hệ sinh thái. C# đi hướng ngược lại (reified generics) vì họ đưa generic vào từ CLR 2.0, khi lượng code cũ còn nhỏ. Đây là một quyết định đánh đổi có chủ đích, không phải sự cẩu thả.","<b>Những gì erasure lấy mất.</b> Không <code>new T()</code>, không <code>new T[n]</code>, không <code>x instanceof List&lt;String&gt;</code> (chỉ được <code>List&lt;?&gt;</code>), không có field <code>static T</code> (tham số kiểu thuộc về instance chứ không thuộc class), không hai method chỉ khác nhau ở tham số kiểu vì sau erasure chúng trùng signature, không tạo <code>new List&lt;String&gt;[10]</code>, và không dùng T làm kiểu trong khối <code>catch</code>.","<b>Hệ quả quan sát được lúc runtime.</b> <code>new ArrayList&lt;String&gt;().getClass() == new ArrayList&lt;Integer&gt;().getClass()</code> trả về true, vì chỉ tồn tại đúng một class <code>ArrayList</code>. Muốn biết kiểu thật lúc chạy thì phải tự mang theo: truyền một <code>Class&lt;T&gt;</code> làm type token (cách Jackson, Spring và JPA đều dùng), hoặc dùng thủ thuật subclass ẩn danh rồi đọc <code>getGenericSuperclass()</code> (kiểu <code>TypeReference</code> của Jackson).","<b>Thông tin generic KHÔNG mất hoàn toàn — chỗ này nhiều người nói sai.</b> Class file vẫn lưu attribute <code>Signature</code> cho khai báo class, field, method và tham số. Nhờ đó reflection đọc được rằng một field có kiểu <code>List&lt;String&gt;</code> thông qua <code>ParameterizedType</code>, và đó chính là cơ sở để các framework ánh xạ JSON hay entity. Cái thật sự mất là kiểu của <i>instance</i>: bản thân một object ArrayList không hề biết nó đang chứa gì.","<b>Unchecked warning nghĩa là gì.</b> Khi compiler nói 'unchecked', nó đang thừa nhận: 'tôi không kiểm chứng được phép chuyển kiểu này, nếu bạn sai thì lỗi sẽ nổ ở một dòng khác'. Vì cast do compiler chèn, ClassCastException thường xuất hiện ở nơi không hề có cast trong source, rất khó lần ngược. Hãy bật <code>-Xlint:unchecked</code> và chỉ dùng <code>@SuppressWarnings(\"unchecked\")</code> ở phạm vi hẹp nhất, kèm comment giải thích vì sao an toàn."],"example":"List<String> a = new ArrayList<>();\nList<Integer> b = new ArrayList<>();\nSystem.out.println(a.getClass() == b.getClass());   // true - chỉ có một class ArrayList\n\n// Không hợp lệ vì erasure:\n// if (a instanceof List<String>) {}     // lỗi biên dịch, chỉ được List<?>\n// T[] arr = new T[10];                  // lỗi biên dịch\n// static T shared;                      // lỗi biên dịch\n// void f(List<String> l) {}\n// void f(List<Integer> l) {}            // lỗi: trùng erasure f(List)\n\n// Cách vượt qua: mang kiểu theo dưới dạng type token\nstatic <T> T cast(Object raw, Class<T> type) {\n    return type.cast(raw);            // kiểm tra thật lúc runtime\n}\n\n// Thông tin generic của KHAI BÁO vẫn còn trong class file\nclass Holder { List<String> names; }\nField f = Holder.class.getDeclaredField(\"names\");\nParameterizedType pt = (ParameterizedType) f.getGenericType();\nSystem.out.println(pt.getActualTypeArguments()[0]);   // class java.lang.String","exampleTitle":"Cái gì mất, cái gì còn sau erasure","keyPoints":["javac xoá tham số kiểu về bound trái nhất (Object nếu không có bound) và chèn checkcast","Erasure được chọn để giữ tương thích ngược với code và thư viện trước Java 5","Không new T(), không new T[n], không instanceof List<String>, không static field kiểu T, không overload trùng erasure","ArrayList<String> và ArrayList<Integer> có cùng đối tượng Class lúc runtime","Generic của KHAI BÁO vẫn nằm trong attribute Signature nên reflection đọc được qua ParameterizedType","Unchecked warning nghĩa là ClassCastException sẽ nổ ở nơi khác — đừng bỏ qua nó"],"trap":"Nói gọn 'generic bị xoá sạch lúc runtime'. Người phỏng vấn sẽ hỏi lại vì sao Jackson và Spring vẫn đọc được List<String> từ kiểu của field — câu trả lời là attribute Signature giữ generic của khai báo, chỉ có kiểu của instance là mất.","followUp":["Vì sao Java chọn erasure trong khi C# chọn reified generics?","Làm sao viết được một method trả về T[] khi không thể gọi new T[n]?","Reflection đọc được generic ở đâu và không đọc được ở đâu?"]},{"id":"t-5-2","topicId":5,"versions":[8,11,17,21],"title":"Bridge method: mảnh ghép giữ cho đa hình còn hoạt động sau erasure","summary":"Method bạn không viết nhưng vẫn xuất hiện trong class file, và ClassCastException phát ra từ chính nó.","sections":["<b>Vấn đề mà erasure tạo ra.</b> Khi bạn viết <code>class Box implements Comparable&lt;Box&gt;</code> với method <code>compareTo(Box o)</code>, sau erasure interface <code>Comparable</code> khai báo <code>compareTo(Object)</code>. Method <code>compareTo(Box)</code> có signature khác hẳn nên về mặt JVM nó KHÔNG override method của interface — gọi qua reference kiểu <code>Comparable</code> sẽ không tìm được bản cài đặt.","<b>Giải pháp của compiler.</b> javac tự sinh thêm một method tổng hợp mang cờ <code>ACC_BRIDGE</code> và <code>ACC_SYNTHETIC</code>: <code>public int compareTo(Object o) { return compareTo((Box) o); }</code>. Nó ép kiểu rồi uỷ quyền sang bản thật. Nhờ vậy bảng method ảo có đúng entry cần thiết và dynamic dispatch hoạt động bình thường.","<b>Bridge method cũng sinh cho covariant return type.</b> Nếu class cha có <code>Object get()</code> còn class con khai báo <code>String get()</code>, compiler sinh thêm <code>Object get()</code> gọi sang bản trả String. Đây là lý do covariant return type hoạt động được dù JVM phân biệt method theo cả kiểu trả về.","<b>Quan sát được bằng reflection.</b> <code>getClass().getDeclaredMethods()</code> trả về những method bạn chưa từng viết, và <code>Method.isBridge()</code> trả về true cho chúng. Mọi framework dùng reflection đều phải lọc: Spring có hẳn <code>BridgeMethodResolver</code> để tìm ngược từ bridge method về method gốc, vì annotation bạn đặt trên method thật thường không được sao chép sang bridge method.","<b>Bẫy thật sự: ClassCastException từ dòng bạn không viết.</b> Nếu ai đó dùng raw type và gọi <code>((Comparable) box).compareTo(someString)</code>, phép cast nằm bên trong bridge method sẽ nổ ClassCastException. Stack trace chỉ tới đúng class của bạn ở một method 'không tồn tại' trong source — rất dễ làm người mới hoang mang. Đó cũng là một minh chứng rằng generic không đảm bảo an toàn kiểu khi có raw type trong hệ thống.","<b>Vì sao nên biết.</b> Ngoài giá trị hiểu biết, nó giải thích vì sao <code>@Override</code> đôi khi hoạt động kỳ lạ với generic, vì sao annotation trên method generic đôi khi 'biến mất' với thư viện reflection viết cẩu thả, và vì sao số method thực tế trong class file nhiều hơn số method bạn viết."],"example":"class Box implements Comparable<Box> {\n    int v;\n    Box(int v) { this.v = v; }\n    @Override public int compareTo(Box o) { return Integer.compare(v, o.v); }\n}\n\n// Compiler sinh thêm (KHÔNG có trong source):\n// public synthetic bridge int compareTo(Object o) {\n//     return this.compareTo((Box) o);\n// }\n\nfor (Method m : Box.class.getDeclaredMethods()) {\n    System.out.println(m.getName() + \" bridge=\" + m.isBridge()\n                       + \" synthetic=\" + m.isSynthetic());\n}\n// compareTo bridge=false synthetic=false\n// compareTo bridge=true  synthetic=true\n\n// Raw type + bridge method = ClassCastException từ nơi không có cast trong source\nComparable raw = new Box(1);\n// raw.compareTo(\"abc\");   // ClassCastException phát ra bên trong bridge method","exampleTitle":"Method compiler tự sinh","keyPoints":["Sau erasure, Comparable<Box> trở thành compareTo(Object) nên compareTo(Box) không override được","Compiler sinh bridge method mang cờ ACC_BRIDGE và ACC_SYNTHETIC, cast rồi uỷ quyền sang method thật","Covariant return type cũng được hiện thực bằng bridge method","Method.isBridge() nhận diện chúng; Spring có BridgeMethodResolver để tìm về method gốc","Annotation thường không có trên bridge method, nên thư viện reflection phải xử lý riêng","ClassCastException từ bên trong bridge method là dấu hiệu có raw type len lỏi trong hệ thống"],"trap":"Đếm số method bằng getDeclaredMethods() rồi ngạc nhiên vì có method thừa, hoặc quét annotation mà quên lọc bridge method — annotation nằm trên method gốc chứ không nằm trên bản bridge.","followUp":["Vì sao bridge method cần cho covariant return type dù đó không phải chuyện generic?","Điều gì xảy ra khi gọi method generic qua reference raw type?","Vì sao Spring cần BridgeMethodResolver?"]},{"id":"t-5-3","topicId":5,"versions":[8,11,17,21],"title":"PECS: wildcard cho đọc gì và cho ghi gì","summary":"Vì sao List<? extends Number> không add được, và quy tắc để không bao giờ phải đoán nữa.","sections":["<b><code>? extends T</code> là producer — chỉ đọc.</b> <code>List&lt;? extends Number&gt;</code> nghĩa là 'một list của MỘT kiểu con nào đó của Number, nhưng tôi không biết là kiểu nào'. Đọc ra thì an toàn vì bất kỳ kiểu nào cũng là Number. Ghi thì không: list đó có thể thực sự là <code>List&lt;Double&gt;</code>, nên nếu cho phép <code>add(1)</code> thì một Integer sẽ lọt vào list Double. Compiler chặn mọi phép add, trừ <code>null</code> vì null hợp với mọi kiểu tham chiếu.","<b><code>? super T</code> là consumer — ghi được, đọc hạn chế.</b> <code>List&lt;? super Integer&gt;</code> là 'list của một kiểu cha nào đó của Integer'. Dù kiểu thật là <code>List&lt;Integer&gt;</code>, <code>List&lt;Number&gt;</code> hay <code>List&lt;Object&gt;</code>, ghi một Integer vào đều hợp lệ. Nhưng đọc ra thì chỉ có thể đảm bảo là <code>Object</code>, vì ta không biết cha đó cụ thể ở tầng nào.","<b>Quy tắc PECS.</b> Producer-Extends, Consumer-Super: tham số mà method chỉ ĐỌC dữ liệu ra thì dùng <code>extends</code>; tham số mà method GHI dữ liệu vào thì dùng <code>super</code>. Thư viện chuẩn tuân thủ triệt để: <code>Collections.copy(List&lt;? super T&gt; dest, List&lt;? extends T&gt; src)</code>, <code>Stream.map(Function&lt;? super T, ? extends R&gt;)</code>, <code>Collections.sort(List&lt;T&gt;, Comparator&lt;? super T&gt;)</code>.","<b>Wildcard không giới hạn <code>&lt;?&gt;</code>.</b> Đọc ra được Object, không ghi được gì ngoài null. Dùng khi method không quan tâm kiểu phần tử, ví dụ chỉ cần <code>size()</code> hay <code>clear()</code>. Cần phân biệt rõ với <code>List&lt;Object&gt;</code>: <code>List&lt;?&gt;</code> là 'list của một kiểu nào đó chưa rõ' và chỉ nhận được từ mọi loại list; <code>List&lt;Object&gt;</code> là 'list chứa Object' nên ghi được mọi thứ nhưng KHÔNG nhận được <code>List&lt;String&gt;</code>.","<b>Quy tắc thực hành về vị trí.</b> Wildcard nên xuất hiện ở tham số method để API nhận được nhiều loại đối số hơn; tránh đặt ở kiểu TRẢ VỀ, vì khi đó người gọi buộc phải khai báo biến kiểu wildcard và sự phiền toái lan ra khắp code của họ. Nếu người dùng API phải nghĩ về wildcard thì thiết kế đã sai.","<b>Wildcard capture khi cần vừa đọc vừa ghi.</b> Trên một <code>List&lt;?&gt;</code> bạn không thể lấy ra rồi đặt lại vào chính nó, vì compiler coi kiểu đọc ra và kiểu ghi vào là hai thứ không liên quan. Mẹo chuẩn là viết một private helper generic <code>&lt;T&gt; void swapHelper(List&lt;T&gt; l, int i, int j)</code> rồi gọi từ method wildcard — compiler sẽ 'bắt' (capture) kiểu ẩn danh đó thành T và mọi thứ khớp trở lại."],"example":"// Producer: chỉ đọc -> extends\nstatic double sum(List<? extends Number> nums) {\n    double t = 0;\n    for (Number n : nums) t += n.doubleValue();   // đọc: OK\n    // nums.add(1);                                // lỗi biên dịch\n    nums.add(null);                                // hợp lệ duy nhất\n    return t;\n}\n\n// Consumer: ghi vào -> super\nstatic void fill(List<? super Integer> dest) {\n    dest.add(1);                  // ghi Integer: OK\n    // Integer x = dest.get(0);   // lỗi: chỉ đảm bảo Object\n    Object o = dest.get(0);\n}\n\nList<Integer> ints = new ArrayList<>();\nfill(ints);                       // List<Integer> khớp ? super Integer\nList<Object> objs = new ArrayList<>();\nfill(objs);                       // List<Object> cũng khớp\nsum(ints);                        // List<Integer> khớp ? extends Number\n\n// Wildcard capture: helper generic để vừa đọc vừa ghi\nstatic void swap(List<?> list, int i, int j) { swapHelper(list, i, j); }\nprivate static <T> void swapHelper(List<T> list, int i, int j) {\n    list.set(i, list.set(j, list.get(i)));\n}","exampleTitle":"Producer, consumer và wildcard capture","keyPoints":["? extends T: đọc ra được T, không add được gì ngoài null vì kiểu thật là ẩn số","? super T: add được T và mọi kiểu con của T, nhưng đọc ra chỉ đảm bảo Object","PECS — Producer Extends, Consumer Super; thư viện chuẩn tuân thủ triệt để","List<?> khác List<Object>: cái đầu nhận được mọi list nhưng không ghi được, cái sau ghi được nhưng chỉ nhận đúng List<Object>","Đặt wildcard ở tham số method, tránh đặt ở kiểu trả về vì nó lây phiền toái sang người gọi","Cần vừa đọc vừa ghi trên List<?> thì dùng private helper generic để compiler capture kiểu ẩn danh"],"trap":"Giải thích 'không add được vì list là read-only'. Không phải: list bên dưới hoàn toàn ghi được, chỉ là compiler không biết kiểu thật là gì nên không có phép add nào chứng minh được là an toàn.","followUp":["Vì sao add(null) lại hợp lệ trên List<? extends Number>?","Vì sao Comparator trong Collections.sort được khai báo là Comparator<? super T>?","Wildcard capture là gì và vì sao helper method giải quyết được nó?"]},{"id":"t-5-4","topicId":5,"versions":[8,11,17,21],"title":"Generic bất biến trong khi mảng hiệp biến: hai triết lý trong cùng một ngôn ngữ","summary":"Vì sao List<String> không phải List<Object> nhưng String[] lại là Object[] — và cái giá của lựa chọn cũ.","sections":["<b>Generic là invariant.</b> <code>List&lt;String&gt;</code> KHÔNG phải là kiểu con của <code>List&lt;Object&gt;</code>, dù String là kiểu con của Object. Lý do rất trực tiếp: nếu cho phép, ta có thể gán một <code>List&lt;String&gt;</code> vào biến <code>List&lt;Object&gt;</code> rồi <code>add(42)</code>, và mọi đoạn code đang đọc list đó dưới dạng String sẽ vỡ. Compiler chặn ngay từ dòng gán.","<b>Mảng thì covariant.</b> <code>String[]</code> LÀ <code>Object[]</code>. Đây là quyết định từ Java 1.0, khi ngôn ngữ chưa có generic mà vẫn cần viết được những method dùng chung như <code>Arrays.sort(Object[])</code> hay <code>System.arraycopy</code>. Không có covariance thì mọi utility trên mảng phải viết lại cho từng kiểu.","<b>Cái giá: kiểm tra bị đẩy sang runtime.</b> Vì mảng biết kiểu phần tử thật của mình (mảng là reified), mỗi lệnh ghi <code>aastore</code> phải kiểm tra kiểu tại thời điểm chạy. Ghi sai kiểu thì ném <code>ArrayStoreException</code> — một lỗi mà generic bắt được ngay lúc biên dịch. Đây là ví dụ kinh điển cho việc bắt lỗi sớm luôn rẻ hơn.","<b>Vì vậy không nên trộn mảng với generic.</b> <code>new List&lt;String&gt;[10]</code> bị cấm, vì mảng đó sẽ không kiểm tra được gì lúc runtime (kiểu phần tử của nó sau erasure chỉ là List) trong khi mảng lại tin rằng nó kiểm tra được. Muốn có <code>T[]</code>, bạn chỉ còn hai cách: <code>(T[]) new Object[n]</code> kèm unchecked cast, hoặc <code>Array.newInstance(clazz, n)</code> với một type token.","<b>Vì sao ArrayList giữ Object[] chứ không giữ E[].</b> Đọc mã nguồn ArrayList sẽ thấy field là <code>transient Object[] elementData</code> và phép cast sang E chỉ xảy ra khi đọc ra. Nếu nó khai báo <code>E[] elementData = (E[]) new Object[n]</code> thì mảng đó vẫn thực sự là Object[]; ngay khi ai đó làm lộ nó ra ngoài dưới kiểu E[], JVM sẽ ném ClassCastException. Giữ Object[] bên trong và cast từng phần tử là cách an toàn.","<b>Trả lại tính linh hoạt bằng wildcard.</b> Nếu bạn muốn một method nhận được cả <code>List&lt;String&gt;</code> lẫn <code>List&lt;Integer&gt;</code>, đó chính là công việc của wildcard: khai báo tham số là <code>List&lt;? extends Object&gt;</code> hoặc <code>List&lt;?&gt;</code>. Nói cách khác, Java không bỏ covariance — nó chỉ chuyển covariance từ kiểu (như mảng) sang điểm sử dụng (use-site variance), và nhờ đó giữ được an toàn kiểu."],"example":"// Mảng: hiệp biến, lỗi lộ ra lúc chạy\nObject[] arr = new String[2];\narr[0] = \"ok\";\narr[1] = 42;            // BIÊN DỊCH OK -> ArrayStoreException lúc chạy\n\n// Generic: bất biến, lỗi bị chặn lúc biên dịch\n// List<Object> l = new ArrayList<String>();   // lỗi biên dịch\n\n// Muốn nhận nhiều kiểu thì dùng wildcard\nstatic int size(List<?> any) { return any.size(); }\n\n// ArrayList giữ Object[] bên trong chính vì lý do này\nclass MyList<E> {\n    private Object[] data = new Object[10];\n    @SuppressWarnings(\"unchecked\")\n    E get(int i) { return (E) data[i]; }   // cast bị xoá, an toàn vì mảng không lộ ra ngoài\n    void add(int i, E e) { data[i] = e; }\n}\n\n// Tạo mảng generic đúng cách: dùng type token\nstatic <T> T[] newArray(Class<T> type, int n) {\n    return (T[]) java.lang.reflect.Array.newInstance(type, n);\n}","exampleTitle":"Hai triết lý, hai thời điểm phát hiện lỗi","keyPoints":["Generic invariant: List<String> không phải List<Object>, lỗi bị chặn lúc biên dịch","Mảng covariant: String[] là Object[], di sản từ Java 1.0 khi chưa có generic","Mảng là reified nên mỗi phép ghi bị kiểm tra lúc chạy, sai thì ném ArrayStoreException","new List<String>[10] bị cấm vì mảng generic không kiểm tra được kiểu thật lúc runtime","ArrayList giữ Object[] bên trong và cast từng phần tử khi đọc, thay vì giữ E[]","Wildcard là cách Java trả lại tính linh hoạt mà vẫn giữ an toàn kiểu"],"trap":"Trả lời 'vì Java thiết kế không nhất quán'. Câu trả lời ăn điểm là nêu đúng lý do lịch sử (mảng có trước generic, cần Arrays.sort(Object[]) dùng chung) và nêu đúng cái giá phải trả (kiểm tra dời sang runtime, ArrayStoreException).","followUp":["Vì sao new List<String>[10] bị cấm trong khi new List[10] thì được?","ArrayList lưu Object[] hay E[] bên trong, và vì sao?","Wildcard giải quyết bài toán covariance mà không phá an toàn kiểu như thế nào?"]},{"id":"t-5-5","topicId":5,"versions":[8,11,17,21],"title":"Heap pollution, varargs generic, @SafeVarargs và raw type","summary":"Nguồn gốc của những ClassCastException nổ ở dòng code không hề có phép ép kiểu.","sections":["<b>Heap pollution là gì.</b> Đó là tình trạng một biến có kiểu tham số hoá lại đang trỏ tới object không đúng kiểu đó — ví dụ biến <code>List&lt;String&gt;</code> thực chất trỏ tới list chứa Integer. Nó chỉ xảy ra khi có raw type hoặc unchecked cast trong đường đi. Triệu chứng đặc trưng: ClassCastException nổ ở một dòng không có ép kiểu nào trong source, vì cast thật là do compiler chèn khi đọc phần tử ra.","<b>Vì sao varargs generic sinh cảnh báo.</b> Khai báo <code>void f(List&lt;String&gt;... lists)</code> buộc compiler tạo một mảng <code>List&lt;String&gt;[]</code> để gói tham số — mà mảng generic vốn không an toàn vì mảng thì hiệp biến còn generic thì bất biến. Nếu method chỉ đọc mảng thì thực tế không sao; nhưng nếu nó gán mảng đó ra ngoài (return, gán vào field, hoặc chỉ đơn giản đưa vào một biến <code>Object[]</code>), người khác có thể nhét sai kiểu vào và làm hỏng nó.","<b><code>@SafeVarargs</code> (Java 7) chỉ là lời cam kết.</b> Nó tắt cảnh báo, hoàn toàn KHÔNG kiểm chứng gì. Bạn đang tuyên bố rằng method không lưu và không lộ mảng varargs ra ngoài. Đặt nhầm chỗ là tự tay tạo bug và còn tắt mất cảnh báo lẽ ra sẽ cứu bạn.","<b>Vì sao @SafeVarargs bị giới hạn vị trí.</b> Nó chỉ đặt được lên method <code>static</code>, method <code>final</code>, constructor, và từ Java 9 thêm <code>private</code> instance method. Lý do rất logic: đó đúng là tập hợp các method KHÔNG override được. Nếu một method có thể bị override, lời cam kết an toàn của class cha không ràng buộc được class con, nên annotation sẽ vô nghĩa.","<b>Raw type tắt kiểm tra rộng hơn bạn tưởng.</b> Dùng <code>List</code> thay <code>List&lt;String&gt;</code> không chỉ bỏ kiểm tra cho tham số kiểu đó — nó xoá TOÀN BỘ generic của mọi thành viên trong kiểu đó. Với một <code>Map</code> raw, <code>entrySet()</code> trả về <code>Set</code> raw chứ không phải <code>Set&lt;Map.Entry&lt;K,V&gt;&gt;</code>, kể cả những phần generic hoàn toàn không liên quan. Raw type chỉ còn tồn tại vì lý do tương thích với code trước Java 5.","<b>Phân biệt <code>List&lt;Object&gt;</code> với raw <code>List</code>.</b> <code>List&lt;Object&gt;</code> vẫn được kiểm tra kiểu đầy đủ và an toàn; raw <code>List</code> thì không kiểm tra gì. Truyền một <code>List&lt;String&gt;</code> vào tham số <code>List&lt;Object&gt;</code> là lỗi biên dịch (invariance), nhưng truyền vào tham số raw <code>List</code> thì được, chỉ kèm cảnh báo — và đó chính là cửa ngõ để heap pollution lọt vào hệ thống."],"example":"// Heap pollution qua varargs generic\nstatic void unsafe(List<String>... lists) {\n    Object[] arr = lists;             // mảng hiệp biến: hợp lệ\n    arr[0] = List.of(42);             // nhét List<Integer> vào\n    String s = lists[0].get(0);       // ClassCastException - KHÔNG có cast nào trong source\n}\n\n// An toàn: chỉ đọc, không lưu và không lộ mảng ra ngoài\n@SafeVarargs\nstatic <T> List<T> listOf(T... items) {\n    return new ArrayList<>(Arrays.asList(items));\n}\n\n// Heap pollution qua raw type\nList<String> strings = new ArrayList<>();\nList raw = strings;               // raw type\nraw.add(42);                      // chỉ CẢNH BÁO unchecked, không lỗi\nfor (String s : strings) {\n    System.out.println(s.length());   // ClassCastException ở đây\n}\n\n// List<Object> KHÁC raw List: vẫn được kiểm tra đầy đủ\n// List<Object> objs = strings;   // lỗi biên dịch - an toàn","exampleTitle":"Hai đường vào của heap pollution","keyPoints":["Heap pollution: biến kiểu tham số hoá trỏ tới object sai kiểu, luôn bắt nguồn từ raw type hoặc unchecked cast","Varargs generic buộc compiler tạo mảng generic nên sinh cảnh báo possible heap pollution","@SafeVarargs chỉ tắt cảnh báo, không kiểm chứng gì — đó là cam kết của tác giả method","@SafeVarargs chỉ đặt được lên static, final, constructor, và từ Java 9 thêm private instance method — đúng tập method không override được","Raw type xoá toàn bộ generic của mọi thành viên trong kiểu, kể cả phần không liên quan","List<Object> vẫn an toàn kiểu; raw List thì không — đừng lẫn hai thứ này"],"trap":"Tin rằng @SafeVarargs làm cho method trở nên an toàn. Nó không kiểm tra bất cứ điều gì; đặt lên một method có lộ mảng varargs ra ngoài là vừa giữ nguyên bug vừa tắt mất cảnh báo.","followUp":["Vì sao @SafeVarargs không đặt được lên instance method thông thường?","Raw List khác List<Object> ở điểm nào về mặt kiểm tra kiểu?","Vì sao ClassCastException do heap pollution lại nổ ở dòng không có phép ép kiểu?"]},{"id":"t-6-1","topicId":6,"versions":[8,11,17,21],"title":"Checked vs unchecked: cây Throwable và tranh luận thiết kế","summary":"Vì sao Java chia exception thành hai nhánh, compiler ép buộc điều gì, và vì sao giới thiết kế API hiện đại phần lớn quay lưng với checked exception.","sections":["<b>Cấu trúc cây.</b> Gốc là <code>Throwable</code>, chia hai nhánh: <code>Error</code> và <code>Exception</code>. Trong nhánh <code>Exception</code> lại tách ra <code>RuntimeException</code>. Quy tắc của compiler rất gọn: mọi thứ kế thừa <code>Error</code> hoặc <code>RuntimeException</code> là <i>unchecked</i>, phần còn lại là <i>checked</i>. Đây là quy tắc cú pháp thuần tuý, không phụ thuộc ngữ nghĩa — nên đừng học thuộc danh sách, hãy nhìn cây kế thừa.","<b>Checked nghĩa là compiler ép catch-or-declare.</b> Nếu một method có thể ném checked exception, nó buộc phải hoặc bắt tại chỗ, hoặc khai báo <code>throws</code> để đẩy trách nhiệm lên trên. Ý đồ ban đầu của Gosling là biến các lỗi <i>có thể phục hồi được</i> thành một phần của chữ ký method, để người gọi không thể vô tình bỏ qua. <code>IOException</code>, <code>SQLException</code>, <code>InterruptedException</code>, <code>ClassNotFoundException</code> đều thuộc nhóm này.","<b>Unchecked dành cho lỗi lập trình.</b> <code>NullPointerException</code>, <code>IllegalArgumentException</code>, <code>IllegalStateException</code>, <code>IndexOutOfBoundsException</code> mô tả những tình huống mà cách sửa đúng là <i>sửa code</i>, không phải viết catch. Bắt chúng thường chỉ để che giấu bug. Ngoại lệ hợp lý duy nhất là ở biên hệ thống, nơi bạn phải chuyển mọi lỗi thành một response thay vì để process chết.","<b>Vì sao cộng đồng quay lưng với checked exception.</b> Ba lý do thực tế: (1) nó rò rỉ chi tiết cài đặt vào chữ ký — đổi từ JDBC sang HTTP là đổi cả <code>throws</code> của mọi tầng; (2) nó không tương thích với lambda, vì các functional interface trong <code>java.util.function</code> đều không khai báo <code>throws</code>, nên gọi code ném checked exception trong <code>map()</code> là compile error; (3) trên thực tế nó đẻ ra <code>catch (IOException e) { }</code> rỗng — tệ hơn hẳn việc để exception bay lên. Spring, Hibernate và phần lớn framework hiện đại đều bọc lại thành unchecked (<code>DataAccessException</code>) chính vì vậy.","<b>Error là chuyện của JVM, không phải của bạn.</b> <code>OutOfMemoryError</code>, <code>StackOverflowError</code>, <code>NoClassDefFoundError</code> báo hiệu môi trường chạy đã hỏng. Bắt <code>Throwable</code> để 'cho chắc' là anti-pattern: sau một <code>OutOfMemoryError</code>, heap vẫn đầy và mọi thao tác tiếp theo đều không đáng tin, nên chiến lược đúng gần như luôn là để process chết và cho orchestrator khởi động lại.","<b>Nguyên tắc chọn khi tự thiết kế.</b> Chỉ dùng checked khi người gọi <i>có hành động cụ thể và hợp lý</i> để phục hồi, và bạn muốn ép họ nghĩ về nó. Nếu câu trả lời cho 'người gọi làm gì với exception này?' là 'log rồi ném tiếp' thì hãy để nó unchecked. Đây là câu hỏi vặn rất hay gặp và người phỏng vấn muốn nghe lập luận, không muốn nghe định nghĩa."],"example":"// Checked: compiler ép bạn xử lý\nvoid load(Path p) throws IOException {\n    String s = Files.readString(p);\n}\n\n// Unchecked: không cần khai báo, dùng cho lỗi lập trình / vi phạm hợp đồng\nvoid withdraw(long amount) {\n    if (amount <= 0) {\n        throw new IllegalArgumentException(\"amount must be positive: \" + amount);\n    }\n}\n\n// Vì sao checked exception không hợp với lambda:\n// list.stream().map(p -> Files.readString(p))  // KHÔNG compile\n// Function.apply() không khai báo throws IOException","exampleTitle":"Hai nhánh và điểm va chạm với lambda","keyPoints":["Unchecked = kế thừa RuntimeException hoặc Error; mọi thứ còn lại dưới Exception là checked.","Checked thể hiện lỗi phục hồi được; unchecked thể hiện bug hoặc vi phạm hợp đồng.","Checked exception không dùng được trong lambda của java.util.function vì các interface đó không khai báo throws.","Framework hiện đại (Spring, Hibernate) bọc checked exception thành unchecked để không rò rỉ chi tiết hạ tầng.","Không bao giờ bắt Error: sau OutOfMemoryError, trạng thái JVM không còn đáng tin."],"trap":"Nhiều người nói RuntimeException là 'exception xảy ra lúc chạy' còn checked là 'lúc compile'. Sai hoàn toàn: mọi exception đều xảy ra lúc chạy, khác biệt chỉ nằm ở việc compiler có ép bạn khai báo hay không.","followUp":["InterruptedException là checked hay unchecked, và vì sao nuốt nó là lỗi nghiêm trọng?","Nếu bạn thiết kế lại Java hôm nay, bạn có giữ checked exception không? Vì sao?","Vì sao Spring chọn bọc SQLException thành DataAccessException unchecked?"]},{"id":"t-6-2","topicId":6,"versions":[8,11,17,21],"title":"finally: quy tắc thực thi và hai cách nó phá code của bạn","summary":"finally luôn chạy, nhưng chính điều đó khiến return và throw đặt trong finally có thể âm thầm xoá mất kết quả hoặc exception gốc.","sections":["<b>Hợp đồng của finally.</b> Khối <code>finally</code> chạy dù khối <code>try</code> kết thúc bình thường, kết thúc bằng <code>return</code>/<code>break</code>/<code>continue</code>, hay kết thúc bằng exception. Nó chỉ không chạy khi tiến trình biến mất hoặc luồng điều khiển không bao giờ ra khỏi <code>try</code>: <code>System.exit()</code>, <code>Runtime.getRuntime().halt()</code> (khác <code>exit()</code> ở chỗ nó bỏ qua cả shutdown hook), JVM bị kill từ bên ngoài, JVM crash hoặc <code>abort</code>, và thread chạy trong đó không bao giờ kết thúc (deadlock, vòng lặp vô hạn).","<b>Cơ chế của return trong try + finally.</b> Khi <code>try</code> gặp <code>return expr</code>, JVM <i>tính giá trị của expr trước</i>, cất vào một slot tạm, rồi mới chạy <code>finally</code>, cuối cùng mới thực sự trả về giá trị đã cất. Hệ quả cực kỳ hay bị hỏi: nếu <code>finally</code> sửa một biến local đã được đọc xong, giá trị trả về <b>không đổi</b>; nhưng nếu <code>finally</code> gọi method làm thay đổi <i>nội dung</i> của object đang được trả về thì thay đổi đó có tác dụng, vì thứ được cất đi là reference chứ không phải bản sao.","<b>return trong finally nuốt tất cả.</b> Nếu bản thân <code>finally</code> chứa <code>return</code>, nó ghi đè giá trị của <code>try</code> và — nghiêm trọng hơn nhiều — <b>huỷ luôn exception đang bay lên</b>. Một exception vừa được ném trong <code>try</code> sẽ biến mất không dấu vết, method trả về bình thường như thể không có gì xảy ra. Đây là một trong những nguồn bug khó chẩn đoán nhất; mọi static analyzer nghiêm túc (SpotBugs, Error Prone, SonarQube) đều báo lỗi ở đây.","<b>throw trong finally cũng nuốt exception gốc.</b> Nếu <code>try</code> ném <code>A</code> và <code>finally</code> ném <code>B</code>, thứ bay lên trên là <code>B</code>; <code>A</code> bị vứt đi hoàn toàn — không được gắn vào <code>getSuppressed()</code>, không có cách nào lấy lại. Đây chính là lý do vì sao pattern <code>finally { conn.close(); }</code> thủ công lại nguy hiểm: <code>close()</code> ném <code>IOException</code> và nuốt mất nguyên nhân thật của lỗi. Chi tiết này phân biệt rất rõ ứng viên đã đọc kỹ với ứng viên chỉ dùng theo thói quen.","<b>Quy tắc thực hành.</b> Không bao giờ đặt <code>return</code>, <code>break</code>, <code>continue</code> hay <code>throw</code> trong <code>finally</code>. Khối <code>finally</code> chỉ nên làm đúng một việc: dọn dẹp, và nếu thao tác dọn dẹp có thể ném exception thì phải tự bắt và log tại chỗ. Với tài nguyên, hãy dùng <code>try-with-resources</code> — nó giải quyết đúng bài toán này bằng cơ chế suppressed exception.","<b>Liên hệ thực tế.</b> Trong code có transaction, một <code>return</code> lạc trong <code>finally</code> có thể khiến method báo thành công trong khi rollback đã xảy ra, và tầng trên tưởng dữ liệu đã được ghi. Loại bug này thường chỉ lộ ra dưới tải hoặc khi database timeout."],"example":"static int a() {\n    int x = 1;\n    try {\n        return x;      // giá trị 1 được cất trước\n    } finally {\n        x = 99;        // sửa biến local -> KHÔNG ảnh hưởng\n    }\n}                      // -> 1\n\nstatic int b() {\n    try {\n        return 1;\n    } finally {\n        return 2;      // ghi đè -> 2\n    }\n}\n\nstatic int c() {\n    try {\n        throw new IllegalStateException(\"boom\");\n    } finally {\n        return 3;      // exception biến mất, method trả về 3\n    }\n}\n\nstatic List<String> d() {\n    List<String> list = new ArrayList<>();\n    try {\n        return list;   // cất reference\n    } finally {\n        list.add(\"x\"); // sửa NỘI DUNG -> caller thấy [\"x\"]\n    }\n}","exampleTitle":"Bốn biến thể return/finally hay bị hỏi","keyPoints":["return trong try tính giá trị trước, chạy finally sau, rồi mới trả về giá trị đã tính.","Sửa biến local trong finally không đổi giá trị trả về; sửa nội dung object đang trả về thì có.","return hoặc throw trong finally huỷ hoàn toàn exception đang bay lên — không có suppressed nào được giữ lại.","finally không chạy khi System.exit() hoặc Runtime.halt(), khi JVM bị kill hay crash, hoặc khi thread không bao giờ thoát khỏi try.","finally chỉ nên dọn dẹp; mọi exception phát sinh khi dọn dẹp nên được bắt và log tại chỗ."],"trap":"Câu hỏi kinh điển: 'try có return, finally cũng có return, kết quả là gì?' Đáp án là giá trị của finally, và nếu try đang ném exception thì exception đó bị nuốt mất luôn — phần thứ hai mới là điều người phỏng vấn thực sự chờ nghe.","followUp":["Nếu try ném IllegalArgumentException và finally ném IllegalStateException, exception nào bay lên và exception kia đi đâu?","Vì sao try-with-resources không gặp vấn đề này?","System.exit() trong try thì finally có chạy không?"]},{"id":"t-6-3","topicId":6,"versions":[8,11,17,21],"title":"try-with-resources: thứ tự đóng ngược và suppressed exception","summary":"Vì sao try-with-resources không chỉ là đường cú pháp gọn hơn mà thực sự bảo toàn được thông tin lỗi mà finally thủ công làm mất.","sections":["<b>Cơ chế cơ bản.</b> Có từ Java 7, mọi tài nguyên khai báo trong ngoặc của <code>try</code> phải implement <code>AutoCloseable</code>. Compiler sinh ra khối <code>finally</code> tự động gọi <code>close()</code>. Điểm quan trọng về thứ tự thực thi: tài nguyên được đóng <b>trước</b> khi khối <code>catch</code> và <code>finally</code> của chính câu <code>try</code> đó chạy — nên trong <code>catch</code> bạn không được phép giả định tài nguyên còn mở.","<b>Đóng theo thứ tự ngược với thứ tự khai báo.</b> Khai báo <code>A</code> rồi <code>B</code> thì đóng <code>B</code> trước, <code>A</code> sau. Đây không phải chi tiết vụn vặt mà là điều kiện đúng đắn: tài nguyên khai báo sau thường được xây trên tài nguyên khai báo trước (<code>BufferedWriter</code> bọc <code>FileWriter</code>, <code>PreparedStatement</code> lấy từ <code>Connection</code>), nên phải đóng lớp ngoài trước khi lớp trong biến mất.","<b>Suppressed exception — điểm khác biệt lớn nhất so với finally thủ công.</b> Nếu thân <code>try</code> ném exception <code>A</code> và <code>close()</code> ném exception <code>B</code>, thì <code>A</code> là exception chính bay lên, còn <code>B</code> được gắn vào <code>A</code> qua <code>addSuppressed()</code> và lấy lại được bằng <code>getSuppressed()</code>. Với <code>finally { r.close(); }</code> viết tay thì ngược lại hoàn toàn: <code>B</code> bay lên và <code>A</code> — nguyên nhân thật của sự cố — mất sạch. Đây chính là lý do kỹ thuật khiến try-with-resources ra đời, chứ không phải để code ngắn hơn.","<b>AutoCloseable vs Closeable.</b> <code>Closeable</code> (Java 5, trong <code>java.io</code>) kế thừa <code>AutoCloseable</code> (Java 7, trong <code>java.lang</code>). Hai khác biệt: <code>Closeable.close()</code> chỉ ném <code>IOException</code> còn <code>AutoCloseable.close()</code> khai báo <code>throws Exception</code>; và javadoc của <code>Closeable</code> yêu cầu <code>close()</code> phải <i>idempotent</i> — gọi lần thứ hai không có tác dụng gì — trong khi <code>AutoCloseable</code> không bắt buộc, chỉ 'khuyến khích mạnh'. Khi tự viết resource, nên thu hẹp chữ ký <code>close()</code> xuống exception cụ thể (hoặc không ném gì) để người dùng không bị ép bắt <code>Exception</code>.","<b>Biến effectively final từ Java 9.</b> Java 7 và 8 bắt buộc phải <i>khai báo</i> biến ngay trong ngoặc. Từ Java 9 (JEP 213), bạn được dùng lại một biến final hoặc effectively final có sẵn: <code>try (existingResource) { ... }</code>. Điều này hữu ích khi tài nguyên được truyền vào từ ngoài, nhưng cần cẩn trọng về quyền sở hữu — đóng một tài nguyên mà bạn không tạo ra thường là thiết kế sai.","<b>Bẫy về phạm vi.</b> Một biểu thức như <code>try (var out = new BufferedWriter(new FileWriter(f)))</code> chỉ an toàn một nửa: nếu constructor của <code>BufferedWriter</code> ném exception, <code>FileWriter</code> đã tạo xong sẽ không bao giờ được đóng vì nó chưa kịp trở thành resource được quản lý. Cách an toàn là khai báo tách thành hai resource."],"example":"class Res implements AutoCloseable {\n    private final String name;\n    Res(String name) { this.name = name; System.out.println(\"open \" + name); }\n    public void close() { System.out.println(\"close \" + name); }\n}\n\ntry (Res a = new Res(\"A\"); Res b = new Res(\"B\")) {\n    System.out.println(\"body\");\n}\n// open A / open B / body / close B / close A\n\n// Suppressed exception\ntry (Res r = new ThrowingRes()) {      // close() ném IllegalStateException\n    throw new RuntimeException(\"primary\");\n} catch (Exception e) {\n    System.out.println(e.getMessage());                  // primary\n    System.out.println(e.getSuppressed()[0].getMessage()); // từ close()\n}\n\n// Không an toàn: FileWriter rò rỉ nếu BufferedWriter ném exception\n// try (BufferedWriter w = new BufferedWriter(new FileWriter(f))) { }\n\n// An toàn:\ntry (FileWriter fw = new FileWriter(f);\n     BufferedWriter bw = new BufferedWriter(fw)) {\n    bw.write(\"ok\");\n}","exampleTitle":"Thứ tự đóng, suppressed, và bẫy constructor lồng nhau","keyPoints":["Tài nguyên được đóng theo thứ tự ngược với thứ tự khai báo, và đóng trước khi catch/finally của cùng câu try chạy.","Exception từ close() trở thành suppressed, exception từ thân try là exception chính — finally thủ công thì ngược lại và làm mất nguyên nhân gốc.","Closeable.close() chỉ ném IOException và phải idempotent; AutoCloseable.close() ném Exception và không bắt buộc idempotent.","Từ Java 9 có thể đưa biến effectively final vào ngoặc try mà không cần khai báo mới.","Lồng constructor trong một khai báo resource duy nhất có thể làm rò rỉ tài nguyên bên trong."],"trap":"Nhiều người tin rằng viết finally { r.close(); } là tương đương try-with-resources, chỉ dài hơn. Không tương đương: bản thủ công làm mất exception gốc khi close() cũng ném, còn try-with-resources giữ lại nó qua getSuppressed().","followUp":["Nếu có ba resource và resource ở giữa ném exception khi close(), hai cái còn lại có được đóng không?","Vì sao trong catch của try-with-resources bạn không được dùng lại tài nguyên?","Tự viết một class resource thì nên khai báo close() throws gì?"]},{"id":"t-6-4","topicId":6,"versions":[8,11,17,21],"title":"Bắt exception cho đúng: multi-catch, precise rethrow, và vì sao đừng bắt Exception","summary":"Quy tắc thứ tự catch, ràng buộc implicitly final của multi-catch, và tác hại thật sự của catch (Exception e) trong code production.","sections":["<b>Thứ tự catch phải từ hẹp tới rộng.</b> JVM chọn khối <code>catch</code> đầu tiên có kiểu tương thích, quét từ trên xuống. Vì thế nếu đặt <code>catch (Exception e)</code> trước <code>catch (IOException e)</code>, compiler báo lỗi <i>exception has already been caught</i> — đây là compile error chứ không phải warning, vì khối sau không bao giờ đến được. Với các exception <i>không</i> có quan hệ kế thừa thì thứ tự tuỳ ý.","<b>Multi-catch (Java 7) và ràng buộc implicitly final.</b> Cú pháp <code>catch (IOException | SQLException e)</code> gộp nhiều nhánh xử lý giống nhau. Hai ràng buộc: các kiểu liệt kê không được có quan hệ cha-con với nhau (nếu có thì cái con là thừa, compiler báo lỗi); và biến <code>e</code> là <b>implicitly final</b> — bạn không gán lại được cho nó. Lý do là kiểu tĩnh của <code>e</code> được suy ra là tổ tiên chung gần nhất, nên cho phép gán lại sẽ phá vỡ suy luận kiểu của compiler.","<b>Precise rethrow (Java 7).</b> Nếu tham số catch là final hoặc effectively final, compiler biết chính xác tập kiểu <i>thực sự có thể</i> đi vào khối đó, nên bạn có thể viết <code>catch (Exception e) { throw e; }</code> mà chỉ cần khai báo <code>throws IOException, SQLException</code> chứ không phải <code>throws Exception</code>. Đây là lý do quy tắc effectively final tồn tại: nó cho phép compiler suy luận hẹp hơn kiểu khai báo.","<b>Vì sao catch (Exception e) là mùi code.</b> Nó bắt luôn cả những <code>RuntimeException</code> mà bạn không hề dự tính — <code>NullPointerException</code> do bug, <code>IllegalStateException</code> do vi phạm hợp đồng — và biến bug thành 'lỗi đã xử lý'. Tệ hơn, nó bắt cả <code>InterruptedException</code>: nuốt exception này làm mất tín hiệu ngắt và khiến thread pool không shutdown được. Nếu buộc phải bắt <code>InterruptedException</code>, hãy khôi phục cờ bằng <code>Thread.currentThread().interrupt()</code>.","<b>Nơi duy nhất bắt rộng là hợp lý: biên hệ thống.</b> Trong một <code>@ControllerAdvice</code>, một message consumer, hay vòng lặp chính của worker, việc bắt <code>Exception</code> để chuyển thành response lỗi và giữ cho process sống là đúng — miễn là có log đầy đủ kèm stack trace và không nuốt im lặng. Nguyên tắc là: bắt rộng ở đúng một chỗ trên cùng, còn các tầng dưới thì để exception bay lên.","<b>Nuốt exception là anti-pattern nặng nhất.</b> <code>catch (IOException e) { }</code> hoặc <code>catch (Exception e) { e.printStackTrace(); }</code> khiến hệ thống chạy tiếp trên dữ liệu sai và làm mất hoàn toàn dấu vết trong log tập trung. Nếu thật sự có lý do bỏ qua (ví dụ đóng socket khi đang shutdown), hãy log ở mức debug kèm bình luận giải thích vì sao bỏ qua là an toàn."],"example":"// Compile error: unreachable\n// try { ... } catch (Exception e) { } catch (IOException e) { }\n\n// Multi-catch: e là implicitly final\ntry {\n    process();\n} catch (IOException | SQLException e) {\n    // e = new IOException();  // compile error: không gán lại được\n    throw new ServiceException(\"process failed\", e);   // luôn truyền cause\n}\n\n// Precise rethrow (Java 7+): khai báo hẹp hơn kiểu bắt\nvoid run() throws IOException, SQLException {\n    try {\n        process();                 // chỉ ném IOException hoặc SQLException\n    } catch (Exception e) {        // e effectively final\n        log.error(\"failed\", e);\n        throw e;                   // compiler suy ra đúng 2 kiểu trên\n    }\n}\n\n// InterruptedException: khôi phục cờ, đừng nuốt\ntry {\n    queue.take();\n} catch (InterruptedException e) {\n    Thread.currentThread().interrupt();\n    return;\n}","exampleTitle":"Thứ tự catch, multi-catch, precise rethrow","keyPoints":["Catch phải xếp từ kiểu hẹp tới kiểu rộng, đặt ngược lại là compile error chứ không phải warning.","Biến của multi-catch là implicitly final và các kiểu liệt kê không được có quan hệ kế thừa với nhau.","Precise rethrow cho phép khai báo throws hẹp hơn kiểu đã bắt, với điều kiện tham số catch effectively final.","catch (Exception e) nuốt luôn bug runtime và InterruptedException — chỉ dùng ở biên hệ thống, kèm log đầy đủ.","Bắt InterruptedException mà không gọi Thread.currentThread().interrupt() làm mất tín hiệu shutdown."],"trap":"Ứng viên hay nói multi-catch chỉ là 'viết gọn nhiều catch'. Người phỏng vấn thường vặn tiếp: vì sao biến trong multi-catch không gán lại được? Câu trả lời nằm ở suy luận kiểu — compiler dùng tổ tiên chung và dựa vào tính final để làm precise rethrow.","followUp":["Vì sao catch (IOException | FileNotFoundException e) không compile được?","Nuốt InterruptedException gây hậu quả gì cho một ExecutorService đang shutdown?","Ở tầng nào trong ứng dụng Spring thì bắt Exception là hợp lý?"]},{"id":"t-6-5","topicId":6,"versions":[8,11,17,21],"title":"Chi phí của exception và cách thiết kế custom exception","summary":"Vì sao ném exception đắt, phần đắt nằm ở đâu, và những quy tắc khiến custom exception hữu ích thay vì làm mất thông tin.","sections":["<b>Chi phí nằm ở việc tạo object, không ở khối try.</b> Một khối <code>try</code> không ném gì gần như miễn phí: JVM không sinh lệnh nào ở đầu khối, thông tin handler nằm trong <i>exception table</i> của method và chỉ được tra khi thực sự có exception. Phần đắt là constructor của <code>Throwable</code> gọi <code>fillInStackTrace()</code>, vốn phải duyệt toàn bộ call stack và ghi lại từng frame. Stack càng sâu — và stack của Spring thì rất sâu — chi phí càng lớn.","<b>Vì sao dùng exception cho luồng điều khiển là sai.</b> Ngoài chi phí, nó phá vỡ khả năng đọc hiểu: người đọc không thể suy luận luồng bình thường của chương trình khi luồng đó đi qua <code>throw</code>. Trong vòng lặp nóng, exception còn cản trở JIT inline và tối ưu. Nếu tình huống là <i>bình thường</i> (không tìm thấy bản ghi, input người dùng sai định dạng), hãy trả về <code>Optional</code>, một kiểu kết quả, hoặc <code>boolean</code> — đừng ném exception.","<b>Exception stackless khi thật sự cần.</b> Từ Java 7, <code>Throwable</code> có constructor <code>protected Throwable(String, Throwable, boolean enableSuppression, boolean writableStackTrace)</code>. Đặt <code>writableStackTrace = false</code> làm exception gần như miễn phí, dùng cho các exception dùng như signal ở tần suất rất cao. Đây là tối ưu cuối cùng chứ không phải mặc định — bỏ stack trace nghĩa là mất khả năng debug, và bạn nên đo trước khi làm.","<b>Bẫy production: stack trace biến mất.</b> HotSpot có tối ưu <code>-XX:+OmitStackTraceInFastThrow</code> (bật mặc định): khi cùng một vị trí đã được JIT biên dịch ném đi ném lại cùng loại exception ngầm định (<code>NullPointerException</code>, <code>ArrayIndexOutOfBoundsException</code>...), JVM chuyển sang dùng một instance dựng sẵn <b>không có stack trace</b>. Đó là lý do log production đôi khi chỉ có dòng <code>java.lang.NullPointerException</code> trơ trọi. Đây là hành vi riêng của HotSpot; tắt bằng <code>-XX:-OmitStackTraceInFastThrow</code> khi cần điều tra.","<b>Luôn truyền cause khi bọc exception.</b> <code>throw new ServiceException(\"failed\")</code> vứt bỏ toàn bộ nguyên nhân gốc; phải là <code>throw new ServiceException(\"failed\", e)</code>. Custom exception nên có ít nhất constructor nhận <code>(String, Throwable)</code>. Kèm theo đó là ngữ cảnh có ích: id đơn hàng, tên file — chứ không phải chuỗi chung chung 'error occurred'. Tuyệt đối không nhét dữ liệu nhạy cảm (mật khẩu, token) vào message vì message sẽ đi vào log.","<b>Đừng đẻ ra một exception cho mỗi tình huống.</b> Chỉ tạo kiểu mới khi có người <i>thực sự bắt riêng</i> nó để xử lý khác đi. Nếu mọi chỗ đều bắt chung, một kiểu duy nhất kèm mã lỗi (enum) sẽ gọn hơn hẳn. Từ Java 15, message của <code>NullPointerException</code> đã có <i>helpful NPE</i> bật mặc định (JEP 358, có từ Java 14 nhưng phải bật thủ công), chỉ rõ biến nào null — giảm hẳn nhu cầu tự bọc NPE lại."],"example":"// Đắt: fillInStackTrace duyệt toàn bộ call stack\nthrow new ValidationException(\"invalid\");\n\n// Rẻ gần như bằng 0: exception dùng làm signal, không có stack trace\npublic class NoStackException extends RuntimeException {\n    public NoStackException(String msg) {\n        super(msg, null, false, false);   // disable suppression + stack trace\n    }\n}\n\n// Sai: mất hoàn toàn nguyên nhân gốc\ntry { repo.save(o); }\ncatch (SQLException e) { throw new ServiceException(\"save failed\"); }\n\n// Đúng: giữ cause + ngữ cảnh, không lộ dữ liệu nhạy cảm\ntry { repo.save(o); }\ncatch (SQLException e) {\n    throw new ServiceException(\"save failed for orderId=\" + o.getId(), e);\n}\n\n// Custom exception tối thiểu nên có\npublic class ServiceException extends RuntimeException {\n    public ServiceException(String message) { super(message); }\n    public ServiceException(String message, Throwable cause) { super(message, cause); }\n}","exampleTitle":"Chi phí, stackless exception, và giữ cause","keyPoints":["Khối try không tốn chi phí runtime khi không có exception; chi phí nằm ở fillInStackTrace lúc tạo object.","Không dùng exception cho luồng điều khiển bình thường — dùng Optional hoặc kiểu kết quả.","Constructor 4 tham số của Throwable cho phép tạo exception không stack trace khi cần hiệu năng cực cao.","OmitStackTraceInFastThrow của HotSpot có thể làm mất stack trace trong log production.","Custom exception luôn phải có constructor nhận cause; quên truyền cause là mất toàn bộ dấu vết."],"trap":"Câu vặn hay gặp: 'Đặt try-catch quanh code có làm chậm không?' Trả lời đúng là không — chi phí chỉ phát sinh khi exception thực sự bị ném, và nằm chủ yếu ở việc thu thập stack trace.","followUp":["Vì sao log production đôi khi chỉ thấy NullPointerException mà không có stack trace nào?","Khi nào bạn chấp nhận tạo exception không có stack trace?","Nên chọn checked hay unchecked cho custom exception của tầng service?"]},{"id":"t-7-1","topicId":7,"versions":[8,11,17,21],"title":"Các vùng bộ nhớ của JVM và cái chết của PermGen","summary":"Heap, stack, metaspace, code cache — vùng nào dùng làm gì, vùng nào chia sẻ giữa các thread, và OutOfMemoryError của từng vùng nghĩa là gì.","sections":["<b>Heap — vùng chia sẻ, nơi mọi object sống.</b> Mọi instance tạo bằng <code>new</code> và mọi mảng đều nằm trên heap, dùng chung cho toàn bộ thread và là vùng duy nhất chứa object của ứng dụng. Nói &quot;vùng duy nhất được garbage collector quản lý&quot; là không chính xác: metaspace cũng được GC thu hồi khi class unloading diễn ra trong một chu kỳ GC, và string table cũng được dọn theo GC. Kích thước điều khiển bằng <code>-Xms</code> (khởi tạo) và <code>-Xmx</code> (tối đa). Khi heap không còn chỗ cho object mới sau khi GC đã cố hết sức, bạn nhận <code>OutOfMemoryError: Java heap space</code>.","<b>Stack — riêng cho từng thread.</b> Mỗi thread có stack riêng, mỗi lần gọi method đẩy vào một <i>frame</i> chứa biến local, tham số, operand stack và địa chỉ trả về. Vì stack là riêng nên biến local luôn thread-safe một cách tự nhiên. Kích thước mỗi stack đặt bằng <code>-Xss</code> (mặc định thường 512KB–1MB tuỳ nền tảng); đệ quy quá sâu cho <code>StackOverflowError</code>. Lưu ý về ngân sách bộ nhớ: stack nằm ngoài <code>-Xmx</code>, nên vài nghìn thread có thể làm cạn RAM của container dù heap còn trống — đó là lỗi <code>OutOfMemoryError: unable to create new native thread</code>.","<b>Metaspace thay PermGen từ Java 8.</b> Trước Java 8, metadata của class nằm trong PermGen — một vùng thuộc heap, kích thước cố định qua <code>-XX:MaxPermSize</code>, và là thủ phạm kinh điển của <code>OutOfMemoryError: PermGen space</code> khi redeploy nhiều lần trên app server. Java 8 (JEP 122) xoá bỏ PermGen; metadata chuyển sang <b>metaspace</b> nằm trong <i>native memory</i>, mặc định không giới hạn trên (chỉ bị chặn bởi RAM của máy), giới hạn bằng <code>-XX:MaxMetaspaceSize</code>. Cờ <code>-XX:MaxPermSize</code> trên Java 8+ bị bỏ qua kèm cảnh báo — đây là câu hỏi rất hay gặp khi phỏng vấn về migration.","<b>String pool đã rời PermGen từ Java 7.</b> Nhiều người vẫn nhầm rằng string pool nằm trong PermGen. Từ Java 7 nó đã chuyển vào heap, nghĩa là chuỗi được <code>intern()</code> nay chịu GC bình thường và không còn làm tràn PermGen. Kích thước bảng băm của pool chỉnh được bằng <code>-XX:StringTableSize</code>.","<b>Code cache — nơi JIT cất mã máy.</b> Mã do JIT biên dịch nằm trong code cache (native memory, <code>-XX:ReservedCodeCacheSize</code>). Khi vùng này đầy, JVM tắt compiler và toàn bộ ứng dụng rơi về chế độ thông dịch — triệu chứng là hiệu năng tụt đột ngột nhiều lần mà GC log hoàn toàn bình thường. Từ Java 9, code cache được ch
