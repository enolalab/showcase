của PECS: dùng extends cho tham số mà bạn chỉ đọc ra.","whyWrong":["Chương trình không biên dịch được nên không bao giờ chạy tới bước có 4 phần tử.","","Đọc ra dưới dạng Number là thao tác an toàn duy nhất mà wildcard extends đảm bảo, nên dòng đó hoàn toàn hợp lệ.","Đây là lỗi ở tầng kiểu nên bị chặn lúc biên dịch; UnsupportedOperationException là chuyện của list bất biến như List.of, không liên quan tới wildcard."]},{"id":"d-5-5","topicId":5,"versions":[8,11,17,21],"difficulty":"intermediate","question":"Đoạn code sau chạy ra sao?","code":"Object[] arr = new String[3];\narr[0] = \"ok\";\narr[1] = 42;\nSystem.out.println(\"done\");","choices":["In done — mảng Object[] nhận được mọi kiểu","Lỗi biên dịch tại arr[1] = 42","Ném ArrayStoreException lúc chạy tại arr[1] = 42, vì mảng thật là String[] và mảng trong Java là hiệp biến nên phép kiểm tra kiểu bị dời sang runtime","Ném ClassCastException ngay tại dòng gán đầu tiên"],"correctAnswer":2,"explanation":"Mảng trong Java là covariant: String[] được coi là Object[] nên phép gán ở dòng đầu hợp lệ về mặt biên dịch. Nhưng mảng cũng là reified — object mảng biết chính xác kiểu phần tử thật của nó — nên mỗi lệnh ghi phần tử đều bị JVM kiểm tra và ném ArrayStoreException khi kiểu không khớp. Đây chính là cái giá của covariance: lỗi chỉ lộ ra lúc chạy. Generic chọn hướng ngược lại (invariant) nên phép gán tương đương List<Object> l = new ArrayList<String>() bị chặn ngay lúc biên dịch — an toàn hơn hẳn.","whyWrong":["Kiểu khai báo là Object[] nhưng object thật là String[], và mảng kiểm tra kiểu phần tử ở mỗi lần ghi.","Compiler không báo lỗi: về mặt kiểu tĩnh, gán một Integer đã boxing vào phần tử Object[] là hoàn toàn hợp lệ.","","ClassCastException là lỗi khi ép kiểu một tham chiếu; ở đây không có phép ép kiểu nào, lỗi phát sinh khi GHI vào mảng nên là ArrayStoreException."]},{"id":"d-5-6","topicId":5,"versions":[8,11,17,21],"difficulty":"intermediate","question":"Sau erasure, tham số kiểu <T extends Number & Comparable<T>> được thay bằng gì trong bytecode?","choices":["Object","Comparable","Một kiểu tổng hợp kết hợp cả Number và Comparable","Number — bound trái nhất; những bound còn lại được xử lý bằng checkcast ở nơi cần"],"correctAnswer":3,"explanation":"Erasure của một tham số kiểu là bound trái nhất (leftmost bound); nếu không khai báo bound nào thì là Object. Vì vậy <T extends Number & Comparable<T>> erase thành Number, và ở những chỗ cần gọi method của bound thứ hai, compiler chèn checkcast sang Comparable. Chi tiết đi kèm đáng nói trong phỏng vấn: khi có nhiều bound, nếu một trong số đó là class thì nó BẮT BUỘC phải đứng đầu về mặt cú pháp — nên thứ tự bound vừa là ràng buộc ngôn ngữ vừa quyết định signature sau erasure, và điều đó ảnh hưởng tới việc method có bị coi là trùng erasure với method khác hay không.","whyWrong":["Object chỉ là kết quả erasure khi tham số kiểu không có bound nào.","Comparable là bound thứ hai; erasure luôn lấy bound trái nhất.","JVM không tạo kiểu tổng hợp nào; erasure chỉ đơn thuần chọn một kiểu đã có sẵn.",""]},{"id":"d-5-7","topicId":5,"versions":[8,11,17,21],"difficulty":"intermediate","question":"Đoạn code sau chạy ra sao?","code":"List<String> strings = new ArrayList<>();\nList raw = strings;\nraw.add(42);\n\nfor (String s : strings) {\n    System.out.println(s.length());\n}","choices":["Lỗi biên dịch tại raw.add(42)","In ra 2, tức độ dài của chuỗi \"42\"","Biên dịch được (chỉ có cảnh báo unchecked) rồi ném ClassCastException trong vòng lặp, ở dòng không hề có phép ép kiểu nào trong source","Biên dịch được và bỏ qua phần tử 42 khi duyệt vì nó không phải String"],"correctAnswer":2,"explanation":"Đây là heap pollution kinh điển: biến strings có kiểu List<String> nhưng list thật sự bên dưới đang chứa một Integer. Raw type tắt toàn bộ kiểm tra generic nên raw.add(42) chỉ sinh cảnh báo unchecked chứ không phải lỗi. Phép ép kiểu thật nằm ở lệnh checkcast mà compiler chèn vào vòng lặp for-each khi lấy phần tử ra gán cho biến String, nên ClassCastException nổ tại một dòng bạn không hề viết cast — rất khó lần ngược về nguyên nhân. Đó chính là lý do phải coi mọi unchecked warning là lỗi cần xử lý chứ không phải tiếng ồn.","whyWrong":["Raw type khiến add(Object) được chọn, nên về mặt kiểu không có gì sai và compiler chỉ cảnh báo.","Số 42 vào list dưới dạng Integer chứ không phải String, nên phép gán cho biến String thất bại trước khi kịp gọi length().","","Vòng lặp for-each không lọc kiểu; nó lấy tuần tự từng phần tử rồi ép kiểu, gặp phần tử sai kiểu là ném exception ngay."]},{"id":"d-5-8","topicId":5,"versions":[8,11,17,21],"difficulty":"advanced","question":"Khi biên dịch class Box implements Comparable<Box> với method compareTo(Box o), compiler sinh thêm một method tổng hợp int compareTo(Object). Vì sao?","choices":["Để hỗ trợ cơ chế tuần tự hoá (serialization)","Vì sau erasure interface Comparable khai báo compareTo(Object); nếu Box chỉ có compareTo(Box) thì về mặt JVM nó không override được method của interface, nên compiler sinh bridge method để cast rồi uỷ quyền sang compareTo(Box)","Để cho phép so sánh Box với mọi kiểu object khác","Vì Java yêu cầu mọi class implement interface phải có ít nhất một method nhận tham số Object"],"correctAnswer":1,"explanation":"JVM phân biệt method theo signature đầy đủ, mà compareTo(Box) và compareTo(Object) là hai signature khác nhau. Nếu không có gì bù đắp, gọi qua reference kiểu Comparable sẽ không dispatch được tới bản cài đặt của Box. Compiler giải quyết bằng cách sinh một bridge method mang cờ ACC_BRIDGE và ACC_SYNTHETIC, thân hàm chỉ ép kiểu tham số rồi gọi method thật. Hai hệ quả đáng nhớ: Method.isBridge() nhận diện được chúng nên framework dùng reflection phải lọc (Spring có BridgeMethodResolver), và nếu ai đó dùng raw type truyền sai kiểu thì ClassCastException sẽ phát ra từ bên trong bridge method, tức từ một dòng không tồn tại trong source của bạn. Covariant return type cũng được hiện thực bằng đúng cơ chế này.","whyWrong":["Serialization không liên quan; nó dùng reflection trên field chứ không cần bridge method.","","Bridge method cast tham số về Box và ném ClassCastException nếu sai kiểu, nên nó không hề mở rộng khả năng so sánh.","Không có yêu cầu như vậy. Method này được sinh riêng cho tình huống erasure làm lệch signature giữa interface và class cài đặt."]},{"id":"d-5-9","topicId":5,"versions":[8,11,17,21],"difficulty":"advanced","question":"@SafeVarargs làm gì, và đặt được lên những loại method nào?","choices":["Nó kiểm tra lúc biên dịch rằng method thực sự an toàn về kiểu","Nó ép JVM kiểm tra kiểu từng phần tử của mảng varargs lúc chạy","Nó chỉ tắt cảnh báo heap pollution — là cam kết của tác giả rằng method không lưu và không lộ mảng varargs ra ngoài; chỉ đặt được lên method static, method final, constructor, và từ Java 9 thêm private instance method","Nó cho phép truyền số lượng tham số generic không giới hạn, điều mà bình thường bị cấm"],"correctAnswer":2,"explanation":"Nguyên nhân của cảnh báo là compiler buộc phải tạo một mảng generic (T[] hoặc List<String>[]) để gói tham số varargs, mà mảng generic không an toàn vì mảng thì hiệp biến còn generic thì bất biến. Nếu method chỉ đọc mảng thì thực tế không có rủi ro; nhưng nếu nó return mảng, gán mảng vào field, hoặc chỉ cần gán vào một biến Object[], người khác có thể nhét sai kiểu vào và gây ClassCastException ở chỗ khác. @SafeVarargs không kiểm chứng bất cứ điều gì — nó chỉ tắt cảnh báo, nên đặt nhầm chỗ là vừa giữ nguyên bug vừa mất luôn tín hiệu cảnh báo. Giới hạn về vị trí có logic rõ ràng: đó đúng là tập các method không override được, vì lời cam kết an toàn của class cha không thể ràng buộc class con.","whyWrong":["Compiler không kiểm chứng gì cả; toàn bộ trách nhiệm nằm ở người viết method.","Không có kiểm tra runtime nào được thêm vào; annotation này chỉ tác động tới cảnh báo lúc biên dịch.","","Số lượng tham số varargs vốn đã không bị giới hạn; annotation này không liên quan gì tới số lượng đối số."]},{"id":"d-6-1","topicId":6,"versions":[8,11,17,21],"difficulty":"beginner","question":"Đoạn code sau in ra gì?","code":"static int f() {\n    try {\n        throw new IllegalStateException(\"boom\");\n    } finally {\n        return 2;\n    }\n}\n\npublic static void main(String[] args) {\n    System.out.println(f());\n}","choices":["Ném IllegalStateException ra ngoài main","In 2, exception bị nuốt hoàn toàn","In 2 rồi ném IllegalStateException","Compile error vì finally không được có return"],"correctAnswer":1,"explanation":"In ra 2 và exception biến mất không dấu vết. Khi khối finally kết thúc bằng return (hoặc break/continue/throw), nó chấm dứt việc lan truyền của exception đang bay lên — method trả về bình thường như thể không có gì xảy ra. Đây là lý do mọi static analyzer đều cấm return trong finally: nó biến một lỗi nghiêm trọng thành sự im lặng, và exception gốc không hề được giữ lại trong getSuppressed().","whyWrong":["Exception bị huỷ ngay khi finally thực hiện return, nên không có gì bay ra khỏi f().","","Không có chuyện in xong rồi ném — return trong finally kết thúc method dứt điểm, chỉ một trong hai xảy ra.","Compiler cho phép return trong finally (chỉ cảnh báo ở một số công cụ), đây là code hợp lệ về mặt ngôn ngữ."]},{"id":"d-6-2","topicId":6,"versions":[8,11,17,21],"difficulty":"beginner","question":"Trong các exception sau, đâu là checked exception?","choices":["NumberFormatException","IllegalStateException","InterruptedException","ArrayIndexOutOfBoundsException"],"correctAnswer":2,"explanation":"InterruptedException kế thừa trực tiếp Exception mà không đi qua RuntimeException, nên là checked và compiler ép catch-or-declare. Quy tắc duy nhất cần nhớ là quy tắc kế thừa: mọi thứ dưới RuntimeException hoặc Error là unchecked, phần còn lại dưới Exception là checked — không liên quan gì tới việc lỗi 'xảy ra lúc compile hay lúc chạy'. Riêng InterruptedException còn có quy tắc thực hành quan trọng: nếu bắt mà không xử lý được, phải gọi Thread.currentThread().interrupt() để khôi phục cờ ngắt.","whyWrong":["NumberFormatException kế thừa IllegalArgumentException, tức nằm dưới RuntimeException nên là unchecked.","IllegalStateException nằm trực tiếp dưới RuntimeException, unchecked.","","ArrayIndexOutOfBoundsException kế thừa IndexOutOfBoundsException rồi tới RuntimeException, unchecked."]},{"id":"d-6-3","topicId":6,"versions":[8,11,17,21],"difficulty":"beginner","question":"Đoạn code sau in ra thứ tự nào?","code":"class Res implements AutoCloseable {\n    private final String name;\n    Res(String name) { this.name = name; }\n    public void close() { System.out.print(\"close\" + name + \" \"); }\n}\n\ntry (Res a = new Res(\"A\"); Res b = new Res(\"B\")) {\n    System.out.print(\"body \");\n} finally {\n    System.out.print(\"finally\");\n}","choices":["body closeA closeB finally","body finally closeB closeA","body closeB closeA finally","closeB closeA body finally"],"correctAnswer":2,"explanation":"Kết quả là 'body closeB closeA finally'. Hai quy tắc kết hợp: tài nguyên được đóng theo thứ tự ngược với thứ tự khai báo (B khai báo sau nên đóng trước), và toàn bộ việc đóng xảy ra TRƯỚC khi khối catch/finally của cùng câu try chạy. Thứ tự ngược không phải ngẫu nhiên — tài nguyên khai báo sau thường bọc tài nguyên khai báo trước (BufferedWriter bọc FileWriter), nên phải đóng lớp ngoài trước. Hệ quả thực tế: trong catch hoặc finally bạn không được giả định tài nguyên còn mở.","whyWrong":["Thứ tự đóng là ngược lại với thứ tự khai báo, không phải cùng chiều.","finally của câu try chạy sau khi tất cả tài nguyên đã được đóng, không phải trước.","","Tài nguyên chỉ được đóng khi thân try kết thúc, không phải trước khi thân try chạy."]},{"id":"d-6-4","topicId":6,"versions":[8,11,17,21],"difficulty":"intermediate","question":"Đoạn code sau in ra gì?","code":"class Res implements AutoCloseable {\n    public void close() { throw new IllegalStateException(\"from close\"); }\n}\n\npublic static void main(String[] args) {\n    try (Res r = new Res()) {\n        throw new RuntimeException(\"from body\");\n    } catch (Exception e) {\n        System.out.println(e.getMessage() + \" | \" + e.getSuppressed().length);\n    }\n}","choices":["from close | 1","from body | 1","from body | 0","from close | 0"],"correctAnswer":1,"explanation":"In ra 'from body | 1'. Exception từ thân try là exception chính, còn exception ném ra từ close() được gắn vào nó qua addSuppressed() và đếm được bằng getSuppressed(). Đây chính là giá trị kỹ thuật của try-with-resources: nguyên nhân gốc của sự cố được giữ nguyên. Nếu viết tay finally { r.close(); } thì kết quả ngược lại hoàn toàn — IllegalStateException từ close() sẽ bay lên và RuntimeException gốc mất sạch, khiến log chỉ tố cáo triệu chứng chứ không chỉ ra nguyên nhân.","whyWrong":["Exception từ close() bị suppressed chứ không thay thế exception của thân try — đây mới là kết quả của finally thủ công.","","Số suppressed là 1 chứ không phải 0, vì close() thực sự đã ném exception và nó được ghi lại.","Sai cả hai phần: exception chính là của thân try, và mảng suppressed có đúng một phần tử."]},{"id":"d-6-5","topicId":6,"versions":[8,11,17,21],"difficulty":"intermediate","question":"Đoạn code sau có vấn đề gì?","code":"try {\n    process();\n} catch (IOException | SQLException e) {\n    e = new IOException(\"wrapped\", e);\n    throw e;\n}","choices":["Chạy được nhưng mất stack trace gốc","Compile error: biến của multi-catch là implicitly final nên không gán lại được","Compile error: multi-catch không cho phép throw lại exception","Chạy được, và e sẽ có kiểu tĩnh là IOException"],"correctAnswer":1,"explanation":"Compile error. Tham số của multi-catch là implicitly final theo đặc tả ngôn ngữ, nên mọi phép gán lại đều bị từ chối. Lý do không phải tuỳ tiện: kiểu tĩnh của e là tổ tiên chung gần nhất của các kiểu liệt kê (ở đây là Exception), và tính final chính là điều kiện để compiler thực hiện precise rethrow — suy ra chính xác tập kiểu có thể bay lên khi bạn viết throw e. Cách viết đúng là dùng một biến mới: throw new ServiceException(\"wrapped\", e).","whyWrong":["Code không compile được nên không có chuyện chạy; ngoài ra ở đây cause vẫn được truyền nên stack trace cũng không mất.","","Ném lại exception trong multi-catch hoàn toàn hợp lệ, thậm chí còn được compiler suy luận kiểu chính xác hơn nhờ precise rethrow.","Kiểu tĩnh của e là tổ tiên chung gần nhất của IOException và SQLException, tức Exception, chứ không phải IOException."]},{"id":"d-6-6","topicId":6,"versions":[8,11,17,21],"difficulty":"intermediate","question":"Đoạn code sau cho kết quả gì khi biên dịch?","code":"try {\n    Files.readAllBytes(Paths.get(\"a.txt\"));\n} catch (Exception e) {\n    log.error(\"generic\", e);\n} catch (IOException e) {\n    log.error(\"io\", e);\n}","choices":["Compile bình thường, khi có IOException thì khối thứ hai chạy","Compile bình thường, khi có IOException thì khối thứ nhất chạy","Chỉ là warning về unreachable code","Compile error vì IOException đã bị bắt bởi khối catch trước đó"],"correctAnswer":3,"explanation":"Compile error, thông báo dạng 'exception IOException has already been caught'. JVM chọn khối catch đầu tiên có kiểu tương thích theo thứ tự từ trên xuống, nên khi Exception đứng trước, khối IOException vĩnh viễn không thể đạt tới — và Java coi unreachable catch là lỗi chứ không phải cảnh báo. Quy tắc thực hành: luôn xếp catch từ kiểu hẹp tới kiểu rộng; các exception không có quan hệ kế thừa với nhau thì thứ tự tuỳ ý.","whyWrong":["Code không compile được, nên không có runtime behaviour nào để nói tới.","Đúng là khối rộng sẽ bắt trước nếu hợp lệ, nhưng ở đây compiler chặn ngay từ đầu.","Java coi đây là lỗi biên dịch chứ không phải warning. Đừng nhầm với trường hợp catch một checked exception không thể được ném ra trong try: cái đó cũng là lỗi biên dịch ('exception IOException is never thrown in body of corresponding try statement'), chứ không phải cảnh báo.",""]},{"id":"d-6-7","topicId":6,"versions":[8,11,17,21],"difficulty":"intermediate","question":"Class Child dưới đây có compile được không?","code":"class Parent {\n    void run() throws IOException { }\n}\n\nclass Child extends Parent {\n    @Override\n    void run() throws Exception { }\n}","choices":["Không: method override không được khai báo checked exception rộng hơn của class cha","Có: class con luôn được phép mở rộng danh sách throws","Không: method override phải khai báo throws giống hệt class cha","Có, nhưng chỉ khi Parent là abstract class"],"correctAnswer":0,"explanation":"Không compile được. Method override chỉ được ném checked exception hẹp hơn hoặc bằng của bản ở class cha, hoặc bỏ hẳn throws; Exception rộng hơn IOException nên vi phạm. Ràng buộc này bảo vệ nguyên lý Liskov: code đang gọi qua reference kiểu Parent chỉ chuẩn bị xử lý IOException, nếu object thật ném Exception thì compiler đã không thể ép người gọi xử lý. Lưu ý quan trọng: ràng buộc này chỉ áp dụng cho checked exception — class con được tự do ném bất kỳ unchecked exception nào mà không cần khai báo.","whyWrong":["","Ngược lại: chỉ được thu hẹp danh sách checked exception, không được mở rộng.","Không cần giống hệt — bỏ throws hoàn toàn, hoặc khai báo subclass của IOException, đều hợp lệ.","Việc Parent là abstract hay không không thay đổi ràng buộc này chút nào."]},{"id":"d-6-8","topicId":6,"versions":[8,11,17,21],"difficulty":"advanced","question":"Đoạn code sau ném exception nào ra ngoài, và exception còn lại đi đâu?","code":"public static void main(String[] args) {\n    try {\n        try {\n            throw new IllegalArgumentException(\"primary\");\n        } finally {\n            throw new IllegalStateException(\"from finally\");\n        }\n    } catch (Exception e) {\n        System.out.println(e.getMessage() + \" | \" + e.getSuppressed().length);\n    }\n}","choices":["primary | 1","from finally | 1","from finally | 0 — IllegalArgumentException bị vứt bỏ hoàn toàn","primary | 0 — exception trong finally bị bỏ qua"],"correctAnswer":2,"explanation":"In ra 'from finally | 0'. Khi khối finally kết thúc đột ngột bằng throw, exception mới thay thế hoàn toàn exception đang lan truyền; exception gốc bị vứt bỏ và KHÔNG được ghi vào getSuppressed(). Cơ chế suppressed chỉ do try-with-resources sinh ra, không phải hành vi mặc định của finally. Đây chính xác là lý do pattern finally { conn.close(); } thủ công nguy hiểm: close() ném IOException sẽ che mất nguyên nhân thật của sự cố, khiến log chỉ ghi lại triệu chứng.","whyWrong":["Exception của finally luôn thắng — primary không thể bay lên khi finally kết thúc bằng throw.","Số suppressed là 0: finally thủ công không tự động gọi addSuppressed cho ai cả.","","Ngược hẳn: exception trong finally không hề bị bỏ qua, chính nó mới là exception bay ra ngoài."]},{"id":"d-6-9","topicId":6,"versions":[8,11,17,21],"difficulty":"advanced","question":"Chi phí lớn nhất khi sử dụng exception trong Java nằm ở đâu?","choices":["Ở khối try: mỗi lần vào try, JVM phải lưu trạng thái để có thể quay lui","Ở khối catch: JVM phải dựng lại các stack frame đã bị huỷ","Ở lệnh throw: JVM phải quét tuyến tính toàn bộ bytecode của method để tìm handler","Ở lúc tạo object exception: constructor của Throwable gọi fillInStackTrace() và duyệt toàn bộ call stack"],"correctAnswer":3,"explanation":"Chi phí chủ yếu nằm ở fillInStackTrace(), được gọi trong constructor của Throwable để chụp lại toàn bộ call stack — stack càng sâu càng đắt, và stack trong ứng dụng Spring thường rất sâu. Khối try khi không có exception thì gần như miễn phí vì thông tin handler nằm trong exception table của method, không sinh lệnh runtime nào. Hệ quả thực tế: đừng dùng exception cho luồng điều khiển bình thường; và nếu thực sự cần một exception dạng signal ở tần suất cao, hãy dùng constructor Throwable(msg, cause, false, false) để bỏ stack trace.","whyWrong":["Java không có cơ chế lưu trạng thái để quay lui khi vào try; khối try không sinh lệnh nào lúc chạy.","Stack frame được pop chứ không được dựng lại — quá trình unwinding có chi phí nhưng nhỏ hơn nhiều so với việc chụp stack trace.","JVM tra exception table của từng frame, đây là bảng nhỏ tra rất nhanh chứ không phải quét toàn bộ bytecode.",""]},{"id":"d-7-1","topicId":7,"versions":[8,11,17,21],"difficulty":"beginner","question":"Đoạn code sau in ra gì?","code":"static void change(StringBuilder sb, String s) {\n    sb.append(\" world\");\n    s = s + \" world\";\n}\n\npublic static void main(String[] args) {\n    StringBuilder sb = new StringBuilder(\"hello\");\n    String s = \"hello\";\n    change(sb, s);\n    System.out.println(sb + \" | \" + s);\n}","choices":["hello world | hello world","hello | hello","hello world | hello","hello | hello world"],"correctAnswer":2,"explanation":"In ra 'hello world | hello'. Java luôn truyền tham số theo giá trị: với object thì thứ được sao chép là reference. Lệnh sb.append() sửa đúng object trên heap mà cả hai reference cùng trỏ tới nên người gọi thấy thay đổi; còn s = s + \" world\" chỉ gán lại bản sao reference nằm trong frame của method change nên biến s ở main không đổi. Quy tắc rút ra: sửa trạng thái object thì lan ra ngoài, gán lại tham số thì không — và điều này đúng với mọi kiểu object, không riêng String.","whyWrong":["Muốn s ở main đổi theo thì Java phải là pass-by-reference, nhưng Java không có cơ chế đó.","sb.append() thực sự sửa object dùng chung trên heap nên sb chắc chắn đổi.","","Ngược hoàn toàn: gán lại tham số không lan ra ngoài, còn sửa trạng thái object thì có."]},{"id":"d-7-2","topicId":7,"versions":[8,11,17,21],"difficulty":"beginner","question":"Garbage collector mặc định của Java 8 và của Java 17 (trên máy được JVM xếp loại server-class) lần lượt là gì?","choices":["Java 8: CMS, Java 17: G1","Java 8: G1, Java 17: ZGC","Java 8: Parallel GC, Java 17: G1","Java 8: Parallel GC, Java 17: ZGC"],"correctAnswer":2,"explanation":"Java 8 mặc định dùng Parallel GC (tối ưu throughput, stop-the-world toàn phần), còn từ Java 9 trở đi G1 là mặc định và điều đó vẫn đúng ở Java 11, 17 và 21. Đây là một trong những khác biệt hành vi lớn nhất khi migrate từ Java 8: cùng một ứng dụng sẽ thấy pause ngắn hơn nhưng throughput có thể giảm nhẹ, và các cờ tuning cũ của Parallel GC phần lớn không còn ý nghĩa. Cần thêm sắc thái: đây là kết quả của JVM ergonomics — trên container ít CPU hoặc RAM nhỏ, JVM có thể tự chọn Serial GC thay vì G1.","whyWrong":["CMS chưa bao giờ là mặc định của Java 8; nó bị deprecate ở Java 9 và gỡ bỏ hoàn toàn ở Java 14.","G1 tồn tại trong Java 8 nhưng phải bật thủ công bằng -XX:+UseG1GC, và ZGC không phải mặc định ở bất kỳ bản LTS nào tới Java 21.","","ZGC production-ready từ Java 15 nhưng vẫn phải bật tường minh bằng -XX:+UseZGC, không phải mặc định."]},{"id":"d-7-3","topicId":7,"versions":[8,11,17,21],"difficulty":"beginner","question":"Trong method dưới đây, x, p và object Point nằm ở đâu trong bộ nhớ JVM?","code":"void m() {\n    int x = 5;\n    Point p = new Point(1, 2);\n}","choices":["Cả x, p và object Point đều nằm trên heap vì chúng thuộc về một method","x và biến p (reference) nằm trong stack frame của thread; object Point nằm trên heap","x nằm trên stack; p và object Point đều nằm trên metaspace","Cả ba đều nằm trên stack vì chúng là biến local"],"correctAnswer":1,"explanation":"Biến local x và biến p đều nằm trong stack frame của thread đang chạy method — p chỉ chứa một reference (địa chỉ), còn object Point thực sự nằm trên heap dùng chung. Đây cũng là lý do biến local mặc nhiên thread-safe: mỗi thread có stack riêng nên không ai chia sẻ chúng. Cần một sắc thái ở cấp senior: phát biểu 'mọi object đều nằm trên heap' đúng ở mức đặc tả, nhưng JIT của HotSpot có thể dùng escape analysis để thay object không thoát khỏi method bằng các biến vô hướng trong thanh ghi/stack (scalar replacement).","whyWrong":["Biến local không bao giờ nằm trên heap; chỉ object mà chúng trỏ tới mới nằm ở đó.","","Metaspace chỉ chứa metadata của class (cấu trúc class, method, constant pool), không chứa biến local hay instance.","Object tạo bằng new nằm trên heap; stack chỉ giữ reference tới nó."]},{"id":"d-7-4","topicId":7,"versions":[8,11,17,21],"difficulty":"intermediate","question":"Đoạn code sau chạy trong một web application dùng thread pool. Vấn đề là gì?","code":"private static final ThreadLocal<UserContext> CTX = new ThreadLocal<>();\n\npublic void handleRequest(Request r) {\n    CTX.set(new UserContext(r.getUser(), r.getPermissions()));\n    service.process();\n}","choices":["Không có vấn đề: ThreadLocal tự dọn value khi method kết thúc","Không có vấn đề: key trong ThreadLocalMap là weak reference nên GC tự thu hồi value","ThreadLocal không thread-safe nên hai request có thể ghi đè nhau","Rò rỉ bộ nhớ và rò rỉ dữ liệu: thread trong pool không chết nên UserContext sống mãi và request sau có thể đọc được context của request trước"],"correctAnswer":3,"explanation":"Đây là mẫu leak kinh điển với thread pool. Trong ThreadLocalMap, key là weak reference tới object ThreadLocal nhưng value là strong reference; vì CTX được khai báo static final nên key không bao giờ bị thu hồi, và value sống theo tuổi thọ của thread — mà thread trong Tomcat hay ExecutorService sống hàng tháng. Ngoài rò rỉ bộ nhớ, đây còn là lỗ hổng bảo mật: request kế tiếp chạy trên cùng thread sẽ đọc được UserContext của người dùng trước nếu quên set. Cách sửa bắt buộc là bọc bằng try/finally và gọi CTX.remove().","whyWrong":["ThreadLocal không có bất kỳ liên hệ nào với phạm vi method; value gắn với thread cho tới khi bị remove hoặc thread chết.","Đúng là key weak, nhưng value là strong reference; hơn nữa key static final không bao giờ mất reference nên entry không bao giờ được dọn.","ThreadLocal vốn được thiết kế để mỗi thread có bản riêng nên không có tranh chấp giữa các thread — vấn đề nằm ở việc tái sử dụng thread.",""]},{"id":"d-7-5","topicId":7,"versions":[8,11,17,21],"difficulty":"intermediate","question":"Phát biểu nào đúng về sự khác nhau giữa SoftReference và WeakReference?","choices":["Soft reference chỉ bị clear khi bộ nhớ khan hiếm và chắc chắn bị clear hết trước khi JVM ném OutOfMemoryError; weak reference bị clear ngay ở kỳ GC tiếp theo khi object chỉ còn weakly reachable","Cả hai bị clear cùng lúc, chỉ khác nhau ở việc soft reference có ReferenceQueue còn weak thì không","Weak reference chỉ bị clear khi bộ nhớ khan hiếm, còn soft reference bị clear ngay ở kỳ GC kế tiếp","Soft reference ngăn object bị thu hồi vĩnh viễn, còn weak reference thì không ảnh hưởng gì tới GC"],"correctAnswer":0,"explanation":"Soft reference được GC giữ lại theo ý mình khi bộ nhớ còn dư, nhưng đặc tả đảm bảo mọi soft reference sẽ bị clear trước khi JVM ném OutOfMemoryError — nên nó hợp với cache 'có thì tốt, mất cũng không sao'. Weak reference thì bị clear ngay ở kỳ GC kế tiếp khi object chỉ còn weakly reachable, đúng cơ chế đứng sau WeakHashMap. Thực tế nhiều đội tránh SoftReference vì chính sách clear phụ thuộc cài đặt JVM và khó dự đoán; một cache có maximumSize và TTL rõ ràng (Caffeine) cho hành vi ổn định hơn nhiều.","whyWrong":["","Cả SoftReference lẫn WeakReference đều nhận được ReferenceQueue trong constructor, và thời điểm bị clear của chúng khác nhau rõ rệt.","Đổi vai trò của hai loại; đây chính là nhầm lẫn phổ biến nhất về chủ đề này.","Không loại reference nào ngăn thu hồi vĩnh viễn — chỉ strong reference mới làm được điều đó."]},{"id":"d-7-6","topicId":7,"versions":[8,11,17,21],"difficulty":"intermediate","question":"Vì sao đoạn code sau gây memory leak dù Java có garbage collector?","code":"public class ImageCache {\n    private static final Map<String, byte[]> CACHE = new HashMap<>();\n\n    public static byte[] get(String key) {\n        return CACHE.computeIfAbsent(key, ImageCache::loadFromDisk);\n    }\n}","choices":["Vì HashMap không thread-safe nên entry bị hỏng và GC không đọc được","Vì byte[] là mảng nguyên thuỷ nên không được GC quản lý","Vì biến static là GC root sống suốt vòng đời class loader, nên mọi byte[] trong map luôn strongly reachable và không bao giờ bị thu hồi","Vì computeIfAbsent giữ một reference nội bộ tới hàm loadFromDisk"],"correctAnswer":2,"explanation":"GC chỉ thu hồi những object không còn reachable từ GC roots, và field static chính là một GC root sống suốt vòng đời của class loader nạp class đó. Map này không có giới hạn kích thước lẫn chính sách hết hạn, nên mỗi key mới là một byte[] bị giữ vĩnh viễn — heap tăng đơn điệu cho tới OutOfMemoryError. Đây là định nghĩa leak trong ngôn ngữ có GC: object không còn cần dùng nhưng vẫn còn người giữ tham chiếu. Cách sửa là dùng cache có maximumSize và expireAfterWrite (Caffeine), hoặc chí ít là LinkedHashMap với removeEldestEntry.","whyWrong":["Thiếu thread-safety gây hỏng dữ liệu hoặc vòng lặp vô hạn, nhưng không phải nguyên nhân của leak ở đây.","Mảng cũng là object trên heap và được GC quản lý hoàn toàn bình thường.","","computeIfAbsent không giữ reference nào ngoài entry được thêm vào map; method reference là hằng, không liên quan tới việc heap tăng."]},{"id":"d-7-7","topicId":7,"versions":[8,11,17,21],"difficulty":"intermediate","question":"Sau khi migrate từ Java 7 lên Java 8, ứng dụng chạy với -XX:MaxPermSize=256m và một thời gian sau chết vì OutOfMemoryError: Metaspace. Điều gì đã xảy ra?","choices":["PermGen bị gỡ bỏ ở Java 8 nên -XX:MaxPermSize bị bỏ qua kèm cảnh báo; metadata class nay nằm ở metaspace trong native memory, giới hạn bằng -XX:MaxMetaspaceSize","Java 8 đổi tên cờ nhưng giữ nguyên cơ chế, chỉ cần thay bằng -XX:MaxMetaspaceSize=256m là giải quyết triệt để","Metaspace là một phần của heap nên phải tăng -Xmx thay vì chỉnh cờ perm","OutOfMemoryError: Metaspace luôn có nghĩa là heap đầy và cần tăng -Xmx"],"correctAnswer":0,"explanation":"Java 8 (JEP 122) xoá bỏ PermGen; -XX:MaxPermSize và -XX:PermSize trở thành cờ bị bỏ qua, JVM chỉ in cảnh báo rồi chạy tiếp. Metadata class chuyển sang metaspace nằm trong native memory và mặc định không có trần trên — nên OutOfMemoryError: Metaspace thường tố cáo một vấn đề thật, phổ biến nhất là class loader leak hoặc sinh class động không kiểm soát (proxy, bytecode generation, script engine). Đặt -XX:MaxMetaspaceSize giúp phát hiện sớm và tránh làm chết cả máy, nhưng chỉ là hàng rào chứ không phải cách sửa: phải tìm cho ra lý do số lượng class được nạp tăng không ngừng.","whyWrong":["","Đặt MaxMetaspaceSize chỉ đặt lại trần chứ không sửa nguyên nhân; nếu số class nạp vào tăng vô hạn thì lỗi vẫn quay lại.","Metaspace nằm ở native memory chứ không nằm trong heap, nên tăng -Xmx hoàn toàn không tác động tới nó.","Thông điệp Metaspace chỉ đích danh vùng metadata class; heap đầy sẽ báo là Java heap space."]},{"id":"d-7-8","topicId":7,"versions":[8,11,17,21],"difficulty":"advanced","question":"Trong vòng lặp nóng dưới đây, HotSpot có thể làm gì với object Point sau khi JIT biên dịch method?","code":"static double dist(double x, double y) {\n    Point p = new Point(x, y);\n    return Math.sqrt(p.x * p.x + p.y * p.y);\n}\n\nfor (int i = 0; i < 100_000_000; i++) {\n    sum += dist(i, i + 1);\n}","choices":["Không làm được gì: mọi object tạo bằng new luôn phải được cấp phát trên heap","Đưa Point vào một object pool nội bộ để tái sử dụng giữa các lần gọi","Cấp phát Point trực tiếp lên old generation để tránh minor GC","Escape analysis nhận ra p không thoát khỏi method, nên có thể thực hiện scalar replacement: tách p thành hai biến vô hướng nằm trong thanh ghi/stack và bỏ hẳn việc cấp phát trên heap"],"correctAnswer":3,"explanation":"JIT C2 chạy escape analysis (-XX:+DoEscapeAnalysis, bật mặc định) để xác định object có thoát khỏi phạm vi method hay không. Khi object không thoát, tối ưu áp dụng là scalar replacement: các field được tách thành biến vô hướng riêng lẻ nằm trong thanh ghi hoặc stack slot, và lệnh cấp phát biến mất hoàn toàn — kèm theo đó là loại bỏ luôn lock nếu có (lock elision). Hai sắc thái quan trọng khi trả lời: tối ưu này chỉ xảy ra trong mã đã được JIT biên dịch, không có ở interpreter, và cách nói chính xác là 'scalar replacement' chứ không phải 'object được cấp phát trên stack' — HotSpot không cấp phát nguyên object lên stack.","whyWrong":["Đúng ở mức đặc tả ngôn ngữ nhưng sai ở mức cài đặt: JIT được phép loại bỏ cấp phát miễn là hành vi quan sát được không đổi.","JVM không tự tạo object pool; pooling là kỹ thuật ở tầng ứng dụng và thường phản tác dụng với object ngắn hạn.","Cấp phát thẳng vào old gen chỉ áp dụng cho object rất lớn (humongous), và nó làm GC tệ hơn chứ không tốt hơn.",""]},{"id":"d-7-9","topicId":7,"versions":[8,11,17,21],"difficulty":"advanced","question":"Một service chạy ổn định vài giờ rồi bắt đầu full GC liên tục. Trong GC log, mức old gen ĐO NGAY SAU mỗi full GC tăng đều đặn: 400MB, 900MB, 1.4GB, 1.9GB... Kết luận đúng nhất là gì?","choices":["GC đang hoạt động bình thường, chỉ cần đổi sang ZGC để giảm pause","Có memory leak: tập object còn sống sau khi GC đã dọn hết mọi thứ có thể vẫn tăng đơn điệu, nên cần heap dump và phân tích dominator tree","Young generation quá nhỏ gây premature promotion, chỉ cần tăng -Xmn là hết","Heap bị phân mảnh, chỉ cần bật -XX:+UseG1GC để có compaction"],"correctAnswer":1,"explanation":"Chỉ số chẩn đoán quan trọng nhất không phải mức heap dao động lên xuống (điều hoàn toàn bình thường) mà là mức old gen NGAY SAU full GC — đó chính là live set, tập object thực sự còn reachable. Live set tăng đơn điệu nghĩa là có object không còn cần dùng nhưng vẫn bị ai đó giữ tham chiếu, tức memory leak theo đúng định nghĩa trong ngôn ngữ có GC. Bước tiếp theo là lấy heap dump (-XX:+HeapDumpOnOutOfMemoryError hoặc jcmd <pid> GC.heap_dump) rồi dùng Eclipse MAT xem Leak Suspects và dominator tree để tìm đường tham chiếu giữ object sống. Đổi collector hay tăng -Xmx chỉ làm sự cố đến muộn hơn.","whyWrong":["Full GC dồn dập kèm live set tăng đều là dấu hiệu bệnh lý; đổi collector không loại bỏ được object đang bị giữ tham chiếu.","","Premature promotion làm old gen đầy nhanh nhưng mức sau full GC vẫn trở về mức ổn định, không tăng đơn điệu qua từng chu kỳ.","Phân mảnh gây concurrent mode failure ở CMS chứ không làm live set sau full GC tăng lên; ngoài ra full GC vốn đã có bước compact."]},{"id":"d-8-1","topicId":8,"versions":[8,11,17,21],"difficulty":"beginner","question":"Bạn cần một hàm nhận vào một String và trả về độ dài dạng int, dùng trong pipeline xử lý hàng chục triệu phần tử. Functional interface nào có sẵn trong java.util.function là phù hợp nhất để tránh autoboxing?","choices":["Function<String, Integer>","ToIntFunction<String>","IntFunction<String>","IntSupplier"],"correctAnswer":1,"explanation":"ToIntFunction<T> có method int applyAsInt(T value): tham số là object T, kết quả là primitive int nên không phải bọc vào Integer. Quy tắc đọc tên: tiền tố Int/Long/Double chỉ kiểu THAM SỐ, còn tiền tố To chỉ kiểu TRẢ VỀ. Với vài trăm phần tử thì boxing không đáng kể, nhưng ở quy mô hàng chục triệu, mỗi lần boxing là một object trên heap và một lần tra Integer cache (chỉ áp dụng cho -128..127), tạo áp lực GC thật sự.","whyWrong":["Function<String,Integer> trả về Integer nên mỗi lần gọi phải boxing giá trị int thành object — đúng thứ câu hỏi muốn tránh.","","IntFunction<R> đi ngược chiều: nhận vào một int và trả về object R. Ở đây đầu vào là String chứ không phải int.","IntSupplier không nhận tham số nào, nên không thể nhận String để tính độ dài."]},{"id":"d-8-2","topicId":8,"versions":[8,11,17,21],"difficulty":"beginner","question":"Đoạn code sau có hành vi gì?","code":"void countShortNames(List<String> names) {\n    int count = 0;\n    names.forEach(n -> {\n        if (n.length() < 4) count++;\n    });\n    System.out.println(count);\n}","choices":["In ra số tên ngắn hơn 4 ký tự","In ra 0 vì lambda chỉ sửa bản sao của count","Lỗi biên dịch: biến local dùng trong lambda phải là final hoặc effectively final","Ném ConcurrentModificationException vì sửa biến trong lúc duyệt"],"correctAnswer":2,"explanation":"Code không biên dịch được. Biến local sống trong stack frame của method, còn object lambda nằm trên heap và có thể sống lâu hơn frame đó, nên Java capture biến local theo GIÁ TRỊ (copy). Đã copy thì việc cho phép gán lại sẽ tạo ra hai bản giá trị lệch nhau, vì vậy compiler cấm luôn: biến được capture phải effectively final. Cách đúng ở đây là dùng chính stream: names.stream().filter(n -> n.length() < 4).count().","whyWrong":["Không có gì để in vì code không qua được bước biên dịch.","Java không âm thầm sửa bản sao rồi bỏ qua — đây là lỗi biên dịch tường minh, không phải lỗi logic lúc chạy.","","ConcurrentModificationException chỉ xảy ra khi sửa cấu trúc của collection đang duyệt, không liên quan tới việc gán biến local."]},{"id":"d-8-3","topicId":8,"versions":[8,11,17,21],"difficulty":"beginner","question":"Interface sau có biên dịch được không?","code":"@FunctionalInterface\ninterface Validator {\n    boolean test(String s);\n    default Validator negate() { return s -> !test(s); }\n    static Validator alwaysTrue() { return s -> true; }\n    @Override String toString();\n}","choices":["Không — @FunctionalInterface chỉ cho phép đúng một method trong interface","Không — default method và static method không được phép trong functional interface","Có — default, static và abstract method trùng chữ ký public của Object đều không tính là abstract method","Có, nhưng chỉ từ Java 9 trở lên khi interface hỗ trợ private method"],"correctAnswer":2,"explanation":"Biên dịch tốt. Luật của @FunctionalInterface là interface phải có đúng một abstract method, và ba thứ sau không được tính: method có thân hàm (default, static, private), và abstract method có chữ ký trùng với method public của lớp Object (equals, hashCode, toString) — vì mọi object đã có sẵn cài đặt nên lambda không cần cung cấp. Đây chính là lý do Comparator vẫn là functional interface dù khai báo cả compare lẫn equals.","whyWrong":["Ràng buộc là đúng một ABSTRACT method, không phải đúng một method. Interface có bao nhiêu default/static tuỳ ý.","Default và static method hoàn toàn hợp lệ trong functional interface — Predicate và Function của JDK đều có.","","Cả default lẫn static method trong interface đã có từ Java 8; private method (Java 9) không xuất hiện trong đoạn code này."]},{"id":"d-8-4","topicId":8,"versions":[8,11,17,21],"difficulty":"intermediate","question":"Chương trình in ra gì?","code":"public class Outer {\n    private String name = \"outer\";\n\n    void run() {\n        Runnable lambda = () -> System.out.println(this.name);\n        Runnable anon = new Runnable() {\n            private String name = \"anon\";\n            public void run() { System.out.println(this.name); }\n        };\n        lambda.run();\n        anon.run();\n    }\n\n    public static void main(String[] a) { new Outer().run(); }\n}","choices":["outer rồi anon","outer rồi outer","anon rồi anon","Lỗi biên dịch: không được dùng this bên trong lambda"],"correctAnswer":0,"explanation":"Lambda không tạo ra một instance mới của kiểu nào cả — thân nó được dịch thành method của chính class Outer, nên this bên trong lambda chính là instance Outer, in ra 'outer'. Anonymous class thì là một class thật (Outer$1) có instance riêng, nên this trỏ tới object anonymous và this.name lấy field 'anon' của nó; muốn lấy field của Outer phải viết Outer.this.name. Hệ quả quan trọng: đọc một field instance trong lambda đồng nghĩa với capture this, tức giữ tham chiếu mạnh tới toàn bộ object bao ngoài.","whyWrong":["","Anonymous class có field name riêng che field của Outer, và this của nó trỏ vào chính nó nên in ra 'anon'.","Lambda không có instance riêng và cũng không được khai báo biến trùng tên với scope bao ngoài, nên this.name của nó là field của Outer.","this hoàn toàn hợp lệ trong lambda — chỉ là nó mang nghĩa lexical, tức là this của ngữ cảnh bao quanh."]},{"id":"d-8-5","topicId":8,"versions":[8,11,17,21],"difficulty":"intermediate","question":"Cho String s = \"hello\". Phát biểu nào đúng về hai method reference String::length và s::length?","choices":["Cả hai đều tương thích với Function<String, Integer>","String::length tương thích Function<String,Integer> (hoặc ToIntFunction<String>), còn s::length tương thích Supplier<Integer> (hoặc IntSupplier)","Cả hai đều tương thích với Supplier<Integer> vì length() không có tham số","s::length không hợp lệ — method reference chỉ viết được với tên class ở vế trái"],"correctAnswer":1,"explanation":"Đây là hai dạng method reference khác nhau. String::length là dạng 'instance method của một object tuỳ ý thuộc một kiểu': tham số ĐẦU TIÊN của lambda trở thành receiver, nên nó tương đương x -> x.length() và nhận một tham số. Còn s::length là dạng 'instance method của một object cụ thể': receiver đã cố định là s, nên nó tương đương () -> s.length() và không nhận tham số nào. Thêm một chi tiết hay bị bỏ qua: biểu thức s được đánh giá NGAY lúc tạo method reference, nên nếu sau đó gán s sang chuỗi khác thì method reference vẫn giữ object cũ.","whyWrong":["s::length đã cố định receiver nên không còn tham số nào để nhận String — nó không khớp Function<String,Integer>.","","String::length cần một String làm receiver, và receiver đó đến từ tham số của lambda, nên nó nhận đúng một tham số chứ không phải không tham số.","Vế trái của :: hoàn toàn có thể là một biểu thức tham chiếu object — đó chính là dạng 2 trong bốn dạng method reference."]},{"id":"d-8-6","topicId":8,"versions":[8,11,17,21],"difficulty":"intermediate","question":"Một class chứa 3 biểu thức lambda. Sau khi javac biên dịch, có bao nhiêu file .class được sinh thêm cho riêng các lambda đó, và cơ chế nào tạo ra class hiện thực?","choices":["3 file — mỗi lambda thành một class con giống hệt anonymous inner class","1 file gộp chung, chứa cả 3 lambda dưới dạng inner class","0 file — thân lambda thành method synthetic trong chính class chứa nó, class hiện thực do LambdaMetafactory sinh lúc runtime qua invokedynamic","0 file — JVM thông dịch trực tiếp bytecode của lambda mà không cần bất kỳ object nào"],"correctAnswer":2,"explanation":"javac dịch thân lambda thành một method synthetic ngay trong class bao ngoài (tên dạng lambda$run$0) và đặt tại điểm dùng một lệnh invokedynamic. Lần đầu chạy tới đó, JVM gọi bootstrap method LambdaMetafactory.metafactory để sinh class hiện thực functional interface trong bộ nhớ rồi gắn vào call site; các lần sau đi thẳng qua call site đã liên kết. Ngược lại, anonymous inner class sinh file Outer$1.class thật trên đĩa. Lý do thiết kế là để JDK tự do đổi chiến lược cài đặt lambda mà không phải biên dịch lại code người dùng.","whyWrong":["Đó là cách anonymous inner class hoạt động, không phải lambda. Nếu đúng vậy thì lambda đã không cần tới invokedynamic.","javac không gộp lambda vào một file .class chung; nó không sinh file .class nào cho lambda cả.","","Lambda vẫn phải trở thành một object hiện thực functional interface thì mới gọi được qua invokeinterface — JVM không có cơ chế 'thi hành lambda' tách rời object."]},{"id":"d-8-7","topicId":8,"versions":[17,21],"difficulty":"intermediate","question":"Danh sách sau được sắp xếp thế nào?","code":"record P(String name, int age) {}\n\nList<P> ps = new ArrayList<>(List.of(\n        new P(\"An\", 30), new P(\"Binh\", 25), new P(\"An\", 25)));\n\nps.sort(Comparator.comparing(P::name)\n                  .thenComparing(P::age)\n                  .reversed());\nSystem.out.println(ps);","choices":["[Binh 25, An 30, An 25] — reversed() đảo toàn bộ chuỗi so sánh đã ghép","[Binh 25, An 25, An 30] — reversed() chỉ đảo tiêu chí cuối là age","[An 30, An 25, Binh 25] — reversed() chỉ đảo tiêu chí đầu là name","[An 25, An 30, Binh 25] — reversed() không có tác dụng sau thenComparing"],"correctAnswer":0,"explanation":"comparing(...).thenComparing(...) trả về MỘT comparator ghép, và reversed() bọc toàn bộ comparator đó lại rồi đảo dấu kết quả — nên cả name lẫn age đều thành giảm dần. Kết quả: Binh trước (name giảm dần), rồi hai An sắp theo age giảm dần là 30 trước 25. Muốn giữ name tăng dần và chỉ đảo age, phải đảo riêng tiêu chí đó: comparing(P::name).thenComparing(Comparator.comparingInt(P::age).reversed()).","whyWrong":["","reversed() không biết gì về 'tiêu chí cuối' — nó chỉ nhận một Comparator (đã ghép) và trả về comparator đảo dấu của nó.","Tương tự, reversed() không tách được tiêu chí đầu ra khỏi chuỗi; nó áp lên kết quả so sánh cuối cùng.","reversed() luôn có tác dụng; nó là một default method của Comparator trả về comparator mới đảo thứ tự."]},{"id":"d-8-8","topicId":8,"versions":[8,11,17,21],"difficulty":"advanced","question":"Một event bus tĩnh giữ mãi Supplier trả về từ versionSupplier(). Hậu quả về bộ nhớ là gì?","code":"class Cache {\n    private final byte[] data = new byte[64 * 1024 * 1024];\n    private int version = 1;\n\n    Supplier<Integer> versionSupplier() {\n        return () -> version;\n    }\n}\n\n// EventBus.register(new Cache().versionSupplier());  // giữ rất lâu","choices":["Không sao — lambda đã copy giá trị version tại thời điểm tạo nên object Cache được GC bình thường","Lambda capture this của Cache, nên cả object Cache kể cả mảng 64MB không được GC chừng nào Supplier còn sống","Lỗi biên dịch vì version không phải effectively final","Lambda tạo bản sao sâu của Cache nên tốn gấp đôi bộ nhớ ngay lúc đăng ký"],"correctAnswer":1,"explanation":"Trong thân lambda, viết version thực chất là this.version, nên javac sinh method synthetic dạng instance và lambda phải giữ một tham chiếu mạnh tới this. Supplier sống trong một registry tĩnh thì cả cây object mà nó trỏ tới đều là GC root reachable — mảng 64MB không liên quan gì tới nghiệp vụ vẫn bị giữ lại. Cách chữa: copy giá trị ra biến local trước rồi capture biến local (int snapshot = version; return () -> snapshot;), khi đó lambda không tham chiếu instance nào và thường còn được JDK tái sử dụng chung một object.","whyWrong":["Luật copy-by-value chỉ áp cho biến LOCAL. Field instance không được copy — lambda truy cập nó qua this ở mỗi lần gọi.","","Effectively final chỉ ràng buộc biến local; field instance được đọc và ghi tự do trong lambda nên đây không phải lỗi biên dịch.","Java không sao chép sâu object khi capture. Vấn đề đúng là ngược lại: nó chỉ giữ một reference, và chính reference đó chặn GC."]},{"id":"d-8-9","topicId":8,"versions":[8,11,17,21],"difficulty":"advanced","question":"Đoạn code sau có vấn đề gì?","code":"List<Runnable> tasks = new ArrayList<>();\n\nfor (int i = 0; i < 3; i++) {\n    tasks.add(() -> System.out.print(i));\n}\n\nfor (String s : Arrays.asList(\"x\", \"y\")) {\n    tasks.add(() -> System.out.print(s));\n}\n\ntasks.forEach(Runnable::run);","choices":["Chạy được, in ra 012xy","Chạy được, in ra 333xy vì lambda thấy giá trị cuối cùng của i","Lỗi biên dịch ở vòng for đầu tiên; vòng for-each phía dưới hoàn toàn hợp lệ","Lỗi biên dịch ở cả hai vòng lặp vì biến điều khiển không bao giờ effectively final"],"correctAnswer":2,"explanation":"Biến i của for cổ điển được gán lại ở mỗi lần lặp (i++) nên không effectively final, và lambda không capture được nó — lỗi biên dịch. Ngược lại, biến của for-each được đặc tả như một biến MỚI được khởi tạo ở mỗi lần lặp và không bị gán lại, nên nó effectively final và capture bình thường; mỗi lambda giữ đúng giá trị của lần lặp sinh ra nó. Nếu thật sự cần chỉ số, hãy copy ra biến local trong thân vòng lặp: for (int i=0;i<3;i++) { int idx = i; tasks.add(() -> print(idx)); }.","whyWrong":["Vòng for đầu tiên không qua được bước biên dịch nên chương trình không chạy tới lúc in gì.","Đây là hành vi của closure capture-by-reference trong JavaScript cũ (var), không phải Java. Java chặn ngay ở compile time.","","Biến của for-each là ngoại lệ: đặc tả coi nó là biến mới mỗi lần lặp, nên nó effectively final và capture được."]},{"id":"d-9-1","topicId":9,"versions":[8,11,17,21],"difficulty":"beginner","question":"Đoạn code sau in ra gì?","code":"List<String> names = Arrays.asList(\"an\", \"binh\", \"cuong\");\n\nStream<String> s = names.stream()\n        .filter(n -> { System.out.println(\"filter \" + n); return n.length() > 2; })\n        .map(n -> { System.out.println(\"map \" + n); return n.toUpperCase(); });\n\nSystem.out.println(\"--- xong ---\");","choices":["3 dòng filter, 2 dòng map, rồi mới tới --- xong ---","--- xong --- trước, sau đó mới in các dòng filter và map","Chỉ in --- xong ---","Ném IllegalStateException vì stream không có terminal operation"],"correctAnswer":2,"explanation":"filter và map là intermediate operation: chúng chỉ dựng thêm một tầng vào mô tả pipeline chứ không đụng tới phần tử nào. Không có terminal operation (collect, forEach, count...) thì JDK không bao giờ kéo dữ liệu từ Spliterator của nguồn, nên không lambda nào được gọi. Đây là lỗi im lặng khó chịu: một pipeline dài viết cho có side effect mà quên terminal operation sẽ không làm gì và cũng không báo lỗi.","whyWrong":["Đó là kết quả nếu có terminal operation và nếu pipeline chạy theo từng tầng — cả hai giả định đều sai.","Không có gì để in sau --- xong --- vì pipeline chưa bao giờ được kích hoạt.","","Stream không có terminal operation là hợp lệ về mặt ngôn ngữ, chỉ đơn giản là không làm gì. IllegalStateException chỉ xảy ra khi dùng lại một stream đã tiêu thụ."]},{"id":"d-9-2","topicId":9,"versions":[8,11,17,21],"difficulty":"beginner","question":"Kết quả của đoạn code sau là gì?","code":"Stream<String> s = Arrays.asList(\"a\", \"b\").stream();\nlong n = s.count();\nList<String> l = s.collect(Collectors.toList());\nSystem.out.println(n + \" \" + l);","choices":["In ra: 2 [a, b]","In ra: 2 [] vì stream đã bị tiêu thụ hết phần tử","n = 2 rồi dòng collect ném IllegalStateException: stream has already been operated upon or closed","Lỗi biên dịch vì không được gọi hai terminal operation trên cùng một biến"],"correctAnswer":2,"explanation":"Stream không lưu dữ liệu — nó là một pipeline có trạng thái tiêu thụ trỏ tới nguồn. Bên trong AbstractPipeline có cờ linkedOrConsumed; terminal operation đầu tiên bật cờ đó, và mọi thao tác sau (dù là intermediate hay terminal) đều ném IllegalStateException. Đây là lỗi RUNTIME, compiler không phát hiện được. Muốn dùng nhiều lần, hãy giữ nguồn rồi gọi .stream() lại, hoặc giữ một Supplier<Stream<T>>.","whyWrong":["Stream không phải collection nên không thể duyệt lại lần thứ hai.","Nó không im lặng trả về list rỗng — JDK ném exception tường minh để lỗi lộ ra ngay.","","Kiểu Stream<String> cho phép gọi mọi terminal operation nên compiler không có cơ sở nào để từ chối; ràng buộc chỉ được kiểm tra lúc chạy."]},{"id":"d-9-3","topicId":9,"versions":[8,11,17,21],"difficulty":"beginner","question":"Có một List<List<String>> và bạn muốn thu được một List<String> phẳng chứa mọi phần tử con. Cách nào đúng?","choices":["nested.stream().map(List::stream).collect(Collectors.toList())","nested.stream().map(l -> l.get(0)).collect(Collectors.toList())","nested.stream().flatMap(l -> l).collect(Collectors.toList())","nested.stream().flatMap(List::stream).collect(Collectors.toList())"],"correctAnswer":3,"explanation":"flatMap nhận một hàm biến mỗi phần tử thành một Stream, rồi nối (concat) tất cả các stream con đó thành một stream duy nhất — đúng thao tác cần để làm phẳng. Điểm khác biệt cốt lõi với map: map giữ nguyên số phần tử và chỉ đổi kiểu, còn flatMap thay đổi cả số lượng phần tử (một phần tử vào có thể ra 0, 1 hay nhiều). Ngoài làm phẳng, flatMap còn là cách chuẩn để bỏ qua phần tử không hợp lệ bằng cách trả về Stream.empty().","whyWrong":["map(List::stream) cho ra Stream<Stream<String>>, tức collect được List<Stream<String>> chứ không phải List<String>.","Chỉ lấy phần tử đầu của mỗi list con, bỏ mất toàn bộ phần còn lại — và ném IndexOutOfBoundsException nếu có list rỗng.","Không biên dịch được: flatMap yêu cầu hàm trả về một Stream, còn l ở đây là một List.",""]},{"id":"d-9-4","topicId":9,"versions":[8,11,17,21],"difficulty":"intermediate","question":"Thứ tự output của đoạn code sau là gì?","code":"Stream.of(\"a\", \"b\", \"c\")\n      .filter(s -> { System.out.println(\"filter \" + s); return true; })\n      .map(s -> { System.out.println(\"map \" + s); return s; })\n      .forEach(s -> System.out.println(\"forEach \" + s));","choices":["filter a, filter b, filter c, map a, map b, map c, forEach a, forEach b, forEach c","filter a, map a, forEach a, filter b, map b, forEach b, filter c, map c, forEach c","forEach a, forEach b, forEach c rồi mới tới filter và map","Thứ tự không xác định vì JDK có thể tự động chạy song song"],"correctAnswer":1,"explanation":"Pipeline được thực thi theo từng PHẦN TỬ chứ không theo từng TẦNG. Khi terminal operation chạy, JDK gấp toàn bộ chuỗi Sink thành một hàm duy nhất rồi kéo từng phần tử từ nguồn cho đi hết chiều sâu pipeline mới lấy phần tử tiếp theo. Chính cơ chế fusion này khiến pipeline nhiều bước vẫn chỉ duyệt nguồn một lần, không tạo collection trung gian, và cho phép short-circuit dừng sớm giữa chừng.","whyWrong":["Đó là mô hình 'mỗi bước tạo một list mới' của cách viết vòng lặp thủ công, không phải cách stream hoạt động.","","forEach là terminal operation nên nó là thứ kích hoạt toàn bộ pipeline, không thể chạy trước filter và map.","Stream chỉ chạy song song khi bạn gọi parallel() hoặc parallelStream(); JDK không bao giờ tự bật song song."]},{"id":"d-9-5","topicId":9,"versions":[17,21],"difficulty":"intermediate","question":"Chuyện gì xảy ra khi chạy đoạn code sau?","code":"List<String> a = Stream.of(\"x\").collect(Collectors.toList());\nList<String> b = Stream.of(\"x\").toList();\n\na.add(\"y\");\nb.add(\"y\");","choices":["Cả hai lệnh add đều thành công","a.add(\"y\") chạy được; b.add(\"y\") ném UnsupportedOperationException vì Stream.toList() trả về list bất biến","Cả hai lệnh add đều ném UnsupportedOperationException","a.add(\"y\") ném UnsupportedOperationException; b.add(\"y\") chạy được"],"correctAnswer":1,"explanation":"Stream.toList() (Java 16+) được đặc tả trả về một list KHÔNG sửa được, nên add ném UnsupportedOperationException. Còn Collectors.toList() thì javadoc ghi rõ là không đảm bảo về kiểu, mutability, serializability hay thread-safety — trên OpenJDK hiện nay nó trả ArrayList nên add chạy được, nhưng đó là chi tiết cài đặt chứ không phải hợp đồng. Quy tắc thực tế: cần list bất biến thì dùng stream().toList(); cần list sửa được thì nói rõ bằng Collectors.toCollection(ArrayList::new).","whyWrong":["Stream.toList() được đặc tả là unmodifiable nên add chắc chắn thất bại.","","Collectors.toList() trên OpenJDK hiện tại trả về ArrayList nên add thành công; nó chỉ không được ĐẢM BẢO như vậy.","Đúng ngược chiều: cái bất biến là kết quả của Stream.toList(), không phải của Collectors.toList()."]},{"id":"d-9-6","topicId":9,"versions":[8,11,17,21],"difficulty":"intermediate","question":"Kết quả của đoạn code sau?","code":"List<String> words = Arrays.asList(\"an\", \"ba\", \"an\");\n\nMap<String, Integer> m = words.stream()\n        .collect(Collectors.toMap(w -> w, String::length));","choices":["Ném IllegalStateException vì khoá \"an\" bị trùng và không có merge function","Trả về {an=2, ba=2} — bản sau ghi đè bản trước giống HashMap.put","Ném IllegalArgumentException vì stream chứa phần tử trùng lặp","Trả về {an=2, ba=2, an=2} vì toMap không kiểm tra trùng khoá"],"correctAnswer":0,"explanation":"Bản toMap hai tham số cố ý không cho phép trùng khoá: khi phát hiện khoá đã tồn tại, nó ném IllegalStateException với thông điệp 'Duplicate key'. Thiết kế này buộc lập trình viên nói rõ ý định thay vì im lặng mất dữ liệu. Muốn giữ bản nào phải truyền merge function ở tham số thứ ba: toMap(w -> w, String::length, (older, newer) -> older). Hai bẫy còn lại của toMap: giá trị null ném NullPointerException (vì cài đặt dùng Map.merge, khác HashMap.put), và map trả về là HashMap nên không giữ thứ tự nếu không truyền thêm LinkedHashMap::new.","whyWrong":["","Ghi đè im lặng là hành vi của HashMap.put, không phải của Collectors.toMap hai tham số.","Exception được ném là IllegalStateException chứ không phải IllegalArgumentException.","Map không thể có hai entry cùng khoá; và toMap kiểm tra trùng khoá rất chặt."]},{"id":"d-9-7","topicId":9,"versions":[8,11,17,21],"difficulty":"intermediate","question":"Biến m có giá trị gì?","code":"List<String> names = Arrays.asList(\"an\", \"ba\", \"cuong\", \"duy\");\n\nMap<Integer, Long> m = names.stream()\n        .collect(Collectors.groupingBy(String::length, Collectors.counting()));","choices":["{2=2, 3=1, 5=1}","{2=[an, ba], 3=[duy], 5=[cuong]}","{an=2, ba=2, cuong=5, duy=3}","Lỗi biên dịch vì counting() trả về Long nên Map phải khai báo là Map<Integer, Integer>"],"correctAnswer":0,"explanation":"groupingBy hai tham số dùng classifier để tạo khoá và dùng downstream collector để xử lý các phần tử rơi vào cùng khoá. Ở đây khoá là độ dài chuỗi, downstream là counting() nên giá trị là số phần tử kiểu Long: độ dài 2 có an và ba (2 phần tử), độ dài 3 có duy, độ dài 5 có cuong. Map trả về mặc định là HashMap nên thứ tự in phụ thuộc hash; muốn có thứ tự phải dùng bản ba tham số với TreeMap::new. Lưu ý classifier không được trả về null, nếu không groupingBy ném NullPointerException.","whyWrong":["","Đó là kết quả của groupingBy MỘT tham số (downstream mặc định là toList()); ở đây downstream đã bị thay bằng counting().","Đó là kết quả của toMap(w -> w, String::length) — và bản đó còn nổ IllegalStateException nếu có chuỗi trùng.","counting() thực sự trả về Collector<T, ?, Long>, nên khai báo Map<Integer, Long> trong code là chính xác."]},{"id":"d-9-8","topicId":9,"versions":[8,11,17,21],"difficulty":"advanced","question":"Đoạn code sau in ra gì?","code":"List<Integer> out = new ArrayList<>();\n\nIntStream.range(0, 100_000)\n         .parallel()\n         .boxed()\n         .forEach(out::add);\n\nSystem.out.println(out.size());","choices":["Luôn in 100000, chỉ khác là thứ tự phần tử bị xáo trộn","Luôn ném ConcurrentModificationException","Luôn ném UnsupportedOperationException vì không được sửa collection trong forEach","Kết quả không xác định: có thể nhỏ hơn 100000, có thể chứa null, hoặc ném ArrayIndexOutOfBoundsException / NullPointerException"],"correctAnswer":3,"explanation":"Nhiều thread của ForkJoinPool cùng gọi add trên một ArrayList không thread-safe. ArrayList.add gồm hai bước không nguyên tử: tăng size và ghi vào mảng — hai thread có thể ghi đè cùng một ô, hoặc thấy mảng đang được resize dở dang. Triệu chứng vì thế không xác định và thay đổi giữa các lần chạy. Đây chính là điều javadoc gọi là vi phạm yêu cầu 'stateless, non-interfering' của behavioral parameter. Cách đúng là dùng collect: cơ chế collect cấp cho mỗi nhánh một container riêng rồi mới gộp, nên nó an toàn theo thiết kế.","whyWrong":["Đây là data race chứ không phải chỉ chuyện thứ tự — số phần tử hoàn toàn có thể bị mất.","ConcurrentModificationException dành cho việc sửa cấu trúc collection ĐANG được duyệt; ở đây out không phải nguồn của stream.","ArrayList hoàn toàn cho phép add; vấn đề nằm ở truy cập đồng thời chứ không phải ở tính bất biến.",""]},{"id":"d-9-9","topicId":9,"versions":[11,17,21],"difficulty":"advanced","question":"Trên Java 11 trở lên, đoạn code sau in ra gì?","code":"long n = List.of(\"a\", \"b\", \"c\").stream()\n        .peek(System.out::println)\n        .count();\n\nSystem.out.println(\"n = \" + n);","choices":["In a, b, c rồi n = 3","Không in a, b, c; chỉ in n = 3 — count() lấy thẳng số phần tử từ nguồn mà không chạy pipeline","Không in gì cả và n = 0 vì peek không phải operation hợp lệ trước count","In a, b, c rồi n = 0"],"correctAnswer":1,"explanation":"Từ Java 9, javadoc của count() cho phép cài đặt tính thẳng số phần tử từ nguồn nếu nó biết chắc kích thước và pipeline không có operation nào làm thay đổi số phần tử (peek thì không). Khi đó không phần tử nào được duyệt và mọi behavioral parameter có side effect đều bị bỏ qua. Trên Java 8 cùng đoạn code này in ra a, b, c — nên đây là khác biệt hành vi phụ thuộc phiên bản. Bài học thực tế: peek chỉ dùng để debug tạm, đừng bao giờ đặt logic thật vào đó, và cũng đừng dựa vào peek để suy luận pipeline có chạy hay không.","whyWrong":["Đó là hành vi của Java 8. Từ Java 9, count() được phép bỏ qua toàn bộ pipeline khi kích thước nguồn đã biết.","","peek là intermediate operation hoàn toàn hợp lệ, và count() vẫn trả về đúng số phần tử là 3.","count() luôn trả về đúng số phần tử của stream; ở đây không có filter nào nên kết quả là 3."]},{"id":"d-10-1","topicId":10,"versions":[8,11,17,21],"difficulty":"beginner","question":"Chuyện gì xảy ra khi chạy đoạn code sau?","code":"String s = null;\n\nOptional<String> a = Optional.ofNullable(s);\nOptional<String> b = Optional.of(s);\n\nSystem.out.println(a.isPresent() + \" \" + b.isPresent());","choices":["In ra: false false — cả hai đều tạo Optional rỗng","a là Optional rỗng; dòng tạo b ném NullPointerException","Cả hai dòng đều ném NullPointerException","Cả hai đều tạo Optional chứa giá trị null nên in ra true true"],"correctAnswer":1,"explanation":"Optional.ofNullable chấp nhận null và biến nó thành Optional.empty(). Optional.of thì gọi Objects.requireNonNull nên ném NullPointerException ngay tại dòng đó. Đây không phải thiếu sót thiết kế mà là chủ đích: of dùng khi bạn khẳng định giá trị không thể null và muốn lỗi nổ ngay tại nguồn, còn ofNullable dùng khi bọc kết quả từ API có thể trả null (map.get, thư viện cũ). Viết ofNullable ở mọi nơi 'cho an toàn' làm mất khả năng phát hiện lỗi sớm.","whyWrong":["Chỉ ofNullable mới chuyển null thành rỗng; of từ chối null.","","ofNullable được thiết kế đúng để nhận null, nó không bao giờ ném NPE vì tham số null.","Optional không bao giờ chứa null — một Optional hoặc rỗng, hoặc chứa một giá trị khác null."]},{"id":"d-10-2","topicId":10,"versions":[8,11,17,21],"difficulty":"beginner","question":"Optional được thiết kế chủ yếu cho mục đích nào?","choices":["Làm kiểu cho field của entity để không bao giờ phải lưu null vào database","Làm kiểu tham số của method để bắt caller nói rõ có truyền giá trị hay không","Làm KIỂU TRẢ VỀ của method có thể không có kết quả, để chữ ký nói rõ điều đó","Thay thế toàn bộ việc kiểm tra null trong codebase, kể cả biến local"],"correctAnswer":2,"explanation":"Optional đưa khả năng 'không có giá trị' vào hệ thống kiểu ở đúng nơi cần: chữ ký của method. Trước Java 8, một method trả về User không có cách nào báo cho caller biết kết quả có thể không tồn tại ngoài javadoc. Ba cách dùng còn lại đều bị chính người thiết kế JDK khuyến cáo tránh: Optional không implement Serializable nên hỏng field của entity; làm tham số thì tạo ba trạng thái (null / empty / có giá trị) thay vì hai; và mỗi Optional là một object trên heap nên rải khắp code nội bộ là chi phí vô ích.","whyWrong":["Optional không Serializable và không được JPA/Jackson hỗ trợ tự nhiên. Cách đúng là field nullable, getter trả Optional.","Tham số kiểu Optional vẫn có thể nhận null, nên caller phải xử lý ba trạng thái thay vì hai. Dùng overload hoặc builder thay thế.","","Optional không thay thế được null ở mọi chỗ: nó chỉ nói về sự tồn tại của chính giá trị đó, không bảo vệ khỏi null bên trong object, và có chi phí allocation thật."]},{"id":"d-10-3","topicId":10,"versions":[8,11,17,21],"difficulty":"beginner","question":"Viết lại đoạn code sau theo đúng tinh thần Optional thì dùng cách nào?","code":"Optional<User> u = repo.findById(id);\nif (u.isPresent()) {\n    return u.get().getName();\n}\nreturn \"unknown\";","choices":["return u.map(User::getName).orElse(\"unknown\");","return u.orElse(null).getName();","return u.filter(Objects::nonNull).get().getName();","return u.isEmpty() ? \"unknown\" : u.get().getName();   (Optional.isEmpty() chỉ có từ Java 11)"],"correctAnswer":0,"explanation":"map biến đổi giá trị nếu có và giữ nguyên trạng thái rỗng nếu không, orElse cung cấp giá trị mặc định — cả chuỗi thành một biểu thức duy nhất không có nhánh rẽ nào. Mẫu isPresent() + get() chỉ là câu kiểm tra null cũ viết dài hơn và thêm một object rác, nó vứt bỏ toàn bộ giá trị của Optional. Ở đây orElse dùng đúng vì giá trị mặc định là một hằng chuỗi, không tốn gì để tính.","whyWrong":["","orElse(null) trả về null rồi gọi getName() ngay trên đó, tức là quay lại đúng NullPointerException mà Optional sinh ra để tránh.","filter(Objects::nonNull) là thừa vì Optional không bao giờ chứa null; và get() vẫn ném NoSuchElementException khi rỗng.","Vẫn là isPresent/get đội lốt toán tử ba ngôi — ngắn hơn nhưng cùng một anti-pattern, và isEmpty() còn đòi Java 11 trở lên."]},{"id":"d-10-4","topicId":10,"versions":[8,11,17,21],"difficulty":"intermediate","question":"Đoạn code sau in ra gì?","code":"static String loadFromDb() {\n    System.out.println(\"truy van DB\");\n    return \"db\";\n}\n\npublic static void main(String[] args) {\n    Optional<String> cached = Optional.of(\"cache\");\n    String v1 = cached.orElse(loadFromDb());\n    String v2 = cached.orElseGet(() -> loadFromDb());\n    System.out.println(v1 + \" \" + v2);\n}","choices":["Không in \"truy van DB\" lần nào; in cache cache","In \"truy van DB\" một lần (do orElse), rồi in cache cache","In \"truy van DB\" hai lần, rồi in db db","In \"truy van DB\" một lần (do orElseGet), rồi in cache db"],"correctAnswer":1,"explanation":"Java đánh giá mọi đối số trước khi gọi method, nên loadFromDb() trong orElse(...) chạy bất kể Optional có giá trị hay không — kết quả của nó bị vứt đi nhưng side effect thì đã xảy ra. orElseGet nhận một Supplier nên thân lambda chỉ chạy khi Optional rỗng, ở đây là không bao giờ. Cả hai biến đều nhận giá trị bên trong Optional là \"cache\". Đây là bug hiệu năng thật trong code cache: opt.orElse(loadFromDatabase(k)) gọi DB ở mọi lần chạy mà kết quả trả về vẫn đúng nên không ai phát hiện.","whyWrong":["Đối số của orElse là một lời gọi method nên nó buộc phải được đánh giá trước khi orElse bắt đầu chạy.","","orElseGet không gọi supplier khi Optional có giá trị, nên chỉ có đúng một lần in; và giá trị trả về vẫn là nội dung Optional chứ không phải mặc định.","Ngược chiều: orElseGet mới là bản lười, orElse mới là bản đánh giá sớm."]},{"id":"d-10-5","topicId":10,"versions":[8,11,17,21],"difficulty":"intermediate","question":"Cho Customer.getAddress() có kiểu trả về là Optional<Address>. Biểu thức optCustomer.map(Customer::getAddress) có kiểu gì?","choices":["Optional<Address> — map tự phẳng hoá kết quả","Optional<Optional<Address>> — cần dùng flatMap để phẳng hoá một tầng","Address — map mở luôn giá trị bên trong","Không biên dịch được vì map không nhận hàm trả về Optional"],"correctAnswer":1,"explanation":"map bọc kết quả của hàm bằng Optional.ofNullable, nên hàm trả về Optional<Address> sẽ cho ra Optional<Optional<Address>>. Kiểu này hợp lệ về mặt biên dịch nhưng vô dụng, và thường lộ ra dưới dạng lỗi ở dòng tiếp theo khi bạn gọi một method của Address. flatMap tồn tại đúng để xử lý trường hợp này: nó nhận hàm đã trả về Optional và ghép trực tiếp, cho ra Optional<Address>. Quy tắc: hàm trả về giá trị thường thì map, hàm trả về Optional thì flatMap.","whyWrong":["map không phẳng hoá — đó chính là công việc của flatMap.","","map luôn trả về một Optional, nó không bao giờ mở giá trị trần ra ngoài.","Hoàn toàn biên dịch được; hàm truyền vào map có thể trả về kiểu bất kỳ, kể cả Optional."]},{"id":"d-10-6","topicId":10,"versions":[8,11,17,21],"difficulty":"intermediate","question":"Giá trị của biến port là gì?","code":"Map<String, String> cfg = new HashMap<>();\ncfg.put(\"host\", \"localhost\");\n\nString port = Optional.ofNullable(cfg.get(\"host\"))\n        .map(h -> cfg.get(\"port\"))\n        .orElse(\"8080\");","choices":["port = null","Ném NullPointerException tại lời gọi map","port = \"8080\"","port = \"localhost\""],"correctAnswer":2,"explanation":"cfg.get(\"host\") trả về \"localhost\" nên Optional có giá trị và map được thực thi. Hàm bên trong map trả về cfg.get(\"port\") tức null, nhưng map bọc kết quả bằng Optional.ofNullable chứ không phải Optional.of — nên kết quả là Optional rỗng chứ không phải Optional chứa null, cũng không phải NPE. orElse do đó trả về \"8080\". Chính đặc tính này khiến chuỗi map tự hấp thụ mọi null xuất hiện ở giữa và thay được kim tự tháp if.","whyWrong":["orElse chỉ trả null nếu bạn truyền null làm mặc định; ở đây mặc định là \"8080\".","map dùng ofNullable nên null từ hàm biến đổi không gây NPE — nó chỉ làm Optional trở thành rỗng.","","\"localhost\" là giá trị đầu vào của map, không phải kết quả; hàm trong map đã thay nó bằng cfg.get(\"port\")."]},{"id":"d-10-7","topicId":10,"versions":[8,11,17,21],"difficulty":"intermediate","question":"Đoạn code sau in ra gì?","code":"Optional<String> a = Optional.of(new String(\"java\"));\nOptional<String> b = Optional.of(\"java\");\n\nSystem.out.println(a == b);\nSystem.out.println(a.equals(b));","choices":["false rồi true","true rồi true","false rồi false","Lỗi biên dịch vì Optional không override equals nên không so sánh được"],"correctAnswer":0,"explanation":"Optional.of luôn tạo một object Optional mới nên a và b là hai tham chiếu khác nhau, == cho false. Optional có override equals: hai Optional bằng nhau khi cùng rỗng, hoặc cùng có giá trị và hai giá trị equals nhau — ở đây new String(\"java\").equals(\"java\") là true nên equals cho true. Quy tắc thực hành: luôn so sánh Optional bằng equals. Lưu ý thêm một cái bẫy: Optional.empty() trong OpenJDK trả về một instance dùng chung nên == có thể tình cờ đúng với Optional rỗng, nhưng đó là chi tiết cài đặt, đừng dựa vào.","whyWrong":["","of() cấp phát một object Optional mới ở mỗi lời gọi, nên hai tham chiếu không thể bằng nhau.","Optional có override equals dựa trên giá trị bên trong, nên phép so sánh thứ hai cho true.","Optional override cả equals lẫn hashCode và toString — đoạn code biên dịch bình thường."]},{"id":"d-10-8","topicId":10,"versions":[11,17,21],"difficulty":"advanced","question":"Có List<Optional<String>> và muốn lấy ra List<String> chỉ chứa các giá trị có mặt. Cách nào là idiom chuẩn từ Java 9 trở lên?","code":"List<Optional<String>> raw = List.of(Optional.of(\"a\"), Optional.empty(), Optional.of(\"b\"));","choices":["raw.stream().map(Optional::get).collect(Collectors.toList())","raw.stream().flatMap(Optional::stream).collect(Collectors.toList())","raw.stream().flatMap(Optional::get).collect(Collectors.toList())","raw.stream().filter(Optional::isPresent).map(Optional::get).collect(Collectors.toList()) — và đây là cách duy nhất chạy được"],"correctAnswer":1,"explanation":"Optional.stream() (Java 9) biến Optional thành stream có 0 hoặc 1 phần tử, nên flatMap(Optional::stream) vừa lọc vừa mở giá trị trong một bước và không có get() nào ở giữa. Ý tưởng giống hệt flatMap trên Stream: một phần tử vào có thể cho ra 0 hoặc nhiều phần tử ra. Trên Java 8 vẫn phải viết filter(Optional::isPresent).map(Optional::get); biết cả hai và biết mốc phiên bản là điều người phỏng vấn muốn nghe.","whyWrong":["map(Optional::get) ném NoSuchElementException ngay khi gặp Optional.empty() trong danh sách.","","flatMap yêu cầu hàm trả về một Stream; Optional::get trả về String nên không biên dịch được.","Cách này thực sự chạy được và là idiom của Java 8, nhưng khẳng định 'duy nhất chạy được' là sai — từ Java 9 đã có flatMap(Optional::stream) ngắn hơn."]},{"id":"d-10-9","topicId":10,"versions":[8,11,17,21],"difficulty":"advanced","question":"Chuyện gì xảy ra khi serialize object User dưới đây bằng ObjectOutputStream?","code":"class User implements Serializable {\n    private String name = \"an\";\n    private Optional<String> nickname = Optional.of(\"bin\");\n}\n\n// new ObjectOutputStream(out).writeObject(new User());","choices":["Chạy bình thường — Optional được serialize như một wrapper chứa giá trị bên trong","Lỗi biên dịch vì field của class Serializable phải là kiểu Serializable","Serialize được nhưng khi deserialize thì nickname trở thành null","Ném NotSerializableException vì Optional không implement Serializable"],"correctAnswer":3,"explanation":"java.util.Optional cố ý KHÔNG implement Serializable, nên khi ObjectOutputStream đi tới field nickname nó ném NotSerializableException: java.util.Optional lúc chạy. Đây là một trong ba lý do chính không đặt Optional làm field (hai lý do còn lại: thêm một object trên heap cho mỗi instance, và các framework mapping như JPA/Jackson không xử lý tự nhiên). Cách đúng là để field là String nullable và cho getter trả về Optional.ofNullable(nickname) — Optional khi đó chỉ tồn tại ở ranh giới API. Nếu buộc phải giữ field như vậy, có thể đánh dấu transient và tự xử lý trong writeObject/readObject.","whyWrong":["Java serialization chỉ ghi được object của kiểu implement Serializable; Optional không nằm trong số đó.","Compiler không kiểm tra điều này — ràng buộc Serializable chỉ được kiểm tra lúc chạy, đó là lý do lỗi kiểu này thường lọt tới production.","Không có bước deserialize nào xảy ra vì quá trình serialize đã thất bại ngay từ đầu.",""]},{"id":"d-11-1","topicId":11,"versions":[11,17,21],"difficulty":"beginner","question":"Module A khai báo exports com.acme.entity. Module B requires A và dùng reflection gọi setAccessible(true) trên một field private của lớp com.acme.entity.Order. Điều gì xảy ra?","code":"// module-info.java cua A\nmodule com.acme.a {\n    exports com.acme.entity;\n}\n\n// trong module B\nField f = Order.class.getDeclaredField(\"total\");\nf.setAccessible(true);\nSystem.out.println(f.get(order));","choices":["Chạy bình thường vì package đã được exports","Lỗi biên dịch vì không được getDeclaredField trên module khác","Ném InaccessibleObjectException lúc runtime vì exports không cho phép deep reflection","Ném IllegalAccessException vì field là private"],"correctAnswer":2,"explanation":"exports chỉ cấp quyền tới mức public API ở cả compile lẫn runtime, còn setAccessible(true) trên thành viên private là deep reflection và chỉ được phép khi package được opens. Vì A không opens com.acme.entity, JVM ném InaccessibleObjectException (một RuntimeException) ngay tại lời gọi setAccessible. Quy tắc thực tế: package chứa entity/DTO cho ORM hay Jackson phải có opens, tốt nhất là opens ... to đúng module framework cần.","whyWrong":["exports và opens là hai chiều khác nhau; exports không bao giờ mở đường cho deep reflection","getDeclaredField vẫn biên dịch được vì đó là API reflection thông thường, không có kiểm tra lúc compile","","IllegalAccessException là lỗi của mô hình truy cập cũ trước module; ở đây chính lời gọi setAccessible bị chặn trước, và ngoại lệ ném ra là InaccessibleObjectException"]},{"id":"d-11-2","topicId":11,"versions":[11,17,21],"difficulty":"beginner","question":"Module A requires B, module B requires C. Trong code của A có dùng trực tiếp một lớp mà C export. Điều gì xảy ra khi biên dịch A?","choices":["Biên dịch được vì phụ thuộc trong Java module là bắc cầu như Maven","Lỗi biên dịch vì readability không bắc cầu; A phải requires C hoặc B phải requires transitive C","Biên dịch được nhưng lỗi NoClassDefFoundError lúc runtime","Biên dịch được nếu C nằm trên module path, lỗi nếu C nằm trên classpath"],"correctAnswer":1,"explanation":"Quan hệ readability trong JPMS không bắc cầu theo mặc định — đây là điểm khác hẳn với transitive dependency của Maven và là chỗ gây nhầm nhiều nhất. A muốn dùng kiểu của C thì hoặc chính A phải requires C, hoặc B phải khai báo requires transitive C. Quy tắc thiết kế đi kèm: nếu kiểu của C xuất hiện trong chữ ký public của B thì B bắt buộc phải dùng transitive, nếu không người dùng B sẽ không compile được.","whyWrong":["Maven bắc cầu ở tầng dựng classpath, còn JPMS cố ý không bắc cầu readability để mỗi module khai báo rõ thứ nó thực sự dùng","","Lỗi xảy ra ngay lúc biên dịch chứ không đợi tới runtime; compiler đã kiểm tra đồ thị module","Vị trí của C không thay đổi luật readability; nếu C ở classpath thì nó thuộc unnamed module và A càng không thể requires nó"]},{"id":"d-11-3","topicId":11,"versions":[11,17,21],"difficulty":"beginner","question":"Đặt file legacy-utils-2.3.1.jar (không có module-info.class, không có Automatic-Module-Name trong manifest) lên module path. Tên module của nó là gì và nó export những gì?","choices":["JAR không có module-info thì không đặt lên module path được, JVM sẽ báo lỗi","Tên là legacy.utils.2.3.1 và chỉ export package gốc","Nó thuộc unnamed module nên không có tên và không module nào requires được","Tên suy ra từ tên file là legacy.utils, và nó export toàn bộ package của mình"],"correctAnswer":3,"explanation":"JAR không có module-info nhưng nằm trên module path trở thành automatic module: tên lấy từ manifest Automatic-Module-Name nếu có, nếu không thì suy ra từ tên file sau khi bỏ phần version và chuẩn hoá ký tự, ở đây là legacy.utils. Automatic module export toàn bộ package và đọc được mọi module khác lẫn unnamed module; riêng implied readability thì hẹp hơn nhiều so với cách nói quen thuộc: nó chỉ requires transitive các automatic module khác, chứ module requires nó không nhờ thế mà đọc được explicit module như java.sql. Rủi ro là tên phụ thuộc tên file: đổi tên artifact hoặc đổi cách đặt tên khi build là đổi tên module, nên tác giả thư viện nên thêm Automatic-Module-Name.","whyWrong":["Module path chấp nhận JAR không modular; đó chính là cơ chế automatic module để hỗ trợ migration dần","Phần version bị loại bỏ khi suy ra tên module, và automatic module export tất cả chứ không chỉ package gốc","Unnamed module là dành cho classpath; đặt trên module path thì thành automatic module và có tên",""]},{"id":"d-11-4","topicId":11,"versions":[11,17,21],"difficulty":"intermediate","question":"Module A chỉ khai báo opens com.acme.dto (không exports). Module B requires A và viết import com.acme.dto.OrderDto; trong code. Kết quả?","code":"// module-info.java cua A\nmodule com.acme.a {\n    opens com.acme.dto;\n}\n\n// trong module B\nimport com.acme.dto.OrderDto;   // <-- dong nay\nOrderDto dto = new OrderDto();","choices":["Lỗi biên dịch vì opens không cấp quyền truy cập lúc compile","Biên dịch và chạy bình thường vì opens mạnh hơn exports","Biên dịch được nhưng ném IllegalAccessError lúc runtime","Biên dịch được vì opens ngầm hiểu là exports, chỉ reflection mới bị chặn"],"correctAnswer":0,"explanation":"opens là mệnh đề thuần runtime: nó cho phép reflection sâu lúc chạy nhưng không hề mở quyền truy cập tĩnh lúc biên dịch, nên import trực tiếp sẽ lỗi compile. Đây đúng là trường hợp dùng thường gặp: package entity/DTO chỉ cần opens cho ORM hoặc Jackson chứ không cần ai import trực tiếp. Nếu muốn cả hai, phải khai báo cả exports lẫn opens cho cùng package.","whyWrong":["","Không có quan hệ mạnh yếu giữa hai mệnh đề; chúng nằm trên hai trục khác nhau là thời điểm và độ sâu","Lỗi xảy ra ngay lúc biên dịch nên chương trình không bao giờ chạy tới runtime","opens hoàn toàn không ngầm hiểu là exports; ngược lại, chính reflection mới là thứ opens cho phép"]},{"id":"d-11-5","topicId":11,"versions":[11,17,21],"difficulty":"intermediate","question":"requires static org.example.annotations có ý nghĩa gì?","choices":["Module chỉ được dùng các thành viên static của org.example.annotations","Module được nạp một lần duy nhất và chia sẻ giữa mọi class loader","Bắt buộc có lúc biên dịch, nhưng được phép vắng mặt lúc runtime và module resolution sẽ không báo lỗi","Bắt buộc có lúc runtime nhưng không cần lúc biên dịch"],"correctAnswer":2,"explanation":"requires static khai báo một phụ thuộc tuỳ chọn: javac bắt buộc phải thấy module đó, còn khi chạy nếu module vắng mặt thì bước resolution vẫn thành công. Nó hợp cho annotation chỉ tồn tại lúc biên dịch, annotation processor, hoặc tích hợp tuỳ chọn mà code đã có nhánh dự phòng. Đổi lại, trách nhiệm thuộc về lập trình viên: nếu code thực sự chạm tới class của module vắng mặt, bạn sẽ nhận NoClassDefFoundError.","whyWrong":["Từ khoá static ở đây không liên quan gì tới thành viên static; nó mô tả tính tuỳ chọn của phụ thuộc","JPMS không có khái niệm chia sẻ module kiểu đó; vòng đời class loader là chuyện khác","","Đúng chiều ngược lại — bắt buộc lúc compile, tuỳ chọn lúc runtime"]},{"id":"d-11-6","topicId":11,"versions":[11,17,21],"difficulty":"intermediate","question":"Hai module trên module path cùng chứa các lớp thuộc package javax.annotation. Điều gì xảy ra?","choices":["Module nạp trước sẽ thắng, giống hành vi của classpath","JVM từ chối khởi động vì split package không được phép giữa các module","Cả hai cùng hoạt động, class được phân giải theo module đang requires","Chỉ cảnh báo lúc khởi động, chương trình vẫn chạy"],"correctAnswer":1,"explanation
