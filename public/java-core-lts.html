":"JPMS cấm tuyệt đối split package: một package chỉ được thuộc về đúng một module, nên bước resolution thất bại và JVM báo lỗi kiểu Package javax.annotation in both module ... and module ... rồi dừng. Đây là rào cản migration phổ biến nhất vì hệ sinh thái cũ có rất nhiều JAR nhỏ cùng đóng góp vào một package. Cách xử lý là gộp/loại bớt JAR, dùng bản đã hợp nhất, hoặc để chúng ở lại classpath vì unnamed module không chịu luật này.","whyWrong":["Đúng là hành vi của classpath, và chính sự âm thầm đó là vấn đề mà JPMS sinh ra để loại bỏ","","Phân giải class trong JPMS gắn với package chứ không cho phép cùng một package tồn tại ở hai module","Đây là lỗi cứng chặn khởi động, không phải cảnh báo"]},{"id":"d-11-7","topicId":11,"versions":[11,17,21],"difficulty":"intermediate","question":"Ứng dụng dùng JAXB chạy tốt trên Java 8. Nâng lên Java 11 thì lỗi NoClassDefFoundError: javax/xml/bind/JAXBException. Cách xử lý đúng là gì?","choices":["Thêm --add-modules java.xml.bind vào lệnh java","Thêm --add-opens java.xml.bind/javax.xml.bind=ALL-UNNAMED","Chuyển JAR ứng dụng từ classpath sang module path","Thêm dependency JAXB (jakarta.xml.bind-api và một implementation) vào build vì module java.xml.bind đã bị xoá khỏi JDK 11"],"correctAnswer":3,"explanation":"JEP 320 xoá hẳn các module Java EE khỏi JDK 11, gồm java.xml.bind, java.activation, java.xml.ws, java.transaction, java.corba và aggregator java.se.ee. Ở Java 9/10 chúng chỉ bị deprecate và còn cứu tạm được bằng --add-modules, nhưng từ Java 11 module không còn tồn tại nên cờ đó vô nghĩa. Cách duy nhất là khai báo JAXB như một dependency bình thường của dự án.","whyWrong":["Cờ này chỉ có tác dụng ở Java 9/10 khi module còn nằm trong JDK; ở Java 11 nó báo module không tồn tại","--add-opens chỉ mở reflection cho module đã có sẵn, không tạo ra module đã bị xoá","Vị trí JAR không tạo lại được các class đã biến mất khỏi JDK",""]},{"id":"d-11-8","topicId":11,"versions":[11,17,21],"difficulty":"advanced","question":"Một thư viện cũ trên classpath cần setAccessible vào field private của java.lang.String và bị chặn trên Java 17. Cấu hình nào đúng?","code":"# Ung dung chay bang: java -cp app.jar:lib/* com.acme.Main\n# Thu vien ben thu ba goi:\n#   Field f = String.class.getDeclaredField(\"value\");\n#   f.setAccessible(true);","choices":["Thêm --illegal-access=permit vào lệnh java","Thêm --add-exports java.base/java.lang=ALL-UNNAMED vào lệnh java","Thêm --add-opens java.base/java.lang=ALL-UNNAMED vào lệnh java","Thêm opens java.base to ALL-UNNAMED vào module-info.java của ứng dụng"],"correctAnswer":2,"explanation":"Deep reflection cần opens, nên cờ đúng là --add-opens với cú pháp module/package=đích, và đích ALL-UNNAMED nghĩa là mọi code nằm trên classpath. --add-exports chỉ mở public API chứ không mở setAccessible. Lưu ý --add-opens là cờ thuần runtime: javac vẫn chấp nhận cờ này nhưng bỏ qua và chỉ cảnh báo '--add-opens has no effect at compile time'; với JAR chạy bằng java -jar có thể ghi attribute Add-Opens vào manifest thay vì bắt người dùng gõ cờ.","whyWrong":["Java 16 (JEP 396) đổi mặc định sang deny và Java 17 (JEP 403) đóng hẳn JDK internals; từ Java 17 cờ --illegal-access không còn tác dụng","--add-exports mở tới mức public API, không cho phép setAccessible trên thành viên private","","Không có cú pháp opens tới ALL-UNNAMED trong module-info, và module-info của ứng dụng cũng không thể mở package của java.base"]},{"id":"d-11-9","topicId":11,"versions":[11,17,21],"difficulty":"advanced","question":"Dự án muốn dùng jlink để dựng runtime image gọn, nhưng nhiều dependency chỉ có Automatic-Module-Name trong manifest chứ chưa có module-info.class. Điều gì xảy ra?","choices":["jlink chạy được vì Automatic-Module-Name đã cung cấp đủ metadata","jlink chạy được nhưng image sẽ chứa toàn bộ JDK","jlink thất bại vì nó không chấp nhận automatic module; phương án thực tế là chỉ jlink phần module JDK rồi chạy ứng dụng trên classpath bên trong image","jlink tự sinh module-info cho các JAR đó bằng cách phân tích bytecode"],"correctAnswer":2,"explanation":"jlink chỉ ghép được các modular JAR nên nó từ chối automatic module, và Automatic-Module-Name chỉ cho một cái tên ổn định chứ không mô tả requires/exports thật. Đây là lý do rất nhiều dự án muốn dùng jlink nhưng không dùng được cho toàn bộ cây phụ thuộc. Cách làm phổ biến là dùng jdeps --print-module-deps để biết cần những module java.* nào, jlink riêng phần JDK đó, rồi vẫn chạy ứng dụng và thư viện trên classpath bên trong image — vẫn thu được phần lớn lợi ích về kích thước.","whyWrong":["Automatic-Module-Name chỉ đặt tên, không khai báo phụ thuộc hay package export nên jlink vẫn không xử lý được","jlink không có chế độ chạy tiếp rồi gộp toàn bộ JDK; nó báo lỗi và dừng","","Công cụ sinh gợi ý module-info là jdeps --generate-module-info và phải chạy thủ công; jlink không tự làm việc đó"]},{"id":"d-12-1","topicId":12,"versions":[11,17,21],"difficulty":"beginner","question":"java.net.http.HttpClient được chuẩn hoá (không còn incubator) từ phiên bản Java nào?","choices":["Java 9, trong package java.net.http","Java 11, sau khi incubate ở Java 9 và 10 dưới package jdk.incubator.http","Java 17, cùng với sealed class","Java 21, cùng với virtual thread"],"correctAnswer":1,"explanation":"API xuất hiện lần đầu ở Java 9 dưới dạng incubator module với package jdk.incubator.http, incubate tiếp ở Java 10, và được chuẩn hoá ở Java 11 qua JEP 321 với package java.net.http. Vì package đổi tên khi chuẩn hoá nên code viết cho bản incubator không chạy được trên Java 11 — đó chính là ý nghĩa của cơ chế incubator: không cam kết tương thích. Java 21 chỉ bổ sung thêm AutoCloseable chứ không phải nơi API ra đời.","whyWrong":["Java 9 có API nhưng ở package jdk.incubator.http, không phải java.net.http, và không được coi là API chuẩn","","Java 17 không giới thiệu HttpClient; lúc đó API đã ổn định được 3 phiên bản","Java 21 chỉ thêm close()/shutdown() cho HttpClient, API đã tồn tại từ Java 11"]},{"id":"d-12-2","topicId":12,"versions":[11,17,21],"difficulty":"beginner","question":"Gọi HttpClient.newHttpClient() rồi send() tới một URL trả về HTTP 302 với header Location. Kết quả nhận được là gì?","code":"HttpClient client = HttpClient.newHttpClient();\nHttpRequest req = HttpRequest.newBuilder(URI.create(\"https://example.com/old\")).build();\nHttpResponse<String> res = client.send(req, HttpResponse.BodyHandlers.ofString());\nSystem.out.println(res.statusCode());","choices":["In ra 200 vì client tự đi theo redirect","Ném IOException vì response không phải 2xx","In ra 302 vì chính sách redirect mặc định là NEVER","In ra 302 nhưng res.body() chứa nội dung của trang đích"],"correctAnswer":2,"explanation":"Chính sách redirect mặc định của HttpClient là Redirect.NEVER, nên client trả về nguyên response 302 kèm header Location mà không đi tiếp. Đây là điểm khác với nhiều thư viện HTTP khác vốn tự đi theo redirect, và là nguyên nhân phổ biến của lỗi 'body rỗng không hiểu vì sao'. Muốn đi theo redirect thì cấu hình followRedirects(Redirect.NORMAL) — NORMAL an toàn hơn ALWAYS vì không đi theo redirect hạ cấp từ HTTPS xuống HTTP.","whyWrong":["Client chỉ tự đi theo redirect khi bạn cấu hình NORMAL hoặc ALWAYS; mặc định là NEVER","Status không thuộc 2xx không hề tạo ra exception; mọi response hợp lệ đều trả về bình thường","","Vì không đi theo redirect nên body là body của chính response 302, thường rỗng hoặc là trang thông báo chuyển hướng"]},{"id":"d-12-3","topicId":12,"versions":[11,17,21],"difficulty":"beginner","question":"Nhận định nào đúng về vòng đời của HttpClient?","choices":["Nó có trạng thái nên mỗi request phải tạo một instance mới, giống HttpURLConnection","Nó bất biến và thread-safe nên nên dùng chung một instance cho toàn ứng dụng","Nó thread-safe nhưng phải gọi reset() giữa các request","Nó chỉ thread-safe khi bạn truyền executor riêng vào builder"],"correctAnswer":1,"explanation":"HttpClient bất biến sau khi build và được thiết kế để nhiều thread gọi send()/sendAsync() đồng thời, nên mô hình đúng là một instance dùng chung, khai báo static final hoặc làm bean singleton. Mỗi instance mang connection pool, selector thread và executor riêng, nên tạo mới cho từng request sẽ vứt bỏ connection đang mở, bắt tay TLS lại từ đầu và mất hoàn toàn lợi ích multiplexing của HTTP/2. Trước Java 21 việc này còn tệ hơn vì không có close() nên tài nguyên chỉ được thu hồi khi GC dọn.","whyWrong":["Chính việc HttpURLConnection có trạng thái và chỉ dùng một lần là một trong những lý do API mới ra đời","","Không có method reset(); cấu hình là bất biến và không có trạng thái nào cần dọn giữa các request","Tính thread-safe không phụ thuộc executor; truyền executor riêng chỉ để kiểm soát pool cho tác vụ bất đồng bộ"]},{"id":"d-12-4","topicId":12,"versions":[11,17,21],"difficulty":"intermediate","question":"Đoạn code sau gọi một endpoint đang lỗi. Điều gì thực sự xảy ra?","code":"client.sendAsync(request, HttpResponse.BodyHandlers.ofString())\n      .thenApply(HttpResponse::body)\n      .thenAccept(System.out::println);\n\nSystem.out.println(\"da gui request\");\n// khong join(), khong get(), khong exceptionally()","choices":["In ra 'da gui request' rồi chương trình ném IOException ra main","sendAsync ném IOException ngay tại chỗ gọi","Chương trình dừng lại chờ response rồi mới in 'da gui request'","In ra 'da gui request', còn lỗi bị nuốt hoàn toàn vì future hoàn tất theo nhánh lỗi mà không ai xử lý"],"correctAnswer":3,"explanation":"sendAsync không ném checked exception mà chuyển lỗi vào CompletableFuture theo nhánh hoàn tất bất thường; các stage thenApply/thenAccept phía sau bị bỏ qua. Vì không ai gọi join()/get() và không có exceptionally()/handle(), ngoại lệ không bao giờ được quan sát nên biến mất không để lại dấu vết trong log — đây là bug thầm lặng rất hay gặp. Quy tắc: mọi chuỗi sendAsync phải kết thúc bằng exceptionally hoặc handle, và nếu join() thì nhớ getCause() vì ngoại lệ gốc bị bọc trong CompletionException.","whyWrong":["Ngoại lệ nằm trong future chứ không lan ra thread gọi; main không thấy gì cả","sendAsync chỉ khởi động request rồi trả về ngay, nó không ném checked exception","sendAsync là bất đồng bộ nên không chặn; dòng println chạy ngay lập tức",""]},{"id":"d-12-5","topicId":12,"versions":[11,17,21],"difficulty":"intermediate","question":"Server trả về HTTP 500 kèm một trang HTML báo lỗi. Đoạn code sau hành xử thế nào?","code":"try {\n    HttpResponse<String> res = client.send(req, HttpResponse.BodyHandlers.ofString());\n    Order order = objectMapper.readValue(res.body(), Order.class);\n    return order;\n} catch (IOException e) {\n    return null;\n}","choices":["Trả về null vì send() ném IOException khi gặp 500","send() trả về bình thường, rồi Jackson ném lỗi parse vì body là HTML chứ không phải JSON","Trả về một Order với mọi field null","send() trả về response với body rỗng vì status không phải 2xx"],"correctAnswer":1,"explanation":"Trong java.net.http, status 4xx/5xx là một response hoàn toàn hợp lệ — send() trả về bình thường và không ném gì cả, khác hẳn trực giác của nhiều người. Body ở đây là HTML nên objectMapper.readValue ném JsonProcessingException, vốn là con của IOException, nên nó bị chính khối catch nuốt mất và method trả về null với thông báo lỗi gốc biến mất. Quy tắc bắt buộc: luôn kiểm tra res.statusCode() trước khi parse, và không gộp lỗi mạng với lỗi parse vào cùng một catch.","whyWrong":["send() chỉ ném IOException khi có sự cố ở tầng mạng hoặc timeout, không phải khi status là 5xx","","Jackson mặc định sẽ thất bại khi gặp HTML chứ không im lặng tạo object rỗng","Body của response 5xx vẫn được đọc đầy đủ; client không lọc body theo status"]},{"id":"d-12-6","topicId":12,"versions":[11,17,21],"difficulty":"intermediate","question":"Chuỗi catch sau có vấn đề gì?","code":"HttpClient client = HttpClient.newBuilder()\n        .connectTimeout(Duration.ofSeconds(2))\n        .build();\nHttpRequest req = HttpRequest.newBuilder(uri)\n        .timeout(Duration.ofSeconds(5))\n        .build();\ntry {\n    client.send(req, HttpResponse.BodyHandlers.ofString());\n} catch (HttpTimeoutException e) {\n    log.warn(\"request qua han\");\n} catch (HttpConnectTimeoutException e) {\n    log.warn(\"khong ket noi duoc\");\n} catch (IOException | InterruptedException e) {\n    log.error(\"loi khac\", e);\n}","choices":["Không có vấn đề gì, hai loại timeout là hai nhánh độc lập","Thiếu catch cho HttpTimeoutException ở cấp connect","Lỗi biên dịch vì HttpConnectTimeoutException là con của HttpTimeoutException nên nhánh của nó không bao giờ tới được","Chạy được nhưng lỗi connect timeout sẽ rơi vào nhánh IOException"],"correctAnswer":2,"explanation":"HttpConnectTimeoutException kế thừa HttpTimeoutException, mà HttpTimeoutException lại kế thừa IOException. Trong Java, bắt lớp cha trước lớp con là lỗi biên dịch vì nhánh con trở thành code không bao giờ chạy tới được, nên đoạn này không compile. Sửa bằng cách đảo thứ tự: HttpConnectTimeoutException trước, rồi HttpTimeoutException, rồi IOException — nguyên tắc chung là catch từ hẹp tới rộng.","whyWrong":["Chúng không độc lập; quan hệ kế thừa giữa hai lớp quyết định thứ tự catch bắt buộc","HttpTimeoutException đã được catch; vấn đề nằm ở thứ tự chứ không phải thiếu nhánh","","Nếu đoạn code compile được thì connect timeout sẽ rơi vào nhánh HttpTimeoutException đứng trước, nhưng thực tế nó không compile được"]},{"id":"d-12-7","topicId":12,"versions":[11,17,21],"difficulty":"intermediate","question":"Không cấu hình gì thêm, HttpClient.newHttpClient() có những mặc định nào?","choices":["HTTP/1.1, connect timeout 30 giây, redirect NORMAL, có cookie manager","HTTP/2 với fallback HTTP/1.1, không giới hạn timeout, redirect NEVER, không lưu cookie","HTTP/2 bắt buộc, request thất bại nếu server chỉ hỗ trợ HTTP/1.1","HTTP/2 với fallback, connect timeout 10 giây, redirect ALWAYS, có cookie manager"],"correctAnswer":1,"explanation":"Mặc định là HTTP_2 nhưng tự động lùi về HTTP/1.1 khi server không hỗ trợ (qua ALPN với HTTPS, qua upgrade với HTTP thường), và bạn kiểm tra phiên bản thực tế bằng response.version(). Quan trọng nhất về mặt vận hành: không có connectTimeout và cũng không có request timeout mặc định, nên request có thể treo rất lâu và làm cạn thread pool của service. Redirect mặc định là NEVER và không có cookie handler — cả hai đều phải bật thủ công.","whyWrong":["Mặc định là HTTP/2 chứ không phải HTTP/1.1, và không có giá trị timeout mặc định nào","","Đặt version HTTP_2 không làm request thất bại với server cũ; client tự thương lượng và lùi về HTTP/1.1","Không có connect timeout mặc định, và redirect mặc định là NEVER chứ không phải ALWAYS"]},{"id":"d-12-8","topicId":12,"versions":[11,17,21],"difficulty":"advanced","question":"Một service chạy Java 17 tạo HttpClient mới trong mỗi lần xử lý message. Sau vài giờ, số thread tăng liên tục rồi service chết. Nguyên nhân và cách sửa đúng nhất?","code":"public void onMessage(Message m) {\n    HttpClient client = HttpClient.newHttpClient();\n    HttpRequest req = HttpRequest.newBuilder(URI.create(m.url())).build();\n    client.send(req, HttpResponse.BodyHandlers.ofString());\n}","choices":["Do BodyHandlers.ofString giữ body trong heap; đổi sang discarding là hết","Do thiếu try-with-resources; trên Java 17 chỉ cần bọc client vào try-with-resources","Do mỗi client có selector thread và executor riêng mà Java 17 chưa có close(); phải chuyển sang dùng chung một instance","Do connection pool không được cấu hình; đặt system property jdk.httpclient.connectionPoolSize là đủ"],"correctAnswer":2,"explanation":"Mỗi HttpClient mang theo connection pool, một selector thread và một executor nội bộ; tạo mới liên tục nghĩa là tích luỹ thread và socket. Trên Java 11–20, HttpClient không implement AutoCloseable và không có close(), nên tài nguyên chỉ được thu hồi khi instance mất tham chiếu và bị GC dọn — quá chậm so với tốc độ tạo mới, dẫn tới OutOfMemoryError kiểu unable to create native thread. Cách sửa duy nhất đúng là dùng chung một instance; từ Java 21 mới có close()/shutdown() để tắt tường minh, nhưng ngay cả khi đó thì dùng chung vẫn là mô hình nên theo.","whyWrong":["BodyHandler chỉ quyết định cách xử lý body, không liên quan tới việc thread tích luỹ","Java 17 chưa có AutoCloseable trên HttpClient nên try-with-resources sẽ không biên dịch được; tính năng đó có từ Java 21","","Kích thước pool không giải quyết vấn đề vì mỗi client tạo pool riêng của nó; gốc rễ là số lượng client"]},{"id":"d-12-9","topicId":12,"versions":[21],"difficulty":"advanced","question":"Trên Java 21, cách nào phù hợp nhất để gọi song song 10.000 endpoint HTTP với code dễ đọc và dễ debug?","code":"// Phuong an A\ntry (var ex = Executors.newVirtualThreadPerTaskExecutor()) {\n    urls.forEach(u -> ex.submit(() -> CLIENT.send(req(u), BodyHandlers.ofString())));\n}\n\n// Phuong an B\nvar pool = Executors.newFixedThreadPool(10_000);   // 10.000 platform thread\n\n// Phuong an C\nsynchronized (lock) { CLIENT.send(req, BodyHandlers.ofString()); }","choices":["Phương án B, vì thread pool cố định kiểm soát tài nguyên tốt hơn","Phương án C, vì đồng bộ hoá giúp tránh tranh chấp connection pool","Phương án A, vì virtual thread bị tháo khỏi carrier khi chặn ở send() nên blocking tuần tự vẫn scale","Không phương án nào; bắt buộc phải dùng sendAsync với CompletableFuture"],"correctAnswer":2,"explanation":"Virtual thread rẻ tới mức tạo hàng chục nghìn cái là bình thường, và khi thread chặn tại send() thì JVM tháo nó khỏi carrier thread nên carrier tiếp tục phục vụ tác vụ khác. Nhờ đó code blocking tuần tự giữ được stack trace đầy đủ và try/catch tự nhiên mà vẫn đạt mức song song trước đây phải dùng chuỗi CompletableFuture. Lưu ý thêm: ở JDK 21, chặn bên trong khối synchronized sẽ pin virtual thread vào carrier và làm mất lợi ích scale, nên dùng ReentrantLock nếu thực sự cần khoá.","whyWrong":["10.000 platform thread tiêu tốn rất nhiều bộ nhớ stack và gây chi phí context switch lớn; đây chính là giới hạn mà virtual thread sinh ra để phá bỏ","Đồng bộ hoá biến lời gọi song song thành tuần tự, và ở JDK 21 việc chặn trong synchronized còn pin virtual thread vào carrier","","sendAsync vẫn hợp lệ nhưng không bắt buộc trên Java 21; nó đánh đổi bằng code khó đọc và stack trace bị đứt đoạn"]},{"id":"d-13-1","topicId":13,"versions":[11,17,21],"difficulty":"beginner","question":"Đoạn code sau cho kết quả gì?","code":"var count = 10;\ncount = \"mười\";\nSystem.out.println(count);","choices":["In ra mười","Lỗi biên dịch: count đã được suy ra kiểu int nên không gán được String","Chạy được vì var cho phép biến đổi kiểu lúc runtime","Lỗi lúc chạy: ClassCastException"],"correctAnswer":1,"explanation":"Lỗi biên dịch. var là suy luận kiểu lúc biên dịch chứ không phải dynamic typing: compiler nhìn biểu thức khởi tạo 10, suy ra int, rồi gắn cố định kiểu đó cho biến trong suốt vòng đời của nó. Từ đó trở đi biến bị kiểm tra kiểu chặt chẽ y hệt như khi bạn viết int count = 10. Bytecode sinh ra cũng giống hệt, nên var không hề mang lại chi phí hay sự linh hoạt nào lúc chạy.","whyWrong":["Điều này chỉ đúng với ngôn ngữ động như JavaScript hay Python; Java vẫn kiểm tra kiểu đầy đủ lúc biên dịch.","","var không tạo ra dynamic typing: kiểu được quyết định xong lúc biên dịch và không bao giờ thay đổi lúc chạy.","Lỗi bị bắt ngay lúc biên dịch nên chương trình không bao giờ chạy tới mức có thể ném ClassCastException."]},{"id":"d-13-2","topicId":13,"versions":[11,17,21],"difficulty":"beginner","question":"Trường hợp nào dưới đây dùng var là HỢP LỆ?","choices":["Field của class: private var name = \"abc\";","Tham số method: void process(var input) { }","Biến local có khởi tạo: var list = new ArrayList<String>();","Kiểu trả về của method: var findUser(long id) { ... }"],"correctAnswer":2,"explanation":"Chỉ biến local có biểu thức khởi tạo mới dùng được var; các vị trí hợp lệ khác cũng đều thuộc nhóm này: biến chỉ số của vòng for, biến của for-each và biến resource trong try-with-resources. Field, tham số method, tham số constructor, kiểu trả về và tham số của khối catch đều bị cấm. Lý do thống nhất là những chỗ đó tạo thành API hoặc giao diện của một thành phần, nơi kiểu cần được viết ra rõ ràng và ổn định — và phần lớn trong số đó cũng không có biểu thức nào để suy kiểu từ đó.","whyWrong":["Field là một phần giao diện của class và có thể được truy cập từ nơi khác, nên Java không cho phép suy kiểu ở đây.","Tham số method thuộc về chữ ký, tức là hợp đồng công khai; ngoài ra nó không có biểu thức khởi tạo để compiler suy kiểu.","","Kiểu trả về là phần quan trọng nhất của chữ ký method và không thể suy từ một biểu thức duy nhất khi method có nhiều câu lệnh return."]},{"id":"d-13-3","topicId":13,"versions":[11,17,21],"difficulty":"beginner","question":"Sau khi biên dịch, var x = 10; khác gì so với int x = 10;?","choices":["Không khác gì đáng kể: var chỉ là suy luận kiểu lúc biên dịch, bytecode sinh ra là như nhau","var sinh ra biến kiểu Object và JVM tự ép kiểu mỗi lần sử dụng","var chậm hơn một chút vì JVM phải xác định kiểu khi chạy","var khiến biến được lưu trên heap thay vì trong stack frame"],"correctAnswer":0,"explanation":"Không khác gì: compiler suy ra int từ biểu thức khởi tạo rồi sinh ra đúng cùng bytecode như khi bạn viết kiểu tường minh (khác biệt duy nhất có thể có nằm ở bảng debug tuỳ chọn ghi tên biến). Vì thế chi phí runtime của var đúng bằng không — không có kiểm tra kiểu lúc chạy, không boxing, không reflection. Toàn bộ đánh đổi của var nằm ở khả năng đọc code của con người chứ không nằm ở hiệu năng, và đây chính là điểm người phỏng vấn muốn kiểm tra.","whyWrong":["","Nếu var suy ra Object thì bạn sẽ phải ép kiểu tường minh mỗi lần dùng; thực tế var giữ đúng kiểu cụ thể nhất mà compiler suy được.","JVM không làm gì thêm cả: mọi việc suy kiểu diễn ra lúc biên dịch nên không có chi phí runtime nào.","Vị trí lưu biến do phạm vi và kiểu quyết định, hoàn toàn không liên quan tới việc bạn viết var hay viết kiểu ra."]},{"id":"d-13-4","topicId":13,"versions":[11,17,21],"difficulty":"intermediate","question":"Đoạn code sau có vấn đề gì?","code":"var list = new ArrayList<>();\nlist.add(\"hello\");\nString s = list.get(0);\nSystem.out.println(s);","choices":["Chạy bình thường và in ra hello","Lỗi biên dịch ở dòng 3: list được suy ra ArrayList<Object> nên get(0) trả về Object","Lỗi biên dịch ở dòng 1: không dùng được cú pháp diamond cùng với var","Lỗi lúc chạy: ClassCastException khi gán vào String"],"correctAnswer":1,"explanation":"Lỗi biên dịch ở dòng gán vào String. Cú pháp diamond cần một kiểu đích để suy ra tham số generic, nhưng khi vế trái là var thì không có kiểu đích nào cả, nên compiler lùi về ràng buộc yếu nhất và suy ra ArrayList<Object>. Vì thế add(\"hello\") vẫn hợp lệ (String là Object) nhưng get(0) trả về Object và không gán thẳng vào String được. Quy tắc thực hành: khi dùng var thì phải ghi tham số generic ở vế phải, tức new ArrayList<String>(). Bẫy tương tự với var l = List.of(); cũng cho List<Object>.","whyWrong":["Code không biên dịch được nên không chạy tới bước in ra; kiểu phần tử đã bị suy thành Object ngay từ dòng đầu.","","Kết hợp var với diamond là hợp lệ về cú pháp và biên dịch được ở dòng đầu; vấn đề nằm ở kiểu được suy ra chứ không phải ở tính hợp lệ.","Đây là lỗi kiểu tĩnh nên compiler bắt được ngay; không có phép ép kiểu ngầm nào để phải chờ tới runtime."]},{"id":"d-13-5","topicId":13,"versions":[11,17,21],"difficulty":"intermediate","question":"Trong bốn dòng khai báo dưới đây, dòng nào biên dịch được?","code":"var a = (Runnable) () -> System.out.println(\"hi\");\nvar b = () -> System.out.println(\"hi\");\nvar c = null;\nvar d = {1, 2, 3};","choices":["a và b","a, b và d","Không dòng nào","Chỉ dòng khai báo a"],"correctAnswer":3,"explanation":"Chỉ dòng a hợp lệ. Lambda và method reference là poly expression: bản thân chúng không mang kiểu riêng mà nhận kiểu từ ngữ cảnh đích, mà ở đây ngữ cảnh đích lại chính là thứ var đang cần suy ra — nên dòng b bị từ chối. Phép ép kiểu (Runnable) ở dòng a cung cấp sẵn kiểu đích nên biểu thức trở thành một biểu thức độc lập và var suy ra được Runnable. Dòng c sai vì kiểu của null là kiểu null đặc biệt, không phải kiểu viết ra được; dòng d sai vì cú pháp khởi tạo mảng rút gọn cũng không có kiểu độc lập, phải viết new int[]{1, 2, 3}.","whyWrong":["Dòng b là lambda trần, không có ngữ cảnh đích nào để suy ra functional interface tương ứng, nên compiler từ chối.","Ngoài lambda trần, cú pháp {1, 2, 3} cũng không có kiểu độc lập; phải viết new int[]{1, 2, 3} thì var mới suy được.","Dòng a hoàn toàn hợp lệ vì phép ép kiểu (Runnable) đã cung cấp kiểu đích cho lambda.",""]},{"id":"d-13-6","topicId":13,"versions":[11,17,21],"difficulty":"intermediate","question":"Đoạn code sau cho kết quả gì?","code":"var helper = new Object() {\n    int twice(int n) { return n * 2; }\n};\nSystem.out.println(helper.twice(21));","choices":["Lỗi biên dịch: kiểu suy ra là Object nên không nhìn thấy method twice","42","Lỗi biên dịch: var không dùng được với anonymous class","Chạy được nhưng phải ép kiểu trước khi gọi twice"],"correctAnswer":1,"explanation":"In ra 42. var suy ra kiểu của chính anonymous class đó — một kiểu không có tên nên bạn không có cách nào viết nó ra trong phần khai báo — vì thế method twice vẫn nằm trong tầm nhìn. Nếu khai báo Object helper = ... thì method biến mất và code không biên dịch được. Đây là một trong số ít trường hợp var làm được điều mà kiểu tường minh không làm được; cơ chế tương tự cũng áp dụng cho intersection type và capture của wildcard sinh ra từ biểu thức.","whyWrong":["Kiểu suy ra không phải Object mà là kiểu của anonymous class; chỉ khi bạn tự viết Object ở vế trái thì method mới bị che khuất.","","var hoàn toàn dùng được với anonymous class, và đây chính là một trong những trường hợp nó có giá trị riêng.","Không cần ép kiểu, và thực tế cũng không ép được vì kiểu anonymous class không có tên để viết ra."]},{"id":"d-13-7","topicId":13,"versions":[11,17,21],"difficulty":"intermediate","question":"Dòng khai báo lambda sau có hợp lệ trên Java 11 trở lên không?","code":"BiFunction<Integer, Integer, Integer> f = (var a, b) -> a + b;","choices":["Hợp lệ, b được suy kiểu ngầm như bình thường","Lỗi biên dịch: trong một danh sách tham số lambda phải đồng nhất — hoặc tất cả dùng var, hoặc tất cả ghi kiểu tường minh, hoặc tất cả bỏ trống","Lỗi biên dịch: var không bao giờ dùng được cho tham số lambda","Hợp lệ khi biên dịch nhưng ném exception lúc chạy"],"correctAnswer":1,"explanation":"Lỗi biên dịch vì trộn lẫn ba dạng khai báo tham số. Java 11 (JEP 323) cho phép (var a, var b) -> a + b, nhưng quy tắc là all-or-nothing: không được trộn var với tham số bỏ trống, cũng không được trộn var với kiểu tường minh. Điều đáng nói khi phỏng vấn là mục đích thật của tính năng này: về mặt kiểu, var ở đây tương đương hoàn toàn với việc bỏ trống, giá trị của nó là tạo chỗ để gắn annotation hoặc final lên tham số lambda, ví dụ (@NonNull var s) -> s.trim(), điều mà trước đó buộc phải ghi kiểu đầy đủ mới làm được.","whyWrong":["Nếu chỉ một tham số dùng var thì compiler từ chối ngay, bất kể việc suy kiểu cho tham số còn lại có khả thi hay không.","","Từ Java 11, var được phép trong tham số lambda; điều bị cấm ở đây là trộn lẫn các dạng khai báo chứ không phải bản thân var.","Đây là lỗi cú pháp và kiểu, bị bắt hoàn toàn lúc biên dịch nên chương trình không bao giờ chạy được."]},{"id":"d-13-8","topicId":13,"versions":[11,17,21],"difficulty":"advanced","question":"Đoạn code sau in ra gì?","code":"var c = 'x';\nvar n = c + 1;\nSystem.out.println(n);","choices":["y","121","x1","Lỗi biên dịch vì n không xác định được kiểu"],"correctAnswer":1,"explanation":"In ra 121. var chỉ nhận lấy kiểu của biểu thức khởi tạo, và biểu thức char + int có kiểu int theo quy tắc binary numeric promotion vốn có từ đầu của Java: char được nâng lên int (mã của 'x' là 120) rồi cộng 1 thành 121. var không hề 'giữ nguyên kiểu char' như nhiều người tưởng. Muốn in ra ký tự thì phải ép kiểu tường minh: System.out.println((char)(c + 1)). Bài học chung là var không thay đổi bất kỳ quy tắc kiểu nào của Java, nó chỉ ghi lại kết quả của những quy tắc đó.","whyWrong":["Muốn ra ký tự 'y' thì phải ép kiểu (char)(c + 1); bản thân phép cộng đã nâng char lên int.","","Phép nối chuỗi chỉ xảy ra khi có ít nhất một toán hạng là String; ở đây cả hai đều là số nên đây là phép cộng số học.","Kiểu của biểu thức hoàn toàn xác định được: char + int cho int, nên var suy kiểu không gặp trở ngại nào."]},{"id":"d-13-9","topicId":13,"versions":[11,17,21],"difficulty":"advanced","question":"Viết var cache = new HashMap<String, User>(); thay vì Map<String, User> cache = new HashMap<>(); có nhược điểm gì?","choices":["var khiến generic bị xoá nên cache trở thành raw type và mất kiểm tra kiểu","var làm chậm lúc chạy vì JVM phải xác định kiểu của biến khi truy cập","Biến được suy ra kiểu cụ thể HashMap<String, User> chứ không phải Map, nên code phía sau có thể vô tình phụ thuộc vào API riêng của HashMap và việc đổi implementation về sau trở nên khó hơn","Không dùng được var khi generic có từ hai tham số kiểu trở lên"],"correctAnswer":2,"explanation":"var luôn suy ra kiểu cụ thể nhất của biểu thức khởi tạo, nên biến bị khoá vào implementation thay vì vào interface. Về mặt biên dịch thì hoàn toàn hợp lệ, nhưng ta mất đi một lớp trừu tượng: code phía sau có thể gọi method chỉ có ở HashMap, và khi cần đổi sang LinkedHashMap hay ConcurrentHashMap thì việc đổi không còn gói gọn ở một dòng. Quy tắc thực hành là dùng kiểu tường minh khi bạn cố tình muốn một kiểu rộng hơn biểu thức — Map thay vì HashMap, hay long thay vì int — và để dành var cho những biến sống ngắn mà kiểu đã hiển nhiên ngay ở vế phải.","whyWrong":["Tham số generic được ghi đầy đủ ở vế phải nên kiểu suy ra là HashMap<String, User> có generic đầy đủ, không phải raw type.","var không có chi phí runtime nào: mọi việc suy kiểu xảy ra lúc biên dịch và bytecode sinh ra giống hệt bản viết kiểu tường minh.","","var không có giới hạn nào về số tham số kiểu; nó suy được mọi kiểu generic mà biểu thức khởi tạo mang theo."]},{"id":"d-14-1","topicId":14,"versions":[17,21],"difficulty":"beginner","question":"Đoạn code sau in ra gì?","code":"record User(String name, int age) {}\n\npublic static void main(String[] args) {\n    User u = new User(\"An\", 30);\n    System.out.println(u.getName());\n}","choices":["In ra An","Lỗi biên dịch vì record không sinh method getName()","In ra null vì getName() được sinh nhưng chưa gán","Lỗi lúc chạy: NoSuchMethodError"],"correctAnswer":1,"explanation":"Record sinh accessor trùng tên component, tức là name() chứ không phải getName(), nên gọi getName() là lỗi biên dịch ngay. Đây là lựa chọn có chủ đích: record mô tả dữ liệu chứ không tuân theo quy ước JavaBeans. Hệ quả thực tế là mọi thư viện phản chiếu theo quy ước getter cũ (một số expression language, BeanUtils, mapper cũ) sẽ không đọc được record.","whyWrong":["Method getName() không hề tồn tại nên không có gì để in","","Không có method nào tên getName() được sinh ra; lỗi xảy ra ở bước biên dịch chứ không phải giá trị null","Lỗi bị bắt ngay lúc biên dịch, chương trình không bao giờ chạy tới lúc ném NoSuchMethodError"]},{"id":"d-14-2","topicId":14,"versions":[17,21],"difficulty":"beginner","question":"Phát biểu nào ĐÚNG về khả năng kế thừa của record?","choices":["Record extends được một class khác nhưng không implements được interface","Record vừa extends class vừa implements interface được, giống class thường","Record chỉ extends được class abstract, không extends được class thường","Record không extends được class nào nhưng implements được nhiều interface"],"correctAnswer":3,"explanation":"Mọi record ngầm kế thừa java.lang.Record nên slot class cha đã bị chiếm, vì vậy không thể extends class nào khác. Ngược lại, record implements bao nhiêu interface tuỳ ý — rất hay dùng với Comparable hoặc với một sealed interface trong mô hình dữ liệu. Record cũng ngầm final nên bản thân nó không thể bị kế thừa.","whyWrong":["Ngược hoàn toàn: không extends được class, nhưng implements interface thì thoải mái","Record không extends được class nào vì đã ngầm extends java.lang.Record","Tính abstract hay không của class cha không liên quan; record không extends được bất kỳ class nào",""]},{"id":"d-14-3","topicId":14,"versions":[17,21],"difficulty":"beginner","question":"Khai báo nào bên trong thân một record sẽ gây LỖI BIÊN DỊCH?","code":"record Point(int x, int y) {\n    static final Point ORIGIN = new Point(0, 0);   // (A)\n    private int cachedHash;                        // (B)\n    static Point of(int a, int b) { return new Point(a, b); }  // (C)\n    double length() { return Math.sqrt(x * x + y * y); }       // (D)\n}","choices":["(A) — record không được có static field","(B) — record không được khai báo field instance ngoài các component","(C) — record không được có static method","(D) — record không được có instance method ngoài accessor"],"correctAnswer":1,"explanation":"Record cấm khai báo thêm field instance vì toàn bộ state phải nằm ở header; đây là điều kiện để giữ bất biến 'dựng lại từ các accessor thì bằng object gốc', thứ mà equals, serialization và record pattern đều dựa vào. Static field, static method và instance method thường đều hoàn toàn hợp lệ. Hệ quả thực tế: không thể cache hashCode trong một field như cách String làm.","whyWrong":["Static field được phép vì nó thuộc về class chứ không phải state của từng instance","","Static method hoàn toàn hợp lệ, static factory là mẫu rất hay dùng với record","Record được phép có instance method tuỳ ý, chỉ bị cấm thêm field instance"]},{"id":"d-14-4","topicId":14,"versions":[17,21],"difficulty":"intermediate","question":"Đoạn code sau in ra gì?","code":"record Money(String currency, long amount) {\n    Money {\n        if (amount < 0) throw new IllegalArgumentException(\"negative\");\n        currency = currency.toUpperCase();\n    }\n}\n\npublic static void main(String[] args) {\n    System.out.println(new Money(\"usd\", 10));\n}","choices":["Money[currency=USD, amount=10]","Money[currency=usd, amount=10]","Lỗi biên dịch vì compact constructor không được gán lại tham số","Lỗi biên dịch vì compact constructor thiếu phép gán this.currency và this.amount"],"correctAnswer":0,"explanation":"Trong compact constructor, currency là biến tham số; compiler chèn phép gán this.currency = currency vào CUỐI thân hàm, nên giá trị đã chuẩn hoá mới là giá trị được lưu. Đó chính là cơ chế để vừa validate vừa normalize ở một chỗ duy nhất. Ngược lại, nếu bạn viết this.currency = ... trong compact constructor thì mới là lỗi biên dịch, vì field final đó đã có phép gán ngầm phía sau.","whyWrong":["","Giá trị lưu vào field là giá trị của tham số tại thời điểm cuối thân hàm, tức là đã được toUpperCase()","Gán lại tham số chính là cách dùng đúng của compact constructor; điều bị cấm là gán vào this.field","Phép gán field do compiler tự chèn, viết tay mới gây lỗi"]},{"id":"d-14-5","topicId":14,"versions":[17,21],"difficulty":"intermediate","question":"Đoạn code sau in ra gì?","code":"record Team(String name, List<String> members) {}\n\npublic static void main(String[] args) {\n    List<String> src = new ArrayList<>(List.of(\"An\"));\n    Team t = new Team(\"A\", src);\n    src.add(\"Binh\");\n    System.out.println(t.members().size());\n}","choices":["1 — record sao chép collection khi dựng","Ném UnsupportedOperationException vì list trong record là bất biến","Lỗi biên dịch vì component của record phải là kiểu bất biến","2 — record chỉ giữ tham chiếu, nội dung list vẫn sửa được từ bên ngoài"],"correctAnswer":3,"explanation":"Kết quả là 2: record chỉ bất biến nông, field final khoá tham chiếu chứ không khoá nội dung của đối tượng được trỏ tới. Người gọi vẫn giữ tham chiếu src nên mọi thay đổi trên đó phản chiếu vào record. Muốn bất biến thật thì phải copy phòng vệ trong compact constructor, ví dụ members = List.copyOf(members), và nhớ rằng List.copyOf ném NullPointerException nếu list chứa phần tử null.","whyWrong":["Record không tự sao chép bất cứ thứ gì; canonical constructor chỉ gán tham chiếu","Không có ngoại lệ nào được ném; src là ArrayList bình thường và add thành công","Component của record được phép là bất kỳ kiểu nào, kể cả kiểu có thể thay đổi",""]},{"id":"d-14-6","topicId":14,"versions":[17,21],"difficulty":"intermediate","question":"Đoạn code sau in ra gì?","code":"record Buf(byte[] data) {}\n\npublic static void main(String[] args) {\n    Buf a = new Buf(new byte[]{1, 2});\n    Buf b = new Buf(new byte[]{1, 2});\n    System.out.println(a.equals(b));\n}","choices":["true — equals sinh sẵn so sánh nội dung của mọi component","false — với component kiểu tham chiếu, equals dùng Objects.equals, mà mảng so theo identity","Lỗi biên dịch vì record không nhận component kiểu mảng","true vì hai mảng có cùng độ dài và cùng phần tử nên hashCode trùng nhau"],"correctAnswer":1,"explanation":"equals sinh sẵn của record so component kiểu tham chiếu bằng Objects.equals, và Object.equals của mảng chính là so sánh identity, nên hai mảng khác instance luôn cho false. hashCode cũng theo identity và toString in ra dạng [B@1b6d3586. Quy tắc thực tế: tránh mảng làm component; nếu buộc phải dùng thì override cả equals, hashCode, toString bằng Arrays.equals/hashCode/toString, hoặc đổi sang List.","whyWrong":["equals sinh sẵn không có xử lý đặc biệt nào cho mảng, nó chỉ gọi Objects.equals","","Component kiểu mảng hoàn toàn hợp lệ về cú pháp, vấn đề nằm ở ngữ nghĩa equals","hashCode của mảng cũng theo identity nên hai mảng nội dung giống nhau vẫn cho giá trị khác nhau"]},{"id":"d-14-7","topicId":14,"versions":[17,21],"difficulty":"intermediate","question":"Vì sao không thể dùng record làm JPA entity?","choices":["Vì record không được phép mang annotation nên không đặt @Entity lên nó được","Vì record không implements Serializable nên không lưu xuống database được","Vì JPA cần constructor không tham số, cần sửa field sau khi dựng, và cần kế thừa entity class để tạo proxy lazy — record không đáp ứng cả ba","Vì record không có getter theo quy ước JavaBeans nên Hibernate không đọc được dữ liệu"],"correctAnswer":2,"explanation":"Có ba rào cản độc lập: record không thể có constructor không tham số, field của nó là final nên provider không nạp và không dirty-check được, và record ngầm final nên Hibernate không dựng được proxy kế thừa cho lazy loading. Ngược lại record rất hợp làm projection: JPQL constructor expression select new com.app.UserDto(u.id, u.name) gọi thẳng canonical constructor. Cách nhớ: entity có định danh và vòng đời, record mang giá trị.","whyWrong":["Record và các component của nó đều nhận annotation bình thường; vấn đề không nằm ở annotation","Serializable không phải điều kiện của JPA entity, và record vẫn implements Serializable được nếu muốn","","Hibernate truy cập được qua field access; đây không phải rào cản chính, ba lý do ở trên mới là nguyên nhân thật"]},{"id":"d-14-8","topicId":14,"versions":[17,21],"difficulty":"advanced","question":"Đoạn code sau in ra gì?","code":"record P(double v) {}\n\npublic static void main(String[] args) {\n    System.out.println(new P(Double.NaN).equals(new P(Double.NaN)));\n    System.out.println(new P(0.0).equals(new P(-0.0)));\n}","choices":["false rồi true — giống hệt kết quả của toán tử == trên double","false rồi false","true rồi false","true rồi true"],"correctAnswer":2,"explanation":"equals sinh sẵn của record so component kiểu nguyên thuỷ theo phương thức so sánh của lớp bao tương ứng, tức Double.compare cho double, chứ không theo toán tử ==. Double.compare(NaN, NaN) trả 0 nên hai record NaN bằng nhau; Double.compare(0.0, -0.0) khác 0 nên hai record đó không bằng nhau. Quy ước này bắt buộc để giữ bất biến 'dựng lại record từ các accessor thì bằng object gốc' và để equals nhất quán với hashCode.","whyWrong":["Đó là kết quả của toán tử ==, nhưng record không dùng == cho double","Vế thứ nhất sai: NaN so với NaN qua Double.compare cho kết quả bằng nhau","","Vế thứ hai sai: +0.0 và -0.0 phân biệt được bằng Double.compare nên hai record đó không bằng nhau"]},{"id":"d-14-9","topicId":14,"versions":[17,21],"difficulty":"advanced","question":"Về Java serialization của một record implements Serializable, phát biểu nào ĐÚNG?","choices":["Deserialization dựng record mà bỏ qua constructor, giống hệt class thường, nên validation trong compact constructor không chạy","Record không serialize được vì không có constructor không tham số","Record bắt buộc phải khai báo serialVersionUID, nếu không sẽ ném InvalidClassException","Deserialization đi qua canonical constructor nên validation vẫn chạy; writeObject/readObject khai báo trong record bị bỏ qua"],"correctAnswer":3,"explanation":"Đây là khác biệt quan trọng nhất: với class thường, cơ chế deserialization dựng object mà không gọi constructor nên mọi kiểm tra hợp lệ bị vô hiệu — nguồn của nhiều lỗ hổng kinh điển. Record thì bắt buộc đi qua canonical constructor, nên dữ liệu bẩn bị chặn ngay. Đổi lại, các hook cũ writeObject/readObject/readObjectNoData không còn tác dụng với record, còn writeReplace/readResolve thì vẫn dùng được; serialVersionUID ngầm định của record là 0L.","whyWrong":["Ngược lại: chính việc đi qua canonical constructor là điểm khác biệt lớn nhất của record","Record serialize được bình thường miễn là implements Serializable; cơ chế dựng lại dùng canonical constructor","serialVersionUID ngầm định của record là 0L, không bắt buộc khai báo",""]},{"id":"d-15-1","topicId":15,"versions":[17,21],"difficulty":"beginner","question":"Một class kế thừa trực tiếp từ sealed class BẮT BUỘC phải khai báo thế nào?","choices":["Không cần gì, mặc định nó được coi là final","Bắt buộc là final, vì mục đích của sealed là chặn kế thừa","Bắt buộc chọn một trong ba: final, sealed hoặc non-sealed","Bắt buộc là public để nằm được trong mệnh đề permits"],"correctAnswer":2,"explanation":"Ngôn ngữ ép mỗi kiểu con phải tuyên bố rõ nhánh của mình sẽ đóng hẳn (final), tiếp tục đóng theo một danh sách khác (sealed), hay mở tự do (non-sealed); không khai báo là lỗi biên dịch chứ không có mặc định. Đây là điều kiện để compiler suy ra trọn vẹn tập biến thể và kiểm tra exhaustiveness của switch. Record ngầm final nên không cần viết thêm modifier; enum cũng vậy — enum ngầm final, hoặc ngầm sealed nếu có constant mang thân class, nên cả hai đều hợp lệ khi implements một sealed interface mà không khai báo gì thêm.","whyWrong":["Java không đặt mặc định ở đây; thiếu modifier là lỗi biên dịch","final chỉ là một trong ba lựa chọn; sealed và non-sealed cũng hợp lệ","","Mức truy cập không liên quan; kiểu con package-private vẫn nằm trong permits được"]},{"id":"d-15-2","topicId":15,"versions":[17,21],"difficulty":"beginner","question":"Vì sao một record cài đặt sealed interface KHÔNG cần khai báo thêm final, sealed hay non-sealed?","choices":["Vì record được miễn trừ khỏi mọi quy tắc của sealed","Vì record đã ngầm final nên yêu cầu 'phải chọn một trong ba' đã được thoả mãn sẵn","Vì record ngầm là non-sealed","Vì sealed interface không áp đặt ràng buộc nào lên kiểu con, chỉ sealed class mới áp đặt"],"correctAnswer":1,"explanation":"Record luôn ngầm final, nên nó đã tự động thoả mãn yêu cầu mỗi kiểu con phải là final, sealed hoặc non-sealed. Chính sự khớp nhau tự nhiên này khiến cặp sealed interface cộng các record trở thành cách mô hình hoá algebraic data type chuẩn mực trong Java hiện đại. Ngược lại, một class thường mà quên khai báo sẽ bị compiler báo lỗi 'sealed, non-sealed or final modifiers expected'.","whyWrong":["Record vẫn tuân thủ đầy đủ quy tắc của sealed, chỉ là nó thoả mãn sẵn một trong số đó","","Record ngầm final chứ không phải non-sealed; non-sealed nghĩa là mở cho kế thừa, ngược hẳn","Sealed interface áp đặt ràng buộc lên kiểu con y hệt sealed class"]},{"id":"d-15-3","topicId":15,"versions":[17,21],"difficulty":"beginner","question":"Ứng dụng chạy trên classpath (unnamed module). Các kiểu con được permits phải nằm ở đâu?","choices":["Ở bất kỳ đâu, miễn là có tên trong mệnh đề permits","Trong cùng package với kiểu sealed","Trong cùng file nguồn với kiểu sealed","Trong cùng JAR với kiểu sealed"],"correctAnswer":1,"explanation":"Trên unnamed module (tức chạy classpath như phần lớn ứng dụng Spring Boot hiện nay), mọi kiểu con được cho phép phải nằm cùng package với kiểu sealed; nếu kiểu sealed nằm trong một named module thì phạm vi nới ra thành cùng module. Lý do là cam kết 'tập biến thể đóng' chỉ có giá trị khi compiler và JVM cùng kiểm chứng được, và ràng buộc này được ghi vào thuộc tính PermittedSubclasses của class file. Đặt sealed interface và các implementation ở hai package khác nhau trên classpath sẽ không biên dịch được.","whyWrong":["Có tên trong permits là điều kiện cần chứ chưa đủ; vẫn phải thoả ràng buộc phạm vi","","Cùng file nguồn là điều kiện để được BỎ mệnh đề permits, không phải yêu cầu bắt buộc về vị trí","Ranh giới được kiểm tra là package hoặc module, không phải JAR"]},{"id":"d-15-4","topicId":15,"versions":[17,21],"difficulty":"intermediate","question":"Đoạn code sau có vấn đề gì?","code":"public sealed interface Shape permits Circle, Box {}\n\npublic record Circle(double r) implements Shape {}\n\npublic class Box implements Shape {\n    double w, h;\n}","choices":["Không có vấn đề gì, code biên dịch bình thường","Lỗi biên dịch: sealed interface chỉ được permits các record","Lỗi biên dịch: Box nằm trong permits nên phải khai báo final, sealed hoặc non-sealed","Lỗi lúc chạy khi nạp class Box vì thiếu thuộc tính PermittedSubclasses"],"correctAnswer":2,"explanation":"Box là kiểu con trực tiếp của một sealed interface nên bắt buộc phải tuyên bố nhánh của nó: final nếu đóng hẳn, sealed nếu tiếp tục đóng theo danh sách khác, non-sealed nếu mở tự do. Không khai báo gì là lỗi biên dịch chứ không có mặc định. Circle thì hợp lệ vì record đã ngầm final. Lý do sâu xa: compiler chỉ suy ra được trọn tập biến thể khi mọi nhánh đều tuyên bố rõ nó có đóng hay không.","whyWrong":["Code không biên dịch được vì Box thiếu modifier bắt buộc","Sealed interface permits được cả class thường lẫn interface, miễn là kiểu con khai báo đúng modifier","","Lỗi bị bắt ngay lúc biên dịch, không bao giờ đi tới bước nạp class"]},{"id":"d-15-5","topicId":15,"versions":[21],"difficulty":"intermediate","question":"Với hệ thống kiểu sau, switch trong area() có biên dịch được không (Java 21)?","code":"sealed interface Shape permits Circle, Poly {}\nrecord Circle(double r) implements Shape {}\nnon-sealed class Poly implements Shape {}\nclass Hexagon extends Poly {}          // hợp lệ vì Poly là non-sealed\n\nstatic String area(Shape s) {\n    return switch (s) {\n        case Circle c -> \"circle\";\n        case Poly p   -> \"poly\";\n    };\n}","choices":["Không — vì Poly là non-sealed nên tập kiểu con là mở, switch buộc phải có default","Có — case Poly bao trọn mọi kiểu con của Poly nên switch vẫn đầy đủ","Không — switch trên interface luôn bắt buộc có default","Có, nhưng sẽ ném MatchException lúc chạy nếu truyền vào một Hexagon"],"correctAnswer":1,"explanation":"Một case với type pattern bao trọn kiểu đó và mọi kiểu con của nó, nên case Poly p đã phủ cả Hexagon lẫn mọi lớp con tương lai; kết hợp với case Circle thì switch phủ hết tập biến thể trực tiếp của Shape và compiler chấp nhận không cần default. Đây chính là điểm cân bằng của non-sealed: bạn mở một nhánh cho mở rộng mà không đánh mất kiểm tra exhaustiveness ở các nhánh còn lại. Truyền Hexagon vào sẽ rơi vào case Poly và trả về 'poly'.","whyWrong":["Exhaustiveness xét theo tập kiểu con TRỰC TIẾP; case Poly đã phủ toàn bộ nhánh đó","","Từ Java 21, switch trên kiểu sealed liệt kê đủ biến thể thì không cần default","Hexagon khớp case Poly nên không có giá trị nào lọt lưới, không có MatchException"]},{"id":"d-15-6","topicId":15,"versions":[17,21],"difficulty":"intermediate","question":"Trước Java 17, người ta đóng một abstract class bằng cách để constructor ở mức package-private. So với sealed, mẹo đó THIẾU điều gì quan trọng nhất?","choices":["Nó không cho compiler biết tập biến thể nên không có kiểm tra exhaustiveness của switch","Nó không chặn được kế thừa từ package khác","Nó làm chậm chương trình vì phải kiểm tra quyền truy cập lúc chạy","Nó không tương thích với reflection nên framework không dùng được"],"correctAnswer":0,"explanation":"Mẹo constructor package-private thực sự chặn được kế thừa từ ngoài package, nhưng compiler không hề biết danh sách biến thể là gì, nên mọi switch vẫn phải có default và không ai nhắc bạn khi quên xử lý một biến thể mới. Sealed đưa danh sách đó vào chính khai báo kiểu, ghi vào thuộc tính PermittedSubclasses của class file và được JVM kiểm chứng lúc nạp class. Hai điểm yếu còn lại của mẹo cũ: ý định không hiện ra trong API, và mọi biến thể bị ép nằm cùng package.","whyWrong":["","Mẹo này chặn được thật, vì class ngoài package không gọi được super(); đó không phải điểm thiếu","Kiểm tra quyền truy cập xảy ra lúc biên dịch và lúc liên kết, không tạo chi phí đáng kể lúc chạy","Reflection vẫn hoạt động bình thường; vấn đề là không có API nào cho biết tập biến thể"]},{"id":"d-15-7","topicId":15,"versions":[17,21],"difficulty":"intermediate","question":"Đoạn code sau (một file nguồn duy nhất) có biên dịch được không?","code":"sealed interface Result {\n    record Ok(String value) implements Result {}\n    record Err(int code) implements Result {}\n}","choices":["Không — sealed bắt buộc phải có mệnh đề permits","Không — record không được khai báo lồng bên trong interface","Có, nhưng chỉ khi thêm modifier final cho Ok và Err","Có — khi mọi kiểu con nằm cùng file nguồn, compiler tự suy ra danh sách permits"],"correctAnswer":3,"explanation":"Mệnh đề permits có thể bỏ khi mọi kiểu con được khai báo trong cùng file nguồn với kiểu sealed; khi đó compiler tự thu thập danh sách và ghi vào thuộc tính PermittedSubclasses. Cách viết này rất gọn cho các mô hình nhỏ vì toàn bộ tập biến thể đọc được trong một màn hình. Ok và Err là record nên đã ngầm final, không cần thêm modifier; record lồng trong interface cũng ngầm static và hoàn toàn hợp lệ.","whyWrong":["permits là tuỳ chọn khi các kiểu con nằm cùng file nguồn","Record lồng bên trong interface hoàn toàn hợp lệ và ngầm static","Record đã ngầm final nên yêu cầu về modifier đã được thoả mãn sẵn, không cần thêm gì",""]},{"id":"d-15-8","topicId":15,"versions":[21],"difficulty":"advanced","question":"Thư viện có sealed interface Shape permits Circle, Rect. Ứng dụng của bạn switch đầy đủ hai nhánh, không có default. Thư viện nâng cấp thêm biến thể Tri, nhưng bạn CHỈ thay JAR mà không biên dịch lại code. Điều gì xảy ra khi truyền vào một Tri?","choices":["Switch trả về null vì không nhánh nào khớp","Ném MatchException, vì javac đã chèn sẵn một nhánh mặc định ngầm cho tình huống này","Vẫn chạy đúng vì JVM tự chọn nhánh gần nhất theo cây kế thừa","Ném ClassCastException tại nhánh case đầu tiên"],"correctAnswer":1,"explanation":"Exhaustiveness là bảo đảm lúc biên dịch, không phải phép màu lúc chạy: khi biên dịch một switch đầy đủ trên kiểu sealed, javac vẫn chèn một nhánh mặc định ngầm ném MatchException để phòng đúng tình huống compile lệch phiên bản này. Nhờ vậy hệ thống thất bại rõ ràng thay vì âm thầm cho kết quả sai. Bài học vận hành: thêm permitted subtype vào một API công khai là breaking change, phải đi kèm tăng phiên bản major và buộc client biên dịch lại.","whyWrong":["Switch expression không có đường trả về null ngầm định; nó ném ngoại lệ","","JVM không có cơ chế chọn nhánh gần nhất; các case được so khớp chính xác theo kiểu","Không có phép ép kiểu nào thất bại ở đây; giá trị đơn giản là không khớp nhánh nào"]},{"id":"d-15-9","topicId":15,"versions":[17,21],"difficulty":"advanced","question":"Trường hợp nào KHÔNG nên dùng sealed?","choices":["Mô hình Result chỉ gồm Ok và Err trong package nội bộ của ứng dụng","Các node của một cây cú pháp trong một DSL bạn tự viết","Interface cho các adapter thanh toán mà bên thứ ba sẽ tự cài đặt và đóng gói ở artifact riêng","Các trạng thái đơn hàng, mỗi trạng thái mang dữ liệu khác nhau"],"correctAnswer":2,"explanation":"Sealed dành cho tập biến thể đóng do bản chất bài toán quyết định; điểm mở rộng cho bên thứ ba thì cần interface thường. Ở đây còn có rào cản kỹ thuật cứng: kiểu con phải nằm cùng module (hoặc cùng package nếu chạy classpath), nên một adapter đóng gói ở artifact riêng đơn giản là không kế thừa được. Ba trường hợp còn lại đều có tập biến thể do miền nghiệp vụ quyết định và nằm trong phạm vi bạn sở hữu, đúng chỗ để khai thác exhaustiveness.","whyWrong":["Result là ví dụ kinh điển của sum type, tập biến thể đóng theo bản chất","Node của AST là tập biến thể đóng và rất hưởng lợi từ pattern switch không cần default","","Trạng thái đơn hàng có tập hữu hạn và mỗi trạng thái mang dữ liệu riêng, đúng chỗ dùng sealed thay vì enum"]},{"id":"d-16-1","topicId":16,"versions":[17,21],"difficulty":"beginner","question":"Đoạn code sau có biên dịch được không?","code":"static void handle(Object o) {\n    if (!(o instanceof String s)) return;\n    System.out.println(s.length());\n}","choices":["Có — biến pattern s vẫn nằm trong phạm vi sau khối if nhờ flow scoping","Không — biến pattern chỉ sống trong cặp ngoặc của khối if","Không — biến pattern không dùng được với toán tử phủ định","Có, nhưng s có thể là null nên phải kiểm tra null trước khi gọi length()"],"correctAnswer":0,"explanation":"Phạm vi của biến pattern được xác định theo luồng logic (flow scoping) chứ không theo cặp ngoặc: nếu chương trình đi qua được câu lệnh if thì điều kiện phủ định đã sai, nghĩa là phép so khớp chắc chắn thành công, nên s hợp lệ ở phần còn lại của method. Đây là điều khiến pattern matching hoà rất tốt với phong cách guard clause và early return. Thêm nữa, instanceof luôn trả false với null nên s không bao giờ là null ở đây.","whyWrong":["","Phạm vi biến pattern không dựa trên cặp ngoặc mà dựa trên nơi compiler chứng minh được so khớp đã thành công","Toán tử phủ định hoàn toàn dùng được; chính nó tạo ra mẫu guard clause phổ biến này","instanceof trả về false với null nên nhánh đi tiếp bảo đảm s khác null, không cần kiểm tra"]},{"id":"d-16-2","topicId":16,"versions":[17,21],"difficulty":"beginner","question":"Đoạn code sau in ra gì?","code":"static int oldStyle(int x) {\n    int r = 0;\n    switch (x) {\n        case 1: r += 1;\n        case 2: r += 2; break;\n        default: r += 10;\n    }\n    return r;\n}\n\nstatic int arrow(int x) {\n    int r = 0;\n    switch (x) {\n        case 1 -> r += 1;\n        case 2 -> r += 2;\n        default -> r += 10;\n    }\n    return r;\n}\n\npublic static void main(String[] a) {\n    System.out.println(oldStyle(1) + \" \" + arrow(1));\n}","choices":["1 1","3 3","3 1","1 3"],"correctAnswer":2,"explanation":"Ở dạng hai chấm, case 1 không có break nên chương trình rơi xuống (fall-through) case 2 và cộng thêm 2, cho 3. Ở dạng mũi tên, mỗi nhánh chỉ chạy đúng phần của nó rồi thoát, không có fall-through và cũng không cần break, nên kết quả là 1. Đây chính là lý do dạng mũi tên loại bỏ hẳn một lớp bug kinh điển: quên break.","whyWrong":["oldStyle rơi xuống case 2 vì thiếu break nên không thể ra 1","arrow không có fall-through nên không cộng thêm 2","","Đảo ngược hoàn toàn: dạng cũ mới là dạng có fall-through"]},{"id":"d-16-3","topicId":16,"versions":[17,21],"difficulty":"beginner","question":"Trong một switch expression, nhánh mũi tên cần nhiều dòng và phải trả về giá trị. Cách nào ĐÚNG?","code":"int n = switch (x) {\n    case 1, 2 -> 10;\n    default -> {\n        int t = compute(x);\n        ???   // trả giá trị cho biểu thức switch\n    }\n};","choices":["Dùng yield t;","Dùng return t;","Dùng break t;","Chỉ cần viết t; vì giá trị của biểu thức cuối được lấy tự động"],"correctAnswer":0,"explanation":"yield là câu lệnh dành riêng để trả giá trị ra khỏi một khối trong switch expression. return bị cấm ở đây và cho lỗi biên dịch 'attempt to return out of a switch expression', vì một biểu thức không được phép nhảy ra khỏi method đang chứa nó. Dạng break kèm giá trị từng xuất hiện trong giai đoạn preview nhưng đã bị loại bỏ trước khi switch expression thành chuẩn ở Java 14.","whyWrong":["","return trong switch expression là lỗi biên dịch vì nó sẽ thoát khỏi cả method chứ không chỉ khỏi biểu thức","break kèm giá trị chỉ tồn tại ở bản preview cũ và không còn hợp lệ","Java không có quy tắc lấy giá trị của biểu thức cuối khối; phải yield tường minh"]},{"id":"d-16-4","topicId":16,"versions":[21],"difficulty":"intermediate","question":"Đoạn code sau (Java 21) có vấn đề gì?","code":"static String f(Object o) {\n    return switch (o) {\n        case Object x -> \"object\";\n        case String s -> \"string\";\n    };\n}","choices":["Không có vấn đề gì; case String sẽ được ưu tiên vì cụ thể hơn","Lỗi biên dịch: nhãn case String bị bao trùm bởi nhãn case Object đứng trước","Lỗi biên dịch: switch expression bắt buộc phải có nhánh default","Biên dịch được nhưng luôn trả về object với mọi đầu vào"],"correctAnswer":1,"explanation":"Trong pattern switch, các nhãn được xét theo thứ tự viết ra chứ không theo độ cụ thể, nên case Object x đã bao trùm case String s và nhánh sau không bao giờ chạy được; compiler báo lỗi 'this case label is dominated by a preceding case label'. Quy tắc thực hành là xếp từ cụ thể tới tổng quát, và đặt nhánh có when trước nhánh cùng kiểu không có when. Đây là ưu điểm rõ rệt so với chuỗi if-else instanceof, nơi cùng lỗi này trôi qua im lặng.","whyWrong":["Java không sắp xếp lại các nhãn theo độ cụ thể; thứ tự viết ra là thứ tự xét","","case Object x đã phủ mọi giá trị khác null nên switch vốn đã đầy đủ; lỗi nằm ở dominance","Code không biên dịch được nên không có hành vi lúc chạy để bàn"]},{"id":"d-16-5","topicId":16,"versions":[21],"difficulty":"intermediate","question":"Đoạn code sau (Java 21) in ra gì?","code":"static String f(Object o) {\n    return switch (o) {\n        case Integer i -> \"int\";\n        case String s -> \"str\";\n        default -> \"other\";\n    };\n}\n\npublic static void main(String[] a) {\n    System.out.println(f(null));\n}","choices":["other — nhánh default hứng cả null","null — switch trả về null khi selector là null","str — null khớp case String vì null là giá trị hợp lệ của String","Ném NullPointerException"],"correctAnswer":3,"explanation":"Theo mặc định switch ném NullPointerException khi selector là null, và nhánh default KHÔNG bắt được null — đây là quyết định giữ tương thích với hành vi vốn có của switch trên String và enum. Muốn xử lý null thì phải nói ra tường minh bằng case null hoặc case null, default (và nhãn gộp đó phải nằm cuối vì default bao trùm mọi nhãn sau nó). Lợi ích là bạn không còn phải bọc switch trong một lệnh kiểm tra null, nhưng phải chủ động khai báo.","whyWrong":["default chỉ áp dụng sau khi selector đã vượt qua bước kiểm tra null; nó không hứng null","Switch expression không có đường trả null ngầm định","Type pattern không khớp null; case String s chỉ khớp giá trị khác null có kiểu String",""]},{"id":"d-16-6","topicId":16,"versions":[17,21],"difficulty":"intermediate","question":"Đoạn code sau có biên dịch được không?","code":"static boolean f(Object o) {\n    return o instanceof String s || s.isEmpty();\n}","choices":["Không — compiler báo cannot find symbol vì s không nằm trong phạm vi ở vế phải của ||","Có — s luôn nằm trong phạm vi ở cả hai vế của biểu thức logic","Có, nhưng sẽ ném NullPointerException khi o không phải String","Không — biến pattern chỉ dùng được trong câu lệnh if, không dùng được trong biểu thức return"],"correctAnswer":0,"explanation":"Với toán tử ||, vế phải chỉ được đánh giá khi vế trái SAI, tức là khi phép so khớp instanceof thất bại — lúc đó s không hề được gán nên compiler quyết định s không nằm trong phạm vi và báo cannot find symbol. Đổi sang && thì ngược lại: vế phải chỉ chạy khi so khớp thành công nên s hợp lệ. Đây là hệ quả trực tiếp của flow scoping và là cách nhanh nhất để kiểm tra người trả lời có thật sự hiểu quy tắc phạm vi hay chỉ học thuộc cú pháp.","whyWrong":["","Phạm vi của biến pattern phụ thuộc vào luồng logic; với || vế phải nằm ngoài phạm vi đó","Lỗi xảy ra lúc biên dịch nên không bao giờ có hành vi runtime","Biến pattern dùng được trong mọi biểu thức, kể cả return; vấn đề nằm ở toán tử ||"]},{"id":"d-16-7","topicId":16,"versions":[21],"difficulty":"intermediate","question":"Đoạn code sau (Java 21) có biên dịch được không?","code":"sealed interface S permits A, B {}\nrecord A(int v) implements S {}\nrecord B(int v) implements S {}\n\nstatic String f(S s) {\n    return switch (s) {\n        case A a -> \"a\";\n        case B b when b.v() > 0 -> \"b duong\";\n    };\n}","choices":["Có — hai nhãn đã phủ hết hai biến thể của sealed interface","Không — nhánh có when không được tính vào exhaustiveness nên switch bị coi là thiếu trường hợp","Không — switch trên sealed interface luôn bắt buộc có default","Có, nhưng sẽ ném MatchException lúc chạy khi b.v() nhỏ hơn hoặc bằng 0"],"correctAnswer":1,"explanation":"Compiler không thể chứng minh điều kiện trong when luôn đúng, nên một nhánh guarded không bao giờ được tính là đã phủ kiểu của nó; ở đây B chỉ được phủ một phần và switch expression bị báo lỗi 'the switch expression does not cover all possible input values'. Cách sửa là thêm một nhánh case B b không có guard đặt sau nhánh có guard. Quy tắc rút ra: guard dùng để tách nhánh, không dùng để phủ kiểu.","whyWrong":["case B b when ... chỉ phủ một phần của B nên tập biến thể chưa được phủ hết","","Từ Java 21, switch trên sealed type liệt kê đủ biến thể không guard thì không cần default","Lỗi bị bắt ngay lúc biên dịch nên không có hành vi runtime để bàn"]},{"id":"d-16-8","topicId":16,"versions":[21],"difficulty":"advanced","question":"Đoạn code sau (Java 21) in ra gì?","code":"record Point(Integer x, Integer y) {}\nrecord Line(Point a, Point b) {}\n\npublic static void main(String[] args) {\n    Object o = new Line(null, new Point(1, 2));\n    String r = switch (o) {\n        case Line(Point(var x, var y), Point b) -> \"deconstructed\";\n        case Line l -> \"line\";\n        default -> \"other\";\n    };\n    System.out.println(r);\n}","choices":["deconstructed — x và y sẽ nhận giá trị null","other","line","Ném NullPointerException khi cố tháo rời Point là null"],"correctAnswer":2,"explanation":"Một record pattern không bao giờ khớp null, kể cả khi nó là pattern lồng bên trong: component a của Line là null nên nhánh Line(Point(var x, var y), Point b) bị bỏ qua, giá trị rơi xuống case Line l và in ra 'line'. Lưu ý phân biệt: type pattern lồng bên trong thì CÓ khớp null nếu kiểu của nó bao trùm kiểu component, ví dụ với record Pair(Object x, Object y) thì Pair(Object a, Object b) khớp new Pair(null, null) còn Pair(String s, String t) thì không. Đây cũng là lý do mẫu 'record pattern rồi type pattern cùng kiểu' rất hữu ích để bắt dữ liệu con bị null.","whyWrong":["Record pattern lồng không khớp null nên nhánh này không được chọn","Giá trị vẫn là một Line nên nó khớp case Line l trước khi tới default","","Không có ngoại lệ nào; pattern chỉ đơn giản là không khớp và chuyển sang nhãn tiếp theo"]},{"id":"d-16-9","topicId":16,"versions":[21],"difficulty":"advanced","question":"Đoạn code sau (Java 21) có biên dịch được không?","code":"sealed interface S permits A, B {}\nrecord A(int v) implements S {}\nrecord B(int v) implements S {}\n\nstatic void f(S s) {\n    switch (s) {                       // switch STATEMENT, không phải expression\n        case A a -> System.out.println(\"a\");\n    }\n}","choices":["Có — switch statement không bắt buộc đầy đủ, giá trị B chỉ đơn giản không làm gì","Có — nhưng sẽ ném MatchException lúc chạy khi truyền vào một B","Không — mọi switch statement trong Java 21 đều bắt buộc có default","Không — từ Java 21, switch statement có dùng pattern cũng bắt buộc đầy đủ"],"correctAnswer":3,"explanation":"Java 21 phân biệt rõ: switch statement kiểu cũ trên int, String hay enum vẫn không bắt buộc đầy đủ, nhưng switch statement có dùng nhãn pattern thì BẮT BUỘC đầy đủ, và compiler báo 'the switch statement does not cover all possible input values'. Lý do là pattern switch được thiết kế để làm việc với sealed type, nơi bỏ sót một biến thể gần như luôn là bug chứ không phải ý định. Cách sửa là thêm case B b, hoặc thêm default nếu bạn thật sự muốn bỏ qua các trường hợp còn lại — nhưng khi đó bạn mất luôn lời nhắc của compiler cho các biến thể thêm sau này.","whyWrong":["Điều đó chỉ đúng với switch statement kiểu cũ không dùng pattern","MatchException chỉ xảy ra khi code đã biên dịch được rồi gặp giá trị không khớp do compile lệch phiên bản; ở đây code không biên dịch được","switch statement kiểu cũ trên int hay String vẫn không cần default",""]},{"id":"d-17-1","topicId":17,"versions":[21],"difficulty":"beginner","question":"Virtual thread trở thành tính năng chuẩn (không còn preview) từ phiên bản Java nào?","choices":["Java 17, cùng đợt với sealed class","Java 19 — bản đầu tiên có virtual thread là bản chính thức","Java 21 (JEP 444); trước đó là preview ở Java 19 và Java 20","Java 21 nhưng vẫn phải bật cờ --enable-preview để dùng"],"correctAnswer":2,"explanation":"Virtual thread xuất hiện lần đầu dưới dạng preview ở Java 19 (JEP 425), preview lần hai ở Java 20 (JEP 436), và trở thành tính năng chuẩn ở Java 21 qua JEP 444. Trên Java 21 bạn dùng được ngay mà không cần cờ nào. Cần phân biệt rõ điều này với ScopedValue (JEP 446) và StructuredTaskScope (JEP 453) — hai thứ đó vẫn là preview trong Java 21 và mới là chỗ dễ trả lời sai.","whyWrong":["Java 17 ra đời trước dự án Loom hoàn thiện, chưa hề có virtual thread trong JDK.","Java 19 chỉ là preview lần thứ nhất, phải biên dịch và chạy với --enable-preview.","","Trên Java 21 virtual thread đã là API chuẩn; --enable-preview chỉ cần cho ScopedValue và StructuredTaskScope."]},{"id":"d-17-10","topicId":17,"versions":[21],"difficulty":"intermediate","question":"Ứng dụng đang chạy 20.000 virtual thread, mỗi thread thực hiện một truy vấn JDBC. HikariCP cấu hình maximumPoolSize=10. Kết quả là gì?","choices":["Mỗi virtual thread được cấp một connection riêng vì virtual thread rẻ","HikariCP tự động mở rộng pool khi thấy nhiều virtual thread đang chờ","Vẫn chỉ có tối đa 10 truy vấn chạy đồng thời; 19.990 thread còn lại chờ lấy connection và có thể đồng loạt vượt connectionTimeout","Chắc chắn xảy ra deadlock vì virtual thread không giải phóng connection được"],"correctAnswer":2,"explanation":"Virtual thread chỉ bỏ được nút thắt số thread, nó không nhân bản tài nguyên downstream. Connection pool vẫn giới hạn ở 10, nên mức song song thật vẫn là 10 và phần còn lại xếp hàng ở getConnection(). Nguy hiểm hơn là trước đây thread pool cỡ 200 vô tình đóng vai van hạn dòng; bỏ nó đi thì 20.000 request cùng dồn vào pool và hàng loạt sẽ ném SQLTransientConnectionException khi chạm connectionTimeout. Bài học: sau khi bật virtual thread phải xem lại pool size, timeout và đặt Semaphore hoặc bulkhead.","whyWrong":["Connection là tài nguyên của database, hoàn toàn độc lập với chi phí tạo thread.","HikariCP không tự mở rộng vượt maximumPoolSize; đó là một trần cứng do cấu hình.","","Chờ connection là blocking bình thường có timeout, không phải deadlock; connection vẫn được trả về pool khi truy vấn xong."]},{"id":"d-17-11","topicId":17,"versions":[21],"difficulty":"advanced","question":"Service dưới đây được chuyển sang mô hình mỗi request một virtual thread, với khoảng một triệu request đang xử lý đồng thời. Hệ quả về bộ nhớ là gì?","code":"static final ThreadLocal<SimpleDateFormat> FMT =\n        ThreadLocal.withInitial(() -> new SimpleDateFormat(\"yyyy-MM-dd\"));\n\nString render(Date d) {\n    return FMT.get().format(d);\n}","choices":["Không sao, vì các virtual thread dùng chung carrier thread nên chỉ có vài bản SimpleDateFormat","Ném NullPointerException vì ThreadLocal không hoạt động trên virtual thread","Mỗi virtual thread có ThreadLocalMap riêng nên sinh khoảng một triệu SimpleDateFormat, bộ nhớ và áp lực GC tăng vọt","GC dọn ngay sau mỗi lời gọi get() nên số object luôn ở mức thấp"],"correctAnswer":2,"explanation":"ThreadLocal gắn với Thread chứ không gắn với carrier thread, nên mỗi virtual thread có bản sao riêng: một triệu thread là một triệu SimpleDateFormat. Mẹo cache-theo-thread vốn hợp lý khi chỉ có vài trăm thread trong pool và chi phí được amortize qua hàng triệu request; với mô hình mỗi tác vụ một thread thì mô hình chi phí đảo ngược hoàn toàn. Cách sửa đúng là dùng DateTimeFormatter — bất biến, thread-safe, chia sẻ được qua một hằng static duy nhất.","whyWrong":["Virtual thread có ThreadLocalMap riêng của mình; carrier thread chỉ là nơi mount tạm thời chứ không sở hữu giá trị đó.","ThreadLocal hoạt động đầy đủ trên virtual thread — đây là điều kiện bắt buộc để MDC và security context của framework cũ chạy được.","","Giá trị bị giữ bởi ThreadLocalMap của thread và sống tới khi thread chết hoặc gọi remove(), GC không dọn ngay được."]},{"id":"d-17-12","topicId":17,"versions":[21],"difficulty":"advanced","question":"Load test trên Java 21 cho thấy log của -Djdk.tracePinnedThreads=full liên tục in stack trace tại một khối synchronized bao quanh lời gọi HTTP. Cách xử lý đúng bản chất là gì?","choices":["Tăng jdk.virtualThreadScheduler.maxPoolSize để có thêm carrier thread","Thay khối synchronized đó bằng ReentrantLock, giữ nguyên phần logic, unlock trong finally","Đổi thành static synchronized để khoá trên Class object thay vì instance","Quay lại dùng platform thread cho toàn bộ ứng dụng"],"correctAnswer":1,"explanation":"Nguyên nhân gốc là virtual thread bị chặn trong khi đang giữ monitor, và trên Java 21 tình huống đó không unmount được. ReentrantLock được xây trên LockSupport.park nên virtual thread nhả carrier bình thường, khắc phục đúng cơ chế mà không đổi ngữ nghĩa loại trừ lẫn nhau. Lưu ý chỉ đổi những khối synchronized có blocking bên trong; khối ngắn không IO thì pinning gần như vô hại và việc đổi tràn lan chỉ làm tăng rủi ro quên unlock.","whyWrong":["Đây chỉ là giảm triệu chứng: carrier vẫn bị chiếm suốt thời gian IO, maxPoolSize có trần và mỗi carrier là một OS thread thật.","","Đổi đối tượng khoá không thay đổi gì về pinning, mà còn làm phạm vi loại trừ rộng ra và giảm thông lượng.","Bỏ hẳn virtual thread là vứt đi lợi ích chỉ vì một điểm cục bộ hoàn toàn sửa được bằng cách đổi loại lock."]},{"id":"d-17-2","topicId":17,"versions":[21],"difficulty":"beginner","question":"Chạy 10.000 tác vụ, mỗi tác vụ chỉ ngủ 1 giây. So sánh tổng thời gian giữa hai executor dưới đây.","code":"// A\ntry (var a = Executors.newFixedThreadPool(200)) {\n    for (int i = 0; i < 10_000; i++)\n        a.submit(() -> { Thread.sleep(1000); return null; });\n}\n\n// B\ntry (var b = Executors.newVirtualThreadPerTaskExecutor()) {\n    for (int i = 0; i < 10_000; i++)\n        b.submit(() -> { Thread.sleep(1000); return null; });\n}","choices":["Cả hai đều khoảng 1 giây, vì Thread.sleep không tốn CPU","A khoảng 50 giây, B khoảng 1 giây","A khoảng 1 giây, B khoảng 50 giây vì virtual thread bị giới hạn bởi số carrier","Cả hai đều khoảng 50 giây vì đều bị chặn bởi số CPU khả dụng"],"correctAnswer":1,"explanation":"A chỉ có 200 platform thread nên phải chạy 10.000/200 = 50 lượt, mỗi lượt 1 giây, tổng khoảng 50 giây. B tạo 10.000 virtual thread; khi gặp Thread.sleep chúng unmount khỏi carrier thread nên tất cả cùng chờ song song và tổng chỉ khoảng 1 giây. Cơ chế mấu chốt là sleep của virtual thread không giữ carrier thread, khác hẳn sleep của platform thread vốn giữ nguyên OS thread.","whyWrong":["Với pool 200 thread, dù sleep không tốn CPU thì thread vẫn bị chiếm suốt 1 giây nên vẫn phải chạy làm 50 lượt.","","Số carrier chỉ giới hạn phần CPU đang chạy thật; virtual thread đang sleep đã unmount nên không chiếm carrier.","Đây là workload chờ chứ không phải tính toán, nên số CPU không phải yếu tố quyết định."]},{"id":"d-17-3","topicId":17,"versions":[21],"difficulty":"beginner","question":"Một job tính toán thuần CPU (nhân ma trận, hash mật khẩu) đang chạy trên pool platform thread cỡ bằng số core. Chuyển sang Executors.newVirtualThreadPerTaskExecutor() thì điều gì xảy ra?","choices":["Nhanh hơn nhiều vì có hàng nghìn thread cùng chạy song song","Chậm hơn hàng chục lần vì virtual thread chỉ chạy được trên một core","Nhanh gấp đôi vì stack nằm trên heap nên truy cập bộ nhớ tốt hơn","Không nhanh hơn đáng kể, thậm chí chậm hơn chút vì thêm chi phí lập lịch và tạo object"],"correctAnswer":3,"explanation":"Virtual thread chỉ làm cho việc CHỜ trở nên rẻ, không làm cho việc TÍNH toán nhanh hơn. Với workload CPU-bound, trần thông lượng vẫn là số core vật lý, và scheduler mặc định cũng chỉ có bấy nhiêu carrier thread. Thêm hàng nghìn virtual thread chỉ tạo thêm object, thêm lần mount/unmount và thêm áp lực GC. Quy tắc thực tế: IO-bound dùng virtual thread, CPU-bound dùng pool platform thread cỡ số core.","whyWrong":["Số luồng thực thi song song bị chặn bởi số core, không phải số thread; tạo thêm thread chỉ chia nhỏ cùng một lượng CPU.","Virtual thread chạy trên nhiều carrier thread và tận dụng được nhiều core; nó không bị giới hạn ở một core.","Stack trên heap là chi tiết cài đặt để unmount được, không mang lại lợi ích tốc độ tính toán nào.",""]},{"id":"d-17-4","topicId":17,"versions":[21],"difficulty":"beginner","question":"Vì sao đoạn cấu hình dưới đây bị coi là anti-pattern?","code":"ExecutorService exec = Executors.newFixedThreadPool(\n        200, Thread.ofVirtual().factory());","choices":["Vì ThreadFactory của virtual thread không hợp lệ với newFixedThreadPool, sẽ ném exception lúc chạy","Vì virtual thread không thể chạy nhiều hơn số core nên 200 là con số vô nghĩa về mặt kỹ thuật","Vì pool sinh ra để amortize chi phí tạo thread — thứ virtual thread không có — nên nó chỉ còn lại nhược điểm: giới hạn đồng thời tuỳ tiện ở 200 và tái sử dụng thread khiến ThreadLocal mang trạng thái cũ sang task mới","Vì newFixedThreadPool luôn dùng hàng đợi không giới hạn nên chắc chắn gây OutOfMemoryError"],"correctAnswer":2,"explanation":"Pool tồn tại vì tạo platform thread đắt; virtual thread rẻ nên lý do đó biến mất, chỉ còn lại tác hại. Kích thước 200 trở thành một trần đồng thời đặt sai chỗ, và vì thread bị tái sử dụng nên ThreadLocal không được dọn tự nhiên như mô hình mỗi task một thread. Cách đúng là Executors.newVirtualThreadPerTaskExecutor() và nếu cần hạn dòng thì đặt Semaphore ngay tại tài nguyên bị giới hạn.","whyWrong":["Đoạn code này biên dịch và chạy được bình thường; vấn đề là thiết kế chứ không phải lỗi runtime.","Virtual thread hoàn toàn có thể tồn tại đồng thời nhiều hơn số core rất nhiều lần khi phần lớn đang chờ IO.","","Hàng đợi không giới hạn là một rủi ro riêng của newFixedThreadPool, nhưng không phải lý do chính khiến việc pool hoá virtual thread là sai."]},{"id":"d-17-5","topicId":17,"versions":[21],"difficulty":"intermediate","question":"Trên Java 21, method dưới đây được gọi từ hàng nghìn virtual thread. Điều gì xảy ra?","code":"private final Object lock = new Object();\n\nvoid callBank() {\n    synchronized (lock) {\n        httpClient.send(request, BodyHandlers.ofString()); // blocking IO ~200ms\n    }\n}","choices":["JVM tự động unmount vì đây là blocking IO, nên không có vấn đề gì","Ném IllegalMonitorStateException vì virtual thread không được dùng synchronized","Virtual thread bị pin vào carrier thread trong suốt lời gọi IO; carrier bị chiếm, số carrier lại chỉ bằng số CPU nên thông lượng sụt thảm hại","Mỗi virtual thread tự động được cấp một carrier thread mới, nên chỉ tốn thêm bộ nhớ"],"correctAnswer":2,"explanation":"Trên Java 21, một virtual thread bị chặn trong khi đang giữ monitor của khối synchronized thì không thể unmount — đó chính là pinning. Carrier thread bị chiếm suốt 200ms, mà số carrier mặc định chỉ bằng số CPU, nên chỉ vài lời gọi song song là hết carrier và các virtual thread khác không có chỗ chạy dù đã sẵn sàng. Cách sửa là thay synchronized bằng ReentrantLock ở đoạn có blocking, vì lock trong java.util.concurrent park được nên virtual thread unmount bình thường.","whyWrong":["JDK chỉ unmount được khi không có monitor đang giữ và không có native frame; ở đây điều kiện đó không thoả.","synchronized hoàn toàn hợp lệ trên virtual thread, chỉ là gây pinning; IllegalMonitorStateException là lỗi của wait/notify khi không giữ monitor.","","Scheduler có thể mở rộng tới maxPoolSize nhưng đó chỉ là biện pháp giảm triệu chứng có trần, không phải cơ chế cấp carrier riêng cho mỗi virtual thread."]},{"id":"d-17-6","topicId":17,"versions":[21],"difficulty":"intermediate","question":"Virtual thread được lập lịch bởi thành phần nào và số carrier thread mặc định là bao nhiêu?","choices":["Bởi ForkJoinPool.commonPool(), số thread mặc định bằng số CPU trừ 1","Bởi một ForkJoinPool riêng chạy chế độ FIFO, parallelism mặc định bằng Runtime.getRuntime().availableProcessors()","Bởi chính hệ điều hành, giống platform thread, nên số carrier là không giới hạn","Bởi một ThreadPoolExecutor cố định 256 thread do JVM tạo lúc khởi động"],"correctAnswer":1,"explanation":"Scheduler mặc định là một ForkJoinPool riêng của JDK chạy ở chế độ FIFO — quan trọng là nó KHÔNG phải commonPool, để công việc ForkJoin của ứng dụng không ảnh hưởng lẫn nhau. Parallelism mặc định bằng số CPU khả dụng, chỉnh được qua jdk.virtualThreadScheduler.parallelism, và số carrier tối đa qua jdk.virtualThreadScheduler.maxPoolSize (mặc định 256). Biết con số này giúp giải thích vì sao pinning lại nguy hiểm: chỉ cần vài lời gọi bị ghim là hết carrier.","whyWrong":["Đây là pool riêng chứ không phải commonPool; và parallelism mặc định bằng số CPU chứ không phải số CPU trừ 1.","","OS chỉ lập lịch carrier thread; việc chọn virtual thread nào chạy trên carrier là do JVM quyết định.","256 là giá trị mặc định của maxPoolSize, tức trần mở rộng, không phải số carrier tạo sẵn lúc khởi động."]},{"id":"d-17-7","topicId":17,"versions":[21],"difficulty":"intermediate","question":"Đoạn code Java 21 dưới đây in ra gì?","code":"public static void main(String[] args) throws Exception {\n    Thread t = Thread.startVirtualThread(() ->\n            System.out.println(\"[\" + Thread.currentThread().getName() + \"]\"));\n    t.join();\n}","choices":["[]","[Thread-0]","[VirtualThread-1]","[ForkJoinPool-1-worker-1]"],"correctAnswer":0,"explanation":"Virtual thread không được đặt tên mặc định, nên getName() trả về chuỗi rỗng và kết quả in ra là []. Nếu muốn có tên phải dùng Thread.ofVirtual().name(\"worker-\", 0). Đây là bẫy thực tế chứ không phải trivia: rất nhiều đoạn log và metric đang gắn nhãn theo Thread.currentThread().getName() sẽ mất thông tin ngay khi chuyển sang virtual thread. Muốn thấy định danh thì dùng toString(), nó cho dạng VirtualThread[#21]/runnable@ForkJoinPool-1-worker-1.","whyWrong":["","Thread-0 là quy ước đặt tên mặc định của platform thread, không áp dụng cho virtual thread.","Chuỗi VirtualThread[#..] chỉ xuất hiện trong toString(), không phải giá trị của getName().","Tên carrier thread chỉ xuất hiện ở phần đuôi của toString(); getName() của virtual thread không trả về tên carrier."]},{"id":"d-17-8","topicId":17,"versions":[21],"difficulty":"intermediate","question":"Chương trình Java 21 dưới đây in ra gì?","code":"public static void main(String[] args) {\n    Thread.startVirtualThread(() -> {\n        try { Thread.sleep(1000); } catch (InterruptedException e) { }\n        System.out.println(\"done\");\n    });\n    System.out.println(\"main end\");\n}","choices":["In \"main end\" rồi 1 giây sau in \"done\"","Chỉ in \"main end\" rồi JVM thoát, \"done\" gần như chắc chắn không được in","In \"done\" trước rồi mới in \"main end\"","Ném IllegalThreadStateException vì virtual thread không được sleep"],"correctAnswer":1,"explanation":"Virtual thread LUÔN là daemon thread — không thể đổi, gọi setDaemon(false) sẽ ném IllegalArgumentException. JVM chỉ chờ các thread non-daemon, mà ở đây chỉ có main; main in xong là kết thúc và JVM tắt trước khi virtual thread ngủ dậy. Đây là khác biệt hành vi rất dễ vấp khi port code từ platform thread sang. Muốn chờ thì phải gọi t.join(), hoặc dùng try-with-resources với newVirtualThreadPerTaskExecutor() vì close() chờ mọi task hoàn tất.","whyWrong":["Điều này chỉ đúng nếu virtual thread là non-daemon; nó luôn là daemon nên JVM không chờ.","","Virtual thread ng
