ia thành nhiều segment theo vòng đời của mã.","<b>Bức tranh tổng bộ nhớ của một process.</b> RSS của process = heap + metaspace + code cache + stack của mọi thread + direct/mapped ByteBuffer + bộ nhớ nội bộ của GC (remembered set, card table) + native của thư viện. Đặt <code>-Xmx</code> bằng đúng memory limit của container là sai lầm phổ biến khiến pod bị OOMKilled dù heap chưa đầy; công cụ chẩn đoán đúng là Native Memory Tracking (<code>-XX:NativeMemoryTracking=summary</code>)."],"example":"// Heap: object và mảng\nbyte[] buf = new byte[1024];        // object trên heap\nPoint p = new Point(1, 2);          // object trên heap\n\n// Stack: biến local và reference\nvoid m() {\n    int x = 5;                      // giá trị nằm trong frame trên stack\n    Point local = p;                // reference nằm trên stack, object vẫn trên heap\n}\n\n// Các cờ tương ứng với từng vùng\n// -Xms2g -Xmx2g                 heap\n// -Xss512k                      stack mỗi thread\n// -XX:MaxMetaspaceSize=256m     metadata class (native memory)\n// -XX:ReservedCodeCacheSize=240m  mã do JIT sinh\n// -XX:MaxDirectMemorySize=512m  direct ByteBuffer\n// -XX:NativeMemoryTracking=summary  để chẩn đoán RSS vượt mức","exampleTitle":"Vùng nào chứa gì và cờ nào điều khiển","keyPoints":["Heap chia sẻ giữa mọi thread và là vùng duy nhất chứa object của ứng dụng (metaspace cũng được GC thu hồi khi class unloading, nên đừng nói heap là vùng duy nhất GC quản lý); stack riêng từng thread nên biến local mặc nhiên thread-safe.","Metaspace thay PermGen từ Java 8, nằm ở native memory và mặc định không có trần trên.","-XX:MaxPermSize bị bỏ qua từ Java 8; cờ đúng là -XX:MaxMetaspaceSize.","String pool đã chuyển từ PermGen vào heap từ Java 7.","Bộ nhớ process lớn hơn -Xmx rất nhiều: stack, metaspace, code cache và direct buffer đều nằm ngoài heap."],"trap":"Đặt -Xmx bằng đúng memory limit của container. Khi đó heap có thể chưa đầy nhưng tổng RSS đã vượt limit và container bị OOMKilled — một sự cố không để lại bất kỳ dấu vết nào trong GC log.","followUp":["OutOfMemoryError: unable to create new native thread khác gì OutOfMemoryError: Java heap space?","Vì sao ứng dụng chậm đột ngột mà GC log lại hoàn toàn bình thường?","Direct ByteBuffer được giải phóng bằng cơ chế nào nếu nó không nằm trên heap?"]},{"id":"t-7-2","topicId":7,"versions":[8,11,17,21],"title":"Java luôn pass-by-value — kể cả với object","summary":"Vì sao tráo đổi hai object trong method không có tác dụng nhưng sửa nội dung thì có, và mối liên hệ với bố cục stack/heap.","sections":["<b>Phát biểu chính xác.</b> Java <b>luôn</b> truyền tham số theo giá trị, không có ngoại lệ. Với kiểu nguyên thuỷ, giá trị được sao chép là chính con số. Với object, giá trị được sao chép là <i>reference</i> — tức là địa chỉ, chứ không phải object. Bản sao reference này nằm trong frame của method được gọi, hoàn toàn tách biệt với biến ở phía người gọi.","<b>Hai hệ quả trái ngược nhau.</b> Nếu bên trong method bạn <i>gán lại</i> tham số (<code>s = new String(...)</code>), bạn chỉ ghi đè bản sao trong frame của mình; biến ở người gọi không hề đổi. Nhưng nếu bạn <i>gọi method làm thay đổi trạng thái</i> của object (<code>sb.append(...)</code>, <code>list.add(...)</code>), thì cả hai reference cùng trỏ tới một object trên heap nên người gọi thấy thay đổi. Phân biệt được 'gán lại reference' với 'sửa nội dung object' là toàn bộ nội dung của câu hỏi này.","<b>Vì sao swap không bao giờ hoạt động.</b> Một method <code>swap(Object a, Object b)</code> hoán đổi hai tham số chỉ hoán đổi hai ô nhớ trong frame của chính nó rồi biến mất khi method kết thúc. Java không có tham chiếu kiểu C++ (<code>&amp;</code>) hay con trỏ tới con trỏ, nên muốn trả hai giá trị ra ngoài bạn buộc phải dùng mảng, object bọc, hoặc trả về một record.","<b>Vì sao String làm chủ đề này dễ nhầm.</b> <code>String</code> immutable nên không có method nào sửa được nội dung của nó; mọi thao tác đều tạo object mới và gán lại. Người mới thường kết luận sai rằng 'String được truyền theo giá trị còn object khác theo tham chiếu'. Thực tế cơ chế truyền hoàn toàn giống nhau — chỉ có tính bất biến làm cho hệ quả trông khác.","<b>Liên hệ với bố cục bộ nhớ.</b> Biến local kiểu nguyên thuỷ và biến giữ reference đều nằm trong frame trên stack của thread; object mà reference trỏ tới nằm trên heap dùng chung. Đây chính là lý do vì sao truyền một object giữa hai thread lập tức tạo ra vấn đề đồng bộ hoá, trong khi biến local thì không bao giờ.","<b>Sắc thái cần biết: escape analysis.</b> Câu 'object luôn nằm trên heap' đúng ở mức đặc tả ngôn ngữ, nhưng ở mức cài đặt HotSpot, JIT có thể phân tích thấy một object không thoát khỏi method và thay nó bằng các biến vô hướng nằm trong thanh ghi/stack — gọi là scalar replacement. Người phỏng vấn cấp senior thường thích nghe ứng viên nêu đúng sắc thái này thay vì phát biểu tuyệt đối."],"example":"static void reassign(StringBuilder sb) {\n    sb = new StringBuilder(\"changed\");   // chỉ đổi bản sao reference trong frame\n}\n\nstatic void mutate(StringBuilder sb) {\n    sb.append(\" world\");                 // đổi object trên heap -> caller thấy\n}\n\nstatic void swap(int[] a) {              // muốn ra ngoài thì phải bọc\n    int t = a[0]; a[0] = a[1]; a[1] = t;\n}\n\npublic static void main(String[] args) {\n    StringBuilder sb = new StringBuilder(\"hello\");\n    reassign(sb);\n    System.out.println(sb);              // hello\n    mutate(sb);\n    System.out.println(sb);              // hello world\n\n    String s = \"hello\";\n    upper(s);\n    System.out.println(s);               // hello - String immutable\n}\n\nstatic void upper(String s) { s = s.toUpperCase(); }","exampleTitle":"Gán lại reference vs sửa nội dung object","keyPoints":["Java luôn pass-by-value; với object thì giá trị được sao chép là reference chứ không phải object.","Gán lại tham số bên trong method không ảnh hưởng người gọi; sửa trạng thái object thì có.","Không thể viết swap cho hai tham số object — phải dùng mảng, object bọc hoặc record trả về.","String trông 'khác' chỉ vì immutable, cơ chế truyền tham số hoàn toàn giống mọi object khác.","Reference nằm trên stack frame, object nằm trên heap — trừ khi JIT làm scalar replacement."],"trap":"Câu trả lời 'Java truyền primitive theo giá trị và object theo tham chiếu' là sai và người phỏng vấn dùng đúng câu này để loại ứng viên. Cách nói đúng là: truyền theo giá trị của reference (pass-by-value of the reference).","followUp":["Nếu Java là pass-by-reference thì đoạn code swap sẽ chạy khác như thế nào?","Vì sao truyền một collection mutable ra khỏi API công khai lại nguy hiểm?","Escape analysis thay đổi gì trong phát biểu 'mọi object đều nằm trên heap'?"]},{"id":"t-7-3","topicId":7,"versions":[8,11,17,21],"title":"GC theo thế hệ: eden, survivor, old và vì sao cấp phát lại rẻ","summary":"Giả thuyết thế hệ, đường đi của một object từ eden tới old gen, và vì sao minor GC nhanh hơn full GC nhiều bậc.","sections":["<b>Giả thuyết thế hệ yếu (weak generational hypothesis).</b> Quan sát thực nghiệm trên hầu hết ứng dụng: đại đa số object chết rất trẻ, và rất ít tham chiếu đi từ object già sang object trẻ. Toàn bộ thiết kế GC của HotSpot dựng trên hai quan sát này — chia heap thành young generation và old generation để có thể dọn phần trẻ thường xuyên với chi phí thấp mà không phải chạm vào phần già.","<b>Young generation gồm eden và hai survivor.</b> Object mới sinh ra ở eden. Khi eden đầy, một <i>minor GC</i> chạy: nó tìm các object còn sống bằng cách duyệt từ GC roots <i>và</i> — điểm rất hay bị bỏ sót — từ remembered set / card table, tức tập các tham chiếu đi từ old gen xuống young gen; không quét phần này thì một object trẻ chỉ còn được object già trỏ tới sẽ bị coi nhầm là rác. Sau đó nó sao chép các object sống sang survivor đang trống, rồi <b>xoá sạch toàn bộ eden trong một thao tác</b>. Chi phí tỉ lệ với lượng object <i>sống</i>, không tỉ lệ với lượng object chết — nên nếu 95% object chết trẻ, minor GC gần như miễn phí. Đó là lý do vì sao tạo nhiều object ngắn hạn trong Java rẻ hơn nhiều so với trực giác của người quen C/C++.","<b>Tenuring: đường lên old generation.</b> Mỗi lần sống sót qua một minor GC, object tăng age lên 1 và được sao chép qua survivor còn lại. Khi age vượt ngưỡng (<code>-XX:MaxTenuringThreshold</code>, mặc định thường là 15 với các collector theo thế hệ) hoặc khi survivor không đủ chỗ, object được <i>promote</i> lên old gen. Object quá lớn có thể được cấp phát thẳng vào old gen. Khi young gen quá nhỏ, object bị đẩy lên old sớm — gọi là <i>premature promotion</i> — làm old gen đầy nhanh và full GC dồn dập.","<b>Cấp phát nhanh nhờ TLAB và bump-the-pointer.</b> Eden được chia thành các Thread-Local Allocation Buffer, mỗi thread có vùng riêng nên cấp phát chỉ là tăng một con trỏ, không cần khoá. Đây là lý do <code>new</code> trong Java thường nhanh hơn <code>malloc</code>. Kết hợp với copying collector — vốn tự nén (compact) khi sao chép — heap không bị phân mảnh ở young gen.","<b>Thuật toán: mark-sweep-compact vs copying.</b> Young gen dùng <i>copying</i> (sao chép phần sống, bỏ tất cả phần còn lại) vì tỉ lệ sống thấp. Old gen dùng <i>mark-sweep-compact</i>: đánh dấu object sống, quét bỏ object chết, rồi dồn các object sống lại để tránh phân mảnh. Bước compact tốn kém và thường là thành phần chính của một pha stop-the-world dài.","<b>Minor, major, full — phân biệt cho chuẩn.</b> <i>Minor GC</i> dọn young gen. <i>Major GC</i> dọn old gen. <i>Full GC</i> dọn cả heap lẫn metaspace và gần như luôn là stop-the-world toàn phần. Cần lưu ý thuật ngữ này không được chuẩn hoá tuyệt đối giữa các collector, và với G1 thì bức tranh khác đi: G1 chia heap thành hàng nghìn region cùng kích thước, gán vai trò eden/survivor/old cho từng region, và các pha hỗn hợp (mixed GC) dọn young cộng thêm một số region old sinh lợi nhất."],"example":"// Object ngắn hạn: sinh ra ở eden, gần như luôn chết trước minor GC kế tiếp\nfor (int i = 0; i < 1_000_000; i++) {\n    String s = \"item-\" + i;    // rác, chi phí thu hồi gần bằng 0\n    consume(s);\n}\n\n// Object dài hạn: sống sót nhiều minor GC rồi bị promote lên old gen\nstatic final Map<Long, User> CACHE = new ConcurrentHashMap<>();\n\n// Cờ liên quan tới thế hệ (áp dụng với collector theo thế hệ)\n// -Xmn512m                      kích thước young generation\n// -XX:MaxTenuringThreshold=15   số lần sống sót trước khi promote\n// -XX:SurvivorRatio=8           eden : mỗi survivor = 8 : 1\n// -Xlog:gc*                     GC log hợp nhất, Java 9 trở lên\n// -XX:+PrintGCDetails           cú pháp cũ dùng cho Java 8","exampleTitle":"Object ngắn hạn vs dài hạn và các cờ liên quan","keyPoints":["Chi phí minor GC tỉ lệ với lượng object còn SỐNG, không tỉ lệ với lượng rác — nên object chết trẻ gần như miễn phí.","Object sinh ra ở eden, sang survivor và tăng age mỗi lần sống sót, rồi được promote lên old gen khi vượt ngưỡng tenuring.","TLAB cho phép cấp phát bằng cách tăng con trỏ, không cần khoá, nên new thường nhanh hơn malloc.","Young gen dùng copying (tự nén), old gen dùng mark-sweep-compact với bước compact đắt.","Young gen quá nhỏ gây premature promotion, làm old gen đầy nhanh và sinh full GC dồn dập."],"trap":"Nhiều người nghĩ tối ưu là 'tạo ít object đi'. Với object ngắn hạn thì gần như không có lợi, thậm chí việc tự tái sử dụng object (object pooling) còn làm chậm hơn vì object sống lâu bị promote lên old gen và làm tăng chi phí major GC.","followUp":["Vì sao cần tới hai vùng survivor mà không phải một?","Premature promotion biểu hiện thế nào trong GC log và sửa bằng cách nào?","Mô hình region của G1 khác mô hình eden/survivor/old cố định ở chỗ nào?"]},{"id":"t-7-4","topicId":7,"versions":[8,11,17,21],"title":"Các collector qua từng bản LTS và bản chất của stop-the-world","summary":"Serial, Parallel, CMS, G1, ZGC, Shenandoah: cái nào mặc định ở bản nào, đánh đổi throughput với latency ra sao, và vì sao không thể xoá sạch pause.","sections":["<b>Serial và Parallel — tối ưu throughput.</b> <code>Serial GC</code> (<code>-XX:+UseSerialGC</code>) dùng một thread, phù hợp heap nhỏ và container một CPU. <code>Parallel GC</code> (<code>-XX:+UseParallelGC</code>) dùng nhiều thread cho cùng công việc đó và là <b>mặc định của Java 8</b>. Cả hai đều stop-the-world hoàn toàn: throughput tổng cao nhất nhưng pause tỉ lệ với kích thước heap, nên heap vài chục GB có thể pause hàng giây.","<b>CMS — đã bị xoá khỏi JDK.</b> Concurrent Mark Sweep chạy phần lớn công việc đánh dấu song song với ứng dụng để giảm pause. Nhược điểm là nó <i>không compact</i>, nên old gen dần phân mảnh cho tới khi buộc phải chạy một full GC single-thread rất dài (concurrent mode failure). CMS bị deprecate ở <b>Java 9</b> (JEP 291) và <b>gỡ bỏ hoàn toàn ở Java 14</b> (JEP 363). Cần phân biệt cho đúng vòng đời của một cờ JVM: ở <b>Java 14</b> cờ <code>-XX:+UseConcMarkSweepGC</code> mới chỉ là <i>obsolete</i> — JVM in cảnh báo <code>Ignoring option UseConcMarkSweepGC; support was removed in 14.0</code> rồi <b>vẫn khởi động bình thường</b> và chạy trên G1. Phải từ <b>Java 15</b>, khi cờ <i>expired</i>, JVM mới báo <code>Unrecognized VM option</code> và không khởi động được.","<b>G1 — mặc định từ Java 9 và là lựa chọn hợp lý nhất hiện nay.</b> G1 chia heap thành hàng nghìn region cùng kích thước, thu thập thống kê rồi ưu tiên dọn những region nhiều rác nhất trước (garbage-first). Nó nhận mục tiêu pause mềm qua <code>-XX:MaxGCPauseMillis</code> (mặc định 200ms) và tự điều chỉnh để cố đạt — đây là <i>mục tiêu</i> chứ không phải cam kết. G1 có compact nên không gặp bài toán phân mảnh của CMS. Với Java 11/17/21, G1 là mặc định trên máy được JVM xếp loại server-class.","<b>ZGC và Shenandoah — nhóm low-latency.</b> Cả hai làm gần như toàn bộ công việc (kể cả di chuyển object) song song với ứng dụng, dùng load/read barrier để chuyển hướng tham chiếu. Điểm mấu chốt: <b>pause gần như không phụ thuộc kích thước heap</b>, nên heap hàng trăm GB vẫn giữ pause rất ngắn. ZGC: experimental ở Java 11 (JEP 333), production-ready ở Java 15 (JEP 377); mục tiêu pause dưới 10ms ở các bản đầu và thường dưới 1ms từ Java 16 trở đi. Java 21 bổ sung <b>Generational ZGC</b> (JEP 439) — ở bản này vẫn là tuỳ chọn, bật bằng <code>-XX:+ZGenerational</code>. Shenandoah: experimental ở Java 12, production ở Java 15 (JEP 379), nhưng nó chỉ có trong một số bản build OpenJDK chứ không phải mọi JDK — cần kiểm tra bản phân phối bạn dùng.","<b>Đánh đổi thật sự.</b> Không có collector 'tốt nhất'. Nhóm low-latency trả giá bằng throughput thấp hơn (do barrier trên mỗi lần đọc tham chiếu) và tiêu tốn nhiều CPU cùng bộ nhớ phụ trợ hơn. Với job batch, Parallel GC thường vẫn cho tổng thời gian chạy tốt nhất. Với API cần p99 ổn định và heap lớn, ZGC hoặc Shenandoah mới đáng. Ứng dụng heap vừa phải thì G1 mặc định là đúng và không cần chỉnh gì.","<b>Vì sao không xoá được stop-the-world hoàn toàn.</b> Mọi collector đều cần vài thời điểm mà toàn bộ thread ứng dụng dừng tại <i>safepoint</i> — chủ yếu để quét root (biến local trên stack của từng thread) một cách nhất quán. ZGC và Shenandoah rút các pha này xuống mức rất ngắn và không phụ thuộc kích thước heap, nhưng không xoá được. Ngoài ra còn có <i>time-to-safepoint</i>: nếu một thread đang ở vòng lặp không có safepoint poll, cả JVM phải chờ nó — đó là loại pause không hiện rõ trong GC log."],"example":"// Mặc định theo phiên bản (trên máy JVM xếp loại server-class)\n// Java 8   -> Parallel GC\n// Java 11  -> G1\n// Java 17  -> G1\n// Java 21  -> G1\n// Máy/container nhỏ (dưới 2 CPU hoặc RAM thấp) -> JVM ergonomics có thể chọn Serial GC\n\n// Chọn tường minh\n// -XX:+UseSerialGC\n// -XX:+UseParallelGC\n// -XX:+UseG1GC   -XX:MaxGCPauseMillis=100\n// -XX:+UseZGC                       Java 15+ production\n// -XX:+UseZGC -XX:+ZGenerational    Java 21, generational ZGC (tuỳ chọn)\n// -XX:+UseShenandoahGC              chỉ có ở một số bản build OpenJDK\n// -XX:+UseConcMarkSweepGC           Java 14: obsolete - canh bao roi bo qua, chay tren G1\n//                                   Java 15+: expired - Unrecognized VM option, JVM khong khoi dong\n\n// Quan sát trước khi chỉnh\n// -Xlog:gc*,safepoint:file=gc.log:time,uptime,level,tags","exampleTitle":"Bảng mặc định theo LTS và cờ tương ứng","keyPoints":["Parallel GC là mặc định ở Java 8; G1 là mặc định từ Java 9 trở đi trên máy server-class.","CMS bị deprecate ở Java 9 và gỡ bỏ ở Java 14; trên Java 14 cờ cũ chỉ bị cảnh báo rồi bỏ qua (JVM vẫn chạy trên G1), từ Java 15 cờ mới hết hạn và làm JVM không khởi động.","ZGC production từ Java 15; Generational ZGC xuất hiện ở Java 21 và ở bản này vẫn phải bật bằng -XX:+ZGenerational.","Pause của ZGC/Shenandoah gần như không phụ thuộc kích thước heap, đổi lại throughput thấp hơn do barrier.","Không collector nào bỏ được stop-the-world hoàn toàn vì luôn cần safepoint để quét root nhất quán."],"trap":"Bật ZGC cho mọi ứng dụng vì nghĩ 'pause thấp hơn thì luôn tốt hơn'. Với job batch hoặc service throughput-bound, chi phí barrier khiến tổng thời gian chạy tệ hơn Parallel/G1 rõ rệt — phải đo p99 và throughput trước khi đổi.","followUp":["Concurrent mode failure của CMS là gì và vì sao nó dẫn tới full GC dài?","MaxGCPauseMillis của G1 là cam kết hay chỉ là mục tiêu?","Time-to-safepoint gây pause kiểu gì mà GC log không thể hiện?"]},{"id":"t-7-5","topicId":7,"versions":[8,11,17,21],"title":"Memory leak trong Java, bốn loại reference, và vì sao finalize() bị khai tử","summary":"GC không cứu bạn khỏi rò rỉ bộ nhớ: các mẫu leak điển hình, cách soft/weak/phantom reference hoạt động, và thay thế đúng cho finalize().","sections":["<b>Định nghĩa leak trong ngôn ngữ có GC.</b> GC chỉ thu hồi object <i>không còn reachable</i> từ GC roots (biến local đang hoạt động, biến static, thread đang chạy, JNI reference). Leak trong Java nghĩa là: object không còn cần dùng nhưng vẫn còn ai đó giữ tham chiếu, nên GC không được phép thu hồi. Triệu chứng đặc trưng là mức old gen <i>sau mỗi full GC</i> tăng đều theo thời gian — chứ không phải heap dao động lên xuống, vốn hoàn toàn bình thường.","<b>Bốn mẫu leak hay gặp nhất.</b> (1) <b>Static collection</b>: một <code>static Map</code> dùng làm cache mà không có giới hạn hoặc TTL — biến static là GC root sống suốt vòng đời class loader. (2) <b>Listener/callback không gỡ</b>: đăng ký observer mà quên <code>removeListener</code>, publisher giữ subscriber sống mãi. (3) <b>ThreadLocal trong thread pool</b>: thread trong pool không chết nên giá trị của ThreadLocal không được dọn — chi tiết cơ chế ở đoạn dưới. (4) <b>ClassLoader leak</b>: sau khi redeploy trong app server, một reference còn sót (ví dụ một thread do webapp tạo, hoặc một field static ở thư viện dùng chung) giữ cả class loader cũ sống, kéo theo toàn bộ class và static field của bản deploy cũ.","<b>Vì sao ThreadLocal đặc biệt nguy hiểm với thread pool.</b> Trong <code>ThreadLocalMap</code> của mỗi thread, <i>key</i> là một weak reference tới object <code>ThreadLocal</code>, còn <i>value</i> là strong reference. Thường thì <code>ThreadLocal</code> được khai báo <code>static final</code> nên key không bao giờ bị thu hồi, và value cứ sống theo tuổi thọ của thread. Trong Tomcat hay ExecutorService, thread sống hàng tháng, nên mỗi request bỏ quên một value là một lần rò rỉ. Quy tắc bắt buộc: luôn <code>remove()</code> trong <code>finally</code>.","<b>Bốn mức reference.</b> <i>Strong</i> — tham chiếu thông thường, object không bao giờ bị thu hồi khi còn nó. <i>Soft</i> (<code>SoftReference</code>) — GC được phép giữ lại, nhưng đảm bảo mọi soft reference sẽ bị clear trước khi ném <code>OutOfMemoryError</code>; phù hợp cho cache nhạy cảm bộ nhớ, tuy thực tế hay khuyên dùng thư viện cache có chính sách rõ ràng (Caffeine) hơn là dựa vào GC. <i>Weak</i> (<code>WeakReference</code>) — bị clear ngay ở kỳ GC kế tiếp khi object chỉ còn weakly reachable; đây là cơ chế đằng sau <code>WeakHashMap</code>. <i>Phantom</i> (<code>PhantomReference</code>) — <code>get()</code> luôn trả về <code>null</code>, chỉ dùng cùng <code>ReferenceQueue</code> để biết object đã thực sự được thu hồi và chạy dọn dẹp sau đó.","<b>finalize() và người thay thế.</b> <code>Object.finalize()</code> không đảm bảo bao giờ chạy hay có chạy hay không, làm object phải qua ít nhất hai chu kỳ GC, có thể 'hồi sinh' object, và exception ném ra từ nó bị nuốt im lặng. Nó bị <code>@Deprecated</code> từ <b>Java 9</b>, rồi bị deprecate-for-removal ở <b>Java 18</b> (JEP 421) kèm tuỳ chọn <code>--finalization=disabled</code> để tắt hẳn, với kế hoạch gỡ bỏ ở bản sau. Thay thế đúng, theo thứ tự ưu tiên: <code>AutoCloseable</code> + try-with-resources cho mọi tài nguyên có vòng đời rõ ràng; <code>java.lang.ref.Cleaner</code> (Java 9+, dựng trên phantom reference) chỉ làm lưới an toàn cho tài nguyên native.","<b>Quy trình chẩn đoán thực tế.</b> Đo trước rồi mới sửa: bật <code>-Xlog:gc*</code> và xem old gen sau full GC có tăng đơn điệu không; lấy heap dump (<code>-XX:+HeapDumpOnOutOfMemoryError</code> hoặc <code>jcmd &lt;pid&gt; GC.heap_dump</code>); mở bằng Eclipse MAT và dùng báo cáo <i>Leak Suspects</i> cùng <i>dominator tree</i> để tìm đường tham chiếu giữ object sống. Việc tăng <code>-Xmx</code> chỉ làm sự cố xảy ra muộn hơn, không sửa được leak."],"example":"// LEAK: thread trong pool sống mãi nên value của ThreadLocal không bao giờ được dọn\nprivate static final ThreadLocal<Context> CTX = new ThreadLocal<>();\n\npublic void handle(Request r) {\n    CTX.set(new Context(r));\n    try {\n        process();\n    } finally {\n        CTX.remove();       // BẮT BUỘC, nếu không sẽ rò rỉ theo từng request\n    }\n}\n\n// LEAK: cache static không giới hạn, biến static là GC root\nprivate static final Map<String, byte[]> CACHE = new HashMap<>();\n\n// Đúng: cache có giới hạn và chính sách hết hạn rõ ràng\nprivate static final Cache<String, byte[]> CACHE2 =\n    Caffeine.newBuilder().maximumSize(10_000)\n            .expireAfterWrite(Duration.ofMinutes(10)).build();\n\n// Thay finalize() bằng Cleaner (Java 9+) cho tài nguyên native\nprivate static final Cleaner CLEANER = Cleaner.create();\n\nclass NativeHandle implements AutoCloseable {\n    private final Cleaner.Cleanable cleanable;\n    NativeHandle(long ptr) {\n        this.cleanable = CLEANER.register(this, () -> free(ptr)); // KHÔNG bắt this\n    }\n    public void close() { cleanable.clean(); }\n}","exampleTitle":"Leak điển hình và cách thay thế finalize()","keyPoints":["Dấu hiệu leak thật là old gen sau mỗi full GC tăng đơn điệu, không phải heap dao động lên xuống.","Bốn nguồn leak kinh điển: static collection, listener không gỡ, ThreadLocal trong thread pool, ClassLoader leak khi redeploy.","ThreadLocalMap giữ key là weak reference nhưng value là strong — bắt buộc gọi remove() trong finally.","Soft reference chắc chắn bị clear trước khi ném OutOfMemoryError; weak reference bị clear ngay ở kỳ GC kế tiếp.","finalize() deprecate từ Java 9, deprecate-for-removal ở Java 18 (JEP 421); thay bằng try-with-resources, dùng Cleaner làm lưới an toàn."],"trap":"Lambda truyền vào Cleaner.register() tuyệt đối không được tham chiếu tới this — nếu có, object sẽ luôn strongly reachable từ chính hành động dọn dẹp của nó và không bao giờ bị thu hồi, tức là Cleaner tự tạo ra leak.","followUp":["Vì sao WeakHashMap dùng weak reference ở key mà không phải ở value?","Tăng -Xmx có sửa được memory leak không, và vì sao?","Làm sao phân biệt leak thật với heap chỉ đơn giản là được cấp phát chưa đủ?"]},{"id":"t-8-1","topicId":8,"versions":[8,11,17,21],"title":"Lambda không phải anonymous inner class","summary":"Compiler dịch lambda bằng invokedynamic chứ không sinh một class con như anonymous class — và điều đó thay đổi cả số file .class lẫn cách bạn debug.","sections":["<b>Anonymous class sinh ra file .class thật.</b> Khi bạn viết <code>new Runnable(){...}</code> trong class <code>Outer</code>, javac tạo ra một class riêng biệt tên <code>Outer$1</code> và ghi nó thành một file <code>.class</code> nằm cạnh <code>Outer.class</code>. Mỗi anonymous class là một kiểu độc lập, được nạp bởi class loader như mọi class bình thường, và có chi phí metadata riêng trong metaspace.","<b>Lambda thì không.</b> Thân lambda được javac dịch thành một <i>method synthetic</i> nằm ngay trong class chứa nó, thường có tên dạng <code>lambda$run$0</code>. Điểm gọi lambda không phải lệnh <code>new</code> mà là một lệnh <code>invokedynamic</code>. Nghĩa là sau khi biên dịch, số file <code>.class</code> sinh thêm cho lambda là <b>không</b>.","<b>LambdaMetafactory làm gì lúc runtime.</b> Lần đầu chạy tới lệnh <code>invokedynamic</code>, JVM gọi bootstrap method <code>LambdaMetafactory.metafactory</code>. Nó sinh ra một class hiện thực interface đích ngay trong bộ nhớ (từ Java 15 dùng hidden class), rồi gắn kết quả vào call site. Các lần chạy sau đi thẳng qua call site đã liên kết, không phải sinh lại gì.","<b>Vì sao thiết kế như vậy.</b> Java 8 muốn giữ quyền thay đổi chiến lược cài đặt lambda mà không phải đổi bytecode đã biên dịch. Nếu lambda được dịch cứng thành anonymous class, mọi cải tiến sau này (chia sẻ instance, hidden class, tối ưu JIT) sẽ bị khoá lại trong file <code>.class</code> của người dùng. <code>invokedynamic</code> đẩy quyết định đó xuống runtime.","<b>Hệ quả thực tế bạn cảm nhận được.</b> Ứng dụng có hàng nghìn lambda tốn thêm thời gian khởi động lần đầu cho bootstrap (chi phí link call site), đổi lại giảm số class nạp từ đĩa. Lambda <i>không capture</i> gì thường được OpenJDK trả về cùng một instance mỗi lần đánh giá; còn lambda có capture thì thường phải tạo object mới. Đây là chi tiết cài đặt của JDK — JLS nói rõ identity của object lambda là <b>không xác định</b>, nên đừng bao giờ so sánh lambda bằng <code>==</code>.","<b>Debug và stack trace.</b> Vì thân lambda là method synthetic, stack trace hiện tên kiểu <code>Outer.lambda$run$0</code> cộng thêm vài frame của <code>LambdaMetafactory</code>. Đây là lý do stack trace trong pipeline stream thường dài và khó đọc hơn code vòng lặp thường."],"example":"public class Outer {\n    private String tag = \"outer\";\n\n    void run() {\n        Runnable lambda = () -> System.out.println(tag);      // invokedynamic\n        Runnable anon = new Runnable() {                       // new Outer$1()\n            public void run() { System.out.println(tag); }\n        };\n        lambda.run();\n        anon.run();\n    }\n}\n\n// Sau khi javac biên dịch, thư mục đầu ra có:\n//   Outer.class      (chứa cả method synthetic lambda$run$0)\n//   Outer$1.class    (anonymous class)\n// -> KHÔNG có file .class nào cho lambda","exampleTitle":"Cùng một hành vi, hai cách dịch hoàn toàn khác nhau","keyPoints":["Lambda dịch thành method synthetic trong class chứa nó + một lệnh invokedynamic, không sinh file .class","Anonymous class sinh file Outer$1.class riêng và luôn tạo object mới bằng lệnh new","LambdaMetafactory sinh class hiện thực lúc runtime và liên kết vào call site, chỉ một lần cho mỗi call site","JLS không đảm bảo identity của object lambda — không so sánh bằng ==","Anonymous class hỗ trợ nhiều abstract method và có state riêng; lambda chỉ dùng được với functional interface"],"trap":"Nhiều người trả lời lambda chỉ là đường cú pháp cho anonymous inner class. Người phỏng vấn sẽ vặn lại bằng câu hỏi số file .class sinh ra, hoặc bằng câu hỏi this trỏ vào đâu — cả hai đều cho thấy hai cơ chế khác hẳn nhau.","followUp":["Tại sao Java chọn invokedynamic thay vì dịch lambda thành anonymous class ngay lúc biên dịch?","Lambda không capture biến nào có được tái sử dụng cùng một instance không? Điều đó có được spec đảm bảo không?","Lambda có thể hiện thực một interface có hai abstract method không? Vì sao?"]},{"id":"t-8-2","topicId":8,"versions":[8,11,17,21],"title":"Effectively final: vì sao lambda chỉ capture được biến không đổi","summary":"Biến local nằm trên stack và biến mất khi method trả về, còn lambda có thể sống lâu hơn — đó là gốc rễ của luật effectively final.","sections":["<b>Luật.</b> Lambda (và cả anonymous class) chỉ được tham chiếu tới biến local nếu biến đó là <code>final</code> hoặc <i>effectively final</i> — nghĩa là được gán đúng một lần và không bao giờ gán lại. Trước Java 8 bạn phải viết <code>final</code> tường minh; từ Java 8 compiler tự suy ra.","<b>Lý do nằm ở nơi lưu biến.</b> Biến local sống trong stack frame của method. Khi method trả về, frame bị huỷ. Nhưng object lambda nằm trên heap và hoàn toàn có thể được trả về, đưa vào listener, hay đẩy sang thread khác — nó sống lâu hơn frame đã sinh ra nó. Vì vậy giá trị biến phải được <b>sao chép</b> vào lambda tại thời điểm tạo, chứ không thể trỏ tới ô nhớ trên stack.","<b>Đã sao chép thì phải cấm gán lại.</b> Nếu Java cho phép sửa biến sau khi lambda đã copy, sẽ có hai bản giá trị lệch nhau và không có cách nào định nghĩa ngữ nghĩa hợp lý. Java chọn cách đơn giản nhất: cấm luôn ở compile time. Đây là <i>capture by value</i>, khác với ngôn ngữ như C# vốn nâng biến lên heap để capture by reference.","<b>Effectively final không có nghĩa là bất biến.</b> Ràng buộc chỉ áp lên <i>reference</i>, không áp lên object mà reference trỏ tới. Một <code>List</code> khai báo và gán một lần vẫn được <code>add()</code> thoải mái trong lambda. Đây chính là kẽ hở mà nhiều người dùng để lách luật (dùng mảng một phần tử hay <code>AtomicInteger</code> làm biến đếm) — chạy được nhưng thường là dấu hiệu bạn đang viết vòng lặp bằng lambda.","<b>Field không bị ràng buộc này.</b> Field instance và field static nằm trên heap, không biến mất theo stack frame, nên lambda tham chiếu chúng qua <code>this</code> hoặc qua tên class và được phép sửa tự do. Đây là lý do nhiều người bối rối khi thấy sửa field trong lambda thì được mà sửa biến local thì không.","<b>Biến của vòng lặp.</b> Biến điều khiển của <code>for (int i = 0; ...; i++)</code> bị gán lại mỗi vòng nên không effectively final — không capture được. Ngược lại, biến của <code>for (String s : list)</code> được coi là một biến mới ở mỗi lần lặp và luôn effectively final, nên capture được bình thường. Khác biệt này rất hay được đem ra hỏi."],"example":"void demo(List<String> names) {\n    int count = 0;\n    names.forEach(n -> count++);          // LỖI BIÊN DỊCH: count không effectively final\n\n    List<String> upper = new ArrayList<>();\n    names.forEach(n -> upper.add(n.toUpperCase())); // OK: reference không đổi, nội dung đổi\n\n    for (int i = 0; i < 3; i++) {\n        Runnable r = () -> System.out.println(i);   // LỖI: i bị gán lại mỗi vòng\n    }\n\n    for (String s : names) {\n        Runnable r = () -> System.out.println(s);   // OK: s là biến mới mỗi vòng lặp\n    }\n}","exampleTitle":"Cái gì capture được, cái gì không","keyPoints":["Biến local được capture theo giá trị (copy) vì stack frame có thể biến mất trước lambda","Effectively final ràng buộc reference chứ không ràng buộc trạng thái của object được trỏ tới","Field instance/static không chịu ràng buộc này vì chúng nằm trên heap","Biến của for-each effectively final; biến điều khiển của for cổ điển thì không","Dùng mảng 1 phần tử hoặc AtomicInteger để lách luật là code smell, trừ khi thật sự cần cộng dồn thread-safe"],"trap":"Câu trả lời sơ sài là 'để đảm bảo thread-safe'. Đó chỉ là hệ quả phụ. Lý do gốc là vòng đời: lambda trên heap có thể sống lâu hơn stack frame, nên buộc phải copy giá trị, và đã copy thì phải cấm gán lại để tránh hai bản giá trị lệch nhau.","followUp":["Vì sao capture một List rồi gọi add() trong lambda lại hợp lệ?","Tại sao biến của for-each capture được còn biến i của for cổ điển thì không?","Nếu cần cộng dồn một giá trị trong forEach song song thì nên dùng gì thay cho biến local?"]},{"id":"t-8-3","topicId":8,"versions":[8,11,17,21],"title":"this trong lambda và rủi ro memory leak","summary":"Trong lambda, this trỏ tới object bao ngoài; trong anonymous class, this trỏ tới chính nó — và khác biệt đó có thể giữ sống cả một object nặng.","sections":["<b>Lambda không tạo scope mới cho this.</b> Lambda là một <i>lexical scope</i>: <code>this</code>, <code>super</code> và tên biến bên trong nó mang đúng nghĩa như ở dòng code bao quanh. Vì thân lambda được dịch thành method của chính class bao ngoài, <code>this</code> tất nhiên là instance của class bao ngoài.","<b>Anonymous class thì ngược lại.</b> Nó là một class thật, có instance riêng, nên <code>this</code> bên trong trỏ tới object anonymous đó. Muốn lấy object bao ngoài phải viết <code>Outer.this</code>. Đây là điểm khác biệt được hỏi nhiều nhất khi so sánh hai cấu trúc.","<b>Hệ quả về che tên (shadowing).</b> Anonymous class được phép khai báo field và biến trùng tên với biến của method bao ngoài, che đi bản bên ngoài. Lambda thì <b>không</b>: khai báo lại một tên đã tồn tại trong scope bao ngoài là lỗi biên dịch. Điều này khiến lambda dễ đọc hơn nhưng cũng khiến việc chuyển đổi qua lại giữa hai dạng không phải lúc nào cũng thuần cơ học.","<b>Capture ngầm this là nguồn memory leak.</b> Trong lambda, viết <code>counter</code> thực chất là <code>this.counter</code>. Nghĩa là lambda giữ một tham chiếu mạnh tới toàn bộ object bao ngoài, kể cả những field khổng lồ mà nó không hề dùng. Nếu lambda đó được đăng ký vào một listener registry, một cache tĩnh hay một scheduler sống lâu, cả object bao ngoài sẽ không bao giờ được GC.","<b>Cách chữa.</b> Copy giá trị cần dùng ra một biến local trước rồi mới capture biến local đó — khi ấy lambda chỉ giữ giá trị chứ không giữ <code>this</code>. Nếu lambda không tham chiếu gì tới instance bao ngoài, javac còn sinh method synthetic dạng <code>static</code>, và lambda trở thành non-capturing, thường được tái sử dụng cùng một instance.","<b>Nhận diện khi review code.</b> Bất kỳ lambda nào được lưu vào một collection sống lâu, một event bus, hay một <code>ScheduledExecutorService</code> đều đáng bị soi xem có tham chiếu field instance không. Trong Android và các ứng dụng có vòng đời rõ ràng, đây là nguyên nhân leak kinh điển; trên server thì thường lộ ra dưới dạng metaspace/heap tăng dần sau mỗi lần redeploy."],"example":"class Heavy {\n    private final byte[] buffer = new byte[64 * 1024 * 1024];\n    private int version = 7;\n\n    // XẤU: lambda đọc field 'version' => capture this => giữ luôn buffer 64MB\n    Supplier<Integer> leaky() {\n        return () -> version;\n    }\n\n    // TỐT: copy ra biến local, lambda chỉ giữ một int\n    Supplier<Integer> safe() {\n        int snapshot = version;\n        return () -> snapshot;\n    }\n}\n\nclass Outer {\n    void demo() {\n        Runnable lambda = () -> System.out.println(this);           // this = Outer\n        Runnable anon = new Runnable() {\n            public void run() {\n                System.out.println(this);                            // this = Outer$1\n                System.out.println(Outer.this);                      // muốn Outer phải viết rõ\n            }\n        };\n    }\n}","exampleTitle":"Capture ngầm this và cách tránh","keyPoints":["this trong lambda = instance bao ngoài; this trong anonymous class = chính object anonymous","Lambda không tạo scope mới nên không được khai báo biến trùng tên với scope bao ngoài","Đọc một field instance trong lambda tương đương this.field, tức là capture cả object bao ngoài","Lambda sống lâu (listener, cache, scheduler) mà capture this là nguyên nhân leak phổ biến","Copy field ra biến local trước khi capture để cắt tham chiếu tới this"],"trap":"Câu hỏi vặn kinh điển: in this bên trong lambda và bên trong anonymous class đặt cạnh nhau, hỏi kết quả. Nhiều người trả lời cả hai đều là object bao ngoài, hoặc cả hai đều là object bên trong.","followUp":["Vì sao lambda không được khai báo biến trùng tên với biến của method bao ngoài?","Làm sao biết một lambda có capture this hay không mà không cần đọc bytecode?","Lambda capture this rồi đăng ký vào một static registry — hậu quả trên heap là gì?"]},{"id":"t-8-4","topicId":8,"versions":[8,11,17,21],"title":"Functional interface: bốn nhóm gốc, biến thể primitive và @FunctionalInterface","summary":"java.util.function có hơn 40 interface nhưng thực chất chỉ là bốn hình dạng gốc nhân với các biến thể tránh boxing.","sections":["<b>Bốn hình dạng gốc.</b> <code>Function&lt;T,R&gt;</code> nhận một giá trị và trả về một giá trị; <code>Predicate&lt;T&gt;</code> nhận một giá trị và trả về <code>boolean</code>; <code>Consumer&lt;T&gt;</code> nhận một giá trị và không trả gì; <code>Supplier&lt;T&gt;</code> không nhận gì và trả về một giá trị. Mọi interface còn lại trong gói đều là biến tấu của bốn dạng này theo số tham số (<code>BiFunction</code>, <code>BiPredicate</code>, <code>BiConsumer</code>) hoặc theo kiểu (<code>UnaryOperator</code>, <code>BinaryOperator</code> là <code>Function</code> có tham số và kết quả cùng kiểu).","<b>Biến thể primitive tồn tại vì generic không nhận primitive.</b> <code>Function&lt;Integer,Integer&gt;</code> buộc mọi giá trị phải là object <code>Integer</code>, nghĩa là mỗi lần gọi có thể phải boxing và unboxing. Với vòng lặp hàng triệu phần tử, đó là hàng triệu object rác trên heap. Vì vậy JDK cung cấp <code>IntPredicate</code>, <code>IntUnaryOperator</code>, <code>ToIntFunction&lt;T&gt;</code>, <code>IntFunction&lt;R&gt;</code>, <code>ObjIntConsumer&lt;T&gt;</code>... cho ba kiểu <code>int</code>, <code>long</code>, <code>double</code>.","<b>Đọc tên interface theo quy tắc.</b> Tiền tố kiểu (<code>Int</code>, <code>Long</code>, <code>Double</code>) nói về <b>tham số vào</b>; tiền tố <code>To</code> nói về <b>kiểu trả về</b>. Vậy <code>IntFunction&lt;R&gt;</code> nhận <code>int</code> trả về <code>R</code>, còn <code>ToIntFunction&lt;T&gt;</code> nhận <code>T</code> trả về <code>int</code>. <code>IntToLongFunction</code> thì cả hai đều primitive. Nhớ quy tắc này là đủ để không phải tra tài liệu.","<b>@FunctionalInterface chỉ là kiểm tra của compiler.</b> Nó không tạo ra khả năng gì; bất kỳ interface nào có đúng một abstract method đều dùng được với lambda dù không gắn annotation. Giá trị của annotation là ngăn người khác vô tình thêm abstract method thứ hai và phá vỡ mọi lambda đang dùng interface đó.","<b>Cái gì không tính là abstract method.</b> <code>default</code> method có thân hàm nên không tính. <code>static</code> method và <code>private</code> method (Java 9+) cũng không. Đặc biệt, abstract method có chữ ký trùng với method <code>public</code> của <code>Object</code> — như <code>equals(Object)</code>, <code>hashCode()</code>, <code>toString()</code> — <b>cũng không tính</b>, vì mọi object đều đã có sẵn cài đặt. Đó là lý do <code>Comparator</code> vẫn là functional interface dù khai báo cả <code>compare</code> lẫn <code>equals</code>.","<b>Khi nào tự định nghĩa functional interface.</b> Khi bạn cần một chữ ký JDK không có (ví dụ ba tham số, hoặc method được phép ném checked exception), hoặc khi cái tên mang nghĩa nghiệp vụ quan trọng hơn hình dạng — <code>PriceRule</code> đọc rõ hơn <code>BiFunction&lt;Order, Customer, BigDecimal&gt;</code>. Ngoài hai lý do đó, dùng lại interface có sẵn để tương thích với các method <code>andThen</code>, <code>compose</code>, <code>negate</code> đã viết sẵn."],"example":"// Boxing: mỗi lần apply tạo/mở một Integer\nFunction<Integer, Integer> boxed = x -> x * 2;\n\n// Không boxing\nIntUnaryOperator prim = x -> x * 2;\nToIntFunction<String> len = String::length;\nIntFunction<String> repeat = n -> \"x\".repeat(n);\n\n// Hợp lệ: default + static + method trùng chữ ký của Object đều không tính là abstract\n@FunctionalInterface\ninterface Validator {\n    boolean test(String s);                      // abstract duy nhất\n    default Validator negate() { return s -> !test(s); }\n    static Validator alwaysTrue() { return s -> true; }\n    @Override boolean equals(Object o);          // không tính\n    @Override String toString();                 // không tính\n}","exampleTitle":"Biến thể primitive và luật đếm abstract method","keyPoints":["Bốn hình dạng gốc: Function, Predicate, Consumer, Supplier — phần còn lại là biến tấu","Tiền tố Int/Long/Double chỉ kiểu tham số; tiền tố To chỉ kiểu trả về","Biến thể primitive tồn tại để tránh boxing, đáng dùng khi khối lượng dữ liệu lớn","@FunctionalInterface chỉ là guard của compiler, không bắt buộc để lambda hoạt động","default, static, private và method trùng chữ ký public của Object đều không tính là abstract method"],"trap":"Đưa ra một interface có ba method — một abstract, một default, một khai báo lại toString() — rồi hỏi có gắn @FunctionalInterface được không. Đáp án là được, nhưng rất nhiều người đếm nhầm thành ba abstract method.","followUp":["Vì sao Comparator vẫn là functional interface dù khai báo cả compare lẫn equals?","Khi nào biến thể primitive thực sự đáng dùng, và khi nào là tối ưu sớm?","Functional interface có method ném checked exception thì dùng trong stream thế nào?"]},{"id":"t-8-5","topicId":8,"versions":[8,11,17,21],"title":"Method reference: bốn dạng và bẫy Comparator","summary":"Cùng cú pháp :: nhưng bốn dạng method reference có chữ ký hoàn toàn khác nhau — hiểu sai là chọn nhầm functional interface.","sections":["<b>Dạng 1 — static method: <code>ClassName::staticMethod</code>.</b> Tham số của lambda trở thành tham số của method. <code>Integer::parseInt</code> tương đương <code>s -&gt; Integer.parseInt(s)</code>, khớp <code>Function&lt;String,Integer&gt;</code> hoặc <code>ToIntFunction&lt;String&gt;</code>.","<b>Dạng 2 — instance method của một object cụ thể: <code>expr::method</code>.</b> Receiver đã cố định từ trước, nên tham số của lambda chính là tham số của method. <code>System.out::println</code> tương đương <code>x -&gt; System.out.println(x)</code>. Lưu ý biểu thức <code>expr</code> được đánh giá <b>ngay tại lúc tạo</b> method reference, không phải lúc gọi — nếu sau đó biến trỏ sang object khác, method reference vẫn giữ object cũ.","<b>Dạng 3 — instance method của một object tuỳ ý thuộc một kiểu: <code>ClassName::instanceMethod</code>.</b> Đây là dạng gây nhầm nhất: tham số <b>đầu tiên</b> của lambda trở thành receiver, các tham số còn lại mới là tham số của method. <code>String::length</code> tương đương <code>s -&gt; s.length()</code> nên khớp <code>Function&lt;String,Integer&gt;</code>; còn <code>String::compareTo</code> tương đương <code>(a,b) -&gt; a.compareTo(b)</code> nên khớp <code>Comparator&lt;String&gt;</code>.","<b>Dạng 4 — constructor: <code>ClassName::new</code>.</b> Khớp với functional interface có kiểu trả về là class đó, số tham số quyết định constructor nào được chọn. <code>ArrayList::new</code> có thể là <code>Supplier&lt;List&lt;T&gt;&gt;</code> (constructor rỗng) hoặc <code>IntFunction&lt;List&lt;T&gt;&gt;</code> (constructor nhận capacity), tuỳ kiểu đích. Mảng cũng có dạng riêng: <code>String[]::new</code>.","<b>Bẫy <code>String::length</code> vs <code>str::length</code>.</b> Hai biểu thức chỉ khác nhau ở chỗ vế trái là tên class hay một biến, nhưng chữ ký hoàn toàn khác: <code>String::length</code> là dạng 3, nhận một <code>String</code> và trả <code>int</code>; <code>str::length</code> là dạng 2, <b>không nhận tham số nào</b> và trả <code>int</code>, tức là một <code>Supplier&lt;Integer&gt;</code> / <code>IntSupplier</code>. Đây là câu vặn rất hay gặp.","<b>Comparator.comparing và bẫy reversed().</b> <code>Comparator.comparing(Person::getName).thenComparing(Person::getAge).reversed()</code> — <code>reversed()</code> gói <b>toàn bộ</b> comparator đã ghép lại và đảo ngược tất cả tiêu chí, chứ không chỉ tiêu chí cuối. Muốn chỉ đảo một tiêu chí, phải viết <code>thenComparing(Comparator.comparing(Person::getAge).reversed())</code>. Ngoài ra, khi so sánh khoá số nên dùng <code>comparingInt</code>/<code>comparingLong</code>/<code>comparingDouble</code> để tránh boxing ở mỗi phép so sánh — sort là nơi hàm so sánh được gọi O(n log n) lần."],"example":"// 1. static\nFunction<String, Integer> f1 = Integer::parseInt;\n\n// 2. instance của object cụ thể — receiver cố định\nString s = \"hello\";\nSupplier<Integer> f2 = s::length;              // KHÔNG nhận tham số\n\n// 3. instance của object tuỳ ý thuộc kiểu String — tham số đầu là receiver\nFunction<String, Integer> f3 = String::length; // nhận 1 tham số\nComparator<String> f4 = String::compareTo;     // nhận 2 tham số\n\n// 4. constructor\nSupplier<List<String>> f5 = ArrayList::new;\nIntFunction<String[]> f6 = String[]::new;\n\n// Bẫy reversed(): đảo cả name lẫn age\nComparator<Person> all = Comparator.comparing(Person::getName)\n                                   .thenComparing(Person::getAge)\n                                   .reversed();\n\n// Chỉ đảo age, giữ name tăng dần\nComparator<Person> onlyAge = Comparator.comparing(Person::getName)\n        .thenComparing(Comparator.comparingInt(Person::getAge).reversed());","exampleTitle":"Bốn dạng và hai bẫy hay bị hỏi","keyPoints":["Bốn dạng: static, instance của object cụ thể, instance của kiểu tuỳ ý, constructor","Ở dạng 3, tham số đầu tiên của lambda đóng vai receiver — nguồn nhầm lẫn lớn nhất","String::length nhận 1 tham số, str::length nhận 0 tham số","expr::method đánh giá expr ngay lúc tạo method reference, không phải lúc gọi","reversed() đảo toàn bộ chuỗi comparator; comparingInt tránh boxing trong sort"],"trap":"Integer::toString là lỗi biên dịch ambiguous khi kiểu đích là Function<Integer,String>, vì vừa khớp static Integer.toString(int) (dạng 1) vừa khớp instance Integer.toString() (dạng 3). Khi gặp trường hợp này phải viết lambda tường minh hoặc dùng String::valueOf.","followUp":["Giải thích vì sao Comparator<String> nhận được String::compareTo dù compareTo chỉ có một tham số?","reversed() đặt sau thenComparing thì đảo cái gì?","Vì sao nên dùng comparingInt thay vì comparing khi khoá sắp xếp là int?"]},{"id":"t-9-1","topicId":9,"versions":[8,11,17,21],"title":"Stream là lazy: không có terminal operation thì không có gì chạy","summary":"Intermediate operation chỉ dựng mô tả pipeline; toàn bộ công việc thật chỉ xảy ra khi terminal operation được gọi.","sections":["<b>Hai loại operation.</b> <i>Intermediate</i> (<code>filter</code>, <code>map</code>, <code>sorted</code>, <code>peek</code>, <code>limit</code>...) trả về một <code>Stream</code> mới và <b>không</b> xử lý phần tử nào. <i>Terminal</i> (<code>forEach</code>, <code>collect</code>, <code>reduce</code>, <code>count</code>, <code>findFirst</code>, <code>anyMatch</code>...) trả về kết quả hoặc <code>void</code> và là thứ duy nhất kích hoạt việc duyệt dữ liệu.","<b>Lazy nghĩa là gì về mặt cài đặt.</b> Mỗi intermediate operation gắn thêm một tầng vào một chuỗi <code>Sink</code>. Khi terminal operation chạy, JDK gấp toàn bộ chuỗi đó lại thành một hàm duy nhất rồi mới kéo dữ liệu từ <code>Spliterator</code> của nguồn. Vì vậy pipeline không có terminal operation là code chết — nó chỉ tạo vài object nhỏ rồi thôi.","<b>Thứ tự thực thi là theo TỪNG PHẦN TỬ, không phải theo từng tầng.</b> Đây là điểm gây bất ngờ nhiều nhất. Với <code>stream().filter(f).map(m).forEach(p)</code>, output không phải là 'chạy hết filter cho mọi phần tử rồi mới chạy map', mà là <code>f(a), m(a), p(a), f(b), m(b), p(b)...</code>. Mỗi phần tử đi hết chiều sâu pipeline rồi mới tới phần tử tiếp theo. Người ta hay đặt <code>peek</code> vào để debug rồi bối rối vì log không đúng như tưởng tượng.","<b>Hệ quả lớn nhất là fusion.</b> Vì các tầng được gộp thành một lần duyệt, pipeline nhiều bước <b>không</b> tạo ra nhiều collection trung gian như khi bạn viết ba vòng <code>for</code> và ba <code>ArrayList</code>. Đó là lợi ích hiệu năng thật của stream, và nó cũng cho phép short-circuit: <code>findFirst</code> hay <code>anyMatch</code> dừng ngay khi có kết quả, nên các phần tử phía sau không bao giờ được đụng tới.","<b>Ngoại lệ: operation có trạng thái là hàng rào.</b> <code>sorted()</code> và <code>distinct()</code> phải nhìn thấy dữ liệu trước khi phát tiếp — <code>sorted()</code> buộc phải gom toàn bộ phần tử vào bộ đệm mới sắp xếp được. Đặt <code>sorted()</code> trước <code>filter()</code> là lỗi hiệu năng phổ biến: bạn sắp xếp cả những phần tử sắp bị loại bỏ. Nguyên tắc là đẩy <code>filter</code> lên sớm nhất có thể và để <code>sorted</code> càng muộn càng tốt.","<b>Lazy còn nghĩa là stream đọc nguồn muộn.</b> Nếu bạn tạo stream từ một <code>List</code> rồi sửa <code>List</code> đó <i>trước khi</i> gọi terminal operation, phần lớn nguồn trong JDK sẽ nhìn thấy dữ liệu mới hoặc ném <code>ConcurrentModificationException</code> lúc duyệt. Nói cách khác, stream không chụp ảnh dữ liệu tại thời điểm tạo."],"example":"List<String> names = List.of(\"an\", \"binh\", \"cuong\");\n\n// Không in gì cả — chưa có terminal operation\nStream<String> s = names.stream()\n        .filter(n -> { System.out.println(\"filter \" + n); return n.length() > 2; })\n        .map(n -> { System.out.println(\"map \" + n); return n.toUpperCase(); });\nSystem.out.println(\"--- chua chay ---\");\n\n// Bây giờ mới chạy, và chạy theo TỪNG PHẦN TỬ — output thực tế (có cả dòng do forEach in):\n// filter an / filter binh / map binh / BINH / filter cuong / map cuong / CUONG\ns.forEach(System.out::println);\n\n// Đặt sai thứ tự: sắp xếp 1 triệu phần tử rồi mới bỏ đi 999.000\nlist.stream().sorted().filter(x -> x.isActive()).toList();\n// Đúng: lọc trước, sắp xếp sau\nlist.stream().filter(x -> x.isActive()).sorted().toList();","exampleTitle":"Lazy, thứ tự theo phần tử, và vị trí của sorted","keyPoints":["Intermediate operation chỉ dựng pipeline; chỉ terminal operation mới kích hoạt duyệt dữ liệu","Thực thi theo từng phần tử đi hết chiều sâu pipeline, không phải theo từng tầng","Fusion giúp pipeline nhiều bước vẫn chỉ duyệt một lần và không tạo collection trung gian","sorted() và distinct() là stateful barrier — nên đặt filter trước sorted","Stream không chụp ảnh dữ liệu lúc tạo; nó đọc nguồn tại thời điểm terminal operation chạy"],"trap":"Đặt peek() để debug rồi kết luận sai về thứ tự thực thi. Cũng phổ biến không kém: viết một pipeline dài với peek/map có side effect nhưng quên terminal operation, code im lặng không làm gì và không hề báo lỗi.","followUp":["Vì sao đặt filter trước sorted lại quan trọng hơn là chỉ chuyện thẩm mỹ?","Nếu sửa List nguồn sau khi tạo stream nhưng trước khi collect thì chuyện gì xảy ra?","Operation nào là stateful, và vì sao chúng cản trở short-circuit?"]},{"id":"t-9-2","topicId":9,"versions":[8,11,17,21],"title":"Stream chỉ dùng được một lần, short-circuit và stream vô hạn","summary":"Stream không phải collection: nó có trạng thái tiêu thụ, và chính điều đó cho phép nó làm việc với nguồn vô hạn.","sections":["<b>Một stream chỉ đi qua đúng một terminal operation.</b> Bên trong <code>AbstractPipeline</code> có cờ <code>linkedOrConsumed</code>. Gọi terminal operation lần thứ hai — hoặc gắn thêm intermediate operation vào một stream đã dùng — sẽ ném <code>IllegalStateException: stream has already been operated upon or closed</code>. Lý do là stream không lưu dữ liệu; nó chỉ là một con trỏ tiêu thụ trên nguồn.","<b>Cách dùng lại đúng.</b> Đừng lưu <code>Stream</code> vào biến hay field để tái sử dụng. Hãy lưu <b>nguồn</b> (một <code>Collection</code>) và gọi <code>.stream()</code> mỗi lần cần, hoặc lưu một <code>Supplier&lt;Stream&lt;T&gt;&gt;</code> và gọi <code>get()</code> để có stream mới. Đây cũng là lý do method trả về <code>Stream</code> trong API công khai phải ghi rõ rằng người gọi chỉ tiêu thụ được một lần.","<b>Short-circuit operation.</b> <code>findFirst</code>, <code>findAny</code>, <code>anyMatch</code>, <code>allMatch</code>, <code>noneMatch</code> là terminal short-circuit: chúng dừng ngay khi biết được kết quả. <code>limit(n)</code> và <code>takeWhile</code> (Java 9+) là intermediate short-circuit: chúng cắt luồng dữ liệu ở giữa pipeline. Nhờ tính lazy, các phần tử phía sau điểm dừng không bao giờ được sinh ra.","<b>Stream vô hạn chỉ an toàn khi có short-circuit.</b> <code>Stream.iterate(seed, f)</code> và <code>Stream.generate(supplier)</code> tạo nguồn không có điểm kết thúc. Chúng dùng được vì lazy: <code>Stream.iterate(1, x -&gt; x*2).limit(10)</code> chỉ sinh đúng 10 phần tử. Nhưng nếu quên <code>limit</code>, hoặc đặt một operation stateful như <code>sorted()</code> vào giữa, chương trình sẽ treo hoặc <code>OutOfMemoryError</code> — vì <code>sorted()</code> phải chờ hết dữ liệu mà dữ liệu thì không bao giờ hết.","<b>Từ Java 9 có dạng iterate ba tham số.</b> <code>Stream.iterate(seed, hasNext, next)</code> mang điều kiện dừng vào ngay trong nguồn, đọc giống hệt vòng <code>for</code> và an toàn hơn hẳn. Java 9 cũng thêm <code>takeWhile</code> (lấy tới khi điều kiện sai lần đầu) và <code>dropWhile</code> (bỏ tới khi điều kiện sai lần đầu) — khác <code>filter</code> ở chỗ chúng dừng dựa trên <b>vị trí</b> chứ không kiểm tra từng phần tử tới cuối.","<b>Stream cần đóng thì phải đóng.</b> Phần lớn stream từ collection không giữ tài nguyên nên không cần <code>close()</code>. Nhưng stream từ I/O như <code>Files.lines(path)</code> hay <code>Files.walk(path)</code> giữ file handle và phải đặt trong <code>try-with-resources</code>, nếu không sẽ rò rỉ descriptor — lỗi này thường chỉ lộ ra khi hệ thống chạy đủ lâu."],"example":"Stream<String> s = List.of(\"a\", \"b\").stream();\nlong n = s.count();\nList<String> l = s.collect(Collectors.toList()); // IllegalStateException\n\n// Đúng: giữ Supplier chứ không giữ Stream\nSupplier<Stream<String>> src = () -> List.of(\"a\", \"b\").stream();\nlong n2 = src.get().count();\nList<String> l2 = src.get().collect(Collectors.toList());\n\n// Vô hạn + short-circuit: an toàn\nList<Integer> pow = Stream.iterate(1, x -> x * 2).limit(10).collect(Collectors.toList());\n\n// Vô hạn + stateful barrier: TREO / OOM\n// Stream.iterate(1, x -> x + 1).sorted().findFirst();\n\n// Java 9+: điều kiện dừng nằm trong nguồn\n// Stream.iterate(1, x -> x <= 1024, x -> x * 2)\n\n// Stream từ I/O bắt buộc đóng\ntry (Stream<String> lines = Files.lines(Path.of(\"data.txt\"))) {\n    lines.filter(x -> !x.isBlank()).forEach(System.out::println);\n}","exampleTitle":"Tiêu thụ một lần, short-circuit và nguồn vô hạn","keyPoints":["Dùng lại stream đã tiêu thụ ném IllegalStateException — hãy giữ nguồn hoặc Supplier<Stream<T>>","findFirst/findAny/anyMatch/allMatch/noneMatch là terminal short-circuit; limit và takeWhile là intermediate short-circuit","Stream vô hạn chỉ an toàn khi pipeline có điểm cắt; sorted/distinct trên nguồn vô hạn sẽ treo hoặc OOM","Java 9 thêm Stream.iterate ba tham số, takeWhile và dropWhile","Stream từ Files.lines/Files.walk giữ file handle và phải nằm trong try-with-resources"],"trap":"Lưu Stream vào một field hay trả Stream ra rồi dùng hai lần. Bẫy nặng hơn: allMatch trên stream rỗng luôn trả về true (vacuous truth) còn anyMatch trả về false — rất hay bị dùng sai trong validation.","followUp":["Vì sao stream lại thiết kế chỉ dùng được một lần thay vì cho phép duyệt lại như Iterable?","allMatch trên một stream rỗng trả về gì, và điều đó ảnh hưởng thế nào tới logic validation?","takeWhile khác filter ở chỗ nào khi dữ liệu không được sắp xếp?"]},{"id":"t-9-3","topicId":9,"versions":[8,11,17,21],"title":"Collector: toList, groupingBy, và các bẫy của toMap","summary":"Collector là nơi phần lớn logic nghiệp vụ của stream nằm — và cũng là nơi có nhiều hành vi ngầm định dễ gây lỗi production nhất.","sections":["<b><code>Collectors.toList()</code> không hứa gì cả.</b> Javadoc ghi rõ: không đảm bảo về kiểu, tính thay đổi được, tính serializable hay thread-safety của <code>List</code> trả về. Trên OpenJDK hiện nay nó trả về <code>ArrayList</code> nên sửa được, nhưng dựa vào điều đó là dựa vào chi tiết cài đặt. Nếu bạn thực sự cần một list sửa được, hãy nói rõ ý định bằng <code>Collectors.toCollection(ArrayList::new)</code>.","<b>Ba lựa chọn 'ra list' và khác biệt thật giữa chúng.</b> <code>Collectors.toUnmodifiableList()</code> (Java 10) trả list bất biến và <b>ném NPE nếu có phần tử null</b>. <code>Stream.toList()</code> (Java 16) cũng trả list bất biến nhưng <b>cho phép null</b>, và ngắn hơn vì không cần <code>collect</code>. Trong code Java 17/21 mới, <code>stream().toList()</code> nên là mặc định, trừ khi bạn cần sửa kết quả về sau.","<b><code>groupingBy</code> và downstream collector.</b> Dạng một tham số trả về <code>Map&lt;K, List&lt;T&gt;&gt;</code> với <code>HashMap</code> làm cài đặt. Dạng hai tham số cho phép thay <code>List&lt;T&gt;</code> bằng bất kỳ collector nào: <code>counting()</code> cho <code>Long</code>, <code>mapping(f, toList())</code> để đổi phần tử, <code>summingInt</code>, <code>averagingDouble</code>, hoặc lồng thêm một <code>groupingBy</code> nữa để có map hai tầng. Dạng ba tham số cho phép chỉ định factory của map, ví dụ <code>TreeMap::new</code> để kết quả có thứ tự.","<b>Bẫy null của groupingBy.</b> Hàm phân loại (classifier) <b>không được trả về null</b> — <code>groupingBy</code> sẽ ném <code>NullPointerException</code>. Đây là lỗi hay gặp khi gom nhóm theo một trường có thể null trong database. Cách xử lý là map giá trị null về một khoá đại diện trước khi gom nhóm.","<b>Bẫy của <code>toMap</code>.</b> Ba thứ dễ nổ: khoá trùng ném <code>IllegalStateException: Duplicate key</code> nếu không truyền merge function; giá trị <code>null</code> ném <code>NullPointerException</code> (vì cài đặt dùng <code>Map.merge</code>), khác hẳn <code>HashMap.put</code> vốn chấp nhận null; và map trả về là <code>HashMap</code> nên không giữ thứ tự — muốn giữ thì truyền thêm <code>LinkedHashMap::new</code> ở tham số thứ tư. Trong code thật, gần như luôn nên truyền merge function tường minh để nói rõ bạn muốn giữ bản nào.","<b><code>partitioningBy</code> khác <code>groupingBy</code> ở một điểm quan trọng.</b> Nó luôn trả về map có <b>đủ cả hai khoá</b> <code>true</code> và <code>false</code>, kể cả khi một bên rỗng — nên gọi <code>get(false)</code> không bao giờ ra null. <code>groupingBy(x -&gt; cond)</code> thì chỉ tạo khoá nào thực sự có phần tử. Khi chỉ cần chia hai nhóm, <code>partitioningBy</code> vừa an toàn hơn vừa nhanh hơn vì nó dùng cài đặt map chuyên biệt hai phần tử."],"example":"// Java 16+: bất biến, cho phép null, ngắn gọn\nList<String> a = stream.toList();\n\n// Java 10+: bất biến, NÉM NPE nếu có phần tử null\nList<String> b = stream.collect(Collectors.toUnmodifiableList());\n\n// Nói rõ ý định khi cần list sửa được\nList<String> c = stream.collect(Collectors.toCollection(ArrayList::new));\n\n// groupingBy + downstream\nMap<Integer, Long> byLen = names.stream()\n        .collect(Collectors.groupingBy(String::length, Collectors.counting()));\n\nMap<Dept, List<String>> namesByDept = emps.stream()\n        .collect(Collectors.groupingBy(Emp::dept,\n                 Collectors.mapping(Emp::name, Collectors.toList())));\n\n// toMap: luôn truyền merge function trong code thật\nMap<String, Integer> m = words.stream()\n        .collect(Collectors.toMap(w -> w, String::length,\n                                  (older, newer) -> older,   // giữ bản đầu\n                                  LinkedHashMap::new));       // giữ thứ tự\n\n// partitioningBy luôn có đủ hai khoá\nMap<Boolean, List<Emp>> p = emps.stream()\n        .collect(Collectors.partitioningBy(e -> e.salary() > 1000));\nint soNguoiLuongThap = p.get(false).size();   // không bao giờ null","exampleTitle":"Chọn đúng collector và tránh ba bẫy của toMap","keyPoints":["Collectors.toList() không đảm bảo mutability — thực tế OpenJDK trả ArrayList nhưng đừng phụ thuộc","Stream.toList() (Java 16+) trả list bất biến và cho phép null; toUnmodifiableList() (Java 10+) ném NPE với null","groupingBy trả HashMap và ném NPE nếu classifier trả null","toMap ném IllegalStateException khi khoá trùng và NPE khi giá trị null","partitioningBy luôn có đủ khoá true và false, an toàn hơn groupingBy khi chỉ chia hai nhóm"],"trap":"Câu vặn hay dùng: Collectors.toList() có sửa được không? Trả lời 'có' là chưa đủ — đúng phải là 'trên OpenJDK hiện tại thì có, nhưng hợp đồng không đảm bảo, còn Stream.toList() thì chắc chắn không sửa được'.","followUp":["Vì sao Collectors.toMap ném NPE với giá trị null trong khi HashMap.put thì không?","Làm sao gom nhóm theo một trường có thể null mà không bị NPE?","Khi nào dùng partitioningBy thay vì groupingBy với một điều kiện boolean?"]},{"id":"t-9-4","topicId":9,"versions":[8,11,17,21],"title":"reduce, side effect và tính đúng đắn của pipeline","summary":"reduce chỉ cho kết quả đúng khi hàm tích luỹ associative và không có trạng thái — và mọi side effect trong lambda của stream đều là mầm bug.","sections":["<b>Ba dạng của <code>reduce</code>.</b> Dạng một tham số <code>reduce(BinaryOperator)</code> trả về <code>Optional</code> vì stream có thể rỗng. Dạng hai tham số <code>reduce(identity, accumulator)</code> trả thẳng giá trị. Dạng ba tham số <code>reduce(identity, accumulator, combiner)</code> dành cho trường hợp kiểu tích luỹ khác kiểu phần tử, và <code>combiner</code> chỉ thực sự được dùng khi chạy song song.","<b>Hợp đồng bắt buộc: identity và associativity.</b> <code>identity</code> phải thoả <code>accumulator(identity, x) == x</code> với mọi <code>x</code> — nếu bạn dùng <code>reduce(1, (a,b) -&gt; a+b)</code> thì kết quả sẽ lệch đi 1, và lệch thêm nữa khi chạy song song vì mỗi nhánh đều bắt đầu bằng identity. <code>accumulator</code> phải associative, tức <code>(a op b) op c == a op (b op c)</code>, vì stream song song chia dữ liệu thành các đoạn và ghép kết quả theo thứ tự cây chứ không theo thứ tự tuyến tính. Phép trừ và phép chia không associative nên không được dùng với <code>reduce</code>.","<b>Associative không đòi hỏi giao hoán.</b> Nối chuỗi là associative nhưng không giao hoán, và <code>reduce</code> vẫn cho kết quả đúng thứ tự trên stream có thứ tự — kể cả khi chạy song song, vì JDK ghép các đoạn theo đúng thứ tự vị trí. Nhiều người nhầm hai khái niệm này. (Dù vậy, nối chuỗi bằng <code>reduce</code> là O(n²) do tạo chuỗi mới mỗi bước; nên dùng <code>Collectors.joining()</code>.)","<b>Lambda trong stream phải không có side effect.</b> Javadoc gọi chúng là <i>behavioral parameter</i> và yêu cầu <i>non-interfering</i> (không sửa nguồn dữ liệu) và <i>stateless</i> (kết quả không phụ thuộc trạng thái có thể đổi giữa các lần gọi). Vi phạm điều thứ nhất thường ném <code>ConcurrentModificationException</code>; vi phạm điều thứ hai cho kết quả sai một cách im lặng, đặc biệt khi chạy song song.","<b>Vì sao <code>forEach(list::add)</code> là sai.</b> Nó gom kết quả vào một <code>ArrayList</code> chung. Chạy tuần tự thì may mắn đúng; chạy song song thì nhiều thread cùng <code>add</code> vào một <code>ArrayList</code> không thread-safe, cho ra list thiếu phần tử, chứa <code>null</code>, hoặc ném <code>ArrayIndexOutOfBoundsException</code>. Cách đúng là dùng <code>collect</code> — cơ chế collect chia cho mỗi nhánh một container riêng rồi mới gộp, nên nó an toàn theo thiết kế.","<b><code>collect</code> là reduce có tính khả biến.</b> Khi kết quả là một container (list, map, <code>StringBuilder</code>), tạo object mới ở mỗi bước như <code>reduce</code> sẽ tốn kém khủng khiếp. <code>collect(supplier, accumulator, combiner)</code> cho phép tích luỹ vào container khả biến mà vẫn an toàn song song, vì mỗi nhánh có container riêng. Hiểu được điều này là hiểu vì sao JDK có cả <code>reduce</code> lẫn <code>collect</code>."],"example":"// SAI: identity không phải phần tử trung hoà của phép cộng\nint wrong = IntStream.rangeClosed(1, 4).reduce(1, (a, b) -> a + b);   // 11, không phải 10\n\n// SAI: phép trừ không associative -> kết quả khác nhau giữa tuần tự và song song\nint bad = Stream.of(1, 2, 3, 4).reduce(0, (a, b) -> a - b);\n\n// ĐÚNG\nint sum = IntStream.rangeClosed(1, 4).reduce(0, Integer::sum);        // 10\nOptional<Integer> max = Stream.of(3, 9, 2).reduce(Integer::max);\n\n// SAI: side effect vào collection dùng chung\nList<Integer> out = new ArrayList<>();\nIntStream.range(0, 100_000).parallel().boxed().forEach(out::add);      // kết quả không xác định\n\n// ĐÚNG: để collect lo chuyện gộp\nList<Integer> ok = IntStream.range(0, 100_000).parallel().boxed()\n        .collect(Collectors.toList());\n\n// Nối chuỗi: dùng joining chứ không dùng reduce (reduce là O(n^2))\nString csv = names.stream().collect(Collectors.joining(\", \", \"[\", \"]\"));","exampleTitle":"Hợp đồng của reduce và cái giá của side effect","keyPoints":["identity phải thoả accumulator(identity, x) == x, nếu không kết quả sai và sai nặng hơn khi song song","accumulator phải associative; phép trừ và phép chia thì không","Associative không đồng nghĩa với giao hoán — stream có thứ tự vẫn giữ đúng thứ tự khi ghép","Behavioral parameter phải non-interfering và stateless; forEach(list::add) vi phạm điều đó","collect tồn tại để tích luỹ vào container khả biến một cách an toàn, thay vì tạo object mới mỗi bước như reduce"],"trap":"reduce(1, (a,b) -> a+b) là bẫy kinh điển vì chạy tuần tự chỉ lệch đúng 1 và dễ bị bỏ qua trong test, nhưng khi chuyển sang parallel thì mỗi nhánh cộng thêm một identity nữa và sai số phụ thuộc số CPU.","followUp":["Vì sao combiner trong reduce ba tham số chỉ được gọi khi chạy song song?","Tại sao nối chuỗi bằng reduce là O(n²) còn Collectors.joining thì không?","Non-interfering và stateless khác nhau thế nào, mỗi cái vi phạm sẽ gây triệu chứng gì?"]},{"id":"t-9-5","topicId":9,"versions":[8,11,17,21],"title":"parallelStream: common ForkJoinPool và khi nào KHÔNG nên dùng","summary":"Thêm .parallel() là một dòng code, nhưng nó đẩy công việc vào một thread pool dùng chung toàn JVM — đó là rủi ro thật trong ứng dụng web.","sections":["<b>Toàn bộ JVM chia sẻ một pool.</b> Mặc định, mọi parallel stream chạy trên <code>ForkJoinPool.commonPool()</code>. Mức song song của pool này là <code>Runtime.getRuntime().availableProcessors() - 1</code> (thread gọi cũng tham gia làm việc nên tổng vẫn bằng số CPU). Không có sự phân tách giữa các request, các module hay các thư viện — tất cả đều dùng chung.","<b>Vì sao đó là nguy hiểm trong web app.</b> Nếu một request chạy parallel stream có tác vụ chậm hoặc blocking (gọi HTTP, truy vấn DB, đọc file), nó chiếm giữ thread của common pool. Mọi parallel stream khác trong toàn JVM — kể cả của thư viện bên thứ ba — phải xếp hàng chờ. Đây là kiểu sự cố rất khó chẩn đoán vì triệu chứng xuất hiện ở nơi hoàn toàn không liên quan tới đoạn code gây ra nó. Quy tắc đơn giản: <b>không bao giờ đưa tác vụ blocking vào parallel stream</b>.","<b>Chi phí cố định của việc chia nhỏ.</b> Parallel stream phải chia dữ liệu, phân phối task, rồi gộp kết quả. Với dataset nhỏ hoặc hàm xử lý rẻ, chi phí đó lớn hơn phần tiết kiệm được và parallel <i>chậm hơn</i> sequential. Parallel chỉ có lãi khi thoả đồng thời: dữ liệu lớn, mỗi phần tử tốn CPU thật, và không có blocking. Không có con số vạn năng — phải đo bằng benchmark trên chính workload của mình.","<b>Nguồn dữ liệu quyết định phần lớn hiệu quả.</b> <code>ArrayList</code>, mảng và <code>IntStream.range</code> chia đôi được theo chỉ số nên chia cực rẻ. <code>LinkedList</code>, <code>HashSet</code>, <code>TreeMap</code> chia kém hơn nhiều. Nguồn từ I/O hay từ <code>Stream.iterate</code> thì gần như không chia được vì không biết trước kích thước — parallel với chúng hầu như vô ích.","<b>Thứ tự và các operation đắt khi song song.</b> <code>forEach</code> không đảm bảo thứ tự khi song song; muốn giữ thứ tự phải dùng <code>forEachOrdered</code>, và điều đó xoá đi phần lớn lợi ích. <code>findFirst</code> đắt hơn <code>findAny</code> vì phải xác định phần tử đầu tiên theo thứ tự gốc. <code>limit</code> và <code>skip</code> cũng đắt trên stream có thứ tự vì phải đếm chính xác.","<b>Boxing là kẻ giết hiệu năng thầm lặng.</b> <code>list.stream().map(Order::amount).reduce(0, Integer::sum)</code> tạo một <code>Integer</code> ở mỗi bước; <code>list.stream().mapToInt(Order::amount).sum()</code> làm việc thẳng trên <code>int</code>. Với dữ liệu lớn, chuyển sang <code>IntStream</code>/<code>LongStream</code>/<code>DoubleStream</code> thường cho cải thiện rõ hơn nhiều so với việc bật <code>parallel()</code>. Lưu ý <code>IntStream.sum()</code> trả về <code>int</code> nên có thể tràn số — với dữ liệu lớn hãy dùng <code>mapToLong</code> hoặc <code>asLongStream()</code>."],"example":"// NGUY HIỂM: blocking trong common pool, ảnh hưởng toàn JVM\nurls.parallelStream().map(httpClient::fetch).toList();\n\n// Tách pool riêng cho tác vụ CPU-bound (parallel stream submit vào FJP nào\n// thì chạy trên FJP đó — hành vi này đúng với cài đặt hiện tại của OpenJDK\n// nhưng KHÔNG được đặc tả, nên hãy dùng có ý thức)\nForkJoinPool pool = new ForkJoinPool(4);\ntry {\n    List<Result> r = pool.submit(() -> data.parallelStream().map(this::heavyCpu).toList()).get();\n} finally {\n    pool.shutdown();\n}\n\n// Boxing vs primitive stream\nint s1 = orders.stream().map(Order::amount).reduce(0, Integer::sum);  // boxing mỗi bước\nint s2 = orders.stream().mapToInt(Order::amount).sum();                // không boxing\nlong s3 = orders.stream().mapToLong(Order::amount).sum();              // tránh tràn int\n\n// Nguồn khó chia -> parallel gần như vô ích\nnew LinkedList<>(data).parallelStream().map(this::work).toList();","exampleTitle":"Ba quyết định quan trọng: pool, kích thước, và boxing","keyPoints":["Mặc định parallel stream chạy trên ForkJoinPool.commonPool() dùng chung toàn JVM","Tác vụ blocking trong parallel stream có thể làm nghẽn mọi parallel stream khác trong tiến trình","Parallel chỉ có lãi khi dữ liệu lớn, mỗi phần tử tốn CPU, nguồn chia rẻ (ArrayList, mảng, IntStream.range)","forEachOrdered, findFirst, limit, skip đều đắt hơn khi chạy song song vì phải giữ thứ tự","Chuyển sang IntStream/LongStream để bỏ boxing thường hiệu quả hơn là bật parallel"],"trap":"Nhiều người coi parallelStream() là nút tăng tốc miễn phí. Câu hỏi vặn thường là: nếu hai request cùng gọi parallelStream với tác vụ chậm thì chuyện gì xảy ra — đáp án là chúng tranh nhau đúng một common pool của cả JVM.","followUp":["Mức song song mặc định của common pool là bao nhiêu, và thread gọi có tham gia làm việc không?","Vì sao LinkedList là nguồn tệ cho parallel stream còn ArrayList thì tốt?","IntStream.sum() có nguy cơ gì với dữ liệu lớn, và khắc phục thế nào?"]},{"id":"t-10-1","topicId":10,"versions":[8,11,17,21],"title":"Optional được thiết kế cho KIỂU TRẢ VỀ, không phải cho field hay tham số","summary":"Hiểu đúng phạm vi sử dụng của Optional quan trọng hơn thuộc hết API của nó.","sections":["<b>Bài toán mà Optional giải quyết.</b> Trước Java 8, một method trả về <code>User</code> không có cách nào nói cho người gọi biết rằng kết quả có thể không tồn tại — thông tin đó nằm trong javadoc, và javadoc thì không ai bắt buộc phải đọc. <code>Optional&lt;User&gt;</code> đưa khả năng 'không có giá trị' vào <b>hệ thống kiểu</b>, nên compiler buộc người gọi phải nghĩ tới trường hợp rỗng.","<b>Tuyên bố của chính người thiết kế.</b> Brian Goetz đã nói rõ Optional ra đời cho tình huống hẹp: kiểu trả về của method mà việc 'không có kết quả' là bình thường và người gọi cần được nhắc xử lý. Nó không phải cơ chế thay thế null trên toàn bộ codebase, và cũng không phải kiểu dữ liệu đa dụng.","<b>Vì sao không dùng cho field.</b> Ba lý do cụ thể. Thứ nhất, <code>Optional</code> <b>không implement <code>Serializable</code></b>, nên một class <code>Serializable</code> có field kiểu <code>Optional</code> sẽ ném <code>NotSerializableException</code> lúc ghi. Thứ hai, mỗi field <code>Optional</code> là thêm một object trên heap cho mỗi instance — với entity đọc hàng triệu dòng thì đó là chi phí thật. Thứ ba, framework như JPA, Jackson hay nhiều thư viện mapping không xử lý được kiểu này một cách tự nhiên. Cách đúng là để field nullable và cho <b>getter</b> trả về <code>Optional</code>.","<b>Vì sao không dùng cho tham số.</b> Người gọi buộc phải viết <code>f(Optional.of(x))</code> hoặc <code>f(Optional.empty())</code> — dài dòng mà không mang lại an toàn nào, vì bản thân tham số kiểu <code>Optional</code> vẫn có thể nhận giá trị <code>null</code> và lúc đó bạn có tới ba trạng thái phải xử lý: null, empty, có giá trị. Giải pháp đúng cho tham số tuỳ chọn là overload method hoặc dùng builder.","<b>Cũng không dùng cho collection.</b> <code>Optional&lt;List&lt;T&gt;&gt;</code> gần như luôn sai: một list rỗng đã diễn đạt trọn vẹn ý 'không có gì' rồi, và người gọi có thể duyệt nó bình thường mà không cần kiểm tra. Tương tự, đừng bao giờ trả về <code>Optional</code> mà giá trị bên trong là <code>null</code> hay tạo <code>List&lt;Optional&lt;T&gt;&gt;</code> nếu có cách lọc trước.","<b>Optional không giải quyết được null bên trong.</b> <code>Optional&lt;User&gt;</code> chỉ nói rằng có hay không có <code>User</code>; nó không nói gì về việc <code>user.getEmail()</code> có null hay không. Nếu bạn bọc mọi thứ vào Optional để 'khỏi NPE', bạn chỉ đang di chuyển vấn đề. Optional có giá trị nhất ở ranh giới API — repository, lookup, parse — chứ không phải rải khắp mọi tầng."],"example":"// SAI: field kiểu Optional -> NotSerializableException khi serialize\nclass User implements Serializable {\n    private Optional<String> nickname = Optional.empty();\n}\n\n// ĐÚNG: field nullable, getter trả Optional\nclass User implements Serializable {\n    private String nickname;                     // có thể null\n    public Optional<String> nickname() {\n        return Optional.ofNullable(nickname);\n    }\n}\n\n// SAI: Optional làm tham số\nvoid search(String q, Optional<Integer> limit) { ... }\n\n// ĐÚNG: overload\nvoid search(String q)            { search(q, 20); }\nvoid search(String q, int limit) { ... }\n\n// SAI: Optional bọc collection\nOptional<List<Order>> findOrders(long id);\n// ĐÚNG: trả list rỗng\nList<Order> findOrders(long id);","exampleTitle":"Đúng chỗ và sai chỗ của Optional","keyPoints":["Optional đưa khả năng 'không có giá trị' vào hệ thống kiểu, dành cho kiểu trả về của method","Optional không implement Serializable — field kiểu Optional làm hỏng Java serialization","Tham số kiểu Optional tạo ra ba trạng thái (null / empty / có giá trị) thay vì hai","Collection rỗng đã đủ diễn đạt 'không có gì', không cần Optional<List<T>>","Optional chỉ nói về sự tồn tại của chính giá trị đó, không bảo vệ khỏi null bên trong object"],"trap":"Câu vặn hay dùng: vì sao không nên đặt Optional làm field của entity? Câu trả lời đầy đủ phải nêu được cả ba mặt — không Serializable, thêm một object cho mỗi instance, và framework mapping không hỗ trợ.","followUp":["Nếu class có field Optional và bạn phải serialize nó thì làm cách nào?","Vì sao Optional<List<T>> gần như luôn là thiết kế sai?","Optional có giúp gì cho trường hợp user.getAddress().getCity() bị null ở giữa chuỗi không?"]},{"id":"t-10-2","topicId":10,"versions":[8,11,17,21],"title":"Tạo và mở Optional: of, ofNullable, get, orElseThrow","summary":"Ba cách tạo và năm cách lấy giá trị ra — chọn sai là biến Optional thành một cách viết dài dòng của null.","sections":["<b>Ba cách tạo.</b> <code>Optional.of(x)</code> yêu cầu <code>x</code> khác null và <b>ném NPE ngay lập tức</b> nếu null. <code>Optional.ofNullable(x)</code> chấp nhận null và biến nó thành <code>Optional.empty()</code>. <code>Optional.empty()</code> trả về instance rỗng. Việc <code>of</code> ném NPE không phải là thiếu sót mà là chủ đích: nó biến 'giá trị này lẽ ra không bao giờ null' thành một khẳng định được kiểm tra ngay tại điểm sinh ra, thay vì để lỗi nổ ở đâu đó xa hơn.","<b>Chọn giữa of và ofNullable là một quyết định thiết kế.</b> Dùng <code>of</code> khi bạn biết chắc giá trị tồn tại và muốn fail-fast nếu giả định sai. Dùng <code>ofNullable</code> khi bạn đang bọc kết quả từ một API có thể trả null, ví dụ <code>map.get(key)</code> hay một thư viện cũ. Viết <code>ofNullable</code> ở mọi nơi 'cho chắc' là làm mất khả năng phát hiện lỗi sớm.","<b><code>get()</code> không kiểm tra là anti-pattern.</b> <code>opt.get()</code> ném <code>NoSuchElementException</code> khi rỗng. Viết <code>if (opt.isPresent()) return opt.get();</code> chỉ là câu lệnh kiểm tra null cũ với nhiều chữ hơn và thêm một object rác — nó vứt bỏ toàn bộ giá trị của Optional. Nếu bạn thấy <code>isPresent</code> đi kèm <code>get</code> trong code review, gần như luôn có thể viết lại bằng <code>map</code>, <code>filter</code>, <code>orElse</code>, <code>orElseGet</code> hoặc <code>ifPresent</code>.","<b><code>orElseThrow()</code> không tham số có từ Java 10.</b> Nó làm đúng việc của <code>get()</code> nhưng tên gọi nói rõ rằng có thể ném exception, nên đọc code là thấy ngay ý định. Từ Java 10 trở đi, nếu thật sự cần lấy giá trị và chấp nhận nổ khi rỗng, hãy dùng <code>orElseThrow()</code> thay cho <code>get()</code>. Bản có tham số <code>orElseThrow(Supplier)</code> đã có từ Java 8 và là cách chuẩn để ném exception nghiệp vụ của bạn.","<b>Bảng chọn nhanh.</b> Có giá trị mặc định rẻ (hằng số, chuỗi rỗng) thì dùng <code>orElse</code>. Giá trị mặc định phải tính toán hoặc gọi ra ngoài thì dùng <code>orElseGet</code>. Rỗng là lỗi nghiệp vụ thì dùng <code>orElseThrow(() -&gt; new NotFoundException(id))</code>. Chỉ cần chạy một hành động khi có giá trị thì dùng <code>ifPresent</code>. Cần cả hai nhánh thì dùng <code>ifPresentOrElse</code> (Java 9+).","<b><code>isEmpty()</code> có từ Java 11.</b> Trước đó phải viết <code>!opt.isPresent()</code>, khá khó đọc khi lồng trong điều kiện phức tạp. Đây là một trong những khác biệt phiên bản nhỏ nhưng hay được hỏi khi phỏng vấn về Optional."],"example":"// Tạo\nOptional<String> a = Optional.of(\"x\");          // NPE nếu tham số null\nOptional<String> b = Optional.ofNullable(map.get(\"k\"));  // null -> empty\nOptional<String> c = Optional.empty();\n\n// XẤU: isPresent + get\nif (opt.isPresent()) {\n    return opt.get().getName();\n}\nreturn \"unknown\";\n\n// TỐT\nreturn opt.map(User::getName).orElse(\"unknown\");\n\n// Rỗng là lỗi nghiệp vụ\nUser u = repo.findById(id)\n             .orElseThrow(() -> new UserNotFoundException(id));\n\n// Java 10+: thay cho get()\nUser u2 = repo.findById(id).orElseThrow();\n\n// Java 11+\nif (opt.isEmpty()) { ... }        // trước đó: !opt.isPresent()","exampleTitle":"Tạo, mở và chọn đúng method","keyPoints":["of ném NPE với null (fail-fast có chủ đích); ofNullable biến null thành empty","isPresent() + get() là anti-pattern — hầu như luôn viết lại được bằng map/orElse/ifPresent","orElseThrow() không tham số có từ Java 10, nên dùng thay cho get()","orElseThrow(Supplier) có từ Java 8, là cách chuẩn ném exception nghiệp vụ","isEmpty() có từ Java 11"],"trap":"Nhiều người nghĩ get() đã bị deprecated. Tính tới Java 21 thì get() KHÔNG bị deprecated — nó chỉ bị khuyến cáo tránh dùng, và orElseThrow() (Java 10) được thêm vào làm bản thay thế có tên rõ nghĩa hơn.","followUp":["Khi nào nên dùng of thay vì ofNullable, và ngược lại?","orElseThrow() không tham số ném exception gì khi Optional rỗng?","Vì sao isPresent() + get() bị coi là bỏ phí toàn bộ giá trị của Optional?"]},{"id":"t-10-3","topicId":10,"versions":[8,11,17,21],"title":"orElse vs orElseGet: bẫy đánh giá sớm","summary":"orElse luôn tính đối số của nó, kể cả khi Optional có giá trị — đó là bẫy kinh điển và cũng là bug hiệu năng thật.","sections":["<b>Cơ chế nằm ở luật của Java, không phải ở Optional.</b> <code>orElse(other)</code> nhận một <b>giá trị</b>. Java đánh giá mọi đối số trước khi gọi method, nên biểu thức trong ngoặc luôn được thực thi — dù Optional có giá trị và giá trị đó rốt cuộc bị vứt đi. <code>orElseGet(supplier)</code> nhận một <b>hàm</b>, và hàm đó chỉ được gọi khi Optional rỗng.","<b>Vì sao đây là bug thật chứ không phải chuyện học thuật.</b> <code>cache.find(k).orElse(loadFromDatabase(k))</code> gọi database ở <b>mọi</b> lần chạy, kể cả khi cache trúng — cache mất hoàn toàn tác dụng mà không ai nhận ra vì kết quả trả về vẫn đúng. Đây là dạng lỗi chỉ lộ ra qua profiler hoặc qua hoá đơn hạ tầng.","<b>Trường hợp nguy hiểm hơn: đối số có side effect.</b> <code>opt.orElse(counter.incrementAndGet())</code> tăng bộ đếm ngay cả khi Optional có giá trị. <code>opt.orElse(list.remove(0))</code> xoá phần tử ngay cả khi không cần. Những lỗi này sai <b>ngữ nghĩa</b> chứ không chỉ chậm.","<b>Khi nào orElse là lựa chọn đúng.</b> Khi giá trị mặc định là một hằng số hoặc biến đã có sẵn: <code>orElse(\"\")</code>, <code>orElse(0)</code>, <code>orElse(DEFAULT_CONFIG)</code>. Trong những trường hợp đó <code>orElseGet</code> chỉ thêm một lambda vô ích. Quy tắc gọn: đối số là một <b>lời gọi method</b> thì dùng <code>orElseGet<
