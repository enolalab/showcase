ủ 1 giây trong khi main chạy ngay, nên không có cách nào \"done\" in trước.","Thread.sleep hoạt động bình thường trên virtual thread và chính là điểm unmount điển hình."]},{"id":"d-17-9","topicId":17,"versions":[21],"difficulty":"intermediate","question":"Trên Java 21, phát biểu nào ĐÚNG về trạng thái các tính năng của dự án Loom?","choices":["Virtual thread, ScopedValue và StructuredTaskScope đều đã là tính năng chuẩn","Virtual thread (JEP 444) là tính năng chuẩn; ScopedValue (JEP 446) và StructuredTaskScope (JEP 453) vẫn là preview, cần --enable-preview","Virtual thread là preview; chỉ StructuredTaskScope đã chuẩn hoá","Cả ba đều là preview, phải bật --enable-preview mới dùng được virtual thread"],"correctAnswer":1,"explanation":"Java 21 chuẩn hoá virtual thread qua JEP 444 sau hai vòng preview ở 19 và 20. Nhưng hai tính năng đi cùng dự án Loom thì chưa: ScopedValue là preview theo JEP 446 (trước đó incubator ở 20) và StructuredTaskScope là preview theo JEP 453 (incubator ở 19 và 20). Cả hai đều cần --enable-preview lúc biên dịch lẫn lúc chạy, và API của chúng còn thay đổi ở các bản sau, nên không nên đưa vào code production trên LTS 21.","whyWrong":["ScopedValue và StructuredTaskScope không đạt trạng thái chuẩn ở Java 21.","","Ngược hoàn toàn: virtual thread mới là cái đã chuẩn hoá, còn StructuredTaskScope thì chưa.","Virtual thread trên Java 21 dùng được ngay, không cần cờ preview nào."]},{"id":"d-18-1","topicId":18,"versions":[8,11,17,21],"difficulty":"beginner","question":"1000 thread, mỗi thread gọi inc() một lần. Sau khi tất cả kết thúc, count in ra bao nhiêu?","code":"class Counter {\n    private volatile int count = 0;\n    void inc() { count++; }\n    int get() { return count; }\n}","choices":["Luôn đúng 1000, vì volatile đảm bảo mọi thread thấy giá trị mới nhất","Thường nhỏ hơn 1000, vì count++ là read-modify-write gồm ba bước có thể bị xen giữa","Luôn đúng 1000 nhưng chậm hơn AtomicInteger","Ném ConcurrentModificationException"],"correctAnswer":1,"explanation":"volatile giải quyết visibility chứ không giải quyết atomicity. count++ biên dịch thành ba thao tác riêng: đọc giá trị, cộng một, ghi lại. Hai thread có thể cùng đọc được 41, cùng ghi 42, và một lần tăng biến mất — hiện tượng lost update. Kết quả vì thế thường nhỏ hơn 1000 và không lặp lại được. Muốn đúng phải dùng AtomicInteger.incrementAndGet(), LongAdder, hoặc bọc trong synchronized.","whyWrong":["Thấy giá trị mới nhất không ngăn được hai thread cùng đọc rồi cùng ghi đè lên nhau.","","Kết quả không đúng 1000; volatile không hề biến chuỗi ba bước thành một thao tác nguyên tử.","ConcurrentModificationException là lỗi của iterator trên collection, không liên quan tới biến int."]},{"id":"d-18-10","topicId":18,"versions":[8,11,17,21],"difficulty":"intermediate","question":"Danh sách nào phù hợp nhất cho một registry listener: hàng nghìn lần duyệt mỗi giây nhưng chỉ vài lần thêm/xoá mỗi ngày, và tuyệt đối không được ném ConcurrentModificationException?","choices":["Collections.synchronizedList(new ArrayList<>())","Vector","ArrayList kèm một ReentrantLock fair","CopyOnWriteArrayList"],"correctAnswer":3,"explanation":"CopyOnWriteArrayList sinh ra đúng cho mô hình đọc rất nhiều ghi rất ít. Mỗi lần ghi nó sao chép toàn bộ mảng nền — O(n) và tốn bộ nhớ — nhưng bù lại mọi thao tác đọc hoàn toàn không cần khoá, và iterator làm việc trên một snapshot bất biến nên không bao giờ ném ConcurrentModificationException. Đánh đổi phải nói rõ: iterator thấy dữ liệu tại thời điểm tạo nên có thể hơi cũ, và iterator.remove() ném UnsupportedOperationException. Nếu tần suất ghi cao thì cấu trúc này trở thành thảm hoạ.","whyWrong":["synchronizedList khoá mọi thao tác đọc nên hàng nghìn lần duyệt mỗi giây sẽ tranh chấp nặng, và khi duyệt vẫn phải tự đồng bộ bên ngoài nếu không sẽ ném ConcurrentModificationException.","Vector đồng bộ từng method nên vẫn khoá khi đọc, và iterator của nó vẫn fail-fast — đây là lớp legacy không nên dùng cho code mới.","Tự quản lý lock cho một danh sách đọc nhiều là làm lại việc đã có sẵn, và fair mode còn làm thông lượng đọc giảm thêm.",""]},{"id":"d-18-11","topicId":18,"versions":[8,11,17,21],"difficulty":"advanced","question":"Filter dưới đây chạy trên Tomcat với thread pool. Vấn đề nghiêm trọng nhất là gì?","code":"static final ThreadLocal<User> CURRENT = new ThreadLocal<>();\n\nvoid doFilter(Request req, Response res, FilterChain chain) throws IOException {\n    CURRENT.set(authenticate(req));\n    chain.doFilter(req, res);\n    // khong co CURRENT.remove()\n}","choices":["Không có vấn đề gì vì ThreadLocalMap dùng weak reference nên GC tự dọn","Thread bị tái sử dụng nên request sau có thể đọc được User của request trước — lỗi rò rỉ dữ liệu giữa người dùng — và giá trị bị giữ mãi gây memory leak","authenticate() không thread-safe nên cần bọc synchronized","ThreadLocal không dùng được trong Servlet filter, phải dùng request attribute"],"correctAnswer":1,"explanation":"Trong thread pool, thread sống rất lâu và phục vụ hàng nghìn request. Không gọi remove() thì giá trị nằm lại trong ThreadLocalMap của thread đó; nếu một luồng request nào đó vào trước khi set() kịp chạy, hoặc code đọc CURRENT ở nhánh không đi qua filter, nó sẽ nhìn thấy User của người dùng trước — đây là lỗ hổng bảo mật thật, không phải chỉ là leak. Về bộ nhớ: key trong ThreadLocalMap là weak reference tới chính object ThreadLocal, nhưng VALUE thì được tham chiếu mạnh, nên giá trị chỉ được dọn khi thread chết hoặc khi có thao tác dọn stale entry. Cách sửa bắt buộc là đặt CURRENT.remove() trong khối finally.","whyWrong":["Weak reference chỉ áp dụng cho key; value được giữ tham chiếu mạnh nên không được GC dọn khi thread còn sống.","","Vấn đề nằm ở vòng đời của giá trị trong ThreadLocal, không phải ở tính thread-safe của hàm xác thực.","ThreadLocal hoàn toàn dùng được trong filter — Spring Security và MDC đều làm vậy; điều bắt buộc là phải remove trong finally."]},{"id":"d-18-12","topicId":18,"versions":[8,11,17,21],"difficulty":"advanced","question":"Đoạn code dưới đây in ra gì?","code":"CompletableFuture<Integer> f = CompletableFuture\n        .supplyAsync(() -> 10)\n        .thenApply(x -> x / 0)\n        .exceptionally(ex -> {\n            System.out.println(ex.getClass().getSimpleName());\n            return -1;\n        });\n\nSystem.out.println(f.join());","choices":["ArithmeticException rồi -1","CompletionException rồi -1","Ném ArithmeticException ra ngoài tại lời gọi join()","ExecutionException rồi -1"],"correctAnswer":1,"explanation":"Exception ném ra bên trong một stage của CompletableFuture được BỌC trong CompletionException khi truyền tới các stage phía sau, nên hàm của exceptionally nhận CompletionException chứ không phải ArithmeticException gốc — muốn lấy lỗi thật phải gọi ex.getCause(). exceptionally trả về -1 nên future kết thúc bình thường và join() in ra -1. Cần phân biệt thêm: join() ném CompletionException (unchecked) còn get() ném ExecutionException (checked) — hai wrapper khác nhau cho cùng một tình huống, và đây là chỗ rất hay bị hỏi vặn.","whyWrong":["Đây là bẫy chính: exceptionally nhận wrapper chứ không nhận trực tiếp exception gốc.","","exceptionally đã xử lý lỗi và trả về giá trị thay thế, nên future hoàn tất bình thường và join() không ném gì.","ExecutionException là wrapper của get(), không phải của đường truyền lỗi giữa các stage."]},{"id":"d-18-13","topicId":18,"versions":[8,11,17,21],"difficulty":"advanced","question":"Trong một stack lock-free dùng AtomicReference, thread T1 đọc đỉnh là node A rồi bị tạm dừng. Trong lúc đó thread khác pop A, pop B, rồi push lại chính node A (đã bị sửa trường next). T1 tỉnh dậy và gọi compareAndSet(A, A.next) — chuyện gì xảy ra và chống bằng cách nào?","choices":["CAS thất bại vì giá trị đã thay đổi, nên hoàn toàn an toàn","CAS thành công nhưng vô hại vì tham chiếu vẫn trỏ đúng object A","CAS thành công dù trạng thái stack đã khác — đây là ABA problem; chống bằng AtomicStampedReference để so sánh thêm một stamp tăng dần","Ném IllegalStateException vì AtomicReference phát hiện được thay đổi trung gian"],"correctAnswer":2,"explanation":"CAS chỉ so sánh GIÁ TRỊ hiện tại với giá trị kỳ vọng, nó không biết gì về lịch sử biến đổi ở giữa. Đỉnh stack đi A → B → A nên phép so sánh vẫn thấy A và CAS thành công, trong khi T1 đang dùng một A.next đã lỗi thời — kết quả là stack bị đặt về một node đã bị pop ra, làm mất hoặc làm sống lại phần tử. Cách chống chuẩn là AtomicStampedReference: mỗi lần cập nhật tăng stamp, và CAS so sánh cả cặp (tham chiếu, stamp) nên chu trình A→B→A vẫn bị phát hiện. Với cờ boolean đơn giản thì có AtomicMarkableReference. Lưu ý ABA hầu như chỉ gây hậu quả thật ở cấu trúc lock-free có tái sử dụng node; với counter kiểu AtomicInteger thì nó vô hại.","whyWrong":["Giá trị hiện tại đúng bằng giá trị kỳ vọng nên CAS thành công, dù trạng thái logic đã thay đổi.","Không vô hại: A.next mà T1 đang cầm là giá trị cũ, nên đỉnh stack bị đặt sai và phần tử bị mất hoặc bị lặp.","","AtomicReference không lưu lịch sử và không có cơ chế phát hiện thay đổi trung gian nào."]},{"id":"d-18-2","topicId":18,"versions":[8,11,17,21],"difficulty":"beginner","question":"Thread A gọi Service.staticSync(), thread B gọi service.instanceSync() trên cùng một instance. Hai thread có loại trừ lẫn nhau không?","code":"class Service {\n    static synchronized void staticSync()   { /* ... */ }\n           synchronized void instanceSync() { /* ... */ }\n}","choices":["Có, vì cả hai đều là synchronized nên dùng chung một khoá của class","Không, vì method static khoá trên object Service.class còn method instance khoá trên this — hai monitor khác nhau","Có, nhưng chỉ khi chỉ tồn tại đúng một instance của Service","Không, vì method static không thể là synchronized"],"correctAnswer":1,"explanation":"Method instance synchronized khoá trên this, còn method static synchronized khoá trên object Class tương ứng (Service.class). Đó là hai monitor hoàn toàn độc lập, nên hai thread chạy song song không hề chặn nhau. Hệ quả thực tế: nếu cả state static và state instance cùng được truy cập bởi hai loại method này thì bạn có một lỗ hổng race condition rất khó thấy. Muốn loại trừ thật thì phải cho cả hai cùng khoá trên một object duy nhất.","whyWrong":["synchronized không có một khoá chung toàn cục; đối tượng khoá phụ thuộc vào việc method là static hay instance.","","Số lượng instance không liên quan; ngay cả với đúng một instance thì this và Service.class vẫn là hai object khác nhau.","Method static hoàn toàn có thể khai báo synchronized, khi đó nó khoá trên object Class."]},{"id":"d-18-3","topicId":18,"versions":[8,11,17,21],"difficulty":"beginner","question":"Bên trong một khối synchronized, gọi Thread.sleep(1000) và gọi wait(1000) khác nhau thế nào?","choices":["Cả hai đều nhả khoá trong lúc chờ rồi giành lại khi thức dậy","Cả hai đều giữ nguyên khoá trong suốt thời gian chờ","sleep giữ nguyên mọi khoá đang cầm; wait nhả monitor của object đó và phải giành lại trước khi chạy tiếp","sleep nhả khoá còn wait thì giữ, đó là lý do wait chỉ gọi được trong synchronized"],"correctAnswer":2,"explanation":"Đây là câu hỏi phỏng vấn kinh điển. Thread.sleep là method của Thread, không liên quan gì tới monitor, nên nó giữ nguyên mọi khoá đang cầm — sleep trong vùng găng là cách chắc chắn để chặn cả hệ thống. wait là method của Object, đưa thread vào wait set của monitor và nhả monitor đó để thread khác vào thay đổi điều kiện; khi được notify hoặc hết hạn, thread phải giành lại monitor rồi mới chạy tiếp. Ngoài ra wait bắt buộc gọi khi đang giữ monitor, nếu không sẽ ném IllegalMonitorStateException.","whyWrong":["sleep không hề nhả khoá; đó chính là khác biệt cốt lõi giữa hai method.","wait có nhả monitor — nếu không thì không thread nào vào được để thay đổi điều kiện và mọi wait đều treo vĩnh viễn.","","Ngược hoàn toàn; và wait phải nằm trong synchronized vì nó thao tác trên monitor, không phải vì nó giữ khoá."]},{"id":"d-18-4","topicId":18,"versions":[8,11,17,21],"difficulty":"intermediate","question":"Submit 1000 task chạy lâu vào pool dưới đây. Số thread tối đa mà pool tạo ra là bao nhiêu?","code":"ExecutorService pool = new ThreadPoolExecutor(\n        4, 64,\n        60L, TimeUnit.SECONDS,\n        new LinkedBlockingQueue<>());   // khong truyen capacity","choices":["64, vì tải cao nên pool nở tới maximumPoolSize","4, vì hàng đợi không giới hạn nên không bao giờ đầy, và maximumPoolSize không bao giờ được dùng tới","1000, mỗi task một thread","Số bằng số core của máy"],"correctAnswer":1,"explanation":"ThreadPoolExecutor quyết định theo thứ tự: chưa đủ corePoolSize thì tạo thread; đủ rồi thì bỏ vào hàng đợi; chỉ khi hàng đợi ĐẦY mới tạo thêm thread tới maximumPoolSize. LinkedBlockingQueue không truyền capacity là hàng đợi Integer.MAX_VALUE phần tử, coi như không bao giờ đầy, nên bước tạo thêm thread không bao giờ xảy ra và pool đứng ở 4 thread. Đây cũng chính là lý do Executors.newFixedThreadPool có thể phình hàng đợi tới OutOfMemoryError. Cách sửa là dùng hàng đợi có giới hạn, ví dụ ArrayBlockingQueue, kèm một RejectedExecutionHandler như CallerRunsPolicy.","whyWrong":["maximumPoolSize chỉ có tác dụng khi hàng đợi đầy; với hàng đợi vô hạn nó là tham số chết.","","Pool tái sử dụng thread và không bao giờ tạo một thread cho mỗi task; đó là mô hình của virtual thread executor.","ThreadPoolExecutor không tự suy ra số thread từ số core; nó dùng đúng tham số bạn truyền vào."]},{"id":"d-18-5","topicId":18,"versions":[8,11,17,21],"difficulty":"intermediate","question":"Chạy đoạn code dưới đây, console in ra gì?","code":"ExecutorService pool = Executors.newFixedThreadPool(2);\n\npool.execute(() -> { throw new RuntimeException(\"A\"); });\npool.submit (() -> { throw new RuntimeException(\"B\"); });\n\npool.shutdown();","choices":["In stack trace của cả A và B","Không in gì cả, vì exception trong thread con luôn bị bỏ qua","In stack trace của A; exception B bị gói vào Future và biến mất vì không ai gọi get()","In stack trace của B; A bị nuốt vì execute không có cơ chế báo lỗi"],"correctAnswer":2,"explanation":"execute(Runnable) để exception thoát ra khỏi worker thread, ThreadPoolExecutor xử lý và nó đi tới UncaughtExceptionHandler nên bạn thấy stack trace trong console. submit() thì gói mọi Throwable vào Future và trả về; nếu không ai gọi Future.get() thì lỗi im lặng tuyệt đối. Đây là nguyên nhân kinh điển của những scheduled job đột ngột ngừng chạy mà log sạch bong — với ScheduledExecutorService, một exception không bắt còn làm task đó không bao giờ được lên lịch lại. Quy tắc: hoặc luôn xử lý Future, hoặc bọc thân task trong try/catch ghi log.","whyWrong":["Chỉ A được in; B bị giữ trong Future và không tự phát ra đâu cả.","Exception trong thread con không bị bỏ qua — với execute nó đi tới UncaughtExceptionHandler.","","Ngược lại: execute mới là cái để lỗi lộ ra, còn submit mới là cái nuốt lỗi vào Future."]},{"id":"d-18-6","topicId":18,"versions":[8,11,17,21],"difficulty":"intermediate","question":"Bỏ từ khoá volatile ở field instance trong đoạn singleton dưới đây thì hậu quả tệ nhất là gì?","code":"class Config {\n    private static volatile Config instance;   // neu bo volatile?\n    private final Map<String, String> data;\n\n    static Config get() {\n        if (instance == null) {\n            synchronized (Config.class) {\n                if (instance == null) instance = new Config();\n            }\n        }\n        return instance;\n    }\n}","choices":["Không sao cả, vì khối synchronized bên trong đã đảm bảo chỉ một instance được tạo","Có thể tạo ra hai instance khác nhau","Một thread khác có thể nhận về tham chiếu tới object mà constructor chưa chạy xong, và thấy các field ở giá trị mặc định","Compiler báo lỗi vì double-checked locking không hợp lệ trong Java"],"correctAnswer":2,"explanation":"Dòng instance = new Config() gồm ba việc: cấp phát bộ nhớ, chạy constructor, gán tham chiếu. JIT được phép đảo hai việc sau. Thread B đọc instance ở lần kiểm tra ĐẦU TIÊN — nằm ngoài khối synchronized nên không có quan hệ happens-before nào — thấy khác null, bỏ qua lock và dùng ngay một object chưa khởi tạo xong, ví dụ data vẫn là null. Từ khoá volatile cấm đúng phép reorder đó và tạo happens-before giữa lần ghi và lần đọc, nên là bắt buộc kể từ JMM của Java 5. Đơn giản hơn thì dùng holder idiom hoặc enum.","whyWrong":["Khối synchronized chỉ bảo vệ nhánh khởi tạo; lần kiểm tra thứ nhất nằm hoàn toàn ngoài lock.","Số lượng instance vẫn là một, vì mọi lần khởi tạo đều đi qua khối synchronized với kiểm tra thứ hai.","","Đây là vấn đề ngữ nghĩa bộ nhớ lúc chạy, compiler không hề báo lỗi — đó chính là điều khiến nó nguy hiểm."]},{"id":"d-18-7","topicId":18,"versions":[8,11,17,21],"difficulty":"intermediate","question":"Đoạn consumer dưới đây có lỗi gì?","code":"synchronized Item take() throws InterruptedException {\n    if (queue.isEmpty()) {   // chu y: if\n        wait();\n    }\n    return queue.remove(0);\n}","choices":["Phải đổi if thành while, vì thread có thể spurious wakeup và vì consumer khác có thể lấy mất phần tử trong khoảng giữa lúc được notify và lúc giành lại monitor","Phải bỏ synchronized vì wait() đã tự đồng bộ rồi","Phải đổi wait() thành Thread.sleep() để không nhả khoá","Phải gọi notifyAll() ngay trước wait() để tránh mất tín hiệu"],"correctAnswer":0,"explanation":"Có hai lý do độc lập bắt buộc dùng while. Thứ nhất, JLS cho phép spurious wakeup — thread thức dậy mà không có notify nào. Thứ hai và hay xảy ra hơn trong thực tế: wait() nhả monitor, nên giữa lúc được notify và lúc giành lại được monitor, một consumer khác hoàn toàn có thể chen vào lấy mất phần tử duy nhất. Với if, thread chạy thẳng xuống queue.remove(0) trên một hàng đợi rỗng và ném IndexOutOfBoundsException. Với while, nó kiểm tra lại điều kiện và ngủ tiếp. Quy tắc bất di bất dịch: điều kiện của wait luôn nằm trong vòng while.","whyWrong":["","Bỏ synchronized sẽ khiến wait() ném IllegalMonitorStateException ngay lập tức, vì wait bắt buộc phải được gọi khi đang giữ monitor.","Thread.sleep giữ nguyên khoá nên không producer nào vào thêm được phần tử — hàng đợi vĩnh viễn rỗng, đây là cách tự tạo deadlock.","Gọi notifyAll() trước wait() không giải quyết gì; vấn đề nằm ở việc kiểm tra lại điều kiện sau khi thức dậy."]},{"id":"d-18-8","topicId":18,"versions":[8,11,17,21],"difficulty":"intermediate","question":"Điều gì xảy ra khi hàm truyền cho computeIfAbsent lại cập nhật chính map đó bằng một key rơi vào cùng bin?","code":"ConcurrentHashMap<Integer, Integer> map = new ConcurrentHashMap<>();\n\n// bang mac dinh 16 bin: key 1 va key 17 deu roi vao bin 1\nmap.computeIfAbsent(1, k -> {\n    map.put(17, 2);           // cap nhat de quy chinh map nay\n    return 1;\n});","choices":["Chạy bình thường, map có hai key 1 và 17","Ném IllegalStateException với thông điệp \"Recursive update\", vì computeIfAbsent giữ khoá trên bin trong lúc chạy hàm và key 17 rơi đúng vào bin đang bị khoá","Ném ConcurrentModificationException như HashMap","Ném NullPointerException vì computeIfAbsent không cho phép side effect"],"correctAnswer":1,"explanation":"Ném IllegalStateException(\"Recursive update\"). ConcurrentHashMap từ Java 8 khoá trên node đầu của từng bin trong lúc chạy hàm mapping của compute/computeIfAbsent. Với bảng mặc định 16 bin thì cả key 1 và key 17 đều cho chỉ số bin là 1, nên lệnh put lồng bên trong đụng đúng cái bin đang bị chính computeIfAbsent giữ — đây là một ngữ cảnh không reentrant, JDK phát hiện được và ném IllegalStateException, còn ở các trường hợp khác kiểu này thì có thể dẫn tới treo. Lưu ý quan trọng: nếu key mới rơi vào bin khác thì đoạn code trên có thể chạy trót lọt — nhưng javadoc cấm hẳn kiểu cập nhật đệ quy này nên bạn không được dựa vào đó. Quy tắc: hàm truyền cho compute phải ngắn, thuần, không đụng lại map và tốt nhất là không làm IO. Cần cập nhật thêm key khác thì làm sau khi computeIfAbsent trả về.","whyWrong":["Với cặp key trùng bin này thì không: lệnh put lồng bên trong đụng đúng bin đang bị khoá nên JDK phát hiện và ném IllegalStateException(\"Recursive update\") một cách xác định, chạy bao nhiêu lần cũng vậy. Cập nhật đệ quy chính là tình huống mà javadoc của ConcurrentHashMap cấm; hành vi không được bảo đảm.","","ConcurrentHashMap không dùng cơ chế modCount fail-fast, iterator của nó là weakly consistent nên không ném ConcurrentModificationException.","Không có NullPointerException ở đây; ConcurrentHashMap chỉ cấm null key và null value."]},{"id":"d-18-9","topicId":18,"versions":[8,11,17,21],"difficulty":"intermediate","question":"Hai thread cùng gọi transfer nhưng với thứ tự tham số ngược nhau: transfer(A, B) và transfer(B, A). Cách sửa nào loại bỏ được deadlock một cách chắc chắn?","code":"void transfer(Account from, Account to, int amt) {\n    synchronized (from) {\n        synchronized (to) {\n            from.debit(amt);\n            to.credit(amt);\n        }\n    }\n}","choices":["Thêm volatile cho field balance của Account","Đổi thành một khoá tĩnh duy nhất cho toàn bộ class Account","Áp đặt thứ tự khoá nhất quán — luôn khoá account có id (hoặc identityHashCode) nhỏ hơn trước — để phá điều kiện circular wait","Rút ngắn vùng găng bằng cách gọi debit và credit ngoài khối synchronized"],"correctAnswer":2,"explanation":"Deadlock ở đây do circular wait: thread 1 giữ A chờ B, thread 2 giữ B chờ A. Nếu mọi thread luôn lấy khoá theo cùng một thứ tự toàn cục thì không thể tạo được vòng, nên deadlock bị loại trừ về mặt cấu trúc chứ không phải giảm xác suất. Với object không có thứ tự tự nhiên, dùng System.identityHashCode kèm một tie lock cho trường hợp trùng hash; nếu có id nghiệp vụ thì sắp theo id đơn giản và tin cậy hơn. Phương án thay thế là tryLock có timeout, nhưng khi thất bại bắt buộc phải nhả hết khoá đang giữ rồi thử lại sau một khoảng ngẫu nhiên.","whyWrong":["volatile chỉ giải quyết visibility của một biến, hoàn toàn không liên quan tới thứ tự lấy khoá.","Một khoá tĩnh duy nhất đúng là hết deadlock, nhưng biến mọi giao dịch trên toàn hệ thống thành tuần tự — đó là bỏ đi khả năng mở rộng chứ không phải sửa lỗi.","","Gọi debit và credit ngoài vùng găng làm mất tính nguyên tử của giao dịch, tạo ra lỗi mất tiền còn nghiêm trọng hơn deadlock."]},{"id":"d-19-1","topicId":19,"versions":[8,11,17,21],"difficulty":"beginner","question":"Vì sao Effective Java khuyến nghị dùng enum một phần tử làm cách cài Singleton tốt nhất?","choices":["Vì enum khởi tạo lười (lazy) nên tiết kiệm bộ nhớ hơn holder idiom","Vì enum chống được cả serialization lẫn reflection — hai đường phá singleton mà các cách khác đều dính","Vì enum có thể extends một class cha nên linh hoạt hơn","Vì enum tự động đồng bộ hoá mọi method của nó"],"correctAnswer":1,"explanation":"Singleton cài bằng class thường có hai lỗ hổng: deserialize sẽ tạo ra instance thứ hai trừ khi bạn cài readResolve(), và Constructor.setAccessible(true) rồi newInstance() có thể tạo instance mới qua reflection. Enum bịt cả hai một cách miễn phí: cơ chế serialization của enum chỉ ghi tên hằng, và JVM từ chối thẳng việc tạo enum bằng reflection với IllegalArgumentException. Đổi lại, enum không extends được class khác và mọi hằng được tạo eager ngay tại bước khởi tạo class (class initialization), chứ không phải tại bước nạp class (loading).","whyWrong":["Enum khởi tạo khi class được khởi tạo (class initialization) chứ không phải lúc nạp (loading), và như vậy vẫn không lười hơn holder idiom; holder mới là cách lazy thật sự","","Enum không thể extends class khác — đây chính là nhược điểm của nó chứ không phải ưu điểm","Enum không tự đồng bộ hoá gì cả; nếu enum có state mutable thì bạn vẫn phải tự lo thread-safety"]},{"id":"d-19-2","topicId":19,"versions":[8,11,17,21],"difficulty":"beginner","question":"Đoạn double-checked locking sau thiếu volatile. Hậu quả cụ thể là gì?","code":"public class Config {\n    private static Config instance;          // thieu volatile\n    private final Map<String, String> data;\n\n    private Config() { this.data = loadFromDisk(); }\n\n    public static Config getInstance() {\n        if (instance == null) {\n            synchronized (Config.class) {\n                if (instance == null) instance = new Config();\n            }\n        }\n        return instance;\n    }\n}","choices":["Có thể tạo ra hai instance vì hai thread cùng vào synchronized một lúc","Không có vấn đề gì vì synchronized đã đảm bảo mọi thứ","Deadlock khi nhiều thread cùng gọi getInstance()","Một thread có thể nhận về instance khác null nhưng chưa khởi tạo xong, với field data còn là null"],"correctAnswer":3,"explanation":"Dòng instance = new Config() gồm ba bước: cấp phát bộ nhớ, chạy constructor, gán tham chiếu — và compiler cùng CPU được phép sắp xếp lại hai bước sau. Thread B đọc instance ở lần kiểm tra đầu (nằm ngoài synchronized) có thể thấy tham chiếu khác null trong khi constructor chưa chạy xong, nên nhận về object với field data còn giá trị mặc định null. volatile chặn kiểu reordering này nhờ ngữ nghĩa happens-before của Java Memory Model từ JSR-133 (Java 5); trước Java 5 thì DCL không có cách nào làm đúng.","whyWrong":["synchronized vẫn đảm bảo loại trừ lẫn nhau nên chỉ có một instance được tạo; vấn đề nằm ở tính hiển thị và thứ tự, không phải số lượng","synchronized chỉ bảo vệ đoạn code bên trong nó; lần kiểm tra đầu tiên nằm ngoài khối và không có bảo đảm nào cả","Chỉ có một khoá duy nhất và không có khoá lồng nhau nên không thể deadlock",""]},{"id":"d-19-3","topicId":19,"versions":[8,11,17,21],"difficulty":"beginner","question":"Đoạn code sau minh hoạ pattern nào, và vì sao?","code":"InputStream in = new BufferedInputStream(\n                     new GZIPInputStream(\n                         new FileInputStream(\"data.gz\")));","choices":["Decorator, vì mỗi lớp bọc giữ nguyên interface InputStream và thêm đúng một khả năng","Adapter, vì mỗi lớp chuyển đổi dữ liệu từ định dạng này sang định dạng khác","Proxy, vì các lớp bọc kiểm soát việc truy cập vào file thật","Composite, vì nhiều stream được ghép thành một cây"],"correctAnswer":0,"explanation":"Đây là ví dụ Decorator nổi tiếng nhất trong JDK: mỗi lớp vừa là InputStream vừa nhận một InputStream, và mỗi lớp thêm đúng một năng lực (giải nén, đệm) mà không đổi interface. Giá trị thiết kế là tổ hợp tuyến tính: n khả năng cần n class, thay vì phải viết class cho từng tổ hợp như khi dùng kế thừa. Điểm phân biệt cần thuộc: Decorator giữ nguyên kiểu và thêm hành vi, Adapter đổi kiểu mà giữ nguyên hành vi, Proxy giữ nguyên kiểu nhưng kiểm soát việc truy cập.","whyWrong":["","Adapter đổi interface để nối hai API không khớp; ở đây interface trước và sau khi bọc đều là InputStream. InputStreamReader mới là ví dụ Adapter","Proxy tồn tại để kiểm soát truy cập (quyền, transaction, khởi tạo trễ), còn ở đây mục đích là bổ sung năng lực xử lý dữ liệu","Composite dùng để coi một nhóm object như một object đơn lẻ theo cấu trúc cây; chuỗi bọc tuyến tính này không phải cây"]},{"id":"d-19-4","topicId":19,"versions":[8,11,17,21],"difficulty":"intermediate","question":"Bean Spring sau chạy nhưng transaction không bao giờ được mở khi save() bị lỗi. Vì sao?","code":"@Service\npublic class OrderService {\n\n    public void processAll(List<Order> orders) {\n        for (Order o : orders) {\n            save(o);                 // goi noi bo\n        }\n    }\n\n    @Transactional\n    public void save(Order o) {\n        repo.save(o);\n        if (o.total() < 0) throw new IllegalStateException();\n    }\n}","choices":["Vì @Transactional không hoạt động trong vòng lặp","Vì save() là public nên Spring bỏ qua annotation","Vì lời gọi save(o) đi qua this tới đối tượng thật, không đi qua proxy, nên advice transaction không chạy","Vì IllegalStateException là checked exception nên Spring không rollback"],"correctAnswer":2,"explanation":"Spring AOP hiện thực @Transactional bằng proxy: advice chỉ chạy khi lời gọi đi từ bên ngoài vào qua đối tượng proxy. Trong processAll, save(o) tương đương this.save(o) và đi thẳng tới đối tượng thật, nên proxy hoàn toàn không tham gia — transaction không mở, không có gì để rollback, và không có lỗi hay cảnh báo nào. Cách xử lý sạch nhất là tách save() sang một bean khác rồi inject vào; các cách tự inject chính mình hoặc AopContext.currentProxy() đều là dấu hiệu thiết kế nên xem lại.","whyWrong":["Vòng lặp không liên quan; gọi save(o) một lần từ trong cùng class cũng bị y hệt","Ngược lại, @Transactional chỉ hoạt động trên method public khi dùng proxy; private mới là thứ bị bỏ qua","","IllegalStateException là unchecked, và Spring mặc định rollback với RuntimeException — vấn đề là chưa từng có transaction nào được mở"]},{"id":"d-19-5","topicId":19,"versions":[8,11,17,21],"difficulty":"intermediate","question":"Khác biệt cốt lõi giữa Strategy và Template Method là gì?","choices":["Strategy chỉ dùng được với interface, Template Method chỉ dùng được với abstract class","Strategy dùng composition nên thay được lúc runtime; Template Method dùng kế thừa nên cố định lúc biên dịch","Strategy dành cho thuật toán, Template Method dành cho cấu trúc dữ liệu","Template Method nhanh hơn vì không phải gọi qua một object trung gian"],"correctAnswer":1,"explanation":"Template Method để class cha giữ thứ tự các bước và class con điền vào những chỗ trống, nên quan hệ được cố định lúc biên dịch qua kế thừa và một class con chỉ thay đổi được đúng những gì cha cho phép. Strategy đặt thuật toán vào một object riêng và giữ nó như một field, nên có thể đổi lúc runtime và một object có thể mang nhiều strategy cùng lúc. Vì kế thừa tạo ràng buộc chặt và chỉ dùng được một lần, thiết kế hiện đại thường nghiêng về Strategy, còn Template Method vẫn hợp khi luồng xử lý thực sự cố định.","whyWrong":["Strategy hoàn toàn có thể dùng abstract class, và điểm phân biệt không nằm ở loại kiểu mà ở cơ chế composition hay kế thừa","","Cả hai đều là pattern hành vi về thuật toán; không có sự phân chia nào theo cấu trúc dữ liệu","Chênh lệch hiệu năng ở đây là không đáng kể và JIT thường inline được; đó không phải tiêu chí để chọn"]},{"id":"d-19-6","topicId":19,"versions":[8,11,17,21],"difficulty":"intermediate","question":"Đoạn code sau ném ClassCastException hoặc IllegalArgumentException lúc runtime. Vì sao?","code":"public class PaymentService {          // class thuong, KHONG implement interface nao\n    public void pay(long amount) { }\n}\n\nPaymentService proxy = (PaymentService) Proxy.newProxyInstance(\n        PaymentService.class.getClassLoader(),\n        new Class<?>[]{ PaymentService.class },\n        (p, m, args) -> null);","choices":["Vì thiếu constructor không tham số trong PaymentService","Vì InvocationHandler trả về null cho method có kiểu trả về void","Vì phải truyền class loader của interface chứ không phải của class","Vì java.lang.reflect.Proxy chỉ tạo được proxy cho interface, không tạo được cho class thường"],"correctAnswer":3,"explanation":"Dynamic proxy của JDK sinh ra một class implement các interface bạn truyền vào, nên mọi phần tử trong mảng Class[] bắt buộc phải là interface — truyền một class thường sẽ bị từ chối. Để proxy một class không có interface, phải dùng thư viện sinh subclass lúc runtime như CGLIB hoặc ByteBuddy. Đây chính là lý do Spring có hai chế độ proxy, và Spring Boot mặc định đặt proxyTargetClass=true để dùng CGLIB — kéo theo hệ quả là method final, private hay static không được proxy nên advice trên chúng im lặng vô hiệu.","whyWrong":["Proxy của JDK không hề gọi constructor của class đích nên constructor không liên quan; đó lại là ràng buộc của CGLIB","Trả về null cho method void là hợp lệ với InvocationHandler và không gây lỗi ở đây","Class loader chỉ ảnh hưởng tới nơi class proxy được định nghĩa, không phải nguyên nhân của lỗi này",""]},{"id":"d-19-7","topicId":19,"versions":[17,21],"difficulty":"intermediate","question":"Có record Order(String id, String customer, BigDecimal total, String note, String coupon) với 3 field cuối là tuỳ chọn. Nhận định nào đúng?","choices":["Record đã thay thế Builder hoàn toàn nên không cần builder nữa","Record cho tính bất biến và equals/hashCode miễn phí, nhưng canonical constructor vẫn bắt truyền đủ mọi component theo đúng thứ tự nên Builder vẫn hữu ích","Record không cho phép validate nên bắt buộc phải dùng Builder","Record tự sinh sẵn một builder tĩnh nên chỉ cần gọi Order.builder()"],"correctAnswer":1,"explanation":"Record (chuẩn từ Java 16, có ở LTS 17 và 21) cho bạn miễn phí tính bất biến, equals/hashCode/toString và tham số có tên trong chữ ký, nên với 3-4 component thì builder trở nên thừa. Nhưng record không giải quyết bài toán tham số tuỳ chọn: gọi canonical constructor vẫn phải truyền đủ mọi component đúng thứ tự, và hai String liền nhau vẫn có thể bị hoán đổi mà compiler không phát hiện. Validate thì đặt trong compact constructor, và với record nhiều component thì viết thêm một static nested Builder vẫn là lựa chọn hợp lý.","whyWrong":["Record không có khái niệm tham số tuỳ chọn nên với nhiều component thì bài toán gốc của Builder vẫn còn nguyên","","Record validate được rất gọn qua compact constructor — đó là một trong những tính năng chính của nó","JDK không sinh builder cho record; muốn có phải tự viết hoặc dùng công cụ sinh code"]},{"id":"d-19-8","topicId":19,"versions":[8,11,17,21],"difficulty":"advanced","question":"Ứng dụng dùng Observer, heap tăng dần theo thời gian chạy dù không lưu thêm dữ liệu nghiệp vụ nào. Nguyên nhân khả dĩ nhất?","code":"class EventBus {\n    private final List<Runnable> listeners = new ArrayList<>();\n    void subscribe(Runnable r) { listeners.add(r); }\n    void unsubscribe(Runnable r) { listeners.remove(r); }\n}\n\n// trong moi lan mo man hinh\nbus.subscribe(() -> screen.refresh());","choices":["ArrayList tự tăng dung lượng nên chiếm bộ nhớ theo cấp số nhân","Lambda tạo một class mới mỗi lần chạy nên metaspace tăng","EventBus giữ tham chiếu mạnh tới listener; lambda bắt biến screen nên giữ luôn cả màn hình, và không có tham chiếu nào để gọi unsubscribe","Runnable không được GC dọn vì nó là functional interface"],"correctAnswer":2,"explanation":"Subject thường sống lâu hơn listener, nên danh sách listener bằng tham chiếu mạnh sẽ giữ mọi thứ mà listener bắt được — ở đây lambda capture biến screen nên toàn bộ màn hình cùng đồ thị object của nó không bao giờ được GC dọn. Tình huống còn tệ hơn vì lambda là một object vô danh: bạn không giữ tham chiếu nào để truyền vào unsubscribe, mà remove() lại so sánh bằng equals nên một lambda mới tương đương về code cũng không khớp. Cách xử lý: giữ tham chiếu listener để gỡ tường minh, gắn vòng đời đăng ký với vòng đời màn hình, hoặc dùng WeakReference kèm cơ chế dọn.","whyWrong":["ArrayList tăng dung lượng theo hệ số cố định và phần đó không đáng kể; thứ chiếm bộ nhớ là các object bị listener giữ lại","Lambda được liên kết một lần qua invokedynamic và class sinh ra được tái sử dụng; số lượng class không tăng theo mỗi lần gọi","","Functional interface không có ảnh hưởng gì tới GC; object bị giữ lại chỉ vì còn tham chiếu mạnh từ danh sách listener"]},{"id":"d-19-9","topicId":19,"versions":[8,11,17,21],"difficulty":"advanced","question":"Nhận định nào đúng về Dependency Injection và Service Locator?","choices":["DI là một Creational Pattern trong sách GoF, còn Service Locator là biến thể của nó","Cả hai đều là pattern GoF, khác nhau ở chỗ DI dùng constructor còn Service Locator dùng static method","DI không nằm trong danh mục GoF mà là một dạng Inversion of Control; Service Locator bị coi là anti-pattern vì giấu phụ thuộc khỏi chữ ký và khiến lỗi chỉ lộ lúc runtime","Service Locator tốt hơn DI trong ứng dụng lớn vì giảm số tham số constructor"],"correctAnswer":2,"explanation":"Sách GoF xuất bản năm 1994 không có Dependency Injection; thuật ngữ do Martin Fowler đặt năm 2004 để mô tả một dạng cụ thể của Inversion of Control, và nó gắn với Dependency Inversion Principle trong SOLID. Service Locator giải cùng bài toán nhưng theo chiều ngược lại: object tự đi lấy phụ thuộc từ một registry toàn cục, nên nhìn constructor không biết class cần những gì, test phải dựng cả registry, và thiếu phụ thuộc chỉ vỡ lúc chạy thay vì lỗi biên dịch. Chi tiết đáng nói thêm: constructor có quá nhiều tham số là một tín hiệu tốt cho biết class đang ôm quá nhiều trách nhiệm — che nó đi bằng Service Locator là bỏ mất tín hiệu đó.","whyWrong":["GoF không có DI; danh mục Creational của họ gồm Singleton, Factory Method, Abstract Factory, Builder, Prototype","Cả DI lẫn Service Locator đều không nằm trong 23 pattern GoF, và điểm phân biệt là chiều của luồng phụ thuộc chứ không phải cú pháp","","Số tham số constructor lớn là triệu chứng cần refactor chứ không phải vấn đề cần che giấu; Service Locator chỉ làm phụ thuộc trở nên vô hình"]},{"id":"d-20-1","topicId":20,"versions":[8,11,17,21],"difficulty":"beginner","question":"Vòng lặp sau có độ phức tạp thời gian thế nào, và Java 9+ có làm nó nhanh lên không?","code":"String s = \"\";\nfor (int i = 0; i < n; i++) {\n    s += i + \",\";\n}","choices":["O(n) — từ Java 9, invokedynamic của StringConcatFactory làm phép nối chuỗi trở thành hằng số thời gian","O(n^2) — mỗi lần lặp tạo một chuỗi mới và phải sao chép lại toàn bộ nội dung cũ; tối ưu của Java 9 chỉ áp dụng trong một biểu thức, không gộp được các lần lặp","O(n log n) vì compiler tự chuyển sang StringBuilder có tăng trưởng theo cấp số nhân","O(n) ở mọi phiên bản vì javac luôn tự động thay thế vòng lặp bằng StringBuilder"],"correctAnswer":1,"explanation":"Độ phức tạp là O(n^2). String bất biến nên mỗi phép += tạo một object String mới và sao chép toàn bộ nội dung cũ sang, tổng chi phí là 1+2+...+n. Javac có tối ưu phép nối chuỗi, nhưng chỉ trong phạm vi MỘT biểu thức — mỗi lần lặp là một biểu thức riêng nên nó tạo rồi vứt một bộ máy nối chuỗi mới ở mỗi vòng. Java 9 thay việc sinh StringBuilder bằng invokedynamic tới StringConcatFactory (JEP 280), cho hằng số nhân tốt hơn nhưng không thay đổi độ phức tạp. Cách sửa là dùng một StringBuilder duy nhất bên ngoài vòng lặp, hoặc String.join / Collectors.joining.","whyWrong":["StringConcatFactory tối ưu từng biểu thức nối chuỗi, nó không thể nhìn xuyên qua vòng lặp để tái sử dụng bộ đệm.","","Không có phiên bản Java nào cho ra O(n log n) ở đây; chi phí sao chép là tuyến tính ở mỗi vòng nên tổng là bậc hai.","Javac chỉ tối ưu trong phạm vi một biểu thức, chưa bao giờ tự nâng StringBuilder ra ngoài vòng lặp."]},{"id":"d-20-2","topicId":20,"versions":[8,11,17,21],"difficulty":"beginner","question":"Cách dùng Optional nào dưới đây đúng với ý đồ thiết kế của nó?","choices":["Dùng làm kiểu field của entity để tránh null trong database","Dùng làm kiểu tham số của method để người gọi biết giá trị có thể vắng mặt","Dùng làm kiểu trả về của method tra cứu có thể không tìm thấy kết quả","Dùng bọc collection để phân biệt list rỗng với list chưa được nạp"],"correctAnswer":2,"explanation":"Optional được thêm vào Java 8 cho đúng một mục đích: làm rõ trong CHỮ KÝ method rằng kết quả có thể vắng mặt, để compiler nhắc người gọi xử lý. Ba lựa chọn còn lại đều là những cách dùng sai phổ biến. Optional không implement Serializable nên làm field gây rắc rối với JPA/Jackson và tốn thêm một lớp object mỗi instance; làm tham số thì ép người gọi bọc giá trị chỉ để bạn mở ra ngay, dùng overload sẽ sạch hơn; còn collection rỗng vốn đã diễn đạt đủ ý 'không có gì' nên bọc thêm Optional chỉ làm người gọi phải kiểm tra hai lần.","whyWrong":["Optional không Serializable, gây vấn đề với JPA và Jackson, và tốn thêm một object cho mỗi instance.","Làm tham số buộc người gọi viết Optional.of(...) chỉ để bạn unwrap ngay — dùng overload hoặc null có tài liệu rõ ràng thì tốt hơn.","","Trả Optional cho collection buộc người gọi kiểm tra cả 'có Optional không' lẫn 'list có rỗng không'; hãy trả list rỗng."]},{"id":"d-20-3","topicId":20,"versions":[8,11,17,21],"difficulty":"beginner","question":"Ứng dụng chạy production ở mức log INFO. Hai dòng dưới đây khác nhau thế nào?","code":"log.debug(\"processing order \" + order + \" for user \" + user);\nlog.debug(\"processing order {} for user {}\", order, user);","choices":["Không khác gì: SLF4J tối ưu cả hai dạng như nhau","Dòng đầu vẫn thực hiện nối chuỗi và gọi toString() của order/user dù mức debug đang tắt; dòng sau chỉ định dạng khi debug thực sự bật","Dòng sau chậm hơn vì phải phân tích placeholder lúc chạy","Dòng đầu an toàn hơn vì tránh được lỗi khi số placeholder không khớp số đối số"],"correctAnswer":1,"explanation":"Với dạng nối chuỗi, phép nối và các lời gọi toString() được thực hiện TRƯỚC khi vào method log.debug, nên chi phí phát sinh dù mức debug đang tắt — trong đường dẫn nóng, một toString() nặng của entity có thể trở thành hotspot thật sự. Dạng placeholder truyền tham chiếu vào, và SLF4J chỉ định dạng chuỗi khi mức log đang bật. Với đối số cực đắt, hãy dùng thêm isDebugEnabled() hoặc dạng lambda của SLF4J 2.x. Quy tắc rút ra: luôn dùng placeholder, và đừng để dữ liệu nhạy cảm lọt vào toString().","whyWrong":["SLF4J không thể can thiệp vào phép nối chuỗi vì nó đã hoàn tất trước khi method log được gọi.","","Chi phí phân tích placeholder là không đáng kể và chỉ phát sinh khi dòng log thực sự được ghi ra.","SLF4J xử lý lệch số lượng placeholder một cách an toàn; đây không phải lý do để chọn nối chuỗi."]},{"id":"d-20-4","topicId":20,"versions":[8,11,17,21],"difficulty":"intermediate","question":"Benchmark JMH sau đo ra thời gian gần bằng 0. Vì sao?","code":"@State(Scope.Benchmark)\npublic class Bench {\n    private final double x = 42.0;\n\n    @Benchmark\n    public void measure() {\n        Math.log(x);\n    }\n}","choices":["Vì Math.log là intrinsic nên JIT thay bằng một lệnh CPU duy nhất, đó là kết quả thật","Vì @State(Scope.Benchmark) làm JMH chỉ chạy method đúng một lần","Vì JMH tự bỏ qua các method có kiểu trả về void","Vì kết quả không được dùng nên JIT loại bỏ phép tính (dead code elimination); ngoài ra x là final nên còn bị constant folding"],"correctAnswer":3,"explanation":"Hai lỗi cùng lúc. Kết quả của Math.log không được dùng ở đâu, nên C2 hoàn toàn có quyền xoá lời gọi đó — bạn đang đo một method rỗng. Thêm nữa, x là final và được gán hằng số, nên JIT có thể tính sẵn Math.log(42.0) lúc biên dịch (constant folding) và không còn phép tính nào lúc chạy. Cách sửa: trả về giá trị từ method @Benchmark (JMH tự nuốt qua Blackhole) hoặc gọi bh.consume(...), và khởi tạo đầu vào trong @Setup bằng giá trị không phải hằng. Nguyên tắc chung: con số nhanh bất thường là dấu hiệu benchmark hỏng chứ không phải tối ưu thành công.","whyWrong":["Math.log đúng là có intrinsic nhưng vẫn tốn hàng chục nanosecond; kết quả gần 0 không thể là số đo thật.","Scope.Benchmark chỉ nói rằng state được chia sẻ giữa các thread, không liên quan gì tới số lần chạy.","JMH chạy bình thường method trả về void; chính vì thế mà dead code elimination mới trở thành cái bẫy.",""]},{"id":"d-20-5","topicId":20,"versions":[8,11,17,21],"difficulty":"intermediate","question":"Một đội có 5000 unit test luôn xanh nhưng production vẫn liên tục lỗi khi lưu dữ liệu. Mọi repository trong test đều được mock. Nguyên nhân gốc rễ có khả năng nhất là gì?","choices":["Coverage chưa đạt 100% nên còn nhánh chưa được test","Số lượng unit test quá nhiều làm chúng che khuất nhau","Cần chuyển toàn bộ sang end-to-end test để mô phỏng đúng người dùng","Mock repository làm test chỉ kiểm chứng giả định của chính đội về database; những lỗi thật như SQL sai, sai kiểu cột, vi phạm ràng buộc hay transaction không commit đều nằm ngoài tầm với của unit test"],"correctAnswer":3,"explanation":"Khi mọi collaborator đều bị mock, thứ được kiểm chứng là giả định của bạn về collaborator chứ không phải hành vi thật. Mock repository luôn trả đúng thứ test mong đợi, nên nó không bao giờ phát hiện được lỗi cú pháp SQL, sai ánh xạ kiểu cột, vi phạm khoá ngoại, lazy loading ngoài transaction hay transaction không commit. Cách sửa không phải là thêm E2E test mà là bổ sung một tầng integration test chạy trên database thật bằng Testcontainers — đủ nhanh để nằm trong CI mà vẫn bắt được đúng nhóm lỗi này. Nguyên tắc: chỉ mock thứ bạn không kiểm soát hoặc quá đắt để chạy thật.","whyWrong":["Coverage cao không giúp gì khi mọi phụ thuộc đều là mock; bạn chỉ phủ nhiều hơn phần code đã bị cô lập khỏi thực tế.","Số lượng test không phải nguyên nhân; vấn đề nằm ở chất lượng của thứ được test.","Chuyển hết sang E2E tạo bộ test chậm và flaky (mô hình ice-cream cone); tầng cần bổ sung là integration test.",""]},{"id":"d-20-6","topicId":20,"versions":[8,11,17,21],"difficulty":"intermediate","question":"Class dưới đây có thật sự bất biến không?","code":"public final class Order {\n    private final String id;\n    private final List<Item> items;\n\n    public Order(String id, List<Item> items) {\n        this.id = id;\n        this.items = items;\n    }\n\n    public List<Item> getItems() { return items; }\n}","choices":["Không: final chỉ khoá reference, nên người gọi vừa có thể sửa list đã truyền vào constructor, vừa có thể gọi getItems().add(...) để sửa trạng thái bên trong","Có: mọi field đều final và class cũng final nên object không thể thay đổi","Có, miễn là Item là class bất biến","Chỉ cần đổi getItems() thành Collections.unmodifiableList(items) là đủ để class này bất biến"],"correctAnswer":0,"explanation":"Đây là bất biến giả. Từ khoá final chỉ đảm bảo biến items không được trỏ sang list khác, hoàn toàn không ràng buộc gì về NỘI DUNG của list. Có hai lỗ hổng: người gọi vẫn giữ reference tới list đã truyền vào constructor và sửa nó bất cứ lúc nào, và getItems() trả thẳng list nội bộ nên bất kỳ ai cũng gọi được add/remove. Muốn bất biến thật phải defensive copy ở CẢ HAI đầu — cách gọn nhất là this.items = List.copyOf(items) trong constructor, vì List.copyOf vừa sao chép vừa trả về list không thể sửa — lưu ý List.copyOf chỉ có từ Java 10, trên Java 8 phải viết Collections.unmodifiableList(new ArrayList<>(items)). Một hệ quả cần nói cho chính xác: Order ở trên KHÔNG override equals/hashCode nên nó dùng identity hash, sửa list không làm hỏng việc tra HashMap. Nhưng ngay khi bạn cho class này một equals/hashCode theo giá trị (record, Lombok @Data, hay tự viết dựa trên items) thì mutable state trở thành lỗ hổng thật: hashCode đổi sau khi put và get() trả về null.","whyWrong":["","final trên field chỉ khoá reference chứ không khoá nội dung object mà nó trỏ tới.","Item bất biến không cứu được gì: bản thân List vẫn cho phép thêm và xoá phần tử.","Chỉ bọc ở getter là bịt một lỗ và bỏ quên lỗ còn lại — reference truyền vào constructor vẫn nằm trong tay người gọi."]},{"id":"d-20-7","topicId":20,"versions":[8,11,17,21],"difficulty":"intermediate","question":"Vì sao nên gọi Objects.requireNonNull ngay trong constructor thay vì để NullPointerException tự xảy ra khi dùng?","code":"public class ShippingService {\n    private final RateProvider rates;\n\n    public ShippingService(RateProvider rates) {\n        this.rates = Objects.requireNonNull(rates, \"rates\");\n    }\n}","choices":["Vì Objects.requireNonNull nhanh hơn phép so sánh rates == null","Vì nó biến NullPointerException thành checked exception nên compiler ép xử lý","Vì nó ngăn không cho NullPointerException xảy ra trong toàn bộ vòng đời của object","Vì fail fast: lỗi nổ ngay tại nơi giá trị sai được đưa vào, kèm stack trace chỉ thẳng vào người gọi sai, thay vì nổ sau đó rất lâu ở một tầng khác và một thread khác"],"correctAnswer":3,"explanation":"Giá trị nằm ở khoảng cách giữa nguyên nhân và triệu chứng. Nếu để null lọt vào field, NPE sẽ nổ ở một lời gọi bất kỳ sau này — có thể sau nhiều tầng, trong một thread khác, hàng giờ sau — và stack trace lúc đó chỉ vào nơi SỬ DỤNG chứ không chỉ ra ai đã truyền null. Kiểm tra tại constructor biến nó thành lỗi ngay tại điểm khởi tạo, kèm thông điệp nêu rõ tên tham số. Chi phí gần bằng 0. Nói thêm về sắc thái phiên bản: từ Java 15, helpful NullPointerException (JEP 358) bật mặc định giúp message chỉ rõ biến nào null, nhưng nó chỉ cải thiện việc chẩn đoán chứ không rút ngắn khoảng cách giữa nguyên nhân và triệu chứng.","whyWrong":["Hiệu năng không phải lý do; requireNonNull về bản chất chính là một phép so sánh null, chỉ gọn hơn về cú pháp.","requireNonNull ném NullPointerException, vốn là unchecked — không có chuyện compiler ép xử lý.","Nó không ngăn NPE ở nơi khác, chỉ đảm bảo riêng field này không bao giờ null.",""]},{"id":"d-20-8","topicId":20,"versions":[8,11,17,21],"difficulty":"advanced","question":"Phép đo dưới đây kết luận thuật toán A nhanh gấp 8 lần thuật toán B. Vì sao kết luận này không đáng tin?","code":"long t0 = System.currentTimeMillis();\nfor (int i = 0; i < 10_000; i++) resultA = algoA(data);\nlong tA = System.currentTimeMillis() - t0;\n\nlong t1 = System.currentTimeMillis();\nfor (int i = 0; i < 10_000; i++) resultB = algoB(data);\nlong tB = System.currentTimeMillis() - t1;","choices":["Vì currentTimeMillis không đủ chính xác, chỉ cần đổi sang nanoTime là phép đo trở nên đáng tin","Vì thiếu warm-up: algoA gánh phần lớn thời gian chạy ở chế độ thông dịch và chi phí JIT, còn algoB được hưởng lợi từ JVM đã ấm; ngoài ra một lần chạy không kiểm soát được GC, profile pollution và biến động của hệ điều hành","Vì hai vòng lặp phải chạy trong hai thread khác nhau mới so sánh được","Vì JIT luôn tối ưu vòng lặp thứ hai kém hơn vòng lặp thứ nhất"],"correctAnswer":1,"explanation":"Nguồn sai lớn nhất là thiếu warm-up. HotSpot chạy thông dịch trước rồi mới biên dịch method nóng, nên vòng lặp đầu tiên gánh cả thời gian thông dịch lẫn thời gian biên dịch, còn vòng lặp thứ hai chạy trên một JVM đã ấm — chỉ riêng thứ tự đo đã đủ tạo ra chênh lệch nhiều lần. Còn nhiều nguồn nhiễu khác: một chu kỳ GC rơi vào một trong hai vòng lặp, profile pollution (nếu cả hai gọi chung một method thì call site trở thành megamorphic và JIT tối ưu kém đi), dao động tần số CPU và scheduling của OS. Cách làm đúng là dùng JMH với warm-up iteration, nhiều fork, nhiều iteration đo và báo cáo kèm khoảng tin cậy — đổi sang nanoTime chỉ sửa được sai số nhỏ nhất trong danh sách.","whyWrong":["nanoTime có độ phân giải tốt hơn nhưng với thang đo hàng nghìn vòng lặp thì độ phân giải không phải vấn đề chính.","","Chạy đa luồng làm phép đo nhiễu hơn hẳn chứ không giúp gì cho tính đúng đắn.","JIT không hề ưu tiên vòng lặp theo thứ tự; thực tế vòng lặp chạy sau thường được lợi vì JVM đã ấm."]},{"id":"d-20-9","topicId":20,"versions":[8,11,17,21],"difficulty":"advanced","question":"Một đội thay ArrayList bằng LinkedList vì 'chèn/xoá ở giữa là O(1)'. Kết quả đo lại cho thấy chậm hơn. Giải thích đúng nhất là gì?","choices":["LinkedList chỉ nhanh khi danh sách có dưới 100 phần tử","Vì LinkedList không implement RandomAccess nên các thuật toán trong Collections tự động từ chối tối ưu","Vì phép chèn của LinkedList thực chất là O(n) trong mọi trường hợp","Vì để chèn ở giữa vẫn phải duyệt tới vị trí đó (O(n)); thêm vào đó mỗi phần tử là một node riêng nằm rải rác trên heap nên cache miss rất nhiều, còn ArrayList lưu liên tục nên duyệt cực thân thiện với CPU cache và System.arraycopy dịch chuyển phần tử rất nhanh"],"correctAnswer":3,"explanation":"Con số O(1) của LinkedList chỉ đúng khi bạn ĐÃ có sẵn tham chiếu tới node, ví dụ khi chèn qua ListIterator. Nếu chèn theo chỉ số thì vẫn phải duyệt O(n) để tới nơi, nên tổng chi phí không tốt hơn ArrayList. Yếu tố quyết định trong thực tế là locality: ArrayList lưu phần tử liên tục nên duyệt gần như không có cache miss và việc dịch phần tử dùng System.arraycopy — một thao tác intrinsic rất nhanh trên khối bộ nhớ liền kề. LinkedList tạo một node object cho mỗi phần tử, nằm rải rác trên heap, mỗi bước duyệt là một lần có thể miss cache và tốn thêm bộ nhớ cho hai con trỏ. Bài học tổng quát: độ phức tạp tiệm cận bỏ qua hằng số, mà hằng số ở đây bị chi phối bởi phần cứng — nên phải đo trên dữ liệu thật.","whyWrong":["Danh sách càng nhỏ thì khác biệt càng không đáng kể; ưu thế của ArrayList thậm chí còn rõ hơn khi dữ liệu lớn nhờ locality.","Đúng là LinkedList không implement RandomAccess và một số thuật toán chuyển sang duyệt bằng iterator, nhưng đó là hệ quả chứ không phải nguyên nhân chính của chênh lệch hiệu năng.","Chèn của LinkedList là O(1) khi đã có node (qua ListIterator); phần O(n) nằm ở việc đi tới vị trí đó.",""]}];

/* ============ syntax highlighting ============ */
const KW = ('abstract assert boolean break byte case catch char class const continue default do ' +
  'double else enum extends final finally float for goto if implements import instanceof int ' +
  'interface long native new package private protected public return short static strictfp super ' +
  'switch synchronized this throw throws transient try void volatile while var record yield ' +
  'sealed permits non-sealed true false null').split(' ');

const TYPES = ('String Integer Long Double Boolean Object List ArrayList LinkedList Map HashMap ' +
  'TreeMap LinkedHashMap Set HashSet TreeSet Optional Stream IntStream Thread Runnable Callable Future ' +
  'CompletableFuture Exception RuntimeException IOException Error StringBuilder StringBuffer ' +
  'BigDecimal LocalDate LocalDateTime AtomicInteger AtomicLong ConcurrentHashMap ExecutorService ' +
  'ThreadPoolExecutor ThreadLocal ReentrantLock Comparator Comparable Iterator Collection Collectors ' +
  'Entry Arrays Collections Objects Math System User Order Item Account Payment Node Executors ' +
  'Person Product Customer Invoice Repository Service Controller Event Message Record Shape ' +
  'BlockingQueue LinkedBlockingQueue CountDownLatch Semaphore Class Number Character Byte Short ' +
  'Float Void Iterable Function Supplier Consumer Predicate Instant Duration UUID HttpClient ' +
  'HttpRequest HttpResponse Point Circle Square Animal Dog Cat Counter').split(' ');

function hl(src) {
  const store = [];
  const keep = t => '\u0000' + String.fromCodePoint(0xE000 + store.push(t) - 1) + '\u0000';
  let s = src.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  s = s.replace(/\/\/[^\n]*|\/\*[\s\S]*?\*\//g, m => keep('<span class="cm">' + m + '</span>'));
  s = s.replace(/"(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'/g, m => keep('<span class="s">' + m + '</span>'));
  s = s.replace(/@[A-Z]\w*/g, m => keep('<span class="an">' + m + '</span>'));
  s = s.replace(/\b\d[\d_]*[LlFfDd]?\b/g, m => keep('<span class="nu">' + m + '</span>'));
  s = s.replace(new RegExp('\\b(' + KW.join('|') + ')\\b', 'g'), m => keep('<span class="k">' + m + '</span>'));
  s = s.replace(new RegExp('\\b(' + TYPES.join('|') + ')\\b', 'g'), m => keep('<span class="ty">' + m + '</span>'));
  s = s.replace(/\.([a-z]\w*)(?=\s*\()/g, (_, n) => '.' + keep('<span class="fn">' + n + '</span>'));
  let guard = 0;
  while (s.indexOf('\u0000') !== -1 && guard++ < 20) {
    s = s.replace(/\u0000([\uE000-\uF8FF])\u0000/g, (m, ch) => store[ch.codePointAt(0) - 0xE000] ?? m);
  }
  return s;
}
function codeBlock(src, title) {
  if (!src) return '';
  return `<div class="code">${title ? `<div class="code-h">› ${esc(title)}</div>` : ''}<pre><code>${hl(String(src).trim())}</code></pre></div>`;
}
function esc(t) {
  return String(t == null ? '' : t)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
const vtags = vs => (vs || []).map(v => `<span class="tag v${v}">Java ${v}</span>`).join('');

/* ============ state ============ */
const KEY = 'java-core-lts-state-v2';
let currentMode = 'tutorials';
let currentTopic = TOPICS[0].id;
let currentDrillTopic = TOPICS[0].id;
let currentDifficulty = 'all';
let currentVersion = 'all';
let drillMode = 'topic';   // 'topic' | 'mixed' | 'wrong'
let mixedIds = [];         // bộ câu đã trộn, giữ ổn định giữa các lần vẽ lại
let mistakeIds = [];       // ảnh chụp các câu đang sai lúc vào chế độ ôn lại
let results = {};   // drillId -> {picked:int, ok:bool}

function loadState() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const s = JSON.parse(raw);
      results = s.results || {};
      if (s.version) currentVersion = s.version;
      if (s.drillMode) drillMode = s.drillMode;
      if (s.drillTopic) currentDrillTopic = s.drillTopic;
    }
  } catch (e) { results = {}; }
}
function saveState() {
  try {
    localStorage.setItem(KEY, JSON.stringify({
      results, version: currentVersion, drillMode, drillTopic: currentDrillTopic
    }));
  } catch (e) { /* quota/private mode - bỏ qua */ }
}

const matchVersion = item =>
  currentVersion === 'all' || (item.versions || []).includes(Number(currentVersion));

const tutorialsFor = id => TUTORIALS.filter(t => t.topicId === id && matchVersion(t));
const drillsFor = id => DRILLS.filter(d =>
  d.topicId === id && matchVersion(d) &&
  (currentDifficulty === 'all' || d.difficulty === currentDifficulty));

/* ============ render: shell ============ */
function renderVersionChips() {
  const vs = [['all', 'Tất cả', ''], [8, 'Java 8', '2014'], [11, 'Java 11', '2018'], [17, 'Java 17', '2021'], [21, 'Java 21', '2023']];
  document.getElementById('version-chips').innerHTML = vs.map(([v, label, year]) =>
    `<button class="chip ${String(currentVersion) === String(v) ? 'on' : ''}" onclick="setVersion('${v}')">
      <span>${label}</span>${year ? `<span class="n">${year}</span>` : ''}
    </button>`).join('');
}
function setVersion(v) {
  currentVersion = v;
  saveState();
  renderVersionChips();
  renderTopicsMenu(); renderTutorial();
  renderDrillsFilters(); renderDrills();
  updateProgress();
}
function switchMode(mode, skipHash) {
  currentMode = mode;
  document.getElementById('tutorials-mode').style.display = mode === 'tutorials' ? 'block' : 'none';
  document.getElementById('drills-mode').style.display = mode === 'drills' ? 'block' : 'none';
  document.getElementById('tab-tutorials').classList.toggle('active', mode === 'tutorials');
  document.getElementById('tab-drills').classList.toggle('active', mode === 'drills');
  if (!skipHash && history.replaceState) history.replaceState(null, '', mode === 'drills' ? '#drills' : '#tutorials');
  updateProgress();
}

/* ============ render: tutorials ============ */
function renderTopicsMenu() {
  document.getElementById('topics-menu').innerHTML = `
    <div class="menu-group">
      <div class="menu-label">Chủ Đề</div>
      <div class="menu-row">
        ${TOPICS.map(t => {
          const n = tutorialsFor(t.id).length;
          return `<div class="menu-item ${t.id === currentTopic ? 'active' : ''}" onclick="selectTopic(${t.id})">
            <span>${esc(t.name)}</span><span class="cnt">${n}</span>
          </div>`;
        }).join('')}
      </div>
    </div>`;
}
function selectTopic(id) {
  currentTopic = id;
  renderTopicsMenu();
  renderTutorial();
  document.getElementById('tutorials-content').scrollIntoView({ block: 'start', behavior: 'smooth' });
}
function renderTutorial() {
  const topic = TOPICS.find(t => t.id === currentTopic);
  const list = tutorialsFor(currentTopic);
  const el = document.getElementById('tutorials-content');
  const head = `<div class="topic-head"><h2>${esc(topic.name)}</h2><p class="lede">${esc(topic.desc)}</p></div>`;

  if (!list.length) {
    el.innerHTML = head + `<div class="placeholder">Không có bài hướng dẫn nào khớp bộ lọc phiên bản hiện tại.<br>Thử chọn “Tất cả” ở phần lọc phiên bản.</div>`;
    return;
  }
  el.innerHTML = head + list.map(t => `
    <div class="card">
      <div class="tagrow">${vtags(t.versions)}</div>
      <h3>${esc(t.title)}</h3>
      ${t.summary ? `<div class="tut-sum">${esc(t.summary)}</div>` : ''}
      <div class="prose">${(t.sections || []).map(s => `<p>${s}</p>`).join('')}</div>
      ${codeBlock(t.example, t.exampleTitle)}
      ${(t.keyPoints || []).length ? `<div class="kp"><div class="kp-h">💡 Điểm chính</div>
        <ul>${t.keyPoints.map(k => `<li>${esc(k)}</li>`).join('')}</ul></div>` : ''}
      ${t.trap ? `<div class="box trap"><div class="box-h">⚠ Bẫy phỏng vấn</div>${esc(t.trap)}</div>` : ''}
      ${(t.followUp || []).length ? `<div class="box follow"><div class="box-h">🎯 Câu hỏi vặn thường gặp</div>
        <ul>${t.followUp.map(f => `<li>${esc(f)}</li>`).join('')}</ul></div>` : ''}
    </div>`).join('');
}

/* ============ render: drills ============ */
/* Ba chế độ: theo chủ đề / trộn ngẫu nhiên nhiều chủ đề / ôn lại câu đã sai. */
const MIXED_SIZE = 20;

const wrongDrills = () => DRILLS.filter(d => results[d.id] && !results[d.id].ok && matchVersion(d));

function buildMixed() {
  const pool = DRILLS.filter(d => matchVersion(d) &&
    (currentDifficulty === 'all' || d.difficulty === currentDifficulty));
  for (let i = pool.length - 1; i > 0; i--) {          // Fisher-Yates
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  mixedIds = pool.slice(0, MIXED_SIZE).map(d => d.id);
}

/* Nguồn sự thật duy nhất cho danh sách đang hiển thị. */
function visibleDrills() {
  if (drillMode === 'wrong') return wrongDrills();
  if (drillMode === 'mixed') {
    if (!mixedIds.length) buildMixed();
    const byId = new Map(DRILLS.map(d => [d.id, d]));
    return mixedIds.map(id => byId.get(id)).filter(Boolean);
  }
  return drillsFor(currentDrillTopic);
}

function renderDrillsFilters() {
  const diffs = [['all', 'Tất Cả'], ['beginner', 'Cơ Bản'], ['intermediate', 'Trung Bình'], ['advanced', 'Nâng Cao']];
  const nWrong = wrongDrills().length;
  const modes = [
    ['topic', 'Theo chủ đề', ''],
    ['mixed', 'Trộn ngẫu nhiên', ''],
    ['wrong', 'Câu đã sai', String(nWrong)],
  ];
  document.getElementById('filters-menu').innerHTML = `
    <div class="menu-group">
      <div class="menu-label">Chế Độ</div>
      <div class="menu-row">
        ${modes.map(([v, label, cnt]) =>
          `<div class="menu-item ${drillMode === v ? 'active' : ''}" onclick="setDrillMode('${v}')">
            <span>${label}</span>${cnt ? `<span class="cnt">${cnt}</span>` : ''}
          </div>`).join('')}
      </div>
    </div>
    ${drillMode === 'topic' ? `
    <div class="menu-group">
      <div class="menu-label">Chủ Đề</div>
      <div class="menu-row">
        ${TOPICS.map(t => {
          const all = DRILLS.filter(d => d.topicId === t.id && matchVersion(d));
          const done = all.filter(d => results[d.id]).length;
          return `<div class="menu-item ${t.id === currentDrillTopic ? 'active' : ''} ${all.length && done === all.length ? 'done' : ''}"
            onclick="setDrillTopic(${t.id})">
            <span>${esc(t.name)}</span><span class="cnt">${done}/${all.length}</span>
          </div>`;
        }).join('')}
      </div>
    </div>` : ''}
    ${drillMode !== 'wrong' ? `
    <div class="menu-group">
      <div class="menu-label">Độ Khó</div>
      <div class="menu-row">
        ${diffs.map(([v, label]) =>
          `<div class="menu-item ${currentDifficulty === v ? 'active' : ''}" onclick="setDifficulty('${v}')">${label}</div>`).join('')}
      </div>
    </div>` : ''}`;
}
function setDrillMode(m) {
  drillMode = m;
  if (m === 'mixed') buildMixed();
  if (m === 'wrong') mistakeIds = wrongDrills().map(d => d.id);
  saveState();
  renderDrillsFilters(); renderDrills();
  document.getElementById('drills-content').scrollIntoView({ block: 'start', behavior: 'smooth' });
}
function setDrillTopic(id) {
  currentDrillTopic = id;
  saveState();
  renderDrillsFilters(); renderDrills();
  document.getElementById('drills-content').scrollIntoView({ block: 'start', behavior: 'smooth' });
}
function setDifficulty(v) {
  currentDifficulty = v;
  if (drillMode === 'mixed') buildMixed();
  renderDrillsFilters(); renderDrills();
}
function reshuffle() {
  buildMixed();
  renderDrills();
  document.getElementById('drills-content').scrollIntoView({ block: 'start', behavior: 'smooth' });
}

/* Thanh thống kê — dùng chung cho cả lần vẽ đầu và lúc cập nhật tại chỗ. */
function statHtml() {
  const list = visibleDrills();
  const done = list.filter(d => results[d.id]);
  const right = done.filter(d => results[d.id].ok).length;
  const pct = done.length ? Math.round(right / done.length * 100) : 0;
  const label = drillMode === 'wrong' ? 'Ôn lại câu đã sai'
    : drillMode === 'mixed' ? `Trộn ngẫu nhiên (${list.length} câu)`
    : esc((TOPICS.find(t => t.id === currentDrillTopic) || {}).name || '');

  if (drillMode === 'wrong') {
    const fixed = mistakeIds.filter(id => results[id] && results[id].ok).length;
    return `<span class="s">Chế độ: <b>${label}</b></span>
      <span class="s no">Còn sai <b>${list.length}</b></span>
      ${fixed ? `<span class="s ok">Đã sửa được <b>${fixed}</b></span>` : ''}
      <span class="sp"></span>`;
  }
  return `<span class="s">${drillMode === 'mixed' ? 'Chế độ' : 'Chủ đề'}: <b>${label}</b></span>
      <span class="s">Đã làm <b>${done.length}</b>/${list.length}</span>
      <span class="s ok">Đúng <b>${right}</b></span>
      <span class="s no">Sai <b>${done.length - right}</b></span>
      ${done.length ? `<span class="s">Tỉ lệ <b>${pct}%</b></span>` : ''}
      <span class="sp"></span>
      ${drillMode === 'mixed' ? `<button class="reset" onclick="reshuffle()">↻ Trộn bộ khác</button>` : ''}
      ${drillMode === 'topic' && done.length ? `<button class="reset" onclick="resetTopic()">Làm lại chủ đề</button>` : ''}`;
}

function renderDrills() {
  const list = visibleDrills();
  const el = document.getElementById('drills-content');
  const stat = `<div class="statbar">${statHtml()}</div>`;

  if (!list.length) {
    const msg = drillMode === 'wrong'
      ? 'Chưa có câu nào bị sai — hãy làm bài tập trước đã.<br>Những câu bạn trả lời sai sẽ tự động gom về đây để ôn lại.'
      : 'Không có bài tập nào khớp bộ lọc hiện tại.<br>Thử đổi độ khó hoặc phiên bản.';
    el.innerHTML = stat + `<div class="placeholder">${msg}</div>`;
    return;
  }
  const heading = drillMode === 'wrong' ? `Câu Đã Sai (${list.length})` : `Bài Tập (${list.length})`;
  el.innerHTML = stat + `<div class="sec-h" style="margin-bottom:14px">${heading}</div>` +
    list.map(d => drillCard(d, drillMode !== 'topic')).join('');
}

function drillCard(d, showTopic) {
  const r = results[d.id];
  const letters = ['A', 'B', 'C', 'D', 'E', 'F'];
  const topic = showTopic ? (TOPICS.find(t => t.id === d.topicId) || {}).name : null;
  const choices = d.choices.map((c, i) => {
    let cls = 'choice';
    if (r) {
      cls += ' locked';
      if (i === d.correctAnswer) cls += ' correct';
      else if (i === r.picked) cls += ' wrong';
      else cls += ' dim';
    }
    return `<button class="${cls}" ${r ? '' : `onclick="answer('${d.id}',${i})"`}>
        <span class="ltr">${letters[i]}</span><span>${esc(c)}</span>
      </button>`;
  }).join('');

  let verdict = '';
  if (r) {
    const ww = (d.whyWrong || [])[r.picked];
    verdict = `<div class="verdict ${r.ok ? 'ok' : 'no'}">
      <div class="verdict-h">${r.ok ? '✓ Chính xác' : '✕ Chưa đúng'}</div>
      ${!r.ok && ww ? `<p class="ww"><b>Vì sao ${letters[r.picked]} sai:</b> ${esc(ww)}</p>` : ''}
      <span class="lbl">📖 Giải thích</span>
      <p>${esc(d.explanation)}</p>
      <button class="retry" onclick="clearAnswer('${d.id}')">↺ Làm lại câu này</button>
    </div>`;
  }

  return `<div class="card" id="drill-${d.id}">
      <div class="tagrow">
        <span class="tag ${d.difficulty}">${diffLabel(d.difficulty)}</span>
        ${vtags(d.versions)}
        ${topic ? `<span class="tag topic">${esc(topic)}</span>` : ''}
      </div>
      <div class="q">${esc(d.question)}</div>
      ${codeBlock(d.code)}
      <div class="choices">${choices}</div>
      ${verdict}
    </div>`;
}
const diffLabel = v => ({ beginner: 'Cơ Bản', intermediate: 'Trung Bình', advanced: 'Nâng Cao' }[v] || v);

/* Vẽ lại đúng một thẻ tại chỗ — không render lại cả danh sách, để ở chế độ
   "câu đã sai" thẻ vừa trả lời không biến mất trước khi người học kịp đọc. */
function refreshCard(id) {
  const d = DRILLS.find(x => x.id === id);
  const card = document.getElementById('drill-' + id);
  if (d && card) card.outerHTML = drillCard(d, drillMode !== 'topic');
  renderDrillsFilters();
  updateStatbar();
  updateProgress();
}
function answer(id, picked) {
  const d = DRILLS.find(x => x.id === id);
  if (!d || results[id]) return;
  results[id] = { picked, ok: picked === d.correctAnswer };
  saveState();
  refreshCard(id);
}
function clearAnswer(id) {
  delete results[id];
  saveState();
  refreshCard(id);
}
function resetTopic() {
  DRILLS.filter(d => d.topicId === currentDrillTopic).forEach(d => delete results[d.id]);
  saveState();
  renderDrillsFilters(); renderDrills(); updateProgress();
}
function updateStatbar() {
  const bar = document.querySelector('#drills-content .statbar');
  if (bar) bar.innerHTML = statHtml();
}

function updateProgress() {
  const total = DRILLS.length;
  const ids = Object.keys(results);
  const done = ids.length;
  const right = ids.filter(k => results[k].ok).length;
  document.getElementById('counter').innerHTML = currentMode === 'drills' || done
    ? `<b>${done}</b>/${total} · <span class="acc">${done ? Math.round(right / done * 100) : 0}%</span>`
    : `<b>${TUTORIALS.length}</b> bài · <b>${total}</b> câu`;
  document.getElementById('progress-fill').style.width = (total ? done / total * 100 : 0) + '%';
}

function init() {
  loadState();
  if (drillMode === 'mixed') buildMixed();
  if (drillMode === 'wrong') mistakeIds = wrongDrills().map(d => d.id);
  renderVersionChips();
  renderTopicsMenu(); renderTutorial();
  renderDrillsFilters(); renderDrills();
  if (location.hash === '#drills') switchMode('drills', true);
  updateProgress();
}
window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
