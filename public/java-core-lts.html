,"summary":"Vì sao mọi thói quen về thread pool đều phải bỏ đi, và thay bằng cái gì để vẫn kiểm soát được tải.","sections":["<b>Thread pool tồn tại để giải quyết vấn đề nào.</b> Pool ra đời vì tạo platform thread rất đắt, nên người ta tạo sẵn một ít rồi tái sử dụng. Virtual thread rẻ tới mức chi phí tạo gần như không đáng kể, nên lý do tồn tại của pool biến mất. Pool virtual thread là tối ưu hoá cho một vấn đề không còn tồn tại.","<b>Pool còn gây hại chứ không chỉ vô ích.</b> Kích thước pool trở thành một trần đồng thời tuỳ tiện đặt sai chỗ. Tệ hơn, tái sử dụng thread khiến <code>ThreadLocal</code> mang trạng thái của tác vụ trước sang tác vụ sau nếu quên <code>remove()</code> — đúng lớp lỗi mà mô hình mỗi tác vụ một thread vốn xoá sạch, vì thread chết đi cùng tác vụ.","<b>API đúng: <code>Executors.newVirtualThreadPerTaskExecutor()</code>.</b> Executor này không có pool: mỗi task submit vào sẽ tạo một virtual thread mới và thread đó kết thúc cùng task. Từ Java 19 <code>ExecutorService</code> đã implement <code>AutoCloseable</code>, nên dùng với try-with-resources rất gọn — <code>close()</code> sẽ shutdown rồi chờ mọi task hoàn tất.","<b>Vậy kiểm soát tải bằng gì.</b> Bằng <code>Semaphore</code> đặt đúng vào chỗ tài nguyên bị giới hạn, không phải bằng số thread. Ví dụ 'nhiều nhất 20 truy vấn DB đồng thời' thì đặt semaphore 20 quanh lời gọi DB, còn số virtual thread cứ để tự do. Cách này diễn đạt đúng ràng buộc thật, thay vì mã hoá nó gián tiếp qua kích thước pool.","<b>Trường hợp vẫn dùng executor cũ.</b> Nếu bạn cần đúng nghĩa <i>giới hạn song song CPU</i> — ví dụ nén ảnh, tính toán nặng — thì một <code>ThreadPoolExecutor</code> platform thread cỡ số core vẫn là lựa chọn đúng. Hai mô hình cùng tồn tại trong một ứng dụng là chuyện bình thường: virtual thread cho IO, pool nhỏ cho CPU."],"example":"// SAI: pool hoa virtual thread - vo nghia va lam ThreadLocal ban\nExecutorService bad = Executors.newFixedThreadPool(\n        200, Thread.ofVirtual().factory());\n\n// DUNG: moi task mot virtual thread, tu dong dong khi ket thuc\ntry (var exec = Executors.newVirtualThreadPerTaskExecutor()) {\n    requests.forEach(r -> exec.submit(() -> handle(r)));\n} // shutdown + cho tat ca task xong\n\n// Gioi han dat dung vao tai nguyen that, khong phai vao so thread\nprivate static final Semaphore DB = new Semaphore(20);\n\nvoid handle(Request r) throws InterruptedException {\n    DB.acquire();\n    try { repo.save(r); } finally { DB.release(); }\n}","exampleTitle":"Executor đúng và cách hạn dòng đúng","keyPoints":["Pool tồn tại để amortize chi phí tạo thread — chi phí đó không còn với virtual thread","Pool virtual thread vừa vô nghĩa vừa mang lại rủi ro ThreadLocal rác giữa các task","Dùng Executors.newVirtualThreadPerTaskExecutor(), kết hợp try-with-resources","Kiểm soát tải bằng Semaphore đặt tại tài nguyên bị giới hạn, không bằng số thread","Workload CPU-bound vẫn nên dùng pool platform thread cỡ số core"],"trap":"Dùng Executors.newFixedThreadPool với ThreadFactory tạo virtual thread và tưởng như vậy là 'có virtual thread'. Bạn vừa giữ lại mọi nhược điểm của pool vừa mất lợi ích của mô hình mỗi tác vụ một thread.","followUp":["Nếu bỏ pool thì làm sao giới hạn số truy vấn DB đồng thời?","ExecutorService.close() làm những gì?","Có trường hợp nào vẫn nên dùng thread pool platform thread không?"]},{"id":"t-17-5","topicId":17,"versions":[21],"title":"ThreadLocal và ScopedValue khi có hàng triệu thread","summary":"ThreadLocal vẫn chạy nhưng đổi hoàn toàn tính chất chi phí; ScopedValue là hướng thay thế và ở Java 21 vẫn là preview.","sections":["<b>ThreadLocal vẫn hoạt động bình thường.</b> Virtual thread có <code>ThreadLocalMap</code> riêng như mọi Thread khác, nên MDC của logging framework, security context, transaction context đều chạy. Đây là điều kiện bắt buộc để hệ sinh thái cũ dùng được virtual thread mà không phải viết lại.","<b>Nhưng mô hình chi phí đảo ngược.</b> <code>ThreadLocal</code> vốn được thiết kế cho một pool nhỏ: vài trăm thread, mỗi thread một bản sao, chi phí được amortize qua hàng triệu request. Với mô hình mỗi request một virtual thread, một triệu thread nghĩa là một triệu bản sao của mọi giá trị bạn đặt vào. Cache một <code>SimpleDateFormat</code> theo thread từng là mẹo hay; giờ nó là một triệu object rác.","<b><code>InheritableThreadLocal</code> càng tệ hơn.</b> Nó sao chép toàn bộ map từ thread cha sang mỗi thread con lúc tạo. Với mô hình sinh thread ồ ạt, đó là chi phí nhân lên theo số tác vụ, và giá trị bị sao chép lại có thể mutable nên không hề an toàn.","<b>ScopedValue — hướng thay thế, và ở Java 21 là PREVIEW.</b> <code>ScopedValue</code> (JEP 446) chỉ cho phép <i>gắn</i> một giá trị bất biến trong một phạm vi tường minh qua <code>ScopedValue.where(KEY, value).run(...)</code>, và giá trị tự biến mất khi ra khỏi phạm vi. Vì bất biến và có phạm vi rõ, JVM chia sẻ được nó cho các thread con thay vì sao chép, nên rẻ hơn hẳn <code>InheritableThreadLocal</code>. Phải nhấn mạnh: trên Java 21 đây là <b>preview API</b>, cần <code>--enable-preview</code> và API còn có thể đổi giữa các bản.","<b>Khác biệt về mặt thiết kế, không chỉ hiệu năng.</b> <code>ThreadLocal</code> là biến toàn cục ẩn: ai cũng <code>set()</code> được, bất kỳ lúc nào, và vòng đời không rõ ràng nên hay rò rỉ. <code>ScopedValue</code> là bất biến và có phạm vi tĩnh nhìn thấy được ngay trong code, nên không có khái niệm 'quên remove'.","<b>Lời khuyên thực tế cho Java 21.</b> Vẫn dùng <code>ThreadLocal</code> cho context nhỏ, bất biến, cỡ vài chục byte — không có vấn đề gì. Chỉ cần bỏ thói quen dùng <code>ThreadLocal</code> làm <i>cache đối tượng nặng</i>, vì mô hình chi phí đã đổi. Còn <code>ScopedValue</code> thì nên biết rõ để trả lời phỏng vấn, nhưng đừng khẳng định nó đã là tính năng chuẩn của 21."],"example":"// Anti-pattern voi virtual thread: cache object nang theo thread\nstatic final ThreadLocal<SimpleDateFormat> FMT =\n        ThreadLocal.withInitial(() -> new SimpleDateFormat(\"yyyy-MM-dd\"));\n// 1 trieu virtual thread => 1 trieu SimpleDateFormat\n\n// Cach dung: object bat bien, thread-safe, dung chung\n// Tuong duong dung cua SimpleDateFormat(\"yyyy-MM-dd\") la ISO_LOCAL_DATE (hoac ofPattern).\n// KHONG dung ISO_DATE: no them offset khi temporal co offset -> \"2026-08-09+07:00\".\nstatic final DateTimeFormatter F = DateTimeFormatter.ISO_LOCAL_DATE;\n\n// ScopedValue - PREVIEW o Java 21 (JEP 446), can --enable-preview\nstatic final ScopedValue<User> CURRENT = ScopedValue.newInstance();\n\nvoid handle(Request r) {\n    ScopedValue.where(CURRENT, authenticate(r))\n               .run(() -> service.process());   // CURRENT.get() dung duoc ben trong\n}                                               // ra khoi day la mat, khong can remove","exampleTitle":"ThreadLocal nặng vs ScopedValue (preview)","keyPoints":["ThreadLocal vẫn hoạt động trên virtual thread — cần thiết cho MDC, security context","Chi phí nhân theo số thread, nên dùng ThreadLocal làm cache object nặng là anti-pattern","InheritableThreadLocal sao chép map sang mỗi thread con, càng đắt hơn","ScopedValue bất biến, có phạm vi tường minh, chia sẻ được thay vì sao chép","Trên Java 21 ScopedValue là preview API (JEP 446), không phải tính năng chuẩn"],"trap":"Nói ScopedValue là tính năng chính thức của Java 21. Nó là preview; chỉ virtual thread (JEP 444) mới là tính năng chuẩn trong bản 21.","followUp":["Vì sao ThreadLocal trở nên đắt khi dùng virtual thread?","ScopedValue khác InheritableThreadLocal ở điểm nào về mặt bộ nhớ?","Trên Java 21 muốn dùng ScopedValue thì phải bật cờ gì?"]},{"id":"t-17-6","topicId":17,"versions":[21],"title":"Structured concurrency — preview ở Java 21","summary":"Mô hình gắn vòng đời của các subtask vào một phạm vi cú pháp, để không còn task mồ côi và không còn huỷ bỏ nửa vời.","sections":["<b>Vấn đề với ExecutorService thông thường.</b> Khi bạn <code>submit</code> hai lời gọi song song rồi một cái ném exception, cái còn lại vẫn tiếp tục chạy và tiêu tài nguyên vô ích. Không có quan hệ cha–con nào giữa các task, nên không có gì tự động huỷ, và nếu quên <code>shutdown</code> thì task sống lâu hơn cả request đã hỏng. Đây gọi là task mồ côi.","<b>Ý tưởng structured concurrency.</b> Nếu một tác vụ tách ra thành nhiều nhánh con, thì mọi nhánh con phải kết thúc trước khi ra khỏi khối code đã tạo ra chúng — giống hệt cách khối lệnh <code>{}</code> ràng buộc vòng đời biến. Nhờ đó quan hệ cha–con hiện lên trong chính cấu trúc code, và cả trong thread dump.","<b>API ở Java 21.</b> <code>StructuredTaskScope</code> dùng với try-with-resources: <code>fork()</code> tạo nhánh con, <code>join()</code> chờ, rồi lấy kết quả. Hai chính sách có sẵn là <code>ShutdownOnFailure</code> (một nhánh hỏng thì huỷ hết phần còn lại — hợp với gọi song song rồi ghép kết quả) và <code>ShutdownOnSuccess</code> (nhánh nào xong trước thì thắng, huỷ phần còn lại — hợp với truy vấn nhiều nguồn dự phòng).","<b>Huỷ bỏ lan truyền và quan sát được.</b> Khi scope đóng, mọi nhánh chưa xong đều bị interrupt. Vì virtual thread rẻ, mỗi nhánh là một thread thật nên stack trace đầy đủ, và JDK 21 có thread dump dạng JSON (<code>jcmd &lt;pid&gt; Thread.dump_to_file -format=json</code>) hiển thị đúng cây cha–con này — thứ mà mô hình callback không bao giờ cho bạn.","<b>PHẢI nói rõ trạng thái phiên bản.</b> Ở Java 21, <code>StructuredTaskScope</code> là <b>preview API</b> (JEP 453), cần biên dịch và chạy với <code>--enable-preview</code>. Trước đó nó ở dạng incubator trong 19 và 20. API này đã thay đổi qua các bản sau, nên trong dự án chạy LTS 21 thì không nên đưa vào code production; biết để trả lời và để định hướng thì rất nên.","<b>Quan hệ với virtual thread.</b> Structured concurrency chỉ khả thi vì virtual thread rẻ: mô hình này tạo một thread cho mỗi nhánh con, điều hoàn toàn bất khả thi nếu mỗi nhánh là một OS thread. Hai tính năng sinh ra cùng dự án Loom và bổ trợ cho nhau."],"example":"// Java 21: PREVIEW (JEP 453) - can --enable-preview, API co the doi\ntry (var scope = new StructuredTaskScope.ShutdownOnFailure()) {\n    StructuredTaskScope.Subtask<User>  user  = scope.fork(() -> findUser(id));\n    StructuredTaskScope.Subtask<Order> order = scope.fork(() -> fetchOrder(id));\n\n    scope.join();            // cho ca hai nhanh\n    scope.throwIfFailed();   // mot nhanh hong -> nem ra, nhanh kia da bi huy\n\n    return new Response(user.get(), order.get());\n}   // ra khoi scope: chac chan khong con nhanh con nao song","exampleTitle":"StructuredTaskScope.ShutdownOnFailure (preview)","keyPoints":["Gắn vòng đời subtask vào một phạm vi cú pháp, không còn task mồ côi","ShutdownOnFailure huỷ các nhánh còn lại khi có nhánh hỏng; ShutdownOnSuccess lấy nhánh xong trước","Khi scope đóng, mọi nhánh chưa xong đều bị interrupt","Cây cha–con hiện ra trong thread dump JSON của JDK 21","Ở Java 21 đây là preview API (JEP 453), incubator ở 19/20 — không phải tính năng chuẩn"],"trap":"Trình bày structured concurrency như tính năng chuẩn của Java 21. Chỉ virtual thread là chuẩn; StructuredTaskScope và ScopedValue đều là preview và API đã thay đổi ở các bản sau.","followUp":["Task mồ côi xảy ra thế nào với ExecutorService thường?","ShutdownOnFailure và ShutdownOnSuccess khác nhau ở kịch bản nào?","Vì sao structured concurrency chỉ khả thi khi có virtual thread?"]},{"id":"t-17-7","topicId":17,"versions":[21],"title":"Đưa virtual thread vào hệ thống thật: nút thắt, đo đạc, giới hạn","summary":"Những gì thực sự xảy ra khi bật virtual thread trên một service Spring đang chạy, và khi nào tốt nhất là không bật.","sections":["<b>Bật lên rất dễ, đó chính là rủi ro.</b> Với Spring Boot 3.2+ chỉ cần <code>spring.threads.virtual.enabled=true</code> là mọi request Tomcat chạy trên virtual thread. Vì đổi quá dễ, nhiều đội bật rồi mới đi tìm hiểu hệ quả. Câu hỏi phỏng vấn hay nhất về chủ đề này không phải 'bật thế nào' mà 'sau khi bật thì cái gì đổi'.","<b>Connection pool trở thành nút thắt lộ ra rất nhanh.</b> Mười nghìn virtual thread cùng gọi DB với Hikari <code>maximumPoolSize=10</code> thì vẫn chỉ có 10 truy vấn đồng thời; phần còn lại xếp hàng chờ connection và có thể chạm <code>connectionTimeout</code> hàng loạt. Virtual thread không nhân bản tài nguyên downstream — nó chỉ chuyển hàng đợi từ chỗ này sang chỗ khác. Đây là điểm gần như chắc chắn bị hỏi vặn.","<b>Cái gì thực sự hưởng lợi.</b> Các framework blocking sẵn có (Servlet, Spring MVC, JDBC, RestTemplate) hưởng lợi ngay mà không phải sửa dòng nào, miễn là workload IO-bound và không có pinning. Ngược lại ứng dụng đã reactive sẵn thì gần như không được gì, vì nó vốn đã không giữ thread khi chờ.","<b>Đo đạc và quan sát.</b> Thread dump cũ (<code>jstack</code>) không hiển thị virtual thread; dùng <code>jcmd &lt;pid&gt; Thread.dump_to_file -format=json</code> của JDK 21. Bật <code>-Djdk.tracePinnedThreads=full</code> trong load test để bắt pinning. Metric quan trọng chuyển từ 'độ dài hàng đợi thread pool' sang 'thời gian chờ semaphore/connection pool' và độ trễ đuôi p99.","<b>Khi nào KHÔNG dùng.</b> Workload CPU-bound thuần. Code phụ thuộc nặng vào việc thread được tái sử dụng (ThreadLocal cache lớn). Thư viện gọi JNI ở đoạn nóng, vì native frame gây pinning. Và những hệ thống mà số thread hiện tại chưa bao giờ là nút thắt — khi đó việc đổi chỉ mang lại rủi ro chứ không mang lại gì.","<b>Kết luận cần nói được trong phỏng vấn.</b> Virtual thread là một cải tiến lớn về <i>mô hình lập trình</i>: nó cho phép giữ code đơn giản mà vẫn đạt mức đồng thời cao cho tác vụ IO-bound. Nó không phải viên đạn bạc, không sửa thuật toán chậm, không tăng dung lượng của database, và trên Java 21 vẫn còn cái gai pinning phải để mắt tới."],"example":"# application.properties - Spring Boot 3.2+\nspring.threads.virtual.enabled=true\n\n# Nut that that su van la day\nspring.datasource.hikari.maximum-pool-size=10\nspring.datasource.hikari.connection-timeout=2000\n\n# Chan doan luc load test\n# java -Djdk.tracePinnedThreads=full -jar app.jar\n# jcmd <pid> Thread.dump_to_file -format=json dump.json","exampleTitle":"Bật virtual thread và thứ cần theo dõi ngay sau đó","keyPoints":["Spring Boot 3.2+ bật virtual thread bằng một property, nhưng hệ quả phải hiểu trước","Connection pool DB thường trở thành nút thắt lộ ra ngay sau khi bật","Framework blocking hưởng lợi nhiều nhất; ứng dụng reactive gần như không được gì","jstack không thấy virtual thread — dùng jcmd Thread.dump_to_file -format=json","Không dùng cho CPU-bound, cho code phụ thuộc tái sử dụng thread, hoặc khi thread chưa từng là nút thắt"],"trap":"Bật virtual thread rồi giữ nguyên mọi cấu hình timeout và pool size. Số request đồng thời tăng vọt sẽ dồn hết vào connection pool và downstream, biến một service ổn định thành nguồn quá tải cho hệ thống phía sau.","followUp":["Bật virtual thread mà Hikari pool vẫn là 10 thì throughput có tăng không?","Vì sao jstack không hiển thị virtual thread?","Ứng dụng đã dùng WebFlux thì chuyển sang virtual thread có lợi gì?"]},{"id":"t-18-1","topicId":18,"versions":[8,11,17,21],"title":"Java Memory Model: visibility khác atomicity","summary":"Hai vấn đề hoàn toàn khác nhau mà rất nhiều người gộp làm một — và happens-before là ngôn ngữ chung để nói về cả hai.","sections":["<b>Visibility — thread khác có nhìn thấy giá trị mới không.</b> Nguyên nhân thật sự không nằm ở cách nói tắt quen thuộc &quot;mỗi core có cache riêng&quot; — trên phần cứng phổ thông cache giữa các core là <i>coherent</i>. Thủ phạm chính là compiler và JIT: chúng được phép giữ biến trong thanh ghi và nâng phép đọc ra khỏi vòng lặp, cộng thêm store buffer của CPU khiến một lần ghi chưa kịp hiện ra với core khác. Một thread ghi <code>running = false</code> có thể mãi mãi không được thread kia thấy, và vòng <code>while (running)</code> chạy vô tận. Đây không phải bug của JVM mà là điều JMM cho phép khi không có quan hệ đồng bộ.","<b>Atomicity — thao tác có bị xen giữa không.</b> <code>count++</code> thực chất là ba bước: đọc, cộng một, ghi lại. Hai thread có thể cùng đọc giá trị 5, cùng ghi 6, và một lần tăng biến mất. Vấn đề này tồn tại ngay cả khi mọi thread đều nhìn thấy giá trị mới nhất — nên nó độc lập hoàn toàn với visibility.","<b>Ordering — thứ tự thực thi không phải thứ tự bạn viết.</b> Compiler, JIT và CPU đều được phép sắp xếp lại lệnh miễn là kết quả trên <i>một</i> thread không đổi (quy tắc as-if-serial). Từ thread khác nhìn vào, thứ tự có thể khác hẳn code nguồn — đây là nguồn gốc của lỗi double-checked locking kinh điển.","<b>Happens-before là công cụ để lập luận.</b> Nếu hành động A happens-before B thì mọi ghi trước A đều nhìn thấy được ở B. Các quy tắc cần thuộc: trong cùng thread theo thứ tự chương trình; <code>unlock</code> của một monitor happens-before <code>lock</code> tiếp theo trên chính monitor đó; ghi một biến <code>volatile</code> happens-before mọi lần đọc sau đó của biến ấy; <code>Thread.start()</code> happens-before mọi lệnh trong thread mới; mọi lệnh trong thread happens-before <code>join()</code> trả về; và quan hệ này bắc cầu.","<b>Bốn công cụ, ba mức bảo đảm.</b> <code>volatile</code> cho visibility và ordering nhưng không cho atomicity. <code>Atomic*</code> cho visibility và atomicity trên <i>một</i> biến. <code>synchronized</code> và <code>ReentrantLock</code> cho cả ba, và là thứ duy nhất bảo vệ được một nhóm thao tác liên quan tới nhiều biến. Chọn sai mức là lỗi thiết kế phổ biến nhất trong code đồng thời.","<b>Final field có bảo đảm riêng.</b> JMM đảm bảo rằng khi constructor kết thúc, mọi field <code>final</code> đã được khởi tạo xong sẽ hiển thị đúng với mọi thread nhìn thấy object đó, kể cả khi việc công bố tham chiếu không được đồng bộ. Đây là nền tảng kỹ thuật khiến object bất biến an toàn cho đa luồng mà không cần lock nào."],"example":"// Visibility: vong lap co the khong bao gio dung lai\nboolean running = true;                 // thieu volatile\n\nvoid worker()  { while (running) { } }  // JIT co the doc mot lan roi cache lai\nvoid stopIt()  { running = false; }\n\n// Atomicity: volatile KHONG cuu duoc cho nay\nvolatile int count = 0;\nvoid inc() { count++; }                 // read-modify-write, van mat cap nhat\n\n// Dung cong cu dung muc\nAtomicInteger safe = new AtomicInteger();\nvoid incSafe() { safe.incrementAndGet(); }","exampleTitle":"Hai lỗi khác nhau, hai cách sửa khác nhau","keyPoints":["Visibility là chuyện thread khác có thấy giá trị mới; atomicity là chuyện thao tác có bị xen giữa","count++ gồm ba bước read-modify-write nên không bao giờ atomic","Reordering được phép miễn kết quả trên một thread không đổi","Happens-before: program order, unlock/lock, ghi/đọc volatile, Thread.start, Thread.join, và bắc cầu","volatile = visibility + ordering; Atomic = thêm atomicity một biến; lock = bảo vệ được nhóm thao tác"],"trap":"Thêm volatile vào biến đếm rồi tin rằng count++ đã an toàn. Volatile chỉ đảm bảo mỗi lần đọc và mỗi lần ghi riêng lẻ là mới nhất, nó không biến ba bước read-modify-write thành một thao tác không thể chia cắt.","followUp":["Nêu ít nhất bốn quy tắc happens-before trong JMM?","Vì sao vòng while đọc một biến boolean thường có thể chạy vô tận?","Object bất biến an toàn đa luồng nhờ bảo đảm nào của JMM?"]},{"id":"t-18-2","topicId":18,"versions":[8,11,17,21],"title":"volatile, double-checked locking và safe publication","summary":"Chính xác volatile bảo đảm gì, và vì sao thiếu nó thì singleton DCL trả về object chưa khởi tạo xong.","sections":["<b>volatile bảo đảm ba điều.</b> Một, mọi lần đọc lấy giá trị mới nhất và mọi lần ghi hiển thị ngay với thread khác (không cache ở thanh ghi). Hai, cấm reorder qua điểm truy cập biến đó: các ghi trước một lần ghi volatile không bị đẩy xuống sau nó, các đọc sau một lần đọc volatile không bị kéo lên trước. Ba, đọc và ghi biến <code>long</code>/<code>double</code> trở thành atomic — JLS cho phép hai loại này bị xé đôi khi không volatile.","<b>volatile KHÔNG bảo đảm điều gì.</b> Nó không làm cho thao tác gộp trở nên atomic. <code>count++</code>, <code>if (x == null) x = new X()</code>, hay việc cập nhật hai biến liên quan nhau đều vẫn hỏng. Quy tắc thực dụng: volatile chỉ đủ khi giá trị mới <i>không phụ thuộc</i> vào giá trị cũ, và chỉ có một thread ghi hoặc các ghi là độc lập nhau.","<b>Ứng dụng đúng bài nhất của volatile là cờ trạng thái.</b> Một cờ <code>shutdown</code>, một tham chiếu cấu hình được thay nguyên khối, một object bất biến được công bố. Ở đó không có read-modify-write nên volatile là công cụ rẻ nhất và đúng nhất — rẻ hơn lock vì không có blocking, chỉ là một memory barrier.","<b>Double-checked locking và lý do bắt buộc phải có volatile.</b> Dòng <code>instance = new Singleton()</code> gồm ba việc: cấp phát bộ nhớ, chạy constructor, gán tham chiếu. JIT được phép hoán đổi hai việc sau. Thread B đọc <code>instance</code> ở lần kiểm tra đầu, thấy khác null, bỏ qua khối <code>synchronized</code> và dùng ngay một object mà constructor chưa chạy xong — nhận về các field mang giá trị mặc định. Khai báo <code>volatile</code> cấm chính phép reorder đó, và từ Java 5 JMM mới bảo đảm điều này chắc chắn.","<b>Có cách đơn giản hơn DCL.</b> Holder idiom — đặt instance vào một static nested class — tận dụng bảo đảm của class loader: JVM khởi tạo class một cách lười và thread-safe sẵn, không cần lock nào trong code. Với singleton không tham số thì <code>enum</code> còn gọn hơn nữa và chống được cả reflection lẫn deserialization.","<b>Safe publication là khái niệm tổng quát phía sau.</b> Công bố an toàn một object nghĩa là đảm bảo thread khác chỉ nhìn thấy nó ở trạng thái đã khởi tạo đầy đủ. Bốn cách chuẩn: gán vào field <code>volatile</code> hoặc <code>AtomicReference</code>, gán vào field <code>final</code> từ constructor, gán vào field static trong static initializer, hoặc bảo vệ bằng lock. Object hoàn toàn bất biến thì tự an toàn nhờ bảo đảm của final field."],"example":"// DCL - PHAI co volatile\nclass Singleton {\n    private static volatile Singleton instance;\n\n    static Singleton get() {\n        if (instance == null) {                 // check 1: khong lock, nhanh\n            synchronized (Singleton.class) {\n                if (instance == null) {         // check 2: da co lock\n                    instance = new Singleton(); // cap phat -> ctor -> gan\n                }\n            }\n        }\n        return instance;\n    }\n}\n\n// Don gian hon, khong can lock: holder idiom\nclass Better {\n    private Better() { }\n    private static class Holder { static final Better I = new Better(); }\n    static Better get() { return Holder.I; }\n}","exampleTitle":"DCL cần volatile, và cách thay thế gọn hơn","keyPoints":["volatile = visibility + cấm reorder + đọc/ghi long/double thành atomic","volatile không làm cho read-modify-write trở nên atomic","Chỉ dùng volatile khi giá trị mới không phụ thuộc giá trị cũ","DCL thiếu volatile có thể trả về object mà constructor chưa chạy xong","Holder idiom và enum là cách khởi tạo lười thread-safe không cần viết lock"],"trap":"Viết DCL với field thường và nghĩ rằng khối synchronized ở trong đã đủ. Lần kiểm tra thứ nhất nằm ngoài lock, nên nó có thể đọc được tham chiếu đã gán trước khi constructor kết thúc — chỉ volatile mới cấm được phép reorder gây ra chuyện đó.","followUp":["Vì sao DCL cần volatile mà khối synchronized bên trong không đủ?","volatile có làm cho x = x + 1 an toàn không, vì sao?","Kể bốn cách safe publication một object cho thread khác?"]},{"id":"t-18-3","topicId":18,"versions":[8,11,17,21],"title":"Atomic, CAS, ABA và khi nào CAS thua lock","summary":"Cơ chế lock-free đằng sau AtomicInteger, cái giá của nó khi tranh chấp cao, và bẫy ABA.","sections":["<b>CAS là gì.</b> Compare-And-Swap là một lệnh của CPU (trên x86 là <code>cmpxchg</code>): 'nếu ô nhớ này đang mang giá trị kỳ vọng thì đặt giá trị mới, nếu không thì báo thất bại' — toàn bộ diễn ra nguyên tử ở mức phần cứng. <code>AtomicInteger.incrementAndGet()</code> ở mức mã nguồn Java chính là một vòng lặp: đọc giá trị hiện tại, tính giá trị mới, <code>compareAndSet</code>, thất bại thì thử lại. Cần nói thêm cho chính xác: HotSpot <i>intrinsify</i> <code>getAndAddInt</code> thành một lệnh <code>lock xadd</code> duy nhất trên x86, nên phép tăng đơn giản không còn vòng lặp thử lại nào ở mức máy; chỉ những method nhận một hàm tuỳ ý như <code>updateAndGet</code>/<code>accumulateAndGet</code> mới thật sự lặp CAS.","<b>Lock-free không có nghĩa là wait-free.</b> Thread thực hiện CAS không bao giờ bị treo hay bị OS đưa ra khỏi CPU vì chờ lock, nên không có deadlock và không có chi phí context switch. Nhưng một thread cụ thể có thể phải lặp lại rất nhiều lần nếu liên tục thua các thread khác — tức không có bảo đảm về thời gian hoàn tất cho từng thread.","<b>Vì sao CAS có thể tệ hơn lock khi tranh chấp cao.</b> Mỗi lần thử thất bại là CPU đã bị đốt vô ích, và biến chung nằm trên một cache line bị nhiều core giành nhau khiến cache line bouncing giữa các core. Với lock, thread thua sẽ ngủ và nhường CPU. Vì vậy quy tắc thực tế là: tranh chấp thấp tới trung bình thì CAS thắng rõ; tranh chấp rất cao thì lock, hoặc tốt hơn là thiết kế lại để giảm chia sẻ.","<b><code>LongAdder</code> là câu trả lời cho counter tranh chấp cao (Java 8+).</b> Thay vì một biến chung, nó phân tán giá trị ra nhiều cell theo thread để giảm tranh chấp, rồi cộng lại khi cần. Cái giá là <code>sum()</code> tốn hơn và không phải một snapshot nguyên tử tuyệt đối nếu có cập nhật xen vào. Nghĩa là: đếm nhiều đọc ít thì dùng <code>LongAdder</code>; cần giá trị chính xác tại thời điểm đọc để ra quyết định thì dùng <code>AtomicLong</code>.","<b>ABA problem.</b> CAS chỉ so sánh <i>giá trị</i>, không so sánh <i>lịch sử</i>. Nếu giá trị đi từ A sang B rồi quay lại A trong lúc thread của bạn đang tính toán, CAS vẫn thành công dù trạng thái thực tế đã thay đổi. Chuyện này gây hậu quả thật trong cấu trúc lock-free có tái sử dụng node, ví dụ đỉnh stack bị pop rồi push lại. Giải pháp là <code>AtomicStampedReference</code> (thêm một stamp tăng dần) hoặc <code>AtomicMarkableReference</code> (thêm một cờ boolean).","<b>Hàm truyền vào phải thuần — nhưng vì hai lý do hoàn toàn khác nhau.</b> Với <code>Atomic*</code>, <code>updateAndGet</code> và <code>accumulateAndGet</code> chạy hàm của bạn <i>bên trong</i> vòng lặp CAS, nên mỗi lần thua tranh chấp là hàm bị gọi lại: nếu hàm có side effect — ghi log, gửi message, tăng một biến khác — bạn sẽ thấy nó thực hiện dư, đo được rõ ràng dưới tải. Với <code>ConcurrentHashMap</code> thì cơ chế khác hẳn: <code>compute</code>, <code>computeIfAbsent</code> và <code>computeIfPresent</code> <b>không</b> dùng vòng lặp CAS quanh hàm của bạn mà giữ khoá trên node đầu của bin (hoặc monitor của một <code>ReservationNode</code>) suốt thời gian gọi hàm — javadoc ghi rõ &quot;The entire method invocation is performed atomically&quot; — nên hàm được gọi <b>đúng một lần</b>. Yêu cầu &quot;hàm phải thuần&quot; vẫn đúng với CHM, chỉ là vì lý do khác: nó chạy dưới một bin lock nên phải thật ngắn, tuyệt đối không đụng lại chính map đó (rất dễ ăn <code>IllegalStateException</code> &quot;Recursive update&quot; hoặc treo) và không nên làm IO. Phân biệt được hai cơ chế này là câu vặn rất tốt."],"example":"// AtomicInteger.incrementAndGet ve ban chat la vong lap CAS\nint incrementAndGet(AtomicInteger a) {\n    while (true) {\n        int cur = a.get();\n        int next = cur + 1;\n        if (a.compareAndSet(cur, next)) return next;  // thua thi lap lai\n    }\n}\n\n// ABA: chong bang stamp\nAtomicStampedReference<Node> top = new AtomicStampedReference<>(head, 0);\nint[] st = new int[1];\nNode cur = top.get(st);\ntop.compareAndSet(cur, cur.next, st[0], st[0] + 1);\n\n// Counter tranh chap cao\nLongAdder hits = new LongAdder();\nhits.increment();\nlong total = hits.sum();   // khong phai snapshot nguyen tu tuyet doi","exampleTitle":"Vòng lặp CAS, AtomicStampedReference và LongAdder","keyPoints":["CAS là lệnh phần cứng; Atomic dựa trên vòng lặp CAS nên lock-free chứ không blocking","Tranh chấp cao làm CAS lặp nhiều, đốt CPU và gây cache line bouncing","LongAdder phân tán cell, hợp cho ghi nhiều đọc ít; sum() không phải snapshot nguyên tử","ABA: giá trị quay lại giá trị cũ khiến CAS thành công sai — dùng AtomicStampedReference","Hàm truyền cho updateAndGet/accumulateAndGet có thể chạy lại nhiều lần khi CAS thua nên phải không có side effect","compute/computeIfAbsent của ConcurrentHashMap thì chạy đúng một lần dưới bin lock — phải ngắn và không được đụng lại chính map đó"],"trap":"Mặc định coi Atomic luôn nhanh hơn synchronized. Dưới tranh chấp rất cao, vòng lặp CAS có thể thua lock vì thread thua cuộc vẫn chiếm CPU để thử lại thay vì nhường chỗ.","followUp":["Vì sao lock-free không đồng nghĩa với việc mọi thread đều hoàn tất nhanh?","ABA problem gây hậu quả thật ở cấu trúc dữ liệu nào?","Khi nào chọn LongAdder thay vì AtomicLong?"]},{"id":"t-18-4","topicId":18,"versions":[8,11,17,21],"title":"synchronized và ReentrantLock: chọn cái nào và vì sao","summary":"Cùng cung cấp loại trừ lẫn nhau, nhưng khác nhau ở khả năng kiểm soát — và từ Java 21 khác nhau cả ở chuyện pinning.","sections":["<b>Điểm chung.</b> Cả hai đều reentrant (thread đang giữ khoá gọi tiếp method khoá cùng object thì không tự chặn mình), đều tạo quan hệ happens-before nên bảo đảm visibility, và đều loại trừ lẫn nhau. Nếu bài toán của bạn chỉ cần bấy nhiêu thì <code>synchronized</code> là lựa chọn mặc định đúng vì nó ngắn và không thể quên nhả khoá.","<b><code>synchronized</code> ở mức bytecode.</b> Khối <code>synchronized</code> biên dịch thành <code>monitorenter</code>/<code>monitorexit</code>, còn method <code>synchronized</code> chỉ là một cờ <code>ACC_SYNCHRONIZED</code> trong access flags của cấu trúc <code>method_info</code> — một cấu trúc riêng của class file, <b>không</b> nằm trong constant pool (constant pool chỉ giữ tên method và descriptor) — và JVM tự khoá monitor khi vào. Điểm quan trọng: JVM sinh sẵn handler để nhả monitor khi có exception, nên khoá không bao giờ bị rò rỉ. Method instance khoá trên <code>this</code>, method static khoá trên object <code>Class</code> — đây là hai monitor khác nhau và không loại trừ lẫn nhau.","<b>Những gì chỉ <code>ReentrantLock</code> làm được.</b> <code>tryLock()</code> lấy khoá không chờ, <code>tryLock(timeout, unit)</code> có hạn chờ để tránh treo vô hạn và để phá vòng deadlock, <code>lockInterruptibly()</code> cho phép huỷ khi bị interrupt, chế độ fair để chống starvation, khả năng khoá ở method này và nhả ở method khác, và nhiều <code>Condition</code> trên cùng một lock. Khả năng cuối cùng là thứ <code>synchronized</code> không bao giờ có: mỗi object chỉ có đúng một wait set.","<b>Giá phải trả.</b> <code>ReentrantLock</code> bắt buộc <code>unlock()</code> trong <code>finally</code>; quên một lần là ứng dụng treo vĩnh viễn và rất khó tìm. Chế độ fair đảm bảo thứ tự FIFO nhưng làm thông lượng giảm đáng kể vì mỗi lần chuyển khoá là một lần đánh thức và context switch, nên chỉ bật khi thời gian giữ khoá dài và starvation là vấn đề đo được.","<b>Về hiệu năng — đừng dùng lập luận cũ.</b> Trước Java 6, <code>ReentrantLock</code> nhanh hơn hẳn. Sau các tối ưu của HotSpot, hai bên gần như tương đương với đa số workload. Biased locking từng làm <code>synchronized</code> rất rẻ khi không tranh chấp, nhưng đã bị tắt mặc định và đánh dấu loại bỏ từ Java 15 (JEP 374). Kết luận: chọn theo tính năng cần dùng, không chọn theo huyền thoại hiệu năng.","<b>Yếu tố mới từ Java 21.</b> Virtual thread bị chặn bên trong khối <code>synchronized</code> sẽ bị pin vào carrier thread và không unmount được, trong khi <code>ReentrantLock</code> được xây trên <code>LockSupport.park</code> nên không gây pinning. Vì vậy trong code chạy trên virtual thread, đoạn nào vừa giữ khoá vừa có blocking IO thì nên dùng <code>ReentrantLock</code>. Đây là lời khuyên đặc thù của Java 21."],"example":"// synchronized: ngan, khong the quen nha khoa\nsynchronized void transfer(int amount) { balance += amount; }\n\n// ReentrantLock: co timeout, huy duoc, nhieu Condition\nprivate final ReentrantLock lock = new ReentrantLock();\n\nboolean transferOrGiveUp(int amount) throws InterruptedException {\n    if (!lock.tryLock(200, TimeUnit.MILLISECONDS)) {\n        return false;                 // khong treo vo han\n    }\n    try {\n        balance += amount;\n        return true;\n    } finally {\n        lock.unlock();                // BAT BUOC trong finally\n    }\n}","exampleTitle":"Hai công cụ, hai mức kiểm soát","keyPoints":["Cả hai đều reentrant và đều bảo đảm visibility qua happens-before","Method instance khoá trên this, method static khoá trên Class — hai monitor khác nhau","Chỉ ReentrantLock có tryLock, timeout, lockInterruptibly, fair mode và nhiều Condition","ReentrantLock phải unlock trong finally; fair mode giảm thông lượng đáng kể","Trên Java 21, synchronized gây pinning virtual thread còn ReentrantLock thì không"],"trap":"Tin rằng ReentrantLock nhanh hơn synchronized nên mặc định dùng nó. Sau các tối ưu của HotSpot hai bên gần như ngang nhau; đổi lấy tốc độ tưởng tượng bằng rủi ro quên unlock là một đánh đổi tồi.","followUp":["Hai thread, một gọi method synchronized static và một gọi method synchronized instance của cùng class — có chặn nhau không?","Khi nào bắt buộc phải dùng ReentrantLock thay vì synchronized?","Vì sao fair mode làm giảm thông lượng?"]},{"id":"t-18-5","topicId":18,"versions":[8,11,17,21],"title":"wait/notify và Condition — hợp đồng dễ viết sai nhất","summary":"Ba quy tắc bắt buộc mà vi phạm là lỗi ngay: phải giữ monitor, phải dùng while, và phải cân nhắc notifyAll.","sections":["<b>Phải gọi trong khi đang giữ monitor.</b> <code>wait()</code>, <code>notify()</code>, <code>notifyAll()</code> chỉ hợp lệ khi thread đang giữ monitor của chính object đó; nếu không sẽ ném <code>IllegalMonitorStateException</code> ngay lúc chạy. Lý do có ràng buộc này là để chống lost wakeup: nếu được phép kiểm tra điều kiện ngoài lock rồi mới <code>wait()</code>, tín hiệu có thể đến đúng khe giữa hai bước và bị mất vĩnh viễn.","<b><code>wait()</code> nhả khoá, <code>sleep()</code> thì không.</b> Đây là câu hỏi phỏng vấn kinh điển. <code>wait()</code> đưa thread vào wait set của monitor và <b>nhả</b> monitor để thread khác vào làm thay đổi điều kiện; khi được đánh thức nó phải giành lại monitor mới chạy tiếp. <code>Thread.sleep()</code> giữ nguyên mọi khoá đang cầm, nên gọi <code>sleep</code> trong khối <code>synchronized</code> là cách chắc chắn để làm chậm cả hệ thống.","<b>Luôn dùng <code>while</code>, không bao giờ <code>if</code>.</b> Có hai lý do độc lập. Thứ nhất là spurious wakeup: JLS cho phép thread thức dậy mà không có <code>notify</code> nào. Thứ hai — và trong thực tế hay xảy ra hơn — là điều kiện có thể bị thread khác cướp mất trong khoảng giữa lúc được <code>notify</code> và lúc giành lại được monitor. Với <code>if</code>, thread chạy tiếp trên một điều kiện đã sai; với <code>while</code>, nó kiểm tra lại và ngủ tiếp.","<b><code>notify()</code> so với <code>notifyAll()</code>.</b> <code>notify()</code> đánh thức đúng một thread bất kỳ trong wait set. Nếu wait set chứa nhiều loại thread chờ nhiều điều kiện khác nhau (producer chờ 'chưa đầy' và consumer chờ 'chưa rỗng' dùng chung một monitor), <code>notify()</code> có thể đánh thức nhầm loại; thread đó thấy điều kiện chưa thoả nên ngủ lại, còn thread cần được đánh thức thì không bao giờ được gọi — hệ thống treo. Mặc định nên dùng <code>notifyAll()</code>; chỉ dùng <code>notify()</code> khi chắc chắn mọi thread trong wait set đều chờ đúng một điều kiện và tương đương nhau.","<b><code>Condition</code> giải quyết đúng gốc vấn đề đó.</b> Một <code>ReentrantLock</code> tạo được nhiều <code>Condition</code>, mỗi cái là một wait set riêng: <code>notFull.await()</code> và <code>notEmpty.signal()</code>. Nhờ tách hàng đợi theo điều kiện, <code>signal()</code> trở nên an toàn và hiệu quả hơn <code>notifyAll()</code> vì không đánh thức nhầm ai. Lưu ý đổi tên API: <code>await/signal/signalAll</code> thay cho <code>wait/notify/notifyAll</code>.","<b>Lời khuyên thực tế.</b> Trong code ứng dụng, gần như không nên tự viết <code>wait/notify</code> nữa. <code>ArrayBlockingQueue</code>, <code>LinkedBlockingQueue</code>, <code>CountDownLatch</code>, <code>Semaphore</code>, <code>CyclicBarrier</code> đã cài đặt đúng những mẫu này và đã được kiểm chứng kỹ. Hiểu <code>wait/notify</code> là để đọc code cũ và để trả lời phỏng vấn, không phải để dùng hằng ngày."],"example":"// Producer/consumer bang wait/notify - chu y while va notifyAll\nsynchronized void put(T item) throws InterruptedException {\n    while (queue.size() == CAPACITY) {   // WHILE, khong phai IF\n        wait();                          // nha monitor trong luc cho\n    }\n    queue.add(item);\n    notifyAll();                         // danh thuc ca producer lan consumer\n}\n\n// Cach hien dai: hai Condition rieng, signal an toan\nprivate final ReentrantLock lock = new ReentrantLock();\nprivate final Condition notFull  = lock.newCondition();\nprivate final Condition notEmpty = lock.newCondition();\n\nvoid put2(T item) throws InterruptedException {\n    lock.lock();\n    try {\n        while (queue.size() == CAPACITY) notFull.await();\n        queue.add(item);\n        notEmpty.signal();\n    } finally {\n        lock.unlock();\n    }\n}","exampleTitle":"wait/notify cổ điển và bản Condition","keyPoints":["wait/notify phải gọi khi đang giữ monitor, nếu không ném IllegalMonitorStateException","wait() nhả khoá; Thread.sleep() giữ nguyên mọi khoá đang cầm","Luôn kiểm tra điều kiện trong while vì spurious wakeup và vì điều kiện có thể bị cướp","notify() có thể đánh thức nhầm loại thread và gây treo; mặc định dùng notifyAll()","ReentrantLock cho nhiều Condition, mỗi cái một wait set riêng nên signal an toàn","Trong ứng dụng thật nên dùng BlockingQueue, CountDownLatch, Semaphore thay vì tự viết"],"trap":"Dùng if thay cho while quanh wait(). Code sẽ chạy đúng trong hầu hết lần test rồi hỏng ngẫu nhiên trên production, vì thread thức dậy chạy tiếp trên một điều kiện đã bị thread khác làm sai.","followUp":["wait() và sleep() khác nhau chỗ nào về khoá?","Vì sao phải bọc wait() trong while chứ không phải if?","Khi nào notify() gây treo hệ thống còn notifyAll() thì không?"]},{"id":"t-18-6","topicId":18,"versions":[8,11,17,21],"title":"Deadlock, livelock và starvation","summary":"Bốn điều kiện tạo ra deadlock, cách phá vòng bằng thứ tự khoá nhất quán, và hai họ hàng dễ nhầm của nó.","sections":["<b>Bốn điều kiện Coffman.</b> Deadlock chỉ xảy ra khi cả bốn cùng đúng: <i>mutual exclusion</i> (tài nguyên không chia sẻ được), <i>hold and wait</i> (đang giữ cái này và chờ cái kia), <i>no preemption</i> (không ai giật khoá của ai được), <i>circular wait</i> (vòng chờ khép kín). Phá bất kỳ điều kiện nào cũng đủ. Trong Java, hai điều kiện đầu gần như luôn có sẵn nên thực tế người ta tấn công vào <i>circular wait</i> và <i>no preemption</i>.","<b>Phá circular wait bằng thứ tự khoá toàn cục.</b> Nếu mọi thread luôn lấy khoá theo cùng một thứ tự thì không thể tạo được vòng. Với các object không có thứ tự tự nhiên, mẹo kinh điển là sắp theo <code>System.identityHashCode</code> và dùng một khoá phụ (tie lock) cho trường hợp hai giá trị hash trùng nhau; nếu có id nghiệp vụ thì sắp theo id đơn giản và tin cậy hơn.","<b>Phá no preemption bằng <code>tryLock</code> có timeout.</b> Lấy khoá thứ nhất, thử khoá thứ hai với hạn chờ; nếu thất bại thì <b>nhả cả khoá thứ nhất</b>, chờ một khoảng ngẫu nhiên rồi thử lại từ đầu. Điểm mấu chốt là phải nhả hết những gì đang giữ — giữ lại rồi thử tiếp chính là hold-and-wait và không giải quyết được gì. Khoảng chờ nên ngẫu nhiên để tránh hai thread cứ lặp đồng pha.","<b>Livelock — không ai bị chặn nhưng cũng không ai tiến lên.</b> Hai thread cùng phát hiện xung đột, cùng lịch sự nhường nhau, rồi cùng thử lại đúng lúc và lại xung đột. Thread ở trạng thái RUNNABLE nên thread dump trông hoàn toàn bình thường và CPU thì cao — khó phát hiện hơn deadlock nhiều. Cách chữa là thêm yếu tố ngẫu nhiên vào thời gian chờ hoặc đặt một quy tắc bất đối xứng để phá thế cân bằng.","<b>Starvation — có thread bị bỏ đói vô hạn.</b> Xảy ra khi lock không công bằng và luôn có thread khác chen vào trước, hoặc khi một thread giữ khoá quá lâu, hoặc khi thread ưu tiên thấp không bao giờ được lập lịch. Công cụ chữa là <code>new ReentrantLock(true)</code> để bật fair mode, chấp nhận đánh đổi thông lượng, và quan trọng hơn là rút ngắn vùng găng.","<b>Phát hiện và phòng ngừa.</b> <code>jstack</code> và <code>jcmd Thread.print</code> tự phát hiện và in ra 'Found one Java-level deadlock' với đủ chuỗi khoá; trong code có thể dùng <code>ThreadMXBean.findDeadlockedThreads()</code> cho một health check. Về phòng ngừa, quy tắc tốt nhất là đừng bao giờ gọi <i>alien method</i> — callback, listener, code của tầng khác — khi đang giữ khoá, vì bạn không kiểm soát được nó sẽ đi lấy khoá nào."],"example":"// Deadlock: hai thread lay khoa theo hai thu tu nguoc nhau\nvoid transferBad(Account from, Account to, int amt) {\n    synchronized (from) {\n        synchronized (to) { from.debit(amt); to.credit(amt); }\n    }\n}\n// transferBad(A, B) chay song song voi transferBad(B, A) -> treo\n\n// Sua: thu tu khoa nhat quan theo identityHashCode, CO tie lock cho truong hop trung hash\nprivate static final Object TIE_LOCK = new Object();\n\nvoid transferSafe(Account a, Account b, int amt) {\n    int ha = System.identityHashCode(a), hb = System.identityHashCode(b);\n    if (ha == hb) {                  // hiem nhung co that: khong con thu tu de sap\n        synchronized (TIE_LOCK) {    // thieu doan nay la deadlock quay lai nguyen ven\n            synchronized (a) { synchronized (b) { a.debit(amt); b.credit(amt); } }\n        }\n        return;\n    }\n    Account first  = ha < hb ? a : b;\n    Account second = (first == a) ? b : a;\n    synchronized (first) {\n        synchronized (second) { a.debit(amt); b.credit(amt); }\n    }\n}\n\n// Hoac pha no-preemption: that bai thi nha het roi thu lai\nif (lock1.tryLock(100, MILLISECONDS)) {\n    try {\n        if (lock2.tryLock(100, MILLISECONDS)) {\n            try { doWork(); } finally { lock2.unlock(); }\n        }\n    } finally { lock1.unlock(); }\n}","exampleTitle":"Deadlock và hai cách phá vòng","keyPoints":["Bốn điều kiện: mutual exclusion, hold and wait, no preemption, circular wait","Thứ tự khoá nhất quán trên toàn hệ thống là cách phòng ngừa rẻ và hiệu quả nhất","tryLock có timeout phải nhả hết khoá đang giữ khi thất bại, và nên chờ lại ngẫu nhiên","Livelock: thread RUNNABLE, CPU cao, thread dump trông sạch — khó phát hiện hơn deadlock","jstack tự phát hiện deadlock; ThreadMXBean.findDeadlockedThreads dùng được trong health check","Không gọi alien method khi đang giữ khoá"],"trap":"Dùng tryLock nhưng khi thất bại lại giữ nguyên khoá đầu tiên và lặp thử tiếp. Đó vẫn là hold-and-wait nguyên vẹn, deadlock chỉ đổi từ treo cứng sang treo có nhịp và tốn thêm CPU.","followUp":["Nêu bốn điều kiện cần của deadlock và cách bạn chọn phá điều kiện nào?","Livelock khác deadlock ở điểm nào khi nhìn thread dump?","Vì sao không nên gọi callback của tầng khác khi đang giữ lock?"]},{"id":"t-18-7","topicId":18,"versions":[8,11,17,21],"title":"ExecutorService và thread pool: cấu hình sai là sự cố production","summary":"Thứ tự core-queue-max, vì sao newFixedThreadPool có thể gây OOM, cách chọn kích thước, và bẫy nuốt exception của submit.","sections":["<b>Thứ tự quyết định của <code>ThreadPoolExecutor</code> — phải thuộc.</b> Khi có task mới: nếu số thread đang chạy nhỏ hơn <code>corePoolSize</code> thì tạo thread mới; nếu không thì <b>đưa vào hàng đợi</b>; chỉ khi hàng đợi đầy mới tạo thêm thread tới <code>maximumPoolSize</code>; hết chỗ nữa thì gọi <code>RejectedExecutionHandler</code>. Hệ quả cực kỳ quan trọng: nếu hàng đợi không giới hạn thì bước 'đầy' không bao giờ xảy ra, và <code>maximumPoolSize</code> trở nên vô nghĩa — pool vĩnh viễn chỉ có <code>corePoolSize</code> thread.","<b>Vì sao <code>Executors.newFixedThreadPool</code> nguy hiểm.</b> Nó dùng <code>LinkedBlockingQueue</code> không giới hạn. Khi tốc độ nhận task vượt tốc độ xử lý, hàng đợi phình ra mãi: bộ nhớ tăng dần, độ trễ tăng theo hàng đợi, và cuối cùng là <code>OutOfMemoryError</code> — nhưng ứng dụng đã vô dụng từ lâu trước đó vì task chờ hàng phút. <code>newSingleThreadExecutor</code> có đúng vấn đề này. Ở phía ngược lại, <code>newCachedThreadPool</code> dùng <code>SynchronousQueue</code> với <code>maximumPoolSize = Integer.MAX_VALUE</code> nên tạo thread không giới hạn và OOM theo kiểu khác. Vì vậy nhiều coding standard cấm dùng <code>Executors</code> factory và bắt tự tạo <code>ThreadPoolExecutor</code> với hàng đợi có giới hạn.","<b>Chọn kích thước pool.</b> Với CPU-bound, số thread hợp lý xấp xỉ số core (một số tài liệu đề xuất N+1 để bù lúc page fault); nhiều hơn chỉ thêm context switch. Với IO-bound, công thức tham khảo là N × (1 + thời gian chờ / thời gian tính); một tác vụ chờ 90% thời gian có thể cần gấp mười lần số core. Nhưng đây chỉ là điểm khởi đầu — con số cuối cùng phải đến từ đo đạc, và trần thật thường nằm ở connection pool hay downstream chứ không ở CPU.","<b>Chiến lược từ chối là chỗ đặt backpressure.</b> <code>AbortPolicy</code> (mặc định) ném <code>RejectedExecutionException</code>. <code>CallerRunsPolicy</code> bắt chính thread gọi chạy task đó — cách hạn dòng tự nhiên và rất hiệu quả vì thread nhận request bị chậm lại nên tự động giảm tốc độ nạp. <code>DiscardPolicy</code> và <code>DiscardOldestPolicy</code> vứt task đi trong im lặng, gần như luôn là lựa chọn sai trừ khi bạn thật sự chấp nhận mất dữ liệu.","<b>Bẫy nuốt exception của <code>submit</code>.</b> <code>execute(Runnable)</code> để exception thoát ra và đi tới <code>UncaughtExceptionHandler</code>, nên bạn thấy nó trong log. <code>submit()</code> thì gói exception vào <code>Future</code> và <b>không in gì cả</b>; nếu bạn không gọi <code>Future.get()</code> thì lỗi biến mất hoàn toàn. Đây là nguyên nhân kinh điển của những job im lặng ngừng chạy mà log sạch bong. Cách phòng: luôn xử lý <code>Future</code>, hoặc bọc thân task trong <code>try/catch</code> ghi log.","<b><code>shutdown</code> so với <code>shutdownNow</code>, và ghi chú theo phiên bản.</b> <code>shutdown()</code> ngừng nhận task mới nhưng chạy hết những gì đã nhận; <code>shutdownNow()</code> cố dừng ngay bằng cách <code>interrupt</code> các thread đang chạy và trả về danh sách task chưa kịp chạy — lưu ý nó chỉ <i>interrupt</i>, nên task nào không kiểm tra cờ interrupt vẫn chạy tiếp tới cùng. Cả hai đều không chờ; muốn chờ phải gọi <code>awaitTermination</code>, và mẫu chuẩn là <code>shutdown()</code> → <code>awaitTermination</code> → quá hạn thì <code>shutdownNow()</code>. Về phiên bản: Java 8 thêm <code>newWorkStealingPool</code> và <code>CompletableFuture</code>; từ Java 19 <code>ExecutorService</code> implement <code>AutoCloseable</code> nên dùng được với try-with-resources; Java 21 thêm <code>newVirtualThreadPerTaskExecutor</code> — không phải một pool, mà là executor tạo một virtual thread cho mỗi task."],"example":"// Tu tao pool voi hang doi CO GIOI HAN va backpressure\nExecutorService pool = new ThreadPoolExecutor(\n        8, 32,                                  // core, max\n        60L, TimeUnit.SECONDS,\n        new ArrayBlockingQueue<>(1000),         // KHONG dung queue vo han\n        new ThreadPoolExecutor.CallerRunsPolicy());\n\n// Bay: exception bien mat hoan toan\npool.submit(() -> { throw new IllegalStateException(\"boom\"); });\n// -> khong in gi ca, tru khi goi future.get()\n\n// Tat pool dung cach\npool.shutdown();\nif (!pool.awaitTermination(30, TimeUnit.SECONDS)) {\n    List<Runnable> pending = pool.shutdownNow();  // interrupt + tra ve task chua chay\n}","exampleTitle":"Pool có giới hạn, bẫy submit và cách shutdown","keyPoints":["Thứ tự: core → hàng đợi → max → reject; hàng đợi vô hạn làm maximumPoolSize vô nghĩa","newFixedThreadPool và newSingleThreadExecutor dùng queue vô hạn nên có thể OOM; newCachedThreadPool tạo thread vô hạn","CPU-bound cỡ số core; IO-bound cỡ N × (1 + thời gian chờ / thời gian tính), rồi phải đo lại","CallerRunsPolicy là cách đặt backpressure tự nhiên","submit nuốt exception vào Future; execute thì đẩy tới UncaughtExceptionHandler","shutdownNow chỉ interrupt, task không kiểm tra cờ interrupt vẫn chạy tiếp"],"trap":"Cấu hình corePoolSize=8, maximumPoolSize=64 với LinkedBlockingQueue mặc định rồi tin rằng khi tải cao pool sẽ nở tới 64 thread. Vì hàng đợi không bao giờ đầy, pool vĩnh viễn dừng ở 8 thread và toàn bộ tải dồn vào hàng đợi.","followUp":["Với queue vô hạn thì maximumPoolSize còn tác dụng gì không?","Vì sao một job chạy trong pool có thể chết im lặng không để lại log?","shutdownNow có đảm bảo dừng được task đang chạy không?"]},{"id":"t-18-8","topicId":18,"versions":[8,11,17,21],"title":"CompletableFuture: compose, exception và bẫy thread pool","summary":"Cách ghép tác vụ bất đồng bộ không bị lồng future, xử lý lỗi đúng chỗ, và vì sao commonPool là quả bom hẹn giờ.","sections":["<b>Vì sao <code>Future</code> của Java 5 không đủ.</b> <code>Future.get()</code> là blocking và không có cách nào gắn hành động 'khi xong thì làm tiếp', không ghép được nhiều future, không có chỗ xử lý lỗi theo luồng. <code>CompletableFuture</code> (Java 8) bổ sung toàn bộ những thứ đó theo phong cách khai báo.","<b><code>thenApply</code> so với <code>thenCompose</code>.</b> <code>thenApply</code> nhận một hàm trả về <i>giá trị</i>; nếu hàm của bạn lại trả về một <code>CompletableFuture</code>, bạn sẽ nhận về future lồng future và phải <code>join</code> hai lần. <code>thenCompose</code> nhận hàm trả về <code>CompletableFuture</code> và làm phẳng kết quả — đúng vai trò <code>flatMap</code>. Còn <code>thenCombine</code> dùng khi hai future độc lập chạy song song và bạn cần ghép hai kết quả lại.","<b>Xử lý lỗi và cái bẫy <code>CompletionException</code>.</b> <code>exceptionally</code> chỉ chạy khi có lỗi và trả về giá trị thay thế; <code>handle</code> chạy trong cả hai trường hợp và nhận cặp (kết quả, lỗi); <code>whenComplete</code> quan sát nhưng không đổi được kết quả. Điểm dễ sai: exception ném ra bên trong một stage sẽ được <b>bọc trong <code>CompletionException</code></b> khi truyền tới các stage sau và khi <code>join()</code> ném ra, nên muốn phân loại lỗi gốc phải gọi <code>getCause()</code>. Riêng <code>get()</code> thì ném <code>ExecutionException</code> — hai loại wrapper khác nhau cho cùng một tình huống.","<b>Thread nào chạy callback — nguồn của nhiều bug tinh vi.</b> Với biến thể không có hậu tố <code>Async</code>, callback có thể chạy trên thread hoàn tất future <i>hoặc</i> chính thread gọi, tuỳ vào việc future đã hoàn tất hay chưa tại thời điểm đăng ký. Nghĩa là không xác định trước được — nếu callback cần một thread cụ thể (ví dụ có ThreadLocal context) thì phải dùng bản <code>Async</code> kèm executor riêng.","<b><code>ForkJoinPool.commonPool()</code> là bẫy lớn nhất.</b> <code>supplyAsync</code> không truyền executor sẽ chạy trên commonPool, vốn có parallelism mặc định chỉ bằng <i>số core trừ một</i> và được chia sẻ với parallel stream của toàn ứng dụng. Đặt blocking IO lên đó là làm nghẽn mọi thứ khác trong JVM. Quy tắc: mọi tác vụ có IO đều phải truyền executor riêng vào <code>supplyAsync(supplier, executor)</code>.","<b>Quan hệ với virtual thread ở Java 21.</b> Khi blocking đã rẻ, phần lớn lý do dùng chuỗi <code>CompletableFuture</code> để né blocking không còn nữa; code tuần tự trên virtual thread dễ đọc và dễ debug hơn. <code>CompletableFuture</code> vẫn hữu ích khi bạn cần fan-out/fan-in khai báo, timeout kiểu <code>orTimeout</code>, hoặc phải làm việc với API đã trả về <code>CompletionStage</code>."],"example":"// thenCompose de khong bi future long future\nCompletableFuture<Order> f = userService.findAsync(id)          // CF<User>\n        .thenCompose(user -> orderService.lastOrderAsync(user)) // CF<Order>\n        .orTimeout(2, TimeUnit.SECONDS)\n        .exceptionally(ex -> {\n            // CAN THAN: orTimeout/completeExceptionally giao throwable THO, getCause() la null.\n            // Chi boc CompletionException khi ham cua mot stage nem ra.\n            Throwable root = (ex instanceof CompletionException && ex.getCause() != null)\n                    ? ex.getCause() : ex;\n            log.warn(\"loi: {}\", root.toString());\n            return Order.EMPTY;\n        });\n\n// Chay song song roi ghep\nCompletableFuture<String> a = CompletableFuture.supplyAsync(this::callA, ioPool);\nCompletableFuture<String> b = CompletableFuture.supplyAsync(this::callB, ioPool);\nString both = a.thenCombine(b, (x, y) -> x + y).join();\n\n// SAI: IO tren commonPool dung chung toan JVM\nCompletableFuture.supplyAsync(() -> httpClient.get(url));","exampleTitle":"compose, combine, exceptionally và executor riêng","keyPoints":["thenApply trả giá trị, thenCompose làm phẳng future lồng nhau, thenCombine ghép hai future song song","Chỉ khi hàm của một stage ném ra thì exception mới bị bọc trong CompletionException; future hoàn tất trực tiếp (completeExceptionally, orTimeout, failedFuture) giao throwable thô cho exceptionally/handle nên getCause() có thể null — riêng join() thì luôn bọc ở biên, còn get() ném ExecutionException","Biến thể không Async chạy trên thread hoàn tất hoặc thread gọi — không xác định trước","supplyAsync không truyền executor sẽ dùng commonPool, chia sẻ toàn JVM và rất nhỏ","Mọi tác vụ IO phải truyền executor riêng"],"trap":"Dùng thenApply cho một hàm trả về CompletableFuture. Kiểu kết quả trở thành future của future, và code phía sau join một lần rồi tưởng đã có giá trị trong khi thực chất đang cầm một future chưa hoàn tất.","followUp":["thenApply và thenCompose khác nhau thế nào, tương ứng với map/flatMap ra sao?","join() và get() ném ra loại exception nào và khác nhau chỗ nào?","Vì sao không nên chạy blocking IO trên ForkJoinPool.commonPool()?"]},{"id":"t-19-1","topicId":19,"versions":[8,11,17,21],"title":"Singleton: enum, double-checked locking và vì sao cần volatile","summary":"Câu hỏi kinh điển nhất về pattern, và cũng là nơi lộ ra ứng viên có hiểu Java Memory Model hay không.","sections":["<b>Vấn đề của double-checked locking khi thiếu <code>volatile</code>.</b> Dòng <code>instance = new Config()</code> không phải một thao tác nguyên tử: JVM cấp phát bộ nhớ, chạy constructor, rồi gán tham chiếu. Trình biên dịch và CPU được phép <i>sắp xếp lại</i> hai bước sau, nên tham chiếu có thể được gán trước khi constructor chạy xong. Một thread khác nhìn thấy <code>instance != null</code> ở lần kiểm tra đầu (ngoài <code>synchronized</code>) sẽ trả về một object <b>chưa khởi tạo xong</b> — field còn giá trị mặc định, và lỗi xuất hiện rất ngẫu nhiên, gần như không tái tạo được trên máy dev.","<b><code>volatile</code> sửa được điều đó từ Java 5.</b> JSR-133 định nghĩa lại Java Memory Model và cho <code>volatile</code> ngữ nghĩa happens-before: mọi thao tác ghi xảy ra trước lần ghi biến volatile đều nhìn thấy được bởi thread nào đọc biến volatile đó và thấy giá trị mới. Nhờ vậy việc ghi tham chiếu không thể bị đẩy lên trước phần khởi tạo. Trước Java 5, DCL <b>không có cách nào</b> làm đúng — đây là bối cảnh lịch sử đáng nêu ra khi trả lời.","<b>Initialization-on-demand holder — lười biếng mà không cần khoá.</b> Đặt instance vào một static nested class; JVM chỉ nạp và khởi tạo class đó ở lần truy cập đầu tiên, và bảo đảm khởi tạo class là thread-safe bằng khoá nội bộ của chính JVM. Kết quả là lazy thật sự, không synchronized trong code của bạn, không cần volatile, và không có chi phí ở đường chạy nóng. Đây là lựa chọn tốt nhất khi bạn cần một class thường (không dùng được enum).","<b><code>enum</code> là cách an toàn nhất (Effective Java, Item 3).</b> JVM bảo đảm mỗi hằng enum chỉ được tạo một lần. Quan trọng hơn, enum miễn nhiễm với hai đường phá singleton mà các cách khác đều dính: <b>serialization</b> (deserialize một singleton thường sẽ tạo object thứ hai trừ khi bạn cài <code>readResolve()</code>) và <b>reflection</b> (<code>Constructor.newInstance()</code> trên enum bị chính JVM từ chối với <code>IllegalArgumentException</code>). Nhược điểm là enum không extends được class khác và khởi tạo là eager theo thời điểm nạp class.","<b>Cái giá thật của Singleton: khó test.</b> Trạng thái toàn cục tồn tại suốt vòng đời JVM nên các test ảnh hưởng lẫn nhau qua thứ tự chạy — sửa xong test A thì test B đỏ. Không có chỗ nào để inject một implementation giả vì người gọi tự đi lấy instance thay vì nhận nó. Singleton cũng che giấu phụ thuộc: nhìn chữ ký constructor không biết class này thực sự cần những gì.","<b>Kết luận thiết kế nên nói khi phỏng vấn.</b> Trong ứng dụng dùng DI container, gần như không nên tự cài Singleton pattern: khai báo bean scope singleton là đủ, và bạn được đúng một instance mà vẫn inject/mock được. Singleton tự cài chỉ còn hợp lý cho tiện ích thuần tuý không trạng thái, hoặc trong code không có container. Nói được sự phân biệt này quan trọng hơn việc thuộc lòng ba cách viết."],"example":"// 1) Enum - an toan nhat, chong ca serialization lan reflection\npublic enum ConfigStore {\n    INSTANCE;\n    private final Map<String, String> data = new ConcurrentHashMap<>();\n    public String get(String k) { return data.get(k); }\n}\n\n// 2) Holder idiom - lazy that su, khong khoa trong code cua ban\npublic final class ConfigStore2 {\n    private ConfigStore2() {}\n    private static class Holder {\n        static final ConfigStore2 INSTANCE = new ConfigStore2();\n    }\n    public static ConfigStore2 getInstance() { return Holder.INSTANCE; }\n}\n\n// 3) DCL - BAT BUOC volatile, thieu la bug canh tranh\npublic final class ConfigStore3 {\n    private static volatile ConfigStore3 instance;   // bo volatile = bug\n    private ConfigStore3() {}\n    public static ConfigStore3 getInstance() {\n        ConfigStore3 local = instance;               // doc volatile 1 lan\n        if (local == null) {\n            synchronized (ConfigStore3.class) {\n                local = instance;\n                if (local == null) {\n                    instance = local = new ConfigStore3();\n                }\n            }\n        }\n        return local;\n    }\n}","exampleTitle":"Ba cách cài Singleton, xếp theo mức độ nên dùng","keyPoints":["Thiếu volatile trong DCL cho phép reordering, thread khác thấy object chưa khởi tạo xong","volatile chỉ giải quyết được vấn đề này từ Java 5 nhờ JSR-133","Holder idiom lazy mà không cần synchronized hay volatile, dựa vào bảo đảm khởi tạo class của JVM","enum chống được cả serialization lẫn reflection — hai đường phá singleton còn lại","Trong ứng dụng có DI, dùng bean scope singleton thay vì tự cài pattern"],"trap":"Trả lời 'DCL cần synchronized là đủ'. Người phỏng vấn sẽ hỏi tiếp vì sao vẫn cần volatile — câu trả lời nằm ở reordering trong lúc khởi tạo object, không nằm ở tranh chấp khoá.","followUp":["Vì sao deserialize một singleton thường lại tạo ra instance thứ hai, và readResolve() sửa thế nào?","Holder idiom lazy dựa trên bảo đảm nào của JVM về khởi tạo class?"]},{"id":"t-19-2","topicId":19,"versions":[8,11,17,21],"title":"Factory Method, Abstract Factory và static factory method","summary":"Ba khái niệm khác hẳn nhau nhưng hay bị gọi chung là 'factory' — phân biệt được là điểm cộng rõ rệt.","sections":["<b>Factory Method (GoF).</b> Class cha định nghĩa một method tạo object và để <b>class con quyết định</b> tạo ra kiểu cụ thể nào. Cơ chế là kế thừa: bạn override method tạo. Ví dụ trong JDK là <code>Collection.iterator()</code> — mỗi collection tự quyết định trả về iterator loại gì, còn code dùng <code>for-each</code> hoàn toàn không biết. Ý nghĩa: tách 'khi nào cần tạo' khỏi 'tạo cái gì'.","<b>Abstract Factory (GoF).</b> Một interface cung cấp nhiều method tạo, tương ứng với một <b>họ sản phẩm liên quan</b> phải đi cùng nhau. Ví dụ <code>UiFactory</code> có <code>createButton()</code>, <code>createCheckbox()</code>, và bạn chọn <code>DarkUiFactory</code> hay <code>LightUiFactory</code> — điểm mấu chốt là không thể trộn nút của theme này với checkbox của theme kia. Nếu chỉ có một loại sản phẩm thì đó là Factory Method chứ không phải Abstract Factory.","<b>Static factory method (Effective Java, Item 1) — không phải pattern GoF.</b> Đó chỉ là một static method thay cho constructor: <code>Integer.valueOf</code>, <code>List.of</code>, <code>Optional.ofNullable</code>, <code>Duration.ofSeconds</code>. Lợi ích: <i>có tên</i> nên đọc dễ hơn nhiều constructor trùng chữ ký; <i>không bắt buộc tạo object mới</i> nên cache được (<code>Integer.valueOf</code> cache -128..127); <i>trả về kiểu con</i> nên giấu được implementation. Nhược điểm: class không có constructor public thì không kế thừa được, và tên method không nổi bật trong javadoc như constructor.","<b>Khi nào factory thực sự đáng dùng.</b> Khi việc chọn implementation phụ thuộc dữ liệu runtime (mã ngân hàng, loại file, cấu hình), khi việc tạo object cần logic đáng kể (validate, tra bảng, khởi tạo tài nguyên), hoặc khi bạn muốn người dùng chỉ phụ thuộc vào interface. Nếu chỉ là <code>new</code> gói lại trong một method, bạn vừa thêm một tầng gián tiếp mà không đổi lại được gì.","<b>Liên hệ Spring — factory ở đâu.</b> <code>BeanFactory</code>/<code>ApplicationContext</code> chính là một factory khổng lồ; <code>FactoryBean&lt;T&gt;</code> là điểm móc cho bạn tự viết logic tạo bean phức tạp. Trong code ứng dụng, khi cần chọn một trong nhiều implementation theo dữ liệu, cách gọn nhất thường là inject <code>Map&lt;String, Gateway&gt;</code> — Spring tự điền map với key là tên bean — thay vì viết một chuỗi <code>if/else</code> trong một factory class.","<b>Java 21 mở thêm một lựa chọn.</b> Với <code>sealed interface</code> cộng pattern matching trong <code>switch</code>, một 'factory' phân nhánh theo kiểu có thể viết gọn và được compiler kiểm tra đầy đủ trường hợp (exhaustiveness). Đây là cách tiếp cận thiên về kiểu dữ liệu chứ không phải đa hình, và chỉ hợp khi tập sản phẩm là đóng và ít thay đổi."],"example":"// Factory Method: class con quyet dinh kieu cu the\nabstract class Report {\n    protected abstract Exporter createExporter();   // factory method\n    public byte[] render() { return createExporter().export(this); }\n}\nclass PdfReport extends Report {\n    protected Exporter createExporter() { return new PdfExporter(); }\n}\n\n// Abstract Factory: mot ho san pham phai di cung nhau\ninterface UiFactory {\n    Button createButton();\n    Checkbox createCheckbox();\n}\nclass DarkUiFactory implements UiFactory { /* ... */ }\n\n// Static factory method: KHONG phai pattern GoF\nInteger a = Integer.valueOf(100);       // co the tra ve object da cache\nList<String> l = List.of(\"a\", \"b\");     // giau implementation bat bien\n\n// Trong Spring: thay chuoi if/else bang Map do container dien san\n@Service\nclass PaymentRouter {\n    private final Map<String, Gateway> gateways;   // key = ten bean\n    PaymentRouter(Map<String, Gateway> gateways) { this.gateways = gateways; }\n    Gateway pick(String code) {\n        Gateway g = gateways.get(code);\n        if (g == null) throw new IllegalArgumentException(\"Khong ho tro: \" + code);\n        return g;\n    }\n}","exampleTitle":"Ba khái niệm cạnh nhau để thấy rõ khác biệt","keyPoints":["Factory Method dựa vào kế thừa, class con quyết định kiểu cụ thể","Abstract Factory tạo cả một họ sản phẩm phải nhất quán với nhau","Static factory method không phải pattern GoF; lợi ích là có tên, cache được, giấu được kiểu trả về","Integer.valueOf cache -128..127 — ví dụ trực tiếp của lợi ích 'không bắt buộc tạo mới'","Trong Spring, inject Map<String, Interface> thường gọn hơn viết factory thủ công"],"trap":"Gọi mọi static method tạo object là 'Factory pattern'. Người phỏng vấn hay hỏi tiếp 'vậy List.of là Factory Method hay Abstract Factory?' — câu trả lời đúng là không phải cái nào cả.","followUp":["Nếu chỉ có một loại sản phẩm thì Abstract Factory còn hợp lý không?","Static factory method có nhược điểm gì so với constructor?"]},{"id":"t-19-3","topicId":19,"versions":[8,11,17,21],"title":"Builder: khi nào thực sự cần, và liên hệ với record","summary":"Builder giải quyết bài toán constructor nhiều tham số tuỳ chọn — nhưng dùng bừa bãi thì chỉ tạo thêm code lặp.","sections":["<b>Bài toán gốc: telescoping constructor.</b> Khi một class có 3 tham số bắt buộc và 6 tham số tuỳ chọn, bạn phải viết một chuỗi constructor gọi lồng nhau, và người dùng nhìn <code>new Pizza(12, true, false, false, true, 2)</code> thì không thể biết mỗi giá trị nghĩa là gì. Tệ hơn, hoán đổi nhầm hai tham số cùng kiểu <code>boolean</code> hay <code>int</code> vẫn compile sạch và chỉ sai lúc chạy.","<b>Vì sao không dùng JavaBeans setter.</b> Cách <code>new Pizza(); p.setSize(12); p.setCheese(true);</code> đọc dễ hơn nhưng phá hỏng hai thứ: object tồn tại ở trạng thái dở dang giữa các lời gọi setter (không thể validate ở một chỗ), và class buộc phải mutable nên không thread-safe. Builder giữ được cả tính đọc dễ lẫn tính bất biến — đây chính là lập luận trung tâm của Effective Java Item 2.","<b>Nơi đặt validate.</b> Kiểm tra ràng buộc nên nằm trong <code>build()</code> và trong constructor của object đích, không nằm rải rác trong từng method setter của builder. Lý do là các ràng buộc liên trường (ví dụ 'ngày kết thúc phải sau ngày bắt đầu') chỉ kiểm tra được khi đã có đủ dữ liệu. Constructor của object đích cũng nên copy giá trị từ builder chứ không giữ tham chiếu tới builder, để builder có thể tiếp tục thay đổi mà không ảnh hưởng object đã tạo.","<b>Khi nào <i>không</i> nên dùng Builder.</b> Với 2-3 tham số, builder chỉ làm code dài ra. Một dấu hiệu cảnh báo thường bị bỏ qua: nếu class cần builder vì có quá nhiều field, có khi vấn đề thật là class đó đang gánh quá nhiều trách nhiệm và nên tách thành các value object nhỏ hơn (địa chỉ, khoảng thời gian, thông tin liên hệ). Builder khi đó chỉ là băng dán cho một thiết kế cần chia lại.","<b>Liên hệ với <code>record</code> (chuẩn từ Java 16, có ở LTS 17 và 21).</b> Record cho bạn miễn phí tính bất biến, <code>equals</code>/<code>hashCode</code>/<code>toString</code>, và <i>tham số có tên trong chữ ký</i> — nên với 3-4 component thì record dùng trực tiếp là đủ và builder trở nên thừa. Nhưng record <b>không</b> giải quyết bài toán tham số tuỳ chọn: gọi canonical constructor vẫn phải truyền đủ mọi component theo đúng thứ tự. Với record nhiều component, builder vẫn hữu ích, và validate đặt trong compact constructor.","<b>Thực tế với Lombok.</b> <code>@Builder</code> loại bỏ phần code lặp nhưng cũng che mất chỗ để validate, nên nhiều team kết hợp <code>@Builder</code> với một compact constructor hoặc <code>@Builder</code> đặt trên constructor đã có kiểm tra. Cần nói rõ điểm này: builder sinh tự động mặc định <b>không</b> ép được tham số bắt buộc — quên gán một field thì vẫn build ra object với <code>null</code>."],"example":"// Record: 3-4 component thi dung truc tiep, khong can builder\npublic record Money(BigDecimal amount, Currency currency) {\n    public Money {   // compact constructor - noi dat validate\n        Objects.requireNonNull(amount);\n        if (amount.scale() > 2) throw new IllegalArgumentException(\"Toi da 2 chu so\");\n    }\n}\n\n// Builder cho object nhieu truong tuy chon, giu tinh bat bien\npublic final class SearchQuery {\n    private final String keyword;     // bat buoc\n    private final int page;\n    private final int size;\n    private final String sortBy;\n\n    private SearchQuery(Builder b) {  // copy tu builder, khong giu tham chieu\n        this.keyword = b.keyword;\n        this.page = b.page;\n        this.size = b.size;\n        this.sortBy = b.sortBy;\n    }\n\n    public static Builder builder(String keyword) { return new Builder(keyword); }\n\n    public static final class Builder {\n        private final String keyword;\n        private int page = 0;\n        private int size = 20;\n        private String sortBy = \"id\";\n\n        private Builder(String keyword) {                 // ep tham so bat buoc\n            this.keyword = Objects.requireNonNull(keyword);\n        }\n        public Builder page(int page) { this.page = page; return this; }\n        public Builder size(int size) { this.size = size; return this; }\n        public Builder sortBy(String s) { this.sortBy = s; return this; }\n\n        public SearchQuery build() {                      // validate lien truong o day\n            if (size <= 0 || size > 100) throw new IllegalArgumentException(\"size 1..100\");\n            return new SearchQuery(this);\n        }\n    }\n}\n\nSearchQuery q = SearchQuery.builder(\"laptop\").size(50).sortBy(\"price\").build();","exampleTitle":"Tham số bắt buộc đặt trong constructor của Builder","keyPoints":["Builder giải bài toán nhiều tham số tuỳ chọn mà vẫn giữ object bất biến","Validate liên trường thuộc về build() và constructor của object đích","Đặt tham số bắt buộc vào constructor của Builder để compiler ép người dùng","Record (Java 16+, có ở LTS 17/21) làm builder thành thừa với 3-4 component","@Builder của Lombok không ép được tham số bắt buộc — quên field là ra null"],"trap":"Dùng Builder cho mọi DTO. Nếu class chỉ có vài field bắt buộc thì record hoặc constructor thường ngắn hơn, an toàn hơn, và không tạo ra trạng thái trung gian nào để mà sai.","followUp":["Record có thay thế được Builder hoàn toàn không? Vì sao?","Làm sao ép người dùng bắt buộc phải gán một field khi dùng builder?"]},{"id":"t-19-4","topicId":19,"versions":[8,11,17,21],"title":"Strategy, Template Method, Observer — và lambda đã thay đổi những gì","summary":"Ba pattern hành vi hay bị nhầm lẫn, cộng với tác động của Java 8 lên cách viết chúng.","sections":["<b>Strategy — thay chuỗi if/else bằng đa hình.</b> Đóng gói mỗi thuật toán vào một object riêng cùng implement một interface, rồi chọn object lúc runtime. Dấu hiệu nhận biết cần Strategy: một <code>switch</code> trên 'loại' xuất hiện lặp lại ở nhiều nơi, và mỗi lần thêm loại mới bạn phải sửa hết mọi chỗ đó — vi phạm nguyên tắc mở/đóng. Sau khi refactor, thêm loại mới chỉ là thêm một class.","<b>Java 8 làm Strategy gần như tàng hình.</b> Nếu interface chỉ có một method (functional interface), implementation trở thành một lambda hoặc method reference — không còn class riêng, không còn file riêng. Chính vì thế nhiều API hiện đại nhận thẳng <code>Comparator</code>, <code>Predicate</code>, <code>Function</code> làm tham số: đó là Strategy pattern nhưng không ai còn gọi tên nó nữa. Khi nào vẫn nên viết class: khi strategy có trạng thái, có nhiều method, hoặc cần được quản lý bởi DI container.","<b>Template Method — khung cố định, vài bước để trống.</b> Class cha viết sẵn thứ tự các bước trong một method (thường để <code>final</code> để không ai đảo thứ tự), và khai báo abstract những bước biến thiên cho class con điền. Ví dụ trong JDK và framework: <code>HttpServlet.service()</code> điều phối rồi gọi <code>doGet</code>/<code>doPost</code>; <code>AbstractList</code> cài sẵn phần lớn hành vi dựa trên <code>get(int)</code> và <code>size()</code>.","<b>Strategy vs Template Method — khác biệt cốt lõi là cơ chế.</b> Template Method dùng <b>kế thừa</b>, quyết định được cố định lúc biên dịch, và class con chỉ thay đổi được đúng những chỗ cha cho phép. Strategy dùng <b>composition</b>, có thể thay đổi lúc runtime, và một object có thể mang nhiều strategy khác nhau. Vì kế thừa tạo ràng buộc chặt và chỉ dùng được một lần, thiết kế hiện đại thường nghiêng về Strategy; Template Method vẫn hợp khi luồng xử lý thực sự cố định và bạn muốn ép mọi biến thể đi đúng thứ tự đó.","<b>Observer — và cái bẫy rò rỉ listener.</b> Subject giữ danh sách listener và gọi chúng khi có sự kiện. Bẫy kinh điển: listener được đăng ký nhưng không bao giờ gỡ, mà subject thường sống lâu hơn listener, nên subject giữ tham chiếu mạnh và GC không dọn được listener cùng toàn bộ object mà nó tham chiếu tới. Biểu hiện là heap tăng dần theo thời gian chạy. Đăng ký bằng lambda còn khó gỡ hơn vì bạn không giữ tham chiếu để mà truyền vào <code>removeListener</code>.","<b>Trạng thái của Observer trong JDK.</b> <code>java.util.Observer</code> và <code>java.util.Observable</code> đã bị <b>deprecate từ Java 9</b> vì mô hình sự kiện quá yếu (không có kiểu cho sự kiện, không bảo đảm thứ tự thông báo, không serializable an toàn). Thay thế trong thực tế là <code>PropertyChangeListener</code>, event của framework (<code>ApplicationEventPublisher</code> trong Spring), message broker, hoặc <code>Flow</code> API (Reactive Streams, có từ Java 9) khi cần backpressure. Nói được điểm này cho thấy bạn theo dõi cả sự tiến hoá của JDK chứ không chỉ đọc sách GoF."],"example":"// Strategy truoc Java 8: mot class cho moi thuat toan\ninterface DiscountPolicy { BigDecimal apply(BigDecimal total); }\nclass NoDiscount implements DiscountPolicy { /* ... */ }\nclass VipDiscount implements DiscountPolicy { /* ... */ }\n\n// Strategy tu Java 8: lambda, khong con class rieng\nMap<String, DiscountPolicy> policies = Map.of(\n    \"NONE\", total -> total,\n    \"VIP\",  total -> total.multiply(new BigDecimal(\"0.9\")),\n    \"BLACK_FRIDAY\", total -> total.subtract(new BigDecimal(\"50000\"))\n);\nBigDecimal finalPrice = policies.get(code).apply(total);\n\n// Template Method: khung co dinh, buoc bien thien de trong\nabstract class ImportJob {\n    public final void run() {          // final: khong ai duoc dao thu tu\n        var raw = load();\n        var valid = validate(raw);\n        persist(valid);\n        notifyDone();\n    }\n    protected abstract List<Row> load();\n    protected abstract List<Row> validate(List<Row> raw);\n    protected void notifyDone() { }    // hook tuy chon\n}\n\n// Observer: dang ky bang lambda thi KHONG go ra duoc\nRunnable listener = () -> refreshUi();\nbus.subscribe(listener);\n// ...\nbus.unsubscribe(listener);   // phai giu tham chieu moi go duoc","exampleTitle":"Strategy bằng lambda, Template Method bằng kế thừa","keyPoints":["Strategy dùng composition, thay được lúc runtime; Template Method dùng kế thừa, cố định lúc compile","Từ Java 8, Strategy với interface một method thu gọn thành lambda hoặc method reference","Method điều phối của Template Method nên để final để giữ đúng thứ tự các bước","Listener không được gỡ là nguồn memory leak kinh điển; lambda càng khó gỡ vì không có tham chiếu","java.util.Observer/Observable deprecate từ Java 9; thay bằng event framework hoặc Flow API"],"trap":"Nói 'Strategy và Template Method giống nhau, chỉ khác cách viết'. Khác biệt thật là composition vs kế thừa, kéo theo khác biệt về thời điểm quyết định và mức ràng buộc — đó mới là điều được hỏi.","followUp":["Khi nào bạn vẫn viết class riêng cho strategy thay vì lambda?","Vì sao java.util.Observable bị deprecate từ Java 9?"]},{"id":"t-19-5","topicId":19,"versions":[8,11,17,21],"title":"Proxy, Decorator, Adapter trong JDK và Spring AOP; DI không phải pattern GoF","summary":"Ba pattern cấu trúc trông giống nhau về hình thức, cộng với những hiểu nhầm phổ biến nhất về DI và anti-pattern.","sections":["<b>Decorator — bọc để <i>thêm hành vi</i>, giữ nguyên interface.</b> Ví dụ chuẩn mực nằm ngay trong JDK: <code>new BufferedInputStream(new GZIPInputStream(new FileInputStream(f)))</code>. Mỗi lớp bọc đều là <code>InputStream</code>, đều nhận một <code>InputStream</code>, và mỗi lớp thêm đúng một khả năng. Nhờ vậy tổ hợp là tuyến tính chứ không bùng nổ theo cấp số nhân như khi dùng kế thừa cho từng tổ hợp. Đây là lý do thiết kế <code>java.io</code> hay bị chê là dài dòng nhưng lại rất linh hoạt.","<b>Adapter — đổi interface, không đổi hành vi.</b> Nó tồn tại để nối hai API không khớp nhau. Trong JDK: <code>InputStreamReader</code> là adapter từ luồng byte sang luồng ký tự; <code>Arrays.asList(array)</code> đưa một mảng vào interface <code>List</code>. Điểm phân biệt với Decorator: Decorator giữ nguyên kiểu và bổ sung năng lực, Adapter đổi kiểu và giữ nguyên năng lực.","<b>Proxy — cùng interface, kiểm soát <i>việc truy cập</i>.</b> Proxy đứng trước đối tượng thật để làm những việc chéo: kiểm tra quyền, mở/đóng transaction, cache, ghi log, gọi từ xa, khởi tạo trễ. <code>java.lang.reflect.Proxy</code> tạo proxy động lúc runtime nhưng chỉ làm được cho <b>interface</b>; muốn proxy một class thường phải dùng thư viện sinh subclass như CGLIB hoặc ByteBuddy.","<b>Spring AOP đứng trên chính cơ chế đó.</b> Spring chọn JDK dynamic proxy khi bean có interface, hoặc CGLIB (tạo class con) khi không có — Spring Boot mặc định đặt <code>proxyTargetClass=true</code> nên trên thực tế CGLIB được dùng phổ biến. Hệ quả trực tiếp: CGLIB không override được method <code>final</code>, <code>private</code> hay <code>static</code>, nên <code>@Transactional</code> hay <code>@Cacheable</code> đặt lên chúng sẽ <b>im lặng không hoạt động</b> — không lỗi, không cảnh báo, chỉ là advice không chạy.","<b>Self-invocation: cái bẫy được hỏi nhiều nhất về Proxy.</b> Advice chỉ chạy khi lời gọi <i>đi qua</i> proxy. Nếu một method của bean gọi method khác trong cùng bean bằng <code>this.other()</code> (kể cả viết tắt <code>other()</code>), lời gọi đi thẳng tới đối tượng thật và bỏ qua proxy hoàn toàn — transaction không mở, cache không hoạt động, <code>@Async</code> chạy đồng bộ. Cách xử lý: tách method sang một bean khác (sạch nhất), tự inject chính mình, hoặc dùng <code>AopContext.currentProxy()</code>; hai cách sau đều là dấu hiệu thiết kế nên xem lại.","<b>DI không phải pattern GoF, và Service Locator là anti-pattern.</b> Sách GoF xuất bản năm 1994 không có Dependency Injection; thuật ngữ này do Martin Fowler đặt năm 2004 để mô tả một dạng cụ thể của Inversion of Control, và nó gắn với Dependency Inversion Principle trong SOLID chứ không phải với danh mục GoF. Đối trọng của nó là Service Locator — object tự đi lấy phụ thuộc từ một registry toàn cục — bị coi là anti-pattern vì phụ thuộc bị giấu khỏi chữ ký constructor, test phải dựng cả registry, và lỗi thiếu phụ thuộc chỉ lộ ra lúc runtime. Các anti-pattern hay bị hỏi kèm: God object (một class ôm hết trách nhiệm), và 'dùng pattern cho có' — thêm interface với đúng một implementation, thêm factory chỉ để gọi <code>new</code>. Nguyên tắc cuối cùng nên nói ra: chọn pattern từ vấn đề đang có, chứ không áp pattern rồi tìm chỗ nhét vào."],"example":"// Decorator trong JDK: moi lop giu nguyen kieu, them mot kha nang\nInputStream in = new BufferedInputStream(\n                     new GZIPInputStream(\n                         new FileInputStream(\"data.gz\")));\n\n// Adapter trong JDK: doi kieu tu byte stream sang char stream\nReader reader = new InputStreamReader(in, StandardCharsets.UTF_8);\n\n// Proxy dong cua JDK: CHI lam duoc cho interface\nPaymentService proxy = (PaymentService) Proxy.newProxyInstance(\n        PaymentService.class.getClassLoader(),\n        new Class<?>[]{ PaymentService.class },\n        (p, method, args) -> {\n            long t0 = System.nanoTime();\n            try { return method.invoke(realService, args); }\n            finally { log.info(\"{} mat {} ns\", method.getName(), System.nanoTime() - t0); }\n        });\n\n// BAY self-invocation: save() KHONG di qua proxy -> @Transactional vo hieu\n@Service\npublic class OrderService {\n    public void processAll(List<Order> orders) {\n        for (Order o : orders) {\n            save(o);            // = this.save(o) -> bo qua proxy hoan toan\n        }\n    }\n    @Transactional\n    public void save(Order o) { repo.save(o); }\n}","exampleTitle":"Ba pattern cấu trúc trong JDK, và bẫy self-invocation","keyPoints":["Decorator giữ nguyên interface và thêm hành vi — java.io là ví dụ chuẩn","Adapter đổi interface và giữ nguyên hành vi — InputStreamReader, Arrays.asList","java.lang.reflect.Proxy chỉ proxy được interface; class thường cần CGLIB/ByteBuddy","Method final/private/static không được CGLIB proxy nên @Transactional trên chúng im lặng vô hiệu","Self-invocation qua this bỏ qua proxy — nguyên nhân số một khiến @Transactional không chạy","DI không nằm trong GoF; Service Locator bị coi là anti-pattern vì giấu phụ thuộc"],"trap":"Đặt @Transactional lên một method rồi gọi nó từ một method khác trong cùng class và tin rằng transaction đã mở. Lời gọi qua this không đi qua proxy, nên rollback sẽ không x
