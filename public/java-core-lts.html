<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1120">
<title>Java Core LTS - Ôn Luyện Kiến Thức</title>
<meta name="description" content="Ôn luyện Java Core qua 4 phiên bản LTS (8, 11, 17, 21) với hướng dẫn chuyên sâu và bài tập trắc nghiệm cấp độ phỏng vấn.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B1120; --panel:#131C2E; --panel2:#1A2438; --line:#27354F;
  --paper:#E6EDF7; --muted:#8296B8; --dim:#5E739A;
  --amber:#F5A623; --ember:#E2564A; --mint:#3FD08E; --azure:#4C9EEB; --violet:#9B7BE8;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --sans:'IBM Plex Sans',system-ui,sans-serif;
  --disp:'Space Grotesk',var(--sans);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--ink); color:var(--paper); font-family:var(--sans);
  font-size:clamp(14px,2.5vw,16px); line-height:1.65; -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(ellipse 80% 50% at 50% -10%, rgba(76,158,235,.10), transparent 70%);
  background-attachment:fixed; min-height:100%;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
code{font-family:var(--mono);font-size:.87em;background:rgba(76,158,235,.13);
  color:#A9CDF3;padding:.1em .38em;border-radius:4px;border:1px solid rgba(76,158,235,.16)}
b{font-weight:600;color:#fff}
i{color:var(--muted)}

.wrap{max-width:900px;margin:0 auto;padding:0 clamp(12px,3vw,20px) calc(clamp(40px,8vw,64px) + env(safe-area-inset-bottom))}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:50;background:rgba(11,17,32,.9);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line);margin-bottom:20px}
.bar-in{max-width:900px;margin:0 auto;padding:calc(11px + env(safe-area-inset-top)) clamp(12px,3vw,20px) 11px;
  display:flex;align-items:center;gap:10px}
.brand{font-family:var(--disp);font-weight:700;font-size:clamp(13px,2.5vw,15px);letter-spacing:-.01em;white-space:nowrap}
.brand span{color:var(--azure)}
.bar-sp{flex:1}
.counter{font-family:var(--mono);font-size:clamp(10px,2vw,12px);color:var(--muted);white-space:nowrap}
.counter b{color:var(--paper)}
.counter .acc{color:var(--mint)}
.track{height:2px;background:var(--line);position:relative;overflow:hidden}
.track i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--azure),var(--mint));
  width:0;transition:width .45s cubic-bezier(.4,0,.2,1)}

/* ---------- hero ---------- */
.hero{padding:clamp(26px,5vw,48px) 0 clamp(18px,3vw,30px);border-bottom:1px solid var(--line);margin-bottom:20px}
.eyebrow{font-family:var(--mono);font-size:clamp(9px,2vw,11px);letter-spacing:.16em;text-transform:uppercase;
  color:var(--azure);margin-bottom:12px}
h1{font-family:var(--disp);font-size:clamp(24px,5vw,44px);line-height:1.08;
  font-weight:700;letter-spacing:-.028em;margin-bottom:12px}
h1 em{font-style:normal;color:var(--azure)}
.lede{color:var(--muted);max-width:60ch;font-size:clamp(13px,2.5vw,16.5px)}
.lede b{color:var(--paper);font-weight:600}

.sec{margin-bottom:22px}
.sec-h{font-family:var(--mono);font-size:clamp(9px,2vw,11px);letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);margin-bottom:11px;display:flex;align-items:center;gap:10px}
.sec-h:after{content:'';flex:1;height:1px;background:var(--line)}

.chips{display:flex;flex-wrap:wrap;gap:clamp(6px,2vw,8px)}
.chip{padding:clamp(6px,1.5vw,8px) clamp(11px,2vw,14px);border:1px solid var(--line);border-radius:999px;
  font-size:clamp(12px,2vw,13.5px);color:var(--muted);transition:.15s;background:var(--panel);
  cursor:pointer;min-height:44px;display:inline-flex;align-items:center;-webkit-tap-highlight-color:transparent}
.chip:hover{border-color:var(--dim);color:var(--paper)}
.chip.on{background:rgba(76,158,235,.11);border-color:var(--azure);color:var(--azure)}
.chip .n{font-family:var(--mono);font-size:clamp(9px,1.5vw,11px);opacity:.65;margin-left:5px}

.tabs{display:flex;gap:clamp(6px,2vw,8px);margin-bottom:18px;border-bottom:1px solid var(--line);
  padding-bottom:12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{padding:clamp(6px,1.5vw,8px) clamp(12px,2.5vw,16px);border:1px solid var(--line);border-radius:6px;
  background:var(--panel);color:var(--muted);transition:.15s;cursor:pointer;font-family:var(--disp);
  font-weight:600;font-size:clamp(12px,2vw,14px);white-space:nowrap;min-height:44px;display:flex;align-items:center}
.tab:active{background:var(--panel2)}
.tab:hover{border-color:var(--dim);color:var(--paper)}
.tab.active{border-color:var(--azure);background:rgba(76,158,235,.07);color:var(--azure)}

/* ---------- layout ---------- */
.sidebar{display:grid;grid-template-columns:1fr;gap:clamp(16px,3vw,26px)}
@media(min-width:860px){ .sidebar{grid-template-columns:212px 1fr} }

.sidebar-menu{display:flex;flex-direction:column;gap:14px;height:fit-content;min-width:0}
.menu-group{display:flex;flex-direction:column;gap:8px;min-width:0}
.menu-label{font-family:var(--mono);font-size:clamp(10px,1.8vw,11px);letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim);font-weight:600}
.menu-row{display:flex;flex-direction:row;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  padding-bottom:4px;scrollbar-width:thin}
.menu-row::-webkit-scrollbar{height:5px}
.menu-row::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.menu-item{padding:clamp(8px,1.5vw,10px) clamp(11px,2vw,13px);border-radius:6px;font-size:clamp(12px,2vw,13px);
  color:var(--muted);cursor:pointer;transition:.15s;border:1px solid var(--line);min-height:44px;
  display:flex;align-items:center;gap:7px;white-space:nowrap;flex:0 0 auto;-webkit-tap-highlight-color:transparent}
.menu-item:active{background:var(--panel2)}
.menu-item:hover{color:var(--paper);border-color:var(--dim)}
.menu-item.active{background:rgba(76,158,235,.07);border-color:var(--azure);color:var(--azure)}
.menu-item .cnt{font-family:var(--mono);font-size:10px;opacity:.6;margin-left:auto;padding-left:4px}
.menu-item.done{border-color:rgba(63,208,142,.35)}
.menu-item.done .cnt{color:var(--mint);opacity:.9}
@media(min-width:860px){
  .sidebar-menu{position:sticky;top:92px;max-height:calc(100vh - 110px);overflow-y:auto;padding-right:4px}
  .menu-row{flex-direction:column;overflow-x:visible;padding-bottom:0}
  .menu-item{white-space:normal;flex:none;border-color:transparent}
  .menu-item:hover{border-color:var(--line)}
}
.content{min-width:0}

/* ---------- tags ---------- */
.tag{padding:3px 8px;border-radius:4px;border:1px solid var(--line);
  color:var(--muted);font-size:clamp(9px,1.5vw,10.5px);display:inline-block;font-family:var(--mono);
  letter-spacing:.02em;white-space:nowrap}
.tag.beginner{color:var(--mint);border-color:rgba(63,208,142,.4);background:rgba(63,208,142,.09)}
.tag.intermediate{color:var(--amber);border-color:rgba(245,166,35,.35);background:rgba(245,166,35,.08)}
.tag.advanced{color:var(--ember);border-color:rgba(226,86,74,.4);background:rgba(226,86,74,.09)}
.tag.v8{color:var(--azure);border-color:rgba(76,158,235,.4);background:rgba(76,158,235,.09)}
.tag.v11{color:var(--mint);border-color:rgba(63,208,142,.4);background:rgba(63,208,142,.09)}
.tag.v17{color:var(--violet);border-color:rgba(155,123,232,.4);background:rgba(155,123,232,.1)}
.tag.v21{color:var(--amber);border-color:rgba(245,166,35,.35);background:rgba(245,166,35,.08)}
.tag.topic{color:var(--dim);border-color:var(--line);background:var(--panel2);font-family:var(--sans)}
.tagrow{display:flex;gap:5px;align-items:center;margin-bottom:10px;flex-wrap:wrap}

/* ---------- code ---------- */
.code{border:1px solid var(--line);border-radius:8px;background:#0D1526;overflow:hidden;margin:14px 0}
.code-h{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);padding:8px 13px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.015)}
.code pre{margin:0;padding:13px;overflow-x:auto;-webkit-overflow-scrolling:touch;font-family:var(--mono);
  font-size:clamp(11px,1.75vw,12.5px);line-height:1.62}
.code pre::-webkit-scrollbar{height:6px}
.code pre::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.code code{background:none;border:none;padding:0;color:var(--paper);font-size:inherit}
.k{color:#C792EA} .s{color:#C3E88D} .cm{color:#5E739A;font-style:italic}
.an{color:#F5A623} .ty{color:#82D8F5} .nu{color:#F78C6C} .fn{color:#82AAFF}

/* ---------- tutorial ---------- */
h2{font-family:var(--disp);font-size:clamp(19px,4vw,26px);margin-bottom:8px;font-weight:700;letter-spacing:-.02em}
h3{font-family:var(--disp);font-size:clamp(15px,3vw,19px);margin-bottom:6px;font-weight:700;letter-spacing:-.015em;line-height:1.28}
.topic-head{margin-bottom:20px}
.topic-head .lede{font-size:clamp(13px,2.2vw,15px)}

.card{margin-bottom:18px;padding:clamp(14px,2.4vw,22px);border:1px solid var(--line);border-radius:9px;background:var(--panel)}
.tut-sum{color:var(--muted);font-style:italic;font-size:clamp(12.5px,2vw,14px);margin-bottom:14px;
  padding-bottom:12px;border-bottom:1px solid var(--line)}
.prose p{margin-bottom:12px;font-size:clamp(13px,2.1vw,14.5px);color:#CBD9EC}
.prose p:last-child{margin-bottom:0}
.prose b{color:#fff}
.prose code{font-size:.85em}

.kp{margin-top:14px;padding:12px 14px;border-radius:7px;background:var(--panel2);border:1px solid var(--line)}
.kp-h{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--azure);margin-bottom:8px}
.kp ul{margin:0 0 0 17px;color:var(--muted);font-size:clamp(12px,2vw,13px)}
.kp li{margin-bottom:5px}
.kp li:last-child{margin-bottom:0}

.box{margin-top:12px;padding:12px 14px;border-radius:7px;font-size:clamp(12px,2vw,13.5px);line-height:1.6}
.box-h{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:7px;font-weight:700}
.box.trap{background:rgba(226,86,74,.07);border:1px solid rgba(226,86,74,.28);color:#E8D3D0}
.box.trap .box-h{color:var(--ember)}
.box.follow{background:rgba(155,123,232,.07);border:1px solid rgba(155,123,232,.26);color:#DCD3EE}
.box.follow .box-h{color:var(--violet)}
.box.follow ul{margin:0 0 0 17px}
.box.follow li{margin-bottom:4px}
.box.follow li:last-child{margin-bottom:0}

/* ---------- drills ---------- */
.q{font-family:var(--disp);font-size:clamp(15px,3.1vw,20px);line-height:1.38;
  font-weight:700;letter-spacing:-.015em;margin-bottom:6px}
.choices{display:flex;flex-direction:column;gap:9px;margin:14px 0 0}
.choice{padding:clamp(11px,2vw,14px) clamp(12px,2vw,15px);border:1.5px solid var(--line);border-radius:7px;
  background:var(--panel2);cursor:pointer;transition:.14s;-webkit-tap-highlight-color:transparent;
  display:flex;align-items:flex-start;gap:10px;font-size:clamp(12.5px,2vw,14px);text-align:left;width:100%;
  line-height:1.5;color:var(--paper)}
/* Đáp án và câu hỏi hay chứa chuỗi dài không có khoảng trắng
   (raw.stream().filter(...).map(...)) — trên màn hình hẹp chúng tràn ngang
   nếu không cho phép ngắt giữa từ. min-width:0 để con của flex co lại được. */
.choice > span:last-child,.q,.prose p,.verdict p,.verdict .ww,.kp li,.box{overflow-wrap:anywhere}
.choice > span:last-child{min-width:0}
.choice .ltr{font-family:var(--mono);font-size:11px;color:var(--dim);flex:0 0 auto;
  border:1px solid var(--line);border-radius:4px;width:22px;height:22px;display:flex;
  align-items:center;justify-content:center;margin-top:1px}
.choice:not(.locked):hover{border-color:var(--dim);background:#1E2A42}
.choice.correct{border-color:var(--mint);background:rgba(63,208,142,.1)}
.choice.correct .ltr{border-color:var(--mint);color:var(--mint)}
.choice.wrong{border-color:var(--ember);background:rgba(226,86,74,.1)}
.choice.wrong .ltr{border-color:var(--ember);color:var(--ember)}
.choice.locked{cursor:default}
.choice.dim{opacity:.5}

.verdict{margin-top:14px;padding:13px 15px;border-radius:7px;background:var(--panel2);
  border-left:3px solid var(--line);font-size:clamp(12.5px,2vw,14px)}
.verdict.ok{border-left-color:var(--mint)}
.verdict.no{border-left-color:var(--ember)}
.verdict-h{font-family:var(--disp);font-weight:700;margin-bottom:8px;font-size:clamp(13px,2.2vw,15px)}
.verdict.ok .verdict-h{color:var(--mint)}
.verdict.no .verdict-h{color:var(--ember)}
.verdict p{color:#CBD9EC;margin-bottom:8px}
.verdict p:last-child{margin-bottom:0}
.verdict .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--azure);display:block;margin:10px 0 5px}
.verdict .ww{color:var(--muted);font-size:clamp(12px,1.9vw,13px)}
.retry{margin-top:12px;font-family:var(--mono);font-size:11px;color:var(--dim);
  border:1px solid var(--line);border-radius:5px;padding:7px 11px;min-height:44px}
.retry:hover{color:var(--paper);border-color:var(--dim)}

/* ---------- stats ---------- */
.statbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;
  padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.statbar .s{font-family:var(--mono);font-size:clamp(10.5px,1.9vw,12px);color:var(--muted)}
.statbar .s b{color:var(--paper)}
.statbar .s.ok b{color:var(--mint)}
.statbar .s.no b{color:var(--ember)}
.statbar .sp{flex:1}
.reset{font-family:var(--mono);font-size:10.5px;color:var(--dim);border:1px solid var(--line);
  border-radius:5px;padding:6px 10px;min-height:44px}
.reset:hover{color:var(--ember);border-color:rgba(226,86,74,.4)}

.placeholder{padding:clamp(24px,4vw,44px) clamp(16px,2vw,20px);text-align:center;color:var(--dim);
  font-size:clamp(13px,2vw,14px);border:1px dashed var(--line);border-radius:8px}
</style>
</head>
<body>

<div class="bar">
  <div class="bar-in">
    <div class="brand">Java <span>LTS</span></div>
    <div class="bar-sp"></div>
    <div class="counter" id="counter"></div>
  </div>
  <div class="track"><i id="progress-fill"></i></div>
</div>

<div class="wrap">
  <div class="hero">
    <div class="eyebrow">📚 Ôn Luyện Kiến Thức</div>
    <h1>Java Core <em>LTS</em> Mastery</h1>
    <p class="lede">Nắm vững <b>kiến thức nền tảng Java</b> qua <b>4 phiên bản LTS</b>: Java 8, 11, 17 và 21. Kết hợp <b>hướng dẫn chuyên sâu</b> và <b>bài tập cấp độ phỏng vấn</b> — mỗi câu đều có giải thích cơ chế và bẫy thường gặp.</p>
  </div>

  <div class="sec">
    <div class="sec-h">Lọc theo phiên bản</div>
    <div class="chips" id="version-chips"></div>
  </div>

  <div class="tabs">
    <div class="tab active" id="tab-tutorials" onclick="switchMode('tutorials')">📚 Hướng Dẫn</div>
    <div class="tab" id="tab-drills" onclick="switchMode('drills')">⚡ Bài Tập</div>
  </div>

  <div id="tutorials-mode">
    <div class="sidebar">
      <div class="sidebar-menu" id="topics-menu"></div>
      <div class="content" id="tutorials-content"></div>
    </div>
  </div>

  <div id="drills-mode" style="display:none">
    <div class="sidebar">
      <div class="sidebar-menu" id="filters-menu"></div>
      <div class="content" id="drills-content"></div>
    </div>
  </div>
</div>

<script>
const TOPICS = [{"id":1,"name":"Java Cơ Bản","desc":"Biến, toán tử, luồng điều khiển, phạm vi biến"},{"id":2,"name":"Lập Trình Hướng Đối Tượng","desc":"Class, kế thừa, interface, đa hình"},{"id":3,"name":"Collections","desc":"List, Set, Map, iterator"},{"id":4,"name":"Xử Lý Chuỗi","desc":"String, StringBuilder, String Pool"},{"id":5,"name":"Generics","desc":"Type parameter, wildcard, type erasure"},{"id":6,"name":"Exception Handling","desc":"Try-catch, try-with-resources"},{"id":7,"name":"Bộ Nhớ & GC","desc":"Heap, stack, garbage collection"},{"id":8,"name":"Lambdas","desc":"Functional interface, method reference"},{"id":9,"name":"Streams API","desc":"Map, filter, reduce, collector"},{"id":10,"name":"Optional","desc":"Xử lý null hiệu quả"},{"id":11,"name":"Modules","desc":"Java Platform Module System (Java 9+)"},{"id":12,"name":"HTTP Client","desc":"java.net.http (Java 11+)"},{"id":13,"name":"Type Inference","desc":"Từ khóa var (Java 10+)"},{"id":14,"name":"Records","desc":"Immutable data class (Java 16/17+)"},{"id":15,"name":"Sealed Classes","desc":"Hạn chế kế thừa (Java 17+)"},{"id":16,"name":"Pattern Matching","desc":"instanceof, switch, record pattern"},{"id":17,"name":"Virtual Threads","desc":"Lightweight threading (Java 21+)"},{"id":18,"name":"Concurrency","desc":"Thread, lock, executor, JMM"},{"id":19,"name":"Design Patterns","desc":"Các pattern thông dụng"},{"id":20,"name":"Best Practices","desc":"Performance, testing, architecture"}];
const TUTORIALS = [{"id":"t-1-1","topicId":1,"versions":[8,11,17,21],"title":"Tràn số nguyên, numeric promotion và phép chia nguyên","summary":"Vì sao một phép nhân trông vô hại lại cho ra số âm, và Java định nghĩa hành vi tràn số như thế nào.","sections":["<b>Kiểu nguyên thuỷ có kích thước cố định và tràn số là hành vi được định nghĩa.</b> <code>int</code> là 32 bit bù hai, phạm vi từ -2^31 tới 2^31-1; <code>long</code> là 64 bit. Khi kết quả vượt phạm vi, Java <i>không</i> ném exception mà lấy modulo 2^32 (hoặc 2^64) rồi diễn giải lại theo bù hai — tức là quấn vòng (wrap-around). Đây là hành vi có trong đặc tả, hoàn toàn xác định, không phụ thuộc JVM hay nền tảng, nên <code>Integer.MAX_VALUE + 1</code> luôn bằng <code>Integer.MIN_VALUE</code>.","<b>Bẫy kinh điển: biểu thức được tính bằng int rồi mới gán vào long.</b> Dòng <code>long ms = 1000 * 60 * 60 * 24 * 30;</code> cho ra -1702967296 chứ không phải 2592000000. Lý do là kiểu của một biểu thức do <i>các toán hạng</i> quyết định chứ không phải do kiểu của biến đích; cả năm số đều là literal <code>int</code> nên phép nhân diễn ra hoàn toàn trong 32 bit, tràn ngay tại đó, và việc mở rộng lên <code>long</code> chỉ xảy ra <i>sau khi</i> đã mất bit. Sửa bằng cách để một toán hạng là <code>long</code>: <code>1000L * 60 * 60 * 24 * 30</code>.","<b>Numeric promotion nâng mọi thứ nhỏ hơn int lên int.</b> <code>byte</code>, <code>short</code>, <code>char</code> đều được nâng lên <code>int</code> trước khi tính, nên <code>byte a = 1, b = 2; byte c = a + b;</code> không biên dịch được — vế phải có kiểu <code>int</code>. Nhưng toán tử gán rút gọn (<code>+=</code>, <code>-=</code>, <code>*=</code>) mang sẵn một phép ép kiểu ngầm về kiểu của vế trái, nên <code>b += 300;</code> lại biên dịch trót lọt và âm thầm cắt bit. Đây là chỗ nhiều người bất ngờ vì hai dạng viết tưởng là tương đương.","<b>Phép chia số nguyên cắt về phía 0, không phải làm tròn xuống.</b> <code>-7 / 2</code> bằng -3 chứ không phải -4, và <code>-7 % 2</code> bằng -1 — phần dư trong Java mang dấu của số bị chia. <code>Math.floorDiv</code> và <code>Math.floorMod</code> (có từ Java 8) mới là phiên bản làm tròn xuống, cho -4 và 1. Chi tiết này quan trọng thật sự khi băm: <code>hash % numShards</code> có thể ra số âm và làm vỡ chỉ số mảng, còn <code>Math.floorMod(hash, numShards)</code> thì luôn không âm khi số chia dương.","<b>Phát hiện tràn thay vì cầu may.</b> Từ Java 8, <code>Math.addExact</code>, <code>Math.multiplyExact</code>, <code>Math.subtractExact</code>, <code>Math.toIntExact</code> ném <code>ArithmeticException</code> khi kết quả không biểu diễn được. Với code tài chính, đếm số lượng, hay tính offset, đây nên là mặc định: một exception ồn ào tốt hơn nhiều so với một số âm lặng lẽ chảy vào cơ sở dữ liệu.","<b>Chia cho 0 hành xử khác nhau giữa số nguyên và số thực.</b> <code>1 / 0</code> ném <code>ArithmeticException</code>, còn <code>1.0 / 0</code> trả về <code>Double.POSITIVE_INFINITY</code> và <code>0.0 / 0.0</code> trả về <code>NaN</code> mà không ném gì cả. Nghĩa là một lỗi chia 0 trong tính toán <code>double</code> có thể lan truyền im lặng qua nhiều tầng rồi mới lộ ra ở một chỗ hoàn toàn khác."],"example":"long wrong = 1000 * 60 * 60 * 24 * 30;   // -1702967296\nlong right = 1000L * 60 * 60 * 24 * 30;  // 2592000000\n\nSystem.out.println(Integer.MAX_VALUE + 1); // -2147483648\nSystem.out.println(Math.addExact(Integer.MAX_VALUE, 1)); // ArithmeticException\n\nSystem.out.println(-7 / 2);                 // -3\nSystem.out.println(-7 % 2);                 // -1\nSystem.out.println(Math.floorDiv(-7, 2));   // -4\nSystem.out.println(Math.floorMod(-7, 2));   // 1\n\nbyte b = 10;\n// b = b + 300;  // không biên dịch được\nb += 300;        // biên dịch được: (byte)(10 + 300) = 54\nSystem.out.println(b);","exampleTitle":"Tràn số, chia nguyên và ép kiểu ngầm","keyPoints":["Kiểu của biểu thức do toán hạng quyết định, không phải do kiểu của biến được gán vào.","Tràn số int/long là quấn vòng theo modulo, được đặc tả rõ, không ném exception.","byte/short/char luôn được nâng lên int trước khi tính toán.","Toán tử += mang một phép ép kiểu ngầm, nên nó không tương đương với a = a + b.","Phép chia nguyên cắt về 0; dùng Math.floorDiv/floorMod khi cần làm tròn xuống và phần dư không âm."],"trap":"Người phỏng vấn đưa một biểu thức nhân toàn literal int gán vào biến long rồi hỏi kết quả. Trả lời 2592000000 là sai; phép nhân đã tràn trong 32 bit trước khi được mở rộng thành long.","followUp":["Làm sao viết hàm cộng hai int mà phát hiện được tràn nếu không có Math.addExact?","Vì sao Math.abs(Integer.MIN_VALUE) lại trả về chính Integer.MIN_VALUE?","Khi băm rồi lấy phần dư để chọn shard, vì sao nên dùng Math.floorMod thay vì toán tử %?"]},{"id":"t-1-2","topicId":1,"versions":[8,11,17,21],"title":"Autoboxing, Integer cache và bẫy == với wrapper","summary":"Vì sao 127 == 127 cho true nhưng 128 == 128 cho false, và vì sao unboxing là nguồn NullPointerException phổ biến nhất.","sections":["<b>Autoboxing chỉ là đường cú pháp do compiler sinh ra.</b> <code>Integer i = 5;</code> được biên dịch thành <code>Integer.valueOf(5)</code>, còn <code>int n = i;</code> thành <code>i.intValue()</code>. Hiểu điều này là chìa khoá cho mọi câu hỏi vặn về wrapper: mọi hành vi lạ đều truy về hai lời gọi đó chứ không có phép màu nào ở tầng JVM.","<b>Integer cache khiến == cho kết quả không nhất quán.</b> <code>Integer.valueOf</code> trả về object dùng lại từ một mảng đúc sẵn cho các giá trị -128..127, nên hai <code>Integer</code> cùng bằng 127 là <i>cùng một object</i> và <code>==</code> cho <code>true</code>; với 128 thì mỗi lần tạo một object mới nên <code>==</code> cho <code>false</code>. <code>Byte</code>, <code>Short</code>, <code>Long</code> cũng cache -128..127, <code>Character</code> cache 0..127, còn <code>Boolean</code> luôn dùng hai instance có sẵn. Cận trên của cache Integer có thể chỉnh bằng cờ JVM <code>-XX:AutoBoxCacheMax</code>, nên đây còn là hành vi phụ thuộc cấu hình — thêm một lý do để không bao giờ dựa vào nó.","<b>Quy tắc rút ra: == trên wrapper là so sánh tham chiếu.</b> Luôn dùng <code>equals()</code> hoặc so sánh trên kiểu nguyên thuỷ (<code>a.intValue() == b.intValue()</code>). Điều đáng sợ của lỗi này là nó vượt qua mọi test dùng số nhỏ và chỉ vỡ khi dữ liệu thật lớn hơn 127 — một dạng lỗi rất khó truy khi đã lên production.","<b>Unboxing một giá trị null ném NullPointerException.</b> <code>int n = map.get(\"missing\");</code> ném NPE ngay tại chỗ vì <code>get</code> trả về <code>null</code> rồi compiler chèn <code>.intValue()</code> vào. Stack trace chỉ vào dòng gán chứ không nói gì về map, nên người mới thường tìm sai chỗ. Cách phòng: <code>map.getOrDefault(key, 0)</code>, hoặc giữ kiểu <code>Integer</code> và kiểm tra null tường minh.","<b>Toán tử ba ngôi trộn wrapper với primitive là một bẫy tinh vi.</b> Trong <code>Integer x = null; Object o = flag ? x : 0;</code>, vì một nhánh là <code>int</code> nên toàn bộ biểu thức được đưa về kiểu số và <code>x</code> bị unbox — NPE xảy ra ngay cả khi bạn chỉ định gán vào <code>Object</code>. Muốn tránh thì cả hai nhánh phải cùng là kiểu tham chiếu, ví dụ viết <code>Integer.valueOf(0)</code> thay cho <code>0</code>.","<b>Đánh đổi hiệu năng: boxing tạo rác.</b> <code>Long sum = 0L; for (long i = 0; i &lt; n; i++) sum += i;</code> sinh ra n object <code>Long</code> vì mỗi lần <code>+=</code> là unbox, cộng, rồi box lại. Với vòng lặp lớn, chênh lệch so với dùng <code>long</code> có thể tới hàng chục lần do áp lực cấp phát và GC. Trong code nóng nên dùng kiểu nguyên thuỷ, mảng nguyên thuỷ, hoặc <code>IntStream</code>/<code>LongStream</code> thay vì <code>Stream&lt;Integer&gt;</code>."],"example":"Integer a = 127, b = 127;\nInteger c = 128, d = 128;\nSystem.out.println(a == b);       // true  - lấy từ cache\nSystem.out.println(c == d);       // false - hai object khác nhau\nSystem.out.println(c.equals(d));  // true  - so sánh giá trị\n\nMap<String, Integer> counts = new HashMap<>();\n// int n = counts.get(\"missing\"); // NullPointerException khi unbox null\nint n = counts.getOrDefault(\"missing\", 0); // an toàn\n\nInteger x = null;\nboolean flag = true;\n// Object o = flag ? x : 0;      // NPE: nhánh int ép unbox x","exampleTitle":"Cache, so sánh và unboxing null","keyPoints":["Autoboxing = Integer.valueOf(), unboxing = intValue(); mọi hành vi lạ đều giải thích được từ đó.","Cache -128..127 (Character 0..127) khiến == cho kết quả khác nhau tuỳ giá trị.","Luôn dùng equals() cho wrapper; == chỉ đúng khi bạn thật sự muốn so sánh tham chiếu.","map.get() trả null rồi bị unbox là nguyên nhân NPE rất hay gặp; dùng getOrDefault.","Boxing trong vòng lặp nóng tạo rác lớn — ưu tiên primitive và IntStream/LongStream."],"trap":"Câu hỏi vặn quen thuộc là in ra kết quả của (a == b) với 127 và với 128 rồi hỏi vì sao khác nhau. Nói 'vì Java so sánh giá trị' là sai hoàn toàn; phải nói được rằng == so sánh tham chiếu và Integer.valueOf dùng lại object trong khoảng cache.","followUp":["Nếu đặt -XX:AutoBoxCacheMax=1000 thì kết quả của Integer c = 128, d = 128; c == d thay đổi thế nào?","Long a = 128L; long b = 128L; a == b cho kết quả gì và vì sao lại khác trường hợp hai Long?","Vì sao Stream<Integer> thường chậm hơn IntStream trong các phép rút gọn số học?"]},{"id":"t-1-3","topicId":1,"versions":[8,11,17,21],"title":"double, IEEE 754 và vì sao tiền tệ không được dùng số thực","summary":"Cơ chế đứng sau kết quả 0.1 + 0.2 = 0.30000000000000004 và cách chọn giữa BigDecimal với số nguyên đơn vị nhỏ nhất.","sections":["<b>float và double lưu số theo cơ số 2, nên phần lớn số thập phân không biểu diễn được chính xác.</b> Giống như 1/3 không viết hết được trong hệ thập phân, 0.1 không viết hết được trong hệ nhị phân; giá trị lưu thực tế là một xấp xỉ gần nhất trong 53 bit định trị của <code>double</code>. Vì thế <code>0.1 + 0.2</code> in ra 0.30000000000000004 và <code>0.1 + 0.2 == 0.3</code> cho <code>false</code>. Đây không phải lỗi của Java mà là chuẩn IEEE 754, đúng như vậy ở mọi ngôn ngữ.","<b>So sánh số thực bằng == gần như luôn sai.</b> Cách đúng là so sánh sai số: <code>Math.abs(a - b) &lt; epsilon</code>, với epsilon chọn theo miền giá trị. Ngoài ra <code>NaN</code> không bằng chính nó (<code>Double.NaN == Double.NaN</code> là <code>false</code>) trong khi <code>Double.valueOf(Double.NaN).equals(...)</code> lại là <code>true</code>; và <code>-0.0 == 0.0</code> là <code>true</code> nhưng <code>Double.valueOf(-0.0).equals(Double.valueOf(0.0))</code> là <code>false</code>. Sự lệch pha giữa <code>==</code> và <code>equals</code>/<code>compare</code> này ảnh hưởng trực tiếp tới việc sắp xếp và tới key của <code>HashMap</code>/<code>TreeMap</code>.","<b>Sai số tích luỹ mới là vấn đề thật của hệ thống tài chính.</b> Một phép cộng lệch 10^-17 thì vô hại, nhưng cộng dồn hàng triệu dòng giao dịch và nhân với tỉ giá thì sai lệch nổi lên tới mức người dùng nhìn thấy, và quan trọng hơn là báo cáo không khớp giữa hai lần tính theo thứ tự khác nhau — phép cộng <code>double</code> không có tính kết hợp.","<b>BigDecimal đúng nhưng phải dùng đúng constructor.</b> <code>new BigDecimal(0.1)</code> nhận vào một <code>double</code> đã sai sẵn nên giữ nguyên sai số nhị phân dài dằng dặc; phải dùng <code>new BigDecimal(\"0.1\")</code> hoặc <code>BigDecimal.valueOf(0.1)</code> (bản này đi qua <code>Double.toString</code> nên cho đúng 0.1). Ngoài ra <code>equals</code> của <code>BigDecimal</code> so cả <i>scale</i> nên <code>2.0</code> không <code>equals</code> <code>2.00</code>; muốn so giá trị phải dùng <code>compareTo(...) == 0</code>. Đây là hai câu hỏi vặn rất hay gặp.","<b>Phép chia của BigDecimal có thể ném exception.</b> <code>a.divide(b)</code> khi kết quả là số thập phân vô hạn tuần hoàn (ví dụ 1 chia 3) sẽ ném <code>ArithmeticException</code>; bắt buộc phải truyền scale và <code>RoundingMode</code>. Quy tắc thực hành là luôn nêu rõ chính sách làm tròn ở mọi phép chia tiền tệ, vì đó là quyết định nghiệp vụ chứ không phải chi tiết kỹ thuật.","<b>Đánh đổi: BigDecimal chính xác nhưng đắt.</b> Mỗi phép toán tạo object bất biến mới và chạy trên mảng số nguyên nên chậm hơn <code>double</code> nhiều lần và tạo áp lực GC. Vì thế nhiều hệ thống giao dịch tần suất cao lưu tiền bằng <code>long</code> theo đơn vị nhỏ nhất (xu, hoặc đồng) và chỉ đổi sang <code>BigDecimal</code> ở biên hiển thị. Cách này nhanh và chính xác tuyệt đối với cộng trừ, đổi lại phải tự quản lý scale và cẩn thận với tràn số."],"example":"System.out.println(0.1 + 0.2);            // 0.30000000000000004\nSystem.out.println(0.1 + 0.2 == 0.3);    // false\n\nSystem.out.println(new BigDecimal(0.1));        // 0.1000000000000000055511151231257827...\nSystem.out.println(new BigDecimal(\"0.1\"));      // 0.1\nSystem.out.println(BigDecimal.valueOf(0.1));    // 0.1\n\nBigDecimal a = new BigDecimal(\"2.0\");\nBigDecimal b = new BigDecimal(\"2.00\");\nSystem.out.println(a.equals(b));          // false - khác scale\nSystem.out.println(a.compareTo(b) == 0);  // true  - bằng giá trị\n\n// BigDecimal.ONE.divide(new BigDecimal(\"3\")); // ArithmeticException\nSystem.out.println(BigDecimal.ONE.divide(new BigDecimal(\"3\"), 4, RoundingMode.HALF_UP)); // 0.3333","exampleTitle":"Sai số nhị phân và cách dùng BigDecimal cho đúng","keyPoints":["double theo IEEE 754 là xấp xỉ nhị phân; đa số số thập phân không biểu diễn chính xác được.","Không so sánh double bằng ==; NaN và -0.0 còn khiến ==, equals và compare cho ba kết quả khác nhau.","new BigDecimal(double) giữ nguyên sai số — dùng chuỗi hoặc BigDecimal.valueOf.","BigDecimal.equals so cả scale; muốn so giá trị phải dùng compareTo() == 0.","divide không có RoundingMode có thể ném ArithmeticException khi kết quả vô hạn tuần hoàn.","Đánh đổi hiệu năng: long theo đơn vị nhỏ nhất nhanh hơn BigDecimal nhiều, đổi lại tự quản lý scale."],"trap":"Nhiều người trả lời 'dùng BigDecimal là xong' rồi lại viết new BigDecimal(0.1) — vẫn sai y hệt vì sai số đã nằm sẵn trong literal double trước khi BigDecimal nhận được nó.","followUp":["Vì sao phép cộng double không có tính kết hợp, và điều đó ảnh hưởng gì tới tổng hợp song song bằng Stream?","Khi nào bạn chọn long theo đơn vị xu thay vì BigDecimal, và rủi ro của lựa chọn đó là gì?","float và double khác nhau ở bao nhiêu chữ số thập phân đáng tin, và vì sao hầu như không nên dùng float?"]},{"id":"t-1-4","topicId":1,"versions":[8,11,17,21],"title":"Toán tử: thứ tự đánh giá, tăng giảm và short-circuit","summary":"Java định nghĩa chặt thứ tự đánh giá, nên các biểu thức như x++ + ++x có kết quả xác định — và điều đó biến chúng thành câu hỏi phỏng vấn.","sections":["<b>Java đánh giá toán hạng từ trái sang phải, luôn luôn.</b> Khác với C/C++ nơi thứ tự này là undefined behavior, đặc tả Java quy định toán hạng trái được đánh giá hoàn toàn (kể cả hiệu ứng phụ) trước toán hạng phải. Nhờ vậy <code>x++ + ++x</code> có một kết quả duy nhất, giống nhau trên mọi JVM. Với <code>x = 5</code>: <code>x++</code> trả về 5 và đẩy x lên 6, rồi <code>++x</code> đẩy x lên 7 và trả về 7, nên tổng là 12 và x còn lại 7.","<b>Hệ quả của quy tắc đó: i = i++ không tăng gì cả.</b> Vế phải được đánh giá trước, cho ra giá trị cũ; sau đó biến được tăng; rồi phép gán ghi đè giá trị cũ trở lại. Kết quả là <code>i</code> giữ nguyên. Đây là ví dụ điển hình cho việc hiểu 'gán xảy ra sau cùng' quan trọng thế nào.","<b>&amp;&amp; và || cắt ngắn, còn &amp; và | thì không.</b> Trên toán hạng <code>boolean</code>, <code>&amp;</code> và <code>|</code> vẫn là toán tử logic hợp lệ nhưng luôn đánh giá cả hai vế. Vì thế <code>if (arr != null &amp; arr.length &gt; 0)</code> ném <code>NullPointerException</code> khi <code>arr</code> null, trong khi <code>&amp;&amp;</code> thì an toàn. Lỗi gõ thiếu một ký tự này rất khó nhìn thấy khi đọc lướt code.","<b>Nhưng short-circuit không phải lúc nào cũng là thứ ta muốn.</b> Nếu vế phải có hiệu ứng phụ cần thiết — ví dụ ghi log hoặc thu thập toàn bộ lỗi validate — thì <code>&amp;&amp;</code> sẽ bỏ qua nó. Trong trường hợp đó nên tách thành hai câu lệnh tường minh thay vì dựa vào <code>&amp;</code>, để người đọc sau không tưởng là gõ nhầm.","<b>Toán tử + với String phụ thuộc thứ tự.</b> <code>1 + 2 + \"a\"</code> cho <code>\"3a\"</code> vì hai số cộng trước; còn <code>\"a\" + 1 + 2</code> cho <code>\"a12\"</code> vì phép đầu đã biến kết quả thành String. Cùng các toán hạng, hai kết quả khác nhau — chỉ do tính kết hợp trái sang phải.","<b>Toán tử dịch bit lấy modulo số bit.</b> Với <code>int</code>, khoảng dịch được lấy 5 bit thấp (tức modulo 32), nên <code>1 &lt;&lt; 32</code> bằng 1 chứ không phải 0; với <code>long</code> là modulo 64. Ngoài ra <code>&gt;&gt;</code> giữ dấu còn <code>&gt;&gt;&gt;</code> chèn 0 vào bit cao — dùng <code>&gt;&gt;</code> cho số âm khi tính chỉ số băm sẽ cho kết quả âm, đó là lý do <code>HashMap</code> trong JDK dùng phép dịch không dấu khi trộn hash."],"example":"int x = 5;\nint y = x++ + ++x;\nSystem.out.println(x + \" \" + y);   // 7 12\n\nint i = 0;\ni = i++;\nSystem.out.println(i);             // 0\n\nint[] arr = null;\n// if (arr != null & arr.length > 0) {}  // NullPointerException\nif (arr != null && arr.length > 0) {}    // an toàn\n\nSystem.out.println(1 + 2 + \"a\");   // 3a\nSystem.out.println(\"a\" + 1 + 2);   // a12\nSystem.out.println(1 << 32);       // 1  (khoảng dịch lấy modulo 32)\nSystem.out.println(-8 >> 1);       // -4\nSystem.out.println(-8 >>> 1);      // 2147483644","exampleTitle":"Thứ tự đánh giá và các toán tử hay bị hiểu nhầm","keyPoints":["Java đánh giá toán hạng trái trước toán hạng phải, nên x++ + ++x có kết quả xác định.","Phép gán xảy ra sau cùng, vì thế i = i++ không làm i thay đổi.","& và | trên boolean là logic nhưng KHÔNG cắt ngắn — nguồn NPE khi kiểm tra null.","Phép + với String phụ thuộc thứ tự vì kết hợp từ trái sang phải.","Khoảng dịch bit lấy modulo 32 với int và modulo 64 với long; >> giữ dấu, >>> thì không."],"trap":"Người phỏng vấn viết if (obj != null & obj.getX() > 0) và hỏi code có an toàn không. Nhiều ứng viên đọc lướt thành && rồi khẳng định an toàn; thực tế nó ném NPE vì cả hai vế đều được đánh giá.","followUp":["Trong Java thứ tự đánh giá toán hạng có được đảm bảo không, và điều đó khác C++ ra sao?","Vì sao HashMap dùng >>> khi trộn hash chứ không dùng >>?","Biểu thức nào cho thấy rõ nhất sự khác nhau giữa && và &, ngoài trường hợp kiểm tra null?"]},{"id":"t-1-5","topicId":1,"versions":[8,11,17,21],"title":"Phạm vi biến, giá trị mặc định, shadowing và luồng điều khiển","summary":"Vì sao field tự có giá trị mặc định còn biến local thì không, và những chỗ luồng điều khiển của Java hay đánh lừa người đọc.","sections":["<b>Biến local không có giá trị mặc định, field thì có.</b> Field và phần tử mảng nằm trong vùng nhớ được JVM xoá sạch khi cấp phát nên tự nhận 0, <code>0.0</code>, <code>false</code>, <code>'\\u0000'</code> hoặc <code>null</code>. Biến local nằm trên stack frame, nơi không được xoá, nên compiler áp dụng quy tắc <i>definite assignment</i>: nếu tồn tại một đường đi tới điểm sử dụng mà biến chưa chắc chắn được gán thì code không biên dịch được. Đây là an toàn ở tầng compiler chứ không phải ở tầng runtime.","<b>Mảng object mặc định toàn null, và đó là bẫy thật.</b> <code>new int[3]</code> cho ba số 0, nhưng <code>new String[3]</code> cho ba <code>null</code> — duyệt mảng rồi gọi method trên phần tử sẽ ném NPE dù mảng đã 'được khởi tạo'. Tương tự, mảng hai chiều <code>new int[3][]</code> chỉ tạo hàng ngoài, các hàng con vẫn là null cho tới khi bạn tự cấp phát.","<b>Shadowing: tên gần nhất thắng.</b> Khi tham số method trùng tên field, mọi tham chiếu trần trong method trỏ tới tham số, nên <code>name = name;</code> trong setter là một câu lệnh vô nghĩa và field không bao giờ được gán — phải viết <code>this.name = name</code>. Biến khai báo trong một block cũng che biến cùng tên ở block ngoài, và biến vòng lặp chỉ sống trong vòng lặp.","<b>Lambda không tạo phạm vi tên mới, anonymous class thì có.</b> Trong lambda bạn <i>không</i> được khai báo tham số hay biến trùng tên với biến local bao ngoài — compiler báo lỗi; còn anonymous class thì được phép che tên đó. Sự khác biệt này là chủ đích: lambda được thiết kế 'trong suốt' về mặt phạm vi, để đọc lambda giống như đọc code xung quanh nó.","<b>Biến local dùng trong lambda hoặc inner class phải là effectively final.</b> Vì stack frame có thể đã biến mất khi lambda chạy, giá trị biến được <i>sao chép</i> vào đối tượng đại diện cho lambda. Nếu cho phép biến đổi sau đó, hai bên sẽ nhìn thấy hai giá trị khác nhau và không có ngữ nghĩa nào hợp lý. Từ Java 8, không cần viết <code>final</code> nữa nhưng biến vẫn phải không bị gán lại; muốn chia sẻ trạng thái thay đổi được thì dùng field, mảng một phần tử, hoặc <code>AtomicInteger</code>.","<b>Luồng điều khiển: fall-through và các dạng switch qua từng phiên bản.</b> <code>switch</code> dạng cũ với dấu hai chấm sẽ chạy tràn xuống nhánh sau nếu thiếu <code>break</code> — nguồn lỗi kinh điển. <code>switch</code> nhận <code>String</code> từ Java 7. Biểu thức <code>switch</code> với mũi tên và <code>yield</code> trở thành tính năng chuẩn từ Java 14, nên có sẵn ở Java 17 và 21; dạng mũi tên không tràn nhánh và có thể trả về giá trị. Pattern matching cho <code>switch</code> là tính năng chuẩn từ Java 21. Ngoài ra, sửa một collection trong khi duyệt bằng vòng for-each sẽ ném <code>ConcurrentModificationException</code>; muốn xoá phần tử phải dùng <code>Iterator.remove()</code> hoặc <code>removeIf</code>."],"example":"class Config {\n    private String name;      // field: mặc định null\n    private int retries;      // field: mặc định 0\n\n    void setName(String name) {\n        name = name;          // shadowing: field không hề thay đổi\n        this.name = name;     // đúng\n    }\n\n    void demo() {\n        int local;\n        // System.out.println(local); // lỗi biên dịch: chưa chắc được gán\n        local = 1;\n        System.out.println(local);\n\n        String[] names = new String[3];\n        // System.out.println(names[0].length()); // NPE: phần tử là null\n\n        int total = 0;\n        List<Integer> nums = List.of(1, 2, 3);\n        // nums.forEach(n -> total += n); // lỗi: total không effectively final\n        int[] box = {0};\n        nums.forEach(n -> box[0] += n);\n        System.out.println(box[0]);\n    }\n}","exampleTitle":"Mặc định, shadowing và effectively final","keyPoints":["Field và phần tử mảng có giá trị mặc định; biến local thì không, compiler ép phải gán trước khi dùng.","Mảng kiểu tham chiếu mặc định toàn null — 'đã khởi tạo mảng' không có nghĩa là đã có object.","Tham số trùng tên field che field; thiếu this. là lỗi im lặng vì code vẫn biên dịch.","Lambda không cho che tên biến local bao ngoài, anonymous class thì cho.","Biến local bị lambda bắt phải effectively final vì giá trị được sao chép chứ không tham chiếu.","switch dạng mũi tên (chuẩn từ Java 14, có ở 17 và 21) không tràn nhánh và dùng được như biểu thức."],"trap":"Hỏi 'vì sao lambda bắt buộc biến phải effectively final?' — trả lời 'vì quy định của Java' là chưa đủ. Điểm mấu chốt là biến local nằm trên stack và được capture theo giá trị, nên nếu cho gán lại thì hai bên sẽ thấy hai giá trị khác nhau.","followUp":["Vì sao capture một field của object thì không cần effectively final còn biến local thì cần?","Cách nào xoá phần tử khi đang duyệt collection mà không bị ConcurrentModificationException?","switch dạng mũi tên khác switch dạng hai chấm ở những điểm nào ngoài chuyện fall-through?"]},{"id":"t-2-1","topicId":2,"versions":[8,11,17,21],"title":"Kế thừa, diamond problem và xung đột default method","summary":"Vì sao Java cấm đa kế thừa class nhưng cho đa kế thừa interface, và Java 8 đã làm vấn đề quay lại như thế nào.","sections":["<b>Một class cha, nhiều interface — đó là lựa chọn thiết kế.</b> Java dùng <code>extends</code> cho class và <code>implements</code> cho interface; một class chỉ <code>extends</code> được đúng một class nhưng <code>implements</code> bao nhiêu interface cũng được. Đây không phải hạn chế kỹ thuật của JVM mà là quyết định có chủ đích nhằm loại bỏ một lớp lỗi ngay từ ngữ pháp.","<b>Diamond problem.</b> Nếu D kế thừa cả B và C, mà B và C cùng kế thừa A và cùng override một method, thì khi gọi method đó trên D không có quy tắc tự nhiên nào để chọn giữa bản của B và bản của C. Nghiêm trọng hơn là vấn đề <i>state</i>: nếu A có field, D sẽ chứa một hay hai bản sao của field đó? C++ phải đẻ ra cơ chế virtual inheritance chỉ để trả lời câu hỏi này; Java chọn cách chặn từ gốc.","<b>Vì sao nhiều interface lại an toàn.</b> Trước Java 8, interface không có field instance và không có thân method, nên kế thừa nhiều interface chỉ là gộp các chữ ký lại; không có state để nhân đôi và không có hai bản cài đặt để chọn — implementation duy nhất luôn nằm ở class. Nói cách khác Java cho đa kế thừa <i>kiểu</i> chứ không cho đa kế thừa <i>cài đặt</i> hay <i>state</i>.","<b>Java 8 mang xung đột hành vi quay lại qua default method.</b> Khi hai interface cùng cung cấp một <code>default</code> method có cùng chữ ký, compiler báo lỗi 'inherits unrelated defaults' và buộc class phải override để chọn rõ ràng; bên trong bản override có thể ủy quyền bằng cú pháp <code>Flyer.super.move()</code>. Điểm quan trọng cần nói được khi phỏng vấn: Java 8 đã có đa kế thừa <i>hành vi</i>, nhưng vẫn không có đa kế thừa <i>state</i>.","<b>Hai quy tắc ưu tiên cần nhớ.</b> Thứ nhất, method kế thừa từ superclass luôn thắng default method của interface — thường gọi là quy tắc 'class wins'. Thứ hai, giữa các interface thì interface cụ thể hơn thắng: nếu <code>B extends A</code> và cả hai đều có default cùng chữ ký thì bản của B được chọn, không có xung đột. Chỉ khi hai bản không có quan hệ kế thừa với nhau thì compiler mới bắt bạn quyết định.","<b>Default method sinh ra để tiến hoá API, không phải để thay abstract class.</b> Khi Java 8 muốn thêm <code>stream()</code> vào <code>Collection</code>, nếu đó là abstract method thì mọi implementation trên thế giới sẽ không biên dịch được nữa. <code>default</code> giải quyết đúng bài toán tương thích ngược đó. Interface vẫn không có state, không có constructor, và không kiểm soát được vòng đời object — những điều abstract class làm được."],"example":"interface Flyer  { default String move() { return \"bay\"; } }\ninterface Swimmer { default String move() { return \"bơi\"; } }\n\n// class Duck implements Flyer, Swimmer { }\n// -> lỗi biên dịch: inherits unrelated defaults for move()\n\nclass Duck implements Flyer, Swimmer {\n    @Override\n    public String move() {\n        return Flyer.super.move() + \" và \" + Swimmer.super.move();\n    }\n}\n\n// Quy tắc \"class wins\"\ninterface Greeter { default String hello() { return \"từ interface\"; } }\nclass Base { public String hello() { return \"từ class cha\"; } }\nclass Child extends Base implements Greeter { }\n// new Child().hello() -> \"từ class cha\"","exampleTitle":"Xung đột default method và cách giải","keyPoints":["Java cấm đa kế thừa class để tránh diamond problem về cả hành vi lẫn state.","Đa kế thừa interface an toàn vì interface không có field instance.","Từ Java 8, hai default method trùng chữ ký gây lỗi biên dịch, phải override và dùng Interface.super.method().","Quy tắc ưu tiên: class thắng interface; interface con thắng interface cha.","Default method ra đời để tiến hoá API mà không phá code cũ, không phải để thay abstract class."],"trap":"Câu hỏi 'Java 8 có đa kế thừa không?' thường bị trả lời cụt là 'không'. Đáp án chuẩn: có đa kế thừa hành vi qua default method, nhưng vẫn không có đa kế thừa state, và xung đột hành vi bị compiler bắt phải giải quyết tường minh.","followUp":["Nếu một interface có default method còn superclass có method trừu tượng cùng chữ ký thì bản nào được dùng?","Vì sao interface không thể có field instance dù đã có default method?","Interface private method ra đời từ phiên bản nào và giải quyết vấn đề gì?"]},{"id":"t-2-2","topicId":2,"versions":[8,11,17,21],"title":"Overloading quyết định lúc compile, overriding quyết định lúc runtime","summary":"Bẫy kinh điển nhất của OOP trong Java: cùng một lời gọi, hai cơ chế chọn method hoàn toàn khác nhau.","sections":["<b>Overload resolution dùng kiểu khai báo (static type).</b> Compiler nhìn vào kiểu khai báo của biểu thức đối số để chọn method, và ghi cứng chữ ký đã chọn vào bytecode. Nếu có <code>print(Object)</code> và <code>print(String)</code>, thì <code>Object o = \"abc\"; print(o);</code> gọi bản <code>Object</code> dù giá trị thật là String. Trực giác luôn mong đợi điều ngược lại, nên đây là câu hỏi vặn rất phổ biến.","<b>Overriding dùng kiểu thật (runtime type).</b> Với instance method, JVM phát lệnh <code>invokevirtual</code> và tra bảng method ảo của object thật để nhảy tới bản cài đặt đúng. Vì thế <code>Animal a = new Dog(); a.speak();</code> chạy bản của Dog. Nói gọn: <i>chọn method nào</i> là việc của compiler dựa trên kiểu khai báo, còn <i>chạy bản cài đặt nào của method đó</i> là việc của JVM dựa trên kiểu thật.","<b>Ràng buộc của overriding tồn tại để bảo vệ nguyên lý Liskov.</b> Bản override không được thu hẹp access modifier (đang <code>public</code> thì không xuống <code>protected</code> được), không được khai báo checked exception mới hoặc rộng hơn bản cha, và kiểu trả về phải tương thích. Lý do chung là mọi chỗ đang dùng được class cha thì phải dùng được class con mà không cần sửa gì; nếu con thu hẹp quyền truy cập hoặc ném thêm exception thì code gọi sẽ vỡ.","<b>Covariant return type.</b> Từ Java 5, class con được phép trả về kiểu <i>hẹp hơn</i> — cha trả <code>Number</code> thì con trả <code>Integer</code> là hợp lệ. Điều này an toàn vì mọi Integer đều là Number nên caller cũ không bị ảnh hưởng. Ngược lại, hai method chỉ khác nhau ở kiểu trả về thì không tạo được overload hợp lệ, vì tại điểm gọi không phải lúc nào cũng có đủ thông tin để phân biệt.","<b>@Override không chỉ là chú thích trang trí.</b> Nó bắt compiler kiểm tra rằng bạn thực sự đang override chứ không vô tình tạo ra một overload mới. Lỗi hay gặp nhất là viết <code>equals(MyType other)</code> thay vì <code>equals(Object other)</code>: không có <code>@Override</code> thì code vẫn biên dịch, chạy vẫn 'gần đúng', và chỉ vỡ khi đưa object vào <code>HashSet</code> hoặc <code>List.contains</code>.","<b>Đánh đổi hiệu năng của dynamic dispatch.</b> Về lý thuyết mỗi virtual call là một lần tra bảng, nhưng JIT quan sát thực tế tại từng call site: nếu chỉ thấy một kiểu (monomorphic) nó thường inline thẳng bản cài đặt và đặt một phép kiểm tra kiểu rẻ tiền; nếu thấy hai kiểu (bimorphic) vẫn xử lý được; còn khi call site thấy nhiều kiểu (megamorphic) thì việc inline khó hơn nhiều và chi phí gọi lộ ra. Hệ quả thực tế: đa hình gần như miễn phí trong đa số code, nhưng một điểm nóng nhận hàng chục implementation khác nhau thì đáng để đo lại."],"example":"static void print(Object o) { System.out.println(\"Object\"); }\nstatic void print(String s) { System.out.println(\"String\"); }\n\nObject o = \"abc\";\nprint(o);        // Object  <- chọn theo kiểu khai báo\nprint(\"abc\");    // String\n\nclass Animal {\n    protected Number calc() throws java.io.IOException { return 1; }\n    void speak() { System.out.println(\"...\"); }\n}\nclass Dog extends Animal {\n    // hợp lệ: mở rộng access, covariant return, exception hẹp hơn\n    @Override\n    public Integer calc() throws java.io.FileNotFoundException { return 2; }\n\n    @Override\n    void speak() { System.out.println(\"gâu\"); }\n}\n\nAnimal a = new Dog();\na.speak();       // gâu  <- chọn theo kiểu thật","exampleTitle":"Static type chọn method, runtime type chọn cài đặt","keyPoints":["Overloading giải quyết lúc biên dịch theo kiểu khai báo; overriding giải quyết lúc chạy theo kiểu thật.","Bản override được mở rộng access nhưng không được thu hẹp, và không được ném checked exception rộng hơn.","Covariant return hợp lệ; khác nhau chỉ ở kiểu trả về thì không tạo được overload.","@Override giúp compiler bắt lỗi 'tưởng override nhưng thực ra là overload'.","JIT inline được virtual call ở call site monomorphic, nên chi phí đa hình thường không đáng kể."],"trap":"Đưa print(Object) và print(String) rồi gọi print((Object) \"abc\"). Ứng viên hay trả lời 'String' vì giá trị thật là String; đúng phải là 'Object' vì overload chọn theo kiểu khai báo.","followUp":["Vì sao Java không thể chọn overload theo kiểu thật lúc runtime như một số ngôn ngữ có multiple dispatch?","Bản override có được ném unchecked exception mới không, và vì sao quy tắc lại khác với checked exception?","Nếu bỏ @Override khỏi một method viết sai chữ ký thì lỗi sẽ lộ ra ở đâu?"]},{"id":"t-2-3","topicId":2,"versions":[8,11,17,21],"title":"Method hiding và field hiding — những thứ trông như đa hình nhưng không phải","summary":"static method và field không tham gia dynamic dispatch, và điều đó tạo ra những kết quả trái ngược hẳn trực giác.","sections":["<b>static method không override được, chỉ bị che (hiding).</b> Khi class con khai báo một static method trùng chữ ký với cha, hai method tồn tại song song và độc lập; việc chọn dựa hoàn toàn vào kiểu khai báo lúc biên dịch. Với <code>Parent p = new Child(); p.who();</code> kết quả là bản của <b>Parent</b>, dù object thật là Child.","<b>Lý do kỹ thuật nằm ở bytecode.</b> static method được gọi bằng lệnh <code>invokestatic</code>, trong đó tên class đã được ghi cố định lúc biên dịch; nó không có entry trong bảng method ảo nên JVM không có cơ chế nào để tra bản đúng lúc chạy. Instance method dùng <code>invokevirtual</code> (hoặc <code>invokeinterface</code>) và mới có bước tra bảng đó.","<b>Field cũng không đa hình, và đây là bẫy còn nặng hơn.</b> Truy cập field được giải quyết theo kiểu khai báo của tham chiếu. Nếu cả Animal và Dog đều có field <code>name</code>, thì <code>Animal a = new Dog(); a.name</code> đọc field của <b>Animal</b>, trong khi <code>a.describe()</code> chạy method của Dog và method đó lại đọc field <code>name</code> của Dog. Cùng một object nhưng hai đường truy cập cho hai giá trị khác nhau — object thật sự chứa cả hai field, chúng không đè lên nhau.","<b>private method không nằm trong phạm trù override.</b> Class con không nhìn thấy nó nên nếu định nghĩa method cùng tên thì đó là một method hoàn toàn mới. Tương tự, method <code>final</code> cấm override tường minh, và class <code>final</code> thì không có class con nào để nói tới.","<b>Quy tắc thực hành rút ra.</b> Luôn để field ở <code>private</code> và truy cập qua method — như vậy mọi truy cập đều đi qua dynamic dispatch và hành vi trở nên nhất quán. Đừng đặt tên field trùng với field của class cha trừ khi thật sự có lý do; hầu hết trường hợp đó là lỗi chứ không phải thiết kế. Và luôn gọi static method qua tên class (<code>Parent.who()</code>) chứ đừng gọi qua tham chiếu object, vì cách viết sau gợi ý sai về hành vi.","<b>Liên hệ thực tế với framework.</b> Spring dùng proxy (JDK dynamic proxy hoặc CGLIB sinh class con) để cài đặt các tính năng như <code>@Transactional</code>. Vì proxy dựa trên override, mọi method <code>final</code>, <code>private</code> hay <code>static</code> đều không được proxy — annotation đặt lên chúng sẽ im lặng không có tác dụng. Đây là ứng dụng trực tiếp của kiến thức tưởng chừng chỉ là lý thuyết."],"example":"class Parent {\n    static String who() { return \"Parent\"; }\n    String name = \"Parent\";\n    String describe() { return \"tôi là \" + name; }\n}\n\nclass Child extends Parent {\n    static String who() { return \"Child\"; }   // hiding, không phải override\n    String name = \"Child\";                    // field hiding\n    @Override String describe() { return \"tôi là \" + name; }\n}\n\nParent p = new Child();\nSystem.out.println(p.who());        // Parent  <- theo kiểu khai báo\nSystem.out.println(p.name);         // Parent  <- theo kiểu khai báo\nSystem.out.println(p.describe());   // tôi là Child <- dynamic dispatch\nSystem.out.println(((Child) p).name); // Child\n// object thật chứa CẢ HAI field name","exampleTitle":"Ba đường truy cập, ba kết quả khác nhau trên cùng một object","keyPoints":["static method bị hide chứ không bị override; chọn theo kiểu khai báo lúc biên dịch.","invokestatic ghi cứng tên class, invokevirtual mới tra bảng method ảo lúc chạy.","Field truy cập theo kiểu khai báo; object con chứa cả field của cha lẫn của mình.","private method không thể override; final method và final class cấm override tường minh.","Giữ field private và truy cập qua method để mọi hành vi đều nhất quán theo dynamic dispatch.","Proxy của Spring dựa trên override nên @Transactional trên method final/private/static không hoạt động."],"trap":"Cho Animal a = new Dog(); rồi hỏi a.name và a.describe() in ra gì. Trả lời cả hai đều lấy của Dog là sai: field đi theo kiểu khai báo nên a.name là của Animal, còn describe() đi theo kiểu thật nên đọc field của Dog.","followUp":["Vì sao JVM không thể làm field trở nên đa hình như method?","Nếu class con khai báo static method cùng tên nhưng khác kiểu trả về không tương thích thì chuyện gì xảy ra?","Tại sao @Transactional đặt trên một private method lại không có tác dụng trong Spring?"]},{"id":"t-2-4","topicId":2,"versions":[8,11,17,21],"title":"Thứ tự khởi tạo object và bẫy gọi method overridable trong constructor","summary":"Vì sao một field đã được gán giá trị trong khai báo vẫn có thể là null ngay trong chính object đó.","sections":["<b>Khởi tạo class chạy một lần, trước khi có object nào.</b> Khi một class được khởi tạo lần đầu, JVM khởi tạo superclass trước rồi mới chạy các static field initializer và static block của class đó, theo đúng thứ tự xuất hiện trong file. Quá trình này được JVM bảo đảm chỉ chạy đúng một lần và an toàn với đa luồng — đó chính là nền tảng của mẫu holder idiom cho singleton lazy.","<b>Khởi tạo instance có một trật tự cố định.</b> Mỗi lần <code>new</code>: constructor của class con trước hết gọi <code>super(...)</code> (ngầm định nếu bạn không viết), toàn bộ chuỗi khởi tạo của cha chạy xong; rồi tới các instance initializer và field initializer của class con theo thứ tự xuất hiện; cuối cùng mới là thân constructor của class con. Nhớ đúng trật tự này là đủ để giải mọi câu hỏi in ra thứ tự chữ số.","<b>Hệ quả nguy hiểm: constructor của cha chạy trước field của con.</b> Nếu constructor cha gọi một method bị con override, method đó chạy trên object mà các field của con <i>chưa được gán</i> — mọi field tham chiếu còn null, mọi field số còn 0. Một field khai báo <code>private String value = \"hello\";</code> vẫn có thể là null bên trong method được gọi từ constructor cha, và bạn nhận NPE ở nơi trông hoàn toàn vô lý.","<b>Vì sao trình tự lại như vậy.</b> Nó bắt buộc phải như vậy: phần cha của object cần được đưa vào trạng thái hợp lệ trước khi phần con xây tiếp lên trên. Nhưng dynamic dispatch thì không quan tâm object đã xây xong hay chưa — nó luôn chọn bản override. Hai quy tắc đúng riêng lẻ gặp nhau tạo ra cái bẫy này.","<b>Cách phòng tránh.</b> Đừng gọi method có thể override từ constructor; nếu bắt buộc phải gọi thì khai báo method đó <code>final</code>, <code>private</code> hoặc <code>static</code>. Với logic khởi tạo phức tạp, tách ra factory method: <code>new</code> object xong rồi mới gọi <code>init()</code>, để mọi field đã sẵn sàng. Cùng lý do đó, đừng để <code>this</code> rò rỉ ra ngoài trong constructor (đăng ký listener, đưa vào một collection tĩnh, khởi chạy thread) — thread khác có thể nhìn thấy object nửa vời.","<b>Liên hệ với mô hình bộ nhớ.</b> Java bảo đảm rằng các field <code>final</code> được gán trong constructor sẽ hiển thị đúng với mọi thread nhìn thấy object sau khi constructor kết thúc — nhưng bảo đảm này mất hiệu lực nếu <code>this</code> thoát ra ngoài trước khi constructor xong. Vì thế 'không để this rò rỉ' vừa là lời khuyên thiết kế vừa là điều kiện của một bảo đảm ở tầng JVM."],"example":"class Parent {\n    static { System.out.print(\"1\"); }\n    { System.out.print(\"2\"); }\n    Parent() { System.out.print(\"3\"); init(); }\n    void init() { }\n}\n\nclass Child extends Parent {\n    static { System.out.print(\"4\"); }\n    { System.out.print(\"5\"); }\n    private String value = \"hello\";\n    Child() { System.out.print(\"6\"); }\n\n    @Override\n    void init() {\n        System.out.print(\"[value=\" + value + \"]\"); // null!\n    }\n}\n\nnew Child();\n// in ra: 1 4 2 3 [value=null] 5 6\n// static của cha, static của con, rồi instance của cha, rồi instance của con","exampleTitle":"Trật tự khởi tạo và field của con còn null","keyPoints":["Static initializer chạy một lần khi class được khởi tạo, superclass trước, và được JVM bảo đảm thread-safe.","Trình tự instance: super(...) -> instance/field initializer của con -> thân constructor của con.","Method bị override gọi từ constructor cha sẽ thấy field của con chưa được gán (null hoặc 0).","Method gọi từ constructor nên là final, private hoặc static để không bị override.","Không để this rò rỉ khỏi constructor, vì bảo đảm hiển thị của final field phụ thuộc điều đó."],"trap":"Câu hỏi in thứ tự các chữ số khi new một class con. Sai lầm phổ biến là cho rằng instance initializer của con chạy trước constructor của cha; thực tế toàn bộ chuỗi khởi tạo của cha luôn hoàn tất trước.","followUp":["Vì sao holder idiom cho singleton lazy lại thread-safe mà không cần synchronized?","Nếu constructor cha gọi một method final thì bẫy này còn xảy ra không?","Bảo đảm của JMM với final field bị mất trong trường hợp nào?"]},{"id":"t-2-5","topicId":2,"versions":[8,11,17,21],"title":"Hợp đồng equals/hashCode và vì sao composition thường tốt hơn inheritance","summary":"Kế thừa làm vỡ hợp đồng equals theo cách không sửa được, và đó là một trong những lập luận mạnh nhất cho composition.","sections":["<b>Hợp đồng equals gồm năm điều.</b> Phản xạ (<code>a.equals(a)</code>), đối xứng (<code>a.equals(b)</code> thì <code>b.equals(a)</code>), bắc cầu, nhất quán qua nhiều lần gọi, và <code>a.equals(null)</code> luôn false. Kèm theo là ràng buộc với <code>hashCode</code>: hai object bằng nhau bắt buộc phải cùng hashCode; ngược lại thì không bắt buộc. Vi phạm không gây lỗi biên dịch — nó chỉ khiến <code>HashMap</code>, <code>HashSet</code>, <code>List.contains</code>, <code>distinct()</code> cho kết quả sai một cách lặng lẽ.","<b>Cơ chế trong HashMap giải thích vì sao hashCode quan trọng đến thế.</b> <code>get</code> dùng hashCode để chọn bucket rồi mới dùng equals để so trong bucket đó. Nếu override equals mà quên hashCode, hai object bằng nhau rơi vào hai bucket khác nhau và <code>get</code> không bao giờ tìm thấy. Cùng lý do đó, key của map phải bất biến: sửa một field tham gia hashCode sau khi đã put sẽ khiến object nằm sai bucket và gần như không lấy lại được.","<b>Bẫy chữ ký: equals(MyType) là overload chứ không phải override.</b> <code>Object.equals</code> nhận <code>Object</code>; nếu bạn viết <code>public boolean equals(Point p)</code> thì đó là một method mới hoàn toàn. Code vẫn biên dịch, gọi trực tiếp vẫn 'đúng', nhưng mọi collection đều gọi qua <code>equals(Object)</code> nên rơi về so sánh tham chiếu của <code>Object</code>. Chú thích <code>@Override</code> là thứ duy nhất bắt được lỗi này ngay lúc biên dịch.","<b>Kế thừa làm vỡ equals theo cách không có lời giải đẹp.</b> Nếu <code>ColorPoint extends Point</code> và thêm một field màu, bạn buộc phải chọn: dùng <code>instanceof</code> thì <code>point.equals(colorPoint)</code> ra true còn chiều ngược lại ra false — vỡ tính đối xứng; dùng <code>getClass()</code> thì hai object khác class không bao giờ bằng nhau, kể cả khi class con không thêm gì — vỡ nguyên lý thay thế Liskov. Không tồn tại cách nào vừa mở rộng class có state vừa thêm field mà giữ nguyên hợp đồng equals. Đây là lập luận mạnh nhất cho việc thay kế thừa bằng composition: cho <code>ColorPoint</code> chứa một <code>Point</code> làm field và lộ ra method <code>asPoint()</code>.","<b>Fragile base class: kế thừa gắn class con vào chi tiết cài đặt của cha.</b> Ví dụ kinh điển là một class con của <code>HashSet</code> đếm số phần tử đã thêm bằng cách override cả <code>add</code> lẫn <code>addAll</code>; vì <code>addAll</code> của <code>HashSet</code> bên trong tự gọi <code>add</code>, mỗi phần tử bị đếm hai lần. Class con đúng hay sai phụ thuộc vào việc class cha gọi method của chính nó ra sao — một chi tiết không nằm trong hợp đồng và có thể đổi ở bản JDK sau. Composition không có vấn đề này vì mọi lời gọi đều đi qua một API công khai.","<b>Khi nào thì kế thừa vẫn đúng, và các lối thoát hiện đại.</b> Kế thừa hợp lý khi quan hệ đúng nghĩa is-a, class cha được <i>thiết kế</i> để kế thừa (tài liệu hoá rõ method nào gọi method nào, cung cấp các hook <code>protected</code>), và cả hai nằm trong tầm kiểm soát của bạn. Ngoài ra: class không định cho kế thừa nên khai báo <code>final</code>; và từ Java 16 <code>record</code> tự sinh <code>equals</code>/<code>hashCode</code> theo các component và bản thân record là final, nên nó tránh được toàn bộ nhóm vấn đề này — có sẵn ở Java 17 và 21. Sealed class, chuẩn từ Java 17, cho phép giới hạn tập class con để tập hợp phân cấp trở nên đóng và kiểm soát được."],"example":"class Point {\n    final int x, y;\n    Point(int x, int y) { this.x = x; this.y = y; }\n\n    // BẪY: đây là overload, KHÔNG phải override\n    public boolean equals(Point p) { return p.x == x && p.y == y; }\n}\n\nSet<Point> set = new HashSet<>();\nset.add(new Point(1, 1));\nSystem.out.println(set.contains(new Point(1, 1))); // false\n\n// Đúng:\nclass Point2 {\n    final int x, y;\n    Point2(int x, int y) { this.x = x; this.y = y; }\n\n    @Override public boolean equals(Object o) {\n        if (this == o) return true;\n        if (o == null || getClass() != o.getClass()) return false;\n        Point2 p = (Point2) o;\n        return x == p.x && y == p.y;\n    }\n    @Override public int hashCode() { return Objects.hash(x, y); }\n}\n\n// Java 16+ (có ở 17, 21): record tự sinh equals/hashCode và là final\nrecord Point3(int x, int y) { }","exampleTitle":"equals sai chữ ký, equals đúng, và record","keyPoints":["equals phải phản xạ, đối xứng, bắc cầu, nhất quán, và false với null; bằng nhau thì buộc phải cùng hashCode.","HashMap dùng hashCode chọn bucket rồi mới dùng equals — quên hashCode làm get() không bao giờ tìm thấy.","Key của map phải bất biến ở các field tham gia hashCode.","equals(MyType) là overload; chỉ @Override mới bắt được lỗi này lúc biên dịch.","Mở rộng class có state rồi thêm field thì không giữ được đồng thời đối xứng và Liskov — hãy dùng composition.","record (Java 16+, có ở 17 và 21) tự sinh equals/hashCode và là final nên tránh được cả nhóm vấn đề."],"trap":"Người phỏng vấn đưa class có public boolean equals(Point p) rồi hỏi vì sao HashSet.contains trả về false. Trả lời 'vì thiếu hashCode' mới đúng một nửa; nguyên nhân gốc là chữ ký sai nên equals(Object) chưa hề được override.","followUp":["Vì sao không thể vừa giữ tính đối xứng của equals vừa cho class con thêm field?","getClass() và instanceof trong equals đánh đổi điều gì?","Ví dụ HashSet đếm phần tử nói lên điều gì về việc kế thừa một class mà bạn không kiểm soát?"]},{"id":"t-3-1","topicId":3,"versions":[8,11,17,21],"title":"HashMap hoạt động thế nào bên trong","summary":"Bucket, hàm trải hash, treeify và resize — điều thực sự xảy ra mỗi khi bạn gọi put() và get().","sections":["<b>Cấu trúc cơ bản.</b> HashMap giữ một mảng <code>Node[] table</code>, mỗi ô gọi là một bucket. Vị trí bucket được tính bằng <code>(n - 1) &amp; hash</code>, trong đó <code>n</code> là độ dài bảng và luôn là luỹ thừa của 2. Nhờ n là luỹ thừa của 2, phép chia lấy dư được thay bằng một phép AND bit — nhanh hơn nhiều, và đây chính là lý do bạn không bao giờ thấy HashMap có capacity 15 hay 17.","<b>Hash spreading — vì sao không dùng thẳng hashCode().</b> Vì chỉ số bucket chỉ lấy các bit thấp của hash, hai key khác nhau ở bit cao nhưng giống nhau ở bit thấp sẽ đâm vào cùng một bucket. HashMap xử lý bằng <code>h ^ (h &gt;&gt;&gt; 16)</code>: trộn 16 bit cao xuống 16 bit thấp để bit cao cũng góp phần vào chỉ số. Một phép XOR rẻ tiền nhưng giảm đáng kể va chạm với những hashCode phân bố kém.","<b>Xử lý va chạm và treeify (Java 8+).</b> Mỗi bucket ban đầu là một danh sách liên kết. Từ Java 8, khi một bucket đạt 8 node <i>và</i> độ dài bảng đã ít nhất 64, bucket đó chuyển thành cây đỏ-đen, hạ tra cứu trong bucket từ O(k) xuống O(log k). Chi tiết hay bị bỏ sót: nếu bảng còn nhỏ hơn 64, HashMap chọn <b>resize</b> thay vì treeify, vì bảng quá nhỏ mới là nguyên nhân thật của va chạm. Khi cây co lại còn khoảng 6 node, nó quay về danh sách.","<b>Resize và load factor.</b> Ngưỡng threshold = capacity × loadFactor, mặc định 0.75. Khi size vượt threshold, bảng nhân đôi và mọi entry được phân bổ lại. Vì capacity nhân đôi, mỗi entry chỉ có đúng hai khả năng: ở lại chỉ số cũ, hoặc chuyển tới chỉ số cũ cộng capacity cũ — Java 8 tận dụng điều này để tách mỗi bucket thành hai danh sách mà không phải tính lại hash.","<b>Khác biệt Java 7 và Java 8 khi resize.</b> Java 7 chèn vào đầu danh sách khi chuyển entry, nên thứ tự bị đảo, và khi nhiều thread cùng resize có thể tạo ra vòng lặp trong danh sách liên kết khiến <code>get()</code> quay 100% CPU vô hạn. Java 8 giữ nguyên thứ tự tương đối khi tách bucket nên không còn lỗi đó — nhưng HashMap vẫn <b>không</b> thread-safe, dùng sai vẫn mất dữ liệu và vẫn có thể hỏng cấu trúc.","<b>Định cỡ ban đầu là tối ưu rẻ nhất.</b> Nếu biết trước số phần tử, khởi tạo <code>new HashMap&lt;&gt;((int)(n / 0.75f) + 1)</code> để tránh nhiều lần resize (mỗi lần resize là một lượt duyệt lại toàn bộ entry). Constructor làm tròn lên luỹ thừa của 2 gần nhất, nên truyền 1000 thực tế cho bảng 1024 ô."],"example":"Map<String, Integer> m = new HashMap<>(16);\nm.put(\"a\", 1);\n\n// Khái niệm cách định vị bucket:\n// int h     = key.hashCode();\n// int hash  = h ^ (h >>> 16);          // trải bit cao xuống bit thấp\n// int index = (table.length - 1) & hash;\n\n// threshold = 16 * 0.75 = 12  -> phần tử thứ 13 kích hoạt resize lên 32\n\n// Biết trước ~1000 phần tử thì định cỡ luôn:\nMap<String, Integer> sized = new HashMap<>((int) (1000 / 0.75f) + 1);","exampleTitle":"Định vị bucket và định cỡ ban đầu","keyPoints":["Chỉ số bucket = (n-1) & hash, n luôn là luỹ thừa của 2 nên dùng AND bit thay cho phép chia dư","h ^ (h >>> 16) trộn bit cao xuống bit thấp để hashCode phân bố kém không dồn hết vào một bucket","Treeify cần đồng thời hai điều kiện: bucket đạt 8 node VÀ bảng có ít nhất 64 ô; bảng nhỏ hơn thì resize thay vì treeify","Load factor mặc định 0.75; vượt threshold thì bảng nhân đôi và phân bổ lại toàn bộ entry","Java 8 sửa lỗi vòng lặp danh sách khi resize đồng thời của Java 7, nhưng HashMap vẫn không thread-safe"],"trap":"Nói 'HashMap luôn O(1)' mà không nêu điều kiện. Nếu hashCode dồn hết vào một bucket, tra cứu tụt xuống O(n) ở Java 7 và O(log n) ở Java 8 nhờ treeify — mà treeify chỉ xảy ra khi bảng đã đủ lớn (>= 64 ô).","followUp":["Vì sao capacity của HashMap bắt buộc là luỹ thừa của 2?","Truyền new HashMap<>(1000) thì độ dài bảng thực tế là bao nhiêu?","Vì sao Java 8 đổi từ chèn đầu sang giữ thứ tự khi resize?","Đặt load factor 1.0 thì được gì và mất gì?"]},{"id":"t-3-2","topicId":3,"versions":[8,11,17,21],"title":"Hợp đồng equals/hashCode và vì sao key phải bất biến","summary":"Vi phạm hợp đồng không làm chương trình crash — nó làm dữ liệu biến mất một cách im lặng.","sections":["<b>Hợp đồng.</b> Nếu <code>a.equals(b)</code> thì bắt buộc <code>a.hashCode() == b.hashCode()</code>. Chiều ngược lại KHÔNG bắt buộc: hai object khác nhau hoàn toàn được phép trùng hashCode (đó chỉ là va chạm, hoàn toàn hợp lệ). Ngoài ra equals phải phản xạ, đối xứng, bắc cầu và nhất quán qua nhiều lần gọi.","<b>Vi phạm chiều nào gây hậu quả gì.</b> Override <code>equals</code> mà quên <code>hashCode</code>: hai object 'bằng nhau' rơi vào hai bucket khác nhau nên HashSet chứa cả hai và <code>HashMap.get()</code> trả về null dù key logic giống hệt. Ngược lại, override <code>hashCode</code> mà quên <code>equals</code> thì chúng vào cùng bucket nhưng vẫn bị coi là khác nhau — chậm hơn, kết quả vẫn sai theo cách dễ nhận ra hơn.","<b>Mutate key sau khi đã put.</b> Đây là bẫy hay được hỏi nhất. HashMap lưu sẵn giá trị hash của key trong node. Nếu bạn sửa field tham gia hashCode sau khi put, lần <code>get()</code> sau sẽ tính ra bucket MỚI trong khi entry vẫn nằm ở bucket CŨ — không tìm thấy. Tệ hơn, entry đó cũng không remove được nữa: nó chiếm chỗ vĩnh viễn cho tới khi cả map bị thu hồi.","<b>Vì sao key nên bất biến.</b> Bất biến là cách duy nhất đảm bảo hashCode không đổi trong suốt vòng đời entry. Đó là lý do <code>String</code>, <code>Integer</code>, <code>LocalDate</code>, <code>enum</code>, <code>UUID</code> là những key lý tưởng. Nếu buộc phải dùng object nghiệp vụ, chỉ đưa vào equals/hashCode những field không bao giờ đổi — thường là id.","<b>Record (Java 16, có trong LTS 17 và 21).</b> Record tự sinh equals/hashCode dựa trên tất cả component nên rất tiện làm key — nhưng chỉ an toàn khi mọi component bản thân nó cũng bất biến. Record chứa một <code>List</code> mutable hoặc một mảng vẫn hỏng: với mảng, equals sinh ra dùng so sánh tham chiếu chứ không so sánh nội dung.","<b>TreeMap không dùng equals.</b> Với TreeMap/TreeSet, hai key được coi là trùng khi <code>compareTo</code> (hoặc Comparator) trả về 0, hoàn toàn bỏ qua equals. Nếu thứ tự không 'consistent with equals', cùng một tập dữ liệu sẽ cho kết quả khác nhau giữa HashMap và TreeMap. Ngoài ra TreeMap với thứ tự tự nhiên ném NullPointerException khi put key null, còn HashMap thì chấp nhận đúng một key null."],"example":"class Key {\n    int id;\n    Key(int id) { this.id = id; }\n\n    @Override public boolean equals(Object o) {\n        return o instanceof Key && ((Key) o).id == this.id;\n    }\n    @Override public int hashCode() { return id; }\n}\n\nMap<Key, String> map = new HashMap<>();\nKey k = new Key(1);\nmap.put(k, \"one\");\n\nk.id = 2;                                  // mutate key ĐANG nằm trong map\n\nSystem.out.println(map.get(k));            // null - hash mới trỏ sang bucket khác\nSystem.out.println(map.get(new Key(1)));   // null - đúng bucket nhưng equals thất bại\nSystem.out.println(map.size());            // 1    - entry kẹt lại, không lấy ra được","exampleTitle":"Entry bị 'kẹt' sau khi mutate key","keyPoints":["equals bằng nhau thì hashCode phải bằng nhau; hashCode bằng nhau không bắt buộc equals bằng nhau","Override equals mà quên hashCode làm HashMap.get() trả null dù key logic giống hệt","HashMap cache hash trong node, nên mutate key sau khi put khiến entry không tìm được và không xoá được","Chỉ đưa vào equals/hashCode những field bất biến, thường là id","TreeMap so key bằng compareTo chứ không bằng equals, và ném NPE với key null khi dùng thứ tự tự nhiên"],"trap":"Cho rằng mutate key rồi thì get() sẽ trả về giá trị cũ hoặc ném exception. Thực tế nó lặng lẽ trả null, size vẫn là 1, và bug này thường chỉ lộ ra sau nhiều tháng dưới dạng 'dữ liệu tự nhiên mất'.","followUp":["Nếu hashCode() luôn trả về hằng số 42 thì HashMap còn chạy đúng không, và chạy nhanh thế nào?","Vì sao equals cần tính đối xứng, và kế thừa phá vỡ nó ở đâu?","HashMap chấp nhận bao nhiêu key null, và key null nằm ở bucket nào?"]},{"id":"t-3-3","topicId":3,"versions":[8,11,17,21],"title":"Fail-fast iterator và ConcurrentModificationException","summary":"Vì sao xoá phần tử trong for-each có lúc nổ, có lúc lại im lặng chạy sai.","sections":["<b>Cơ chế modCount.</b> Các collection <i>có thể sửa đổi</i> trong <code>java.util</code> giữ một bộ đếm <code>modCount</code>, tăng lên mỗi khi cấu trúc thay đổi (add, remove, clear — không tính set). Ngoại lệ đáng nhớ là nhóm bất biến <code>List.of</code>/<code>Set.of</code>/<code>Map.of</code>: chúng không có <code>modCount</code> nào cả, đơn giản vì không có cách nào sửa cấu trúc của chúng để mà đếm. Khi tạo iterator, nó chụp lại giá trị đó vào <code>expectedModCount</code>. Mỗi lần gọi <code>next()</code>, iterator so hai số; lệch nhau là ném <code>ConcurrentModificationException</code>.","<b>Đây không phải lỗi đa luồng.</b> Tên gọi gây hiểu nhầm rất nhiều: CME xảy ra phổ biến nhất trong code đơn luồng, khi bạn xoá phần tử ngay trong vòng for-each. For-each chỉ là cú pháp đường cho iterator, nên nó chịu đúng ràng buộc của iterator.","<b>Fail-fast là best-effort, không phải đảm bảo.</b> Iterator chỉ kiểm tra trong <code>next()</code>, còn <code>hasNext()</code> của ArrayList chỉ so <code>cursor != size</code>. Vì vậy khi bạn xoá phần tử <i>áp chót</i>, size giảm đúng bằng cursor, hasNext() trả false, vòng lặp kết thúc êm ru và CME không bao giờ được ném. Javadoc nói rõ: đừng viết code phụ thuộc vào ngoại lệ này để bắt lỗi — nó chỉ dùng để phát hiện bug.","<b>Cách xoá đúng.</b> Dùng <code>Iterator.remove()</code> (nó tự đồng bộ lại expectedModCount) hoặc <code>Collection.removeIf(predicate)</code> có từ Java 8. <code>removeIf</code> trên ArrayList còn hiệu quả hơn hẳn vòng lặp thủ công vì nó đánh dấu trước rồi dồn mảng một lần, thay vì gọi <code>System.arraycopy</code> cho mỗi lần xoá.","<b>Đối lập: iterator weakly consistent.</b> <code>ConcurrentHashMap</code>, <code>CopyOnWriteArrayList</code>, <code>ConcurrentLinkedQueue</code> không ném CME. Chúng cho phép duyệt song song với sửa đổi, đổi lại bạn nhận một ảnh chụp 'gần đúng': có thể thấy hoặc không thấy phần tử được thêm sau khi iterator ra đời, nhưng không bao giờ thấy phần tử hai lần hay thấy trạng thái hỏng.","<b>Bẫy với Map.</b> Trong vòng lặp trên <code>map.keySet()</code> hay <code>map.entrySet()</code>, gọi <code>map.put(keyMoi, v)</code> hoặc <code>map.remove(k)</code> đều làm modCount tăng. Chỉ có <code>entry.setValue(v)</code> và <code>map.put</code> lên key ĐÃ tồn tại là an toàn, vì chúng không đổi cấu trúc."],"example":"List<String> list = new ArrayList<>(Arrays.asList(\"a\", \"b\", \"c\", \"d\"));\n\n// SAI: ném ConcurrentModificationException\n// for (String s : list) {\n//     if (s.startsWith(\"a\")) list.remove(s);\n// }\n\n// ĐÚNG 1: iterator tự quản lý expectedModCount\nIterator<String> it = list.iterator();\nwhile (it.hasNext()) {\n    if (it.next().startsWith(\"a\")) it.remove();\n}\n\n// ĐÚNG 2: gọn hơn và nhanh hơn trên ArrayList (Java 8+)\nlist.removeIf(s -> s.startsWith(\"b\"));\n\n// Trên Map: sửa value thì an toàn, thêm/xoá key thì không\nMap<String, Integer> m = new HashMap<>();\nfor (Map.Entry<String, Integer> e : m.entrySet()) {\n    e.setValue(e.getValue() + 1);      // OK, không đổi cấu trúc\n}","exampleTitle":"Ba cách xoá và ranh giới an toàn","keyPoints":["modCount tăng khi cấu trúc đổi; iterator so với expectedModCount trong next() và ném CME khi lệch","CME chủ yếu là lỗi đơn luồng do xoá trong for-each, không phải lỗi đa luồng","Xoá phần tử áp chót của ArrayList thì hasNext() trả false trước khi next() kịp kiểm tra — không ném CME nhưng vẫn sai logic","Dùng Iterator.remove() hoặc removeIf(); removeIf trên ArrayList dồn mảng một lần nên nhanh hơn","ConcurrentHashMap và CopyOnWriteArrayList dùng iterator weakly consistent nên không bao giờ ném CME"],"trap":"Tin rằng 'không ném CME nghĩa là code đúng'. Fail-fast là best-effort; trường hợp xoá phần tử áp chót chạy trót lọt nhưng bỏ sót phần tử cuối, và bug lặng lẽ đi vào production.","followUp":["Vì sao removeIf nhanh hơn vòng lặp gọi list.remove() nhiều lần?","Iterator weakly consistent của ConcurrentHashMap đảm bảo những gì và không đảm bảo những gì?","Trong for-each trên entrySet, thao tác nào an toàn và thao tác nào làm tăng modCount?"]},{"id":"t-3-4","topicId":3,"versions":[8,11,17,21],"title":"ArrayList vs LinkedList: bảng độ phức tạp nói dối như thế nào","summary":"Vì sao LinkedList gần như luôn thua trong thực tế dù bảng Big-O trông có vẻ ngang ngửa.","sections":["<b>Cấu trúc bộ nhớ.</b> ArrayList là một mảng <code>Object[]</code> liên tục: các tham chiếu nằm sát nhau, CPU nạp một cache line là có sẵn nhiều phần tử kế tiếp. LinkedList là chuỗi node rời rạc, mỗi node là một object riêng chứa item cùng hai con trỏ prev/next — nằm rải rác khắp heap. Đây mới là khác biệt quyết định, không phải Big-O.","<b>Chi phí bộ nhớ.</b> Một phần tử trong ArrayList tốn đúng một ô tham chiếu (4 hoặc 8 byte tuỳ compressed oops). Một node LinkedList tốn header object cộng ba tham chiếu, thường khoảng 24–40 byte cho mỗi phần tử. Với danh sách vài triệu phần tử, chênh lệch là hàng trăm MB và thêm áp lực rất lớn lên GC vì có thêm hàng triệu object nhỏ.","<b>Big-O đúng nhưng gây hiểu nhầm.</b> LinkedList chèn/xoá là O(1) <i>khi bạn đã cầm sẵn node</i>, tức khi đang duyệt bằng iterator. Còn <code>list.add(i, x)</code> hay <code>list.get(i)</code> vẫn phải đi từ đầu (hoặc từ cuối, tuỳ i gần bên nào) nên là O(n). Ngược lại, việc dịch mảng của ArrayList tuy là O(n) nhưng thực hiện bằng <code>System.arraycopy</code> — một intrinsic được JIT dịch thành lệnh copy khối, nhanh hơn nhiều lần so với việc nhảy con trỏ qua n node rải rác.","<b>Chiến lược tăng trưởng của ArrayList.</b> Khi đầy, ArrayList cấp mảng mới với capacity <code>old + (old &gt;&gt; 1)</code>, tức khoảng 1.5 lần, rồi copy sang. Vì tăng theo cấp số nhân nên chi phí amortized của <code>add()</code> vẫn là O(1). Với constructor không tham số, mảng nội bộ khởi tạo rỗng và chỉ nở lên 10 ở lần add đầu tiên (JDK-7143928: tối ưu này thực sự vào JDK 8 và được backport về 7u40, nên nói &quot;từ Java 7&quot; chỉ là cách nói tắt, bản 7 GA chưa có) — nên tạo hàng triệu list rỗng không tốn bộ nhớ vô ích.","<b>Khi nào LinkedList thắng — và câu trả lời thường là không.</b> Trường hợp hợp lý còn lại là hàng đợi hai đầu, nhưng ngay cả khi đó <code>ArrayDeque</code> vẫn nhanh hơn vì dùng mảng vòng. Chính tác giả của Java Collections Framework từng nói ông không nghĩ ai nên dùng LinkedList. Câu trả lời an toàn trong phỏng vấn: mặc định ArrayList, dùng ArrayDeque cho queue/stack, và chỉ đổi khi có số đo cụ thể.","<b>Java 21 — SequencedCollection.</b> JEP 431 bổ sung <code>SequencedCollection</code> với <code>getFirst()</code>, <code>getLast()</code>, <code>addFirst()</code>, <code>addLast()</code>, <code>reversed()</code> cho List, Deque, LinkedHashSet, LinkedHashMap. Trước đó mỗi kiểu có một cách gọi riêng (<code>list.get(0)</code> so với <code>deque.g
